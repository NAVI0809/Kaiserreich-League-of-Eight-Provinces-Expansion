 VIN_dong_bac: "东北"
 VIN_The_Night_Belongs_to_Us_idea: "夜晚属于我们"
 VIN_The_Night_Belongs_to_Us: "夜晚属于我们"
 VIN_The_Night_Belongs_to_Us_desc: "敌人可能会用他们的炮兵和飞机控制战场，但在太阳下山后他们就不再拥有这些优势，他们将会意识到夜晚属于我们。"
 VIN_Peoples_Air_Defence_idea: "人民防空军"
 VIN_Peoples_Air_Defence_idea_desc: "印度支那建立了强大的防空阵地网络，并开始优先生产新的防空装备。印度支那的天空将越来越安全。"

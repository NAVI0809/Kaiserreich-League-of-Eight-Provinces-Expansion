 VIN_guide: "§M新越革命党§!（$totalist_coloured$）\n£white_dot 完成国策§Y国民议会§!。\n£white_dot 在该国策完成前，让§o新越革命党§!的支持率高于30%。\n\n§M革命会§!（$syndicalist_coloured$）\n£white_dot 完成国策§Y国民议会§!。\n£white_dot 在该国策完成前，让§r印度支那革命会§!的支持率高于30%。\n\n§M高望秘会§!（$radical_socialist_coloured$）\n£white_dot 完成国策§Y国民议会§!。\n£white_dot 在该国策完成前，让§R高望秘会§!的支持率高于30%。\n\n§M国民党§!（$radical_socialist_coloured$）\n£white_dot 在事件“印度支那独立宣言”中，选择“温和的宣言”，完成国策§Y反渗透行动§!后，选择“我们必须加大对情报方面的投入”。\n §C注意：§!选择这些选项中的任何一个都不会使你离开本路线，但在某些事件中选择其他选项则有可能导致你跳到其他路线。\n£white_dot 完成国策§Y国民议会§!。\n£white_dot 在该国策完成前，让§S越南国民党§!的支持率高于30%。如果成功，越南国民党会变为$radical_socialist_coloured$，高望秘会则会变为$social_democrat_coloured$，党派支持率也将相应迁移。\n£white_dot 如果“社会主义反对派”事件触发了，选择“也许我们不该这么做”来避免社会主义者起义。\n\n§M国民党军事戒严§!（$authoritarian_democrat_coloured$/$paternal_autocrat_coloured$）\n£white_dot 按上述步骤让§S越南国民党§!上台。\n£white_dot 完成国策§Y训政§!或§Y鼓励创业精神§!，不要处于战争，并让§o新越革命党§!、§r印度支那革命会§!或§S高望秘会§!的支持率高于20%。保持这个状态5个月，“社会主义反对派”事件将会触发，选择“无视他们”。\n£white_dot 大约2个月后，社会主义者将会起义，让国民党的支持率高于40%，才能选择让阮平将军宣布军事戒严的选项。\n£white_dot 大约1个月后，事件“结束戒严？”将会触发，选择继续戒严。\n£white_dot 几天后，一个事件将会触发，你可以选择维持§a文官政府§!还是建立§P军政府§!。"

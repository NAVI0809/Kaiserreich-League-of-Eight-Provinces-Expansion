 VIN_FORPOL: "£KR_game_rule_flag_INC_soc  印度支那外交政策"
 VIN_vietminh: "越盟"
 VIN_vietminh_desc: "越南独立同盟会，或简称“越盟”，是由一群要求越南独立的激进组织组成的联合政府。各派都提倡保持民众的团结，但是每个派系的纲领则大相庭径，这极大阻碍了该组织的执行力。此外，一些高棉和老挝的成员对组织的名字有一些不满……"
 VIN_Guerilla_Tradition: "游击传统"
 VIN_Guerilla_Tradition_desc: "尽管认为印度支那人都是天生的游击队战士这个看法是错误的，但是这个国家的地形十分适合进行游击战。而且这个国家的人民有持续了上千年的游击传统。"
 VIN_poor_army_idea_1: "无组织的军队"
 VIN_poor_army_idea_1_desc: "我们新组建的革命军虽然在保卫祖国上有足够的热情，但他们的训练不足，装备参差不齐。我们需要采取一定的措施将他们的热情变为战斗精神。"
 VIN_apathetic_people_idea_1: "麻木不仁的人民"
 VIN_apathetic_people_idea_1_desc: "尽管近期在印度支那的农村地区，革命热情十分高涨，但是大多数人仍对革命漠不关心。到头来，我们需要采取大量措施让人民加入到革命中并为国家的未来而奋斗。"
 VIN_internationale_support: "国际支援"
 VIN_internationale_support_desc: "印度支那革命得到了来自第三国际的大量秘密支援。来自法国的印度支那裔大战老兵和流亡革命者是革命军的支柱。"
 VIN_Edu_Reform_idea_1: "教育改革"
 VIN_Edu_Reform_idea_1_desc: "德国殖民者除了香肠什么都没有带来。数百万我们的同胞仍是文盲。为了减少文盲率，我们需要去汉字化，并推行基于拉丁字母的标准化文字系统，这将让识字变得更加容易。尽管这会切断我们与传统的联系，但我们别无选择。"
 VIN_Edu_Reform_idea_2: "教育改革"
 VIN_Edu_Reform_idea_2_desc: "$INC_Edu_Reform_idea_1_desc$由于扫盲运动，现在许多农民可以阅读我们的宣传并获得现代科学的基本知识，尤其是在农业和卫生方面。"
 VIN_Trade_Unionism_idea_1: "工会化"
 VIN_Trade_Unionism_idea_1_desc: "工会是工团主义经济体系的主体。由于缺乏足够的发展和欧洲帝国主义的殖民压迫，工会在印度支那是很少见的。印度支那政府推动工会发展的努力已经部分成功：大部分印度支那的主要城市的大多数工人现在都加入了工会。"
 VIN_Trade_Unionism_idea_2: "进一步工会化"
 VIN_Trade_Unionism_idea_2_desc: "工会是工团主义经济体系的主体。由于缺乏足够的发展和欧洲帝国主义的殖民压迫，工会在印度支那是很少见的。然而，随着印度支那的快速工业化以及工会的广泛存在，印度支那军队已经加深与工团的关系，并增加了军备的生产效率。"
 VIN_Trade_Unionism_idea_3: "没有印度支那特色的工团主义"
 VIN_Trade_Unionism_idea_3_desc: "曾经被殖民主义拖累的印度支那已经成为东南亚的工团主义灯塔。印度支那经济的全部已经被工会支持的工人工团接管。"
 VIN_Left_Unity_idea: "左翼团结"
 VIN_Left_Unity_idea_desc: "印度支那的社会主义党派已经抛开了分歧并达成了共享权力的协议。随着印度支那左翼的统一，这将使印度支那政府更加强大。"
 VIN_Peoples_Soviet_idea_1: "先锋党"
 VIN_Peoples_Soviet_idea_1_desc: "先锋党通过政治教育和意识形态灌输巩固政权。"
 VIN_Peoples_Soviet_idea_2: "先锋党"
 VIN_Peoples_Soviet_idea_2_desc: "党内先进分子承担向大众普及政治教育，人民通过代表会议实行自己的权力。"
 VIN_Partys_Soviet_idea_1: "先锋党"
 VIN_Partys_Soviet_idea_1_desc: "先锋党通过无处不在的党组织牢牢的控制着政权。"
 VIN_Partys_Soviet_idea_2: "先锋党"
 VIN_Partys_Soviet_idea_2_desc: "$INC_Partys_Soviet_idea_1_desc$ 党的统治通过强大的秘密警察组织维护。"
 VIN_Democratic_Centralism_idea: "民主集中制"
 VIN_Militarism_idea: "印度支那军事主义"
 VIN_Militarism_idea_desc: "提升军队建设的优先度和军事训练水平已经成为印支政策极其重要的一部分。征兵数额和侵略主义言论可能将会大幅增加。"
 VIN_Greater_Harmony_idea: "天下大同"
 VIN_Encourage_Entrepreneurship_idea: "鼓励创业精神"
 VIN_DAI_VIET_SPIRIT: "大越南主义"
 VIN_rev_spontaneity_idea: "自发革命"
 VIN_rev_spontaneity_idea_desc: "“自发性”原则，即任何政府的行为必须不能违反人民的意志。这一原则已经被加入印度支那的宪法。"
 VIN_secret_societies_idea_A_1: "印度支那极端现代主义"
 VIN_secret_societies_idea_B_1: "印度支那多元主义"
 VIN_International_Devision_of_Labor_idea: "国际分工"
 VIN_Self_Reliance_idea_2: "加速工业化"
 VIN_Youth_Shock_Brigade_idea: "青年突击旅"
 VIN_Youth_Shock_Brigade_idea_desc: "许多印度支那青年，特别是女性，在特殊的非作战部队中服役，执行各种后勤任务，包括运送受伤的士兵。这大大减少了印度支那军队中的伤亡，大部分伤兵很快就返回军队。"
 VIN_Youth_Shock_Brigade_idea_x: "女性士兵"
 VIN_Youth_Shock_Brigade_idea_x_desc: "许多印度支那青年，特别是女性，在特殊的非作战部队中服役，执行各种后勤任务，包括运送受伤的士兵。这大大减少了印度支那军队中的伤亡，大部分伤兵很快就返回军队。我们现在开始正式从经验丰富的青年突击旅和本地民兵中招募女性士兵。"
 VIN_Tunnel_idea_1: "地道网络"
 VIN_Tunnel_idea_1_desc: "印度支那已经在全国大部分地区内建设了复杂的隧道网络。这些十分隐蔽的隧道服务于各种军事目的。"
 VIN_Tunnel_idea_2: "胡志明小道"
 VIN_Tunnel_idea_2_desc: "胡志明小道是一个通过印度支那被森林覆盖的高地的复杂补给网络。即使是在印度支那最偏远的地区，士兵也能轻松获取足够的补给。"
 VIN_Tiger_and_Elephant_idea: "虎与象"
 VIN_Tiger_and_Elephant_idea_desc: "即使面对最恶劣的地形条件，印度支那的军队也十分灵敏。如果一只老虎只知道和一头象正面硬碰硬，那么它只有死路一条。但是如果它利用自己的敏捷，他将有机会击倒更大的敌人。"
 VIN_Guerilla_in_the_Air_idea: "空中游击队"
 VIN_Tank_Pannick_idea: "装甲恐慌"
 VIN_Tank_Pannick_idea_desc: "印度支那游击队与德国装甲部队的惨烈遭遇战使得大量士兵士气低下，甚至偶尔导致部队溃逃。"

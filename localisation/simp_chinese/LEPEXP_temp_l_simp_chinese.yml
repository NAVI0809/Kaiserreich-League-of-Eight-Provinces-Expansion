 VIN_pho_duc_chinh: "傅德政"
 VIN_pho_duc_chinh_leader_desc: "§Y生于：§!§L1907年；印度支那联邦、东京保护国兴安省§!\n§Y背景：§!§L傅德政出身贫穷家庭，是家里四兄弟中年龄最小的一位。出生后不久，傅德政家被迫前往北江省谋生，但他还是吵着要接受教育。在小学和中学，他都表现良好，最终被河内的“公共工程学院”录取。在这里，他接触到了未来组建越南国民党的核心——阮太学和南同书社。1926年12月，越南国民党成立，他迅速在党内步步高升。他先是担任组织委员会主席，负责用地下手段进行宣传和资金筹集等工作，随后，党内派系斗争越发严重，由于对阮太学的忠诚，他于1928年被提升为党的副主席。\n\n傅德政一向谦逊，被誉为阮太学的左膀右臂，以及亲密顾问。阮太学主席热情奔放、侃侃而谈，作为副主席，傅德政则因谨慎务实的政治家形象而声名在外，管理着党务机构的秘密运作。他并未发展出阮太学那样的个人崇拜，但对于明白他贡献的人来说，他就是越南国民党的“权力和美德”。\n\n如今，在外国革命势力的邀请下，傅德政升任越南的国家领袖，由于越南革命一度失败，阮太学失去了领导地位，他的遗产也已经一塌糊涂，人们认为，在这至暗时刻，要重建国民党乃至越南，非默默付出、为党奠基的傅德政不可。§!"
 VIN_nguyen_binh_leader_desc: "§Y生于：§!§L1908年7月30日；印度支那联邦、东京保护国兴安省§!\n§Y背景：§!§L阮方草更为人所知的名字是“阮平”，这是他三十年代革命生涯达到顶峰时取的化名。他原是海防港的一名卑微水手，二十年代，朋友陈辉燎介绍他加入了越南国民党，由于能够随船出海，他开始在河内、西贡和广州的党组织之间传递消息。在中国期间，他曾跟随黄埔学生军和第三国际军事顾问团学习，进步神速。三十年代初，他被派回南圻，加入了当地的越盟游击队，并被推举为指挥官。从此，他便以“阮平”的名义在南方活动，由于曾被德军手榴弹破片击中，失去了一只眼睛，他获得了“独眼将军”的称号。因此，为了遮挡伤口，他总是戴着玻璃做的假眼，还时常戴着眼镜。\n\n无论在军事还是政治上，阮平都是个狂热而激进的人，他一直坚持认为，越南国民党的部队应该尽快由乌合之众式的游击队转型为正规的“人民军”，就像英法军队和中国的国民革命军那样。在政治上，他与陈辉燎领导着国民党内的“强学书社”，他们主张将国民党改造为革命共产主义政党，它的理论基础不能仅仅是三民主义，还要包含马克思主义；此外，他们也深受索雷尔主义和中华复兴社的影响。由于阮平的个人魅力，以及他在军队中的强大势力，该派在国内颇有影响。§!"
 VIN_power_and_virtue: "力量与美德"
 VIN_General_Van_Tien_Dungs_Reform: "总参谋部军改计划"
 VIN_General_Van_Tien_Dungs_Reform_desc: "还处在婴儿期的印度支那人民军需要改革。总参谋部主张以精心策划的突袭攻势作为基础学说。凭借缜密的计划，大规模渗透以及现代化军备，印度支那的军队将能同时从多个方向发动进攻并奇袭敌人，打乱其编制。"
 VIN_General_Nguyen_Chi_Thanhs_Reform: "总政治部军改计划"
 VIN_General_Nguyen_Chi_Thanhs_Reform_desc: "还处在婴儿期的印度支那人民军需要改革。军队总政治部认为，人的意志是胜利的关键。印度支那士兵的勇气和坚韧是我们最强大的武器。我们将进行长时间的游击战以击倒我们的敌人，并在他们疲惫不堪，士气低落时突袭他们。"
 VIN_Workers_Council: "工人委员会"
 VIN_Workers_Council_desc: "工农兵苏维埃是由伟大的俄国革命者发明的一种新式民主结构。在俄国革命失败后这一实验便宣告终结。我们可以在地方以及国家层面建立这种委员会，更好地改造现有的民主制度。"

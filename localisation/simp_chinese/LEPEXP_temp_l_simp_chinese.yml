 VIN_siamese_exile_trait_desc: "§L一位内战失败后被迫逃离暹罗的军事领导人。他们对社会主义理想的忠诚使他们为第三国际服务，也许他是想着将暹罗的反动势力赶出祖国赚取最微小的机会。§!"
 VIN_DDQDD_long: "東洋國民黨(Dong Duong Quoc dan Dang)"
 VIN_Vietnamisation: "越南化"
 VIN_Vietnamisation_desc: "印度支那的独立斗争主要由英雄的越南民族主导。如果我们的国家要真正统一起来，那么优越的越南文化必须在整个国家推广。这是我们的开化使命，将作为仙女和龙的后代越南人的伟大文明，传播到整个印度支那！"
 VIN_Join_Co_Prosperity_Sphere: "加入共荣圈"
 VIN_Join_Co_Prosperity_Sphere_desc: "我们在东京的同胞建立了一个亚洲国家的新组织，致力于共同抵抗和减少西方在该地区的影响力。虽然有些人可能会反对说，这个组织不过是一个日本傀儡国家的联盟，但通过加入这个组织我们可以一劳永逸地远离西方帝国主义。"

 city_capture_events.313.t: "帝都的陷落"
 city_capture_events.313.desc: "自古至今，摩洛哥有四座城市始终是历代都城所在：非斯、马拉喀什、梅克内斯与拉巴特。千年之间王朝更迭、国祚兴废，这四座「帝都」却始终是摩洛哥社会与文化的中心。\n\n近年以来，这些城市却沦为政争与动乱的渊薮。今日，积弊终于到了总清算的时刻：[city_capture_events_313_imperial_cities_captured]，[FROM.GetAdjective]军已控制中摩洛哥大部。[city_capture_events_313_casablanca_captured]"
 city_capture_events.313.a: "上一次发生这种事，一位苏丹被推翻了！"
 city_capture_events.313.b: "经此一役，马格里布的命运已成定局。"
 city_capture_events.313.c: "就像1907年那样。"
 city_capture_events_313_imperial_cities_captured_fez: "非斯已陷落"
 city_capture_events_313_imperial_cities_captured_meknes: "梅克内斯已陷落"
 city_capture_events_313_imperial_cities_captured_fez_meknes_marrakesh: "非斯、梅克内斯与马拉喀什均已陷落"
 WAR_NAME_GEA_VIN: "$ORDER$印度支那战争"
 afghanistan_events.456.c: "[RUS.GetNameDefCap]显然是资助者的不二之选。"
 afghanistan_events.456.e: "[PER.GetNameDef]的兄弟会来援助我们。"
 afghanistan_events.456.f: "[CHN.GetNameDefCap]似乎注定要领导东方社会主义。"
 afghanistan_events.456.g: "我们必须求助于[INT.GetNameDef]，请他们带路。"
 afghanistan_foreign_policy_events.25.t: "抵御来犯"
 afghanistan_foreign_policy_events.25.d: "即便有盟友撑腰，要从四周的占领者手中夺回故土也绝非易事；孤军作战更是几无可能。然而我们如今正置身于这般绝境——以我辈孤悬之势，列强是否愿意、甚至是否有能力派兵来援，实在难以指望。\n\n显然，我们必须把有限的力量用在刀刃上，可究竟该往何处使力，才是真正的问题。"
 afghanistan_foreign_policy_events.25.a: "我们要让他们看看反抗的愚蠢！"
 afghanistan_foreign_policy_events.25.b: "胜负系于后方，集中力量生产枪械。"
 afghanistan_foreign_policy_events.25.c: "我们必须榨出最后一点资源。"
 CHI_VIN_liberation_army_decision: "解放印度支那诸民族"
 CHI_VIN_liberation_army_decision_desc: "大战中法国战败之后，印度支那便作为战利品落入德国的军靴之下。我们与当地反帝武装素有往来，如今我军既已开入此地，就必须格外留意，让我们被看作解放者，而不是又一批占领者。\n\n不过，这话说起来容易，做起来难。"

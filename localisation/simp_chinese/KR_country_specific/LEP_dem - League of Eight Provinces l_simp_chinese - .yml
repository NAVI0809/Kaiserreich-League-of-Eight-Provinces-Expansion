 LEP_popular_support_5: "三色民主：§G全国政府§!"
 LEP_popular_support_5_desc: "南京政府虽历经风雨与战乱，然疆域已逐渐拓展至南北诸省，民众对新生政权的认同正悄然累积。昔日割据与反叛之势犹存，但共和国以稳健的施政与实际建设，逐步展现其执掌天下的能力。合法性并非口号所能奠定，而在于长久的治理与民心的认可。国家尚需继续建设、施政谨慎，但共和国正沿着正确轨道行进，前途可期。"
 LEP_popular_support_desc: "纵南京政府立志以共和与法治安定江浙，复兴民生于南方诸省，然理想远未成型，建国之路阻且长。八省内战余波未平，地方军阀、残余派系、工商势力错综复杂，民众对新政府的信任尚浅。虽设立临时国会、实行温和改革，但治理之艰难远超想象。要使全国人民认同华东政权的正统，不可仅凭豪言誓语或庆典仪式，而必须以持续的国家建设、稳健的施政和耐心的治理赢得民心。许多人仍怀疑政府是纸面共和，或是商业与军阀的妥协产物，合法性的建立注定是一条任重道远之路。"

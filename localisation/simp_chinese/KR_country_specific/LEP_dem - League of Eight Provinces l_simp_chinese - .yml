 LEP_national_reconstruction_administration: "国家建设总局"
 LEP_national_reconstruction_administration_desc: "击败北京的军阀只是复兴的开始，真正的考验在于如何重建这个满目疮痍的国家。为统筹全国建设资源，中央政府决定改组原有的实业发展委员会，成立直属政务院的国家建设总局，统一规划基础设施、工业布局与资源调配，协调各地建设计划，避免重复投资与地方掣肘。唯有将国家建设与经济复苏结合起来，才能逐步恢复民生、振兴实业，并为未来的工业化与国防现代化奠定坚实基础。"

 LEP_nanjing_airforce_6: "民国空军"
 LEP_nanjing_airforce_6_desc: "杭州笕桥机场原址为清军八十一标马队及炮营校场，1930年，孙传芳联帅在笕桥机场创建了联军空军。1931年，他在原校场地块建设简易机场，将南京航空学校由南京迁到此地。航校内建有机场、弹油库、机修厂、飞机制造厂等军事设施区，西部则是教学生活区。笕桥机场培养了五百余名毕业生，被外国观察家称作“中国空军的摇篮”。随着联合再度开始空军建设，笕桥机场又一次受到了重视，诸省联合作为全中国工业化程度最高的地区，其空军也无疑将成为中国空军的先驱。\n\n§Y随着国内重建与航空工业发展，民国空军将会迅速迈入现代化，并在喷气时代的黎明中成为世界领先的空军力量。§!"
 

 LEP_guide: "§M南直系§!（$paternal_autocrat_coloured$）\n£white_dot 在八省内战中，让权力平衡处于“齐燮元独裁”一侧。\n\n§M民主科学社§!（$social_liberal_coloured$）\n£white_dot 在八省内战中，让权力平衡处于“工商联优势”一侧。\n£white_dot 在统一全国后完成国策“新一届全国大选”，在随后触发的选举事件中选择“民主科学社点燃启蒙之光”  \n\n§M国民党（政学系）§!（$market_liberal_coloured$）\n£white_dot 在八省内战中，让权力平衡处于“工商联优势”一侧。\n£white_dot 在统一全国后完成国策“新一届全国大选”，在随后触发的选举事件中选择“国民党携炬而行”\n\n§M工商勇进党§!（$social_conservative_coloured$）\n£white_dot 在八省内战中，让权力平衡处于“工商联优势”一侧。\n£white_dot 在统一全国后完成国策“新一届全国大选”，在随后触发的选举事件中选择“工商勇进党取得了多数”\n\n§M人民救国会§!（$social_democrat_coloured$）\n£white_dot 在八省内战中，让权力平衡处于“工商联优势”一侧。\n£white_dot 在完成国策“新一届全国大选”前，使国家团结联盟左倾选项累计次数大于右倾选项\n£white_dot 完成国策“新一届全国大选”，在随后触发的选举事件中选择“人民救国会带来变革之风”\n\n§M景星会§!（$authoritarian_democrat_coloured$）\n£white_dot 在八省内战中，让权力平衡处于“工商联优势”一侧。\n£white_dot 在完成国策“新一届全国大选”前，使国家团结联盟右倾选项累计次数大于左倾选项\n£white_dot 完成国策“新一届全国大选”，在随后触发的选举事件中选择“景星会开启稳健之治”"
 ##新北伐国策
 LEP_new_republic_with_old_ideals: "新民国，旧理想"
 LEP_new_republic_with_old_ideals_desc: "经年战火与艰难博弈之后，我们终于推翻了北方旧政府的威权统治，在废墟之上重建中华民国的新一届中央政府。硝烟虽散，创痛犹存，但共和国的旗帜再次在中枢之地升起。然而，新政权的根基并非一纸胜利宣言，而是民国初创之时所确立的民主理想。责任内阁、代议政治与公民权利，仍是我们前行的灯塔。新民国或许诞生于风雨之中，但其道路，依旧指向那未竟的共和理想。"
 LEP_release_political_prisoners: "释放政治犯"
 LEP_release_political_prisoners_desc: "北京政府覆灭后，遍布全国的监狱中仍关押着大批因政治立场、新闻言论或反对专制而入狱的政治犯。自“七君子事件”以来，旧政权不断扩大对异见人士的逮捕范围，许多学者、记者、学生与社会活动家皆因此失去自由。如今，共和国既以民主宪政为立国之本，便不能再延续前朝压制言论、钳制思想的统治方式。我们将使这些曾为自由而奋斗的人重新投身公共事务，为新民国的民主建设贡献力量。"
 LEP_handle_old_treaties: "处理旧条约"
 LEP_handle_old_treaties_desc: "北京政府遗留下来的不仅是庞大的外债，还有数十年来签订的各项条约与协定。其中既有维系国际贸易和金融信用所必需的安排，也有列强凭借武力与外交压力强加于中国的不平等条款。我们既不能轻率撕毁一切、招致国际孤立，也不能全盘继承旧政府的屈辱遗产。唯有逐项审议、区别对待，在维护国家主权与稳定对外关系之间取得平衡，方能为新民国赢得更加有利的国际地位。"
 LEP_national_reconstruction_administration: "国家建设总局"
 LEP_national_reconstruction_administration_desc: "击败北京的军阀只是复兴的开始，真正的考验在于如何重建这个满目疮痍的国家。为统筹全国建设资源，中央政府决定改组原有的实业发展委员会，成立直属政务院的国家建设总局，统一规划基础设施、工业布局与资源调配，协调各地建设计划，避免重复投资与地方掣肘。唯有将国家建设与经济复苏结合起来，才能逐步恢复民生、振兴实业，并为未来的工业化与国防现代化奠定坚实基础。"
 LEP_national_reconstruction_administration_tt: "§C实业发展委员会§!将被改组为§Y国家建设总局§!"
 LEP_curb_inflation: "遏制通货膨胀"
 LEP_curb_inflation_desc: "连年的战乱与财政透支，使货币信用严重受损，物价飞涨，市场秩序日益混乱。若任由通货膨胀持续恶化，再宏伟的建设计划也将沦为空谈。我们必须整顿金融体系，严格控制货币发行，平衡财政收支，并恢复中央银行对金融市场的调控能力，以稳定币值、重建社会信心，为经济复苏创造稳定环境。"
 LEP_take_over_commissions_and_ministries: "接收部院"
 LEP_take_over_commissions_and_ministries_desc: "北京政府覆灭后，中央各部院及所属机关相继停止运作，但大量行政机构、专业官员与档案资料仍得以保存。我们决定全面接收旧部院体系，在肃清腐败分子与顽固保皇势力的同时，留用经验丰富的技术官僚，恢复财政、司法、交通、外交等部门的正常运转"
 LEP_grasp_key_resources: "掌握重要资源"
 LEP_grasp_key_resources_desc: "煤炭、钢铁、矿产等重要资源关系国家命脉，若任由外资与少数财团垄断，国家经济便难以真正独立。我们将加强政府对战略资源的监管与控制，对关系国计民生的重要产业实行统一规划与依法管理，在保障合法私有产权的同时，确保国家能够掌握经济发展的主动权，使资源服务于全体国民，而非少数利益集团。"
 LEP_develop_heavy_industry: "发展重工业"
 LEP_develop_heavy_industry_desc: "亟需坚实之物质基础。重工业关乎钢铁、机械与能源，既为国防之根本，亦为各项产业之支柱。我们将集中资源优先发展重工业，建设关键生产体系，使国家逐步摆脱对外依赖，增强自给能力。通过有计划之投入与统筹布局，使工业体系由薄弱走向完整，为后续经济发展与国防建设提供持久而可靠之支撑。"
 LEP_national_images_continuity: "国家形象之延续"
 LEP_national_images_continuity_desc: "历经军阀混战与专制统治，民国终于迎来了重生。然而，我们推翻的只是盘踞北京、背离民主精神的独裁政权，而非1912年辛亥革命所建立的中华民国。自武昌首义以来，共和、法治与主权在民始终是国家赖以存在的根本理念。今天的新政府作为中华民国唯一合法的继承者，接续革命先贤未竟的事业。只有在改革中保持国家法统与共和国形象的延续，方能向国民与世界证明：中国没有诞生一个新的国家，而是迎回了真正的民国。"
 LEP_legacy_of_southeast_mutual_protection: "东南互保的遗产"
 LEP_legacy_of_southeast_mutual_protection_desc: "东南互保不仅避免了庚子之乱进一步波及江南，也开创了地方督抚共维秩序、保障民生的政治传统。我们所建立的新共和国,应当继承这一遗产，在统一国家的前提下延续渐进改革与责任政治，使自由与秩序能够并行不悖。"
 LEP_strive_towards_democratic_future: "共赴民主未来"
 LEP_strive_towards_democratic_future_desc: "辛亥革命推翻了帝制，却未能让民主共和国真正扎根于这片土地。二十余年的军阀混战与独裁统治，不过证明了自由与共和绝不会从天而降，而必须依靠一代又一代国民去实践与捍卫。如今，全国终于重归统一，我们应当以更加开放的政治制度回应人民的期待，让共和国在民主、法治与公民参与中不断完善，共同迈向真正属于全体国民的未来。"
 LEP_accelerate_military_reduction: "加快军事编遣"
 LEP_accelerate_military_reduction_desc: "奉系军阀在日本帝国主义支持下扩充军备，数十万大军盘踞边疆，时刻威胁共和国的统一与安全。然而，我们的军队仍受旧时代军阀体系影响，编制混乱、指挥分散，难以应对现代战争的挑战。我们必须推进军事编遣，整合各地武装力量，裁撤冗余兵员，清除军中积弊，并建立统一的训练、指挥与后勤体系。"
 LEP_womens_rights: "妇女权利"
 LEP_womens_rights_desc: "近代国家建设离不开社会成员的普遍参与。通过改善妇女受教育条件，承认其经济与社会权利，并逐步推动婚姻与家庭制度改革，可以释放被长期压抑的社会潜力。虽然传统观念仍然根深蒂固，但妇女权利的提升已成为迈向现代文明的重要标志。"
 LEP_nationalist_rhetoric: "国家主义论调"
 LEP_nationalist_rhetoric_desc: "国家并非疆土与政权的简单集合，而是拥有共同历史、文化与精神的政治共同体。唯有培育全体国民共同的国性，才能超越地域、党派与阶级的隔阂，使国家真正凝聚为一个整体。我们将邀请曾琦、李璜、左舜生等青年党人士参与政府，推动国家主义教育，倡导联省自治与中央统一并行，反对军阀割据，以国民共同的责任与信念重塑国家灵魂，使中国能够在内外危机中重新走向富强。"
 LEP_empower_the_supreme_judicial_court: "赋权大理院"
 LEP_empower_the_supreme_judicial_court_desc: "自民国建立以来，司法独立始终是宪政建设的重要目标，但大理院作为最高审判机关，仍受到行政力量的制约，难以完全发挥其维护法权的作用。我们将进一步提升大理院的地位，扩大其司法解释与审判权限，保障法官不受外部干涉，使其成为维护法律尊严、限制权力滥用的重要机构。"
 LEP_propaganda_offensive: "宣传攻势"
 LEP_propaganda_offensive_desc: "面对北方军阀与外部势力对国家统一事业的威胁，我们必须展开一场有组织的宣传攻势。通过揭露奉系军阀长期依附日本、牺牲国家利益以维系自身统治的事实，向全国民众阐明其所谓“自治”不过是外部干涉的工具。同时，我们将宣传共和国统一、独立与民主建设的理念，凝聚各地民众对抗外来压迫与军阀割据的决心，为即将到来的斗争争取更广泛的支持。"
 LEP_uphold_civilian_politics: "坚持平民政治"
 LEP_uphold_civilian_politics_desc: "过去的政治长期受少数权势集团操纵，使民意难以真正传达。推动平民政治，便是让社会各阶层拥有参与国家事务的机会，使政治回归公共利益。通过扩大社会参与、培育自治力量与限制权力滥用，才能打破少数人垄断政治的旧格局，建立真正属于社会大众的现代国家。"
 LEP_new_factory_law: "新工厂法"
 LEP_new_factory_law_desc: "随着工业化进程不断推进，传统的工厂管理制度已难以适应新时代的社会需求。我们将制定并推行新的工厂法，规范劳动环境，限制过长工时，保障工人基本权益，并建立更完善的劳资协调机制。通过改善劳动条件、提高生产效率，我们既能缓和社会矛盾，又能推动民族工业健康发展，使工业现代化建立在更加稳定、公正的基础之上。"
 LEP_new_beiyang_faction: "吸纳北洋派"
 LEP_new_beiyang_faction_desc: "北洋政府虽然已经覆灭，但它留下的不只有军阀、政客和依附权势的既得利益者。像顾维钧、白坚武等人这样的职业政客，以及一批长期任职于财政、司法、铁路等部门的技术官僚，仍然拥有共和国所急需的行政经验。我们无意延续北洋时代的政治遗产，但也不能因门户之见而弃置贤能。只要愿意接受新的宪政秩序，他们便可以继续为国家服务。"
 LEP_protect_private_property: "保护私有财产"
 LEP_protect_private_property_desc: "自《人权宣言》提出“财产是神圣不可侵犯的权利”以来，保障人民合法财产便成为文明国家共同遵循的原则。我们应以法律明确保护个人与企业财产，非因公共利益且未经合法程序与公平补偿，不得任意征收或剥夺。唯有使人民安居乐业、资本敢于投资、工商得以发展，国家财富方能不断积累，共和政制亦将因此获得稳固的社会基础。"
 LEP_maintain_production_order: "生产秩序优先"
 LEP_maintain_production_order_desc: "工商业的繁荣并非偶然，而有赖于稳定的社会环境与健全的经济秩序。国家应积极协调劳资关系，规范市场运行，避免无谓的社会冲突侵蚀生产效率。在保障劳动者合理待遇的同时，也应维护企业正常经营，使资本、技术与劳动力各尽其用，共同服务于国家工业化与经济建设。"
 LEP_contact_civic_associations: "联络各界法团"
 LEP_contact_civic_associations_desc: "我们不应任由政党垄断公共事务，而应广泛联络商会、教育会、农会及各类职业法团，使真正代表社会各界利益的人士参与国家治理。依托法团组织汇聚地方贤达、工商领袖与专业人士的智慧，既能缓和社会矛盾，又能避免政治流于空谈，使共和国建立在协商合作、各界共治的坚实基础之上。"
 LEP_elite_republicanism: "精英共和"
 LEP_elite_republicanism_desc: "共和政治不仅需要民意，更需要能够驾驭国家的人才。国家大政不应沦为党派争斗与民粹喧嚣的牺牲品，而应交由受过良好教育、具有公共责任感与治国能力的贤能之士主持。我们将完善文官制度，重视专业官僚与学者在政治中的作用，使国家决策建立于理性、知识与经验之上，在尊重共和体制的同时，塑造一个稳健、高效而富有远见的政府。"
 LEP_long_trains_and_steel_horses: "长龙铁马"
 LEP_long_trains_and_steel_horses_desc: "铁路纵横，则商旅畅通；交通便利，则百业俱兴。今日中国铁路网仍支离破碎，各省往来多受阻碍，不仅制约工商发展，亦妨碍中央与地方的联系。我们将统筹全国铁路建设，打通交通要道，完善干线与支线网络，使长龙贯通南北，铁马驰骋东西，以交通之利促进实业繁荣、市场统一。"
 ninner_railway_tt: "§L将修建一段§!§Y华东内陆线§!§L的2级铁路§!\n§L沿海若失陷，我军依旧可以靠内线铁路快速机动§!"
 LEP_confiscate_noble_assets: "收缴勋贵资产"
 LEP_confiscate_noble_assets_desc: "北京威权政府覆灭后，长期依附其生存的腐败政客、前朝宗社勋贵与权贵豪商也随之失势。他们凭借裙带关系、权钱交易和垄断特权积累了大量财富，如今或仓皇出逃，或隐匿乡间，再无往日庇护。政府决定依法查封其遗留资产，追缴非法所得，并将其充作国家财政，用于偿还债务、稳定金融与恢复民生。"
 LEP_war_comes_from_the_north: "战自北来"
 LEP_war_comes_from_the_north_desc: "北方的阴云正在聚集。随着东北军在张作霖麾下不断扩张，日本势力亦借机干涉中国统一事业，共和国已无法再沉浸于和平的幻梦之中。边境冲突与军事压力不断提醒着我们，下一场战争或许已经迫近。国防顾问委员会提交的《国防计划书》将成为共和国应对危机的蓝图，我们必须整合工业、资源与动员体系，为即将到来的风暴做好准备。"
 LEP_national_defense_design_council: "国防设计委员会"
 LEP_national_defense_design_council_desc: "面对日益严峻的国际局势，我们将设立国防设计委员会，统筹全国国防建设与经济动员事务。委员会将汇集军事、经济、财政、交通、资源等领域的专家，制定长期国防规划，调查国内资源与工业基础，并推动基础工业、军需生产与战略运输体系的发展。"
 LEP_seek_international_recognition: "寻求承认"
 LEP_seek_international_recognition_desc: "在国际舞台上，我们仍面临着外交孤立与合法性不足的问题。部分列强仍对中国局势持观望态度，甚至试图利用地方势力阻碍国家统一。我们必须积极开展外交活动，向世界展示共和国追求和平、独立与法治的决心，争取国际社会对新政府的正式承认。"
 LEP_restore_infrastructure: "修复基础设施"
 LEP_restore_infrastructure_desc: "战火与长期失修使道路桥梁残破、水利失养、电讯中断，既阻碍工商发展，亦影响百姓生计。我们将统筹修复全国基础设施，整治河道堤防，修缮公路桥梁，恢复邮电通信，并完善城市公共设施建设。唯有重新织就现代国家的交通与公共网络，方能促进经济复苏、改善民生福祉"
 LEP_economics_democratization: "经济民主化"
 LEP_economics_democratization_desc: "经济发展不应仅为少数资本集团谋利，更应使广大劳动者共享国家建设的成果。我们将推动劳资协商制度，保障劳动者参与企业事务与公共经济政策讨论的权利，并加强政府对垄断资本与市场失序的必要监督，使经济自由与社会公平并行不悖，逐步建立兼顾效率、秩序与民生的现代经济体系。"
 LEP_arm_national_guard: "武装省防军"
 LEP_arm_national_guard_desc: "仅依靠中央军队已难以应对广阔国土上的安全需求。我们将整合地方治安力量，建立以省为单位的省防军体系，使其成为维护地方秩序、支援正规军作战的重要后备力量。通过统一训练、规范编制与严格监管，省防军既能保障各地防务，也能在国家危急之时迅速转化为国防动员的重要支柱。"
 LEP_resume_higher_education: "恢复高等教育"
 LEP_resume_higher_education_desc: "连年战乱使学府倾颓、师资流散，国家建设亦因此失去了培养栋梁之所。恢复高等教育，不仅是重建校园，更是重振国家精神的重要举措。我们将整顿高等学府，延揽国内外知名学者，恢复大学自治与学术研究，完善法政、理工、医学等专业教育，为共和国培养兼具学识、品德与公共精神的新一代人才。"
 LEP_stockpile_logistics_supplies: "储备后勤物资"
 LEP_stockpile_logistics_supplies_desc: "现代战争的胜负不仅取决于前线将士的勇气，也取决于国家能否持续提供充足的物资保障。我们将建立统一的后勤储备体系，统筹粮食、燃料、医疗用品与军需装备的生产和调配，完善战略仓储网络，减少战争爆发时的供应风险。通过提前规划与长期积累，我们将确保共和国在危机来临之际拥有持续作战的能力。"
 LEP_appeal_for_international_support: "呼吁国际支援"
 LEP_appeal_for_international_support_desc: "面对日本帝国主义对共和国统一事业的破坏与侵略威胁，单凭一国之力难以抵御强敌。我们将向世界各国揭露日本扶植军阀、干涉中国内政的行径，争取国际社会的理解与支持。同时，我们将积极寻求第三国际、德意志帝国以及俄罗斯等力量的援助，在外交、军事与经济领域建立合作关系。唯有团结一切反对侵略与维护独立的力量，共和国才能在即将到来的战争中坚持到底。"
 LEP_appoint_republican_officers: "启用共和派军官"
 LEP_appoint_republican_officers_desc: "旧军阀体系的崩溃，并不意味着其中所有军官都应被一概抛弃。在过去的斗争中，仍有不少出身旧军的将领反对军阀割据，认同共和理念，并愿意接受国家统一的领导。我们将甄别并吸纳这些具有现代军事素养与共和信念的军官，使其加入共和国国防体系。"
 LEP_divide_war_zones: "划分各战区"
 LEP_divide_war_zones_desc: "未来战争将不再是单纯的局部冲突，而是涉及全国范围的总体较量。面对北方奉军的军事压力与日本帝国主义不断扩大的干涉，我们必须重新规划全国军事部署，根据地理环境、战略方向与潜在威胁划分各大战区。通过明确各战区防务职责，统一指挥体系，加强兵力调配与后勤协调，我们将建立更加灵活高效的国防体系。"
 LEP_industrial_technology_transfer: "工业技术转移"
 LEP_industrial_technology_transfer_desc: "获得国际社会的承认后，共和国终于有机会打破长期以来的技术封锁与工业孤立。我们将积极引进海外先进工业技术，吸收外国在机械制造、资源开发与现代生产管理方面的经验，并通过合作、交流与技术转让推动国内工业升级。借助国际技术资源，我们将加速建立现代化工业体系，缩短与先进国家之间的差距。"
 LEP_empower_the_president: "强化大总统权力"
 LEP_empower_the_president_desc: "总统不仅是国家元首，更应成为宪政秩序的维系者与危机时刻的仲裁者。议会纷争不已、党派倾轧不断，往往使政令壅滞，难以应对内忧外患。强化“伯理玺天德”，就是适度扩充总统在行政统筹、官员任免、紧急处置等方面的权力，使国家拥有稳定而统一的领导核心，在维护宪法与法治的前提下，提高政府施政效率，避免政局因无休止的党争而陷入瘫痪。"
 LEP_liberate_working_farmers: "解放劳苦农民"
 LEP_liberate_working_farmers_desc: "长年以来，土地兼并、租佃失衡与赋役繁重，使无数农民困于贫困。我们将推动制定新的《土地法》，重新厘定土地权利与义务，规范地租、保障佃农、完善土地登记，并通过法律逐步改善农村生产关系，使改革循序渐进而不致动摇社会秩序，让广大农民真正分享国家建设的成果。"
 LEP_public_health_system: "公共卫生体系"
 LEP_public_health_system_desc: "国家之强盛，不仅在于富兵强国，亦在于国民体魄健全。过去公共卫生事业长期缺乏统一规划，疫病流行时常危及社会安定。我们将建立覆盖全国的公共卫生体系，完善卫生行政机构，推广疾病防治与预防接种，改善城乡医疗条件，培养专业医护人才，使公共卫生由临时救济迈向制度建设，为全体国民提供更可靠的健康保障。"
 LEP_preliminary_social_security: "初步社会保障"
 LEP_preliminary_social_security_desc: "长期以来，民间救济与地方赈济一直承担着维系社会稳定的责任，但面对工业发展与社会变迁，传统救济体系已逐渐显露出不足。尽管北洋时期已有部分社会立法与救济机构的探索，但由于北京政府的腐败昏庸，根本无意推行，很多法令都成为一纸空文。如今，我们将完善相关制度，为社会稳定与民众生活提供基础保障。"
 LEP_talk_more_about_issues: "“多谈些问题”"
 LEP_talk_more_about_issues_desc: "近代中国从不缺少高谈阔论的思想家，却始终缺少脚踏实地的改革者。正如胡适所言，与其争论抽象的主义，不如认真研究国家所面临的具体问题。共和国的建设不能依赖包治百病的理论，更不能寄希望于一纸空谈，而应立足现实，以调查代替臆测，以实践检验政策，在不断解决财政、教育、民生与地方治理等实际问题的过程中，循序渐进地推动国家迈向现代化。"
 LEP_united_democratic_alliance: "联合民主政团同盟"
 LEP_united_democratic_alliance_desc: "长期以来，各地民主团体虽共同反对军阀独裁，却始终缺乏统一协调的组织，难以形成足以影响全国政局的共同力量。如今共和国重归统一，我们应当促成中国民主政团同盟与各地自治派、教育界、工商界及社会团体携手合作，建立更加广泛的民主统一阵线，凝聚社会各界对共和与宪政的共识。"
 LEP_compile_civil_code: "编纂民法典"
 LEP_compile_civil_code_desc: "自清末变法以来，中国虽已陆续引入西方法律制度，但民事规范长期散乱，难以适应现代国家治理之需要。如今，政府决意召集法学专家与司法官员，参考大陆法系先进经验，整合既有法律草案，编纂一部完整的民法典。该法典将明确财产权、契约、婚姻、继承等制度，以保障社会秩序，推动司法的现代化。"
 LEP_ally_with_local_factions: "与地方实力派结盟"
 LEP_ally_with_local_factions_desc: "我们应主动争取湖北将军团及地方实力派的支持。辛亥以来，这些首义元勋、地方将领与实业人士虽无正式组织，却始终保持着紧密联系，在军政两界拥有深厚影响。与其将其排斥于中央之外，不如通过政治协商与利益协调，将其纳入共和国的政治框架，借助其威望稳定地方局势，凝聚湖北乃至全国各界力量，共同维护共和秩序。"
 LEP_establish_special_relations: "建立特殊关系"
 LEP_public_works_projects: "公共工程项目"
 LEP_public_works_projects_desc: "国家经济之振兴，不仅有赖工商繁荣，更有赖公共建设之完善。我们将统筹财政资源，大力推行道路、桥梁、水利、港口及市政等公共工程，以改善全国基础设施，便利工农生产与商品流通。同时，工程建设亦可广泛吸纳失业民众，以工代赈，增加社会就业，促进地方经济复苏"
 LEP_uphold_parliamentarism: "维护议会主义"
 LEP_uphold_parliamentarism_desc: "在近代中国的政治实践中，议会制度虽历经挫折，却始终是推动政治现代化的重要尝试。我们将维护国会的权威，使其成为民意表达、政策讨论与权力制衡的重要平台。民国以来，国会议员曾在反对专制、维护宪政、推动法制建设等政治斗争中发挥积极作用。通过恢复议会应有地位，保障议员职权、尊重选举结果并完善议会运作机制，我们将推动政治秩序走向公开、稳定与现代化。"
 LEP_safeguard_national_unity: "维护国家统一"
 LEP_new_election: "新一届全国大选"
 LEP_new_election_desc: "随着国家重新归于统一，长期动荡的政治局势终于迎来了新的篇章。全国性的民主选举再次被提上日程，这将是共和国成立以来首次覆盖全国范围的全民大选。无论是中央政府的未来方向，还是各派政治力量的命运，都将在这场选举中接受人民的选择。这不仅是一场权力的交接，更是对共和制度与民主理念的一次重要检验。"
 LEP_audit_the_military: "对军方的审计"
 LEP_audit_the_military_desc: "军队乃国家根本，然而长期以来，部分军中势力侵吞军费、贪腐渎职、败坏军纪，已严重影响军队的声誉与战斗力。通过开展全面审计，清查军费流向、整顿后勤体系，并严惩其中的腐败分子与违纪人员，我们将重塑军队纪律，确保武装力量重新服从国家制度与公共利益。"

 LEP_integrate_arsenal_factories: "整合军工厂"
 LEP_integrate_arsenal_factories_desc: "湖北、直隶等地遗留下来的军工厂虽拥有一定生产基础，却长期受到军阀割据影响，各自为政，设备老旧，难以形成有效的国防工业体系。面对奉系军阀与日本帝国主义日益增长的军事压力，我们必须重新整合这些既有资源，统一管理军工生产，调配技术人才与原料供应，恢复并扩大武器装备制造能力。"
 LEP_civil_public_hearing: "市民公听会"
 LEP_civil_public_hearing_desc: "现代政治的根基在于民众对公共事务的参与。通过建立市民公听会制度，政府将为社会各界提供表达意见与监督施政的渠道，使地方治理更加透明、开放。虽然这一制度仍需在实践中不断完善，但它将成为连接政府与民众、培养公民意识的重要尝试。"


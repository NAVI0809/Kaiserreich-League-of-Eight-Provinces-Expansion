 LEP_national_railway_corporation_desc: "军阀时代，各地铁路长期受到地方势力控制，线路标准混乱，运输能力低下，严重阻碍国家工业发展。随着重建民主共和秩序，政府开始推动铁路体系改革，将政府铁路部门、江浙工商铁路公司及各区域铁路资产整合为统一的国家铁路局。\n\n在工程师与经济专家的领导下，铁路局将建设连接全国市场的新型交通网络，使铁路成为共和国工业复兴、军事动员与经济繁荣的钢铁脉络。"

 LEP_republican_administration_regional_stage: "自1912年以来，共和的旗帜再一次飘扬于南京城头。§P齐燮元§!遇刺身亡后，原本维系八省联合的权力结构迅速崩解；趁此真空，§l地方自治派§!、§c江南商帮§!与§a浙军§!联合行动，并在南下§m政学系人士§!的协助下夺取南京，建立了§l南京§!§m民主§!§c政府§!。长期沉寂的议会政治也终于重新回到了中国政治舞台的中央。然而，这个因反对军阀统治而形成的联盟，§R从一开始便并非铁板一块§!。各派对于国家未来的理解仍然截然不同。\n\n§l褚辅成§!与§l$LEP_social_liberal_party_new$§!正试图以议会政治与地方自治维系南京民主政府的稳定。然而，这个建立于各派妥协之上的共和国依旧脆弱不安；唯有在国民大会召开前维持足够的社会支持与政治稳定，§l$LEP_social_liberal_party_new$§!方能继续掌握政府。如果§l$LEP_social_liberal_party_new$§!的支持率高于33%，且稳定度高于50%，即可维持当前政府并顺利推进国策§Y$LEP_national_congress$§!。\n§a当前§l$LEP_social_liberal_party_new$§!的支持率为[?LEP.party_popularity@social_liberal|%g2]§!\n\n§m黄郛§!领导的§m$LEP_Old_PSC_party_new$§!则更强调制度、效率与专家治国，试图建立一个理性而稳定的现代国家\n§a当前§m$LEP_Old_PSC_party_new$§!的支持率为[?LEP.party_popularity@market_liberal|%g2]§!\n\n以§c荣宗敬§!为代表的§c$LEP_social_conservative_party$§!，则更加关注金融秩序、地方实业与市场自由，希望以经济建设维系中国的复兴。§!\n§a当前§c$LEP_social_conservative_party$§!的支持率为[?LEP.party_popularity@social_conservative|%g2]§!\n\n当前§a稳定度§!为[?LEP.stability|%g0]"

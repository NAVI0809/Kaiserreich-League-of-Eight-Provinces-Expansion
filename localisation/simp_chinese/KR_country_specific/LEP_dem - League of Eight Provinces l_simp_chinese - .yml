LEP_military_mobilization_modifier: "军事动员"
LEP_military_mobilization_modifier_desc: "为了应对即将到来的战争，我们依照厉尔康的理念建立起了一整套军事动员体系。从工业普查到原料统制，从民厂转产到技术储备，每一步都在将国家潜力转化为战时实力。动员越深入，工业生产向战争倾斜的力度就越大，但资源的调配也日益紧张。我们必须把握节奏，在国力承受范围内稳步推进。"

##军事动员决议
LEP_industrial_census: "工业普查"
LEP_industrial_census_desc: "对全国工矿企业展开全面调查，摸清设备状况、产能规模与技术工人分布，为后续工业动员与战时生产布局提供准确依据。"
LEP_expand_war_production: "扩大军需生产"
LEP_expand_war_production_desc: "在现有军工基础上扩建生产线，增加枪械、弹药、火炮等关键军品的产能，同时优化生产流程，确保战时前线物资供应充足，满足大规模作战对武器装备的持续需求。"
LEP_develop_refining_industry: "发展精炼工业"
LEP_develop_refining_industry_desc: "建设现代化炼油与金属精炼设施，提升原油加工与矿石提纯能力，确保航空燃油、润滑油及特种金属的自给供应，为军事工业提供稳定可靠的原料保障。"
LEP_strategic_reserve_fund: "战略物资储备基金"
LEP_strategic_reserve_fund_desc: "拨付专项资金，建立战略物资储备体系，在和平时期分批购入石油、橡胶、稀有金属、粮食等关键物资，储于安全据点，以备战时封锁或中断之需。"
LEP_research_substitute_materials: "推进代用品研究"
LEP_research_substitute_materials_desc: "设立材料替代研究专项，针对战时可能短缺的进口原料，开发本土代用材料。重点推进合成橡胶、人造纤维及特种合金的研制，减少对外依赖，保障生产不间断。"
LEP_collect_scrap_materials: "收集废旧物资"
LEP_collect_scrap_materials_desc: "发动全国开展废旧物资回收运动，系统收集金属废料、旧橡胶、废纸、碎布等可再利用资源，分类处理回炉再造，实现物尽其用，缓解战时原料紧缺压力。"
LEP_unify_industrial_organization: "统一工业组织与计划"
LEP_unify_industrial_organization_desc: "整合全国工业资源，建立统一的生产调度与分配机制，协调各行业、各区域之间的协作关系，杜绝重复建设与资源浪费，确保战时工业体系高效运转。"
LEP_train_technical_talent: "培养军工技术骨干"
LEP_train_technical_talent_desc: "选拔优秀青年进入军工技术院校深造，系统培养工程师与高级技工，重点强化武器设计、弹药制造、机械维修等专业能力，为战时工业动员储备核心技术力量。"


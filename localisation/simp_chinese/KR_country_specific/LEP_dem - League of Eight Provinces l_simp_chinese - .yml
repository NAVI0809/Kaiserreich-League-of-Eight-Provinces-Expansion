 LEP_guide: "§M南直系§!（$paternal_autocrat_coloured$）\n£white_dot 在八省内战中，让权力平衡处于偏向联帅一侧且大于33%。\n\n§M民主科学社§!（$social_liberal_coloured$）\n£white_dot 在八省内战中，让权力平衡处于偏向工商联一侧且大于33%。\n£white_dot 在完成国策“召集国民大会”前，使社会自由主义支持率大于33%且稳定度大于50%\n\n§M国民党（政学系）§!（$market_liberal_coloured$）\n£white_dot 在八省内战中，让权力平衡处于偏向工商联一侧且大于33%。\n£white_dot 在完成国策“召集国民大会”前，使社会自由主义支持率小于33%且稳定度大于50%\n£white_dot 在“内阁总辞”事件中选择“黄郛的国民党赢得多数席位”\n\n§M全国工商联合会§!（$social_conservative_coloured$）\n£white_dot 在八省内战中，让权力平衡处于偏向工商联一侧且大于33%。\n£white_dot 在完成国策“召集国民大会”前，使社会自由主义支持率小于33%且稳定度大于50%\n£white_dot 在“内阁总辞”事件中选择“荣宗敬领导的工商联成功组阁”\n\n§M人民救国会§!（$social_democrat_coloured$）\n£white_dot 在八省内战中，让权力平衡处于偏向工商联一侧且大于33%。\n£white_dot 在完成国策“召集国民大会”前，使社会自由主义支持率小于33%且稳定度小于50%\n£white_dot 在“团结联盟解散”事件中选择“由人民救国会主导新政府”\n\n§M景星会§!（$authoritarian_democrat_coloured$）\n£white_dot 在八省内战中，让权力平衡处于偏向工商联一侧且大于33%。\n£white_dot 在完成国策“召集国民大会”前，使社会自由主义支持率小于33%且稳定度小于50%\n£white_dot 在“团结联盟解散”事件中选择“景星会接掌了国家机器”"
 ##新北伐国策
 LEP_new_republic_with_old_ideals: "新民国，旧理想"
 LEP_new_republic_with_old_ideals_desc: "经年战火与艰难博弈之后，我们终于推翻了北方旧政府的威权统治，在废墟之上重建中华民国的新一届中央政府。硝烟虽散，创痛犹存，但共和国的旗帜再次在中枢之地升起。然而，新政权的根基并非一纸胜利宣言，而是民国初创之时所确立的民主理想。责任内阁、代议政治与公民权利，仍是我们前行的灯塔。新民国或许诞生于风雨之中，但其道路，依旧指向那未竟的共和理想。"

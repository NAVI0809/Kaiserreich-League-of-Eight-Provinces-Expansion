 LEP_southern_republican_aligned: "所属：§m南方共和派§!"
 LEP_order_engineer: "秩序工程师"
 LEP_order_engineer_desc: "§L黄郛深耕民国治理的制度构建，以行政规划与系统设计为核心专长，凭借技术官僚的精准统筹与务实革新眼光，整合财政、行政与国防分散资源，为乱象丛生的华东量身打造高效运转、权责清晰的治理框架，让秩序成为国家重建的坚实根基。§!"
 LEP_autonomy_standard_bearer: "自治旗手"
 LEP_autonomy_standard_bearer_desc: "§L褚辅成是省宪自治运动的坚定领航者，尽管地方实力派的掣肘与统一诉求的争议从未停歇，而这位以宪政理想、务实协调立足的领袖，终将以浙省宪制经验为根基，推动诸省自治联合，筑牢分权制衡的共和基石。§!"
 LEP_chamber_of_commerce_leader: "商会领袖"
 LEP_chamber_of_commerce_leader_desc: "§L荣宗敬是江南商帮与民族实业的核心领导者，实业救国的信念深植其心，这位以务实经营、远见卓识闻名的领袖，终将以商会资源为依托，推动实业兴邦政策落地，为华东的经济重建与民生稳固注入持久动力。§!"
 LEP_rong_zongjing_leader_desc: "§Y生于：§!§L1873年9月23日；大清帝国、江苏省无锡县§!\n§Y背景：§!荣宗敬生于江苏无锡耕读之家，父亲荣熙泰曾在上海经营钱庄，后因战乱归乡。1887年，14岁的他入无锡通顺钱庄当学徒，5年里练就精准的算盘技艺与商业洞察力；1892年随父返沪，在广生钱庄任跑街，游走于沪上商界，摸清了南北货贸易与金融流通的脉络。\n\n1902年，荣宗敬与弟弟荣德生凑6000两白银，在无锡创办保兴面粉厂，他主外拓销路、弟弟主内管生产。初期遭地方士绅质疑与销路困境，他亲赴上海、南京跑订单，以“兵船牌”面粉打开市场，1903年工厂更名茂新，次年便实现稳定盈利，成为无锡近代民族实业的开端。\n\n1912年辛亥革命后，国内面粉需求暴涨，荣宗敬果断在上海设福新面粉厂，引入新式设备，日产面粉2000袋；1915年又跨界创办申新纺织厂，借一战期间外国商品输入锐减的机遇，迅速抢占棉纺市场。至1918年，茂新、福新已扩至6家面粉厂，申新纱厂达2家，日产面粉占全国民族企业总量的25%，他凭 “粉纱并举” 模式，成为华东实业界的核心人物。\n\n1918年后，德国赢下一战，随即加强对华沿海经济侵略，德资面粉厂、纱厂凭借资本优势与政策倾斜，在上海、无锡等地大肆扩张，挤压民族企业生存空间。荣宗敬作为民族工业代表，拒绝与德资合作，转而整合江南中小实业家资源，改进生产工艺降低成本，以“低价高质”策略与德资工厂竞争；同时联合上海商会，呼吁政府限制外资过度垄断，虽遭地方军阀漠视，却凭借民间市场支持，仍保住核心产能，至 1920 年代初仍保有8家工厂，稳居“面粉大王”“棉纱大王”之位,更因抵抗外资侵略的立场，成为江南工商界声望卓著的领袖。"
 LEP_chu_fucheng_leader_desc: "§Y生于：§!§L1873年5月27日；大清帝国、浙江省嘉兴府§!\n§Y背景：§!褚辅成出身于浙江嘉兴一个书香之家，自幼受传统儒学教育，后目睹清末国势衰微，逐渐萌生革新思想。1904年，31岁的他自费赴日本留学，入东京法政大学研习宪政，期间结识孙中山、黄兴等革命志士，深受民主革命思想影响，于1905年加入中国同盟会，成为浙江籍同盟会员中的核心成员。\n\n1906年褚辅成归国，以嘉兴府中学堂教员身份为掩护，秘密联络浙江革命党人，筹建同盟会浙江支部，负责策划浙省反清起义。1911年武昌起义爆发后，他迅速在嘉兴响应，组织民军光复嘉兴府，随后赶赴杭州参与浙江光复之役，协助新军攻克杭州满城，为浙江脱离清廷统治立下汗马功劳。浙江军政府成立后，他任民政司司长，主持地方新政，推行剪辫易服、废除苛捐等改革，成为浙省政坛重要人物。\n\n1913年“二次革命”爆发，褚辅成坚决支持孙中山，任浙江讨袁军总司令，通电反对袁世凯独裁。讨袁失败后，他遭袁世凯通缉，被迫流亡日本，后转赴南洋，在华侨中宣传反袁思想，募集革命经费。1916年袁世凯称帝败亡后，褚辅成返浙，重任浙江省议会副议长，期间积极推动地方自治，主张 “省自为治，联省共和”，成为省宪运动的坚定倡导者。\n\n1921年,褚辅成牵头起草《浙江省宪法草案》，组织全省公民投票表决，最终促成《浙江省宪法》颁布，这是中国近代史上首部省级正式宪法，确立了“分权制衡”的地方治理架构。他也因此被推举为浙江省政务院院长，主持浙省行政，期间整顿财政、发展教育、修建公路，使浙江成为当时地方自治的典范。1924年后，虽因军阀混战导致省宪实施受阻，但他始终坚守自治理念，奔走于苏、浙、皖、闽等省，联络地方实力派与民主人士，呼吁恢复联省共和，成为南方自治力量的精神领袖。"
 LEP_huang_fu: "黄郛"
 LEP_huang_fu_bio: "黄郛是一个贫寒之家最小的儿子，他幼年在义塾读书，后受梁启超尚武论启发入浙江武备学堂读书并名列榜首。之后他幸运地获清朝官费赴日本留学资格，于1905年入东京振武学堂读书，并于同年加入同盟会。1907年，黄郛和蒋介石、张群在振武学校结识，创办武学杂志，并且翻译日俄战争相关资料。\n\n1910年，黄郛归国在北京军咨府工作。之后他在上海投奔沪军都督府都督陈其美麾下，任沪军第2师参谋长兼副师长。在上海，陈其美、黄郛、蒋介石三人意气相投，遂换帖拜把，结成“盟兄弟”。二次革命后，黄郛被迫流亡南洋，之后又前往欧洲与美国。之后黄郛回国参加护国战争，而后又定居天津，与张绍曾等北洋政客交往密切。\n\n黄郛成为了徐世昌的代笔，并于1921年成为了北洋政府的顾问。他于1923年就任张绍曾内阁的署理外交总长。其后又在高凌霨和颜惠庆的内阁中任教育总长。1924年，黄郛与冯玉祥在北京政变中合作，并短暂地担任了代理内阁总理，期间他帮助驱逐了清廷，将故宫改造成博物院。但是奉系军阀结束了黄郛短暂的自由主义统治，把他流放到了天津。\n\n由于他的国民党同僚们在北伐中败北，黄郛最终留在了北方。国会复会后，他与张绍曾合作，以党魁的身份致力于政学系的复兴。"
 LEP_huang_fu_leader_desc: "§Y生于：§!§L1880年3月8日；大清、浙江省上虞§!\n§Y背景：§!§L$QIE_huang_fu_bio$§!\n\n§Y备注：黄郛与国民党联系紧密，又参与过北京政变，而且经常与胡适合作，此人或许是直系在国会中的头号大敌。§!"
 LEP_huang_fu_advisor_desc: "§Y生于：§!§L1880年3月8日；大清、浙江省上虞§!\n§Y派系：§!§m旧政学系§!\n§Y背景：§!§L$QIE_huang_fu_bio$§!\n\n§Y备注：黄郛与国民党联系紧密，又参与过北京政变，而且经常与胡适合作，此人或许是直系在国会中的头号大敌。§!"

 league_generic.4.t: "加入经济合作协定？"
 league_generic.4.d: "中国邀请我们加入其领导的经济合作协定，意在通过援助、合作等方式协调阵营内各成员国的经济发展，并增进资源利用效率、技术进步，同时降低内部的关税壁垒和投资风险。我们是否应该加入这一组织？"

LEP_domestic_uniform_materials: "国产军服材料"
LEP_domestic_uniform_materials_desc: "建设国产军服材料生产体系，发展棉毛纺织、印染整理等配套工业，实现从原料种植到成衣制作的全链条自给，确保军队被服供应不依赖进口。"
LEP_develop_motor_transport: "发展汽车运输"
LEP_develop_motor_transport_desc: "加快汽车制造业发展，扩充载重汽车与客运车辆产能，同时完善公路网络与维修体系，提升战时部队机动能力与后勤物资输送效率。"
LEP_replace_manpower_with_machinery: "以机械补人力"
LEP_replace_manpower_with_machinery_desc: "大力发展坦克、装甲车等机械化装备，逐步替换传统步兵编制，以钢铁洪流替代血肉之躯，在减少人力消耗的同时大幅提升部队突击力与战场生存能力。"
LEP_enhance_troop_training: "加强军士训练"
LEP_enhance_troop_training_desc: "延长新兵训练周期，增加实弹射击与战术演练强度，同时设立士官进修学校，培养基层指挥骨干，全面提升部队实战能力与战场应变能力。"
LEP_emergency_requisition_factories: "紧急征用民间工厂"
LEP_emergency_requisition_factories_desc: "依据动员法令，将符合条件的民间机械厂、化工厂、冶炼厂等征用为军需生产单位，统一分配生产任务，限期转产军工产品，迅速扩充战时工业产能。"
LEP_fuel_conservation_decree: "燃料节约令"
LEP_fuel_conservation_decree_desc: "颁布燃料节约法令，对汽油、柴油、煤炭等实施配额管理，压缩非军事部门的燃料消耗，集中保障前线作战与军工生产的燃料供应。"
LEP_war_industry_mobilization_act: "军需工业动员法"
LEP_war_industry_mobilization_act_desc: "制定军需工业动员法，明确规定战时政府对工厂、原料、运输工具的征用权限与程序，为全面工业动员确立法律基础与执行依据。"
LEP_recall_skilled_workers: "召回技术工人"
LEP_recall_skilled_workers_desc: "对已入伍或流散各地的熟练技术工人进行登记排查，分批召回军工生产一线，充实关键岗位的技术力量，确保军需品生产的质量与效率。"


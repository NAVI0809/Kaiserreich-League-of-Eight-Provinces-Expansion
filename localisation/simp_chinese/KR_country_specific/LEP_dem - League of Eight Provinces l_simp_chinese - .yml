LEP_national_reconstruction_bureau: "[LEP_national_reconstruction_bureau_loc]"
LEP_national_reconstruction_bureau_desc: "[LEP_national_reconstruction_bureau_desc_loc]"
LEP_national_reconstruction_bureau_key: "国家建设总局"
LEP_national_reconstruction_bureau_desc_key1: "实业发展委员会已经正式投入运作。随着政府逐步恢复对财政、铁路与工矿资源的统筹能力，我们终于能够按照国家发展的需要，有计划地推进工业建设。委员会将根据各地实际情况调配建设资源，在兴建工厂、完善基础设施与扶持重点产业之间作出权衡。有限的资源无法满足所有需求，每一项投资都将影响未来的发展方向，而如何规划这场关系国家前途的建设事业，将由我们亲自决定。\n\n当前拥有的建设资源：£GFX_production_texticon §n[?LEP_construction_var]§!\n\n依据当前投入的建设资源，§Y[LEP_national_reconstruction_bureau_loc]§!将获得如下加成：\n\n£civ_factory_output  工厂产出：[?LEP.LEP_cons_industrial_capacity_factory|=%+]\n£consumer_goods_texticon  生活消费品工厂：[?LEP.LEP_cons_consumer_goods_factor|Y%]\n£construction_speed_texticon  建造速度：[?LEP.LEP_cons_production_speed_buildings_factor|=%+]\n£efficiency_base_texticon  基础生产效率：[?LEP.LEP_cons_production_factory_start_efficiency_factor|=%+]\n£efficiency_growth_texticon  生产效率增长：[?LEP.LEP_cons_production_factory_efficiency_gain_factor|=%+]\n£prod_eff_cap  生产效率上限：[?LEP.LEP_cons_production_factory_max_efficiency_factor|=%+]"
LEP_national_reconstruction_bureau_desc_key2: "国家建设总局已经正式成立。这一直属中央的统筹机构，将负责协调全国基础设施建设、工业投资与资源调配，打破过去各省各行其是、重复建设的弊端。在推进铁路、公路、水利、能源等重点工程的同时，总局也将监督各项经济建设计划的实施，确保有限的财政与物资得到最有效的利用。随着经济秩序逐步恢复，我们终于有能力将国家建设与经济复苏结合起来，在振兴工商业、改善民生的同时，为未来的工业化和国防建设奠定坚实基础。如今，各项建设方案已经准备就绪，只待政府统筹部署，便可全面展开。\n\n当前拥有的建设资源：£GFX_production_texticon §n[?LEP_construction_var]§!\n\n依据当前投入的建设资源，§Y[LEP_national_reconstruction_bureau_loc]§!将获得如下加成：\n\n£civ_factory_output  工厂产出：[?LEP.LEP_cons_industrial_capacity_factory|=%+]\n£consumer_goods_texticon  生活消费品工厂：[?LEP.LEP_cons_consumer_goods_factor|Y%]\n£construction_speed_texticon  建造速度：[?LEP.LEP_cons_production_speed_buildings_factor|=%+]\n£efficiency_base_texticon  基础生产效率：[?LEP.LEP_cons_production_factory_start_efficiency_factor|=%+]\n£efficiency_growth_texticon  生产效率增长：[?LEP.LEP_cons_production_factory_efficiency_gain_factor|=%+]\n£prod_eff_cap  生产效率上限：[?LEP.LEP_cons_production_factory_max_efficiency_factor|=%+]"

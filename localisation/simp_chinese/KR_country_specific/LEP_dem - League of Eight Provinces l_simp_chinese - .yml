 LEP_three_colors_democracy: "三色民主"
 LEP_three_colors_democracy_desc: "“三色”之名源自昔日浙江制宪运动，百余部宪草汇集议会，红、黄、白三案并立，象征协商与多元并存的共和理想，亦象征今日华东政局中自治派、政学系与商绅势力三方共治的现实。南京政府立志以法治安定江浙，然八省内战创痕未消，地方势力盘根错节，民心对新政仍多观望。多元协商虽能维系联盟，却也使决策迟缓、施政掣肘。唯有在持续的制度建设与稳健施政中，将纷杂之“三色”化为共识与力量，方能使民主由象征转为真正的国家根基。"

 LEP_nanjing_navy_2: "§C中国海军：§!§O磨刀霍霍§!"
 LEP_nanjing_navy_2_desc: "传奇的福建水师系历史悠久。在洋务运动的推动下，不甘心在技术兵种层面落后西方的闽浙总督左宗棠1866年于福州建设了一系列造船厂，并选择马尾作为造船厂的厂址，福建的航海文化由此开始逐渐融入并主导了海军。\n\n福建船政学堂成为了中国海军的摇篮，该校开设有多个学科，包括船只的制造、驾驶、管理和设计。该校学生由外国顾问教导，全面地学习法国造船技术与英国海军技术。福建船政学堂也是现代中国第一所新式军校、第一所职业学校和第一所海军学校。\n\n尽管福建水师在19世纪末和20世纪初两度灭亡，但福建水师系依然坚持不懈，现在他们将再次高举中国新兴海军力量的旗帜。\n\n§Y在国家统一后，北洋水师的官兵们加入了我们，中国的海军总算完整了，虽然海军派系依旧繁杂，拉帮结派的行为依旧存在，但是他们都有着保卫海疆的共同目标，共同从废墟中建设一支强大的现代化海军。"


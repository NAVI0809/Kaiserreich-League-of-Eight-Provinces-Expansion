 ##外交事件
 china_events.428.t: "中国寻求加入协约国"
 china_events.428.d: "自一战落幕，协约国退守北美与北非以来，我们始终在寻找能牵制德国与工团势力的盟友——而统一后的中国，正是这样的潜在伙伴。多年前，我们曾在北伐战争中暗中支持亲近我们的势力对抗亲德的北京政府，如今，这支力量已彻底统一中国，摆脱了德国与日本的经济控制。\n\n今日，中国大使正式致电渥太华（加拿大自治领）与阿尔及尔（法兰西共和国），请求以平等伙伴身份加入协约国。对我们而言，接纳中国意味着协约国在东亚获得重要立足点，可牵制日本与德国在远东的扩张；但反对者担忧，中国刚结束内战，国力尚未完全恢复，可能成为协约国的战争负担，且其对东南亚的领土诉求或与我们的殖民利益产生冲突。"
 china_events.428.a: "接纳中国，强化东亚防线！"
 china_events.428.b: "拒绝结盟，避免无谓负担！"
 china_events.429.t: "中国加入协约国！"
 china_events.429.d: "渥太华与阿尔及尔的复电终于抵达——协约国正式接纳我国为成员国！这一天，标志着中华民族彻底摆脱“东亚病夫”的屈辱标签，以平等身份跻身国际强权阵营。\n\n回想往昔，一战后协约国虽退守海外，却始终是对抗工团主义与德国霸权的重要力量。如今我们加入这一联盟，不仅能获得加拿大的工业援助与法兰西的军事技术支持，更能借助协约国的国际影响力，收回被德国占据的胶州湾、被日本控制的东北铁路权益。从今天起，中华儿女将与北美、北非的盟友并肩作战，共同粉碎帝国主义与激进革命的威胁，重塑公平的世界秩序！"
 china_events.429.a: "协约同心，共护世界和平！"
 china_events.430.t: "我们的协约国申请被拒"
 china_events.430.d: "协约国的复电击碎了我们的期待——渥太华与阿尔及尔以“中国国力未稳，恐拖累联盟”为由，正式拒绝了我国的加入请求。字里行间，我们仍能看到西方列强的傲慢：他们既想让中国牵制德国与日本，又不愿给予我们平等的伙伴地位，本质上仍是将中国视为“利用工具”而非“合作盟友”。\n\n一战后协约国虽失欧洲本土，却仍抱着殖民时代的旧思维，不愿承认中国作为东亚大国的事实。这场拒绝让我们彻底明白：无论何种阵营，若不能以平等相待，便不值得我们付出真心。中华民族的崛起，终究要靠自己的力量！"
 china_events.430.a: "西方偏见难改，中华当自强！"



 LEP_embers_of_democracy: "民主火烬灰冷"
 LEP_embers_of_democracy_desc: "民国的民主姑且算是幸存了，但也许这片土地本就不适合自由的存在。"
 LEP_weak_democracy: "民主软弱无力"
 LEP_weak_democracy_desc: "民国的民主饱受动荡、阴谋和信仰缺失之苦。也许我们还是应该选择一个强力的领导？"
 LEP_unstable_democracy: "民主动荡难安"
 LEP_unstable_democracy_desc: "民国的民主挺住了，尽管满是阴谋与丑闻，被左右两翼同时抨击，但民主依然挺立。"
 LEP_strenghtening_democracy: "民主日渐牢固"
 LEP_strenghtening_democracy_desc: "民国的民主从失败中吸取教训、茁壮成长，正变得越来越有价值、越来越值得信赖。不要让民主夭折。"
 LEP_strong_democracy: "民主坚定不移"
 LEP_strong_democracy_desc: "人民不光相信我们的民主制度，他们更相信专制统治必有尽头、民主政治必将存续。"
 LEP_genuine_democracy: "民主熠熠生辉"
 LEP_genuine_democracy_desc: "民国的民主得到了第二次机会，克服了一切困难，取得了胜利。我们终于摆脱了东亚病夫的名声，建立了真正的公民社会，并将从民主传统中汲取自豪感与力量。"
 LEP_guided_democracy: "民主铁腕掌舵"
 LEP_guided_democracy_desc: "民国的民主得到了第二次机会，这份机会太过宝贵，承担不起失败的风险。这一次绝不能让民主夭折——哪怕要让自由为之妥协。"

 #决议
 LEP_country_development: "国家发展"
 LEP_decision_xihu_expo: "举办西湖国际博览会"
 LEP_decision_xihu_expo_desc: "在西湖举办国际博览会，邀请国内外企业参展，以展示华东的市场潜力与文化魅力。通过博览会，吸引外资注入，同时提振国内商界信心。"
 LEP_decision_issue_bonds: "发行政府公债"
 LEP_decision_issue_bonds_desc: "通过发行长期公债，向民间资本与金融财阀筹集资金，以缓解财政压力。但若不能及时兑现，还本付息将成为未来的隐忧。"
 LEP_decision_seek_overseas_chinese_capital: "吸引华侨资本"
 LEP_decision_seek_overseas_chinese_capital_desc: "面向东南亚与美洲的华侨社团发出投资呼吁，鼓励他们将资金带回祖国，参与建设华东的工业与商业。"
 LEP_decision_bank_consortium: "组织银行财团"
 LEP_decision_bank_consortium_desc: "联合江浙财阀与地方银行，建立临时性财团，为政府项目注资。虽然会加深对私人资本的依赖，但短期内能缓解燃眉之急。"
 LEP_decision_reduce_expenditure: "削减政府开支"
 LEP_decision_reduce_expenditure_desc: "通过裁减部分冗余部门、延缓基建项目和压缩军费支出，以换取有限的财政喘息空间。这将引起军界和社会的不满。"
 LEP_jianghuai_coal_power: "开发江淮煤矿"
 LEP_gannan_tungsten_development: "扩建赣南钨矿"
 LEP_maanshan_iron_mine: "发掘马鞍山铁矿"
 LEP_revitalize_jingdezhen_porcelain_industry: "振兴景德镇陶瓷工业"
 LEP_decision_shangli_reservoir: "修建厦门上李水库"
 LEP_decision_shangli_reservoir_desc: "由陈嘉庚倡议修建的上李水库，既能保障灌溉，又能附设小型水电站，为厦门和集美地区的学校与居民提供稳定水源与电力，成为区域发展的基础设施。"
 LEP_decision_baimao_gate: "整修江苏白茆闸"
 LEP_decision_baimao_gate_desc: "白茆闸位于江苏，关乎太湖与长江水系的泄洪与灌溉。整修此处，不仅能防范水患，还能保障苏南农田的丰收，稳定粮食供给。"
 LEP_decision_jiangzhe_seawall: "加固江浙海塘"
 LEP_decision_jiangzhe_seawall_desc: "江浙沿海海塘自明清以来便是抵御风潮与海水倒灌的屏障。如今必须投入资源进行加固，以保护沿海城市与农田免于灾害。"
 LEP_decision_westlake_dredging: "疏通西湖"
 LEP_decision_westlake_dredging_desc: "杭州西湖不仅是风景胜地，也承担着区域排涝与蓄水之责。疏浚湖底、整修堤岸，将改善水利条件，并为旅游与市政建设提供契机。"
 LEP_political_consultation: "政治协商"
 LEP_negotiate_with_zhao: "与赵恒惕协商"
 LEP_negotiate_with_zhao_desc: "我们可以选择与湖南的民新社领袖赵恒惕进行谈判。通过强调民主与自治的理念，我们或许能够让湘系军阀承认新政府的正统，避免一场南北冲突。"
 LEP_contact_GXC: "拉拢联省政府"
 LEP_contact_GXC_desc: "陈炯明领导的广东联省派政权在理论上与我们强调的民主共和理念有一定契合。倘若通过政治让步与经济合作的方式加以拉拢，或许能实现和平统一南粤。"
 LEP_decision_persuade_sichuan: "联系四川自治政府"
 LEP_decision_persuade_sichuan_desc: "启动对四川的全面游说行动：以经济援助、铁路与教育项目作筹码，同时同时与川中军政要人开展高层会谈，分化保定系与军官系，争取军官系或温和派接受与华东的松散结盟。"
 LEP_decision_contact_kunming: "说服唐继尧"
 LEP_decision_contact_kunming_desc: "派遣特使与昆明当局接触，表达华东政府的结盟诚意并商讨联省合作的具体条件。重点承诺尊重滇地自治、保障少数民族事务与地方人事，尝试以政治让渡换取滇军的名义归附与经济合作。"


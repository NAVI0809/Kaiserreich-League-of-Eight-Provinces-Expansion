 LEP_social_liberal_party_new: "自治同志会"
 LEP_social_liberal_party_new_long: "自治同志会\n§L自治同志会是在八省内战后重新崛起的联省派政治力量，其前身为浙江自治运动。随着齐燮元的倒台与工商联的政变成功，原本在浙江省扎根的地方宪政派与知识分子团体抓住时机，联合江浙各地的地方绅商、学者和学生社团，改组为跨区域的“自治同志会”。\n\n这一组织自诩为华东新政府的“政治灵魂”，强调以省为单位的分权自治，反对任何形式的军阀专制。褚辅成作为运动的领袖，以其在知识界与金融界的双重声望，成功将地方主义转化为新政权的重要合法性来源。\n\n然而，自治同志会与工商联的关系并非完全融洽。尽管二者在反对军阀统治与强调契约政治方面达成一致，但在国家的未来方向上仍存分歧：是建立一个真正的民主共和国，还是维持由商团与实业家主导的有限政治？这一矛盾注定将在未来的华东政坛上继续发酵。§!"
 LEP_social_conservative_party_new: "华东工商联合会"
 LEP_social_conservative_party_new_long: "华东工商联合会\n§L华东工商联合会是由江浙商团、地方实业家与商会领袖联合组成的政治联盟，其核心领袖为荣宗敬。作为工商联政变的直接策划者与最大受益者，联合会在新生的华东临时民主政府中迅速取得了举足轻重的地位。\n\n联合会的政治理念以“秩序与繁荣”为核心，强调由商团与金融资本主导国家发展，避免军阀的武力政治再度回潮。他们主张有限度的宪政改革与渐进式工业化，并通过商会体系来维持社会稳定。\n\n然而，这一新兴的统治集团也并非毫无争议。诸省自治运动的知识分子批评他们过于保守，将商业利益置于民主理想之上；工人团体则指责他们不愿让步于劳工权益。即便如此，凭借遍布江南的庞大经济网络与对政权财政的把控，华东工商联合会依旧是新政府最坚固的支柱之一。§!"
 LEP_Old_PSC_party_new: "政学系"
 LEP_Old_PSC_party_new_long: "政学系\n§L政学系是北洋国会时代遗留下来的一个独特派系，其根源可追溯至1913年二次革命失败后拒绝向孙中山效忠的同盟会员。最初，他们以欧事研究会的名义活动，强调宪政程序与实用外交，1916年正式组建为政学系。在随后动荡的岁月中，他们选择拥抱选举政治与议会博弈，而非孙中山的武力讨袁与护法运动。\n\n然而，随着南北军阀的激烈角逐，政学系逐渐被边缘化。孙中山在陈炯明与滇系支持下击败了岑春煊、陆荣廷与顾品珍，旧政学系瞬间土崩瓦解。唯一的短暂复兴是1924年北京政变后的过渡政府，由黄郛出任总理，但很快便在军阀与列强的夹缝中夭折。\n\n在工商联政变推翻齐燮元的旧秩序后，黄郛南下南京，以“重建宪政”为号召，再次整合散落各地的旧政学系人士与新式知识精英。他们宣称自己既不同于军阀的暴力统治，也有别于商团的赤裸利益，而是以学理与政治经验为基础，代表中产阶级、金融界与专业官僚的声音。\n\n政学系在华东临时民主政府中重新占据一席之地，但他们能否真正塑造一个稳定的宪政框架，还是仅仅充当工商资本的陪衬角色，仍是一个未知数。§!"
 LEP_people_salvation_association: "人民救国会"
 LEP_people_salvation_association_long: "中国人民救国会\n§L中国人民救国会成立于南方政局剧烈变动之后，其前身为中国民主政团同盟在华东、华南各地的分支网络。七君子事件传开后，南方舆论迅速升温，原有组织内部围绕行动方向与组织形式的分歧不断扩大。南京方面多次召集学界、商界与地方团体代表会商对策，在一系列座谈与协商之后，决定对原有结构加以整合，另组新团体，以集中力量应对时局。\n\n新组织以“各界联合”为基本原则，吸纳知识分子、工商界人士、工会成员及地方团体参与，试图在既有社会网络之上建立一个更具行动力的协作平台。其章程强调反对贪污腐败，主张整饬吏治，同时提出在制度范围内保障劳工权益，以缓和社会矛盾并维持生产秩序。相较于此前较为松散的同盟结构，救国会在组织上更趋集中，各地分会通过统一名义开展活动，彼此之间的联系亦更为紧密。\n\n在对外关系上，中国人民救国会明确与南京的新政权保持协调立场。其成员多参与地方协商机构或相关社会组织，使其主张得以在政策讨论中获得表达空间。与此同时，救国会仍保留一定的独立性，通过报刊、演说与社团活动持续发声，推动其所倡导的廉政与社会改良议题。\n\n随着各地分支陆续改组完成，原中国民主政团同盟在南方的架构逐渐退出历史舞台。中国人民救国会取而代之，成为联结多方力量的重要平台，其影响亦随南京政局的稳定而逐步扩大。§!"
 LEP_ZZH_party: "民主科学社"
 LEP_ZZH_party_long: "民主科学社\n§L民主科学社是在全国局势逐步稳定之后，由原“自治同志会”改组而成的正式政党。其政治渊源可追溯至浙江自治运动与八省内战后的联省派复兴。在齐燮元倒台与地方军阀势力瓦解后，原本活跃于江浙地区的地方宪政派人士、学界精英与绅商团体逐步走向联合，最终以制度化政党的形式重整旗鼓，成立“民主科学社”。\n\n民主科学社自诩为新共和国的制度建设者，强调在统一框架下实行省级自治，主张通过法律与议会程序规范中央权力，避免军人干政与个人专断。褚辅成凭借其在知识界与金融界的影响力，推动该社从区域性的自治联盟转变为全国范围内的宪政力量，使其成为重建时期的重要政治参与者。\n\n褚辅成将其领导的民主科学社定位为以理性政治与制度建设为核心的政党力量，倡导科学治理、地方自治与议会监督并行的发展路径。围绕国家重建、财政整合与军政改革等议题，该社主张在宪政框架内稳步推进改革，通过制度化协商与法律程序塑造新的政治秩序。§!"
 LEP_ZZH_party_long_fake: "民主科学社"
 LEP_JNSB_party: "工商勇进党"
 LEP_JNSB_party_long: "工商勇进党\n§L工商勇进党是在华东政局稳定与全国统一进程推进之后，由原江南商帮为核心改组而成的全国性政治组织。其成员涵盖长江下游传统商会势力、民族银行家、铁路股东与实业集团，并逐步吸纳华北、两湖与西南的新兴企业团体。由地方性商帮联盟发展为制度化政党，工商勇进党旨在以工商业界的整体利益为基础，参与共和国的重建与政策制定。\n\n该联合会主张以市场秩序与契约精神为国家治理的根本原则，强调减税、放松管制与保护民族资本，反对过度集中的国家干预与高额军费开支。在财政与产业政策上，他们倡导恢复商业信用体系，整顿币制与金融市场，并通过私人资本推动交通、能源与轻工业的发展。\n\n以荣宗敬为代表的工商界领袖在多个地区商会与行业团体的支持下，推动联合会形成统一纲领，使其成为重建时期不可忽视的经济力量。工商勇进党将自身定位为代表民族资本与城市社会的政治组织，主张在稳定秩序与保障产权的前提下推进工业化与商业扩展。§!"
 LEP_JNSB_party_long_fake: "工商勇进党"
 LEP_ZXX_party: "国民党(政学系)"
 LEP_ZXX_party_long: "国民党（政学系）\n§L国民党（政学系）承袭北洋国会时代政学系的政治传统，其思想渊源可追溯至1913年二次革命失败后拒绝诉诸武力路线的一批同盟会员。早年他们以“欧事研究会”为纽带，强调议会政治、宪政程序与理性外交，并于1916年正式形成政学系这一独特派系。在军阀纷争与护法浪潮交替的年代，他们始终坚持通过选举与国会博弈推动国家前进，而非依赖军事动员与个人权威。\n\n随着北洋秩序的崩溃与连年战乱的扩散，政学系逐渐淡出权力核心。1924年北京政变后的过渡政府虽曾短暂由黄郛出任总理，但未能在军政夹缝中站稳脚跟。其后多年，旧政学系成员散布政界、学界与金融界之间，保存着对宪政制度的信念与经验。\n\n在光复北京、中央政府重新确立之后，黄郛等人宣布以“恢复民元精神”为旗帜，将这一传统正式整合为国民党（政学系）。他们所倡导的“民元精神”，即民国元年确立的自由主义原则——责任内阁、政党竞争、保障公民权利、限制行政权力，以及以国会为政治核心的制度设计。\n\n国民党（政学系）将自身定位为共和国制度的重建者，主张在统一的中央权威下恢复议会政治常态，以法律与程序规范国家权力运行，使共和国回归其最初确立的宪政理想。§!"
 LEP_ZXX_party_long_fake: "国民党（政学系）"
 LEP_yi_you_club_party: "中工盟-益友社"
 LEP_yi_you_club_party_long: "中国工团主义者同盟—益友社\n§L德日两大强权在上海租界的冲突，使这座远东都会再次陷入动荡。工厂停摆、贸易受阻，大量城市青年职员与基层劳动者在混乱中失去了原有的生活保障。在旧有政治组织无法有效回应社会危机的背景下，以顾准为核心的一批左翼知识分子与职业青年活动家开始尝试建立新的群众组织，将分散于城市各行业的青年职员、技术人员与基层劳动者联合起来。\n\n中国工团主义者同盟并非传统意义上的工人政党，而是一个融合了工团主义、职业自治与社会改良思想的广泛联盟。其成员主要来自上海工商界基层、职业青年团体以及进步知识分子，他们相信现代社会的基础并不只在于传统的政治权力，更在于组织化的行业力量、自治团体以及受教育的城市公民。与强调阶级斗争的激进派不同，中工盟更倾向于通过工会、合作社、职业协会和地方自治组织逐步改造社会。\n\n益友社成为这一理念最重要的实践场所。最初作为职业青年的联谊组织，它通过夜校、图书馆、消费合作社、医疗服务和文化活动，将大量普通职员组织起来。在顾准等人的推动下，益友社逐渐发展为一种新的城市基层网络：它既关注劳动者的经济权益，也强调职业道德、知识教育与社会责任，试图塑造一种“现代公民”的身份。\n\n然而，中工盟内部始终存在张力。一部分成员受到国际社会主义运动影响，希望建立更彻底的社会革命体系；另一部分则更强调渐进改革、职业自治与民主合作。在这个饱受危机冲击的时代，他们必须证明，由普通城市青年与劳动者组成的组织，是否能够承担起改造国家的重任。§!"

 LEP_national_road_construction_plan: "全国道路建设计划"
 LEP_national_road_construction_plan_desc: "随着新政府的成立，交通部提出了统一规划全国干线公路的设想。在华东地区，首批重点项目将连接南京、杭州、南昌与福州，形成纵横交错的路网，以打通省际往来，方便物资与军队的快速调动。这一计划虽需大量资金，但其战略与经济意义无可替代。"
 LEP_professional_training: "专业培训"
 LEP_professional_training_desc: "通过建立职业学校、工人培训班和现代教育课程，我们能够培养大批掌握新式技能的工人和技术人员。他们不仅能提高工业产能，还能在社会中形成稳定的中坚阶层，为国家的长期发展提供坚实保障。"
 LEP_new_republican_army1: "新共和军"
 LEP_new_republican_army1_desc: "§L在旧军阀残部与地方部队的基础上，新政府组建了一支全新的常备军——新共和军。它既不同于北洋遗绪的杂牌，也有别于各地割据的土军，而是以现代化建制、统一指挥和共和精神为核心。尽管规模尚小、资源有限，但新共和军被寄予厚望：他们是护卫国家秩序的盾牌，也是共和国合法性的象征。随着训练、装备和制度逐步改善，这支军队将成为新政权最坚实的支柱。§!"

 league_military.1.t: "《国防计划书》"
 league_military.1.d: "随着民主政府的影响力扩展至全国，我们的合法性正不断得到各界承认，国际社会也开始重新审视这个新生的共和国。然而，庆贺统一的喜悦尚未散去，新的危机便已迫在眉睫。东北仍牢牢掌握在奉天军阀张作霖手中，数十万东北军严阵以待，其背后更有日本帝国源源不断的援助与支持。\n\n近几个月来，北方边境摩擦不断升级。自治军虽然奋勇作战，官兵士气高昂，但一次次交锋也暴露了共和国最严峻的问题：工业基础依旧薄弱，武器装备难以满足前线需求，动员体系迟缓低效，后勤运输更难以支撑长期作战。面对训练有素、装备精良的东北军，我军虽屡能顽强抵抗，却始终难以取得决定性的优势。\n\n更令人担忧的是，日本对中国统一事业的干涉正在不断加深。“共荣圈”的口号之下，扶植地方势力、渗透边疆地区、破坏共和国统一的行动从未停止。国际局势正迅速恶化，没有人能够保证下一场战争不会突然降临。如果共和国不能尽快完成国防建设，一旦危机全面爆发，我们将不得不在毫无准备的情况下迎战。\n\n日前，国防顾问委员会委员厉尔康将军与蒋百里将军共同向政府递交了一份《国防计划书》。厉尔康在《国防与物资》中系统论述了工业、资源与现代战争之间密不可分的关系，而蒋百里的《国防论》则深入分析了战略部署、国民动员与总体战的基本原则。二人的研究相辅相成，从工业布局、资源统筹到兵员征集、后勤补给，无不提出了详尽而切实可行的方案，为共和国建立现代国防体系提供了一份完整的蓝图。\n\n时间已经不站在我们这一边。面对东北军的威胁与日本帝国的步步紧逼，民主政府必须立即着手落实《国防计划书》的各项措施，加快建设现代工业，完善全国动员体系，整顿军队组织与后勤网络。唯有如此，共和国才能在即将到来的风暴中立于不败之地，并最终完成国家统一的伟业。"
 league_military.1.a: "立刻成立国防最高委员会"

 league_military.2.t: "造舰委员会：关于下一批舰艇的建造问题"
 league_military.2.d: "随着各项资源的到位与制度的完善，造舰委员会迎来了一个关键抉择：下一阶段的舰艇建造，究竟应优先追求数量，还是打造少而精锐的先进战舰？\n\n委员会认为，日海军曾在“丸二计划”与“丸三计划”中试图通过庞大的造舰规模迅速扩张实力，但过度追求大型舰艇与有限资源之间的矛盾，也为后续的战略困境埋下隐患。中国必须吸取这一教训，在工业能力、财政状况与战略需求之间取得平衡。\n\n为统筹未来海军建设，政府任命叶在馥为造舰委员会委员长，萨本炘为副委员长，负责规划新一轮舰艇建造方案。两位造船业的专家将带领委员会决定共和国海军未来的发展方向——是以数量弥补不足，还是以质量打造精锐舰队。"
 league_military.2.a: "打铁还需自身硬，质量优先！"
 league_military.2.b: "海洋属于拥有足够舰艇的一方"
 LEP_navy_ship_building_department_if_1_tt: "§L如果我们选择造舰质量优先:§!"
 LEP_navy_ship_building_department_if_2_tt: "§L如果我们选择造舰规模优先:§!"

 china_events.317.t: "南京民主政府统一中国"
 china_events.317.d: "谁能想到，1936年八省联合内战落幕不久，刚掌权的齐燮元便遇刺身亡，权力真空让南直局势再度崩塌。几乎没人相信，收拾乱局的会是南京工商联合会与地方自治派建立的同盟。\n\n这群掌控江南实业的商人，效仿辛亥革命南京共和旧例，建起带商业色彩的民主政府。他们以保障商产、畅通商路为纲，借华侨资本武装新军，一边拉拢地方势力，一边以共和号召民心，最终逆势统一全国。如今新政权立稳脚跟，有人赞这是商力救国的奇迹，也有人忧这商人主导的政府，未来能否扛住内忧外患。"
 china_events.317.a: "民望归心，共和一统"
 china_events.318.t: "民主与科学的胜利"
 china_events.318.d: "在长期的战乱与分裂之后，中国最终由一个出乎许多人预料的政治集团完成统一。以褚辅成为代表的民主科学社，在国家团结联盟内部逐渐取得主导地位，并随着全国统一而正式接掌中央政权。\n\n这个由知识分子、教育界人士与温和自由派构成的团体，并不像传统军阀那样依赖武力，也不同于激进革命者热衷于彻底改造社会。他们更强调宪政、教育与制度，希望以议会政治、地方自治与公共理性重建共和国秩序。许多民主科学社成员都曾经历民初政治的兴衰，对于军人干政与无序党争带来的混乱记忆犹新。\n\n如今，新政府正试图重新举起“德先生”与“赛先生”的旗帜，使这个饱经创伤的国家重新回到理性与法治的轨道之上。至于这种温和而审慎的道路，能否真正带领中国走向复兴，仍需时间给出答案。"
 china_events.318.a: "德先生与赛先生长存中华。"
 china_events.319.t: "政学系主导中国"
 china_events.319.d: "北京政变后的摄政内阁，不过是民国政坛上一段短暂插曲。当年很少有人会想到，那位曾短暂主持中央政务、试图维系共和国秩序的黄郛，竟会在多年后真正成为中国的统治者。\n\n如今，政学系已经在国家重建过程中取得决定性地位，这个由高级官员、专家学者、金融界人士与温和改革派组成的集团，更强调行政效率、制度运作与理性治理，希望以稳定而有秩序的方式推动国家现代化。\n\n黄郛早年投身革命，其经历横跨军人与文官、议会与内阁之间。正因如此，他始终相信，共和国更需要能够长期运转的制度与行政体系。\n\n在数十年的战火终于平息之后，一个属于“专家与绅士”的共和国，正在中华大地上缓缓成形。"
 china_events.319.a: "愿国家归于理性与秩序。"
 china_events.320.t: "商业共和国的建立"
 china_events.320.d: "在过去，商人往往只是军阀与政客之间被动周旋的一方。无论是兵灾战乱，还是苛捐杂税，都使民族工业的发展举步维艰。然而如今，随着全国统一，一个由工商界主导的新政府终于在南京建立。\n\n以荣宗敬为代表的工商联合会，汇集了江浙财团、民族资本家、银行界人士与城市实业团体。在他们看来，中国积贫积弱的根源，在于金融失序与市场破碎。\n\n荣宗敬早年以纺织与面粉工业起家，与其弟荣德生一同建立起横跨江南的实业体系。在长期动荡之中，这位“面粉大王”始终主张以实业救国，并认为国家应保障企业经营与市场秩序，而非任由政治斗争摧毁经济基础。如今，这种理念终于随着工商联合会的上台而成为国家政策的核心。"
 china_events.320.a: "实业方能救中国。"
 china_events.321.t: "人民救国会领导中国"
 china_events.321.d: "人民救国会的前身，原本只是由左翼知识分子与爱国人士组成的松散联盟。他们曾反对租界特权，抨击军阀腐败，也批评旧式政党对民众疾苦的漠视。七君子事件后，大批自由派与进步人士流亡南方，在这种背景下，南方的民主政团支部被重新整合，最终形成了今日的人民救国会。\n\n救国会更加重视社会改革与公共动员。他们主张保护劳工权益、扩大教育、限制官僚腐败，并希望通过工会、学校与地方团体建立新的社会基础。\n\n如今，历经多年战乱之后，一个由知识界与社会改革派主导的新中国终于出现。街头上的标语已经逐渐褪色，但那些曾在动荡年代里高喊“救国”二字的人，终于真正站到了共和国的中央。"
 china_events.321.a: "国家属于人民。"
 china_events.322.t: "景星会引领中国"
 china_events.322.d: "随着全国统一完成，以厉麟似为代表的景星会正式成为共和国新的主导力量。这个由留学生、外交官、青年官僚与知识分子组成的政治团体，长期活跃于南京政府内部，主张以理性、秩序与技术重建国家。\n\n景星会最初便与德国学界及工业界保持密切往来，其成员大多推崇德国式的行政效率、教育体系与国家组织能力。在他们看来，中国过去数十年的混乱，并不仅仅源于贫弱，更在于国家机器的失序与公共精神的崩坏。因此，新政府强调建立专业文官体系、扩张高等教育，并推动科学研究与工业技术的发展，希望以一种更现代、更高效的方式完成国家建设。"
 china_events.322.a: "以理性与秩序重塑中国。"

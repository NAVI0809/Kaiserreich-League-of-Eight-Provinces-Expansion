  ##各路线事件
 league_endgame.1.t: "德先生与赛先生的国度"
 league_endgame.1.d: "从晚清监生到东洋大学的讲堂，再到风云激荡的议场与省政机关，褚辅成走过的道路，几乎与近代中国的每一次转折相互交织。留日期间投身光复会与同盟会，使他最早接触到以制度与思想改造国家的理念；辛亥之际参与光复浙江、出任民政长，又让他直面新政权建立的艰难与可能。此后无论是在国会中反对专断，还是拒绝参与贿选、南下护法，他始终立于动荡之中，却不以权术自持，而以议政与制度为依归。\n\n这一脉络延续至新的时代。民主科学社的出现，并非凭空而来，而是这些经验的积累与延展。它既承接了早年议会政治的理想，也吸收了知识界对于科学与理性的追求。教育、研究与公共事务之间的界限逐渐松动，学术机构不再只是清谈之所，而成为参与国家治理的一环。地方行政与中央决策之间，开始引入更为公开的讨论与更为细致的调查，使政策不再仅凭意志，而有据可循。\n\n褚辅成一生所经历的拘捕、流离与再起，也在这一体系中留下痕迹。对于权力滥用的警惕，使制度设计更强调制衡与程序；对民族危机的记忆，则促使这一新秩序在开放之余仍保持凝聚。正如他曾在战时主张抗争、在危局中庇护流亡者，这一政权同样试图在理性与责任之间取得平衡。\n\n这样的国家并不喧嚣。它的变化体现在议事规则的修订、课程的扩展、以及一项项被反复讨论的政策之中。民主与科学不再只是口号，而逐渐成为日常运作的基础。前路仍然漫长，旧习尚未完全消散，但一种不同于往昔的秩序已经成形——它源自个人的经历，也超越了个人的生命，在更广阔的社会之中延续开来。"
 league_endgame.1.a: "民主与科学在此生根"

 league_endgame.2.t: "政学之间"
 league_endgame.2.d: "局势甫定，旧日以兵力与权术维系的政治渐次退去，一种更为审慎而克制的风气开始在中枢蔓延。议事不再急于定夺，章程与报告反复修订，数字与调查被置于案头之上。政务的节奏变慢了，却也因此多了几分可循的轨迹。\n\n黄郛的名字，常被置于这种转变之中提起。他早年历经军旅与革命，亦曾身处北京政变后的权力核心；摄政内阁那段短暂的施政经验，留下的不是声势，而是对于“如何使国家运转下去”的反复思考。此后辗转政界与学界之间，所见所感逐渐汇聚成一种取向：政务需有学理支撑，而学问亦应服务现实。\n\n这一思路并未停留于个人层面。围绕着类似理念形成的群体，逐渐被称作“政学系”。他们不以激烈主张自显，而更强调制度的搭建与经验的累积。参政院汇集各界意见，经济会议统筹财用与产业，研究机构与行政机关之间往来日密。政策的形成过程变得漫长，却也更少出于一时兴起。\n\n地方与中央之间的关系亦在重整。层级划分趋于清晰，权责不再反复推诿；市政建设与实业调查被纳入统一规划，原本零散的事务逐步串联成体系。议会之中，争论仍在继续，却不再轻易流于空泛对峙，多数与少数之间形成某种可被维持的分寸。\n\n这种秩序并不耀眼。它没有突如其来的胜利，也缺乏激动人心的宣言，只在日复一日的运作中显现成效。公文、预算、调查、讨论，这些看似琐碎的环节，构成了国家新的骨架。对许多人而言，这或许显得迟缓而不够果断，但正是在这样的节奏中，政权逐渐摆脱反复更迭的阴影。\n\n前路仍未明朗。社会习惯尚在调整，制度亦需不断修补。然而，一种立足于政与学之间的治理方式，已经开始稳定运转。它不依赖一时之人，也不寄望骤变之机，而是在持续的修正与积累中，尝试为这个国家找到一条可以长久延续的路径。"
 league_endgame.2.a: "儒将凯旋"

 league_endgame.3.t: "从“打工”到“大王”"
 league_endgame.3.d: "几十年前，一个瘦弱的江南少年背着铺盖，乘着往返沪锡的慢船抵达上海十六铺。没人会想到，这个在铁锚厂里烧水扫地、给老板跑腿的学徒，有朝一日竟会成为统一中国后的国家领袖。\n\n荣宗敬始终记得自己第一次踏入上海时的景象。洋行林立，码头喧嚣，汇丰银行门前铜狮高踞，租界巡捕耀武扬威。对于那个来自无锡荣巷的少年而言，大上海既陌生又令人目眩。后来，他进入源豫钱庄学徒，每日练习算盘、记账与汇兑，从一个跑腿少年逐渐成长为精明干练的钱庄经理。\n\n再后来，他与弟弟荣德生一道投身实业。从茂新面粉厂，到福新、申新诸厂，荣氏兄弟一步步建立起属于中国人的工业体系。面对外国资本与日商纱厂的扩张，荣宗敬始终坚持扩大机器设备、更新管理制度，并不断兼并旧厂、引进最新式纱锭。他尤其重视西方现代企业制度与工厂管理方式，大量聘请专业经理人、建立统一财务与生产体系，并以效率与规模化经营闻名上海工商界。在荣宗敬看来，中国若不能拥有自己的工厂、机器与现代化管理制度，所谓独立与富强终究只是空话。\n\n八省混乱爆发后，荣宗敬原本并不打算涉足政治。他更愿意做一个置身政坛之外的“办厂人”，为南京政府提供资金、贷款与工业支持，希望维持一个能够让民族资本生存下去的稳定秩序。然而随着军阀混战、党争倾轧与财政崩溃愈演愈烈，这位“面粉大王”逐渐意识到：若国家本身无法恢复秩序，再庞大的工厂也终究会沦为废墟。\n\n如今，新的政府宣布优先恢复金融秩序、统一全国市场、扩建铁路港口，并以国家力量扶持民族工业。曾经战火不断的长江流域，如今再次响起机器轰鸣与汽笛声。\n\n有人称赞荣宗敬完成了“实业救国”的梦想，也有人担忧这个国家正逐渐变成资本家与银行家的共和国。但无论如何，人们都不得不承认：那个曾在上海街头替人扫地、连饭都吃不饱的学徒，最终真的从一个“打工人”，变成了执掌整个中国工业命脉的“大王”。"
 league_endgame.3.a: "机器的轰鸣声，将成为新时代的号角。"

 league_endgame.4.t: "从书斋到革命"
 league_endgame.4.d: "少年时代的马叙伦曾相信，救中国的办法在书本之中。西湖边的养正书塾里，他从《天演论》《民约论》中第一次读到“民权”与“自由”；在陈黻宸等师长的影响下，他开始意识到，这个积贫积弱的国家早已不能再依靠旧制度苟延残喘。后来，他又在上海报界与章太炎、邓实等人往来，在《国粹学报》与《新世界学报》之间奔走呼号，希望以文字唤醒国人。\n\n辛亥革命后，马叙伦一度相信共和已然成功，因此重新投身教育事业，先后在北京大学与北京医学专门学校任教，并于五四运动期间积极组织学界运动。1921年，他临危受命出任浙江省立第一师范学校校长，护校风潮后重整校务。次年又短暂担任浙江省教育厅厅长，亲赴萧山、绍兴等地考察教育改革。这段经历使他逐渐意识到，教育与社会改革从来无法彼此分离，而一个腐朽混乱的旧中国，也绝非仅凭书斋中的理想便能够改变。\n\n此后的数十年里，马叙伦始终徘徊于教育、政治与社会运动之间。他曾担任教育部次长，也曾因为反对独裁与军阀而遭到通缉；他组织过救亡运动，也曾试图以议会与法治维系共和。然而一次次失败与动荡，让越来越多的人意识到：旧时代的中国，绝不会因为少数士大夫的良知而自动改变。\n\n黄如今，随着人民救国会取得胜利，新的政府宣布扩大普及教育、推动地方自治、保障言论与结社自由，并开始建立更广泛的社会动员体系。许多人相信，马叙伦真正想实现的，并非某种激进革命，而是一个能够让普通人拥有尊严、知识与参与权利的共和国。\n\n黄但所有人也都明白，中国的问题从来不会因为一场胜利便彻底结束。军阀的阴影尚未远去，贫困与文盲依旧遍布乡村，而这个饱经战乱的国家，也仍需要时间去学习如何真正成为一个现代共和国。只是至少现在，那个曾经在西湖边读书、在北大讲课、在街头抗议的书生，终于能够亲手去实践他相信了一生的道路。"
 league_endgame.4.a: "绝知此事要躬行"

 league_endgame.5.t: "景星之下"
 league_endgame.5.d: "“景星”者，古人所谓“德星”也。传说唯有天下太平、政治清明之时，方有景星现世，因此历来被视作贤才汇聚与盛世将临的象征出身杭州书香世家的厉麟似，自幼便在国学与家学熏陶中成长。他曾在德国与日本求学多年，亲眼见证了西方工业国家如何依靠科学、教育与严密的组织体系完成国家建设。与许多单纯崇拜西方制度的留学生不同，厉麟似始终认为，中国的问题并不在于文化本身，而在于国家机器早已腐朽失能。只有将中国传统文化中的纪律、责任与家国观念，同现代工业国家的技术体系结合起来，才能真正实现民族复兴。\n\n二十年代，他在德国创立景星学社，推动“中学西播”，向欧洲介绍中国哲学与艺术；而回国之后，他又开始思考另一件事——如何将西方的工程技术、行政体系与现代教育重新引入中国。他曾长期推动中德文化交流，也因此逐渐形成了一套属于自己的理念：国家不应被无休止的党争与地方纷争拖垮，而应由受过良好教育、具备专业能力与国家意识的技术官僚来主导建设。\n\n如今，新的政府宣布扩大工业投资、建立全国性的技术教育体系，并全面推动国家基础设施现代化。大批工程师、学者与技术人员被吸纳进入政府机构。与此同时，景星会也继续扩大与德国学界和工业界的合作，希望借助欧洲先进经验，在最短时间内完成中国的工业化与国家整合。\n\n取而代之的，是一种前所未有的“技术国家”正在形成。铁路、电力、钢铁、化工与教育体系被统一纳入全国规划，大批留学生与专业人才被鼓励进入政府与企业部门。对于许多经历过长期混乱的人而言，这种稳定而高效的新秩序，似乎终于让他们第一次看见了“中国能够真正现代化”的希望。\n\n而对于厉麟似而言，他毕生所追求的，从来不仅是文化交流本身。无论是在柏林的讲坛、上海的协会，还是今日这个重新统一的国家里，他始终相信：真正的民族复兴，必须建立在知识、技术与秩序之上。"
 league_endgame.5.a: "泰山北斗，景星庆云"
 
 ##通用
 league_generic.1.t: "道阻且长"
 league_generic.1.d: "在经历了数月的激烈争论与明争暗斗之后，全国国会终于勉强拼凑出一个能够维持多数的执政联盟。各党派在席位分配、内阁人选以及施政纲领上反复拉锯，最终达成了一项脆弱而充满妥协的协议。新一届政府宣告成立，似乎标志着全国政治秩序迈入了一个“宪政常轨”的新阶段。\n\n然而，这份来之不易的平衡从一开始便显得岌岌可危。国会内部山头林立，各派议员各执一词，法案往往在冗长的辩论中被不断拖延甚至搁置；而内阁之中，不同派系的部长彼此掣肘，使得本应统一执行的政策频频出现偏差。政令不出中枢，地方阳奉阴违，行政效率日益低下，国家机器仿佛陷入了一种迟滞而混乱的状态。\n\n这种混乱迅速传导至社会层面。原本对“民主共和国”寄予厚望的民众开始感到失望与困惑：他们所期盼的稳定与繁荣迟迟未能到来，取而代之的却是无休止的争吵与权力斗争。一时间，舆论之中开始出现怀疑的声音——或许中国并不适合这种舶来制度？甚至有人公开怀念起过去北洋时代那种“虽不自由，却有秩序”的威权统治。\n\n更令人不安的是，一些极端政治势力正悄然借机壮大。无论是鼓吹强人政治的秘密结社，还是以激进民族主义为号召的青年团体，都在这片失望与不满的土壤中迅速滋生。他们指责议会的无能，抨击民主的软弱，并暗示唯有非常手段方能拯救国家。\n\n新生的共和国尚未站稳脚跟，便已面临信任危机。民主的理想仍悬于空中，而现实却在无声侵蚀着它的根基。"
 league_generic.1.a: "民主的道路，注定不会一帆风顺"
 league_generic.2.t: "紊乱的国计"
 league_generic.2.d: "统一的完成并未如人们所期望的那样立即带来繁荣，相反，全国范围内的经济秩序正陷入一片混乱。长期的军阀割据使各地形成了彼此割裂的财政体系与市场结构，如今在名义统一之下，这些差异却并未随之消失，反而在中央与地方的反复博弈中愈发尖锐。\n\n各省财政状况参差不齐，有的尚能维持运转，有的却早已入不敷出。中央政府试图推行统一的税制与预算体系，却遭到地方势力的消极抵制甚至公开反对。税收征管混乱，财政收入难以稳定，国家机器的运转因此时常陷入窘境。\n\n与此同时，战后经济的恢复亦举步维艰。交通线路尚未完全修复，商业网络支离破碎，物资流通受阻，城乡之间的供需失衡日益严重。工商业者在动荡中观望不前，投资意愿低迷，而部分投机势力则趁机囤积居奇，加剧了市场的不稳定。通货问题也开始显现，各地货币流通标准不一，信用体系薄弱，进一步削弱了经济活力。\n\n更为复杂的是，政治纷争同样影响着经济决策。不同派系在财政与产业政策上各执一词，使得改革措施难以持续推进。国家既缺乏统一的长远规划，又难以在短期内建立有效的调控机制，结果便是政策反复、执行乏力，令本已脆弱的经济雪上加霜。\n\n在这样的背景下，民众的生活压力不断上升，对新政府的不满情绪也在悄然积累。统一带来的并非立竿见影的富强，而是一段充满阵痛与不确定的过渡时期。若无法尽快恢复经济秩序，共和国的根基恐将动摇。"
 league_generic.2.a: "国家虽已统一，经济却仍四分五裂"
 league_generic.3.t: "新军旧影"
 league_generic.3.d: "随着全国统一的完成，新政府迅速着手整编各地军队，试图建立一支属于共和国的“国民军”。然而，这项宏大的计划从一开始便困难重重。旧日军阀部队的残余尚未彻底消散，各地部队仍保留着浓厚的派系色彩与旧式军纪，军官与士兵之间更多维系于私人关系与旧日忠诚，而非对国家的认同。\n\n为了应对不断扩大的防务需求，政府不得不大规模征募新兵。短时间内涌入的大量兵员虽然在数量上填补了空缺，但训练不足、素质参差的问题也随之暴露。新兵缺乏基本的军事素养，而老兵则习气难改，整编后的部队表面统一，实则内里松散，难以形成真正的战斗力。\n\n更为棘手的是，政治上的纷争也逐渐渗入军中。不同派系的政客试图在军队中培植影响力，部分军官暗中依附特定党派，甚至将部队视作自身政治筹码。对于普通士兵而言，他们曾经效忠的对象往往是某位将领或某个派系，而非抽象的“国家”或“宪法”。如今在新的政治格局下，他们既不清楚应当支持哪一方，也不明白自己是否应当保持中立。\n\n这种迷茫与分裂，使得军队内部潜藏着不稳定的暗流。指挥体系时常受到干扰，纪律执行亦难以贯彻，一支本应保卫国家的力量，反而成为了政局动荡的延伸。若不能尽快完成真正意义上的军队国家化，这支“新军”恐怕难以承担共和国的重任。"
 league_generic.3.a: "这支军队，还远未准备好承担国家的未来"

 league_generic.5.t: "杂牌将军"
 league_generic.5.d: "随着八省联军正式改编为国民自治军，南京方面也开始着手推动军队正规化与统一化建设。长期以来，各部队因来源复杂、派系林立，武器装备、训练方式乃至指挥体系都大相径庭，许多军官甚至仍保留着旧式军阀部队的作风。如今南京政府希望通过统一训练大纲与现代化演习，逐步建立一支真正意义上的国家军队。\n\n近日，国民自治军于镇江附近举行了一场大规模联合军事演习，数个师旅参与其中。一名并不显眼的军官意外引起了各方注意——黄百韬。演习中，负责“守军”指挥的黄百韬面对兵力与火力皆占优势的进攻部队，并未拘泥于传统防线部署，而是主动放弃外围阵地，将主力隐藏于交通节点与侧翼高地之间。他命令部队利用夜间机动不断袭扰“敌军”补给线，同时故意暴露部分薄弱区域，引诱对方主力深入。待进攻部队完成突破后，黄百韬又迅速集中预备队展开侧击，最终成功完成了一场近乎教科书式的反包围。演习结束后，不少观察员都承认，若换作实战，这种打法足以让多数部队陷入混乱。\n\n更令人惊讶的是，这位在演习场上一鸣惊人的军官，并非出身于任何嫡系派系。黄百韬祖籍广东嘉应州，却生于天津，少年时期家境贫寒，从传令兵一路摸爬滚打升至军官。李纯死后，他长期辗转于苏浙军界之间，也因此被不少人戏称为“杂牌将军”。1925年奉军南下时，张宗昌曾试图招揽这位旧日学生，但黄百韬最终仍选择留在江南。如今看来，这位“杂牌将军”或许正是国民自治军中少有真正懂得现代战争的人。"
 league_generic.5.a: "好小子，可别丢了份儿"
 LEPEXP_huang_baitao_unitleader_tt: "§Y黄百韬部§!§O（浙军步兵第41师）§!将会接受来自南京的调令。"
 
 league_generic.6.t: "海军？陆军？"
 league_generic.6.d: "王萼作为马尾要塞司令，在华东混战期间并未参战，国民党也没有攻击马尾要塞，因此陆战队第一混成旅成为了联合为数不多毫发无损的部队。\n王萼作为在浙军服役的浙江人，同时和闽系海军群体保持着良好的关系，通过这层关系，他在马尾服役的十年间成果颇丰，不仅扩编了1个陆战营，还聘请来自德国和日本的陆战队退伍军官担任教官，新建了一个特务营。\n\n尽管各种迹象都表明他没有地方军阀化的想法，但是多年前的杨砥中案还是为王萼的前途蒙上了一层阴影，随着指挥权的进一步集中，王萼所部将听从中央调令。"
 league_generic.6.a: "无论怎讲，不要再有像杨砥中这样的悲剧了"
 LEPEXP_wang_e_unitleader_tt: "§Y王萼部§!§O（马尾陆战队第一混成旅）§!将会接受来自南京的调令。"

 league_generic.7.t.LEP_liu_qingeng: "刘庆恩的半自动革命"
 league_generic.7.d.LEP_liu_qingeng: "在军中，刘庆恩将军的名字总是与先进装备联系在一起。这位出身四川的老将身上有着一种出生军阀的将军们所不具备的纯粹————即对先进武器装备如饥似渴的追求。虽然年事已高，但他从未放松过武器研发。\n\n在近期，刘将军的回收队又缴获了一批敌军武器装备，而这些战利品将马上转换为技术优势服务于我军。"
 league_generic.7.a: "刘将军为了中国军工发展真是鞠躬尽瘁啊。"
 
 league_generic.7.t.LEP_huang_baitao: "杂牌将军不杂牌"
 league_generic.7.d.LEP_huang_baitao: "很少有军官能像黄百韬这样，在多个截然不同的军事体系中都证明了自己的卓越。虽然他出身草根且履历繁杂，但是在战场上他不仅是一名胆识过人的前线指挥官，更是一位埋头苦干的学习者。他总能从敌人身上学到现代战争最严密最重要的逻辑，他也敢于到一线与士兵们在同一个战壕内指挥战斗。\n\n在许多军中老油条眼里，黄百韬或许显得过于鲁莽，甚至有些不要命，但正是这种敢打敢拼吃苦耐劳的精神，让他在同龄军官队伍中脱颖而出。"
 league_generic.7.b: "刘宗纪参谋长应该给他发一个一吨重的奖章！"
 
 league_generic.8.t: "旧式军人"
 league_generic.8.d: "在南京的军政圈子里，厉尔康的名字并不张扬，却总会在谈及军学与训练时被人提起。这位出身钱塘书香世家的军官，自幼受传统教育熏陶，又早年东渡日本，接受严格的近代军事训练，既能引经据典，也熟悉现代兵制，在一众武人中显得颇为独特。\n\n他曾与孙传芳、阎锡山等人为同学，在士官学校中经历严苛的二等兵训练，养成了对纪律近乎苛刻的态度。归国后进入禁卫军任职，负责守护颐和园与武库，这段经历让他深知旧式军队的弊病。辛亥变局时，他悄然离开旧职南下投身新军，以教官身份参与训练军官，但很快便因不满学生急功近利而辞去职务，转而在各地陆军学堂与讲习所任教，强调基础、秩序与军纪。\n\n此后数十年间，他辗转于参谋、训练、编译与军政机构之间，既主持军学译著，又参与军制研究，留下《国防与物资》《青年军事训练敎程》等著作。外界对他的评价往往两极：有人认为他是坚守专业的军学派，也有人觉得他过于执着旧式操典，与政治浪潮若即若离。\n\n至三十年代中期，这位已授中将军衔的军人仍频繁出入各类军事机构，以顾问与编审身份参与讨论。从禁卫军时代走来的经历，使他对权力与纪律保持一种冷静距离，也让他在动荡年代中显得格外“老派”。或许正因如此，当新的政治秩序逐渐成形时，人们再次想起这位沉默而严谨的军学家——他既不是高声呼号的将领，也不是纯粹的学者，而是那个在纸页与操场之间反复往返的旧式军人。"
 league_generic.8.a: "向老将致敬"
 LEPEXP_li_erkang_unitleader_tt: "§Y浙江武备学堂下属§!§O（浙江武备学堂教导师）§!将会加入作战序列。"

 league_generic.9.t: "刘氏自装枪定型"
 league_generic.9.d: "在经过了几十年的设计与工艺改进后，刘氏自装枪的生产问题总算得到了解决，枪口的集气装置被一个简单但是可靠的导气孔替代，机匣后部原本裸露的机构被一个机匣盖保护，固定弹仓被改成了可拆卸弹匣，可以兼容ZH-29和ZB-26的弹匣。现在各个兵工厂总算可以开足马力生产了，这支可靠且火力强大的步枪很快就会被下发到每一位士兵手中。\n\n刘庆恩在这期间受到缴获的勃朗宁自动步枪的启发，在结合了刘氏自装枪的经验后研发了刘氏自动步枪，这款自动步枪的重量比BAR更轻，而且还可以使用30发弹匣，由于国内工业能力的提升与充足的战场实验数据，这款自动步枪的生产列装比它的前辈顺利多了。"
 league_generic.9.a: "刘将军奋斗半生的目标终于实现了！"

 league_generic.12.t: "大炮开兮"
 league_generic.12.d: "作为参与过辛亥革命与护法战争的老资历，施北衡在历次战斗中都充分意识到了未来的战争就是一场炮兵对决。虽然八省联合成立后。施北衡大多是时间都在军校而不是前线，但是他丝毫没有放松对炮兵战术的研究，他穿梭与讲台和靶场之间，编撰出了新式炮兵操典，并且前往德国尝试采购野战炮以装备给步兵团使用，虽然最后因为资金不足只购得一批世界大战期间的军剩火炮，但是在与金陵兵工厂的刘庆恩将军的协助下，还是成功凑出了浙江炮兵镇。\n\n随着华东混战的结束，总参谋部意识到了团属炮兵火力的重要性，在施北衡将军的疏通下，新的调整师编制获得了两个师属炮兵营，虽然火炮没能配到步兵团，但是施北衡明白这只是时间问题。"
 league_generic.12.a: "炮会有的，更大的炮也会有的"
 LEPEXP_shi_beiheng_unitleader_tt: "§Y施北衡部§!§O（新编第15师）§!将会加入作战序列。"
 
 league_generic.13.t: "农民将军"
 league_generic.13.d: "在浙江军人之中，邢震南的出身显得不那么显赫。作为农民的儿子，他从小就吃苦耐劳，并且在1908年很争气的考入浙江陆军小学堂，其父虽然囊中羞涩但还是支持儿子从军，邢氏也不负众望升入南京陆军中学，并参与了辛亥革命，随后在北京清河陆军中学与保定军官学校第二期步兵科学习，毕业后返浙从见习排长做起一路升为师长。\n\n在驻扎蚌埠期间，邢震南让秘书李洁天，负责筹办报刊《力行》，邢震南亲自兼任社长，还让包括国民党成员在内的爱国人士在报纸上面发表反租界文章。当时孙传芳的特务，认为《力行》报社“亲共”，每天都监视着报社，特务还扬言要杀了李洁天，邢震南就让李洁天回老家避避风头，但是坚持发布报纸。这一行为让邢氏在爱国群众与国民党中都有良好的口碑，但是引来了孙传芳的忌惮。\n\n现在，随着自治军的正规化，邢震南作为相对年轻且具备相应经验的将官得到升迁，这位饱受爱国人士尊敬的农民将军将会带着他的理想以及父老乡亲们的期盼走向保卫民主的战场。"
 league_generic.13.a: "愿他如以往一样不负众望"
 LEPEXP_xing_zhennan_unitleader_tt: "§Y邢震南部§!§O（浙军步兵第3师）§!将会加入作战序列。"

 league_generic.500.t: "新的旗帜"
 league_generic.500.d: "统一的号角终于响彻华夏大地。历经数十年的军阀混战、政治纷争与外敌侵略，中国人民终于迎来了久违的和平。无论是南方的自治运动，还是北方的统一战争，无数人为这个新生共和国付出了鲜血与牺牲。如今，随着制宪会议在首都召开，一个困扰共和国已久的问题再次摆在了所有代表面前——国家的旗帜。\n\n五色旗，这面曾飘扬于辛亥革命后的南京城头、象征五族共和理想的旗帜，再一次出现在会议厅内。支持者认为，恢复五色旗不仅是对亚洲第一个共和国传统的继承，更是向世人宣告：中国并非某一党派、某一集团的国家，而是属于所有民族与所有公民的共和国。它承载着褚辅成、沈钧儒等早期共和主义者曾为之奋斗的理想，也提醒着后人，民国的根基并非建立于武力，而建立于人民的选择。\n\n然而，也有人对此提出异议。他们认为，五色旗虽然拥有光辉的历史，但那个时代的中国最终陷入了军阀割据与政治混乱。一个经历过战争与苦难的新共和国，是否应该继续背负旧时代的象征？支持保留现有国旗的人主张，国家已经走向新的未来，新的旗帜代表着新的制度、新的人民以及新的国家认同。"
 league_generic.500.a: "五色旗飘扬，共和荣光再现！"
 league_generic.500.b: "新时代需要新的象征"

 league_generic.501.t: "选择国号"
 league_generic.501.d: "统一战争的硝烟终于散去，曾经四分五裂的中国重新站在了同一面旗帜之下。然而，随着制宪会议的召开，一个看似简单却意义深远的问题摆在了所有代表面前：这个新生国家，究竟应当以何种名义存在？\n\n自辛亥革命以来，“中华民国”这一国号已经伴随中国走过数十年的风雨。支持延续旧国号的人认为，民国二字承载着推翻帝制、建立共和的历史功绩，是无数革命者与宪政人士共同奋斗的成果。尽管过去的共和国曾经历军阀混战与政治危机，但这并不意味着共和理想本身已经失败。相反，今日的统一正是为了完成那些先辈未竟的事业。\n\n然而，联省运动的支持者则提出了不同意见。他们认为，过去的中华民国虽然名义上实行共和，实际上却长期陷入中央与地方的矛盾之中。中国的未来不应再重复旧式中央集权的道路，而应建立一个真正尊重地方自治、由各省共同组成的联邦共和国。因此，“中华联省共和国”这一名称逐渐进入讨论之中，象征着一个由地方与中央共同维系的新秩序。\n\n与此同时，一批年轻的民主派人士则认为，无论是旧民国，还是联省主义，都不足以完全代表新时代的政治理想。他们主张建立一个以民主、自由与人民主权为核心的新共和国，以“中华民主共和国”作为新的国家象征。这不仅意味着制度上的革新，也意味着中国将彻底告别过去的政治循环，成为一个真正属于人民的现代国家。"
 league_generic.501.a: "共和事业未竟，吾辈当继承之"
 league_generic.501.b: "让各省共同铸就国家未来"
 league_generic.501.c: "新时代需要新的共和国"


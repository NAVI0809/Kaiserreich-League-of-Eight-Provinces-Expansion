 #事件
 ##前期
 league_mid.1.t: "商人与将军"
 league_mid.1.d: "孙传芳的死讯，像一块巨石投入湖面，激起了整个华东的滔天巨浪。八省内战的爆发，让旧有的秩序彻底崩溃。齐燮元作为孙氏遗产的继承人，依托军中威望和德国武器的支持，勉强坐稳了“大元帅”的位置。但随着战事持续，他逐渐意识到单凭军权无法支撑整个战局。军队需要粮秣，军官需要饷银，前线需要源源不断的补给，而这一切都超出了政府自身的财政能力。\n\n与此同时，一股新的力量浮出水面。江南商帮、沿海实业家与诸省自治派系，在“工商联合会”的旗帜下走到了一起。他们掌握着大部分的资本与工商业网络，拥有地方自治的社会根基，也能动员学生、工人和地方绅士的力量。他们不愿只是军阀战争的旁观者，而是要求在国家重建的未来中占有一席之地。\n\n齐燮元对这股力量心怀警惕。他深知德国顾问与德械部队的存在，固然给了他维持统治的底气，但也让人怀疑他是否只是德国的代理人。工商联则打出“民族自主”的口号，指责德国的债务与垄断正掣肘中国经济的发展。他们愿意在短期内提供贷款、粮食与人力，但条件是战后必须确立某种形式的宪政与经济自治。\n\n于是，在八省内战的硝烟中，新的对峙逐渐成形：是由军权、铁腕与德国支持所维系的中央集权，还是由工商资本、地方自治与民族主义推动的工商联合？这场博弈不仅决定了谁能掌控战场的胜负，更关乎华东未来的政治格局。\n\n如今，战火已点燃，抉择必须做出。"
 league_mid.1.a: "这样脆弱的平衡，又能维持多久呢？"
 league_mid.2.t: "凯旋之路"
 league_mid.2.d: "八省内战的硝烟终于散去，南京城头的火炬再次点亮。齐燮元以胜利者的姿态登上权力顶峰，街道两侧的人群或出于畏惧、或出于欢呼，高喊着联帅的名字。齐燮元自信满满，仿佛一切质疑都已被战场上的胜利击碎。\n\n然而，在人群的笑容背后，暗潮依旧汹涌。失势的商团仍在低声密谋，学生社团与工会暗中活跃，江南金融大户也在筹划新的算计。甚至连德国东亚监事会也态度暧昧，德商撤资与物资断供的威胁宛如无形之刃，随时可能切断南京新政府赖以为生的血脉。齐燮元的统治远未稳固。\n\n为了展示铁腕与掌控局势的信心，齐燮元决定亲自沿着浙赣铁路南下，巡视战后局势，并宣示对江浙腹地的直接统治。幕僚曾再三劝告，这里仍有残存的国民党游击队、流亡军官与未被肃清的土匪活动，风险不容低估。但齐燮元嗤之以鼻，坚称只有让敌人亲眼看到自己的身影，才能让一切阴谋不攻自破。\n\n在南京火车站，齐燮元的专列在礼炮与军乐声中缓缓启程。汽笛长鸣，车厢内酒杯碰撞，联帅与亲信们高谈阔论，庆祝属于他们的胜利。车窗外，田野与乡镇在铁轨两侧逐渐掠过，鼓声与欢呼仿佛仍在耳边回响。可在这胜利的乐音下，铁轨的阴影中，却潜伏着未知的危险。"
 league_mid.2.a: "一路顺风，联帅"
 league_mid.3.t: "轨上浩劫"
 league_mid.3.d: "齐燮元的专列一路向南，越过江宁、穿过湖口，沿着蜿蜒的浙赣铁路线驶向前线。沿途的军乐与礼炮逐渐稀疏，取而代之的是紧张的沉寂。官员与随行军官在车厢内低声议论，窗外则是阴郁的山岭与荒凉的田野。尽管联帅表现得镇定自若，但车队的卫兵却已察觉到了不安的气息。\n\n当列车驶入江西境内一段狭窄的山谷时，铁轨忽然震动，随后是震耳欲聋的爆炸声。火光与浓烟瞬间吞没了前车厢，钢铁被炸得扭曲翻飞，汽笛声化作刺耳的哀嚎。惊慌的随从跌倒在走廊，枪声、呼喊与爆炸声混成一片。\n\n国民党残部早已埋伏在此，趁乱向列车倾泻弹雨。卫兵们慌忙还击，却难以辨认黑暗中的敌影。齐燮元所在的车厢剧烈摇晃，碎裂的玻璃割破了幕僚的脸庞，车内弥漫着焦灼的烟雾。联帅究竟是否仍在车内，还是被炸声吞没，谁也无法确认。\n\n爆炸的火焰照亮了夜空，消息也随即在江南传开：齐燮元的命运，已被铁轨上的烈火所笼罩。南京城内的权贵们屏息以待，有人暗自窃喜，有人心生惶惶。是联帅奇迹般幸存归来，还是新的权力格局即将开启？一切都将在下一刻揭晓。"
 league_mid.3.a: "褚辅成打破了僵局！"
 league_mid.3.b: "南京理事会抓住了先机！"
 league_mid.3.b: "联帅奇迹般的幸存！"
 league_mid.4.t: "南京临时政府成立"
 league_mid.4.d: "齐燮元乘车南下之际，铁轨骤裂，火光冲天。顷刻之间，这位八省联帅殒命车厢，权力的轴心随之崩塌。噩耗传抵南京，城中军政机关顿失所依，昔日森严的命令链条化作一纸空文。\n\n八省内战以来，陈仪治军严整、纪律分明，与齐燮元之间龃龉日深。前线补给、军费调度与战后整编之策屡起争执，嫌隙早已暗流汹涌。如今主帅骤亡，浙军在城郊严阵以待，成为南京城中唯一仍保持完整建制的武力。\n\n褚辅成把握时机，在陈仪支持下迅速联络议会残余与商绅代表，宣布为“维持秩序、避免军阀混战再起”，浙军将接管首都要害。政变几乎未遭顽抗：总统府、电报局与兵工署相继易手，联帅旧部在震荡与观望中被解除武装。\n\n当夜，一面蓝、白、黄、红四色横条旗升起于政府大楼之巅。褚辅成立于台阶之上，郑重宣告将延续二十年代以来的自治理想，重申“主权在民、地方自决”的纲领，成立南京临时民主自治政府，以议会协商取代个人专断，以法理程序重塑国家权威。陈仪则以军队为后盾，承诺维持秩序、保障新政权运作。\n\n南京城在动荡之后暂归平静，但所有人都清楚，这座新生的政府既承载着自治的理想，也背负着军权加持的现实。它能否在风雨欲来的时代中站稳脚跟，将决定华东乃至全国的未来走向。"
 league_mid.4.a: "城头变幻大王旗"
 league_mid.6.t: "联帅归来"
 league_mid.6.d: "烈焰与废墟中，本应只留下残骸，但齐燮元却奇迹般地生还。身负伤痕、满身绷带的联帅在数日后重返南京，列队的军官与随从在火车站迎接他，如同迎接一位从死神手中夺回的强者。报馆连夜刊发“联帅不死”的头版，宣传机器迅速将他塑造成铁血与命运的化身。\n\n然而，庆贺的喧嚣之后，是血与恐惧的阴影。齐燮元亲手签署大批逮捕令，将任何与工商联、学生社团乃至疑似同情者的人一并视作‘叛乱分子’。夜半的敲门声、秘密的审讯与仓促的枪决，成为南京城里新的日常。恐惧取代了辩论，怀疑淹没了低语。\n\n联帅的威望因劫后余生而愈发骇人，他的名字被人们压低声音传颂，不是出于尊敬，而是畏惧。南京的街头巷尾，只剩下一个冰冷的传言在流传：‘谁敢动联帅，谁就得死。’"
 league_mid.6.a: "铁腕再起"
 league_mid.5.t: "德国的新代理人"
 league_mid.5.d: "这条路线还在开发中，如果你看到了这个事件说明你的权力平衡没有达到33%，所以请重新回档吧。"
 league_mid.5.a: "没有新内容了"
 league_mid.7.t: "商帮的橄榄枝"
 league_mid.7.d: "八省内战烽火连年之际，齐燮元与江南商帮的关系始终若即若离。联帅倚仗商团资本以筹军费、购军械，而商帮亦需其兵力维持航运畅通与市面秩序。二者虽互存芥蒂，却在利益之上勉力维系。\n\n然而齐燮元骤然身亡，这种脆弱的平衡亦随之瓦解。南京临时民主自治政府甫一成立，便发现府库空虚，军费、抚恤与行政开支接踵而至。战火摧折工厂，交通阻滞贸易，税源锐减，理想与现实之间横亘着一道赤字的鸿沟。\n\n就在此时，荣宗敬以江南商界领袖之姿递来橄榄枝。他表示，若政府承认工商团体的合法地位，并允许商界代表参与政务决策，共同商议财政与经济政策，商帮将动员资本、恢复工厂生产、重启航运贸易，以金融之力稳住新政权的根基。\n\n褚辅成思虑再三，最终接受这一提议。商界代表被邀请进入政府机构，参与财政与经济事务的讨论与决策；作为回报，商帮承诺尽快恢复生产、稳定市场，并为政府提供必要的资金支持。南京的局势因此暂得缓和，新政权也多了一分现实的支撑。"
 league_mid.7.a: "我们感谢他们的支持"
 league_mid.8.t: "黄郛南下"
 league_mid.8.d: "南京政权更迭的消息，很快传至北京。正在京中参与政事斡旋的黄郛，闻讯后沉默良久。这位出身浙江、早年负笈东瀛的政治人物，既见识过立宪政体的运作，也亲历过民国初年的军政纷争。武昌首义后，他曾任沪军都督府参谋长兼沪军第二师师长，于乱局中维持沪上秩序；1924年冯玉祥发动北京政变时，他又受托组织摄政内阁，虽任期短暂，却展现出不凡的行政才干与调和能力。\n\n对于南京新政府，黄郛既有乡土之情，也怀观望之意。他清楚，单凭军力与商界支持，尚不足以构筑稳固的国家架构；若缺乏成熟的行政制度与清晰的宪政路径，所谓自治终将流于口号。\n\n数日思索之后，黄郛决定南下。他致电南京，表示愿参与新政建设.此次南下，并非黄郛一人之举。追随其多年的政学系人士亦相继响应，决定一同离京赴宁。他们主张以制度理性重建国家，以法理与程序约束权力，反对再度滑入军阀纷争。黄郛深知，南京新政府若欲立足，不能仅凭军力与资本，更需建立一套可持续的行政体系。\n\n当列车缓缓驶入南京站时，人们或许尚未意识到，这位沉稳寡言的浙江人，可能会在未来的政局中扮演举足轻重的角色。"
 league_mid.8.a: "我们期待着他的表现 "
 league_mid.9.t: "德资撤离"
 league_mid.9.d: "德国政府最终拒绝承认南京的新政权，伴随而来的，是德国资本与专家的全面撤离。曾经点缀在江南城市的新式工厂，如今一座座陷入停工，机器停摆，工人失业。原本依赖德资贷款维持运转的企业，如今资金链濒临断裂，许多商界巨头都在仓促变卖资产，以免在风暴中被彻底吞没。\n\n不仅如此，德国人带走的不只是金钱与设备，还有他们的知识与经验。自八省内战以来，华东军队的整编与训练大多仰赖德国顾问团的协助。如今这些顾问纷纷离境，留下未竟的计划与一群茫然无措的军官。新式武器的引进被迫中止，部分军械工厂因缺乏零件而无法继续生产。军心浮动，许多人担忧华东军队将迅速失去与列强并肩的资本。\n\n南京的街头巷尾已流传起一种冷嘲：‘德国人收回了他们的黄金，也收回了我们的未来。’政府必须面对这场突如其来的考验。若不能迅速稳住局势，经济与军队都可能在顷刻间坠入深渊。\n\n这是一道无法回避的命题——在失去外援的今日，华东政府唯有依靠自身的力量，才能决定明日的方向。"
 league_mid.9.a: "我们必须自力更生"
 league_mid.10.t: "人民救国会"
 league_mid.10.d: "七君子被押往北方候审的消息传至南方，各地舆论激荡不已。南京、上海之间的报馆与学社连日刊发社论，指斥北京当局以“叛国”之名压制异议。街头演说与小型集会此起彼伏，商会与学界亦多有联名电文，要求保障言论与结社之权。\n\n在这样的氛围中，原中国民主政团同盟在南方的成员逐渐显出分歧。有人主张继续维持原有架构，以观时局变化；亦有人不满同盟此前对事态反应迟缓，认为若仍拘泥于旧有形式，难以应对当前局势。围绕组织去留与行动方向的争论，在各地分部之间反复出现。\n\n马叙伦在南京召集数次座谈，会见来自学界、出版界与地方团体的代表。他在席间痛陈北京当局以法律为名行压制之实，亦对同盟内部迟疑观望的作风多有批评。会后不久，南京方面传出消息：原属民主政团同盟的南方各支部将予以整合，另组新团体，以便集中行动。\n\n随后，“中国人民救国会”之名见诸报端。新组织延续原有联系网络，同时吸纳工会与地方团体参与，强调反对贪污腐败，并主张在制度内保障劳工权益。其章程中亦提出，将与南京方面的政治架构保持协调，以推动各界协作与政策落实。各地分部相继改挂新名，旧有同盟在南方的架构遂告结束。"
 league_mid.10.a: "旧旗既落，新声已起"
 league_mid.11.t: "旗帜问题"
 league_mid.11.d: "自孙传芳兼并华南并建立八省联合以来，那面中央绘有清代海军龙旗，外围环绕“浙、闽、苏、桂、湘、粤、赣、皖”等字样的旗帜，曾被其支持者视为华东各省联合与秩序恢复的象征。\n\n如今，随着新的民主政府在南京建立，旧旗帜自然无法继续代表这个新的时代。内务部提交了数份设计方案，引发了广泛讨论。旋即引发了社会各界的广泛讨论，从报馆编辑到商会代表，从留洋归来的法学家到工团组织者，纷纷对国旗的象征意涵发表意见。\n\n黄郛的政学系主张保留象征着共和传统的五色旗的基本色彩，并将红色条纹置于旗面一侧，中央书写“南京政府”，象征着民国政府的法统延续。\n\n另一些人则将目光投向更早的革命记忆，即上海光复时期曾飘扬于街头的八角青日旗。对于自治同志会以及许多地方共和主义者而言，那面旗帜代表的是一场由城市、市民和地方力量共同推动的变革。\n\n“四色共和旗”则来源于大清海军总兵旗的旧式设计，以红、黄、蓝、白四色象征不同社会力量的结合，赤红代表劳工与农民，金黄象征商业资本与贸易，海蓝寓意沿海省份的航海传统与开放精神，素白则指向知识阶层与文教传承。设计者更在旗帜中央加入了工商自卫团的图章，以此铭记在政权更迭之际，地方商民武装在维持秩序、保护市镇免受溃兵侵扰中所发挥的不可或缺的作用。"
 league_mid.11.a: "在五色旗的基础上修改"
 league_mid.11.b: "追寻辛亥革命的回忆"
 league_mid.11.c: "应当尊重工商团体的意见"
 league_mid.11.e: "保留四色共和旗"
 league_mid.12.t: "来自流亡者的橄榄枝"
 league_mid.12.d: "八省内战的硝烟尚未完全散尽，国民党起义失败的余波仍在东南大地回荡。当年汪精卫领导的中央委员会与亲法派，在起义溃败后被迫流亡上海租界，靠着西方工团主义国家的暗中接济勉强立足；而宋庆龄领导的临时行动委员会，则拒绝了租界的庇护，率残余力量退守闽赣边界的山区，在崇山峻岭间坚持抗争，虽队伍锐减、装备匮乏，却始终未放弃旗帜。\n\n如今，我们成功推翻齐燮元的残暴统治，南京城头竖起新政的旗帜，这一消息传遍东南。近日，一支规模不大的国民党代表团悄然抵达南京，带着几分窘迫与试探，正式向新政府表达了合作意愿。他们的处境一目了然 —— 内战早已耗尽其武装力量，如今既无兵权支撑，也无广泛的地盘依托，对我们的政权难以构成实质威胁。\n\n支持合作的声音认为，接纳国民党流亡势力，尤其是与西方工团主义联系密切的派系，能显著改善我们与相关国家的外交关系，为新政争取更多国际支持与经济援助；但反对者的警告同样尖锐：国民党虽已衰弱，但其多年积累的政治影响力与组织根基仍在，接纳他们无异于引狼入室，难保日后不会成为颠覆新政府的隐患。"
 league_mid.12.a: "让他们共商国是"
 league_mid.12.b: "我们只接纳宋庆龄领导的温和派"
 league_mid.12.c: "他们只会借机推翻我们的政府"
 league_mid.13.t: "地方武装问题"
 league_mid.13.d: "齐燮元统治时期，东南的军事格局从未真正统一。他的军队分为泾渭分明的两派：一派是孙传芳死后迅速靠拢的亲信嫡系，靠着忠诚度填补了南京的权力真空，成为其统治核心；另一派则是各地被迫臣服的小军阀武装，表面上奉南京为中枢，实则各自为政，随时准备相机而动。除此之外，乡村与县城的地主民团遍布乡野，靠着宗族势力与地方财力维持秩序，实则是游离于中央管控之外的独立力量。\n\n新政府推翻齐燮元统治后，其旧部或战死或投降，我们以整编后的浙军为骨干，初步构建了新的军事体系。为快速稳定局势、争取地方势力支持，我们曾默许各地保安军、民团继续存在，这一妥协在政权初创期起到了缓冲作用。\n\n如今统治日渐稳固，地方武装的弊端却愈发凸显。这些武装力量割据一方，严重阻碍中央对基层的治理渗透，部分民团甚至充当地主爪牙，与新政推行产生冲突；庞大的地方武装开支不仅加重了财政负担，更成为不稳定因素 —— 小规模叛乱时有发生，正规军与民团的武装冲突消息近来更是频繁传来，已危及地方治安与政权稳定。如何处置这些游离于体系之外的 “保安军”，成为亟待解决的关键问题。"
 league_mid.13.a: "强制解散所有地方武装，收回基层军事控制权"
 league_mid.13.b: "将符合条件的地方武装编入正规军，统一指挥调度"
 league_mid.13.c: "允许地方武装继续存在，由中央提供训练与指导"
 league_mid.14.t: "基建博弈"
 league_mid.14.d: "“想致富，先修路” 的俗语在民间流传已久，对刚稳固统治的新政府而言，推进全国道路建设既是民生工程，更是打通经济脉络、强化国家统一的战略举措。残破的古道与省际间的交通壁垒，早已成为制约商贸流通、阻碍政令传达的顽疾，大规模修路已是民心所向、势在必行。\n\n但计划尚未启动，资金与人力的分配争议便摆上了台面。支持中央统一调度的声音认为，唯有中枢统筹资金调拨、统一招募与分配劳工，才能避免地方各自为政 —— 既能集中财力优先修建贯通多省的交通干线，又能保证工程标准统一、避免资源浪费，更能借此强化中央对地方的掌控力，延续新政的集权导向。\n\n而主张地方自主执行的一方则据理力争，认为各地地理条件、经济基础差异巨大，中央统一规划难以兼顾地方实际。让地方按中央定下的总体指标，自行筹措部分资金、招募本地劳工，既能调动地方积极性，减少因征地、劳工安置引发的矛盾，又能让道路建设更贴合本地发展需求，避免 “中央拍板、地方买单” 的抵触情绪。\n\n两种方案各有考量，如何在效率与适配性、集权与自治之间找到平衡，成为道路建设计划落地的关键前提。"
 league_mid.14.a: "中央统筹，集中推进"
 league_mid.14.b: "定标放权，地方执行"
 league_mid.15.t: "土改之择"
 league_mid.15.d: "新政府稳固统治后，土地改革成为关乎民生与政权根基的核心议题。长期以来，土地集中于地主乡绅手中，农民无地可耕的困境是社会动荡的根源，推行土改已是箭在弦上。\n\n回顾过往数次土改尝试，成败皆与权力分配紧密相关。一种思路是借鉴联省自治背景下的地方治理经验，将土地分配权力下放至县一级，与地方势力达成妥协 —— 由县长主导本地土改，中央仅进行象征性监督与原则指导。这种方式能借助地方势力的本土影响力，减少改革阻力，快速推进政策落地，但也可能因地方利益裹挟导致分配不公，让土改流于形式。\n\n另一种方案则强调中央集权的高效性，由中枢统一制定详尽的土地分配标准、人口核查办法与奖惩机制，派遣专人组成土改工作组赴各地强制执行。此举能最大程度保证分配公平，彻底打破地方利益格局，但需投入大量人力物力，且容易引发地方势力的抵触，甚至激化干群矛盾，考验新政府的基层管控能力。\n\n两种路径各有优劣，如何在效率与公平、稳妥与彻底之间找到平衡，成为新政府必须直面的抉择。"
 league_mid.15.a: "放权地方，妥协推进"
 league_mid.15.b: "中央统筹，专人执行"
 league_mid.22.t: "土地与新秩序"
 league_mid.22.d: "江南初夏的空气中，弥漫着潮湿与焦灼。自政府宣布推行“温和土地改革”以来，舆论在城乡之间迅速发酵：佃农与贫苦农人呼吁保障生计，地主家族则担忧祖业动摇。官厅中一场关乎未来的辩论正在展开。\n\n诸省自治运动的代表最先开口。他们主张由地方自治议会主导改革，强调以契约为核心，明确土地租佃的权利与义务，让乡里士绅和农人通过议事协商来避免冲突。这样的方案虽缓慢，却能避免激烈对抗。\n\n政学系的声音更为理性。他们提出建立统一的法令框架，推行契约登记与地租上限制度，由司法与官僚系统进行管理。改革不在于口号，而在于制度的严谨与执行的持久，他们认为唯有这样，方能长远。\n\n而工商联合会的立场则与众不同。他们并不强调削弱地主，而是希望通过设立农业贷款、推动合作社和市场流转，让有志耕作的小农能够通过经济途径购地自立。他们相信资本与市场才是农村发展的真正动力。\n\n三套方案，各自折射出对农村社会未来的不同理解。政府必须在妥协与前进之间做出抉择。"
 league_mid.22.a: "让地方自治调和矛盾"
 league_mid.22.b: "以制度与法律稳固根基"
 league_mid.22.c: "借助市场振兴农村"

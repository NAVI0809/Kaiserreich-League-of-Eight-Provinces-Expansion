 LEP_mid64_B_TT: "§L如果方液仙资助了国防线建设§!"
 league_mid.65.t: "从工厂到餐桌"
 league_mid.65.d: "随着《全国物资动员法》的逐步落实，一套覆盖铁路、港口、公路与地方仓储的统一供应体系终于初见成效。过去因地方割据与运输混乱而时常中断的军需补给，如今已能够按照统一标准进行调拨。粮食、药品、被服与工业原料得以在全国范围内高效流通，军队与地方政府长期困扰的运输问题也得到明显改善。\n\n然而，对于许多普通民众而言，这场改革最直观的变化或许并不来自军营，而是来自市场货架上的商品。\n\n近来最受报纸关注的企业之一，便是宁波的如生罐头厂。该厂由实业家陈如馨创办。陈氏早年毕业于宁波府中学堂，后赴上海经商，先后创办药房、纺织企业与食品工厂，堪称浙东实业界的代表人物之一。与许多热衷金融投机的商人不同，陈如馨始终将目光放在实业经营与地方建设之上，不仅参与办学兴教，还曾出资修缮天一阁、建设公园，被宁波乡里广为称道。\n\n十余年前，陈如馨与友人在宁波郊外试制笋类罐头，并于西门马园创办如生笋厂。凭借改良工艺与机械化生产，工厂逐渐发展成为全国知名的如生罐头厂。“宝鼎牌”油焖笋、黄鱼罐头、鸡肉罐头与蘑菇罐头远销各地，其中油焖笋罐头更先后在费城世博会、莱比锡博览会以及中华国货展览会上获得奖项，一度成为中国民族工业食品的代表品牌。\n\n过去，由于运输条件限制，如生厂的产品大多只能销售于江浙沪地区。即便工厂年产量高达百万余罐，也难以进一步打开全国市场。而随着新的物资供应体系建立，情况开始发生变化。铁路专列与统一仓储网络使宁波生产的罐头能够迅速运往华北、华中乃至西南地区。许多过去从未见过“宝鼎牌”的消费者，第一次在本地商店中见到了来自东海之滨的商品。\n\n据宁波地方报纸报道，如生厂近期甚至开始与军方合作，为驻军供应部分罐头食品。在战时储备与民生供应双重需求推动下，这家起源于笋厂的小企业正逐渐成长为全国性的食品企业。而对于不少宁波人而言，无论是畅销全国的油焖笋，还是工厂低价出售的笋衣、鱼头等副产品，都早已成为一代人的共同记忆。\n\n从军队补给到百姓餐桌，从地方工厂到全国市场，新的供应体系正在让这些曾经局限于一城一地的民族企业，真正融入一个统一而广阔的国内市场之中。"
 league_mid.65.a: "物资流通之处，便是国家力量所及之处。"
 
 league_mid.66.t: "“中国蔡司”"
 league_mid.66.d: "齐燮元遇刺与南京民主政府成立后，华东地区的局势一度令许多外国投资者感到不安。数月之间，大量德国银行、贸易公司与工业资本陆续撤离，部分企业甚至开始拆运设备、转移资金。面对这一局面，南京政府并未采取简单粗暴的没收政策，而是试图通过谈判与重组的方式，将这些企业留下的技术与产业体系尽可能保留下来。\n\n经过数轮协商，一批选择继续留在中国的德国工程师、经理人与技术人员获得了新的合作机会。其中最受关注的，便是蔡司在华东地区遗留下来的光学产业网络。\n\n对于许多中国知识分子而言，蔡司几乎就是“现代光学”的代名词。早在清末时期，蔡司便通过礼和洋行进入中国市场，其显微镜、测绘仪器、医疗光学设备与望远镜很快成为大学、医院与科研机构的标准装备。从北洋时期的铁路测绘队到各地海关实验室，从协和医院的眼科诊室到大学里的生物学课堂，到处都能看到蔡司仪器的身影。进入三十年代后，蔡司与中国的联系变得更加紧密。随着南京民主政府推进军队现代化建设，大量蔡司炮队镜、瞄准镜、测远机与军用望远镜被引入军队。为了满足中国军方需求，蔡司甚至专门设计了带有中文铭牌和中式刻度的特制型号。对于当时的中国军队而言，蔡司几乎意味着最先进的军用光学技术。\n\n真正具有历史意义的，则是南京军用光学厂的建立。在俞大维与周自新的推动下，蔡司不仅出售设备，更向中国开放维修与培训体系。从德国运来的机床、镜片研磨设备和检测仪器，与中国第一代光学工程师共同构成了现代中国光学工业的起点。百水桥工厂内培养出的技术人员，后来逐渐掌握了从维修、装配到部分零件制造的完整流程。\n\n如今，随着德国资本撤离，南京政府与留华德籍管理人员达成协议，以国家资本与本地工商资本共同注资的方式完成企业重组。原有设备、技术档案与工程团队被完整保留，新公司则正式更名为“中国蔡司光学公司”。或许在短时间内，中国仍无法与德国本土的光学工业相提并论；但至少从这一刻起，华东地区最先进的光学设备开始成为中国工程师能够理解、维护并不断改进的工业成果。对于这个正在重建中的国家而言，这或许比任何一座工厂本身都更加重要。"
 league_mid.66.a: "德国人带来了光，而现在轮到我们点亮它了"

 league_mid.1000.t: "《告国民书》"
 league_mid.1000.d: "十月十日，为辛亥武昌起义，造成中华民国之伟大国庆纪念，实孙中山先生以四十余年之心力，领导无数志士，尽瘁革命，精神无闲，百折不回，造成时势，得全国人心之倾向所造成。本可从此继进，实行本党夙抱持之自由民主、宪政统治，与夫革命方略所规定之种种建设宏模，则必能乘时一跃而登中国于富强之城，跻斯民于安乐之天也。\n\n不图革命初成，党人即起异议。溯自民元以来，二十有余年，唯见军阀，此替彼兴，相继而起，积极作恶，祸国殃民，更有吴贼佩孚、孙贼传芳等，拥戴前清逊帝，使辛亥革命之成果付与东流。使全国分崩离析，战乱相循而已。国家悬于覆灭之缘，民族近乎累卵之危。\n\n为中国一线生机所系之本党，怵惕于过去二十余年之往事，深信统一中国之道，舍我党一贯主张之联省共和主义外，绝无可循之途。本党因得国人之同情，一致赞助，遂不数月而克沪宁，平苏浙，奠定长江上下游，及最近收复平津，统一全国之基础矣。其意义之重大，与武昌起义之十月十日，实可等伦齐观。\n\n当此重兴中华民国之北伐完成，全国统一，举行国庆之际，我全国国民于鼓舞欢乐之时，所应猛省警醒于辛亥创造中华民国与此时重兴中华民国之工作，先烈所致力之艰难，牺牲之巨大，思所以保障此胜利而完成建设之救国大业。唯有以坚强之自信，刻苦之努力迈进，以从事实际之建设而完成建国之大业，俾全国共蒙乐利，有厚望焉！"
 league_mid.1000.a: "民国万岁！"
 ##统一后
 league_rebuild.1.t: "临时宪法蓝本选择"
 league_rebuild.1.d: "全国大局初定，战时体制已难以长期维系。共和国必须确立一部过渡时期的临时宪法，以规范中央与地方、行政与议会之间的权力关系。为此，执政联盟召开会议，正式讨论应以何种宪法蓝本作为依据。\n\n荣宗敬领导的江南商帮主张恢复1912《中华民国临时约法》。他们强调议会权力与法律保障，主张限制行政权的扩张，使商业社会在明确的法治框架下运行。在他们看来，宪政的关键在于防止权力集中，并以制度保障社会与经济的自主空间。\n\n褚辅成的自治同志会则倾向采纳1923年《中华民国宪法》所确立的联省共和国结构。他们认为，应当在统一国家框架下承认各省自治地位，使地方拥有相当权限，以体现分权与协商精神。联省体制被视为兼顾统一与自治的一种安排。\n\n以黄郛为首的政学系提出以他们参与起草的1913年《中华民国宪法草案》（即天坛宪草）为基础，建立结构完整、权责分明的中央政体。他们强调行政系统的效率与权威，主张在重建时期由中央统一统筹军政、财政与外交事务，以确保国家机器顺畅运转。\n\n三种方案已经提交会议，各派代表依次陈述立场。议程进入表决阶段，会场气氛肃然。"
 league_rebuild.1.a: "我们应当坚守临时约法的初心"
 league_rebuild.1.b: "1923年宪法被证明是一套有效的宪法"
 league_rebuild.1.c: "天坛宪草更适应时代的需求"
 league_rebuild.2.t: "全国财政会议"
 league_rebuild.2.d: "统一之后，军费、赈济、交通修复与地方接收的支出骤然增加，国库承压，各省财政报表接连送抵南京。为统筹收支与重建方向，政府召开全国财政会议，邀请各派代表与地方财政官员共同商议未来数年的经济安排。\n\n工商勇进党在会上提出，应当减轻战时加征的各类税负，并逐步放松物资与金融管制。他们认为，企业与市场活力是恢复生产与就业的关键，若继续维持高税与严控，只会抑制投资与流通。减税与放松管制，才能让实业与商业迅速恢复元气。\n\n自治同志会则主张渐进改革。他们承认战时财政体制难以长期延续，但也强调骤然转向可能引发震荡。应当分阶段调整税制与统制政策，在维持基本公共支出的前提下，逐步恢复常态财政秩序，使社会有时间适应转型。\n\n政学系的代表则提出国家主导投资计划，建议由中央集中资金，优先投入交通、兵工与基础工业建设。他们强调，重建需要统一规划与大规模投入，仅靠市场自发力量难以承担全国性的整顿与发展任务。\n\n会场上，各种方案被反复讨论，数字与报表在长桌间传递。减税、渐进、统筹投资，三种路径并列于议程之上，等待最终的决定。"
 league_rebuild.2.a: "采纳商帮的建议，这个时候应当休养生息"
 league_rebuild.2.b: "自治同志会的方案能帮助我们渐进过渡"
 league_rebuild.2.c: "国家复兴需要政学系的计划"
 league_rebuild.3.t: "军事编遣问题"
 league_rebuild.3.d: "国民自治军的前身为浙军。昔日以一隅之兵起家，在民主自治政府成立后完成整编，改称“国民自治军”，统一旗帜与番号，成为新政权最可靠的武装力量。北伐期间，诸部转战江淮与华北，多次担任主攻与掩护任务，伤亡惨重而军纪尚整，为统一事业立下重要功绩。其军魂既带有浙军旧日的纪律传统，也烙印着自治运动的理想色彩。\n\n战火稍歇，军队的去向被提上议程。如何编遣与定位国民自治军，已不只是军事问题，而是制度选择。\n\n自治同志会主张，国民自治军必须彻底脱离派系色彩，统一全国番号与指挥体系，确立军队国家化原则，并建立国会或内阁的监督机制，逐步推进军政分离，使军队成为法律之下的国家武装。\n\n政学系则强调，国民自治军应直接听命中央，保留战时形成的高效军政架构，强化参谋本部权力，减少地方干预，以确保统一指挥与作战效率不被削弱。\n\n江南商帮关注财政承受能力，认为军费规模过高将拖累重建，应适度缩减中央军常备规模，各省保留有限武装负责治安与边防，并反对过度扩张军工体系。"
 league_rebuild.3.a: "不能再让武人争雄成为常态"
 league_rebuild.3.b: "自治军应当是一支高效的军队"
 league_rebuild.3.c: "我们应当铸剑为犁"
 league_rebuild.4.t: "分道扬镳"
 league_rebuild.4.d: "连日来的会议已让空气变得沉重。临时宪法的分歧尚未消散，财政方案的争论仍在延续，军队编遣问题又将矛盾推至台前。今日原本只是一次程序性的议程表决，却在各派代表的反复发言中逐渐失去节奏。修正案与反修正案相继提出，彼此否决，条文在投票与重议之间来回搁置。\n\n会场气氛愈发紧绷。有人提高声调质疑对方立场，有人指责程序安排失当，主席数次敲槌维持秩序。部分代表在表决结果公布后当场退席，拒绝参与后续议程。走廊间议论纷纷，记者将争执的片段记录在册，当晚的报纸已以“联盟裂痕公开化”为题刊出社论。\n\n此后数日，各派领袖在不同场合陆续发声。有人批评对方过于急进，有人指责他派忽视国家统一与秩序，也有人抨击现行方案将使财政与军政失衡。公开演讲与报章文章中，措辞逐渐尖锐，彼此的政策主张被反复质疑与驳斥。原本尚存的协调空间，在舆论与立场的对峙中迅速收缩，联盟继续维系的可能性已所剩无几。\n\n数日之后，政学系正式宣布成立“民元国民党”，以其宪政主张与中央理念参与未来政治竞争；江南商帮联合各地实业团体，组建“工商勇进党”，公开提出其经济纲领；自治同志会则决定以执政党身份迎接即将到来的选举。\n\n联合内阁的时代宣告结束，党派政治的舞台就此展开。"
 league_rebuild.4.a: "重建的重任仍在我们肩上..."
 league_rebuild.5.t: "政治解冻及其后果"
 league_rebuild.5.d: "随着政党政治的重新开放，沉寂多年的公共空间迅速恢复活力。昔日在直系军阀压制下苟延残喘的各类民主社团纷纷重组，报刊争鸣再起，集会与演讲成为城市街头的常景。曾在旧国会中充当橡皮图章的“和谐社团”，在吴佩孚通电下野之日即宣告自行解散。部分旧官僚转入景星社，希望在新格局中保留一席之地；一批早年支持立宪的知识分子则汇集起来，成立民主宪政党，试图以制度建设回应时代变局。\n\n然而，政治的解冻不仅唤醒了温和派。青年中国党南北两部正式合并，高举国家主义与民族革命的旗帜，宣称唯有强力政府方能完成民族复兴；其南方支部由断头将军李宝章主导，北方支部则由李璜领衔，声势颇盛。与此同时，李大钊领导的工团党与宋庆龄的国民党组成联盟，在既有政治框架内倡言“民生革命”，要求更彻底的社会改革。\n\n议会尚未完全定型，街头已然沸腾。不同理念在报纸与讲台上激烈碰撞，共和国的未来方向，似乎正在这场喧嚣之中被重新书写。我们究竟应当包容这种多元竞争，还是在秩序动摇之前划下界限？"
 league_rebuild.5.a: "这也是民主政治的一部分"
 league_rebuild.5.b: "我们不能让下一个萨文科夫上台"
 league_rebuild.6.t: "军事北伐，官僚南伐"
 league_rebuild.6.d: "北京既克，旌旗南归，军功赫赫。然而战事甫定，新的困扰却悄然滋生。随军南来的，并不止是缴械投诚的部队与归附的将领，还有大批旧日官吏与幕僚。他们或曾效力直隶旧府，或辗转于军阀之间，如今纷纷易帜，表示拥护南京政府。为求迅速接收北方政务，政府不得不暂时倚重其经验与人脉。\n\n起初，此举被视为权宜之计。吸纳旧员，既可缩短整编与接收所需时间，又可借其熟悉北方行政体系之便，维持秩序运转。然而不久之后，官署之中“北来之人”愈发众多，其升迁之速，往往与其旧日资历或所掌资源成正比。有人私下议论：“军事北伐，官僚南伐。”言语之间，颇多讥讽。\n\n更令人忧虑者，并非人数之多，而是风气之变。旧式衙门作风、层层请示与因循守旧之习渐入机关；重资历、讲关系的官场逻辑，亦与自治精神渐生抵牾。部分早年投身自治运动的理想派人士，见关键岗位频为旧员所据，难免心生失望。\n\n我们或许确实需要他们的经验，但若价值与方法亦一并继承，那么胜利的意义便值得反思。北伐已竟，如何避免精神上的“南伐”，或许才是更长远的考验。"
 league_rebuild.6.a: "任人唯才，暂容旧员"
 league_rebuild.6.b: "清理门户，重申民主精神"
 league_rebuild.7.t: "衙门化的阴影"
 league_rebuild.7.d: "战事既定，机关扩充本为接收政务之需，然而超编之弊亦随之显现。南京各部人手充盈，走廊间人声鼎沸，却未必皆有实职。报章讥讽机关如“闲谈的咖啡馆”，称多余人员以看报、吸烟与寒暄消磨时日。唯有个别部门尚显忙碌，有的次长甚至将部署化为“讲习所”，布置评论与测验，以期甄别能力。然而此类整饬，多为权宜之策，难以从根本上扭转行政效率之困。\n\n更为反常的是，上层权力过度集中，少数首脑身兼数职，事务堆叠如山；而基层则人浮于事，权责不明。决策权集中于寥寥数人之手，既无充足时间，亦缺专门知识，监督与执行遂成空谈。表面看似分工繁复，实则责任空转。\n\n考试制度原本旨在以能力取士，树立现代官僚体系的标准，但在现实操作中，程序流于形式，人情与关系反成通行证。文牍往返层层流转，一纸公文需经数十关卡，耗时数月方得批复。文件堆积如山，改革之议在推诿中磨损殆尽。若自治精神不能渗入日常行政，胜利之后，衙门化的阴影或将比战火更为持久。"
 league_rebuild.7.a: "扩充编制，分担重负"
 league_rebuild.7.b: "整肃机构，推行精简改革"
 league_rebuild.8.t: "国家重建局的抉择"
 league_rebuild.8.d: "连年战火之后，全国基础设施残破，金融体系紊乱，工业生产时断时续。为避免各部各省各自为政，中央正式设立“国家重建局”，统一编制重建纲要，统筹财政拨付与建设优先次序，使国家恢复工作能够在整体规划之下推进，而非零散拼凑。\n\n随着第一期预算草案提交会议，关于资金分配的争论迅速升温。部分官员认为，应当优先整顿银行体系与货币信用，恢复存贷秩序与资本流通，只有金融稳定，经济复苏才有坚实根基。另一些人则主张集中资源发展工业，重建钢铁、机械与交通体系，以国家主导的工业化带动整体振兴。与此同时，也有声音指出，若忽视民生困苦与社会恢复，失业与物价问题将侵蚀政权基础，重建成果难以为继。\n\n国家重建局的首次重大拨款，不仅决定资金去向，也象征共和国对未来发展方向的选择。在有限的财政能力之下，我们必须作出取舍。"
 league_rebuild.8.a: "优先整顿银行与金融体系"
 league_rebuild.8.b: "集中力量推进工业化建设"
 league_rebuild.8.c: "将更多资源投入民生改善"
 league_rebuild.9.t: "勋贵遗产之处置"
 league_rebuild.9.d: "北京政府覆灭之后，昔日依附其上的满洲勋贵仓皇离散。部分随日舰东渡，寄身海外；部分退入天津租界，在列强庇护之下暂避风头。然而，他们在京津与华北各地所拥有的宅邸、商号、矿权与金融资产，并非尽数带走。仓促之间，大量产业与契约文书遗留在原地，成为一笔尚未清算的遗产。\n\n这些资产规模不小，涉及地产、工厂与银行股份，若处理得当，可为重建财政增添助力；若处置失序，则可能引发法律争议与外交纠纷。社会舆论亦分歧明显：有人主张将其充公，以示对旧时代特权阶层的清算；有人认为应设立专门委员会，依法登记、托管与审查产权，以免草率行事损害法统；也有人主张暂不干预，让市场自行消化这些资产，避免政府过度卷入。\n\n勋贵的时代或许已经远去，但他们留下的财富仍摆在我们面前。如何处置这笔遗产，将考验共和国在正义、秩序与现实利益之间的取舍。"
 league_rebuild.9.a: "依法充公，纳入国家财政"
 league_rebuild.9.b: "设立资产管理委员会统一托管"
 league_rebuild.9.c: "允许其在市场中自行流通"
 league_rebuild.10.t: "预算案获得通过"
 league_rebuild.10.d: "新一财政年度的预算案，由民主科学社主导拟定，并依照国会程序正式提交审议。按照议事规则，预算案首先交由专门委员会审查，委员会须在限定期限内提出审查报告，方可进入大会讨论阶段。围绕岁入估算、军费比例与重建拨款，各派议员在委员会内展开反复质询，条文细节逐项核对，会议记录堆满案头。\n\n待预算案提交大会后，议场气氛一度紧张。部分议员尝试提出修正动议，要求调整若干支出项目，但依章程规定，修正案须获得相当数量议员附议方能列入正式议程。多数动议未能取得足够支持，在程序关卡前止步。随着讨论逐渐收束，表决时刻终于到来。\n\n计票结果公布之时，赞成票明显超过半数，预算案顺利通过。整个过程虽有争论，却未出现失序或拖延。预算案的通过，标志着政府财政方向获得国会确认，也显示民主科学社在议会中仍稳握多数席位。掌握财政主导权，意味着来年的政策推进拥有制度保障，共和国的施政步伐得以延续，执政格局随之进入新的阶段。"
 league_rebuild.10.a: "这是民主的胜利"
 league_rebuild.11.t: "预算案未获通过"
 league_rebuild.11.d: "新一财政年度的预算案由内阁主导拟定，并依照既定程序提交国会审议。根据议事章程，预算案先行交由委员会审查，在限定期限内形成报告，随后进入大会讨论阶段。围绕岁入预估、军费比例与重建拨款，各派议员在审议过程中频频提出质询与修正意见，场内气氛较往年更为紧张。\n\n当议案进入大会表决时，分歧已然公开化。部分议员对财政赤字规模表示担忧，另有议员反对某些重点支出项目，试图以修正案重新调整预算结构。虽然程序仍在规则之内推进，但原本稳定的支持票数出现松动。随着计票结果公布，赞成票未能达到通过所需多数，预算案遭到否决。\n\n议场一时哗然，赞成与反对双方围绕财政责任与施政方向展开激烈争论。评论界迅速作出反应，认为预算案被否不仅意味着来年财政安排陷入悬而未决的状态，更可能动摇现任内阁的政治威信。在议会责任制之下，财政议案的失利往往被视为对政府施政能力的直接考验。是否改组内阁，甚至集体辞职，成为各方揣测的焦点。共和国的政局，正站在新的转折点上。"
 league_rebuild.11.a: "怎么会？"
 league_rebuild.12.t: "内阁总辞"
 league_rebuild.12.d: "预算案遭否决之后，国会内外的争论持续发酵。财政议案的失利不仅使来年收支安排陷入停滞，也被视为对政府施政能力的一次公开否定。连日来，各派议员在议场中轮番发言，报刊评论亦纷至沓来，要求内阁对当前局势作出明确回应。作为在过渡时期组建的政府，褚辅成内阁原本肩负的是承接旧制、稳定秩序与完成制度重建的任务，而非长期执掌政权。\n\n在数次闭门会议与反复权衡之后，褚辅成最终代表全体国务员向国会递交辞呈，宣布内阁总辞，以示承担政治责任。辞呈中指出，本届政府已完成阶段性使命，共和国的行政框架与议会程序得以确立，未来的施政方向应由新一届多数力量决定。国会随即依程序接受辞呈，并授权总统组织临时过渡内阁，在限定期限内筹备新的选举。\n\n短暂而紧张的竞选期过后，议席重新分配，新的多数逐渐浮现。随着选举结果揭晓，共和国进入新的政治阶段，执政权将由胜出的政团接掌，而议会政治的轮替亦在制度框架内完成。"
 league_rebuild.12.a: "黄郛的国民党赢得多数席位"
 league_rebuild.12.b: "荣宗敬领导的工商勇进党成功组阁"
 league_rebuild.13.t: "议场失序"
 league_rebuild.13.d: "重建工作的推进远不如预期顺利。财政紧缩与产业整顿交织在一起，物价波动与失业率攀升令城市街头弥漫着焦躁情绪。报刊连日批评政府施政迟缓，工团与青年社团频繁集会，极端主义言论在讲坛与街角之间迅速传播。社会的不安，逐渐蔓延至议会之中。\n\n在一次原本围绕经济议题展开的会议上，争论不断升级。激进派议员指责政府失职，温和派则反驳其煽动民意，双方在议场内激烈对峙。旁听席上聚集的社会团体高声呼应，口号此起彼伏。秩序很快失控，推搡与争执蔓延开来，警卫被迫进入会场维持局面。面对混乱局势，议长依照院规多次警告无效后，宣布中止会议并勒令旁听人退席。\n\n然而，风波并未就此平息。接下来的数日里，会议一再因骚动而被迫散会，议员出席率不断下降，议场几近空置。国会事实上陷入瘫痪，正常议事程序难以维持。根据宪法规定，选举大总统须有相当比例议员列席方可进行，而眼前的情势却使这一程序变得愈发渺茫。共和国的最高权力更替，正被街头与议场的混乱所牵制。"
 league_rebuild.13.a: "我们必须尽快恢复秩序"
 league_rebuild.14.t: "边缘派系的联合"
 league_rebuild.14.d: "连日来的政治动荡，使国会内外弥漫着前所未有的不安。议场屡次因争执与骚乱而中止，街头集会此起彼伏，报刊版面充斥着对“议会失能”的批评之声。工商联与政学系之间的相互攻讦愈演愈烈，原本寄望于协商与程序解决分歧的温和人士，也逐渐对现状感到失望。社会舆论中，开始出现呼吁“强力整顿秩序”的声音。\n\n在这样的氛围下，国会内部一些长期处于边缘位置的温和派系开始重新接触。由厉麟似领导的景星学会与马叙伦主持的人民救国会经过数次私下磋商，达成共同声明，宣布成立“国家团结联盟”。他们宣称，当务之急是恢复议会秩序与社会稳定，重建公众对制度的信任，而非延续无休止的党派纷争。联盟随即推举厉麟似为总统候选人，试图在既有三大力量之外开辟第四极。\n\n这一举动迅速引起震动。许多原本摇摆不定的议员开始将目光投向这一新兴力量，认为在持续的对立与疲惫之中，团结或许成为唯一可行的出路。联盟所提出的恢复秩序、改善民生与整顿行政的纲领，赢得了部分中间派与保守派议员的认可。\n\n在一次重新召开的会议上，气氛依旧沉重，却少了此前的喧嚣。经过投票，国家团结联盟在一种疲惫与恐慌交织的氛围中取得多数支持。新的政治力量就此登上舞台。然而，这一联盟能否兑现其恢复秩序与重振信心的承诺，仍有待时间与现实的检验。共和国的前路，并未因此而变得清晰。"
 league_rebuild.14.a: "愿这个内阁能存活的久一点吧......"
 league_rebuild.15.t: "进两步，退一步"
 league_rebuild.15.d: "预算案的顺利通过，一度被视为政府稳住局势的重要信号。民主科学社在国会中的多数地位得到确认，财政安排也终于尘埃落定。然而，议场之外的现实却并未随之平静。罢工与示威仍在延续，部分城市治安状况反复，失业与物价问题持续发酵。社会的不安情绪，并未因一次表决的胜利而消散。\n\n在此背景下，褚辅成近日与自治军高层举行了一次闭门会议。会谈细节未对外公布，但随后流出的消息显示，双方就维持社会秩序与稳定政局达成某种默契。政府或将调整内阁部分席位，并适度提高军事预算，以换取军方在关键时刻的配合与迅速行动。相关人士强调，这是在非常时期确保国家运转的必要安排。\n\n消息传出后，舆论迅速分化。支持者认为，在社会动荡尚未平息之际，强化秩序力量有助于防止局势进一步失控；批评者则指责此举是在向“枪杆子”作出让步，担忧军方在政治中的影响力由此扩大。无论评价如何，短期内，褚辅成的领导地位似乎得以巩固。只是，这一步退让究竟是权宜之计，还是未来政治格局转变的开端，仍有待时间给出答案。"
 league_rebuild.15.a: "这是必要的妥协"
 league_rebuild.16.t: "团结联盟解散"
 league_rebuild.16.d: "在连月的整顿与协商之后，围绕秩序恢复与权力安排的各项措施相继落地。各地代表陆续抵达南京，原本分散于商会、学界与地方团体之间的意见，被汇集到同一张议事桌上。有关财政、治安与地方行政的若干问题，已先后形成处理办法，局势渐趋平稳。\n\n随着局势安定，关于中央权力归属的问题被正式提上议程。此前在协作框架内运作的各派力量，开始以更明确的政治形态参与竞争。其中，中国人民救国会依托其在工会、学界与地方团体中的联系网络，主张继续推进廉政整饬与社会改良；而以厉麟似为核心的景星会，则强调秩序、效率与行政体系的集中运作，获得部分官僚与既有行政人员的支持。\n\n南京方面决定，以各界代表的支持情况作为衡量依据，对未来政府的主导力量作出安排。各地报送的代表意见、社团表态与地方协商结果，被统一汇总，以形成对两方支持度的评估。数日之间，城中报馆纷纷刊载相关动向，街谈巷议亦多围绕两方优劣展开。\n\n结果公布之日，代表齐集会场，名单与统计数字逐一宣读。随着最后一项数据确认，新的执政安排随之确定。原有的联合格局由此转入以一方为主导的施政阶段，而另一方则退居协商与监督的位置，继续在既有框架内活动。国家团结联盟所开启的协作局面，至此进入新的阶段。"
 league_rebuild.16.a: "由人民救国会主导新政府"
 league_rebuild.16.b: "景星会接掌了国家机器"

 ##新北伐事件
 league_national.1.t: "辛亥未竟之事"
 league_national.1.d: "北京城头的旗帜在寒风中猎猎作响。南京临时民主政府的军队已经进入紫禁城外的广场，旧日象征帝国与军阀权威的城门，如今第一次向一个自称“民国”的政权敞开。电报自各省飞向首都，字里行间充满谨慎的乐观——历史，似乎终于走到了一个迟到的节点。\n\n回溯二十余年前，辛亥革命同样以南京为起点。那时，革命军高举共和之名，多路北伐，誓言扫清旧秩序。然而现实远比口号残酷。南北力量悬殊，列强态度暧昧，革命党人不得不在妥协中接受和议，用不完整的胜利来换取脆弱的和平。民国得以建立，却从未真正踏入北京，民主的旗帜始终停留在长江以南。而数年后爱新觉罗家族拙劣的复辟闹剧更是证明了这一点。\n\n而今日，历史的空白终于被填补。北京被占领，象征意义远胜于军事成果。它意味着民国第一次以胜利者的身份，站在旧帝国的中心。然而，胜利的喜悦并未持续太久。进入北方的军队组织混乱，编制、军饷与指挥体系各不相同；多年战争耗尽了国民经济，铁路破败、工厂停转、财政账目难以为继；更令人不安的是，这片广袤的土地上，文盲依旧占据多数，民国的语言尚未真正被理解。\n\n北京的陷落不仅仅是终点，更是一道沉重的起跑线。辛亥未竟之事，是要在满目疮痍之上，重建一个能被人民理解、也能自我维系的国家。历史终于给了南京第二次机会，而这一次，没有机会可以退让。"
 league_national.1.a: "民国不能止步于此"
 league_national.2.t: "“钱鬼子”的请求"
 league_national.2.d: "随着北京政府的覆灭，中央展开了针对旧政权权贵资产的大规模清查行动。就在财政部准备公布第一批查封名单之际，一位出人意料的访客悄然抵达南京——前北洋政府财政总长、曾任中国银行总裁的王克敏。\n\n这位昔日游走于北洋政坛与金融界之间的老官僚没有携带任何随从，只带来了一份厚厚的名单。名单上的人并非军阀将领，而大多是前政府的高级文官、银行家、实业家以及与北京政府关系密切的士绅。他们之中有人确曾依附权贵，也有人只是身处旧体制之内。王克敏承认，他们并非人人清白，但若一概没收财产、彻底清算，不仅会引发金融界的恐慌，也将使大量管理经验与社会资源随之流失。\n\n他向政府提出请求，希望能够对名单上的部分人士网开一面，在确认其并无严重罪行后，允许其保留部分合法资产，并承诺不再追究政治责任。作为交换，他愿意利用自己数十年来积累的人脉，协助政府稳定金融市场，协调银行与工商界，并邀请北方仍持观望态度的企业家与技术官僚南下，共同参与新政府的国家重建。"
 league_national.2.a: "让“活账本”发挥他的作用吧"
 league_national.2.b: "我们绝不会与旧时代的寄生者做交易"
 league_national.3.t: "新国旧债"
 league_national.3.d: "北京政府留下来的遗产中，最棘手的莫过于堆积如山的外债。数十年来，为维持统治、支付军费、修筑铁路乃至弥补财政亏空，历届政府不断向外国银行团举债，债务早已如滚雪球般膨胀。如今北京政府虽已覆灭，但各国公使馆与银行代表却纷纷来到南京，要求新政府承担全部偿还责任。\n\n财政部很快得出了一个令人沮丧的结论：若按原有合同全额履约，仅利息支出便足以拖垮尚在恢复中的国家财政，更遑论全国重建与军队整编。继续照单全收，无异于让新生的共和国背负旧时代留下的沉重枷锁。\n\n然而，彻底拒绝偿还同样代价高昂。此举势必严重损害中国的国际信用，使未来贷款、贸易乃至外交谈判都陷入困境，甚至可能招致列强的联合施压。如何在维护国家利益与维持国际信用之间取得平衡，已成为政府必须面对的现实难题。\n\n经过数日讨论，国务院提出了一项折中方案：成立国家债务整理委员会，全面清查北京政府遗留债务，与各债权国重新谈判，以延期、折价与重组等方式逐步清偿，尽可能减轻共和国的财政负担。"
 league_national.3.a: "我们只能违约"
 league_national.3.b: "成立债务整理委员会"
 league_national.4.t: "政治解冻及其后果"
 league_national.4.d: "随着《政团法》正式颁布，民国长期冻结的政治生活终于迎来了久违的春天。曾经因直系军阀高压统治而沉寂多年的报刊、学会与政治社团纷纷恢复活动，演讲、集会和公开辩论再次出现在各大城市的街头广场。曾充当北京政府附庸的“和谐社团”在吴佩孚通电下野后迅速宣告解散，其成员或淡出政坛，或转投景星社，希望在新时代继续发挥影响；一批早年倡导立宪、坚持议会政治的知识分子则联合组建民主宪政党，试图以法治、地方自治与代议制度为共和国奠定稳固基础。\n\n然而，被释放的不仅是温和派的声音。长期流亡海外或转入地下活动的各类政治力量，也借此机会重新走到聚光灯下。青年中国党正式完成南北两部合并，高举国家主义的大旗，主张强有力的国家复兴；南方支部由“断头将军”李宝章主持，北方则由李璜领导，其激进演说吸引了大量青年学生。与此同时，李大钊领导的工团党与宋庆龄领导的国民党宣布建立联合阵线，在议会内外积极宣传“民生革命”，要求扩大劳工权益、推动土地改革，并进一步限制资本势力对政治的影响。\n\n议会尚未正式运转，全国各地的政治热情却已率先被点燃。报纸针锋相对，政党四处奔走，广场上的演讲此起彼伏。有人相信，唯有容纳不同声音，共和国才能真正摆脱军阀政治的阴影；也有人担忧，过度的自由终将孕育新的极端主义，将共和国重新拖入混乱。面对这场来之不易的政治解冻，我们又该将民主的边界划在何处？""
 league_national.4.a: "这也是民主政治的一部分"
 league_national.4.b: "我们不能让下一个萨文科夫上台"
 league_national.5.t: "民主科学社成立"
 league_national.5.d: "随着秩序日渐稳固，曾在统一战争期间发挥重要作用的自治同志会，也迎来了新的历史使命。褚辅成在南京宣布，自治同志会即日起正式改组为“民主科学社”，并作为公开活动的全国性政党参与民国政治。\n\n在成立大会上，褚辅成表示，军阀时代的结束意味着依靠临时联盟维系政治的时代已经过去，民国需要的是能够长期推动制度建设、培育公民政治与监督政府施政的现代政党，而非因时局聚散的政治集团。民主科学社将继承浙江自治运动以来倡导的地方自治、科学治国与民主宪政理念，联合各地学者、工程师、教育界人士及开明绅商，以知识与理性作为共和国发展的根基。\n\n值得注意的是，“科学”二字并不仅意味着自然科学的发展，更象征着以以制度代替人治。褚辅成呼吁各界人士摒弃军阀时代遗留下来的派系恩怨，在议会政治与法治框架下共同建设一个真正属于人民的民国。\n\n随着民主科学社的成立，联省自治运动终于完成了由地方政治运动向全国性宪政政党的蜕变。"
 league_national.5.a: "五四的回音依然存在"
 league_national.6.t: "国民党的归来"
 league_national.6.d: "北京光复之后，共和国终于结束了长期军阀割据的局面。然而，如何在新的政治格局下组织温和自由主义力量，成为摆在黄郛面前的一项重要课题。\n\n近日，黄郛联合旧政学系成员、前国会议员、法律界人士及各地自由派知识分子，在北京正式宣布恢复中国国民党，并明确表示，新党既不是广州革命政府时期的国民党，也不是任何个人的政治工具，而是继承民国元年共和精神的新政党。\n\n在成立大会上，黄郛提出所谓“民元精神”，即以1912年中华民国成立之初所确立的宪政原则作为共和国未来发展的根本方向。责任内阁、政党政治、司法独立、公民自由以及国会至上的制度设计，被重新确立为党的基本纲领。他指出，真正的共和国绝不能依靠军队维持，更不能寄托于个人威望，而应建立在法律、制度与人民共同认可的政治规则之上。\n\n与此同时，不少旧政学系人士也表示，政学系只是特殊历史环境下形成的政治集团，如今共和国已经重新统一，全国性的现代政党将取代过去依附议会派系而存在的政治组织。"
 league_national.6.a: "民国需要真正的政党政治"
 league_national.7.t: "工商勇进党成立"
 league_national.7.d: "随着共和国秩序逐渐恢复，全国各地商会、银行公会与实业团体之间的联系日益紧密。过去以江南商帮为核心、依靠地域纽带维系的工商联盟，已难以适应全国统一后的政治格局。近日，在南京举行的全国工商界代表大会上，荣宗敬联合各地商会领袖、民族银行家与企业代表宣布成立“工商勇进党”，作为代表全国工商业利益的现代政党，正式参与共和国的议会政治。\n\n荣宗敬在大会上表示，国家的富强绝非单凭政治口号即可实现，而必须建立在工厂、铁路、银行与市场之上。工商勇进党将秉持“实业立国、工商报国”的理念，维护私有产权与契约精神，推动统一市场、稳定币制与减轻税负，并鼓励私人资本投资交通、能源与制造业，为共和国的工业化奠定坚实基础。\n\n与此同时，各地商会决定共同组建“全国工商业联合会”，作为协调工商界事务的全国性组织，与工商勇进党相互配合，一者代表工商界发声，一者参与国家政治。随着这一新的政治力量登上舞台，民族资本终于拥有了属于自己的政党，而共和国未来的经济政策，也势必将受到工商界越来越深刻的影响。"
 league_national.7.a: "实业兴，则国家兴"
 league_national.8.t: "新的选举"
 league_national.8.d: "随着全国局势渐趋稳定，临时政府正式宣布举行共和国统一后的首次国会选举。自辛亥革命以来，中国并非没有举行过选举——民元国会曾寄托着无数人的希望，湖南也曾掀起轰轰烈烈的民选省长运动。然而，在随后二十余年的军阀混战与专制统治中，选举逐渐沦为权力的装饰品。尤其是直系政府时期，所谓的国会不过是“和谐社团”举手表决的舞台，议席早已由枪杆与权势预先决定，人民手中的选票不过是一纸空文。\n\n如今，北京已经光复，共和国重新建立，宪法与议会不再只是纸上的文字。来自全国各地的候选人纷纷踏上竞选之路，报纸争相刊登政见，学校、商会、工会乃至乡镇集市都成为演讲与辩论的场所。不同政党奔走四方，试图说服选民将国家的未来托付给自己。有人希望通过制度建设巩固共和，有人寄望实业振兴富强国家，也有人呼吁以科学与自治塑造新的政治秩序。\n\n无论最终是谁赢得多数席位，这场选举都意味着一个新时代的开始。二十余年来，共和国第一次真正将国家前途交到了选票，而不是刺刀手中。"
 league_national.8.a: "民主科学社赢得了民众的信任"
 league_national.8.b: "国民党成功组阁"
 league_national.8.c: "工商勇进党获得了多数选票"
 league_national.9.t: "国家团结联盟成立"
 league_national.9.d: "共和国第一次自由选举落下帷幕，民主科学社、国民党与工商勇进党凭借各自深厚的政治基础，顺利取得国会多数席位。然而，对于长期活跃于政坛的中国人民救国会与景星会而言，零散的议席显然不足以影响国家未来的发展方向。\n\n经过数日磋商，马叙伦与厉麟似共同宣布，两党将以议会联盟的形式成立国家团结联盟。二人认为，新共和国固然已经摆脱了军阀专制，但真正的民主政治绝不应成为少数大党的舞台。联盟既希望监督政府，推动廉政建设、社会改革与劳动立法，也主张强化国家动员能力，培养现代公民精神，使共和国能够在复杂的国际局势中保持团结与活力。\n\n尽管双方在许多问题上仍存在分歧，但他们一致认为，与其各自作为国会中的少数派，不如联合行动，在重大议案上形成足以左右局势的力量。尽管国家团结联盟尚不足以撼动执政党的优势，但没有人会忽视这支新兴力量。随着越来越多地方团体与独立人士向其靠拢，它或许终将成为左右国会局势的一枚重要砝码。"
 league_national.9.a: "有趣的变化"
 league_national.10.t: "[GetYear]年全国大选"
 league_national.10.desc: "随着共和国重新统一，全国性的政治生活终于重新走上正轨。自民元国会以来，中国曾无数次尝试建立现代民主制度，但军阀割据、外部干涉与政治动荡一次次中断了这一进程。如今，昔日分裂的各省终于在同一面宪法旗帜下团结起来，新的全国选举也成为检验共和制度能否真正扎根的重要时刻。\n\n与过去不同，这一次选举将不再局限于少数地区或地方势力之间的角逐。来自各地的政党、社会团体与政治联盟纷纷展开行动，试图向人民展示各自对于国家未来的规划。有人主张进一步完善共和制度，以民主与科学推动国家进步；有人希望依靠实业发展与社会秩序实现富强；而国家团结联盟也开始参与其中，试图在不同政治力量之间寻找属于自己的道路。\n\n全国各地的报纸、学校、商会、工会与地方组织再次成为政治讨论的中心。候选人走入城市街巷与乡村集市，向选民阐述自己的理念，而人民也第一次能够在全国范围内决定国家未来的方向。无论最终哪个政党或联盟取得胜利，这都将成为中国民主历史上具有里程碑意义的一刻。"
 league_national.10.a: "民主科学社点燃启蒙之光"
 league_national.10.b: "国民党携炬而行"
 league_national.10.c: "工商勇进党取得多数"
 league_national.10.d: "人民救国会带来变革之风"
 league_national.10.e: "景星会开启稳健之治"
 league_national.11.t: "北京新政府的承认请求"
 league_national.11.d: "以[FROM.GetName]为首的民主力量已光复北京，宣布建立共和国新政府。该政府正寻求国际社会的承认，以巩固其合法性并重建国家秩序。\n\n新政府承诺保护外国在华投资与侨民安全，并希望与我国建立正式外交关系。作为回报，承认其合法地位将为我国企业在重建中的共和国赢得优先投资权与市场准入机会。\n\n我国应如何回应这一请求？"
 league_national.11.a: "承认新政府，开启合作之门"
 league_national.11.b: "暂缓承认，静观其变"
 league_national.12.t: "国际社会承认新政府"
 league_national.12.d: "[FROM.GetName]已正式承认我国新政府的合法地位。\n\n这一外交突破标志着共和国重返国际社会迈出了坚实的一步。随着外交关系的建立，外国资本与技术有望进入我国，为百废待兴的国民经济注入新的活力。\n\n我们期待在相互尊重与合作互利的基础上，与世界各国展开更加深入的外交与经济往来。共和国的大门已经向世界敞开。"
 league_national.12.a: "共和国重返世界舞台"
 league_national.13.t: "国际承认请求暂未获回应"
 league_national.13.d: "[FROM.GetName]对我国的承认请求暂未作出积极回应。\n\n虽然这并不意味着外交大门完全关闭，但我们的国际合法性仍需更多国家的认可方能巩固。分析人士指出，对方可能仍在观望共和国的政治稳定性，或等待更有利的谈判时机。\n\n我们应继续通过外交渠道保持沟通，同时以自身的稳定与发展证明新政府的可靠与持久。时间将证明一切。"
 league_national.13.a: "我们将以行动赢得认可"
 league_national.14.t: "[ROOT.GetLeader]总统与七君子会晤"
 league_national.14.d: "对于许多曾经为民主宪政与民族救亡事业奋斗的人士而言，共和的道路并非一帆风顺。在过去的岁月中，他们曾因坚持自己的信念而遭受迫害，甚至被囚禁于铁窗之中。如今，政府邀请中国民主政团同盟的重要人士赴总统府会晤，并特别向曾因“七君子事件”而蒙受迫害的沈钧儒、章乃器、邹韬奋、李公朴、史良、王造时、沙千里等人表达敬意。\n\n数年前，在民族危机日益加深的背景下，全国各界救国联合会成立，号召各阶层团结起来，共同抵抗外侮。然而，这一以和平救国、推动民主为目标的组织，却遭到了旧政府的压制。1936年，沈钧儒等七名救国会领导人士被逮捕，以所谓“危害国家”的罪名遭到审判，引发全国范围内的强烈反响。在狱中，七君子拒绝屈服，坚持认为国家的统一与民族的复兴，必须建立在宪政、法治与人民参与的基础之上。他们的抗争最终迫使当局在全国压力下释放七人，也使“救国”与“民主”的理念更加深入人心。\n\n会谈中，双方重点讨论了共和国未来的制度建设问题。沈钧儒认为，经历多年军阀割据与政治动荡后，中国最需要的是一套能够保障人民权利、限制权力滥用的现代政治制度。他向[ROOT.GetLeader]总统建议，应进一步完善司法独立体系，在各省逐步设立巡回法庭，使偏远地区的民众也能够获得公平审判；同时扩大地方议会在财政预算与公共事务上的监督权，让地方自治不再只是纸面上的口号。此外，沈钧儒还提出，应尽快制定《请愿法》《集会法》等相关法律，为民众表达意见、参与公共事务提供明确的制度渠道。\n\n临别之际，沈钧儒将自己多年整理的法学笔记，以及多年以前撰写《家庭新论》时留下的手稿赠予[ROOT.GetLeader]总统。他表示，个人的研究或许有限，但如果能够为共和国未来的法律建设提供一点参考，便不负自己数十年来追求宪政与民主的初心。"
 league_national.14.a: "感谢您为国家的付出！"
 league_national.15.t: "军事北伐，官僚南伐"
 league_national.15.d: "北京既克，旌旗南归，军功赫赫。随着北京政府旧有政治体系的瓦解，大批曾服务于北洋政府的行政人员、外交官与法律人士开始南下，寻求加入新的共和国。他们中有人曾任职中央政府，有人参与过外交谈判，也有人长期研究宪政与行政制度。虽然他们来自旧时代，但其中不少人并未效忠于某个军阀，而是希望将多年积累的经验用于国家重建。\n\n顾维钧、颜惠庆、白坚武等北洋时期的政治人物，如今选择与南京政府合作。他们带来的不仅是过去的政治关系，更是现代外交、行政管理与法律建设方面的经验。在共和国百废待兴之际，这些经验对于稳定中央机构、恢复政府职能而言，无疑具有重要价值。\n\n起初，此举被视为权宜之计。吸纳旧员，既可缩短整编与接收所需时间，又可借其熟悉北方行政体系之便，维持秩序运转。然而不久之后，官署之中“北来之人”愈发众多，其升迁之速，往往与其旧日资历或所掌资源成正比。有人私下议论：“军事北伐，官僚南伐。”言语之间，颇多讥讽。\n\n更令人忧虑者，并非人数之多，而是风气之变。旧式衙门作风、层层请示与因循守旧之习渐入机关；重资历、讲关系的官场逻辑，亦与自治精神渐生抵牾。部分早年投身自治运动的理想派人士，见关键岗位频为旧员所据，难免心生失望。\n\n我们或许确实需要他们的经验，但若价值与方法亦一并继承，那么胜利的意义便值得反思。北伐已竟，如何避免精神上的“南伐”，或许才是更长远的考验。"
 league_national.15.a: "勿使旧弊复生"
 league_national.16.t: "旭日的伪装"
 league_national.16.d: "当日本军队越过国境、炮火再次落向中国土地时，南京政府内部却出现了一种不同于往日的复杂情绪。若东京依旧由军部与威权势力主导，那么这场战争或许并不难理解；然而，倘若此时执掌日本政权的，恰恰是自诩维护宪政与议会政治的政友会或民政党，那么眼前的一切便显得格外荒诞。\n\n日本人曾长期将自己塑造成“亚洲民主的灯塔”。他们宣称议会政治、政党竞争与宪政制度证明日本已经跻身文明国家之列，并以此自居为亚洲其他民族效法的榜样。如今，这面旗帜却与日本士兵的军靴一同踏上了中国的土地。无论东京的议会里坐着谁，侵略依然是侵略。\n\n对我们而言，这或许正是这场战争最令人痛苦之处。南京与东京之间或许拥有相似的宪政制度，双方的报纸或许都在谈论自由、议会与人民，甚至两国的政治家都可能声称自己是在捍卫民主。然而，当日本军队烧毁村庄、轰炸城市、杀害平民时，这些漂亮的辞藻便再也无法掩盖刺眼的现实。§R民主不能成为侵略的护身符，议会也不能替刺刀洗去鲜血。\n\n二十多年前，中国曾以共和革命打破亚洲帝制的旧秩序，并成为这片大陆上第一个共和国。如今，我们更没有理由向任何人低头。倘若日本真的相信自由与民主，就应当首先让自己的军队停止侵略；而在那之前，我们唯一能够相信的，只有自己的枪炮与决心。\n\n我们无意与日本人民为敌，但我们将与侵略者战斗到底。我们要延续亚洲第一个共和国的精神，也要让世人看清，真正的民主不在于政府如何称呼自己，而在于它是否尊重别国人民生存与自由的权利。"
 league_national.16.a: "民主不能为侵略辩护"
 league_national.17.t: "民主对抗独裁"
 league_national.17.d: "东京的政变最终撕下了日本宪政的最后一层面纱。军部夺取政权，议会政治被迫停摆，曾经高举“亚洲民主灯塔”旗帜的日本，如今却落入一群身着军装的独裁者手中。昨日还在议场中争论国家未来的政客，如今或遭监视，或被迫噤声；而决定战争与和平的权力，则落入了少数军人手中。\n\n军部或许仍会向世人展示日本工厂中昼夜不停的机器、不断增长的产量，以及所谓“高效而有序”的国民经济。但在这些数字与钢铁的背后，又究竟隐藏着什么？是被迫沉默的人民，是被剥夺谈判权利的工人，也是无数家庭以血汗换来的战争机器。一个以武力压制本国人民的政府，又有什么资格声称自己能够为亚洲带来自由？\n\n对于南京而言，这场战争的性质已经无需再作辩解。这不再仅仅只是两个国家之间关于利益与疆界的战争，而是民主共和国与军国独裁之间的殊死斗争。因此，我们必须证明，共和与自由并非软弱的代名词。\n\n从辛亥革命以来，中国人便相信一个国家可以凭借自己的意志建立共和国。如今，亚洲第一个共和国必须再次站出来，以自己的行动告诉整个东方：§R民主不会向刺刀低头，自由也绝不会向独裁者投降。这场战争或许漫长而残酷，但我们所捍卫的并不仅仅是南京的城墙、长江的土地或中国的疆界。我们所捍卫的，是一个民族选择自己政府的权利，也是整个亚洲摆脱军阀、军国主义与独裁统治的希望。"
 league_national.17.a: "让我们为自由而战"
 league_national.18.t: "在东北军内部的渗透"
 league_national.18.d: "奉天与日本的联合进攻，使共和国不得不面对一个残酷的现实：在北方战场上，与我们交战的是日本帝国长期以来对于东北政治与军事体系的渗透。然而，南京方面同样清楚，奉军内部并非所有人都愿意成为外国势力的附庸。许多青年军官出身中国，却在复杂的时代洪流中被迫站在了错误的一方。\n\n通过情报部门长期搜集的资料，我们发现奉军体系内部已经存在若干反日思想组织。其中最受关注的是真勇社（又称东北青年革命军人挺进团）。该组织由一批军校出身的青年军官组成，依靠同窗、师生以及旧日军旅关系维系联系，表面上以军人互助为名，实际上则暗中传播民族主义思想，试图唤醒军人保卫中国的责任感。\n\n除此之外，东北青年甦生联盟会、仙洲同盟等青年团体，也正在奉军知识分子与军校学生之间扩大影响。他们虽然政治立场并不完全一致，但都对日本势力日益深入东北军政体系抱有警惕，并希望寻找改变现状的机会。而东北青年军人抗日同志会，则更加直接地尝试在基层军官与部队之间建立联系，鼓励奉军官兵重新思考自身效忠的对象。\n\n与此同时，一些来自南方的情报网络也报告称，部分奉军军官与国内反日力量保持着隐秘联系。过去，这些关系或许只能作为个人理想与私下抱怨存在；但如今战争爆发，我们决定主动利用这些潜在的裂痕。\n\n共和国开始通过广播、报刊以及秘密渠道向奉军展开宣传，向他们宣告：他们首先是中国人，其次才是某一派系的士兵。日本可以提供武器与顾问，却无法给予中国军人真正的尊严与未来。凡愿意放下武器、回归祖国者，南京政府都将给予宽大待遇。"
 league_national.18.a: "团结可以团结的力量"
 league_national.19.t: "胡博士的讲话"
 league_national.19.d: "“下面我们有请胡博士讲话。”随着议长敲下桌上的锤子，原本躁动的参议员们顿时安静了下来。\n\n胡适慢慢走上了讲台，扶了一下眼镜，又抬头扫视了一眼在座的议员们。“诸位议员先生，今天我要讲的，只有一句话：请你们多提出一些问题，少谈一些纸上的主义！”\n\n他停顿了一下，刻意清了嗓子。”空谈好听的‘主义’，是极容易的事，是阿猫阿狗都能做的事，是鹦鹉和留声机器都能做的事。空谈外来进口的‘主义’，是没有什么用处的。一切主义都是某时某地的有心人对于那时那地的社会需要的救济方法。我们不去实地研究现在的社会需要，单会高谈某某主义，好比医生单记得许多汤头歌诀，不去研究病人的症候，如何能有用呢？\n\n偏向纸上的‘主义’是很危险的。这种口头禅很容易被无耻政客利用来做种种害人的事。罗兰夫人说，‘自由自由，天下多少罪恶，都是借你的名做出的！’一切好听的主义，都有这种危险。\n\n现在中国应该赶紧解决的问题真多得很：从人力车夫的生计问题到大总统的权限问题，从卖淫问题到卖官卖国问题，从解散腐败的政治团体问题到加入国际联盟问题，从女子解放问题到男子解放问题……哪一个不是火烧眉毛的紧急问题？我们不去研究人力车夫的生计，却去高谈社会主义；不去研究女子如何解放，家庭制度如何救正，却去高谈公妻主义和自由恋爱；不去研究如何澄清吏治，却去高谈无政府主义。我们还要得意扬扬夸口道，我们所谈的是根本‘解决’。\n\n为什么谈主义的人那么多，研究问题的人那么少呢？这都由于一个‘懒’字。研究问题是极困难的事，高谈主义是极容易的事。高谈主义，不研究问题的人，只是畏难求易，只是懒！\n\n凡是有价值的思想，都是从这个那个具体的问题下手的。我希望各位议员先生，把一切‘主义’摆在脑背后，做参考资料，不要挂在嘴上做招牌，不要叫一知半解的人拾了这些半生不熟的主义去做口头禅。‘主义’的大危险，就是能使人心满意足，自以为寻着包医百病的‘根本解决’，从此用不着费心力去研究这个那个具体问题的解决法了。”"
 league_national.19.a: "我们完全赞同胡适博士的见解"
 league_national.19.b: "胡适博士固然有理，但一个清晰的主义同样重要"

 league_national.20.t: "口诛笔伐"
 league_national.20.d: "随着政府抨击日本帝国的一封封电报由古老中国的首都拍出，一场由官方主导、各界响应的宣传浪潮迅速席卷各大城市。从秦淮河畔，到外滩，再到天安门，一夜之间，鲜红的标语贴满了大街小巷——电线杆、学校外墙、外国使馆——“打倒列强！”“奉张卖国，暴日必诛！”“收复东北，还我河山！”\n\n学生们组成了数百支宣传队，手执铁皮喇叭，在街头直斥张作霖“认贼作父、鱼肉关外”，怒陈日本“蚕食华夏”的暴行。《申报》更以半文半白的激昂笔调，向全国发布《告父老同胞书》：\n\n“逆贼张作霖，蟠踞辽沈，阴结暴日，开门揖盗。自丙辰以来，日人借张贼之手，占我铁路，掠我矿山，庇匪纵毒，近复增兵满洲，视三省为禁脔。凡有血气之伦，莫不眦裂发指！\n\n我赤县中国，克承正统，誓保金瓯。今顺应兆民之心，兴师讨逆，兼逐日寇。愿我四万万炎黄子孙，有钱者解囊，有力者荷戈，雪耻图存，在此一举。宁作玉碎，不为瓦全！”\n\n檄文所到之处，民气如沸。征兵站前排起长龙，乡间老妪捐出银簪，报童沿街叫卖“号外”。对此，沈阳已发出措辞强硬的回击，日本的驻华公使也发出照会，要求“严惩反日分子”山海关沿线已成为世界上布防最为严密的地区之一，仅次于阿尔萨斯-洛林。同时，部分商会领袖担心即将到来的战争冲击生计，私下向政府表达了忧虑。"
 league_national.20.a: "对日寇张匪的最后一战！"
 league_national.20.b: "差不多得了，日本人还在看着呢"

 league_national.21.t: "孙文的遗产？"
 league_national.21.d: "当卫兵打开议事厅大门后，在座议员无不惊骇——孙科，孙中山之子，正大步流星地碾过国会的华丽地毯。这位前太子虽然已经不在国民党内担任正式职务，但依旧是其精神象征。\n\n旁听席上出现了骚动。然而，他没有理会耳语和嘘声，直截了当地讲了起来。\n\n“我们今日所主张的，不是代议制的修修补补，而是真正彻底的全民俗政治。人民能够实行选举、罢免、创制和复决这四个权，才算是充分的民权。这四个权，好比放水制与接电钮；有了放水制，人民可以直接开关水源；有了接电钮，人民可以直接点亮电灯。同理，有了这四个民权，人民便可以直接管理国家的政治。这样的权利，才是极完全、极彻底的权利。”\n\n议员们一言不发地听着他的话：他们心里很清楚，这些话是他的父亲——中华民国的国父——孙中山先生的。最后一个音节从孙科嘴中吐出后，议员们立刻旗帜鲜明地分成两派：左边大声叫好，右边一片嘘声。\n\n“辛亥首义至今已经二十余年，然而共和无从落实，竟叫清妖复辟，正是民权虚悬所致！”其中一个议员大吼道。立刻有人反驳，“孙中山、蒋中正现在在哪里发财啊？”孙科冷眼看着他们的争吵，不发一言。"
 league_national.21.a: "这才是共和应有之义"
 league_national.21.b: "民主政治容不得激进实验"

 league_national.22.t: "一个幽灵在中华大地上游荡"
 league_national.22.d: "一直活跃于北方学界但尚未进入权力核心的中国青年党，今天终于登上了国会的讲台。青年党领袖曾琦受邀，在国会举行专题演讲。\n\n面对挤满议事厅的议员与旁听记者，他的开场便抛出尖锐质问：\n\n“今日中国之乱，根源何在？不在列强之压迫——压迫只是外因；不在官僚之腐败——腐败只是表象。根源在于国民不知有国家，政党只知有阶级。本党所主张的国家主义，非排外之盲目，亦非一党一派之专制，而是主张全民政治、全民革命。外抗强权，为求独立；内除国贼，为求统一；实行国家主义的教育，为求国民自觉。舍此三道，中国必亡。\n\n“外抗强权，内除国贼！这不是一句空号，而是本党同仁愿以颈血践行的誓言。国家主义者，非反对个人自由，而是反对以个人自由之名毁弃国家肌体；非鼓吹盲目排外，而是主张一切民族独立自决之权。今日中国之病，不在民智不开，而在国魂不凝！愿诸公醒觉，勿待亡国之后，再做楚囚对泣。”\n\n“阶级一分，国本立碎。中国只有穷国，没有两个阶级。我们有枪口对外还是对内的选择，没有无产阶级与资产阶级的战争。”"
 league_national.22.a: "此言正合吾意"
 league_national.22.b: "调子可以借来用，人不能全信"


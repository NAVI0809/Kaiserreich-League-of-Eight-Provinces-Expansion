 LEP_three_colors_democracy1: "三色民主：共和肇始"
 LEP_three_colors_democracy1_desc: "“三色”之名源自昔日浙江制宪运动，百余部宪草汇集议会，红、黄、白三案并立，象征协商与多元并存的共和理想，亦象征今日华东政局中自治派、政学系与商绅势力三方共治的现实。南京政府立志以法治安定江浙，然八省内战创痕未消，地方势力盘根错节，民心对新政仍多观望。多元协商虽能维系联盟，却也使决策迟缓、施政掣肘。唯有在持续的制度建设与稳健施政中，将纷杂之“三色”化为共识与力量，方能使民主由象征转为真正的国家根基。"

 city_capture_events.278.d.lep_dem: "首都郊区经过数日激战后，[FROM.GetAdjective]士兵终于登上了北京的外城墙，击退了守军并彻底击溃了首都的防线。随着最后一批守军撤离紫禁城，北京这座数百年来的帝国都城再次迎来了新的主人。黄郛、褚辅成等南京政府代表随后抵达北京，他们在北洋时期民国国会议场向全国发表了《告国民书》，宣布结束南北对峙，重建全国统一的共和政府。\n\n五色旗再次飘扬于天安门城楼之上。这面曾见证共和诞生、也见证军阀混战的旗帜，如今重新覆盖了这座古老的帝都。从袁世凯到直皖奉诸系，再到今日的南京政府，北京城头已数度易主。历史会不会再次重演，无人知晓；但至少此时此刻，中国终于再次拥有了一个足以宣称自己代表全国的政府。"
 city_capture_events.278.a.lep_dem: "北京终究还是失守了……"
 city_capture_events.278.b.lep_dem: "共和终于重返北京！"
 city_capture_events.278.c.lep_dem: "统一只是开始。"

 league_war_events.19.t: "封锁闽海？"
 league_war_events.19.d: "八省内战仍在鏖战，而福建沿海却始终未曾沉寂。随着厦门港重新落入国民党掌握，由法兰西公社领导的第三国际正源源不断地将军火、药品、无线电器材乃至军事顾问运入福建。更令南京震动的是，长期流亡巴黎的国民党中央委员会主席汪精卫，也已搭乘法国船支抵达厦门，在第三国际的支持下重新公开领导国民党革命。\n\n这一切令齐燮元怒不可遏。若任由海上运输继续畅通，福建叛军不仅不会因长期作战而衰弱，反而将在国际援助下愈战愈强。外事处已向巴黎提出严正抗议，但所有人都明白，纸上的抗议远不如海上的军舰来得有效。\n\n摆在南京面前的选择并不多。其一，是命令仍效忠于联合的海军前往福建沿海执行封锁任务。然而马尾水师兵变后，不少舰艇已倒向国民党，我军舰艇数量本就有限，贸然封锁恐怕收效甚微。其二，是请求德属东亚海军出面协助。十年前，他们曾凭借强大的舰队协助击碎北伐，如今若德国人再次介入，第三国际的运输船几乎无从靠岸。但福建近邻日本占据的台湾，一旦德日舰队在海上再次对峙，谁也无法保证局势不会迅速升级。最后，还有一个选择——向北方中央政府发去急电。直系海军方才奉命北返，若玉帅愿意施以援手，也许还来得及截断福建的海上生命线。"
 league_war_events.19.a: "去电海军司令部，责令海军立即封锁福建沿海"
 league_war_events.19.b: "请求德属东亚舰队协助封锁"
 league_war_events.19.c: "立即向中央政府发去电报"
 league_war_events.20.t: "海军闽厦警备司令部来电"
 league_war_events.20.d: "南京齐联帅燮元，联军海军吴总长纫礼钧鉴，\n\n自闽赣民党起事以来，我部巡弋闽海，严缉偷运军火。迄今尚未查获敌运军械物资。兹民党已迫近马尾要塞外围，与我守备部队对峙。我港内舰艇均在敌炮射程以内，情势危急。大型舰艇业于昨夜起锚北驶，以避敌火。马尾要塞王司令萼令：倘要塞失守，守军即乘港内余舰撤离，并毁弃未及运出之军械物资，毋使资敌。敬请吴总长即知会南通方面，预备接应各舰及随舰官兵，以资安置。\n\n此电\n\n海军闽厦警备司令官 萨师俊"
 league_war_events.20.a: "不仅办事不利我还得给你善后？你叔公知道了肯定很失望"
 league_war_events.21.t: "海岸巡防处来电"
 league_war_events.21.d: "南京齐联帅燮元，联军海军吴总长纫礼钧鉴，\n\n自闽赣民党起事以来，我部巡弋闽海，严缉敌运军械。现已获敌运械船数艘，均系西洋商轮，载运法制火炮。我部已将违禁军械悉数没收，以各轮均属外籍，恐滋外交纠纷，乃押赴公海，令其驶离。\n\n谨电奉闻，请酌办。\n\n海军海岸巡防司令官 吴振南 叩"
 league_war_events.21.a: "吴司令办事还是靠谱的"
 league_war_events.22.t: "海军江防舰队来电"
 league_war_events.22.d: "南京齐联帅燮元，联军海军吴总长纫礼钧鉴，\n\n闽赣民党起事以来，我部内河舰艇出动巡弋闽海，严缉敌运军械。顷获敌假借英法商轮，乘夜靠岸偷运军械，悉数查没。并拘获英法船员多人，讯毕递解出境。所获军械已交附近陆军接收，船只移送海关缉私处办理。\n\n谨电奉闻。\n\n海军江防舰队司令 李世甲 叩"
 league_war_events.22.a: "这还差不多"
 league_news.1.t: "南海对峙"
 league_news.1.d: "为阻止第三国际经由福建向国民党输送军需物资，德属东亚海军奉命协助八省联合封锁福建沿海。然而，一支由德国军舰要求接受检查的运输船队在日军护航舰艇介入后拒绝停船，双方军舰随即展开对峙。\n\n据目击商船报告，双方舰炮相继转向对方，数十艘舰艇在狭窄海域僵持数小时，现场气氛一度剑拔弩张。所幸柏林与东京在获悉消息后迅速展开紧急外交联络，两国驻东亚海军司令均接到命令克制行动，双方舰队随后各自撤离，对峙最终未演变为武装冲突。\n\n国际观察家指出，随着世界经济持续低迷，德国与日本都愈发依赖海外市场、资源维系国内局势，未来双方为维护各自在东亚的利益，或将采取更加强硬乃至冒险政策"
 league_news.1.a: "各国都在试探彼此的底线"
 LEP_naval_confrontation: "德日海军对峙"


l_simp_chinese:
 #自改
 #国策
 #八省内战
 LEP_crackdown_union_leaders: "镇压工会头目"
 LEP_crackdown_union_leaders_desc: "工人纠众罢工，扰乱军需生产，甚至受商团煽动。唯有以铁腕手段整肃工会，方能在短期内稳定后方，但此举也恐埋下长远隐患。"
 LEP_establish_staff_council: "成立联帅参谋团"
 LEP_establish_staff_council_desc: "齐大帅深知仅凭军力难以维持权威，必须吸纳亲信幕僚与忠诚军官组成参谋团，集中决策权力，从而架空地方自治派与工商联。"
 LEP_student_volunteer_corps: "动员学生志愿团"
 LEP_student_volunteer_corps_desc: "鼓励学生社团组织志愿团，参与宣传、救护与后勤工作。虽然增强了人力动员，但学生群体更倾向支持自治派与工商联。"
 LEP_support_federalist_movement: "口头承诺地方自治"
 LEP_support_federalist_movement_desc: "面对各省自治派的呼声，政府对外宣称愿意尊重地方自治权利，实则只是口头安抚。但即便如此，工商联也能借此宣示影响力，赢得更多地方士绅的支持。"
 LEP_restore_union_rights: "与工会妥协"
 LEP_restore_union_rights_desc: "长期的罢工与冲突令社会难以为继。工商联提议以让步换取工人回到生产线上，允许其有限参与劳资谈判。此举稳定了后方，也削弱了军阀对工会的打压。"
 LEP_chamber_parliament: "工商联席会议"
 LEP_chamber_parliament_desc: "工商联成员以私下聚会的名义举行联席会议，彼此交换情报，协调各地资金与人脉网络。表面上不过是商界闲谈，实则逐渐形成了一个平行于官方的经济与政治联盟。"
 LEP_raise_chamber_funds: "筹资商会军需"
 LEP_raise_chamber_funds_desc: "战时若无资金与物资补给，前线难以支撑。工商联遂自发组织筹款，以商会资金换取政治筹码，逐步摆脱对联帅的依赖。"
 #地区阶段国策
 LEP_provisional_senate: "临时国会"
 LEP_provisional_senate_desc: "新政府急需一个能够汇聚各方代表的机构，以避免陷入派系争斗的泥潭。临时国会将成为过渡时期的立法机关，负责协调各派利益、制定基础法案，并为未来更完整的宪政建设提供实验平台。尽管其权威尚不足以覆盖全境，但它象征着统一政治秩序的开端。"
 LEP_unite_gentry_merchants: "拉拢绅商"
 LEP_unite_gentry_merchants_desc: "新政权初立，财源未丰，地方秩序亦待整饬，尤需倚重江南绅商之力。荣宗敬等工商领袖素以实业起家，既通商情，又具社会声望，若能加以团结，不仅可稳固金融与工业根基，亦可弥合新旧阶层之间的隔阂。我们当以协商与保障并行，承认商界自治空间，吸纳其参与公共建设，使绅商由观望者转为合作者，共同维系东南经济之稳定与繁荣。"
 LEP_unite_national_liberals: "团结民族自由派"
 LEP_unite_national_liberals_desc: "北方政局变动之际，黄郛等一批主张宪政与理性治理的自由派人士南下，为地方政务带来新的契机。这些出身政学界的技术官僚熟悉法制与行政运作，既能维持制度连续，也能推动现代化改革。我们应主动吸纳其参与决策与规划，整合专业人才，完善文官体系，使行政由人治趋向制度化，在维持社会稳定的同时，为未来更广泛的政治整合奠定基础。"
 LEP_autonomy_outline: "自治大纲"
 LEP_autonomy_outline_desc: "自治同志会领导的执政联盟决定颁行新的《自治大纲》，在继承浙省旧制精神的基础上，确立“民治优先、行政公开、军政分权”的原则。各省政务由省务会议统筹议决，军队改编为地方防务力量，受统一法制节制，以防再度出现军人割据。同时整顿苛捐杂税，保障集会与出版自由，吸纳绅商与知识界参与治理，使自治成为稳定区域秩序、推动现代化行政的制度框架。"
 LEP_organize_defense_corps: "组织保卫团"
 LEP_organize_defense_corps_desc: "为弥补正规军整编后的防务空隙，各省政府计划在地方士绅与商团基础上重组保卫团，负责治安维持与要地守备。保卫团由省政府统一登记、训练与指挥，既可防范匪患与骚乱，也能在紧急时支援正规部队。此举强调“地方自保、民力协防”，试图以较低军费维持秩序，但亦意味着保留一定的地方武装力量，使华东的安全体系更依赖社会组织而非完全的中央军制。"
 LEP_disband_warlords_reduce_army: "废督裁兵"
 LEP_disband_warlords_reduce_army_desc: "长期以来，各省督军割据与冗兵积弊成为财政与政局不稳的重要根源。新政府决定推行“废督裁兵”，撤销旧式省督军体制，将军权收归省政府与中央联合指挥，同时逐步裁撤编制混乱、战斗力低下的旧部队，改编为省防军与治安部队。此举既可减轻军费负担，也有助于打破军阀旧习，确立文官主导的现代行政秩序，促进华东地区的稳定治理与制度化建设"
 LEP_southeast_autonomy_academy: "东南自治学院"
 LEP_southeast_autonomy_academy_desc: "自治同志会决定设立“东南自治学院”，专门培养熟悉地方政治、财政管理与公共行政的新式人才。学院将延揽学者与实务官员授课，强调宪政理念与地方自治实践，吸纳青年知识分子与基层干才入学深造。通过系统训练，使地方治理不再依赖旧式幕僚与私人关系，而是建立一支具备现代行政能力的自治干部队伍，为华东长期稳定与制度建设奠定人才基础。"
 LEP_peace_declaration: "和平宣言"
 LEP_peace_declaration_desc: "烽烟再起之际，我们谨记东南和平运动之遗志，向全国发表《和平宣言》。昔年江浙绅商与自治人士奔走呼号，主张停战撤兵、缓冲冲突，将地方政权还诸人民，以求免生灵涂炭。今日西北与华南局势再趋紧张，我们愿以此为鉴，倡导以协商取代兵戎，以民意约束权力。我们呼吁各方克制军备扩张，尊重地方自治与公民代表之权，使国家前途不再系于战场胜负，而寄托于理性与和平之道。"
 LEP_independent_audit_office: "独立审计"
 LEP_independent_audit_office_desc: "为整顿财政、树立法治威信，政学系在黄郛倡议下推动建立“独立审计”制度，将各省收支、军费与公营企业账目统一纳入专业审查。新设审计机关直接向议会与监察体系负责，避免行政部门自审自核之弊，并引入会计专才与现代预算制度，力求使财政运作透明可查。此举既可抑制贪墨与浪费，也为吸引商界投资与稳定金融秩序奠定可信基础。"
 LEP_personnel_bureau: "恢复铨叙局"
 LEP_personnel_bureau_desc: "新政府既立，行政之本在于人事。若任用无章、升迁失序，则再良之制度亦难运转。为建立稳定而规范之官僚体系，我们将恢复铨叙局，专责官员之任免、考核与晋升，以统一标准取代私人关系与临时决定。通过确立公开而明确之铨叙制度，使官员任用趋于制度化与专业化，使才干得以其位，职守各有所归。在此基础之上，逐步构建现代文官制度，使政府运作由人治走向有序之常规。"
 LEP_administrative_inspector: "派遣行政督查专员"
 LEP_administrative_inspector_desc: "为提升华东诸省的行政效率与法治水平，政学系提议设立“行政督察专员”，遴选熟悉现代财政与行政制度的技术官僚，分赴各地巡察施政情形，核查税收、治安与公共工程进度，并将报告直呈中央。通过制度化的督察与问责，我们得以统一施政标准，减少积弊流弊，使地方治理逐步迈向公开、理性与专业化的轨道。"
 LEP_secure_the_realm: "保境安民"
 LEP_secure_the_realm_desc: "统一之后的华东仍需时间重建秩序，自治同志会与江南商帮遂倡议以“保境安民”为施政重心，整顿地方团练与警备体系，协助县乡恢复日常治理，保障商旅往来与田赋征收的稳定。政府将依托绅商网络筹措经费，修缮仓储与交通节点，避免战乱余波冲击市场信心，使百业渐归平稳，为区域自治与长远发展营造安定环境。"
 LEP_clean_governance_stable_society: "清吏治，安社会"
 LEP_clean_governance_stable_society_desc: "新政既行，吏治与社会秩序亟待整饬。我们需要全面清查积弊，整顿各级机关，裁汰冗员，确立审计与问责之法，以法度取代人情。与此同时，加强地方治安与公共管理，约束豪强势力，缓和城乡矛盾，使市井复归安定。唯有官风肃清、社会有序，方能凝聚人心，推动华东走向长治久安。"
 LEP_livelihood_equality: "省民之生计"
 LEP_livelihood_equality_desc: "民生之计，为政所先。省政府宣布以生计均等为原则，在维系秩序之范围内保障人民经营与劳动之自由，并以法律扶助弱者与失业之民。凡山林河流堤防仓储等关系公共生计者，由政府统筹经营与修缮；对垄断性企业与天然富源，得依法加以裁制，使社会财富得以调和分配，求城乡安定，百业并举，共赴久远之治，以昭公义同享太平之世。"
 LEP_factory_welfare_reform: "企业福利改革"
 LEP_factory_welfare_reform_desc: "鉴于江南实业长期发展所积累的经验，政府决定推动企业福利改革，参考荣宗敬等民族企业家的管理模式，鼓励厂方设立宿舍、医疗、教育与互助制度，以稳定工人队伍并减少劳资冲突。通过在企业内部建立保障与协商机制，使生产秩序更加持久，也借此提升民族工业的社会形象，在维护资本活力的同时兼顾劳工福祉，求得工商与社会之间的长久均衡。"
 LEP_appease_general_labor_union: "安抚总工会"
 LEP_appease_general_labor_union_desc: "战后城市劳工情绪尚未平复，总工会在各业之中仍具广泛影响。我们应当以协商与保障并行之方针，派员与总工会代表展开对话，承认其在劳资调解中的合法地位，并推动最低保障与仲裁机制，以缓和罢工与对立局势。通过安抚与整合劳工力量，使工会由街头动员转向制度协商，在维持生产秩序的同时争取工人支持，为华东社会的稳定发展营造较为温和的政治环境。"
 LEP_new_citizen: "培育新公民"
 LEP_new_citizen_desc: "国家新立，旧习未除，欲行宪政与自治，必先培育具公共意识之新公民。我们将推动识字教育、公民课程与社会服务训练，鼓励青年参与地方议会、合作组织与公共讨论，使人民由被动臣民转为主动的社会成员。通过教育与实践并行，塑造尊重法治、关心公共事务的现代国民，使民主制度不止于纸面，而成为维系华东政治与社会秩序的重要力量。"
 LEP_eradicate_bad_customs: "根除陋习"
 LEP_eradicate_bad_customs_desc: "长期战乱使鸦片与赌博在城乡蔓延，侵蚀民生与社会风气。我们决意以法令与教化并行，整顿烟馆赌档，限制流通渠道，并辅以戒治与就业援助，使沉溺者得以回归正途。地方团体与学校亦将参与宣传与监督，重塑勤勉节制之风。唯有根除这些积弊，我们方能恢复社会元气，使百业得以健康发展，让新国家摆脱旧时代的阴影。"
 LEP_compulsory_education: "实行义务教育"
 LEP_compulsory_education_desc: "国家欲求长治，教育当为先务。我们决定逐步推行义务教育制度，整合各地学堂资源，推广识字与基础课程，使城乡子弟皆能入学受教。通过统一教材与培养师资，我们希望培育具公民意识与科学观念的新一代，缩小城乡与阶层之间的差距。唯有让教育成为全民之权利，我们方能塑造能够承担自治与国家建设责任的现代国民，使社会迈向更加开明与稳固的未来。"
 LEP_association_of_all_sectors: "各界联合会"
 LEP_association_of_all_sectors_desc: "在动荡之后，单一阶层已难以支撑国家前行。我们将主动推动绅商、知识界、工会与地方团体之间的合作，建立协商平台，使不同利益得以在制度内表达与协调。通过联合各界力量，我们既可缓和对立、凝聚资源，也能让新政府的施政更具代表性与合法性。唯有让社会各方成为共同的建设者，而非彼此对立的竞争者，华东的政治秩序方能稳步向前。"
 LEP_rebuild_administrative_system: "组建行政体系"
 LEP_rebuild_administrative_system_desc: "过去的地方政务机关因战乱而支离破碎，命令往往无法传达到基层。新政府决定整合原有的省级机构，统一建立部委架构，并确立一套自上而下的行政体系。此举虽需大量人力与财政，但只有这样，政府的决策才能真正落实到社会各个角落。"
 LEP_police_reorganization: "整顿警务"
 LEP_police_reorganization_desc: "警察是维持社会秩序的基本力量，市政建设的推进离不开警力的配合。当前时局动荡，若能守住城市安宁，则对内对外都将产生积极影响。应当着力整顿警政，纠正积弊，加强日常训练，确保整个系统精神团结、意志统一。只有这样，市民的生命财产才能得到切实保障，外人才会有所顾忌，市政建设的各项目标才能落到实处。"
 LEP_disaster_relief_fundraising: "赈灾筹款"
 LEP_disaster_relief_fundraising_desc: "四川爆发的大饥荒，使我们深刻认识到应对自然灾害的重要性。政府决定联合商会、银行与社会各界筹集赈灾资金，向四川提供粮食与物资援助。同时发行建设公债，扩充粮食储备，整治水利交通，推广垦荒与农业改良，建立更完善的救灾体系，使国家在未来面对天灾时能够从容应对。"
 LEP_decentralization_support: "赞成地方分权主义"
 LEP_decentralization_support_desc: "地方制度绝非军阀割据的代名词,我们应赋予各省充分的自治权限，建立由人民选举产生的省、县议会，使地方公共事务真正由地方社会自行管理；与此同时，省长作为国家行政机关的代表，仍应由中央任命，以确保全国法令统一施行。"
 LEP_board_of_audit: "设立监察院"
 LEP_board_of_audit_desc: "战乱遗留的腐败与贪污严重损害了社会信任。新政府决定设立监察院，专责监督官员行为与财政开支，定期公布审计结果。虽然可能引发旧官僚集团的反弹，但唯有通过透明与问责，才能恢复公众对政权的信赖，并限制新生政府内部的权力滥用。"
 LEP_establish_pacification_office: "成立绥靖公署"
 LEP_establish_pacification_office_desc: "南方仍有军阀割据与地方叛乱。通过设立绥靖公署，新政府能够整合军政资源，派遣代表进驻各地，逐步削弱地方势力，稳固中央权威。"
 LEP_march_along_yangtze: "誓师长江"
 LEP_march_along_yangtze_desc: "自南京建都以来，华东政府始终自诩为中华正统，而长江正是我们赖以生存与发展的母亲河。今日，江南、江北的军队已在江畔集结，工商、学界与地方士绅也纷纷表态支持。我们必须以长江为誓，举起统一的大旗，向北方发出庄严的宣告：分裂与割据的时代必须结束，全国的秩序只能由南京来重建。无论前路如何艰险，长江的涛声都将见证我们的决心与胜利。"
 LEP_End_Local_Warlordism: "终结地方割据"
 LEP_End_Local_Warlordism_desc: "地方割据是国家统一的最大障碍，军阀拥兵自重、横征暴敛，导致民不聊生。通过军事威慑与政治拉拢双管齐下，瓦解地方军阀势力，将军政大权收归中央，既能结束战乱，也能为全国统一市场与治理体系的建立扫清障碍。"
 LEP_Cultural_Renaissance_Movement: "文化复兴运动"
 LEP_Cultural_Renaissance_Movement_desc: "战乱连年致使文脉断层，礼教崩坏，民心无所归依。新政府发起文化复兴运动，重拾经史子集之精髓，兼收西方先进思想，整顿教育体系、扶持学术文艺、修缮古迹典籍。此举既能凝聚民族认同感、滋养民众精神，为新政赢得文化界支持，却也需平衡传统与革新的张力，应对新旧思潮的碰撞与保守势力的阻挠。"
 LEP_industrial_salvation: "实业救国"
 LEP_industrial_salvation_desc: "作为江南商帮的实际领袖，荣宗敬长期以“实业救国”为信条，积极扶持民族工商业发展。如今他当选临时总统，将把这一理念上升为国家政策的核心方向。政府将以鼓励投资、保护民族企业、完善基础设施为重点，为工厂、银行与航运业创造更有利的制度环境，使国家的经济重建与政治革新同步推进。"
 LEP_state_affairs_design: "国务设计"
 LEP_state_affairs_design_desc: "“国务设计委员会”的构想出自黄郛之手。他坚信，新生民主政府的首要任务在于重建秩序，而非放任政局自然演化。为实现这一点，必须由技术官僚与政治精英共同参与，对财政、行政、国防与社会重建进行系统规划。该委员会正是在此理念下设立，旨在以理性设计与专业分工为基础，为共和国构建一个更稳固、可预期的治理框架。"
 LEP_legacy_of_the_nine_nine_constitution: "九九宪法的遗产"
 LEP_legacy_of_the_nine_nine_constitution_desc: "1921年9月9日《中华民国浙江省宪法》的正式颁布，是民国联省自治浪潮中极具里程碑意义的实践，为各省省宪制定与自治推行树立了典范。如今，褚辅成领衔的诸省自治运动接续前行，将以浙省宪制经验为基础，凝聚地方实力派与民主力量，完善自治架构、规范权责边界，奋力完成省宪自治的未竟事业，为共和政体筑牢地方根基。"
 #发展线
 LEP_industrial_general_committee: "实业发展委员会"
 LEP_industrial_general_committee_desc: "仅靠市场自发运转，无法满足国家复兴所需的建设速度。南京政府决定成立§Y实业发展委员会§!，统一规划全国工业建设，统筹财政投资与地方资源，协调中央、地方及工商界的合作关系。今后，委员会将根据国家发展的实际需要，灵活调配建设资源，在推进工矿企业与基础设施建设的同时，不断完善各项产业政策，为中国工业化提供持续而稳定的动力。"
 LEP_yangtze_economic_belt: "长江经济带"
 LEP_yangtze_economic_belt_desc: "长江自古以来就是华夏的经济动脉，而我们若要重振国力，必须再次依托这条水路。通过整合长江流域的铁路、公路与航运，推动上下游之间的商贸联动，我们能够打破地区割据带来的壁垒，形成统一的市场。长江经济带不仅将促进物资流通与产业合作，更将为未来全国的经济整合打下坚实基础。"
 LEP_workers_vocational_school: "工人职业学校"
 LEP_workers_vocational_school_desc: "工业若无合格劳动力，终将受制于人。政府计划在主要城市设立职业学校，为工人提供技术培训和工艺教育。通过课程与实习结合，培养大批熟练工人，以适应机器制造、纺织和建筑等行业需求。这一举措将减轻失业压力，同时化解工潮的不满情绪。"
 LEP_Telephone_and_telegraph: "电话线与电报线"
 LEP_Telephone_and_telegraph_desc: "通讯与照明的现代化被视为文明的标志。我们将扩展电话线路与电报线路，逐步连接主要城市，同时改善街道照明，推广煤气与电灯。这样不仅有利于商业往来和城市安全，也能提升居民生活质量，象征政府对现代化与公共服务的承诺。"
 LEP_east_china_machine_factory: "华东机器制造厂"
 LEP_east_china_machine_factory_desc: "长期以来，华东工业依赖进口机械，成本高昂且受制于人。为改变这一局面，我们决定在南京与苏州建立机器制造厂，集中生产纺织机、农机和基本机械零件。此举既能节约外汇，又能推动本土工艺的发展，使华东逐步拥有独立的工业基础。"
 LEP_standardization_and_metrics: "标准化与计量制度"
 LEP_standardization_and_metrics_desc: "华东地区度量衡混乱，既阻碍贸易也损害工业发展。我们决定推行统一标准体系，设立计量局，规范重量、长度与货币兑换。同时推动工业制式化，减少浪费与欺诈。此举有助于改善市场秩序，为进一步工业化奠定基础。"
 LEP_relieve_funding_shortage: "填补资金空白"
 LEP_relieve_funding_shortage_desc: "新政府成立之初，财政入不敷出，企业亦因资金链断裂而陷入困境。南京当局计划设立紧急信贷制度，由银行提供低息贷款，重点支持纺织业与轻工业企业。此举虽可能增加债务，但被视为避免经济停滞与工潮的重要权宜之计。"
 LEP_ties_with_shanghai: "与上海的联系"
 LEP_ties_with_shanghai_desc: "尽管上海仍处于列强势力交错的“使馆城市”体制之下，它依旧是远东最重要的金融与贸易枢纽。政府决定以务实姿态展开接触，一方面尝试通过协商缓和不平等条约带来的掣肘，争取更有利的关税与通商环境；另一方面引导外资由孤立的租界流向长三角腹地，投资工业与交通建设。借助上海的资本与市场网络，区域经济或可在复杂的国际格局中寻得新的增长空间。"
 LEP_seizure_of_german_assets: "收缴德国资产"
 LEP_seizure_of_german_assets_desc: "随着孙传芳政权覆灭，昔日依托德属东亚势力运作的南京理事会亦随之瓦解。柏林方面愤然撤资，大量工矿设备、银行股份与港口设施被迫遗留华东。我们可以依法接收这些无人认领的资产，将其转入国有或公私合营体系，用以充实财政、稳定金融，并为后续工业建设提供急需的资本与技术基础，使旧日外力影响转化为国家发展的新契机。"
 LEP_agricultural_affairs_bureau: "农本局"
 LEP_agricultural_affairs_bureau_desc: "农业仍是区域经济的根基。设立农本机构，统筹农政、推广良种与田亩改良，既是对传统农本思想的延续，也是现代化治理的尝试。通过制度化管理，乡村生产不再依赖零散经验，而逐步走向科学化与组织化。"
 LEP_four_pillars_education: "四大教育"
 LEP_four_pillars_education_desc: "乡村之困，不仅在贫，更在无知与失序。以晏阳初倡导的“四大教育”为蓝本，政府推动识字、生计、公民与卫生并进的基层教育体系，使学校走出城市，深入乡里。识字以启民智，生计以助生产，公民教育培育责任意识，卫生教育改善生活条件。通过这种务实而渐进的方式，社会改造不再依赖激烈变革，而是在日常生活中悄然发生。"
 LEP_rationalize_taxation: "厘清税则"
 LEP_rationalize_taxation_desc: "纷杂税则长期阻碍商业流通。通过统一标准、简化征收与厘清权限，政府希望建立更稳定的财政体系。新的税制既要维持国家收入，也需减轻企业与农民负担，使市场在较为清晰的规则下运转。"
 LEP_cooperative_network: "合作社网络"
 LEP_cooperative_network_desc: "在江浙一带，合作社运动自民国初年便悄然兴起，既有农村信用社，也有蚕桑丝业与手工业联合社，知识分子、乡绅与地方官员共同推动，旨在缓解农民资金短缺、提高产品议价能力，并培养基层自治与合作精神。政府可借此建立覆盖城乡的合作社网络，统一提供信贷、技术与市场支持，使农民与小商户在竞争激烈的市场中获得稳定收益，同时推动教育与社会改革，强化乡村社会秩序与经济活力，为华东经济现代化奠定坚实基础。"
 LEP_agricultural_technology_cooperation: "农业技术交流"
 LEP_agricultural_technology_cooperation_desc: "农业现代化离不开技术传播。政府推动农技人员下乡，与地方团体合作试验新式耕作方法与机械设备，使传统农业逐步向高产与科学管理转型。这不仅是生产方式的改变，也象征知识向乡村的流动。"
 LEP_salt_administration_reform: "盐政改革"
 LEP_salt_administration_reform_desc: "江苏沿海自古为中国盐业重地，淮南、通泰等盐场所产纲盐不仅关系地方生计，更牵动国家财政命脉。然而旧有盐政积弊深重，厘卡林立、商运受阻。政府拟整顿盐务机构，统一征收与运销制度，裁撤冗杂税费，引入近代管理与运输体系，使盐业由盘剥之源转为稳定财源，同时带动沿海市镇与轻工业的发展。"
 LEP_gonghe_cooperative_movement: "工合运动"
 LEP_gonghe_cooperative_movement_desc: "在民族工业基础薄弱与资本力量分散的现实下，政府开始推动以合作社为核心的新型生产模式。工人、技术人员与地方团体共同出资经营，小规模工厂得以在城乡之间迅速建立，既降低经营风险，也培养基层的工业能力。通过统一贷款、技术培训与市场协调，工合体系被寄望于连接手工业与现代工业，形成兼具效率与互助精神的经济网络，为国家工业化开辟一条更具社会性的道路。"
 LEP_east_china_industry_mining: "发展华东矿业"
 LEP_east_china_industry_mining_desc: "华东蕴藏的煤铁与矿产资源，为工业扩张提供了基础。整合矿业开发与交通建设，既能带动地方就业，也有助于形成区域工业带。随着矿业与制造业相互促进，华东逐渐成为重要的工业支点。"
 LEP_qiantang_prosperity: "钱塘自古繁华"
 LEP_qiantang_prosperity_desc: "自唐宋以来，江南财赋甲天下，钱塘烟水之间商贾辐辏、舟楫如织，丝绸、瓷器与盐粮贸易塑造了华东经世致用的传统。今日整饬工商、疏通水陆、整合市镇与乡村产业，不过是承续旧日繁盛的现代篇章。政府以交通建设为骨干，以工矿与农产为血脉，使苏浙皖赣诸地重新连成一体，让古来“东南财赋地”的荣光在新时代焕发新义，既显历史积淀，也昭示国家富庶之基。"
 LEP_expand_nantong_port: "扩建南通港"
 LEP_expand_nantong_port_desc: "在上海受列强控制的局面下，南通被寄望为新的贸易枢纽。南京政府计划扩建南通港，增设码头与仓储设施，使其成为进出口的新通道。此举不仅能减少对外国租界的依赖，也将推动江苏北部经济的全面发展。"
 LEP_expand_east_china_network: "扩大华东路网"
 LEP_expand_east_china_network_desc: "铁路与公路是统一与发展的根基。南京政府计划修建江南与闽浙的干线，改善乡村道路，打通内陆与沿海之间的运输瓶颈。此举不仅利于军队调动，也能促进城乡贸易，推动区域一体化。"
 LEP_industrial_and_commercial_credit: "工商业信贷"
 LEP_industrial_and_commercial_credit_desc: "为推动工商资本发展，南京政府将设立工商业信贷机构，专为中小企业提供融资。通过贷款与担保，企业得以扩张生产，创造就业。此政策将增强民间资本活力，逐步形成稳定的市场经济秩序。"
 LEP_small_scale_waterworks: "小型水利工程"
 LEP_small_scale_waterworks_desc: "在全国各地尤其是农村和小城镇开展小型水利工程建设，包括灌溉渠道、堤坝加固和水库修复。这些工程有助于保障农业灌溉和防洪安全，同时创造就业机会，稳定农村经济，为新生政权赢得民心。"
 LEP_East_China_Academy: "华东科学院"
 LEP_East_China_Academy_desc: "成立华东科学院，汇集自然科学、工程技术及社会科学领域的顶尖学者，推动科研创新与产业技术应用。通过科研成果支持地方工业与商业发展，同时提升政府在学术界的威望与社会认同。"
 #军事线
 LEP_ningbo_autonomy_army: "宁波自治军的遗产"
 LEP_ningbo_autonomy_army_desc: "在浙江沿海，曾经存在过一支短暂而特殊的地方武装——宁波自治军。它声称守土自保，抵御外来军阀的掠夺。它所留下的自守传统与民本意识依然提醒着我们：军队必须为百姓服务，而不是沦为压榨的工具。新政府在重建军队的过程中，将借鉴这一遗产。或许宁波自治军从未能改变中国的命运，但它的精神，仍能成为我们新军建设的基石。"
 LEP_unified_training: "统一训练大纲"
 LEP_unified_training_desc: "八省旧军中各自为政，训练方式五花八门，装备更是杂乱无章。为使新军能够协同作战，我们必须确立统一的训练大纲，推广标准化的作战条令与教育方法。从射击到战术演练，从新兵到军官，一切皆有统一规范。这不仅会提高部队的战斗力，更能培育起新式军人的共同认同。" 
 LEP_chen_yi_will_recommend_lin_wei_lepexp: "§L浙江督理陈仪推荐了部下林蔚作为晋升人选。§!"
 LEP_army_nationalization: "军队国家化"
 LEP_army_nationalization_desc: "中国军阀时代的一个顽疾，便是军人染指政治，以致政务无法独立，国家机器屡屡沦为少数将领的工具。新政府要想建立现代意义上的军队，就必须在制度上划清界限：军队归政权统辖，却不得干预政务。军政分离，是我们走出军阀主义阴影的关键一步。"
 LEP_southeast_iron_army: "东南铁军"
 LEP_southeast_iron_army_desc: "浙军之名已不再只是地方武装的代称。自杭州至赣北，自钱塘江畔至长江前线，诸部在内战中历经整编与血火洗礼，逐渐形成纪律严明、行动果决的作风。我们当以此为基础，去芜存菁，统一编制，巩固军纪，使之成为真正效忠共和国而非个人的国家军队。所谓“东南铁军”，不在于盲目冲锋，而在于坚忍、服从与可靠——既能守土安民，亦能奉命远征。"
 LEP_looking_to_the_west: "师夷之长"
 LEP_looking_to_the_west_desc: "国家前途不应只局限于一隅之地。欧美诸国在工业组织、军事制度与学术研究方面积累深厚经验，既有可资借鉴之处，亦蕴藏外交转圜的空间。我们当放眼西方，择其长处而取之，在平等与审慎的原则下恢复往来，吸收先进技术与管理理念，同时争取国际社会对南京政府的理解与承认，在风云变幻的世界格局中，为共和国谋求更稳固的立足之地。"
 LEP_material_mobilization: "物资动员"
 LEP_material_mobilization_desc: "现代战争之胜负，不仅系于前线之勇武，更系于后方之供给。参酌厉尔康《国防与物资》之论，我国防建设当以物资为本，统筹钢铁、煤炭、兵工与交通体系，建立自上而下之动员机制。自平时储备至战时调配，皆须有章可循，使军需生产、运输与分发形成完整链条。唯有构筑稳固而高效的物资供应体系，方能确保炮火不断、军心不摇，使国家在持久战争中立于不败之地。"
 LEP_strengthen_fire_support: "强化火力支援"
 LEP_strengthen_fire_support_desc: "为了建立现代化国防工业，政府必须推动军方与工业界之间的紧密协作。通过颁布《军工协作法案》，工厂将获得财政补贴与订单支持，而军方则保证其产能有稳定的需求。此举既能增强国家的工业实力，也能使军工体系逐渐走向标准化与规模化，避免军阀时代那种支离破碎的采购混乱。"
 LEP_seize_the_initiative: "发挥战场主动"
 LEP_seize_the_initiative_desc: "八省内战的经验反复证明，被动应战只会消耗士气与国力。若欲立于不败之地，唯有在战场上争夺节奏、掌握主动。今后各级部队须强化侦察与机动训练，下放战术决断权，使前线指挥官得以因势制宜、迅速应变。通过主动出击与灵活调度，我军将在敌人尚未稳固阵脚之前抢占先机，以连续行动瓦解其部署，迫使对手陷入被动，从而将战争的主导权牢牢握在自己手中。"
 LEP_field_hospital_focus: "救死扶伤"
 LEP_field_hospital_focus_desc: "无论是不久前的八省内战还是更早的历史上中国经历过的成千上万的战争反复提醒着我们——士兵的生命永远高于一切。对于伤兵的即使救治就是保存我军的战斗力，我军将会广泛搭建完善的前线医疗救助体系，统筹调配军方医疗人员与战备物资，必要时动员民间医护人员，及时救治战场伤员，有效降低部队伤亡，加速伤兵重返战场，稳固军心士气，为持续作战储备充足兵员战力。"
 LEP_mp_academy: "国家宪兵学院"
 LEP_mp_academy_desc: "宪兵无论是在维持军纪防止逃兵方面，还是在保障战区治安反间谍方面都会起到重大作用，我军现在将兴办专业宪兵学院，系统培育宪兵骨干人才，以便兼顾战地执法与地方维稳，进一步收拢军政管控力。"
 LEP_tide_of_steel: "铁流滚滚"
 LEP_tide_of_steel_desc: "建立装甲部队的想法早已在民国初年就已经被提出，张作霖已经在东北建立过小规模的坦克部队，我们也尝试过把小规模的坦克支援给步兵师，但是数量太少且缺乏集中使用的战术，因此无法在战场上一锤定音。现在随着军事能力的提升与各方面资源的到位，我们也将开始着手建立独立的装甲师，早些年我们的军官已经和德国顾问团讨论过装甲部队在中国作战所需要的独特战术，而这些理论将马上成为战场上的成果。"
 LEP_panzer_divisions_tt: "如果已研究§H$medium_tank_chassis_1$§!"
 LEP_railway_corps: "铁道兵司令部"
 LEP_railway_corps_desc: "早在20年代末30年代初期，联帅就有建立专门铁道兵部队的想法，但是随着孙传芳和齐燮元两人相继暴毙，尤其是齐燮元命丧铁道之后，这个计划就长期搁置了，以至于孙传芳订购的一批克虏伯列车炮还处于零件状态，并且由于没有专业人士维护和操作而迟迟没能投入使用。随着我军终于有了余力，是时候把这些孙传芳留给我们的礼物投入使用了。"
 LEP_marine_exp: "陆战队扩编"
 LEP_marine_exp_desc: "随着全国局势逐渐趋于稳定，我们需要更强大的对外干涉能力，而陆战队在其中将发挥重要作用。作为一支起源于北洋水师时期的部队，中国海军陆战队经历过从甲午战争再到军阀混战的基本所有的战争，从海军的精锐再到割据一方的军阀，再到混成旅时代，直到现在成为了一个独立的军种，我们将持续投入资源建设海军陆战队以期望他们再未来的战争中大放异彩。"
 LEP_kongshu_trooper: "一空输，出动！"
 LEP_kongshu_trooper_desc: "在空军和总参谋部的共同努力下，我们挑选了一批最适合的精锐士兵，参考美俄两军的空降部队模式，组建了一支实验部队，同时作为快速反应部队处理各种问题，有时候甚至需要用一秒六棍处理一些其他部门不方便出面的问题。不过最重要的是，他们可以按当代伞兵的战法，越过敌占区空降到敌军后方。这种策略比较激进，风险是可以预料的，但是，伞兵天生就是被包围的！狭路相逢勇者胜！"
 LEP_anti_air_tower: "要地防空设施建设"
 LEP_anti_air_tower_desc: "随着航空技术的发展，防空压力只会越来越大，如何在敌军飞机的威胁下保护保护重要设施成为了一大难题。我们将重点在军工厂、政府设施、能源设施附近修建混凝土制成的永备防空设施，重点城市甚至需要修建更大规模混凝土的防空塔。"
 LEP_AF_radar_stations: "空军直属雷达部队"
 LEP_AF_radar_stations_desc: "雷达除了为地面防空部队提供预警，也能为战斗机部队提供拦截情报，因此除了陆军和海军，空军也需要建立直属的雷达部队以避免兵种之间的繁文缛节。"
 LEP_air_defence_tt: "在完成该国策前研究§H$antiair2$§!或更高级的相关科技将使6个工业发达地区获得§H三级§!防空火炮。"
 LEP_AF_night_fighters: "夜间战斗机巡逻队"
 LEP_AF_night_fighters_desc: "夜间空战极具挑战性，同时也带来极大优势。在夜色的笼罩下，我们的战机可以敌人反应过来之前先发制人摧毁敌人。我们必须制定一套训练计划并给合适的战斗机装备雷达，让我们的飞行员可以不分昼夜地升空作战。"
 LEP_AF_AA_aircraft_command: "试制重型战斗机"
 LEP_AF_AA_aircraft_command_desc: "孙传芳"
 LEP_AF_AA_gun_pud: "列装防空炮火控雷达"
 LEP_AF_AA_gun_pud_desc: "德国人已经用上了雷达制导的射击指挥仪来打击各类空中目标，我们也不该落后。扩大防空司令部，广泛列装火控雷达迫在眉睫。"
 LEP_aviation_committee: "国防部航空委员会"
 LEP_aviation_committee_desc: "在经历了内战与抗战的考验后，我国空军已经可堪一战，但是距离正规化还有一段距离，飞行员和地勤的标准化训练、航空工业的发展、新型飞机的研制都需要一个部门统筹。空军作战部和参谋部已经不堪重负，因此我们需要建立航空委员会收集问题并调配资源解决问题。"
 LEP_national_military_aviation_programme: "国家军用航空计划"
 LEP_national_military_aviation_programme_desc: "尽管我们重新努力发展本土航空工业和院校，我国政府仍发现领空及机场中的飞机数量远不足以保家卫国。此次重振计划以精简防御体系为核心，必将使中国空军永远令人敬畏、令人倾佩！"
 LEP_huhanmin_copter: "垂直起降试验"
 LEP_huhanmin_copter_desc: "垂直起降飞机能在复杂地形提供战术灵活性，而朱家仁将军在早年就对直升机有所研究，并且取得了一定成功。我们已启动试验以评估其在现代战争中的作用，朱家仁将军也将从其他项目上抽身，全力投入这一新项目。如果我们能解决可靠性与载重问题，成功让直升机投入作战，这将会改变战场规则。"
 LEP_AF_ground_service: "空军机务学院"
 LEP_AF_ground_service_desc: "地勤人员需在极端天气和高压环境下进行细致的排故与检修，在执行任务期间通常实行严密的轮班制以保证全天候的战备状态，我军需要大量熟练人才保障我军航空部队的出勤率以及可靠性，每一个螺丝钉都能影响到我方飞行员的生命安全。"
 LEP_AF_CAP: "战斗空中巡逻训练"
 LEP_AF_CAP_desc: "战斗空中巡逻是战斗机沿特定区域或航线进行的军事巡逻。核心目的是建立空中防线、提供早期预警并在敌机抵达关键区域前将其拦截摧毁。巡逻通常以接力轮班方式进行，以保障全天候不间断警戒。为保障我方制空权以及我军战术飞机安全执行任务，空军将会进行全面训练并在不断的对抗演习中总结经验。"
 LEP_AF_aircraft_manufacturing_for_navy: "协助海军飞机生产"
 LEP_AF_aircraft_manufacturing_for_navy_desc: "作为一同保卫领空与友军头顶的兄弟部队，航空委员会充分意识到军种之间因为争夺有限资源导致关系紧张会在战场上导致严重的后果，因此，一项专用预算被分别下发给海军和空军以开发舰载机以及海上巡逻机。"
 LEP_AF_long_range: "飞的更远"
 LEP_AF_long_range_desc: "空军建设不仅要着眼于战术打击，更要把毁灭带去敌人的领土，新型的高航程中型重型飞机的研发和大规模制造也将提上日程。"
 LEP_ready_jet_era: "喷气时代的黎明"
 LEP_ready_jet_era_desc: "国外已经有不少厂商开始尝试使用喷气引擎驱动飞机，相比我们现在使用的各类活塞发动机，虽然喷气引擎的可靠性与性价比还不尽如人意，但是其可以驱动飞机以的速度飞行，相信在未来的战争中，喷气式飞机必将铺天盖地，我国绝对不能在这项技术上落后，我们必须投入大量资金与人力开始进行论证。"
 LEP_AF_cas_dev: "攻击机招标"
 LEP_AF_cas_dev_desc: "为我军挑选一款性价比与性能兼具的攻击机迫在眉睫，招标书已经发布，相信很快就会有厂商前来竞标。"
 LEP_coast_radar: "岸防雷达站"
 LEP_coast_radar_desc: "只是在关键海岸修建炮台远远不够，我们应该组建一个雷达网络，通过提前获取敌情，抢先行动打乱敌方部署计划。只要与海上与空中力量配合好，敌人的船再大也占不到便宜，雷达网络同样将为空军的防空作战提供情报。"
 LEP_six_year_programme: "六年造舰计划"
 LEP_six_year_programme_desc: "国会通过了六年内造舰总吨位60万吨的预算，海军部门马力全开，船坞加班加点工作，计划下水数百艘各式舰艇。理想很丰满，现实却很残酷，我们的国产舰队吨位无论如何都无法在短时间内赶上列强，但无论如何，我们还是见证了新中国海军舰队的诞生。"
 LEP_idea_tide_of_steel: "铁流滚滚"
 LEP_naval_air_dev: "发展海军航空部队"
 LEP_naval_air_dev_desc: "早在30年代初期，东北海军将领沈鸿烈以及联军海军将领萨师俊就尝试建立了中国最早的海军航空部队，虽然只是寥寥几架水上飞机，最大的作用也只是协助水面舰队侦查，但是这些大胆的尝试实现了从零到一的突破。随着国家统一的实现，建立大规模的海军岸基以及舰载航空部队的计划被提上了日程，相信不久之后，中国人就能驾驶着自己的舰载机从自己的航母上起飞了。"
 LEP_wolf_pack_sub: "水下狼群"
 LEP_wolf_pack_sub_desc: "随着现代海军理论的进步，潜艇战也以大胆而隐秘的方式迅速发展起来。潜艇战在以前还只是一种新奇的战术，如今已成为一种成熟的海战模式。潜艇狼群战术拥有非凡威力，能够袭击敌方补给线并击沉大型主力舰，而且所需投入的物资却远低于其他作战方式。而未来可能的对日作战中，阻断日本本土的海上交通线将会成为海军的首要目标，而潜艇部队将在其中起到无可替代的作用。"
 LEP_new_spirit_of_maritime_life: "海上生活的崭新精神"
 LEP_new_spirit_of_maritime_life_desc: "经过我们的努力，中国海军真正获得了新生。士气高涨、斗志昂扬，新舰艇也在陆续建造中，未来还有许多战役即将展开，我们的海军已不再是亚洲的笑柄。随着更多舰艇入列，中国海军必将能与德国海军和日本帝国海军相媲美。"
 LEP_new_spirit_of_maritime_life_romove_tt: "§L海军作战相关的国家精神将被合并为一个国家精神:§L\n"
 LEP_navy_dd_cl_attack: "高速袭扰"
 LEP_navy_communication_branch: "海军通讯部"
 LEP_naval_air_aa: "博福斯、厄利孔与苏罗通"
 LEP_navy_ship_building_department: "海军造舰委员会"
 LEP_navy_captail_ship_building: "建造主力舰"
 LEP_naval_guns_targeting: "雷达引导炮术练习"
 LEP_naval_mines_laying: "海军水鱼雷军械局"
 LEP_beiyang_big_guns: "老北洋，老办法"
 LEP_beiyang_big_guns_desc: "大舰巨炮是男人的浪漫，19世纪中国人忽视海军、忽视大舰巨炮就导致了百年国耻。老北洋将领们希望造舰委员会把资源更多的投入到战列舰的建设中来，一支高速的战列舰队将会撕碎我们的敌人，并在海上决战中带来胜利。"
 LEP_new_and_young_thought_navy: "创新与勇气"
 LEP_new_and_young_thought_navy_desc: "海军作战的目的从来不只是打沉多少敌舰，而是消灭敌人的战争潜力，无论是攻击敌人的海上交通线，还是将战争从海上带向敌人的海岸与内陆，都是我国海军建设的目标。随着以吴纫礼和萨师俊为首的南派海军将领在听证会上说服了国会议员以及造舰委员会成员，更多的资源将投入到航母和陆战队的建设上。"
 ###第二阶段国策
 LEP_new_republic_old_ideals: "新民国，旧理想"
 LEP_new_republic_old_ideals_desc: "经年战火与艰难博弈之后，我们终于推翻了北方旧政府的威权统治，在废墟之上重建中华民国的新一届中央政府。硝烟虽散，创痛犹存，但共和国的旗帜再次在中枢之地升起。然而，新政权的根基并非一纸胜利宣言，而是民国初创之时所确立的民主理想。责任内阁、代议政治与公民权利，仍是我们前行的灯塔。新民国或许诞生于风雨之中，但其道路，依旧指向那未竟的共和理想。"
 LEP_take_over_ministries_and_commissions: "接收部院"
 LEP_take_over_ministries_and_commissions_desc: "随着旧政权的瓦解，中枢机关一度陷入停摆。为避免行政真空蔓延全国，我们决定接收原北京政府部分部院建制与技术官员，在甄别与整编的基础上恢复必要职能，使财政、交通、司法与内政等事务得以持续运转，为新政府赢得时间与秩序。"
 LEP_emphasize_unified_leadership: "强化领导"
 LEP_emphasize_unified_leadership_desc: "外患未除，内政亦难言稳固。若欲在风雨欲来的局势中立足，共和政府必须拥有更加明确而坚决的领导核心。唯有巩固民主科学社在政府中的主导地位，统一政策方向与行政节奏，方能避免党争掣肘，集中资源整备军备、稳固秩序，使国家在潜在的冲突面前不致再度陷入迟疑与分裂。"
 LEP_expand_coalition_cabinet: "扩大联合内阁"
 LEP_expand_coalition_cabinet_desc: "在战后重建的关键阶段，单一派系难以涵盖社会各界的诉求。为使政府决策更具包容性与代表性，我们决定吸纳来自不同政团与社会背景的政治人物进入内阁，共同参与国家治理。通过扩大联合的广度，使更多声音在政策形成之前得到表达与协调，既可缓和分歧，也能增强政府的合法性。"
 LEP_reduce_red_tape: "削减繁文缛节"
 LEP_reduce_red_tape_desc: "战时体制与旧政府遗留下来的层层审批与冗长流程，使重建工作的推进屡受拖延。文件往返、权责交错、程序繁复，正在消耗政府的威信与社会的耐心。为恢复行政效率，中央将整合重复机构，明确部门权限，简化审批程序，使决策更迅捷、执行更顺畅。"
 LEP_take_precautionary_measures: "未雨绸缪"
 LEP_take_precautionary_measures_desc: "北方局势日趋紧张，日本势力与其扶持下的奉天政府军事调动愈发频繁，边境摩擦不断升级。与其寄望于侥幸，不如承认冲突或许只是时间问题。为避免仓促应战，我们必须加紧修筑防御工事，完善动员体系，制定周密作战计划，并储备充足的枪支弹药与军需物资。唯有在战前做好准备，方能在烽火骤起之时抢占先机，而非再度被动应对。"
 LEP_ease_social_tensions: "缓和社会紧张氛围"
 LEP_ease_social_tensions_desc: "连年战乱与政局更迭，使社会各阶层积累了不安与疑虑。若任由对立情绪蔓延，任何政策都将举步维艰。我们必须主动释放善意，通过公开对话、审慎施政与适度让步，缓和不同群体之间的紧张关系，减少街头与舆论场的对抗。唯有在较为平稳的社会环境中，共和制度才能逐步扎根，国家重建方能有序推进。"
 LEP_national_image_continuity: "国家形象之延续"
 LEP_national_image_continuity_desc: "南京取代北京，并非激进者口中的“革命”，而是对本应属于国民的民主权利所作出的捍卫。政权更迭带来了制度与人事的调整，但共和国的名号与法统必须保持连贯。对内需要安定人心，对外需要维系承认，新政府必须向社会与列强展现延续与秩序。我们将承继民国既有的法律框架与外交承诺，修复国家信誉，重申宪政原则，以巩固政权的合法地位。"
 LEP_restore_central_bank_authority: "重建中央银行职权"
 LEP_restore_central_bank_authority_desc: "战乱与政权更迭使金融体系一度紊乱，币制混杂、信用动摇，严重影响经济恢复。为稳定市场秩序与国家财政，中央将重建中央银行的法定职权，统一货币发行与准备金管理，规范贴现与放贷机制，加强对金融机构的监督。通过确立权威而清晰的金融框架，恢复社会信心，稳定物价与汇率，为全国重建与长期发展奠定稳固的金融基础。"
 LEP_unify_national_market: "统一全国市场"
 LEP_unify_national_market_desc: "长期的分裂与战乱使各地关卡林立，币制不一，税则繁杂，区域壁垒阻碍了商品与资本的自由流通。若任由这种局面延续，全国经济将难以形成合力。我们将推动关税与商税标准统一，清理地方性限制措施，规范交通与金融秩序，打通南北贸易通道。通过建立统一而开放的市场体系，使资源在更广阔的范围内配置流动，为共和国的持续发展注入新的活力。"
 LEP_economic_democratization: "经济民主化"
 LEP_economic_democratization_desc: "共和国的重建不应仅停留在政治制度之上，经济领域同样需要回应民意与时代的要求。我们将推动更为公开透明的财政制度，扩大社会各阶层参与经济决策的渠道，完善劳资协商机制，使工商发展与公共利益相互协调。通过制度化的监督与规范，减少权力与资本的失衡，让经济成果更广泛地惠及社会。"
 LEP_take_over_war_factories: "整合占领区军工厂"
 LEP_take_over_war_factories_desc: "随着战事推进，大量原属敌对势力或战区管控之下的工厂陆续进入我方掌握之中。这些企业设备状况不一，管理体系混乱，生产能力尚未完全恢复。为避免资源闲置与重复建设，中央将对占领区工厂进行统一登记与整合，梳理产权与债务关系，恢复关键生产线运转，并将其纳入全国工业规划之中。通过有序整合与重新布局，使战时接收的产业真正服务于共和国的重建与工业发展。"
 LEP_revitalize_frontier_and_barren_lands: "振兴边瘠之地"
 LEP_revitalize_frontier_and_barren_lands_desc: "多年来的战乱与动荡，使边远与贫瘠地区的发展远远落后于沿海与中心城市。交通不便、产业单一、财政薄弱，使当地百姓长期难以分享国家复兴的成果。为实现真正意义上的统一与繁荣，中央将加大对边瘠之地的投资与扶持，修筑道路与水利，推广教育与基础产业，鼓励人口与资本合理流动。"
 LEP_resource_nationalization: "重要资源国有化"
 LEP_resource_nationalization_desc: "煤矿、铁路、盐务与关键能源关系国家命脉，长期以来却因战乱与分割而权属复杂、管理失序。若任由关键资源分散于地方势力或私人集团之手，国家发展将受制于人。中央决定将关系国计民生的重要资源逐步收归国有，建立统一管理与调配机制，加强生产与运输体系的统筹规划。"
 LEP_preserve_market_regulation: "维护市场调节作用"
 LEP_preserve_market_regulation_desc: "在重建国家经济的进程中，政府的引导固然重要，但市场自身的调节机制同样不可忽视。价格信号、供需变化与资本流动，能够为资源配置提供及时而灵活的指引。为避免过度干预带来的扭曲与低效，我们将保障商业自由与契约秩序，减少不必要的行政限制，完善竞争规则与产权保护。通过维护市场的正常运作，使企业与社会活力得以充分释放。"
 LEP_national_congress: "召集国民大会"
 LEP_national_congress_desc: "历经战乱与重建，共和国的制度框架已逐步成形。然而，国家未来的方向，仍需在更广泛的代表参与下加以确认。为此，政府决定召集国民大会，汇聚各省代表与社会各界人士，就宪政架构、权力分配与国家发展纲领展开正式讨论。"
 LEP_establish_heavy_industry: "发展重工业"
 LEP_establish_heavy_industry_desc: "亟需坚实之物质基础。重工业关乎钢铁、机械与能源，既为国防之根本，亦为各项产业之支柱。我们将集中资源优先发展重工业，建设关键生产体系，使国家逐步摆脱对外依赖，增强自给能力。通过有计划之投入与统筹布局，使工业体系由薄弱走向完整，为后续经济发展与国防建设提供持久而可靠之支撑。"
 LEP_divide_military_regions: "划分军区"
 LEP_divide_military_regions_desc: "国家统一之后，原有军事部署多沿旧制，各部驻防分散，指挥体系层级不清，难以适应全国防务之需要。为提高统筹与调度能力，我们将依据地理与战略要点，对全国范围内之军事力量加以重新划分，设立若干军区，明确其防务职责与指挥权限。通过建立分区负责、统一指挥的体系，使中央能够有效掌控各地兵力调动，同时提升应对突发情况之反应效率。"
 LEP_national_education_program: "国民教育纲要"
 LEP_national_education_program_desc: ""
 LEP_military_reorganization: "加快军事重组"
 LEP_military_reorganization_desc: "首都既定，政权初稳，然旧有军制纷杂，编制不一，各部之间尚未形成统一体系，难以支撑国家之整体防务。为巩固统治基础并确保政令畅行，我们必须加快军事重组之进程，对现有部队加以整编，统一指挥体系与编制标准。通过裁撤冗余、整合力量，使军队由各自为战转向协同运作，逐步建立起一支纪律严明、指挥统一之国防力量。在此基础之上，国家方能在内外环境中保持稳固与安全。"
 LEP_support_from_guo_min_jun: "国民军的经验"
 LEP_support_from_guo_min_jun_desc: "昔日国民军以纪律严整、政治教育与士兵意识见长，强调军队与国家、社会之间的紧密联系，曾在动荡中展现出较强的组织力与动员能力。我们将取其所长，在整编过程中引入相应制度与训练方式，使部队不仅在编制上统一，更在理念与行动上趋于一致。通过强化组织与精神纽带，使新建军队具备更强的执行力与稳定性。"
 LEP_Whampoa_spirit: "重塑黄埔精神"
 LEP_Whampoa_spirit_desc: "统一既成，军队之形可整，其魂尤需重铸。昔日黄埔所倡，重在纪律、责任与国家至上之信念，然历经分裂与纷争，其精神已多有流失。今当重新提炼其核心，使之不再服务于派系与个人，而归于国家与制度之下。通过整顿军纪、强化教育，并以共同信念凝聚各部，使军队在统一指挥之外，更具一致之精神基础。唯有形与魂兼备，方能使新建之国防力量真正成为国家之柱石。"
 LEP_actual_pay: "实额实饷"
 LEP_actual_pay_desc: "军队之弊，往往不在兵少，而在虚额与克扣。编制名存实亡，军饷层层侵蚀，不仅削弱战斗力，亦损害军心与纪律。为肃清积弊，我们将推行“实额实饷”之制，清查兵员名册，杜绝虚报冒领，并确保军饷按额发放、直达基层。通过使编制与实际相符，使供给与需求一致，既可减轻财政负担，亦能稳定军心。在制度化整顿之下，使军队由空虚浮滥转向精干充实，建立起可靠而可持续的军政基础。"
 
 LEP_military_disarmament_and_demobilization: "加快军事编遣"
 LEP_military_disarmament_and_demobilization_desc: ""
 ##民主科学社
 LEP_DSP: "民主与科学之胜"
 LEP_DSP_desc: "在这场漫长而艰难的重建过程中，民主制度得以重新确立，理性与公共讨论再次成为国家政治的基础。以知识界与公共团体为支柱的民主科学社始终坚持，国家的进步不应依赖强人意志，而应建立在民主程序与科学精神之上。如今，这一理念逐渐成为共和国政治生活的重要共识。通过巩固议会制度、尊重专业知识并推动教育与研究的发展，我们将努力使民主与科学真正成为国家前行的两大支柱。"
 LEP_guided_by_the_may_fourth_spirit: "五四精神指引"
 LEP_guided_by_the_may_fourth_spirit_desc: "在中国近代思想史上，五四运动不仅是一场学生运动，更是一场深刻的思想启蒙。它所倡导的民主与科学，曾激励一代青年反思旧制度、探索国家的新道路。如今在国家重建的关键时刻，这一精神仍具有重要意义。面对纷繁复杂的政治与社会问题，我们需要以理性讨论取代盲目激情，以公共责任取代派系私利。通过鼓励学术研究、推动教育发展，并在政治决策中更多吸纳知识界与专业人士的意见，共和国将继续沿着民主与科学的道路前行，使这一时代精神在新的历史阶段焕发出持久的力量。"
 LEP_absolute_freedom_of_academic_thought: "学术思想之绝对自由"
 LEP_absolute_freedom_of_academic_thought_desc: "国家的进步离不开思想的解放与知识的创造。长期的战乱与政治压制，使许多学术机构与思想团体难以自由开展研究，公共讨论也常常受到种种限制。然而一个真正现代的共和国，必须容纳不同的见解，并允许思想在公开的辩论与研究中不断发展。政府将保障大学与研究机构的自主地位，减少对学术活动的不必要干预，使学者能够在更加自由的环境中探索社会、经济与政治问题。唯有在思想能够自由交流、批评与创新的氛围之下，国家才能不断汲取新的知识与智慧，为共和国的长远发展提供坚实的精神与学术基础。"
 LEP_human_rights_protection_commission: "人权保障联合会"
 LEP_human_rights_protection_commission_desc: "随着共和国政治生活逐步恢复常态，如何在制度层面保障公民的基本权利，已成为社会各界普遍关注的问题。我们将推动成立“人权保障联合会”，汇集法律界人士、学术团体与社会组织，共同监督相关法律的执行情况，并就公民权利问题提出建议。通过这一平台，国家得以在法律与公共监督的双重机制下不断完善权利保障体系，使公民的自由与尊严不再仅停留于宪法条文之中，而能够在日常社会生活中得到切实维护。"
 LEP_embrace_political_rationality: "拥抱政治理性"
 LEP_embrace_political_rationality_desc: "国家重建既需要理想，也离不开冷静而务实的判断。民主科学社始终主张，以理性讨论取代情绪化动员，以制度化协商取代街头对抗，使公共政策建立在事实、数据与专业意见之上。政府将鼓励更加开放而审慎的政治讨论环境，让不同观点能够在议会与公共空间中得到表达与辩论。"
 LEP_national_student_federation: "组建全国学联"
 LEP_national_student_federation_desc: "青年学生历来是社会思想最为活跃的群体，在国家变革与社会进步的进程中屡次扮演重要角色。我们将推动各地学生组织建立统一的全国性联合机构，协调不同地区学界之间的交流与合作。通过这一平台，学生群体既能表达对国家事务的关切，也能在制度化的框架中参与公共讨论，使青年理想与共和国未来的建设更加紧密地结合在一起。"
 LEP_scientific_public_administration: "科学化公共行政"
 LEP_scientific_public_administration_desc: "面对国家重建的艰巨任务，仅凭旧有的办事方式已难以应对复杂的社会与经济问题。我们必须推动行政体系向更加理性与专业的方向转变，在政策制定与政府运作中引入统计调查、社会研究与技术分析，使公共事务能够建立在可靠的数据与科学方法之上。通过整顿行政流程、吸纳专业人才并推广现代管理理念，我们将逐步建立起更加高效而稳健的公共行政体系，使国家治理能够适应新时代的发展需求。"
 LEP_improve_public_servants_welfare: "改善公教人员待遇"
 LEP_improve_public_servants_welfare_desc: "若要建立稳定而有效的行政体系，首先必须使承担国家事务的人员能够安心其职。我们将着手整顿相关制度，逐步提高公教人员的待遇，规范薪资发放与福利保障，使教师与公务人员得以专心于教育与行政工作。"
 LEP_outline_for_national_reconstruction: "延续建国大纲"
 LEP_outline_for_national_reconstruction_desc: "在共和国重新步入重建阶段之际，国家的发展方向仍需一套能够凝聚共识的纲领性原则加以指引。早年提出的建国大纲曾为中国未来的政治与社会建设描绘出一幅基本蓝图，其关于民主政治、社会进步与国家发展的构想，至今仍具有重要启示意义。我们将以此为基础，对其中的理念加以继承与整理，使其能够适应新的时代条件与现实需要。在保持共和国制度理想的前提下，逐步推进政治建设与社会改革，使国家的发展能够在明确的方向之下稳步前行。"
 LEP_enhance_technological_conversion_rate: "提高技术转化率"
 LEP_enhance_technological_conversion_rate_desc: "近年来学术界虽不断取得新的研究成果，但许多技术仍停留在实验室与论文之中，难以真正进入工厂与社会生产。我们将推动大学、研究机构与企业之间建立更加紧密的合作关系，使科研成果能够更快地投入生产与工程实践之中。同时通过设立专门机构与奖励制度，引导技术人员参与产业发展，使科学不再局限于书斋之内，而成为推动工业进步与经济复兴的重要力量。"
 LEP_civilian_control_of_the_military: "以政管军"
 LEP_civilian_control_of_the_military_desc: "我们将着手整顿军政关系，明确军队服从文官政府的原则，使军事力量纳入国家整体行政体系之中，通过统一的制度与指挥架构加以管理。在保持军队战斗力的同时，确立政治对军队的领导，使军队真正成为保卫国家与共和国制度的力量，而不再成为左右政局的工具。"
 LEP_rely_on_AA: "民国之柱石"
 LEP_rely_on_AA_desc: "我们将主动争取军方的支持，使其在维护社会秩序、保障国家安全以及推动重建工作中发挥更为积极的作用。通过在政府体系中给予军方一定的地位与发言权，我们能够稳固现有政局，为国家争取宝贵的稳定时期。只要共和国仍处在动荡与威胁之中，军队便仍是支撑国家的重要柱石。"
 LEP_encourage_scientific_research: "奖励科学研究"
 LEP_encourage_scientific_research_desc: "国家的进步离不开知识的积累与技术的发展，而科学研究正是推动社会与经济不断前行的重要动力。我们将设立专门的资助与奖励制度，鼓励大学与研究机构开展各类科学研究，为学者提供必要的经费与条件，使更多创新成果得以产生并服务社会。"
 LEP_swords_into_plowshares: "铸剑为犁"
 LEP_swords_into_plowshares_desc: "随着全国局势逐渐趋于稳定，我们有必要重新思考国家资源的分配方向。适当压缩部分军费开支，将人力与资金转向农业、工业与基础建设，使曾经服务于战争的力量逐步投入到国家建设之中。军工技术与设备亦可在规划之下转用于民用生产，推动交通、机械与重工业的发展。"
 LEP_support_small_and_medium_enterprises: "助力中小企业发展"
 LEP_support_small_and_medium_enterprises_desc: "中小企业虽规模有限，却往往最具活力，也最贴近社会日常生产与民生需求。我们将通过改善信贷条件、简化商业手续并提供必要的政策支持，帮助中小企业重新站稳脚跟，使其能够扩大生产、吸纳就业并参与全国市场的恢复。让这些分布各地的企业重新活跃起来。"
 LEP_peace_democracy_independence: "和平、民主、独立"
 LEP_peace_democracy_independence_desc: "历经多年的动荡与纷争，共和国终于重新站在新的历史起点上。国家的未来不应再由战争与权力斗争所主导，而应建立在稳定的制度与广泛的社会共识之上。民主科学社始终相信，唯有和平的国内环境、健全的民主政治以及真正独立的国家地位，才能为中国的发展奠定长久基础。今后我们将继续巩固议会制度，保障公民权利，使政治运作建立在理性与法律之上；同时坚持独立自主的外交立场，使国家能够在国际社会中以平等身份参与往来。以和平为基础，以民主为原则，以独立为目标，共和国的未来方能稳步前行。"
 #民元国民党
 LEP_succession_of_the_regency_cabinet: "承袭摄政内阁"
 LEP_succession_of_the_regency_cabinet_desc: "黄郛曾于北京政变后主持摄政内阁，代行国家权力，以维系首都秩序并处理紧急国政。在那一短暂而关键的时期，摄政内阁以稳健务实之风，力图在动荡之中维持国家运作与制度连续。 如今政局再度重整，我们既承其人，亦当承其政。必要延续其当年所倡之政治构想，在既有经验基础上重建行政体系，使国家避免再陷无序更迭之中。"
 LEP_rule_of_national_experts_and_gentlemen: "专家与绅士之治"
 LEP_rule_of_national_experts_and_gentlemen_desc: "许多批评者谴责政学系是企图推翻国父、与北洋勾结的党内叛徒，也有人声称政学系是一群不了解工人疾苦的象牙塔精英。然而由此看来，本国实业精英与知识精英的统治显然是最有利之选择。"
 LEP_unite_the_party_elders: "联合“元老”"
 LEP_unite_the_party_elders_desc: ""
 LEP_song_jiaoren_vision: "宋教仁的愿景"
 LEP_song_jiaoren_vision_desc: "共和政治之要，在于以政党组织责任内阁，使国家权力运作建立于议会多数与民意基础之上。昔日宋教仁所倡，正是以选举确立政党政治，使内阁对国会负责，从而避免个人专断与权力失衡。其志未竟，遂成近代政治之一大遗憾。今日国家重建在即，我们当重温其理想，推动政党政治与责任内阁之实现，使行政权真正根植于民意之中。"
 LEP_diligence_frugality_loyalty_prudence: "勤俭忠慎"
 LEP_diligence_frugality_loyalty_prudence_desc: "国家之振兴，不仅赖制度与政策，更系于国民之品格与风尚。黄郛素倡以“勤俭忠慎”为教育之本，认为个人修养与公共精神乃共和国长治久安之根基。勤以立业，俭以持家，忠于职守，慎于行事，此四者既为个人立身之道，亦为公共生活之准则。我们将以此为导向，整饬教育与社会风气，使青年一代在求学与从政之中兼重德行与责任。"
 LEP_model_the_british_parliament: "英国国会范式"
 LEP_model_the_british_parliament_desc: "议会之运作，重在制度，更重在风气。英国议会素有一项成例：执政党虽居多数，亦不可忘其背后尚有广大民意；在野党虽处少数，亦自代表一部分国民。故其议员不敢恃众压人，亦不轻以妥协自失立场，凡议案必经反复讨论，务求详尽而不草率。我们当以此为鉴，整饬议会习气，使多数不骄、少数不废，议政以求是为归，使国会不徒具形式，而能真正成为国家理性决断之所在。"
 LEP_council_of_state: "设立参政院"
 LEP_council_of_state_desc: "国家政务若仅限于少数机关之内，难免与社会实际有所脱节。为加强政府与各界民意之间的联系，我们将设立参政院，广泛吸纳工商、学界及地方代表参与国是讨论，使各阶层意见得以汇集与表达。通过这一机构，既可为政府决策提供参考，也能使政策更贴近社会需求。"
 LEP_engaging_with_the_dangwai: "弥合新旧派系"
 LEP_engaging_with_the_dangwai_desc: "本党自成形以来，历经时局变迁与人物更替，内部渐分为不同取向与风格之群体：一部分人重经验与资历，长于旧有政务运作；另一部分人则崇尚革新，主张以新思维应对时代变局。若任由分歧扩大，不仅削弱整体力量，亦难以承担国家重建之重任。我们当在承认差异之基础上，促成彼此调和，使经验与革新相互补充，而非彼此掣肘。通过整合人事、统一政见与协调行动，使各方力量归于一体，则党内自可重建凝聚。"
 LEP_multi_level_governance_system: "多级总揽制"
 LEP_multi_level_governance_system_desc: "当今政务壅滞，多由中央与地方权限不明、彼此掣肘所致。中央之令往往难行于地方，地方之情亦难达于中枢，致使政令反复，效率低下。为此，我们主张实行分权而有统筹之行政体制，在中央与地方之间建立层级分明之治理结构。中央专注外交、财政等大政方针，其余事务则分授地方办理，并于省县之间设立中级行政机关，以承上启下，协调各方。"
 LEP_praise_the_unknown_heroes: "颂扬无名英雄"
 LEP_praise_the_unknown_heroes_desc: "国家之存续与重建，并非仅赖少数显赫人物，更有无数默默无闻之人以其劳作与牺牲支撑其间。无论是战乱之中维系地方秩序的基层人员，抑或在工厂、田野与学校中坚守岗位的普通民众，皆为共和国得以延续的重要力量。我们当通过制度与舆论，对这些无名之士加以表彰与纪念，使其贡献不致湮没无闻。"
 LEP_supreme_economic_council: "最高经济会议"
 LEP_supreme_economic_council_desc: "国家经济事务纷繁复杂，若各部门各自为政，难以形成统一而有效的规划。为统筹全国财政、工业与贸易政策，我们将设立最高经济会议，集中各方力量，对重大经济问题进行统一研究与决策。通过汇集政府官员、实业界代表及专业人士之意见，使国家经济发展不再流于零散与被动，而能在整体规划之下稳步推进。"
 LEP_bank_of_china: "中国银行的支持"
 LEP_bank_of_china_desc: "在当前财政与工业重建并举之际，争取主要金融机构的协助尤为关键。中国银行在国内金融体系中素具重要地位，其资本实力与信用基础，足以为国家建设提供坚实支持。我们将积极争取其配合，通过信贷投放、资金调度与金融协作，缓解企业与政府在重建过程中的资金压力。"
 LEP_municipal_development: "重视市政建设"
 LEP_municipal_development_desc: "现代国家之发展，城市为其枢纽，而市政之良窳，直接关系社会秩序与经济运行。昔日黄郛任上海市政之职，深知城市治理之要，在于统筹规划与务实施政，而非徒事空谈。无论交通整顿、公共卫生，抑或市政设施之建设，皆须有系统筹划，方能见效。我们将以此经验为鉴，着力推进各大城市之市政建设，完善公共服务与基础设施，使城市既为经济发展的中心。"
 LEP_new_china_construction_society: "新中国建设学会"
 LEP_new_china_construction_society_desc: "国家建设之事，非徒凭一时议论所能成，必赖周密筹划与系统研究。为使各项改革与发展不流于零散，我们将组织新中国建设学会，汇集政界与学界之力，对政制、经济、交通及教育诸问题进行分门研究，并提出具体可行之方案。其宗旨不在空谈理念，而在规划实践，使国家发展有据可循。通过整合各方知识与经验，使政策制定建立于详实分析与长远计划之上，则国家之进步，方可有序而持久。"
 LEP_compile_industrial_monographs: "编写实业专志"
 LEP_compile_industrial_monographs_desc: "国家实业虽历经多年发展，然各业状况多散见于零星记载，缺乏系统整理与深入分析，致使政策制定与产业规划往往失之于凭空臆断。我们将组织力量，对全国主要工业与商业进行全面调查，编纂实业专志，详述各行业之发展状况、资源分布与经营经验。通过系统整理既往成果，总结得失，以资后续决策参考。使国家经济建设不再盲目推进，而能在充分认知现实基础之上，循序发展。"
 LEP_continuation_of_the_founding_republican_spirit: "民元精神之传承"
 LEP_continuation_of_the_founding_republican_spirit_desc: "共和肇始，政党竞逐而不失其度，议会辩论而尚存其理，虽局势未稳，然自由与法治之风已见端倪。其后政局屡经变迁，此种政治气象渐趋消散，殊为可惜。今国家重建在即，我们当追溯民元之初的政治精神，使议会制度重归理性讨论之轨，使政党竞争建立于原则与责任之上，而非权谋与纷争。通过恢复早年自由主义之政治风尚，重申宪政与法治之基础，共和国或可在新的时代条件下，重现其初创时之生机与秩序。"
 ##工商联
 LEP_GSL: "商业政府"
 LEP_GSL_desc: "对于一个亟需复兴的国家而言，恢复生产、重建金融与振兴商业才是最迫切的任务。以荣宗敬为代表的实业界人士认为，国家治理应更多吸纳工商界的经验与视角，使政府能够以务实态度处理财政、工业与贸易问题。我们将推动工商界代表进入政府与议会，使国家政策更加关注经济发展与市场秩序，让行政运作摆脱无休止的政治纷争。"
 LEP_modern_management_system: "引入现代管理制度"
 LEP_modern_management_system_desc: "若要推动工业与商业的全面复兴，行政与企业管理也必须随之革新。我们将借鉴近代企业的管理经验，引入更加明确的责任分工、财务监督与绩效考核制度，使政府部门与重要经济机构的运作更加规范而高效。同时鼓励培养具有现代管理知识的人才，使国家治理与企业经营逐步摆脱旧有习惯，迈向更加科学而系统的运作方式。"
 LEP_labor_capital_reconciliation: "劳资协调"
 LEP_labor_capital_reconciliation_desc: "工业发展离不开企业家的投资与经营，也离不开广大劳动者的辛勤付出。若劳资关系长期处于对立状态，不仅会损害生产秩序，也会动摇社会稳定。为推动国家经济的持续发展，我们必须在资本与劳动之间建立更加稳定的合作关系。通过完善相关法律与调解机制，使企业与工人能够在制度框架下解决争议，维护合理的工资与工作条件，同时保障企业正常运作与生产效率。"
 LEP_depoliticize_trade_unions: "工会去政治化"
 LEP_depoliticize_trade_unions_desc: "近年来，各地工会组织在社会运动与政治斗争中愈发活跃，本应维护劳动者权益的机构，逐渐被不同政团所利用，成为动员与对抗的工具。频繁的政治化斗争不仅加剧劳资对立，也对正常的生产秩序造成影响。若要恢复工业与商业的稳定发展，我们必须重新界定工会的职能，使其回归维护工人福利与劳动条件的本来职责。通过规范工会活动范围，限制政党与政治团体对工会事务的干预，使劳资问题能够在专业与制度框架下得到解决。"
 LEP_labor_autonomous_region: "劳工自治区"
 LEP_labor_autonomous_region_desc: "在现代工业的发展中，稳定而有秩序的劳资关系至关重要。一些实业企业在实践中探索出以工厂为中心的职工社区制度，通过兴办宿舍、学校、医院与合作社等设施，使工人与家属能够在较为完善的社会环境中生活与工作。我们将借鉴这一经验，在重要工业区建设具备自治性质的劳工社区，鼓励工人参与日常管理，并完善教育、医疗与福利设施。如此既可增强工人的归属感与稳定性，也有助于维持生产秩序，为国家工业发展提供可靠基础。"
 LEP_uphold_responsible_government: "坚持责任政治"
 LEP_uphold_responsible_government_desc: "共和国政治若要长久稳固，权力的运作便必须与责任相伴而行。长期以来，许多政治纷争往往停留在空洞争论之中，而对国家财政、工业发展与社会秩序等实际问题关注不足。我们主张建立更加务实的责任政治，使执政者必须对其政策与施政结果承担明确责任。政府在制定与推行各项政策时，应以国家经济建设与社会稳定为优先，并接受议会与社会的监督。"
 LEP_bribe_the_jiangzhe_cliques: "拉拢江浙同志"
 LEP_bribe_the_jiangzhe_cliques_desc: "在南方政治格局之中，来自江浙地区的一批革命人士长期活跃于政界与社会团体之中，其中不少人出身于早年的国民革命运动，至今仍在地方政界与社会组织中拥有相当影响。若要稳固当前政局并推动国家建设，我们不能忽视这些力量的存在。通过与这些革命人士建立合作关系，吸纳其中较为务实的一部分进入新的政治框架，我们既能够扩大政府的社会基础，也能缓和旧有派系之间的紧张关系。"
 LEP_alliance_with_the_civic_party: "联合公民党"
 LEP_alliance_with_the_civic_party_desc: "在北洋时代形成的诸多政团之中，公民党虽历经政局更迭，却仍在旧议员群体与地方政界之中保有一定影响。其成员多出身早年议会政治，对行政运作与立法程序亦颇为熟悉。在国家重建与政局重新整合之际，我们有必要争取这一温和而务实的政治力量。通过与公民党达成合作，使其代表进入新的政治框架之中，不仅能够扩大政府在议会中的支持基础，也有助于吸纳旧政界的经验与人脉。"
 LEP_exploit_the_european_war: "利用欧战"
 LEP_exploit_the_european_war_desc: "欧陆再度陷入大战，列强纷纷将人力与工业投入战场，许多国家的生产与贸易因此受到严重影响。然而战争同样带来了新的市场需求，军需物资与工业产品的缺口迅速扩大。回顾上一次世界大战期间，中国实业便曾因海外需求激增而迎来一段迅速发展的时期。如今国际局势再次出现类似局面，我们完全可以把握这一难得的机会。通过向协约国家出口粮食、原料与工业制品，不仅能够为国内工商业带来可观利润，也有助于为国家经济积累更多发展的资本。"
 LEP_dream_of_tianyuan: "天元之梦"
 LEP_dream_of_tianyuan_desc: "数十年来，中国民族工业的发展离不开一批实业家的艰苦经营。其中，以荣宗敬与荣德生兄弟为代表的荣氏企业，在纺织与面粉业中开创了近代民族工业的重要基业。经历多年风雨之后，荣德生逐渐形成了更加长远的设想：以稳健经营为原则，使农业、工业与商业相互配合，逐步建立起完整而独立的实业体系。我们将以这一构想为蓝本，推动基础产业的发展，重视技术与人才培养，使中国实业能够在稳步扩展中不断壮大。或许，这一“天元之梦”终能成为国家经济复兴的起点。"
 LEP_institute_for_public_industry_and_commerce: "公益工商研究所"
 LEP_institute_for_public_industry_and_commerce_desc: "战时以来，以荣尔仁创办的公益工商研究所，曾汇集学者与专家，对企业生产、经营管理及产业发展问题进行深入研究，并提出切实可行的改良方案。其一方面为企业提供顾问服务，另一方面沟通市场与生产信息，使工商运作更趋协调，并将研究成果公开，服务社会整体发展。我们将借鉴这一模式，推动建立类似的研究机构，以科学分析指导工业建设。"
 LEP_tongren_savings_department: "同人储蓄部"
 LEP_tongren_savings_department_desc: "实业发展离不开稳定而充足的资金来源，而过度依赖银行借贷，往往使企业受制于金融市场，难以自主发展。早年以荣宗敬、荣德生为代表的实业家，曾通过设立“同人储蓄部”，吸纳企业内部与社会闲散资金，为企业扩张提供了可靠支持。我们将借鉴这一经验，在工商体系内部建立类似的储蓄与融资机制，鼓励资本在生产体系内循环运作，以降低对外部金融的依赖。通过集中分散资金、减少利息负担，企业得以更加稳健地扩大规模，为国家工业发展提供持续而有力的资金保障。"
 LEP_grand_agricultural_plan: "大农业计划"
 LEP_grand_agricultural_plan_desc: "中国之根本在于农业，然长期以来生产分散、技术落后，难以支撑国家整体发展。总结实业经营之经验可知，农、工、商三者本为一体，缺一则难以久远。我们将以农业为基础，推动土地整理、水利建设与交通改善，并逐步引入改良种植与组织化经营，使农村生产能力得以提升。同时加强农业与工业、商业之间的联系，使原料供给、加工制造与市场流通形成统一体系。"
 LEP_ban_foreign_capital: "抵御外国资本"
 LEP_ban_foreign_capital_desc: "在国家经济重建之际，外资势力往往乘机进入，以资金与技术之优势争夺市场与资源。若任其无序扩张，本国实业不仅难以发展，甚至可能受制于人。我们并不拒绝对外经济往来，但必须在维护国家利益与民族工业的前提之下加以规范。通过加强对关键行业的保护，限制不利于本国企业发展的资本渗透，并扶持民族工商力量壮大，使国内产业能够在竞争中站稳脚跟。"
 LEP_agricultural_and_sideline_product_trade: "农副产品贸易"
 LEP_agricultural_and_sideline_product_trade_desc: "农业生产不仅关乎民生温饱，其副产品亦是连接城乡经济的重要纽带。长期以来，农副产品流通渠道不畅，价格波动频繁，既损害农民利益，也影响市场稳定。若要推动农村经济发展，必须建立更加完善的贸易体系。我们将整顿流通环节，发展专业市场与批发网络，改善运输与储存条件，使农副产品能够顺利进入城市与工业体系之中。同时通过规范交易秩序，减少中间盘剥，使生产者与消费者均能从中受益。"
 LEP_upright_in_politics_and_business: "政商清明"
 LEP_upright_in_politics_and_business_desc: "国家之治，既不可为权力所独断，亦不可为私利所侵蚀。长期以来，政界与商界之间往往纠缠不清，或相互掣肘，或暗中依附，既损害行政公信，也阻碍经济发展。全国工商联合会始终主张，在政府与市场之间建立明确而健康的关系，使政令归于公正，商业遵循规则。我们将推动制度化的政商关系，既保障企业依法经营的空间，又防止权力干预市场、资本左右政治。唯有政商各循其职、相互配合而不过界，共和国方能在清明有序的环境中实现持久的繁荣与稳定。"
 #团结联盟
 LEP_solidarity_union: "成立团结联盟"
 LEP_solidarity_union_desc: "连日来的政治纷争与社会动荡，使原有的议会运作几近停滞，各党派相互攻讦而无力应对现实危局。在此背景之下，一批主张维持秩序、推进重建的边缘力量开始走向联合，试图超越既有党派对立，建立一个以国家利益为先的合作平台。由此，国家团结联盟应运而生，汇集不同立场却同样关切国家前途的各方人士，以恢复政治运转、稳定社会局势为共同目标，并在现实压力之下逐步展开协同与行动。"
 LEP_financial_rectification: "财政整顿"
 LEP_financial_rectification_desc: "长期的政局动荡与行政失序，使国家财政收支紊乱，税源流失与开支失控并存，既削弱政府运作能力，也加重社会负担。在当前形势下，恢复财政秩序已刻不容缓。我们将着手清理各项收入来源，统一征收体系，杜绝中间侵蚀，同时整顿支出结构，压缩不必要的开支，使有限财力能够用于维持国家运转与必要建设。"
 LEP_proclaim_the_state_of_extraordinary_administration: "宣布非常状态"
 LEP_proclaim_the_state_of_extraordinary_administration_desc: "当前局势动荡未息，议会运作屡遭干扰，社会秩序亦难以维持。若仍拘泥于常态程序，恐难以及时应对接连不断的危机。在此情形之下，我们不得不采取非常之举，宣布进入非常状态，以集中行政权力，迅速恢复秩序与政府运作。通过强化行政命令之效力，简化决策程序，使国家机器能够在最短时间内重新运转。"
 LEP_protect_democracy_procedure: "维护民主程序"
 LEP_protect_democracy_procedure_desc: "尽管局势动荡，政局纷扰，但共和国之根本仍在于制度与程序。若因一时之乱而轻弃民主原则，虽可求得短暂之便，却可能动摇长远之基。我们应在可能范围内坚持议会运作与既有法定程序，使各项决策仍通过公开讨论与合法途径形成。通过维持选举、议事与监督机制的基本运转，使社会各界仍能在制度框架内表达意见与参与政治。"
 LEP_restore_order_in_the_capital: "恢复首都秩序"
 LEP_restore_order_in_the_capital_desc: "首都为全国政务之中枢，其安定与否直接关系国家运转之成败。然经连番动荡，行政机关失序，社会治安亦多紊乱，已严重影响政府正常施政。我们当以恢复首都秩序为当务之急，整顿治安力量，重建行政体系，使各机关能够各归其位、各司其职。同时整饬公共环境与交通秩序，使城市运转逐步回归常态。唯有使首都重新稳定，国家政令方能顺畅施行，各项重建工作亦可由此展开。"
 LEP_press_regulation_bill_draft: "出版法修正案"
 LEP_press_regulation_bill_draft_desc: "舆论之兴衰，关系社会秩序与公共讨论之方向。长期以来，出版管理制度或失之过宽，滋生失实与煽动之言；或失之过严，抑制正常言论之表达，皆非国家之福。为适应当前局势之需要，我们将对现行出版法规加以修正，明确言论之界限与责任，使新闻与出版活动既能反映社会意见，又不致扰乱秩序。"
 LEP_restrict_inflammatory_propaganda: "限制煽动性宣传"
 LEP_restrict_inflammatory_propaganda_desc: "当前社会情绪浮动，各类激烈言论与煽动性宣传不断扩散，不仅加剧群体对立，也对公共秩序造成直接冲击。若任其发展，轻则扰乱视听，重则引发更大规模的动荡。我们将对相关宣传活动加以规范，限制带有明显煽动性质与破坏性的言论传播，使舆论空间不再被极端声音所主导。"
 LEP_encourage_freedom_discussion: "允许自由讨论"
 LEP_encourage_freedom_discussion_desc: "社会纷争之所以加剧，往往源于意见无从表达而积聚成怨。若一味压制言论，虽可暂时维持表面平静，却难以真正化解矛盾。我们应在制度范围内保障各界发表意见之权利，使不同主张能够通过公开讨论加以表达与辩论。通过扩大言论空间，引导社会情绪在理性渠道中释放，使公共问题得以在争论之中逐步明晰。"
 LEP_restore_cabinet_authority: "重建内阁权威"
 LEP_restore_cabinet_authority_desc: "经过一系列整顿与协调，原本分散的行政权力逐渐重新汇集于内阁之中，政令得以统一发布与执行，政府运作亦由紊乱转趋有序。在持续的博弈与协同之下，各方力量围绕内阁形成新的权力格局，或主张以效率与秩序为先，或强调程序与民意之本。至此，国家行政中枢已然重建，而其主导方向，亦随之在现实运作中逐步确立。"
 ##人民救国会
 LEP_from_national_salvation_to_state_building: "从救亡到建国"
 LEP_from_national_salvation_to_state_building_desc: "人民救国会本起于时局艰危之际，联络各界人士，以反对内战、关注民生为宗旨，力图在纷乱之中保存国家元气。然救亡之举，终属一时之策，若国家长久停留于动员与应对之中，则难以实现真正的安定与发展。今局势已有所转变，我们当承其既有基础，将重心由呼号与抗争转向制度建设与社会改良，使各项主张落实于具体政策之中。由此，人民救国会亦将完成其由救亡团体向建设力量的转变，在国家重建之中发挥更为持久而实际的作用。"
 LEP_the_call_of_democracy_and_weekly: "《民主》《周报》呼声"
 LEP_the_call_of_democracy_and_weekly_desc: "舆论之兴，往往先于政局之变。《民主》与《周报》本为倡言时政、关切民生之刊物，今在人民救国会之推动下，逐渐成为联络各界、传播主张的重要阵地。两刊以平实之笔触，揭示社会问题，倡导民主原则，并呼吁停止无谓纷争，将国家重心转向建设与改革。其言或不激烈，却直指时弊，既反对极端之举，亦不苟同空谈之论。"
 LEP_moderate_social_reform: "温和社会改造"
 LEP_moderate_social_reform_desc: "社会问题之积累，非一朝一夕所成，若以激烈手段骤然变革，往往反致动荡加剧。我们主张在既有秩序之内推进改革，以渐进之方式调整不合理之结构，使社会各阶层之利益得以协调。通过完善劳动保障、改善教育与公共服务，并适度限制不当资本扩张，使发展成果能够更加均衡地分配。"
 LEP_responsibility_of_the_intellectuals: "知识界之责任"
 LEP_responsibility_of_the_intellectuals_desc: "国家之兴衰，不仅系于政权之更替，亦有赖于知识界之自觉担当。学人若仅闭门治学，而不问时局，则其所学难以服务社会；若流于空谈议论，亦难以真正推动进步。在当前转型之际，知识界当走出象牙之塔，以理性之精神参与公共事务，对国家建设提出切实可行之意见。无论在教育、舆论抑或制度改革之中，皆应发挥引导与启迪之作用。"
 LEP_university_autonomy: "大学自治"
 LEP_university_autonomy_desc: "各地大学在动荡中屡受干预，校务与学术难以自立。今后将重申校董会与教授治校原则，明确经费来源与管理权限，减少行政机关直接干涉。通过恢复院系自主设置、课程编定与人事聘任之权，使学术研究与人才培养得以循序展开。同时，建立与社会团体及产业界的联系渠道，在不损及学术独立的前提下引入资源，维持学校运作并扩展教育规模。"
 LEP_safeguard_labor_rights: "劳工权利保障"
 LEP_safeguard_labor_rights_desc: "工业发展日益推进，劳工已成为国家生产体系中不可或缺之力量。然长期以来，劳动条件不均、保障不足等问题屡见不鲜，既影响生产效率，亦易滋生社会不满。我们当着手建立较为完善的劳工保障制度，对工时、工资与劳动安全加以规范，并逐步完善救济与保险措施，使劳动者在生产之中获得应有之保障。"
 LEP_social_revolutionary_alliance: "社会革命联盟"
 LEP_social_revolutionary_alliance_desc: "由宋庆龄所领导的国民党（革命委员会），长期主张社会改良与民主联合，与我方在诸多问题上理念相近。基于此，我们将寻求与其建立合作关系，形成更为广泛的政治联盟，以共同推进社会改革与制度建设。在相互协调与支持之下，使各项政策能够获得更坚实的政治基础，从而在稳定之中逐步实现社会进步之目标。"
 LEP_democratic_united_front: "民主联合阵线"
 LEP_democratic_united_front_desc: "在当前局势之下，推进改革未必唯有激进之途，广泛而稳健的合作同样可以凝聚力量。与其依赖立场较为鲜明之社会改造同盟，我们更倾向于联合以理性与渐进改革见长的各界民主力量，特别是与民主科学社建立合作关系。通过扩大合作范围，使不同意见能够在制度之内加以协调与整合，以形成更为温和而持久的改革基础。"
 LEP_peoples_livelihood_revolution: "民生革命"
 LEP_peoples_livelihood_revolution_desc: "国家之根本，在于人民之生计。长期以来，社会发展失衡，贫富差距与生活困顿并存，若不加以调整，则政治之稳定亦难持久。我们将承接国民党（革命委员会）所倡之民生主张，以改良社会经济结构为要务，通过调节分配、扶助弱势，并完善公共保障，使发展成果惠及更广泛之人群。此种“革命”，不在激烈破坏，而在于有计划之改革，使民众生活逐步改善，使国家之基础由此更加稳固。"
 LEP_chinas_third_way: "中国的第三道路"
 LEP_chinas_third_way_desc: "单一模式已难以回应中国之复杂现实。或偏重权力集中而忽视民生，或流于空谈理想而缺乏施政能力，皆不足以支撑国家长远发展。人民救国会所追求者，不在极端之间择一，而在于开辟一条兼顾秩序与民主、结合改革与稳定之道路。无论与何种力量合作，其根本仍在于以民生为本，以理性为导，通过渐进而持续的改良，使国家在避免剧烈震荡的前提下，实现社会进步与政治完善。"
 LEP_middle_class_unity: "团结中产阶级"
 LEP_middle_class_unity_desc: "家之稳定，有赖于社会中坚力量之支持。城市职员、教师、工程师及中小业主等群体，既关切民生改善，亦重视社会秩序与发展前景，实为维系国家运转之重要基础。我们当主动争取中产阶级之认同，通过改善其经济与生活条件，保障其合法权益，并为其参与公共事务提供制度渠道，使其利益与国家建设相结合。在稳定其信心之同时，亦可缓和社会对立。"
 ##景星会
 LEP_order_and_efficiency: "秩序与效率"
 LEP_order_and_efficiency_desc: "政局动荡之际，国家运转往往陷于迟滞与紊乱，法令不行，行政不畅，既削弱政府权威，亦损害社会信心。在此情形之下，恢复基本秩序与提升行政效率，已成为当务之急。景星社主张以务实态度整顿政务，通过强化组织与纪律，使各级机关能够迅速响应并有效执行决策，使国家机器重新运转起来。在秩序逐步恢复之中，效率亦随之提高，为后续一切建设奠定必要基础。"
 LEP_military_sports_organization: "军事体育组织"
 LEP_military_sports_organization_desc: "国家之强，不仅在于制度与经济，亦系于国民体魄与纪律之培养。为增强社会整体之组织力与应变能力，我们将推动军事体育之普及，在学校与社会中建立相应组织，使青年与民众在体育训练之中兼习纪律与协作。此类训练既有助于强健体质，亦能培育服从指挥与集体精神，使国民在平时具备基本之组织观念。"
 LEP_expand_the_national_planning_system: "扩大国家计划体系"
 LEP_expand_the_national_planning_system_desc: "国家建设既已步入正轨，单凭分散之力量，已难以统筹全局发展。为使经济与社会各项事业协调推进，我们将进一步扩大国家计划体系之覆盖范围，对工业、交通与资源配置等关键领域加以整体规划。通过明确发展重点与阶段目标，使各项建设不致各行其是，而能在统一部署之下有序展开。"
 LEP_administrative_orders_take_precedence: "行政命令优先"
 LEP_administrative_orders_take_precedence_desc: "国家治理亟需建立明确而高效的运作机制。过于繁复的议事程序与反复协调，往往削弱政策执行之力度，使既定方针难以贯彻。为此，我们将确立行政命令在具体施政中的优先地位，使决策能够迅速转化为实际行动。通过理顺权责关系，强化执行体系，使各级机关在统一指挥之下高效运作。"
 LEP_establish_the_central_policy_research_office: "中央政策研究室"
 LEP_establish_the_central_policy_research_office_desc: "国家事务日益复杂，单凭经验与临时判断，已难以支撑长远决策。为提升施政之科学性与前瞻性，我们将设立中央政策研究室，专责汇集各方资料，对经济、社会与行政诸问题进行系统研究，并提出切实可行之政策建议。通过集中专业人才与研究力量，使决策不再流于片面与仓促，而能建立在分析与论证之上。"
 LEP_resource_control: "资源统制"
 LEP_resource_control_desc: "关键资源之配置不可任由分散与无序流动。为保障整体建设之需要，我们将对能源、原料及重要物资实行必要之统制与调配，使其优先服务于国家重点产业与公共事业。通过建立统一的管理与分配机制，减少重复与浪费，避免局部利益干扰整体布局。在合理规范之下，使资源运用更趋集中与高效，从而支撑国家计划之实施，确保各项建设能够稳步推进。"
 LEP_eliminate_localism: "限制地方权力"
 LEP_eliminate_localism_desc: "统一既已确立，然地方观念与区域利益仍时有抬头，若任其发展，易致政令不一，影响整体施政之推进。为确保国家意志得以贯彻，我们将对过度膨胀之地方主义加以限制，明确中央与地方之权责边界，使各级行政在统一框架内运行。"
 LEP_recruit_engineers_and_economists: "吸纳工程师与经济学家"
 LEP_recruit_engineers_and_economists_desc: "现代国家之治理，愈发依赖专业知识与技术判断。单凭传统行政经验，已难以应对复杂之经济与工业问题。为提升施政能力，我们将主动吸纳工程师与经济学家进入政府体系，使其参与政策制定与执行过程。通过引入专业视角，对产业发展、资源配置与财政运作进行科学分析，使各项决策更具可行性与前瞻性。"
 LEP_bismarckian_liberalism: "俾斯麦式自由主义"
 LEP_bismarckian_liberalism_desc: "国家治理既需秩序之维系，亦不可全然排斥制度与参与之形式。我们所追求者，非放任之自由，亦非僵化之专断，而是在国家主导之下，对宪政与社会政策加以有节制之运用。通过保留必要之议事机制与公共参与，同时以强有力之行政体系加以引导，使自由不致流于无序，使权力不致失其节制。在此框架之中，国家得以统筹全局，社会亦能在既定秩序之内获得发展空间，从而形成一种兼顾稳定与活力的治理形态。"
 LEP_mobilisation_of_society: "社会动员"
 LEP_mobilisation_of_society_desc: "国家建设既已展开，仅赖政府推动仍嫌不足，尚需唤起社会各界之参与与协力。为此，我们将有计划地组织社会力量，通过各类团体与制度渠道，引导民众参与公共事务与国家建设，使个人之努力能够汇入整体发展之中。通过有序动员，使社会资源得以整合，既增强执行能力，亦培育公共责任感。在统一引导之下，使国家与社会之间形成更为紧密之联系，从而为各项政策之落实提供广泛而稳定的支撑。"
 
 #外交国策
 ##帝国公约
 LEP_Return_to_the_World_Stage: "重返世界舞台"
 LEP_Return_to_the_World_Stage_desc: "各国使馆往来重新恢复，中断已久的电报与邮政线路相继接通。南京方面调阅旧档，逐项核查既有对外关系，整编驻外机构与人员名册，收回散失已久的对外交涉主动权。此前停滞的谈判重新启动，口岸管理与通商手续改按统一办法办理，关税与航运事务逐步纳入本国体系之中。商会与航运团体据此恢复对外联系，人员与货物流动日益频繁。随着各项事务重归掌握，中国在对外往来中的地位亦随之恢复，不再任由他人摆布。"
 LEP_approach_berlin: "柏林照会"
 LEP_approach_berlin_desc: "南京方面在整理对外关系时，并未忽视此前延续已久的对德往来。早年间的军事顾问、设备采购与技术联系，多由个人渠道维系，往来虽频，却缺乏统一安排。随着相关档案与名册被逐步清理，这些分散的联系被纳入正式记录之中，交由专门机构接手处理。原有的人员与合作项目得以保留，并在此基础上补充新的条款与范围，使其由临时协作转为制度化运作。对德关系因而从零散往来转入统一管理，成为当前对外政策中最先被理顺的一环。"
 LEP_industrial_tech_assistance: "工业技术援助"
 LEP_industrial_tech_assistance_desc: "在既有对德往来的基础上，我们着手整理并扩大工业领域的合作事项。有关设备引进、工厂改建与技术培训的需求被汇总后提交对德交涉渠道，原先分散进行的采购与顾问聘用逐步改由统一机构办理。德方工程人员与技术资料陆续抵达，涉及机械制造、化工与电力等多个部门。随着相关项目推进，我们的工业基础得到补充与修整，逐步转入持续运作之中。"
 LEP_east_asia_collective_defense: "东亚共同防务"
 LEP_east_asia_collective_defense_desc: "在加入帝国公约之后，我们开始将东亚局势纳入统一考量。德属东亚的成立，使南洋航道与沿海防务出现新的力量配置，日本方面的动向亦随之受到更密切的关注。我们据此与德方就区域安全问题展开协商，将原有零散的情报交换与海防联络加以整合。相关安排围绕港口使用、航道巡护与情报通报逐步展开，沿海要点与交通线被纳入共同防务视野之中。随着协作机制确立，双方在东亚的行动由各自应对转入相互配合，对潜在冲突的准备亦随之提前展开。"
 LEP_join_imperial_preferential_system: "加入帝国特贸体系"
 LEP_join_imperial_preferential_system_desc: "既有对德贸易往来之上，相关交涉被提上日程，围绕结算方式与货物流通安排逐步展开。战后形成的中欧同盟体系，已在成员之间确立统一的关税协调与清算机制，商品多经既定渠道交换流转。随着条款逐项敲定，关税标准、配额分配与结算办法相继明确。加入体系之后，对外贸易不再依赖零散渠道，进出口路径与资金往来趋于固定。若干关键物资获得稳定来源，原料与制成品的流通亦有章可循，贸易事务由临时应对转入持续运作之中。"
 ##莫斯科协约
 LEP_visit_moscow: "访问莫斯科"
 LEP_visit_moscow_desc: "在北方局势逐步稳定之后，我们将对俄关系提上议程。有关边境通行、贸易往来与既存事务的处理，被整理成案，交由专使携带北上。使团抵达莫斯科后，与当地方面展开会晤，围绕人员往来、铁路运输与物资交换等事项逐项交换意见。部分长期悬而未决的问题得以重新启动讨论，相关渠道亦随之恢复。随着访问行程推进，对俄事务由间断接触转入有序往来，双方联系逐步确立。"
 LEP_eurasian_landbridge: "连接欧亚大陆桥"
 LEP_eurasian_landbridge_desc: "横贯欧亚的铁路干线重新进入规划视野，各区段通行状况与运力安排逐一核查。围绕货运调度、车站衔接与通关手续的具体办法，与沿线方面展开协商，中断线路陆续恢复运转。\n\n货物运输由分段转运改为贯通运行，内地与北方通道之间的联系明显加强。部分出口商品经由陆路进入欧亚市场，人员与信息往来加快，交通体系由区域运作转入跨区域衔接。"
 LEP_russian_military_mission: "俄国军事顾问团"
 LEP_russian_military_mission_desc: "我们着手整编并引入俄国军事顾问团，将原先零散的军事接触纳入统一安排。有关训练纲要、编制调整与武器使用的需求被集中整理，通过既定渠道与俄方对接，顾问人员分批抵达各主要驻地。围绕步兵操典、参谋制度与后勤组织展开的指导逐步铺开，部分部队先行试点，训练与指挥方式随之调整。原有不一的编制与流程被逐步规范，军队运作转入更为稳定的体系之中。"
 LEP_develop_siberia: "开发西伯利亚"
 LEP_develop_siberia_desc: "我们与俄方就林业采伐、矿产勘探与运输线路使用逐项交换意见，既有零散贸易与劳务往来被纳入统一安排。相关企业与人员被组织起来，分批进入指定区域开展作业，物资补给与回运路径一并明确。开发活动逐步铺开，原料获取与对外输出形成固定渠道，部分资源开始稳定进入国内市场。沿线交通与补给体系得到利用与扩展，北方通道由单一运输转为兼具开发与流通的综合网络。"
 ##协约国
 LEP_ottawa_mission: "渥太华使团"
 LEP_ottawa_mission_desc: "大战硝烟散尽，英法正统政府虽退守殖民地，却仍手握深厚底蕴与全球影响力，它们的殖民网络联结四方，工业基础未曾崩塌，海军力量依旧威慑大洋。此刻加入协约国，既守护共同珍视的秩序与自由；更能获得英法源源不断的经济援助、关键战略物资补给，以及成熟的军事训练与战术指导。"
 LEP_free_trade_memorandum: "自由贸易备忘录"
 LEP_free_trade_memorandum_desc: "协约国主导的经济发展委员会（IEDC）所倡自由贸易体系，已成全球经济秩序核心支柱。其背靠英法殖民网络与工业底蕴，掌控海量战略资源与市场通道。我邦签署此备忘录，加入自由贸易框架，可获协约国经济援助填补战后复苏缺口，依托其体系整合国内工矿、铁路资源，筑牢国防经济根基。"
 LEP_naval_construction_guidance: "海军建设指导"
 LEP_naval_construction_guidance_desc: "自海疆多事以来，我国海防久疏修缮，舰只老旧、海防废弛，难御外侮、难固海权。协约国海军历经大战淬炼，舰船技术、战术体系与建设经验均居世界前列。民国政府恳请其提供海军建设指导，借其先进舰船设计图纸、军工生产技术与专业训练体系，革新海防工业，培育海军人才，重整舰队建制。"
 LEP_expand_pacific_shipping: "发展太平洋航运"
 LEP_expand_pacific_shipping_desc: "海权角逐之下，太平洋航线实为贯通亚欧美之战略命脉，系乎资源转运、防务协同与国脉存续。航运滞后致沿海物资梗阻，海防补给困顿，海权拓展受限。借协约国海事支援，疏浚良港、添置舰船，构建太平洋航运网络。打通工矿产品出口通道，强化同盟经济联结。筑牢海防补给生命线，支撑海军远洋部署，稳固区域海上秩序。"
 ##自主
 LEP_pan_asian_liberators: "泛亚解放者"
 LEP_pan_asian_liberators_desc: "近代以来，亚洲各地相继沦入帝国主义的枷锁之中，中国亦曾深受其害，从通商口岸到条约体系，无不铭刻着屈辱的印记。然而今日之中国，已不再是任人摆布的旧日之国，我们有责任，也有能力，改变这一切。亚洲的命运不应由域外列强决定。从朝鲜半岛到南洋群岛，各地反抗的声音从未断绝。我们将与这些力量相互呼应，支持一切反对帝国主义压迫的斗争，使被分割、被控制的亚洲重新站立起来。"
 LEP_multilateral_trade_pact: "多边贸易协定"
 LEP_multilateral_trade_pact_desc: "近代以来，中国对外贸易长期受制于不平等条约与各类特权安排，关税不能自主，市场亦屡遭操控。列强各自为政，商路分割，令我国经济发展处处受限。今日局势既变，旧有体系难以为继，我们有必要重新确立对外贸易的规则，使其服务于国家之需。我们将推动签订多边贸易协定，与各国在平等基础上重订关税、结算与通商办法，打破旧有壁垒，恢复正常往来。通过统一规则与互惠安排，重建贸易秩序，使货物流通与资金往来不再受制于单一强权。"
 LEP_regional_division_of_labor: "区域分工协作"
 LEP_regional_division_of_labor_desc: "各地产业各自为政，生产与流通缺乏统筹，原料与市场错配频仍，既受制于外来资本，又难以形成自身体系。帝国主义以分割之法操控区域经济，使各地彼此依赖却难以协同，财富外流而发展受限。我们将推动区域分工协作，统筹各地资源与产业布局，使原料产地、工业中心与市场之间形成有机联系。在统一规划之下，各区域各展所长，相互支撑，逐步构建独立而完整的经济体系，使国家发展不再受制于外部安排。"
 LEP_joint_military_exercises: "共同军事演习"
 LEP_joint_military_exercises_desc: "近代以来，各国军力各自为战，指挥体系与战术运用差异悬殊，一旦局势骤变，协同往往迟滞。外来势力凭借统一调度与成体系训练，在区域冲突中屡占先机。此种分散之状，已难以应对现实威胁。我们将推动共同军事演习，与有关方面就指挥协同、兵种配合与后勤保障展开系统训练。通过实兵演练与参谋推演，逐步统一行动标准与通信体系，使各部队在实际运用中形成默契。在反复磨合之中提升整体作战能力，使潜在威胁不敢轻举妄动。"
 LEP_China_Stands_Majestically_in_the_Cosmos: "中华雄立宇宙间"
 LEP_China_Stands_Majestically_in_the_Cosmos_desc: "南亚、东亚、东南亚以至太平洋的海风，已不再回响旧日列强的号令。帝国主义加诸于这片大地的枷锁，被一一斩断，中国的力量由陆至海铺展开来，重塑区域的秩序与方向。我们不再仰人鼻息，而以自身意志立定世界之中。山河所及，航路所通，皆见中华之声与中华之力。此非一时之胜，而是新秩序之开端——自此以后，中国当雄立宇宙之间。"
 ##扩张
 LEP_demand_concessions_return: "要求归还租界"
 LEP_demand_concessions_return_desc: "过去，中国政府将同胞出卖给了帝国主义，多么悲哀！但我们没有忘记多年来在上海高举革命大旗，反抗反动势力的兄弟姐妹们。如今的中国乃是新生的中国，她将奋起反抗使馆委任政府强加予中国的耻辱。我们将解放手足同胞，无论是和平还是武力。"
 LEP_consolidate_the_frontiers: "巩固边疆"
 LEP_consolidate_the_frontiers_desc: "中国有一当务之急，就是确立西藏、蒙古、新疆等边疆地区属于大中国的事实。长久以来，中华民族屈膝于帝国主义压迫之下，也渴望着国民革命的指引。正如中山先生教诲，当我们团结起来指引民众时，中华文明就将再次伟大。"
 LEP_beyond_macmahon_line: "跨过麦克马洪线"
 LEP_beyond_macmahon_line_desc: "不公的麦克马洪线由英国人所划，将达旺地区强行割离我国，但后来西藏分裂势力占据了这片领土。西藏事务是中国内政，英国未经许可便擅自变动疆界，此举践踏了中华民族的尊严，令我国处理内政的能力蒙羞。我国伟大复兴业已完成，是时候向前推进，恢复中华领土完整之神圣不可侵犯。"
 LEP_secure_the_northern_frontier: "保卫北方边疆"
 LEP_secure_the_northern_frontier_desc: "邻国俄罗斯现由反动派执政，这个事实提醒我们，帝国主义威胁不仅来自于西方，也来自于北方。我国对蒙古拥有宣称，俄罗斯对此地也垂涎已久，此外，我们也不能忘记外东北曾是大中华的一部分。要想保卫边境，也许应该对俄国巨熊发动奇袭，给他们狠狠一击。"
 LEP_liberate_southeast_asia: "解放东南亚"
 LEP_liberate_southeast_asia_desc: "明朝以来，南海就处在中国文化、社会、经济和政治影响范围内。就像中国一样，东南亚长期存在帝国主义和反帝同志，此外，当地华侨华人向往并支持我们的解放事业已久。如今我国国力已然强盛，是时候回报他们，把我们团结在一起了。"
 LEP_we_will_liberate_taiwan: "我们一定要解放台湾！"
 LEP_we_will_liberate_taiwan_desc: "将台湾拱手相让，把同胞出卖给日本帝国主义者对我国来说是莫大的悲剧。现在中国再次崛起，统一台湾是我们作为中国人的国家责任。台湾兄弟姐妹渴望着解放，我们要打碎他们身上的枷锁，让国家重归一统。"
 LEP_Former_Enemies: "旧日仇敌"
 LEP_Former_Enemies_desc: "从甲午烽烟到列强并起，日本的扩张野心一次次践踏东亚的安宁，也在中华土地上留下难以抹去的创痕。今日之中国，已非任人宰割之旧邦。既然对方仍以武力与威胁维系其霸权，我们便无从回避这一场迟来的清算。我们将直面这位旧日仇敌，争取应得的战略主动权。无论是为了雪洗国耻，还是为了打破其在东亚的压迫秩序，这场对抗都不可避免。"
 LEP_strike_german_east_asia: "突袭德属东亚"
 LEP_strike_german_east_asia_desc: "[GER.GetNameDef]是最反动的资本主义国家，它满脑子想的就是如何剥削中国人民，在北伐战争关键时刻，正是德国佬从我们的背后捅刀，断绝了我们拯救国家的希望，只要他们的帝国主义政权还存于亚洲，这里的百姓就永无宁日！解放亚洲人民，我辈义不容辞。"
 LEP_secure_the_southern_seas: "保卫南海"
 LEP_secure_the_southern_seas_desc: "南中国海及其周边长久以来都属于中国的海上势力范围，正是在中国的影响之下，南海周边诞生了许多繁荣昌盛的国家。只要[AST.GetNameDef]这个反动国家依然存在，那么南海就没有和平可言，海洋资源也无法为中国及其盟友所拥有。我们必须主动出击，捍卫海洋的安全。"
 LEP_ensure_pacific_security: "保障太平洋安全"
 LEP_ensure_pacific_security_desc: "民主思潮在夏威夷岛的华人社区中拥有显著的影响力，甚至南京政府中的一部分成员就出身于此。夏威夷王国为美国所强行吞并时，他们也亲眼目睹了帝国主义的野蛮行径。中国必须保卫太平洋，让这里免受美国、日本乃至所有企图掌控大洋的帝国主义国家阴谋行径的破坏。我们就是这片大洋的守护者。"
 LEP_recruit_beiyang_admiralty: "召回北洋海军将领"
 LEP_recruit_beiyang_admiralty_desc: "中国终于统一在了一面旗帜下，也是时候再次复兴重建民国海军，通过经验丰富的前北洋海军将领的帮助，以切实保障中国在海上的诸多利益。如今，国家百废待兴，重振华夏海上荣光的重担落在了我们肩上，我们将再次主导亚洲海洋，洗刷鸦片战争以来的耻辱。"
 LEP_refurbish_chinese_dockyards: "修缮船坞"
 LEP_refurbish_chinese_dockyards_desc: "虽然中国造船业在民用经济领域游刃有余，但在军工领域我们与列强造船业仍存在显著的技术差距。通过合理运用投资和人力，我们完全可以为未来的中国舰队打造全新的船坞。"
 LEP_CNAF_regroup: "整合全国空军"
 LEP_CNAF_regroup_desc: "作为全国唯一合法的武装力量，我们需要建立一支大规模并具有绝对专业性的空军，作为技术兵种，我们需要大量有经验的空军官兵，好在华夏大地永不缺少有志之士，并且各个军阀也在割据期间培养了一部分人才，是时候让他们为新中国的空军服务了。"
 LEP_CNAF_regroup_desc_tt: "我们将会召回曾服役于各个军阀的§C空军人员§!"

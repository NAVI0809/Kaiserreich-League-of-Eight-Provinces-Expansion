 league_mid.24.t: "战场上见"


 league_mid.25.t: "戎装总统"
 league_mid.25.d: "战火已然燎原，民众心中的焦虑与不安日甚一日，共和政府必须迅速行动，以稳固举国上下的抗战士气。为彰显抗战到底的决心，黄郛毅然脱下西装，重新换上了尘封多年的军装。\n\n黄郛的军事生涯最早可追溯至1905年，彼时他远赴东瀛，入读东京振武学堂研习军事；辛亥革命浪潮席卷而来时，他投奔沪军都督陈其美，出任沪军第二师参谋长兼副师长，亲身参与过改天换地的武装革命。革命功成后，他便卸甲从政，将精力转向国家治理与制度构建，从此再未涉足军旅事务。如今国难当头，他愿以这身军装，向浴血奋战的前线将士传递最坚定的支持。"
 league_mid.25.a: "向统帅致敬！"
 league_mid.26.t: "戎装总统"
 league_mid.26.d: "战火已然席卷国土，民众心中的忧虑与惶恐与日俱增，共和政府亟需以雷霆之势凝聚人心，坚定举国上下对胜利的信念。为昭示抗战到底的决心，年逾六旬的褚辅成，这位昔日叱咤浙省的反清义士，毅然披挂上久违的军装，以一身戎装彰显老当益壮的家国情怀。\n\n褚辅成的军事印记最早镌刻在清末反清起义的烽火里：曾密会秋瑾共商光复大计，曾秘运二百支手枪驰援杭州起义，曾坐镇嘉兴策动地方民军响应武昌首义，是浙江光复不可或缺的核心组织者。辛亥革命后，他虽转向宪政与地方自治事业，却从未忘却守土卫国的初心。如今国难当头，他虽已不复当年奔走呼号、运筹帷幄的矫健，再难亲临前线冲锋陷阵，却以这身军装践行着那句铿锵誓言——“如果战端一开，那就是地无分南北，人无分老幼，无论何人，皆有守土抗战之责任，皆抱定牺牲一切之决心”。"
 league_mid.26.a: "廉颇老矣，尚能饭否？"
 league_mid.27.t: "戎装总统"
 league_mid.27.d: "烽烟已然弥漫华夏大地，民众心底的焦灼与不安一日更甚一日，共和政府迫切需要以果敢之举凝聚举国人心，筑牢全民对最终胜利的坚定信念。\n\n尽管从未有过一丝一毫的军事履历，荣宗敬还是毅然换上了一身与他商人惯有的富态身材不甚相称的民军制服，以此彰显工商界与共和政府一道，对前线将士的全力支持。在往昔的和平岁月里，他将全部心血倾注于实业，工商界的商战博弈，曾一度取代了战场上的刀兵相向；数十年深耕民族面粉与棉纺产业的历程，更让他胸中激荡起浓烈赤诚的家国情怀。如今战端既开，烽火燃遍山河，这位“面粉大王”决意以这身戎装证明：纵横商场的实业领袖，亦能成为扛起护国重任的国家栋梁。"
 league_mid.27.a: "以商养军、以军护商"
 league_mid.28.t: "辛亥未竟之事"
 league_mid.28.d: "北京城头的旗帜在寒风中猎猎作响。南京临时民主政府的军队已经进入紫禁城外的广场，旧日象征帝国与军阀权威的城门，如今第一次向一个自称“民国”的政权敞开。电报自各省飞向首都，字里行间充满谨慎的乐观——历史，似乎终于走到了一个迟到的节点。\n\n回溯二十余年前，辛亥革命同样以南京为起点。那时，革命军高举共和之名，多路北伐，誓言扫清旧秩序。然而现实远比口号残酷。南北力量悬殊，列强态度暧昧，革命党人不得不在妥协中接受和议，用不完整的胜利来换取脆弱的和平。民国得以建立，却从未真正踏入北京，民主的旗帜始终停留在长江以南。而数年后爱新觉罗家族拙劣的复辟闹剧更是证明了这一点。\n\n而今日，历史的空白终于被填补。北京被占领，象征意义远胜于军事成果。它意味着民国第一次以胜利者的身份，站在旧帝国的中心。然而，胜利的喜悦并未持续太久。进入北方的军队组织混乱，编制、军饷与指挥体系各不相同；多年战争耗尽了国民经济，铁路破败、工厂停转、财政账目难以为继；更令人不安的是，这片广袤的土地上，文盲依旧占据多数，民国的语言尚未真正被理解。\n\n北京的陷落不仅仅是终点，更是一道沉重的起跑线。辛亥未竟之事，是要在满目疮痍之上，重建一个能被人民理解、也能自我维系的国家。历史终于给了南京第二次机会，而这一次，没有机会可以退让。"
 league_mid.28.a: "民国不能止步于此"
 league_mid.29.t: "风衣与白袍"
 league_mid.29.d: "南京民主政府成立后的数月里，首都忙于整编军政机构，恢复社会秩序，上海报界忽然热闹起来。一种名为“三K党”的新式政治结社频频见诸报端，其名号怪异，仪式森严，成员在传单与照片中身披白袍、蒙面示人，仅露双眼。英文报纸率先披露其存在，旋即华文报章争相转载，舆论在猎奇与不安之间迅速发酵。\n\n据称，该组织仿效美洲某秘密社团而设，内部等级分明，自称“最高克兰”“大狮”“大龙”，并以五色盾牌为徽。其公开宣言辞藻激烈，痛斥官僚腐败，鼓吹国货振兴、普及教育与“同胞互助”，并暗示将以组织之力，对抗外国势力在华的“无理要求”。这一切，使其在部分洋行职员与银行界华人中悄然传播。\n\n然而，随着更多细节曝光，疑云亦随之而来。坊间流传该党以“公益募捐”为名向商人索财，行径近乎勒索；其总部租用洋房、文件多用英文书写，更引发是否受外力操纵的猜测。6月下旬，淞沪警厅突击查封其据点，缴获党纲、徽章与未刊稿件，数名成员被拘捕，事件遂从舆论奇谈骤然转为治安问题。\n\n数日后，警方正式宣布该组织为非法秘密结社，责令各地一体取缔。风衣与白袍很快消失在街头，只留下报纸上的争论仍在回荡：这究竟是一场拙劣的政治模仿，还是某种更深层不安的预兆？在动荡的年代里，没有人能给出确定的答案。"
 league_mid.29.a: "他们要干什么？"
 league_mid.30.t: "各部门成立"
 league_mid.30.d: "随着南京民主政府宣告成立，各省代表与临时议员被紧急召集至首都。尽管北方局势尚未尘埃落定，直系残余势力仍盘踞华北，但会议中逐渐形成共识：若等待全国完全统一再行建制，新政权将始终停留在军事联盟的层面，而非真正意义上的国家。\n\n因此，议员们决定优先恢复中央官僚体系，使政府具备完整的行政外形与实际运作能力。会议明确提出，以辛亥革命时期南京临时政府的部院设置为蓝本，作为民主政府的过渡性中央架构。\n\n陆军部，组织机构设二处七局，即秘书处、副官处、军衡局、军务局、军械局、军需局、军学局、军医局、军法局。陆军部的直属单位有陆军军官学校（1月16日开办）、陆军人伍生队（筹办）、军需学校（筹办）、卫生材料厂、宪兵营等。另下辖各地兵站，陆军各部队。\n海军部，组织机构设二处六局，即船政局、军政局、教务局、经理局、司法局、舰政局军机处及上海要港司令一处。\n外交部，组织机构设一处四司，即秘书处、外政司、商务司、编译司、庶务司。\n内务部，组织机构设一厅四局，即承政厅、民治局、警察局、经理局、土木局。\n财政部，组织机构设一厅五司，即承政厅、会计司、库务司、钱法司、赋税司、公债司。\n司法部，组织机构设一厅二司，即承政厅、法务司、狱务司。\n实业部，组织机构设一处四司，即秘书处、农政司、工政司、商政司、矿政司。\n交通部，组织机构设一厅四司，即承政厅、邮政司、航政司、路政司、电政司。\n教育部，组织机构设一处三司，即设普通教育司、专门教育司、社会教育司。"
 league_mid.30.a: "“通过！”"
 league_mid.31.t: "总理问题"
 league_mid.31.d: "围绕国家政体的设计，临时国会近日再次爆发激烈争论。随着政务逐渐繁杂，部分议员认为现行行政架构难以应对各部协调问题，主张增设“总理”一职，由议会多数推举，统摄各部并对国会负责。他们指出，责任内阁制能够让行政权受制于民意，使政局在党派轮替中保持弹性，而非完全系于个人声望。更有人援引欧洲议会政治的经验，认为这将使政府更具现代宪政色彩。\n\n然而反对声同样高涨。另一派议员强调，国家尚处多方角力之中，若仿效欧洲实行总理制，恐致内阁更迭频繁，行政效率下降。他们主张效仿美国，以总统为行政中枢，避免权力分散带来的混乱，并警告“多头政治”可能成为地方势力掣肘中央的契机。\n\n辩论持续至深夜，议场内掌声与嘘声交织。总理之位究竟是宪政的保障，还是权力分裂的开端，已成为考验新制度走向的重要议题。"
 league_mid.31.a: "设立总理"
 league_mid.31.b: "总统制更适合我们"
 league_mid.32.t: "参议院的第一次质询"
 league_mid.32.d: "南京民主政府成立不久，临时参议院便开始尝试行使其在组织大纲中所赋予的权力。在一次并不喧闹、却格外严肃的会议上，多名参议员联合提出质询案，要求政府就近期的财政措施作出解释。\n\n由于税源尚未恢复，各部院只能以权宜之计维持运转。财政部与陆军部先后发行军用钞票，面值分为一元、五元两种，票面横书“中华民国南京军用钞票”，背面钤有财政部朱印，并注明限期兑换银元，只认票不认人。与此同时，陆军部亦发行军事用票，票面绘有铁血十八星与五色共和旗，盖陆军部长印章，准许完纳租税，并规定由国家银行限期兑换。\n\n这一做法并非南京独有。福建、江西、等地亦各自印行军用钞票或银两票。浙江军用票数额更由数十万扩充至数百万。短期内，这些票据确实缓解了军费赤字，使军政机构得以勉强运转。\n\n然而，问题也迅速浮出水面。各省票样不一、期限各异，信用互不承认，市面折价流通，物价随之波动。更令参议院不安的是，多数借款与发行决定并未提交议会审议，已触及临时政府组织大纲所规定的财政权限边界。\n\n参议员们指出，此举虽出于战时急需，却明显绕过了议会监督程序，已触及临时政府组织大纲所划定的权限边界。若放任先例成立，财政将不再受民意机关制衡，而国家信用亦将随之受损。\n\n临时政府随后向参议院递交答复咨文，然而措辞含混，仅以“权宜之计”“情势所迫”加以概括，未能正面回应军用钞票的发行依据与法律地位。这一答复引发了更强烈的不满，参议院随即通过再质询案，要求政府明确说明借款手续、发行权限及未来处理方案。"
 league_mid.32.a: "将军用钞票的发行权收归中央银行"
 league_mid.32.b: "让地方自行筹措军费"
 league_mid.32.c: "废除军用钞票，改用法定货币结算"
 league_mid.33.t: "女界之声"
 league_mid.33.d: "南京民主政府成立未久，城中政局虽仍动荡，各类社会团体却已纷纷行动。近日，由多名女界人士联名递交的《女子参政权请愿书》被正式送入参议院，这是新政府受理的最早一批社会请愿之一。请愿书中援引“世界潮流日趋平等”之论，认为女子参政只是迟早之事，既然共和国以民权为立国之本，便不应将半数国民排除在政治之外。\n\n议员们在审议时意见纷纭。有人回顾辛亥革命中女子组织军医队、侦探团与募捐团体的往事，称其“血诚奋涌，未让须眉”，主张应给予明确回应；也有人担心时局未稳，贸然改革恐引发保守势力反弹。争论之际，一位熟悉的名字被反复提起——唐群英。这位曾在革命时期奔走各地、倡导妇女教育与参政权的女界领袖，再度成为舆论焦点。她公开发表文章，质问共和国既称“民国”，为何仍让女子无缘民权，并呼吁参议院至少承认女子拥有请愿与参与公共事务的正当性。\n\n参议院最终决定将该案列为正式议题，交由法制委员会进一步研究。部分议员主张暂缓决议，待未来全国议会成立后再行定案；亦有少数人认为，应借此机会树立新政权与旧时代决裂的象征。无论结果如何，女界的声音已首次以制度化方式进入国家政治舞台，而唐群英等人的行动，也让南京的街谈巷议多了一分新的议题——共和国的“人民”，究竟是否包括她们。"
 league_mid.33.a: "妇女应当有参加政治的权利"
 league_mid.34.t: "《报律》风波"
 league_mid.34.d: "民主政府成立后不久，内务部面对各地报纸议论纷纭、批评不断，忧心“舆论失序，动摇新政”，遂仿照旧例草拟《报律》，并以电令形式直接发布。条文要求各报登记备案，对“流言煽惑、破坏共和者”予以处罚，并允许因报道失实而提起诉讼。内务部原意在整饬新闻秩序，却未将草案提交参议院审议，一时间引发轩然大波。\n\n上海与东南各地报界迅速反应，多家报馆联合上书，指责此举“欲袭专制故智，钳制舆论”。部分地方议员亦借机发难，认为南京政府在尚未统一全国之际便试图收紧言论，只会加剧地方不满。参议院内部也出现分歧：有人主张以法制稳定秩序，也有人坚持新闻自由乃共和象征，不可轻易限制。更关键的是，这场争议暴露出中央部门与参议院之间立法权限的模糊，以及中央与地方在政治尺度上的不同期待。\n\n在舆论与议会压力下，政府不得不重新讨论《报律》的去留。南京城内的咖啡馆与报馆议论纷纷，究竟是建立统一的中央法制，还是尊重地方与社会舆论的空间，成为新政权面临的第一场制度考验。"
 league_mid.34.a: "统一法令，以中央为先"
 league_mid.34.b: "报律须经参议院审议"
 league_mid.34.c: "尊重地方舆论，自行调处"
 league_mid.35.t: "新教育之方向"
 league_mid.35.d: "教育被普遍视为共和国能否真正站稳脚跟的根基。二月间，教育总长蔡元培发表《对于新教育之意见》，系统阐述未来国家教育的基本方针，引起政界与学界的广泛讨论。他提出以军国民、实利主义、公民道德、世界观与美感教育并重，作为培养“共和国民”的道路，明确否定前清所奉行的“忠君”“尊孔”教育宗旨。\n\n蔡元培直言，“忠君”与共和政体相悖，“尊孔”则妨碍信教与思想自由。在他看来，新时代的教育不应再服务于君主与单一伦理，而应塑造具备公共意识、科学精神与审美能力的现代公民。尤其是世界观教育与美感教育，被寄望于打破延续数千年的思想藩篱，使个人得以在国家之外，拥有独立的精神空间。\n\n然而，这一主张并非没有争议。部分议员与地方士绅忧心，若全面否定传统经学与伦理，恐使社会失去共同的道德基础；也有人指出，在广大文盲尚未启蒙之际，激进改革只会加剧文化断裂。教育究竟应当彻底转向西式自由主义，还是在革新的同时保留部分传统内容，成为临时政府内部难以回避的抉择。\n\n这场围绕教育宗旨的讨论，不仅关乎课堂与教材，也关乎共和国将塑造怎样的国民，以及它试图继承、又试图告别的历史。"
 league_mid.35.a: "以新教育塑造共和国民"
 league_mid.35.b: "新旧并行，渐进改革"
 league_mid.36.t: "革命之名"
 league_mid.36.d: "自南京新政权成立以来，关于孙中山的评价再度成为报章与议场中的焦点人物。有人将他视作旧时代的终结者——正是他多年的奔走与组织，使辛亥革命得以汇聚声势，推翻旧秩序，为今日的政治格局奠定基础。在许多青年议员眼中，他象征着理想主义与不屈的意志，是推动时代前行的旗帜。\n\n然而，也有不同的声音逐渐浮现。部分人士认为，二次革命期间的激进策略，使政治冲突迅速走向对立；后来与法兰西公社的合作以及对国民党的改组，更被指助长了政坛的激进思潮。一些保守派议员在讨论中直言，这种以革命为名的政治动员，削弱了制度建设，甚至带有个人意志凌驾于集体之上的色彩。他们担忧，将个人神话化，可能会让新生政权偏离理性与法治的轨道。\n\n围绕着“革命领袖”与“激进政客”的争论，在参议院的走廊与茶会之间反复上演。历史尚未尘埃落定，而对他的评价，似乎也成为各派对未来道路分歧的缩影。"
 league_mid.36.a: "他是民主事业的先驱"
 league_mid.36.b: "功过应当重新审视"
 league_mid.37.t: "地质学者李四光"
 league_mid.37.d: "在新旧交替的时代里，一批以科学立国为志业的学者逐渐走入公众视野，李四光便是其中最引人注目者之一。这位出身寒门的学人早年赴日求学，后转赴英国专研地质与采矿，以《中国之地质》等研究崭露头角。归国之后，他长期任教于北方学界，提倡以实证方法研究中国地层构造，并主张科学应直接服务国家建设，而非仅限书斋之学。\n\n近年来，李四光奔走于学术与实业之间，参与大学筹建、地质调查与西北考察事务，在知识界声望渐隆。支持者认为，在资源开发与工业规划成为国家要务的当下，地质学家的加入将有助于摆脱盲目开采与财政浪费；反对者则质疑，学者步入政务机关，是否会被复杂的派系斗争所掣肘。\n\n随着国家逐步展开资源调查与工业规划，这位以严谨著称的地质专家逐渐被视为能够连接学界与政务的关键人物，其专业意见也开始受到更多关注。"
 league_mid.37.a: "中国需要更多这样的人才"
 league_mid.38.t: "实业自救的呼声"
 league_mid.38.d: "在战乱初歇、秩序未稳的南京，各类来自社会底层与新式知识阶层的请愿书，开始频繁出现在政府案头。商人、工程师、学者与技术人员不再满足于单纯等待政令，而是试图以结社的方式，为国家的经济复苏寻找出路。有人提出以“实业救国”为纲，主张通过民间力量整合资金、技术与人才，弥补政府能力尚未及之处。\n\n以实业人士为主体的团体陆续呈请立案，其宗旨大多围绕“振兴实业、扩充生计、挽回利权”。这些团体既非单纯的商会，也不同于旧式行会，而是试图以全国性、跨行业的方式，对工业、交通与资源开发进行系统研究。政府相关部门在批复中措辞审慎，却态度积极，强调国家新生之际，尤需“国民协助，共筹进步”，并寄望这些团体能够“不分畛域，合集通才”，为未来的经济政策提供参考。\n\n与此同时，铁路与交通领域的技术人员也开始自发组织协会与共济团体。他们关注的不只是经营权与线路规划，更包括技术培训、职业保障与行业发展。交通主管机关对这些请求多表同情，认为在铁路尚未完全统一管理之前，由从业者先行研究、互助互济，有助于维持系统运转，并逐步积累建设经验。\n\n这些新兴的实业团体与专业协会，使南京城中弥漫着一种务实而急切的气氛。街头报纸频频报道新成立的协会与学会，会议室里讨论着矿业、铁路与工业规划，仿佛一场由社会自发推动的建设热潮，正在悄然展开。"
 league_mid.38.a: "支持这些团体"
 league_mid.39.t: "鼓励垦殖"
 league_mid.39.d: "战火方歇，秩序初立，南京城内的议程却很快转向了一个更为迫切、也更为沉重的问题——粮食与土地。连年动荡之下，人口流离、田亩荒芜，城市中的政治辩论尚未停歇，乡野却已隐约传来饥馑的阴影。新政府内部逐渐形成共识：若不能稳住农业，一切制度与理想都将失去根基。\n\n围绕春耕的政令迅速出台。各地官署被要求保护农民，安定流民，使其得以复归田亩。对缺乏农具、种子者，地方被授权以公私之力先行垫付，待秋收后再行清算。措辞并不华丽，却反复强调“不得以虚文塞责”，显露出对现实困局的清醒认识。\n\n与此同时，开垦荒地被视为破局之道。垦荒者可获数年不加赋税的优待，远胜旧制，意在以时间换取恢复元气的空间。实业与内务相关部门对各类垦殖公司、农业公会的呈请多持支持态度，认为这是“目前急务”，关乎生计与财政的双重修复。侨商回国投资垦荒，同样受到鼓励与保护，被视为凝聚人心、引回资本的重要象征。\n\n更具象征意义的是，一批政府要员亲自参与发起垦殖团体，以示并非空谈农政。在财政捉襟见肘的情况下，仍勉力拨款维持其运作，只求为农业恢复争取一线生机。\n\n在报章与会议之外，这些关于土地、种子与农具的决策，或许显得琐碎而缓慢，却真实地勾勒出一个新政权对“国本”的理解：不是宏大的口号，而是让田地重新有人耕作，让春耕不再被战乱耽误。"
 league_mid.39.a: "农业乃是国家之本"
 league_mid.40.t: "水乡笔记"
 league_mid.40.d: "江南水网之间，一座名为开弦弓的小村悄然走入知识界的视野。费孝通背着简陋的行囊来到这里，租屋而居，日复一日地与蚕农同食同作，在织机声、水车声与集市喧响中记录乡村的脉搏。他并不急于提出宏大的理论，而是从一家一户的收支、家庭分工与宗族往来写起，细致追踪蚕桑生产如何牵动农户命运，又如何与市镇贸易乃至更广阔的经济网络相连。在他的笔下，村庄不再是静止、封闭的背景，而是一个不断回应外部变化的社会整体。\n\n费孝通出身书香世家，早年在燕京大学与清华研究院接受系统的社会学训练，后赴英国深造，在人类学方法的影响下，逐渐形成以田野调查为核心的研究路径。学成归国后，他有意避开书斋式的论述，将目光投向最普通、也最容易被忽视的乡村社会，希望以具体经验回应中国社会何以运转、又为何困顿的问题。\n\n随着调查成果整理成册，《江村经济》在学界引发讨论。书中并未止步于风俗描写，而是通过一个江南村落，剖析小农家庭在市场压力与传统伦理之间的抉择，指出乡土社会并非与现代经济绝缘。一些人赞赏这种“自下而上”的观察，使抽象议题变得触手可及；也有人质疑，以一村观全国是否过于理想化。然而无论评价如何，这部作品都促使更多人重新思考乡村的价值与困境。田埂与河埠被写进书页，也让人意识到，理解国家的未来，或许必须先读懂这些沉默而顽强的村落。"
 league_mid.40.a: "乡村社会研究的典范"
 league_mid.41.t: "南京的提议"
 league_mid.41.d: "近日，使馆城市工部局收到一份来自南京方面的正式备忘录。文件以克制而审慎的语气指出，华东局势渐趋稳定，新的政府希望在不破坏既有国际商业秩序的前提下，与使馆城市建立一种“互利而渐进”的经济合作关系。南京方面认为，上海作为远东贸易枢纽，其金融与航运体系对区域复苏至关重要，若能引导外资向长三角腹地延伸，将有助于恢复市场信心，也能为各国商界带来新的增长空间。\n\n备忘录同时暗示，南京政府愿意就部分旧有条约条款展开“技术性磋商”，以减少对国内产业发展的掣肘，并提出成立联合经济委员会，协调关税、港务与工业投资事宜。在使馆城市内部，这一提议引发了不同反应：部分董事认为南京显然希望借助外资巩固其统治基础，是一个扩大影响力的良机；也有人担心，一旦让南京逐步介入，工部局在华东经济中的主导地位可能被削弱。\n\n无论如何，这份来自内陆新政权的建议，标志着双方关系进入一个新的阶段。使馆城市如今必须决定，是继续维持旧日的谨慎观望，还是主动提出条件，将这次接触转化为一场更具规模的投资谈判。"
 league_mid.41.a: "我们谈谈看"
 league_mid.42.t: "使馆城市的条件"
 league_mid.42.d: "上海使馆城市工部局近日派遣高级代表抵达南京，与政府展开一场备受瞩目的经济交涉。代表团在会谈中强调，长江三角洲的工业潜力与区位优势仍是远东经济的重要支点，使馆城市方面愿意动员其掌握的金融网络与商业资源，引导外资进入华东，用于港口修复、电力设施、市政工程及轻工业投资，以期恢复区域贸易活力，并稳定国际市场信心。\n\n然而，这份看似慷慨的投资意向并非毫无附带条件。工部局方面的条件主要有以下几项：\n一、南京政府应在长江三角洲地区维持相对稳定之关税政策，并对经使馆城市转口之货物给予合理减免，以确保既有国际贸易体系之连续性。\n\n二、政府需确认外国企业之合法财产与经营权，建立独立商事仲裁机制，确保合同执行与资本流动不受地方干预。\n\n三、南京方面须采取措施维持币值稳定，优先履行既有外债及公债义务，以巩固国际市场之信用基础。\n\n四、使馆城市之既有自治制度、港口管理及治安权限应予以尊重，在未达成新协议前不得单方面变更。\n\n五、双方同意将投资重点置于航运、电力、纺织与银行业等民用经济领域，并鼓励外国资本参与长三角基础设施建设。\n\n六、南京政府应维持稳定的劳资环境，避免激进政治运动对商业活动造成冲击，以确保投资安全。\n\n南京政府内部对此反应复杂。一些官员认为，在战乱与财政紧张之后，华东亟需外部资本与技术支持，若能通过谈判逐步改善不平等结构，或可将使馆城市纳入新的经济秩序之中。另一些人则警告，这类条件可能固化旧有条约精神，使国家在经济复兴之初便背负沉重枷锁，影响未来自主政策的展开。\n\n随着会谈进入关键阶段，使馆城市的提案已成为对南京政府治国方略与对外立场的考验。接受，意味着以现实利益换取发展空间；拒绝，则象征着在短期困难中坚持更为独立的道路。"
 league_mid.42.a: "接受条件，在协商中引入外资"
 league_mid.42.b: "拒绝提案，坚持自主经济主权"
 league_mid.43.t: "南直系军官的命运"
 league_mid.43.d: "齐燮元虽已身亡，但他麾下的南直隶军官团仍被拘押于南京与镇江军营之中。八省内战与浙军政变接连而至，使原有建制支离破碎，许多部队名存实亡。若要在短时间内整编军伍、恢复防务，这批久经战阵、熟悉北方地形与战法的军官，显然是一笔难以忽视的力量。\n\n只是，他们的履历同样沉重。多年来，他们效命于联帅体系，在旧式军政结构中成长，思维与作风未必能迅速适应新的政治秩序。有人认为，只要在誓词与制度之下重新编入序列，经验自可为我所用；也有人担忧，旧有的关系网络与观念残留，或将在关键时刻成为隐患。\n\n如何处理这批军官，已不仅是人事安排，更关乎新政府对军队未来形态的设想。是以现实所需为先，借助现成力量稳定局面；还是在筛选与甄别中逐步吸纳，以求稳妥；抑或宁可承受整编迟缓之苦，也要重塑一支与旧时代彻底切割的军队？"
 league_mid.43.a: "让他们为新政府效忠"
 league_mid.43.b: "处决那些罪大恶极的，其余人留下"
 league_mid.43.c: "我们必须保持军队的纯洁性"
 league_mid.44.t: "[GetYear]年自治学院毕业仪式"
 league_mid.44.d: "在政局稍定之后，南京政府着手筹建“东南自治学院”，以回应各省对于地方治理与制度建设的迫切需求。这所学院并非单纯的学术机构，而是肩负着为新秩序培育行政骨干与自治人才的使命。\n\n学院延聘法政学者、财政专家与资深地方官员授课，课程涵盖地方议会运作、财政预算编制、警政管理、乡镇自治章程制定等内容，力图在理论与实践之间架起桥梁。来自江浙皖赣等地的青年士绅、退役军官与新式学校毕业生纷纷报考，希望在动荡年代中寻得一条以制度重建国家的道路。\n\n首批学员毕业之日，南京举行简朴而庄重的结业仪式。褚辅成在致辞中强调，自治并非放任自流，而是在统一国家框架下，由地方承担起应有之责。唯有培养熟悉法理、明晓民情的治理者，自治方能避免流于空谈。\n\n随着一批批学员被派往各县各市，新的章程与议事规则开始在基层推行。或许他们的力量尚且微小，但若星火得以延续，地方自治的理念终将从讲堂走向乡里，为东南的长治久安奠定根基。"
 league_mid.44.a: "自治理念茁壮成长"
 league_mid.45.t: "对传统文化的保护"
 league_mid.45.d: "战火甫息，百业待兴。南京政府在整顿军政与财政之余，亦将目光投向更为深远之处——文化与精神的重建。多年军阀混战与思潮纷争，使社会价值动荡不安，传统礼俗或被弃如敝履，或被僵化守旧者挟以自固。若无一场自觉而审慎的文化复兴，国家纵有制度之形，亦难有精神之魂。\n\n于是，政府倡议发起“文化复兴运动”，主张对旧有文化加以整理、保护与再阐释。地方文庙、书院与古籍馆藏得以修缮，流散民间的典籍被征集校勘；戏曲、书画与传统工艺获得资助，以免在市井喧嚣中湮没。然而，复兴并不意味着复古。对于束缚个体、妨碍社会进步的陋习与陈规，政府亦鼓励学界公开讨论，以理性之光加以辨析。\n\n报章刊物相继开辟专栏，邀请学者论述“传统与现代”之关系；各地学校亦将乡土史与国学课程纳入新式教育体系，使青年在接触科学与法政之学时，亦能理解自身文化的脉络。\n\n这场运动既非对往昔的全盘否定，也非盲目的歌颂，而是在时代激流之中寻找一条承前启后的道路。南京所期望的，不是一座博物馆式的国家，而是一个能够在记忆与变革之间取得平衡的共同体。"
 league_mid.45.a: "承前启后"
 league_mid.46.t: "我不犯人"
 league_mid.46.d: "北方威权政府重整旗鼓，兵锋所向，局势骤然紧绷。南京城内，关于是否北伐问罪的争论日趋激烈。然而，在连年战火之后，和平自治派终于占得上风。他们指出，武力或可一时制胜，却难以奠定长久之基；若东南再陷兵燹，不过重蹈军阀混战之覆辙。\n\n于是，政府联合江浙商团、同乡会与各界团体，于沪宁之间发起“东南和平宣言”。宣言称，真正的安定之道，在于发扬主权在民之精神，使各省政权归于其民，而非由枪炮强加。长江两岸应为百姓谋安宁，而非为权力争逐添薪。南京方面更电请北方当局克制兵锋，避免战事蔓延，并主张各地军队各守本境，以地方自治为缓冲，使民众得以休养生息。\n\n这一立场并非示弱。宣言同时郑重声明：南京无意主动挑战中央权威，但东南之自治权利，乃人民所托，绝不容以武力剥夺。若北方以兵压境，南京亦将号召各省军民共守桑梓。\n\n和平或许被讥为理想之谈，然在烽烟未散的年代，它仍是一种需要勇气的选择。南京所期望的，是一种能在统一与自治之间取得平衡的未来。"
 league_mid.46.a: "看来今年不会打仗了"
 league_mid.47.t: "厉兵秣马"
 league_mid.47.d: "北方政府的电令与通牒日益强硬，言辞之间尽是轻蔑与逼迫。接连不断的边境摩擦与政治施压，使南京城中的耐心逐渐耗尽。原本主张克制与观望的声音被现实所冲淡，政学系所代表的主战立场终于取得上风。他们断言，若一味退让，只会助长对方气焰，使自治成果毁于一旦。\n\n议事厅内，有人重提往昔。1912年，南京临时政府初立，南方义军北指，终使清廷退位，旧朝覆灭。那一役，不仅改写了王朝命运，更昭示共和理想可以以决心与行动兑现。今日情势虽异，其理却同：当独裁势力盘踞北方、拒绝承认民意之权，南方若欲自保，唯有以实力回应。\n\n褚辅成在最终决议中指出，此番出兵并非为扩张疆土，而是为捍卫宪政与自治之原则。若北方执意以威权凌驾全国，则南京有责任承担起历史使命。\n\n动员令随即下达，军旗在江岸列阵。南京再一次将目光投向北方。昔年推翻帝制的决心，今日化为北伐的誓言——面对新的独裁者，我们同样不会退缩。"
 league_mid.47.a: "解放全中国！"
 league_mid.48.t: "首都革命的回忆（一）"
 league_mid.48.d: "夜色沉沉，案牍如山。黄郛独坐灯下批阅公文，忽有片刻失神。纸页翻动之间，往事浮现——那是数年前的“首都革命”，风云激荡、局势诡谲之时。\n\n彼时冯玉祥回师北苑，京城政局骤变。旧阁僚纷纷去职，权力真空骤然显现，维持秩序者寥寥无几。颜惠庆坚辞摄政之责，李鼎新亦不愿独担大局，内阁之中，只余黄郛挺身而出。十月末，他以代国务总理之身摄行总统职权，在群龙无首之际勉力维系中央运转。\n\n摄政内阁甫一成立，便面对一桩象征意味极重的难题——清室优待条例之修改。溥仪虽已逊位，却仍居于紫禁城内，帝号未废，旧制未除，封建余绪潜伏暗涌。黄郛深知，此非单纯礼遇问题，而关乎共和名义与国家主权之所在。于是，在冯玉祥动议之下，他主持内阁会议，通过修正条例，移废帝出宫。为免激化北方旧势力，他在通电中谨慎措辞，强调“按照原优待条件第三条”执行，以示依法而行，而非苛刻相逼。\n\n即便如此，段祺瑞、张作霖等人仍强烈反弹，旧势力暗流涌动。黄郛却未退让半步。帝号永废之日，北京悬挂国旗，象征一个时代真正落幕。\n\n思绪至此，他缓缓放下手中笔墨。首都革命所带来的，不只是政治变动，更是一场对旧秩序的决断。如今南京再起新政，往昔经验是否足以应对新的风云？他明白，那场革命的后续波澜，远未写尽……"
 league_mid.48.a: "然后呢？"
 league_mid.49.t: "首都革命的回忆（二）"
 league_mid.49.d: "记忆并未止息。灯影摇曳之间，黄郛又想起摄政内阁时期另一段更为艰难的尝试。若说移废帝出宫是象征性的决断，那么整顿社会风气，则是他真正寄以厚望之举。\n\n当时，他与同僚拟定禁烟与正俗两道命令。鸦片流毒，外损国信，内戗民生，若不严加禁绝，共和之名不过空壳；而官场风气日益浇漓，赌博、狎游、营私舞弊屡见不鲜，若不自上而下整饬清操，何谈刷新政治？他在文稿中反复推敲措辞，既望振聋发聩，又求合乎法理。然而命令未及发布，旧势力已群起非议，有人斥为多此一举，更有人怒不可遏。迫于现实压力，法令终究搁置。\n\n他明知，仅凭一纸公文难以扭转积弊，但那一刻，他仍坚信“书生报国”，不止于纸上谈兵。多年后，他曾自豪地言及此事：上马可杀贼，下马能草露布，二者皆尝亲历。首都革命在他心中，不只是权力更迭，而是试图在腐化反动与过激极端之外，寻求一条清新而理性的第三条道路。\n\n然而时局翻覆，摄阁旋即辞职，理想功败垂成。\n\n思绪至此，黄郛轻叹一声，将记忆收回现实。窗外南京夜色未明，案上公文仍待批阅。往昔未竟之志，或许只能在此刻的工作中，继续缓缓书写。"
 league_mid.49.a: "还有很多活要干呢"
 league_mid.50.t: "厉麟似和景星学会"
 league_mid.50.d: "一封由厉麟似署名的来函送至政务厅。来函所提，乃新近成立之“景星学社”。此社创立于南京，成员多为留德归国之学者、官员与文化人士，如蒋复璁、滕固等，素以研习德意志学术与制度著称。其宗旨，在于促进中德之间的文化与经济交流，并以较为平等的姿态，重塑两国关系。\n\n在厉麟似看来，中国不应只是德国企业的市场，更应是能与之对话的现代国家。景星学社近年来频频接待来华的德国专家与代表，虽时有遭他方排挤，却仍努力在学术、科技与工业规划等领域为中国争取发言空间。若与之合作，我方不仅可借其研究成果改进行政与工业建设，更能借其人脉，在欧洲舆论与政界中传播南京政府的立场，为修复对德关系铺路。\n\n然而，质疑之声亦随之而起。有人担忧，学社成员多与德国关系密切，其背后是否潜藏他国利益？在国际局势风云变幻之际，与之过从甚密，是否会使南京陷入不必要的外交牵连？\n\n合作与否，既是学术选择，也是外交姿态。景星之名，寓意星辰高悬，但它所照亮的道路，究竟通向自主之桥，抑或依附之影，仍需审慎权衡。"
 league_mid.50.a: "我们需要他们的人脉"
 league_mid.50.b: "他们不都是德国间谍吗？"
 league_mid.51.t: "新军服，新军队"
 league_mid.51.d: "政权既立，军心亦需更新。旧南直系遗留下来的各式军装，颜色不一、式样混杂，有的仍沿用北洋旧制，有的仿自地方裁缝，难以体现新政府之权威与气象。若军队仍披旧衣，又何以昭示与往日体制之决裂？于是，整顿军容之议被提上日程。\n\n军政部门最终决定，参照民国元年南京临时政府所颁《军士服制令》，重新制定陆军服装样式。彼时军服虽存续不久，却象征共和初创之精神，亦承载南京之政治记忆。新式军服整体以黄色为主，立领七明扣，式样简洁，辅以四内挖暗袋（兵士仅设上两袋），既利实用，亦显整肃。将校领章采锹形制，依兵种区分颜色，将官以金色示阶，隐含权责分明之意。\n\n军官大檐帽沿饰以红色灯草线，帽墙缀金色装饰带，将官为宽横道，其余军官为窄横道；兵士则不加繁饰，以示等级区分。帽徽仍用金色铜制十八星，象征共和与合众。袖口与裤侧细嵌红边，虽略带东洋风格，却已成为近代军制转型的印记。\n\n当第一批将领身着新装列队而立时，人们所见的不仅是衣冠之更替，更是对旧时代的告别。军服既新，军魂亦当随之而新。"
 league_mid.51.a: "与旧时代决裂"
 league_mid.52.t: "自治军的新血液"
 league_mid.52.d: "军制既经整饬，教育与晋升之途亦渐趋完备。过去战事频仍，军官多凭资历与旧部关系升迁，虽有经验，却难免掣肘。如今参谋制度与军校课程逐步规范，考核与履历并重，一套较为清晰的选拔机制正在成形。军队不再仅以出身论高下，而以能力与操守为准绳。\n\n在新一轮考评与演训之中，一批年轻军官脱颖而出。他们或毕业于新式军校，或在战地见习中表现沉稳果决，虽年资尚浅，却熟悉现代战术与参谋流程。比之旧日军官，他们更重纪律与协同，亦更愿服从统一指挥。有人称其“书生气未脱”，亦有人看见其身上所蕴藏的锐气与远志。\n\n政府决定破格提拔其中数人，委以营团指挥或参谋要职，以示对新制的信任。此举既是对个人才干的肯定，亦是向全军宣示：未来的晋升之路，将由制度与功绩铺就，而非裙带与资历。\n\n当这些年轻军官走上新的岗位时，军队的面貌或许正在悄然改变。旧时代的影子尚未完全散去，但属于新军的新篇章，已然翻开。"
 league_mid.52.a: "未来的战场上真正决定胜负的，是谁的信念更坚"
 league_mid.53.t: "残破的红旗"
 league_mid.53.d: "1927年冬末，由中国国民党所发动的国民大革命已走到了失败的边缘。北伐军在战场上接连受挫，总司令蒋介石遇刺身亡，昔日声势浩大的国民革命军迅速瓦解。残部之中，李济深将军说服部分将士继续斗争，转而在南方展开对直系军阀及其背后势力的持久抵抗。宋庆龄随后加入其中，而邓演达亦不久后抵达前线，使这一支队伍逐渐形成新的核心。\n\n1932年上海起义失败后，这些革命者被迫撤往赣东南与闽西北的山林之间。在偏远闭塞的乡村中，他们依托地方社会建立起一套隐秘而复杂的组织网络，并训练农民参与武装斗争，宣扬一个没有阶级压迫与枷锁的“自由中国”。与此同时，流亡海外的国民党左派亦在欧洲筹组机构，试图为未来的反攻积蓄力量。\n\n如今，随着孙传芳与齐燮元接连遇刺，华东局势再度动荡。宁系军阀权威崩解，各地政令不一，而闽赣山区的游击队则趁机频繁袭扰交通与补给线，成为地方当局的心腹之患。然而，亦有政府内部人士指出，这些人曾与我们一同反对军阀统治，其所追求的共和国理想亦未必全然相悖。或许，与其继续无休止的清剿，不如尝试与其接触，将其引入新生的政治秩序之中。"
 league_mid.53.a: "与他们展开谈判"
 league_mid.53.b: "绝不可与叛乱者妥协"
 league_mid.54.t: "临委会加入南京政府"
 league_mid.54.d: "经过数轮紧张而隐秘的接触，南京政府与闽赣山区的国民党临时行动委员会之间的谈判终于取得突破。长期以来，这支由流亡革命者与地方武装构成的力量始终拒绝承认任何军阀政权的合法性，而南京方面亦对其游击活动深感不安。然而，在反复磋商与多方斡旋之下，双方逐渐在“反对军阀统治”与“建立共和国”的共同目标上找到了有限的共识。\n\n不久前，宋庆龄公开发表声明，宣布临委会将停止一切针对南京政府的武装行动，并以合法政治力量的身份参与新国家的建设。她在宣言中强调，革命的目的从来不是无止境的斗争，而是为中国人民争取一个真正自由、平等的共和国。若南京政府能够兑现其关于宪政与民权的承诺，那么昔日的对立也应当让位于民族的共同未来。\n\n随着协议达成，各地游击队也开始陆续整编。一部分武装被就地遣散，回归乡里；另一部分则在甄别后编入新成立的国民自治军，接受统一指挥。这一举措既缓解了地方治安压力，也为新政权注入了一批具有革命经验的干部。然而，双方之间的互信依旧脆弱，这场来之不易的合作究竟能维持多久，仍有待时间检验。"
 league_mid.54.a: "我们将在一面旗帜下团结"
 league_mid_54_ANQ_sun_liren_tt: "§L由于我们的§!§2民主§!§O共和§!§t立场§!§L，孙立人将返回国民自治军。§!"
 league_mid.55.t: "再无妥协"
 league_mid.55.d: "南京政府与闽赣山区国民党临时行动委员会之间的接触最终以失败告终。尽管双方在初期都表现出一定程度的克制与试探，但随着谈判深入，围绕政治体制、军队归属与地方权力等关键问题的分歧迅速显现。南京方面坚持要求对方解除武装并完全服从中央，而临委会则拒绝放弃其独立组织与革命纲领，双方立场始终难以调和。\n\n不久之后，宋庆龄发表声明，谴责南京政府不过是“以宪政之名行精英统治之实”，并重申临委会将继续致力于推翻一切背离人民利益的政权。邓演达亦在内部会议中呼吁加强游击斗争，利用当前华东局势动荡之机扩大根据地的影响。随着谈判破裂，原本短暂缓和的局势迅速恶化。\n\n闽赣地区的武装冲突再度升级，游击队对交通线与补给据点的袭扰愈发频繁，而南京方面也开始重新调集兵力，准备展开更大规模的清剿行动。对于一个尚在重建秩序的新政府而言，这场未竟的内战无疑将成为沉重的负担。而曾被寄予厚望的“政治解决”，如今看来不过是昙花一现。"
 league_mid.55.a: "看来只能兵戎相见了"
 league_mid.56.t: "大梦终醒"
 league_mid.56.d: "在数月持续不断的军事行动之后，南京政府终于对盘踞于闽赣山区的国民党临时行动委员会武装发动了决定性打击。依托新近整编的部队与逐步恢复的后勤体系，政府军沿交通要道稳步推进，逐步压缩游击队的活动空间。曾经为这些革命者提供掩护的山林与村落，在严密封锁与清剿之下也不再安全。\n\n随着主要据点相继失守，临委会的组织网络迅速瓦解。部分武装在突围中被歼灭，亦有不少成员选择放下武器，向地方当局投降。宋庆龄与邓演达的具体去向尚不明朗，有传言称其已秘密撤离，也有人认为他们仍潜伏于某处等待时机，据目击者称邓演达右眼中弹，后生死不明。然而可以肯定的是，这一曾被视作南方革命火种的力量，已不再具备对抗中央的能力。\n\n南京方面随即宣布，闽赣地区已基本恢复秩序，并将着手重建地方行政与经济体系。尽管如此，长期战乱留下的创伤仍未愈合，而对于许多曾经参与或同情这场运动的人而言，这场失败或许并不意味着终结。对于新生的共和国来说，如何在胜利之后弥合裂痕，或许将比赢得战争本身更加艰难。"
 league_mid.56.a: "内患暂平"
 league_mid.57.t: "匪患肃清"
 league_mid.57.d: "在数月的持续行动之后，南京政府针对华东乡间匪患的清剿终于取得了决定性的成果。依托整编后的地方武装与新设立的治安体系，政府军对各地土匪据点展开了有组织的围剿，并逐步恢复了对交通要道与乡村地区的控制。曾经横行一时的匪帮，在连续打击之下或被歼灭，或四散逃亡，再难形成规模。\n\n与此同时，政府并未仅仅依赖武力手段。在部分地区，当局推行了招抚与安置政策，允许愿意放下武器者回归社会，并尝试通过恢复基层行政与经济秩序来削弱土匪滋生的土壤。这种“剿抚并用”的策略，在一定程度上缓解了地方紧张局势，也为重建工作争取了时间。\n\n随着匪患逐渐平息，华东地区的商路与乡村生产开始恢复往日生机。对于刚刚经历混战的新政权而言，这不仅是一次治安上的胜利，更象征着国家权威的重新确立。然而，战乱留下的贫困与不安仍未彻底消散，若无法从根本上改善民生，昔日的匪患或许仍有卷土重来的可能。"
 league_mid.57.a: "秩序正在恢复"
 league_mid.58.t: "人民的西湖"
 league_mid.58.d: "南京民主政府建立后，杭州很快恢复了基本秩序。圣塘路临湖一带的别墅被接管，新任城市领导人迁入其间。自窗内远望，西湖水面游船穿梭，湖畔隐约传来乐声，与往日相比并无明显差别。\n\n变化出现在湖上的人群之中。过去多为外商、士绅与富户消遣之地，如今码头与堤岸挤满了成群结队的工人与家属。清晨起便有人聚集在租船处，携带简单行李与干粮，登船后在湖上逗留整日。部分船只甚至被整日包下，往返于湖心与各处景点之间。\n\n市劳动部门随后递交了一份报告。报告称，自政府开始发放救济金以来，不少失业工人在领取款项后，第一时间前往湖滨租船，多数人在数日内将所得花费殆尽。报告特别提到，相关人员在此期间极少购置粮食或其他生活必需品，也未见有偿还债务的记录。\n\n报告还附有数起具体案例：某些家庭在领取救济金当日即前往西湖游船，连续数日未归；亦有个别人员多次更换码头租船，以规避管理人员的登记。部分船家反映，近期整日包船的情况显著增多，收入来源较此前更为稳定。\n\n与此同时，劳动部门记录显示，一些领取过救济金的人员在资金耗尽后，很快再次前往政府机关申请新的补助，个别申请间隔不足一周。基层单位在核查过程中发现，部分申请人此前已登记在册，但仍能以不同理由重复申领。"
 league_mid.58.a: "必须加以整顿"
 league_mid.58.b: "暂且维持现状"
 league_mid.59.t: "修葺金陵"
 league_mid.59.d: "孙传芳当政时期，曾一度着手整顿南京市政。针对城内道路狭窄、名胜荒废、港道淤塞等问题，地方士绅与官署合议，拟定整修计划，提出划分风景区、住宅区、工业区与港区，并以车捐及公债为经费来源。玄武湖、清凉山、燕子矶等处被列为重点整修对象，下关一带则计划发展为商埠与运输中心。同时，还筹议将南京改为特别市，以统一管理各项市政事务。\n\n计划提出后，一度有所动作，但因经费迟滞、机构更迭及人事变动，整体推进未能持续。市政机关名存实虚，除车捐征收外，多数工程停留于原议。风景区未及整修，港道亦未疏浚，城市格局仍沿旧状。\n\n南京政府成立后，原有市政议案被重新整理。有关部门调取旧案与图册，对既定分区与工程项目逐项核对，决定沿用原有框架继续推进。车捐仍作为基本财源，同时整顿相关收入，用于道路修筑与河道清理。此前中断的玄武湖整修与城北道路拓展率先恢复，下关港区亦重新组织人力进行疏浚。\n\n随着工程逐步展开，城北道路渐成体系，住宅区开始出现连片开发；湖山一带经整修后，对外开放，游人往来渐多；港区通航条件改善，货物集散较前便利。原先分散零乱的空间安排，逐渐转为分区明确，各项功能有所区隔。\n\n至工程大体完成之时，南京城内交通较前通畅，湖山景点得以修复利用，外来游历者有所增加。沿江商贸与城市游览并行，市面较此前更为活跃。此前未竟之市政规划，由此得以延续并基本落实。"
 league_mid.59.a: "人与城的故事"
 league_mid.60.t: "南北两京：反帝投机"
 league_mid.60.d: "北方的局势最终以直系对新皖系的有限妥协而告终。面对八省内战愈演愈烈的反租界浪潮，吴佩孚并未选择继续支持齐燮元，而是转而扶持高举“收回利权”旗号的陈调元，以缓和南方日益高涨的民族主义情绪。北京方面希望借此重新稳定长江流域，同时维持直系对中央的实际控制。\n\n然而在南京看来，这种所谓“反帝爱国”不过是直系军阀为了维系统治而进行的一场政治投机。陈调元虽然打着反租界旗号，却始终无法摆脱自己作为北洋军人和直系代理人的身份。更何况，当齐燮元最终在混战中击败陈调元后，北京方面也迅速放弃了这位已经失去价值的新皖系将领。对于南京知识界而言，这更加证明了北方所谓“民族主义”不过是军阀权术的一部分。\n\n齐燮元之死与南京民主政府的建立，则彻底点燃了双方矛盾。北京的清廷与直系高层一致认定，南京政府本质上是利用刺杀与地方暴动夺权的“南方乱党”；而南京方面则反过来指责北京，认为正是直系长期操纵清廷、纵容军阀混战，才最终导致江南彻底崩溃。\n\n最初仍有人试图促成谈判。南京希望北京承认国会与地方自治制度，而吴佩孚则要求南方接受中央整编与清廷合法性。结果自然不欢而散。随着双方在津浦线沿线不断增兵，南京国会最终通过《讨逆宣言》，宣布北京已经沦为“假共和、真军阀”的北洋残余。"
 league_mid.60.a: "反租界的面具背后，是吴佩孚的狼子野心"

 league_mid.61.t: "南北两京：直系震怒"
 league_mid.61.d: "面对八省内战的混乱局势，吴佩孚最终选择继续支持齐燮元，希望由这位旧日盟友重新稳定江南局势。对于北京而言，齐燮元虽然名声不佳，却至少仍属于直系体系内部的可靠人物；而在溥仪名义下维持的北京中央政府，也必须依赖这样一批地方实力派才能继续运转。\n\n然而，齐燮元的突然遇刺彻底打乱了这一切。随着南京城内迅速爆发政变与动乱，地方自治派、商帮以及部分浙军军官联合夺权，并宣布成立南京民主政府。消息传到北京后，无论是清廷还是直系高层都震怒异常。吴佩孚公开谴责南京方面“以暗杀与暴乱颠覆国家秩序”，而不少北方报纸更直接将此次事件称作“民国以来最恶劣之政治谋杀”。\n\n南京方面则完全是另一套说法。在他们看来，齐燮元的统治本就是依靠德国资本、军警高压与买办势力维系的旧秩序，而他的死亡不过意味着八省联合这个腐朽体系终于迎来终结。南京国会中的不少议员甚至公开宣称：“真正毁灭江南的不是刺客，而是军阀。”\n\n双方最初也曾尝试互派代表接触。北京要求南京交出刺杀案相关人员，并恢复中央任命体系；而南京则坚持要求废除清廷名义、召开真正的制宪会议。很快，双方都意识到彼此根本不存在妥协空间。\n\n随着北方开始调集直系部队南下，南京政府也迅速以“护卫共和”为名展开总动员。对于北京而言，南京不过是又一个叛乱的地方政权；而对于南京来说，一个由军阀操纵、皇帝挂名的中央政府，同样不具备代表中国的资格。"
 league_mid.61.a: "必须将直系赶出华东"

 league_mid.62.t: "南北两京：帝制幽灵"
 league_mid.62.d: "北京城中的枪声，彻底终结了北洋时代最后一丝虚假的共和外衣。随着宗社党发动政变，曹锟与吴佩孚被迅速处决，溥仪则重新以“大清皇帝”身份君临北方。昔日那个依靠军阀维系、尚且披着共和名义的北京政府，如今竟重新变成了满洲贵族与遗老遗少盘踞的朝廷。紫禁城中的龙旗再次升起，北方各省也被要求恢复旧式礼制与尊卑秩序，一时间，仿佛辛亥革命后二十余年的历史都被彻底否定。\n\n这一消息在南京引发了巨大震动。无论是自治派、政学系还是工商界，都无法相信中国竟会再次出现“皇帝复辟”。国会内群情激愤，大批议员公开要求立即北伐，认为如今的北京已经不只是普通的军阀政权，而是彻头彻尾的“反共和逆流”。许多参加过辛亥革命的老议员甚至在议场中失声痛哭，他们无法接受当年流血建立的共和国，如今竟又重新回到了帝制阴影之下。\n\n然而南京政府最初仍试图保持克制。黄郛与部分政学系人士主张，应先通过外交与舆论施压，迫使北方重新承认共和制度并召开制宪会议，以避免中国再次陷入全面内战。南京方面甚至一度希望借助国际社会压力，迫使宗社党放弃复辟计划。但北方对此毫无妥协意愿。宗社党控制下的北京不仅将南京称作“南方乱党”，更公开宣称辛亥革命乃“国运之灾”，认为中国之混乱皆始于共和。\n\n双方的接触很快彻底破裂。北方开始重新启用旧清旗号与礼制，大量遗老旧臣重新进入政府，而宗社党报刊则不断鼓吹“君主立宪救国”。与此同时，南京也迅速掀起了大规模“护国讨逆”宣传。报纸每日刊登辛亥元勋旧照与武昌起义回忆文章，大学生与退伍军人纷纷组织请愿，要求“再造共和”。街头巷尾到处悬挂着“驱逐鞑虏”“誓死护国”等标语，甚至连原本对战争持谨慎态度的商界，也开始担忧一旦帝制复辟成功，地方自治与工商自由都将不复存在。"
 league_mid.62.a: "帝制和共和，迟到了二十年的决战..."

 league_mid.63.t: "南北两京：共和阋墙"
 league_mid.63.d: "宗社党的政变最终失败，北京城内持续数日的混乱与巷战几乎摧毁了北洋政府最后的权威。但就在局势濒临失控之际，吴佩孚重新控制军队与中央机关，并迅速镇压了残余的宗社党势力。为了平息全国舆论，他公开宣布废除一切君主制残余，强调中国绝不可再次走向复辟道路，并重组中央政府。无论最终由胡适还是顾维钧出任大总统，都让许多人一度相信：中国或许终于迎来了真正的共和时代。\n\n消息传到南京后，政府内部最初抱有某种谨慎乐观。黄郛等政学系人士承认，胡适与顾维钧代表着中国少有的自由主义与宪政传统。南京报刊甚至短暂出现了“南北共和合作”“结束军阀时代”的呼声，一些议员还公开提出召开全国制宪会议，希望以和平方式完成统一。\n\n然而，这种乐观很快便被现实冲淡。南京方面逐渐发现，北京所谓的“新共和政府”，其真正基础依旧是吴佩孚与北方军队。虽然总统换成了学者与外交家，但北洋军人集团仍牢牢控制着中央权力。对于南京知识界而言，这不过是“披着共和外衣的旧北洋”。而北京方面同样对南京极不信任。在他们看来，南京民主政府内部党派林立、地方主义盛行，商帮与自治势力影响巨大，这种“议会政治”只会让中国继续四分五裂。\n\n双方很快展开接触。南京提出召开真正意义上的国民大会，通过制宪方式重建中央政府；北京则坚持必须先完成全国军队整编，并要求南京接受中央统一指挥。最初，双方都试图避免立即走向战争，但随着谈判不断深入，矛盾也逐渐公开化。北京强调统一、纪律与中央权威，而南京则坚持地方自治与议会至上的原则，拒绝让中国重新回到军人主导政治的旧路。\n\n很快，最初的“共和合作”气氛迅速恶化。北方报纸开始批评南京“党争误国”，而南京媒体则讽刺北京“以共和之名延续军阀统治”。随着双方军队沿津浦线与长江北岸开始集结，人们终于意识到：中国的问题早已不仅是帝制与共和之争。"
 league_mid.63.a: "两个政府，一个中国"

 league_mid.64.t: "特别国防预算听证会"
 league_mid.64.d: "面对极有可能的日本入侵，总参谋部向国会申请一批特别国防预算，并为此举行了一次听证会。厉尔康中将向议员们做了报告，表示日军最有可能入侵的方向——华北，是一大平原，有利于日军机械化部队及大兵团活动，并距日方东北补给基地较近，形势于我不利。如全面开战，日寇极有可能推翻使馆城市当局占领上海，我方应充分利用在淞沪间已经修好的国防工事，在此投入重兵用以牵制敌人兵力，保卫首都南京。同时还可能使日军触犯列强在华利益引起可能的国际干预。一旦上海开战，应争取迅速歼灭上海日本驻军，封锁海洋。如战事不利，则可退守苏福国防线打持久战，在防御战重消耗日军有生力量，阻止日军侵略。\n\n尽管面临着预算紧张的苦难，但是面对日军登陆后直插首都的威胁，最后国会还是通过了这项预算，同时参会的爱国企业家也表示将会尽力协助国防建设。"

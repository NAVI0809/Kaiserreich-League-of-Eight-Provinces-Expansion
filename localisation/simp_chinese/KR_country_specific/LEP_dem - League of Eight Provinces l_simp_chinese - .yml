 #人物
 LEP_gu_zhun: "顾准"
 LEP_gu_zhun_leader_desc: "§Y生于：§!§L1915年7月1日；中华民国、上海§!\n§Y派系：§!§L中工盟—益友社§!\n§Y背景：§!§L顾准出生于上海一个普通商人家庭，祖籍苏州。由于父亲经营棉花生意失败，家境逐渐衰落，他自幼便体会到了城市小资产阶级与基层职员生活的不易。五岁时开始接受传统教育，后进入黄炎培创办的中华职业学校学习会计，这段经历使他接触到了职业教育、实业救国与现代社会组织思想。\n\n1927年毕业后，顾准进入潘序伦创办的立信会计事务所，从一名练习生开始学习现代会计制度。凭借惊人的自学能力，他很快掌握了西式会计学知识，并成为上海新兴商业社会中的年轻专业人士。1934年，他出版《银行会计》，建立了较为系统的银行会计理论体系，一跃成为上海财经界颇受关注的青年专家，并先后受聘于多所高校讲授经济与会计课程。\n\n然而，上海的社会现实远比账本上的数字更加混乱。随着经济危机、外国资本竞争以及城市劳动关系紧张，顾准逐渐认为，仅靠技术改革无法解决中国的问题，必须让普通职业青年与劳动者拥有组织自身、参与社会建设的能力。1934年，他参与组织“进社”等青年团体，并开始接触左翼社会运动。1935年，在林里夫介绍下加入革命组织，随后参与上海职业界活动，致力于团结城市职员与知识青年。\n\n在他的推动下，以职业青年为主体的益友社逐渐成为上海最具影响力的青年自治组织之一。不同于传统工人运动，益友社强调教育、互助、职业伦理与社会责任，通过补习学校、图书馆、合作社等方式改善基层职员生活。顾准相信，现代国家的基础是由受教育、具有组织能力的普通公民组成的社会网络。\n\n如今，随着上海在国际冲突与政治危机中陷入动荡，顾准成为中国工团主义者同盟的重要思想人物。他希望将现代经济管理、职业自治与社会民主结合起来，建立一个由技术人员、劳动者与城市组织共同参与的新型国家体系。然而，他的务实主义也使他与部分更激进的社会主义者产生分歧——对于顾准而言，真正的革命除了摧毁旧秩序，还要建立一个能够有效运行、保护普通人的现代社会。§!"
 LEP_gu_zhun_advisor_desc: "§Y生于：§!§L1915年7月1日；中华民国、上海§!\n§Y背景：§!§L$LEP_gu_zhun_leader_desc$§!\n\n§Y备注：顾准是一位由现代经济学与职业教育塑造的改革者。他将会计学家的严谨带入社会运动之中，相信组织、知识与制度建设能够改变中国。作为益友社与中工盟的重要人物，他试图在社会平等与现代效率之间寻找一条新的道路。§!"
 LEP_wang_e: "王萼"
 LEP_wang_e_high_command_desc: "§Y生于：§!§L1882年；大清、浙江布政使司台州府§!\n§Y派系：§!§L“中立”§!\n§Y背景：§!§L王萼别字醉卿，浙江临海人。1908年12月保定陆军速成学堂第一期炮兵科毕业,随后返回浙江在浙军服役，1910年1月任浙江陆军讲武学堂(提调-盛开第)教习，兼任学生队(队长-金国胜)队附。1913年2月起任浙江陆军督练公所科员、教练官，吴淞防守司令部副司令。1919年6月任暂编浙江陆军第二师(师长-张载阳)步兵第四旅(旅长-汪镐基)第二十三团团长。1922年10月任浙江水上警察厅厅长，兼任浙江海防司令部司令等职。\n\n1925年4月，原驻闽海军陆战队第一混成旅旅长杨砥中因与上司杨树庄矛盾激化，被杨树庄派人在上海刺杀，4月9日杨砥中死于医院，孙传芳联帅指派王萼赶在杨树庄之前接管了杨砥中部以防止北京对联合的进一步干涉。1930年王萼又兼任任海防处处长以及马尾要塞部司令，拥有了自己的地盘。王萼在任上尝试将自己手头的中国唯一一支海军陆战队从“拿枪的上岸水兵”打造成一支具有专业两栖作战能力的特殊兵种部队，同时也要兼顾海岸防御。\n\n§Y备注：王萼作为浙江人，在以闽系海军为主的马尾本地中并不受欢迎，但是在王萼的各种操作之下陆战队混成第一旅的规模大肆扩张，人数甚至超过了一些当地的师级部队。有了杨砥中的前车之鉴，王萼本人游走在闽系海军群体与他的浙军同乡之间，希望可以兼顾所有人的利益，以防止南京的怒火降临到他的头上。\n\n王萼对围剿国民党游击队态度消极，很多时候只是远远的尾随。§!"
 LEPEXP_coastline_defender: "岸防司令"
 LEP_huang_baitao: "黄百韬"
 LEP_huang_baitao_high_command_desc: "§Y生于：§!§L1900年；大清、直隶省天津府§!\n§Y派系：§!§c浙系§!\n§Y背景：§!§L黄百韬原名黄新，字焕然，号寒玉，因其出身复杂、履历驳杂，被许多人戏称为“杂牌将军”。黄百韬祖籍广东嘉应州，其父早年曾在李鸿章淮军中担任下级军官，后随军定居天津，因此黄氏虽为广东客家人，却自幼生长于北方。\n\n黄百韬少年时期家境贫寒，身体清瘦，又因年纪轻轻便开始秃顶，常被人背后称作“黄秃子”。尽管生活困苦，他仍进入直隶公立工业专门学校中学部学习。后来因家道中落，不得不投身军旅，成为江苏督军李纯麾下一名传令兵。李纯素来只信任天津同乡，而黄百韬机灵勤快，又粗通文化，因此颇受赏识，甚至被李纯许配侍女为妻。\n\n在妻子的协助与李纯提拔下，黄百韬先后进入江西第九混成旅学兵营、江苏军官教育团与金陵军官教育团学习，期间与时任教育团长的张宗昌结识，并有了师生之谊。然而1920年李纯暴亡后，黄百韬顿失依靠，只得留在江苏防军中苦苦挣扎，从排长一路升任连长。\n\n1925年奉军南下后，张宗昌曾试图招揽这位旧日学生，但黄百韬最终选择留在江南。他认为奉系军阀终究不过是北方势力南下逐利，而卢永祥等浙系旧部至少还愿意维持地方秩序。此后黄百韬长期辗转于苏浙军界之间，并逐渐成为浙系中少有的“北方出身”军官。\n\n§Y备注：黄百韬出身寒微，却极善钻营与治军，在军中以吃苦耐劳著称。不过也正因其履历复杂、派系关系混乱，许多人始终将其视为一个来历不正的“杂牌将军”。\n\n在德国顾问团驻宁期间，黄百韬与赛克特将军、法肯豪森将军、曼施坦因将军等德国顾问探讨了在中国实施装甲部队建设的可行性以及适合中国的装甲部队作战方式。§!"
 LEPEXP_Grassroots_General: "草根将军"
 LEP_sa_shijun: "萨师俊"
 LEP_sa_shijun_high_command_desc: "§Y生于：§!§L1896年；大清、福建省福州府闽县§!\n§Y派系：§!§O共和派§!\n§Y背景：§!§L萨师俊出自福州雁门萨氏，其叔公萨镇冰是北洋水师将领，参加过甲午海战，是中国海军的元老人物。萨师俊自幼便以雪甲午海战之耻为奋斗目标。他于1913年7月以优等生毕业于烟台海军学校第八届驾驶班，并进入海军服役，先是在海军练习舰队实习6个月，尔后补任为初级军官，不久又升为通济号练习舰的三副。之后，他又先后担任“江贞”、“江安”两舰副舰长、公胜号炮舰舰长、青天号测量舰舰长、顺胜号炮舰舰长。在顺胜号舰长任上，他曾率内河炮舰完成由上海至福建的海疆巡弋，创中国内河炮舰海巡先例。后又任威胜号炮舰、海军闽厦警备司令部副官处长、海军第一舰队司令部参谋等职。1932年7月16日，萨师俊从第一舰队司令部参谋的位置上被调到楚泰号炮舰任舰长，并升为二等海军中校。至1936年，萨师俊任海军闽厦警备司令官，麾下辖有德制鱼雷艇8艘，浅水炮舰3艘，布雷艇2艘，驱逐舰1艘。§!\n\n§Y备注：萨师俊在治军方面恩威并重，颇得官兵支持。\n\n萨镇冰总长作为萨师俊的叔公，对这个优秀的后辈十分欣赏，虽然出于大公无私没法在仕途上提供帮助，但是多次帮助萨师俊从中央协调资源发展福建当地内河舰队。\n\n萨师俊与马尾要塞部司令官王萼也保持着良好的关系，他充当了王萼与闽系海军群体之间的桥梁。这两人对国民党游击队都保持着人不犯我我不犯人的态度，并不会积极参与联合围剿。\n\n受海军部技监室沈覲宸上校的影响，萨师俊开始研究海军航空作战的可行性，并认为未来的海战中舰艇防空能力将起到决定性作用，虽然距离中国拥有这种能力还差很远，但是萨师俊打算先从水上飞机开始。§!"
 LEP_liu_qingeng: "刘庆恩"
 KR_semi_auto: "半自动革命者"
 LEP_liu_qingeng_commander_desc: "§Y生于：§!§L1869年；大清、四川省德阳县§!\n§Y派系：§!§O共和派§!\n§Y背景：§!§L刘庆恩，字国臣，客家人，原籍广东潮州，1869年生于四川德阳。\n\n1895年，在乙未战争末期曾追随刘永福的黑旗军与日军在台南交战，腿部负伤撤至后方。1899年，进入湖北枪炮厂（汉阳兵工厂前身）工作，担任技工。1901年，前往日本的东京成城学校（东京振武学校前身）留学。之后又前往冈山第六高等学校求学，与吴玉章、郭敬宇同班。1905年，在日本加入中国同盟会，同年考入东京帝国大学念书，专攻机械枪炮制造。1909年，被孙中山指派前往德国柏林，在克虏伯军工厂考察兵器制造。\n\n中华民国成立后，临时大总统后孙中山委任刘庆恩担任汉阳兵工厂第一任厂长。1914年，刘庆恩成功设计出中国第一款自主研发的半自动步枪（即或刘氏自装枪）与第一门远程火炮。1915年，被授予少将军军衔，同年又晋升为中将。1917年，兼任钢药厂厂长、工务处处长。1917年元月（民国6年）刘庆恩在汉阳兵工厂内开办汉阳兵工专门学校，分为预科、本科两级，着力培养军工人才。其中该校8名首届本科4年制兵工学员，后来成为了中国在枣的军工制造骨干。1918年，刘庆恩前往美国，在普惠公司的帮助下完成刘式步枪的最终改进，并参与了美军1920年代半自动步枪选型及春田军械局的测试。此外，刘庆恩在普惠公司还购买了图纸与大量的机器设备和原料。在回国途中，不幸发生沉船意外，刘庆恩的儿子与随从多人不幸丧生。\n\n1920年，刘庆恩在陆军部开会时受到曹锟等人的排挤，因争辩激烈导致脑溢血而辞去职务，应卢永祥邀请，于年底前往金陵兵工厂任厂长一职。1921年，刘庆恩所仿制的勃朗宁M1917重机枪开始量产，后被称为三十节式重机枪，同时他借助金陵兵工厂的资源以及打捞起来的普惠公司设备开始小批量生产刘氏自装枪，虽然产量很低，并且过程极其艰难，但是至少这个宝贵的半自动设计获取了实战数据，刘氏得以进行了多次改进，到1936年，刘氏自装枪以及在联军的部分部队中配发给了士官使用。§!\n\n§Y备注：刘庆恩将军有强烈的爱国情怀以及反租界立场，1920年到陆军部开会，正值“五四”运动，眼见爱国学生遭到段祺瑞政府镇压，更加气愤，在会议发言时，因过于激动，致脑溢血昏倒，虽经抢救复苏，终成病人，遂辞职回家养病，南下金陵后，刘将军闭门谢客，潜心研究军械。刘氏养病期间常想去广州谒见孙中山，终因战争混乱，直到孙去世也未能成行。而之后的连年混战，刘将军为自己制造的军械竟成了残杀同胞的凶器而满腔忧愤。\n\n1919年，时任海军练习舰队通济号练习舰三副的萨师俊因对普惠公司设备沉于海底而万分惋惜，遂联系萨镇冰总长协调浙江政府潜水队打捞了沉船，刘氏自装枪得以投入生产，因此事刘庆恩对萨师俊感激万分，两人因此结下了深厚的友谊。\n\n刘庆恩专门组织了一支回收队在各个战场收集外国军械以供研究。§!"
 LEP_Liu_rifle_idea: "艰难的刘氏自装枪生产"
 LEP_Liu_rifle_idea_desc: "刘庆恩于1914年成功研制中国第一支半自动步枪，该枪采用枪口罩集气式自动原理，口径7.92毫米，内置6发弹仓，射速达40-50发/分钟，并可切换自动/非自动模式。\n\n由于生产设备的延误加上军阀混战以及刘将军本人身体原因，刘氏自装枪的生产充满了各种延误和意外，并且有相当一部分材料无法在国内生产，兵工厂被迫采购进口材料，因此生产总是断断续续，产量也不稳定。不过好在刘氏自装枪在军中评价颇高，并在战斗中表现出了良好的精度与火力优势，但是枪口的集气装置工艺复杂且难以维护，刘庆恩任然在不断改进设计。"
 LEP_Liu_rifle_2_idea: "刘氏枪族"
 LEP_Liu_rifle_2_idea_desc: "刘庆恩于1914年成功研制中国第一支半自动步枪，该枪采用枪口罩集气式自动原理，口径7.92毫米，内置6发弹仓，射速达40-50发/分钟，并可切换自动/非自动模式。\n\n在经过了几十年的设计与工艺改进后，刘氏自装枪的生产问题总算得到了解决，枪口的集气装置被一个简单但是可靠的导气孔替代，机匣后部原本裸露的机构被一个机匣盖保护，固定弹仓被改成了可拆卸弹匣，可以兼容ZH-29和ZB-26的弹匣。刘庆恩在这期间受到缴获的勃朗宁自动步枪的启发，在结合了刘氏自装枪的经验后研发了刘氏自动步枪，这款自动步枪的重量比BAR更轻，而且还可以使用30发弹匣，由于国内工业能力的提升与充足的战场实验数据，这款自动步枪的生产列装比它的前辈顺利多了。"
 LEP_li_yutang: "李玉堂"
 LEPEXP_maneuver_warfare: "运动战大师"
 LEP_li_yutang_high_command_desc: "§Y生于：§!§L1899年3月18日；大清、山东省广饶县大王镇大王桥村§!\n§Y派系：§!§L中立§!\n§Y背景：§!§L李玉堂字瑶阶，山东广饶人，1899年3月16日，出生于山东省广饶县大王桥河西的一户地主家庭。家中兄弟姐妹七人，他排行第三。7岁时，入村私塾读书。15岁时，考入广饶县第二区振华高等小学学习。1915年，考入山东公立工业专门学校。1919年，参加五四运动，带领青年学生抵制日货。1921年，李玉堂由亲朋介绍到阎锡山部下当兵，因不满军阀内部腐败，半年后即逃离回到家乡。1924年，李玉堂离开家乡，经李郁亭、王乐平等推荐，考入黄埔军校第一期。毕业后，他进入国民革命军陆军一师二团，先后参加北伐战争和国民革命军东征，在与广东军阀陈炯明的作战中，他英勇顽强，由见习排长升任排长，继而升任连长。淡水之战后，受到通令嘉奖并晋升为少校营长。在第二次国民革命军东征作战中，因屡立战功，被提升为陆军第三师第八旅第八团团长，逐步晋升至师长。\n\n北伐失败后，李玉堂跟随闽赣政府在福建地区与八省联军展开游击战，他表现出了高超的运动战天赋，并且成功组织了多次对联军控制城镇的突袭。§!\n\n§!§Y备注：李玉堂待下宽和，每次战役过后，军部官佐不分阶级大小，均可坐在一起吃饭。李玉堂曾跟部下谈及东征之役，当时他所在黄埔一期的学生不在学校上课，而是随校长蒋介石外出作战。攻下一城，论功行赏，升级很快，别人要入校四年，而他只用了六个月即毕业，但他认为黄埔一期的毕业生都是有本事的。他当连长时，即便是从背后，他也能叫出士兵的姓名。他认为官不离兵，艰苦与共，才能打胜仗。\n\n李玉堂尊重工农，并乐于同闲散士兵与驻地农民一起劳作。§!"
 LEP_leighton_stuart: "司徒雷登"
 LEP_fang_yexian: "方液仙"
 LEPEXP_king_of_chemical_industry: "化工大王"
 LEPEXP_CNCS_company: "中国化学工业社"
 LEP_allow_CNCS_flag: "§8中国化学工业社§!§L已解锁§!"
 concern_LEPEXP_CNCS_company: "化工巨头"
 LEP_fang_yexian_advisor_desc: "§Y生于：§!§L1893年；大清、江苏省、松江府、上海§!\n§Y派系：§!§3宁波商帮§!\n§Y背景：§!§L方液仙，字传沆，籍贯浙江慈溪骆驼桥桕墅方家，1893年出生上海。青少年时代就读于宁波斐迪中学，后在上海中西书院读书。在江南制造局兵工学堂，随德国人窦伯烈习化学，同学中有后来被称为“味精大王”的吴蕴初。\n\n1911年,方液仙创办中国化学工业社，先后开设4个分厂，成为当时中国日用化学工业规模最大的厂家之一，这年，方液仙才18岁。方液仙与工人、学徒，夜以继日奋战在车间。他亲自配料、操作，每晚中夜而眠，风雨寒暑不避，终于试制成功了牙粉、雪花膏、生发油、花露水等产品。但由于销路打不开，亏损颇多，只三四年，1万元本钱又蚀光了。之后，方氏仍想方设法自筹资金，甚至不惜典衣当物，又说动其舅父李云书等投资凑满5万元，1915年，方液仙集资办厂，扩大生产三星牌蚊香，以抵制日货蚊香，同时他又继续生产化妆品，并附带生产皮鞋油、果子露等，还设置了发行所，雇用推销员，使情况稍有好转，但仍年年亏损。至1919年初，中化社又面临资金困境，方液仙不无感慨地说：“我们的产品是香的，生意却是臭的！”。\n\n时年爆发的“五四运动”，给民族工商业带来了生机。同胞均以买国货为荣。各商店、摊贩纷纷向“中化社”订购国货商品，“中化社”发行所里，订货批发者纷至沓来，即使加班生产也供不应求。生产销售三星牌牙粉、雪花膏、生发油、花露水等，与洋货轻工产品相抗衡。1923年，方液仙首先研制成功中国第一代牙膏－－三星牙膏，后又研制成功洗衣肥皂等洗涤用品。\n\n“中化社”绝处逢生，方液仙深受鼓舞，立即着手研制新产品，并将“中化社”改组为股份两合公司，自任总经理，由叔父、上海钱业巨子方季扬出任董事长。生产发展，利润增加后，方液仙审时度势，又建立厂房，雇请技师、工人，专门生产化妆品及牙膏。1923年，续建第二厂，专门制造味精、酱油精，与吴蕴初的天厨味精一起，把日本的“味之素”挤出了中国市场，获美称“化工大王”。1928年，方液仙建立第三厂，制造蚊香，附带生产淀粉等。在方液仙的苦心经营下，“中化社”面貌日新月异。1935年，资金增加到l00万元，方液仙将其改组为股份有限公司，成立董事会，并自任总经理。3年后，增资为200万元，遂再建第四厂，制造肥皂、甘油、薄荷油。其设备、规模在当时上海滩均属首屈一指。§!\n\n§Y备注：方液仙虽贵为“化工大王”，却因早年沉迷化学实验，竟在卧室大设实验室，常将自家洋房炸得浓烟滚滚，亦常微服私访摆摊售卖蚊香，毫无巨贾架子。\n\n同时，方液仙具有非常强烈的反租界立场，并希望有朝一日中国的商品可以平等的和外国商品竞争。§!"
 LEP_zhu_meixian: "竺梅先"
 LEP_zhu_meixian_advisor_desc: "§Y生于：§!§L1889年；大清、浙江省奉化长寿乡后竺村§!\n§Y派系：§!§c江南商帮§!\n§Y背景：§!§L竺梅先学名炽潮，字佑庭，出生于浙江奉化长寿乡后竺村一个破落的地主家庭。到了他父亲竺毓英手里，家境已经大不如前。竺梅先从小就给乡绅家放牛，13岁时，背井离乡去了上海做学徒谋生。\n\n最初，竺梅先在一家五金杂货号里做学徒，每天要整理店堂、送货，甚至倒痰盂这样的粗活也要干。但他为人勤奋诚恳，深得老板的信任。和别的学徒不同，竺梅先把省吃俭用积攒下来的钱交学费读夜校。白天从事繁重工作，晚上坚持读夜校学习。在老师的引导下，他的心中种下了一颗反帝反封建的种子。辛亥革命时，他加入同盟会，参加光复上海之役。\n\n1918年初，他奉命去长春秘密组织救国团体，事败被捕，在押送途中逃脱，历经艰险返回上海。1925年“五卅运动”时，竺梅先担任了六路商界联合会会长，参加上海工、商、学联合会领导的罢工、罢课、罢市的“三罢”反帝斗争，领导六路商界罢市游行。运动结束后，竺梅先受邀去济南担任光复军的军需长，之后便和几个朋友合伙在济南经营面粉运销生意，在三年内积累了20万元资金。从济南回到上海之后，又和金润庠、周永升合作做军装生意，在这笔生意中又分得10万元，从而积累了相当的资本。这时，他已经打算弃政从商。\n\n1929年再次与金润庠等合作，创办民丰造纸股份有限公司，任经理。购入嘉兴禾丰造纸厂，改为民丰造纸厂，生产黄版纸。后试制薄白纸版成功，填补国产纸版空白。1931年接办杭州武林造纸厂，改组为华丰造纸股份有限公司，任经理。设总管理处于上海。1932年联合5家造纸厂，在上海成立国产纸版联合营业所，统一产销，抵制日货倾销,竺梅先在《申报》上刊登《全国同胞公鉴》，公开呼吁全国同胞奋起抗日，并拒进日本原料和设备 。1934年筹建卷烟纸生产线，同年创办上海丰裕公行、宁波大新军服厂，兼任宁绍轮船公司总经理。§!\n\n§Y备注：竺梅先在慈善事业上投入颇多，经常派员工给穷苦街坊发放米面油粮。在芜湖事变期间竺梅先多次冒险给群众送物资并筹资设办医院收治伤者，这让竺梅先在群众之中有了良好的口碑，他被老乡亲切的称呼为“竺大班”。§!"
 LEP_orphan_aid_idea: "灾童教养院"
 LEP_orphan_aid_idea_desc: "竺梅先不忍战乱孤儿流离失所无依无靠，集资5万元，与夫人徐锦华在奉化后琅泰清寺创办灾童教养院，自任院长，徐氏任副院长，接收来自全国各地的流浪孤儿，免费供食宿，开设小学、初中教育，教养院奉行“教养兼施，德智体技并重”的理念，设有语文、数学等文化课和纺织、木工等技能课，并融入抗日救亡教育。\n\n竺梅先经常叮嘱夫人徐锦华与工作人员：“一定要把孩子们好好抚养下去，直到他们能自立为止。” "
 LEPEXP_shipping_king: "船运大亨"
 LEP_lu_xiaobo: "陆小波"
 LEP_lu_xiaobo_advisor_desc: "§Y生于：§!§L1882年3月3日；大清、江苏省镇江§!\n§Y派系：§!§c江南商帮§!\n§Y背景：§!§L陆小波自青少年起，他即在镇江从事工商事业。1897年到镇江源同钱庄学徒，从此与金融业结缘，历任慎康、元益等钱庄经理、中央银行镇江支行经理，1912年起，担任镇江商会会长，并兼商团团长，并以镇江商会会长兼商团团长的身份勇于斡旋，使镇江几度免遭兵祸浩劫。1927年，他率领镇江商团接收了镇江英租界，名声大震。§!"
 LEPEXP_patriotic_businessman: "救亡商人"
 LEP_ma_shigong: "马师恭"
 LEP_ma_shigong_high_command_desc: "§Y生于：§!§L1903年6月20日；大清、陕西省绥德州米脂县扶风寨§!\n§Y派系：§!§L泛国民党派§!\n\n§Y背景：§!§L马师恭，字子敬，陕西绥德人。早年在国民军冯玉祥部任文书、上士和司务长。1924年考入黄埔陆军军官学校第一期，1925年，任教导一团排长，参加过东征、北伐，功升团长。在次年赴法国圣•西尔军校，因此错过了20年代末30年代初国民党的溃败，30年代后赴美俄考察伞兵技术后与国民党中央失去了联系，直到1936年回国。此时，民主政府已控制南京，马遂加入国民自治军服役，主持建设伞兵部队。§!\n\n§Y备注：作为黄埔一期生，马师恭与李玉堂关系良好，并且多多少少的有亲国民党立场。§!"
 LEP_wu_rengli: "吴纫礼"
 LEP_wu_rengli_high_command_desc: "§Y生于：§!§L1874年；大清、安徽省合肥县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L吴纫礼字佩之，安徽省合肥县人。1890年至1895年，吴纫礼入威海水师学堂学习。此后他入天津北洋水师学堂学习，于1896年以优等成绩毕业，受北洋大臣李鸿章嘉奖。此后他加入海军服役，历任巡洋舰海圻舰大副，保定军校教训处检阅股委员、英法文总教习、学校监督（即教育长）。1910年4月8日，他任筹办海军事务处第五（秘书军枢）司秘书（伍光健任司长）。1910年12月4日，筹办海军事务处改为海军部，吴纫礼任参赞厅二等参谋，任职至1912年2月1日。\n\n中华民国成立后，1912年9月6日，吴纫礼任海军部军械司司长，任职至1925年12月26日调走。1912年12月30日获授海军上校，1915年9月29日晋升海军少将。1925年5月16日，吴纫礼任军事善后会议海军会员。1926年1月9日，吴纫礼任海军部次长兼总务厅厅长、编纂委员会会长并曾代行海军总长直到同年7月10日。同年12月1日，晋升海军中将。1927年，吴纫礼任海军次长，随海军第一舰队驻南通，虽然与孙传芳的关系差强人意，但还是协助孙氏建立联军的岸防力量。\n\n§Y备注：吴纫礼曾为蒋介石师，并且同样对国民党有所同情。\n\n吴纫礼非常欣赏有过英国留学经历的吴振南，两人虽然属于上下级关系，但是私下交情很好。§!"
 LEP_huang_qun: "黄群"
 LEP_huang_qun_advisor_desc: "§Y生于：§!§L1883年；大清、浙江省温州§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L清光绪二十七年（1901年），黄群赴杭州求学，先后师从养正书塾总教习陈介石及求是书院宋恕，接受系统的经世与政法教育。次年，随陈介石、宋恕赴上海，参与《新世界学报》的编辑与撰稿工作，由此进入近代舆论与新学传播领域。光绪三十年（1904年），黄群东渡日本，就读于早稻田大学，专攻政法学说，系统接触宪政与近代国家理论。\n\n学成归国后，黄群先后在湖北督署调查局、政法学堂任职，从事行政调查与法政教育工作。1911年武昌起义爆发后，他返浙协助周承菼组织陆军第八十二标，参与杭州光复事务。同年11月，作为浙江方面代表之一，赴上海出席各省都督府代表联合会会议，随后又赴武昌，参与制订《中华民国临时政府组织大纲》。\n\n民国成立后，黄群任南京临时参议院议员，参与《中华民国临时约法》的讨论与制定。1913年当选民元国会众议院议员，参与共和党活动，后随党改组进入进步党体系。袁世凯称帝风波期间，黄群受梁启超之托，主持上海《时事新报》事务，并多次往返南京，与冯国璋等人接触，参与反袁政治协调。\n\n1916年护国战争期间，黄群随梁启超经香港、海防入桂、入滇活动，参与起草《护国军军政府宣言》及《军务院组织条例》，承担具体制度设计与文书工作。袁世凯去世后，黄群逐渐淡出政界，转而投身实业经营，创办通易公司，从事商业活动。至1936年，其企业经营陷入困境，政治活动亦告一段落。§!"
 LEP_shi_beiheng: "施北衡"
 LEP_shi_beiheng_high_command_desc: "§Y生于：§!§L1893年；大清、大清浙江省缙云§!\n§Y派系：§!§c浙系§!\n§Y背景：§!§L施北衡，字伯衡，后改北衡，别名汝福，浙江缙云人。15岁时被保送进入浙江陆军小学，1911年毕业后升入南京陆军第四中学。入学甫3月，遇辛亥革命，遂离校参加革命军，曾任浙军排长。后进入保定陆军军官军校就读，1916年第二期炮科毕业。毕业后至上海参加讨袁军事活动，袁逝世后乃入浙军第2师，任连附。1919年，赴北京陆军部任职，同年冬，考入陆军大学第六期。\n\n1923年，施北衡返浙任军官教育团教官。1924年至1927年间，任炮兵营营长及中校参谋，随后任浙江武备学堂教官及战史编纂委员会委员，统计并修正了浙军战史，并协助校长厉尔康编纂新式炮兵操典。1934年任浙军参谋长。1936年1月，施北衡晋升少将。§!\n\n§Y备注：作为保定军校炮科毕业生并且在作战部队担任过参谋岗位的专业技术军官，施北衡认为未来战争就是一场炮兵对决，他希望未来可以让每个步兵团都能配属自己的炮兵连。§!"
 LEP_xing_zhennan: "邢震南"
 LEP_xing_zhennan_high_command_desc: "§Y生于：§!§L1893年；大清、浙江省嵊州长乐镇坎流村§!\n§Y派系：§!§c‘无派系’§!\n§Y背景：§!§L邢震南字霆如，1892年生于长乐镇坎流村，父母都是普通农民。1908年，邢震南考入浙江陆军小学堂，并于1911年，邢震南升入南京陆军中学。10月，“武昌起义”爆发，打响推翻清王朝第一枪，邢震南加入学生军，在南京城和清军作战。民国成立后，邢震南进入北京清河陆军中学，随后升入保定军官学校第二期步兵科，毕业后返浙，在浙军第二师当见习排长，邢氏在军中吃苦耐劳踏实肯干，于1922年升为营长。\n\n1924年9月，邢震南的仕途被江浙战争打断，孙传芳率兵从福建偷袭浙江，浙军第二师驻守在仙霞岭抵御孙传芳的进攻，在江苏督军齐燮元和孙传芳的南北夹击下，浙江督军卢永祥宣布下野，师长张载阳也辞职。孙传芳控制浙江后，任命周凤岐为浙军第三师师长，邢震南就在第三师当营长。1925年10月，孙传芳率领“五省联军”反奉，邢震南跟随部队进入徐州，把奉军赶出江苏后，邢震南所在的部队转移到南京。1926年，邢震南部卷入北伐战争，期间升为团长。1933年1月，邢震南升为第四师师长，率兵驻守在安徽蚌埠。§!\n\n§Y备注：邢震南待人宽厚，尊重工农，在驻扎蚌埠期间邢震南还让秘书李洁天，负责筹办报刊《力行》，邢震南亲自兼任社长，还让包括国民党成员在内的爱国人士在报纸上面发表反租界文章。当时孙传芳的特务，认为《力行》报社“亲国民党”，每天都监视着报社，特务还扬言要杀了李洁天，邢震南就让李洁天回老家避避风头，但是坚持发布报纸。这一行为让邢氏在爱国群众与国民党中都有良好的口碑，但是引来了孙传芳的忌惮。§!"
 LEPEXP_fort_destroyer: "工事毁灭者"
 LEP_xu_huansheng: "徐焕升"
 EP_wu_rengli_air_chief_desc: "§Y生于：§!§L1910年9月；大清、江苏省太仓直隶州崇明县§!\n§Y派系：§!§O共和派§!\nY背景：§!§L徐焕昇原为江苏省立医院医科生，后有感于救亡图存而转读军校。早年就读南京陆军军官学校交通科，毕业后先后就读于笕桥航校第一期、德国航空大学、意大利空军军官学校，驾驶过多国制造的多种轰炸机。\n\n徐焕升推崇杜黑学说，主张通过空中轰炸敌方军事、工业中心和人口稠密区，直接摧毁敌人的战争潜力和抵抗意志，从而绕过漫长的地面消耗战。§!\n\n§Y备注：徐焕升在结合了大量情报后认为应该对日本发动燃烧弹空袭，通过制造大片过火区域并混合投放普通航弹与燃烧弹制造火焰风暴焚毁日本城市，以打击日寇士气与战争能力。\n\n但是这些行为显然违反战争法与道德准则，国会需要一段时间讨论。§!"
 LEP_jiang_qian: "江谦"
 LEP_jiang_qian_advisor_desc: "§Y生于：§!§L1876年；大清、安徽省婺源§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L江谦，字易园，安徽婺源人。早年就读于徽州紫阳书院、南京文正书院，受传统经学与新式学术双重影响，对教育制度与学术训育问题尤为关注。\n\n1902年，张謇在南通创办通州师范学堂，江谦受邀前往，先后担任堂长与校长，参与课程设置、师资训练与校务管理工作，使该校迅速成为近代师范教育的重要机构之一。1909年，他当选资政院议员，并曾被推举为安徽省教育会会长，开始在更广泛层面参与教育事务与制度讨论。\n\n辛亥革命后，江谦进入民国时期的议会与教育体系，曾任民元国会江苏省众议员。1914年出任江苏教育司司长，主理全省教育行政。同年，他因长期研究文字音韵与语音问题，尝试以英文切音为参照，提出声母通转规则，并设计音标方案，对后来的国语注音制度产生启发性影响。\n\n1914年8月，江谦出任南京高等师范学校校长。在任期间，他倡导训育、智育、体育并重，以“诚”为校训，强调尊师重道与学生品格培养，逐步形成稳定而有特色的校风，使南京高师在南方学界享有极高声誉。1919年，因健康原因辞去校长职务。\n\n辞职后，江谦逐渐转向学术与思想研究，专注佛学，倡导净土宗义理，并提出儒佛融通的思想。在婺源创设佛光社，讲学著述，影响遍及学界与教育界。至1936年前后，江谦已鲜少介入公共事务，但其在师范教育、大学建设与学术思想上的贡献，仍持续影响近代中国的教育与文化走向。§!"
 LEP_jing_yaoyue: "景耀月"
 LEP_jing_yaoyue_advisor_desc: "§Y生于：§!§L1882年；大清、山西省芮城§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L景耀月，字太昭，山西芮城人。出身农家，光绪二十八年（1902年）入山西大学堂，次年中副榜。光绪三十年（1904年）以官费选送日本早稻田大学攻读法政，期间结识孙中山，加入同盟会，投身反清革命。\n\n光绪三十三年（1907年）起，景耀月在东京先后参与创办《晋乘》《夏声》等革命刊物，并参与发起晋豫陇学会，以文字鼓吹革命。宣统元年（1909年）归国后，在上海与于右任创办《民呼日报》，后改组为《民吁日报》，自任总编辑，集中揭露日本侵华阴谋，倡言抵制日货，声名鹊起，与景梅九并称“山西二景”。报馆屡遭清廷查封，景耀月亦被通缉，一度避走南洋。\n\n辛亥武昌首义后，景耀月迅即回国，以山西代表身份参与各省都督府代表联合会，旋任南京临时参议院议员。他深度参与民国初创，主持草拟《临时大总统就职宣言》，参与制定《中华民国临时约法》。民国元年（1912年）元旦，在孙中山就职典礼上，他以议长身份代表国民授大总统玺绶并致授玺辞，成为开国历史性一幕。随后被任命为南京临时政府教育次长，实际主持部务，兼掌南京法政大学，为民国教育立法奠基。\n\n民国初年，景耀月历任统一共和党参议、国民党参议。后一度脱离国民党，另组政友会，并相继出任大总统府高等政治顾问、众议院议员、约法会议议员等职。1917年张勋复辟，他在晋豫组织靖国讨逆军并被推为总司令，起兵反对。1923年曾公开致函痛斥曹锟贿选，持守政治公义。\n\n1928年北伐成功后，景耀月逐渐淡出政界，转事学术与教育。曾担任北平《益世报》编辑，并先后执教于上海中国公学、北平大学法学院、东北大学等校，精研经史，与黄侃（季刚）并称“北景南黄”，在学界享有声誉。§!"
 LEP_li_siguang: "李四光"
 LEP_li_siguang_advisor_desc: "§Y生于：§!§L1889年；大清、湖北省黄冈§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L李四光，蒙古族，湖北黄冈人，原名李仲揆。1902年赴武昌求学时误将年龄“十四”填入姓名栏，遂改名为李四光。\n\n光绪三十年（1904年），赴日本留学，先后就读于东京弘文学院、大阪高等工业学校，主修“舶用机关”。其间结识革命党人，加入中国同盟会，投身反清革命。宣统三年（1911年）毕业回国，参加清廷学部“游学毕业生考试”，获“工科进士” 出身。同年辛亥革命爆发，李四光以所学支持新生政权。\n\n民国建立后，为科学救国，李四光于1913年再度远赴欧洲，入英国伯明翰大学学习，先攻采矿，后转地质。1919年，他以优异成绩获自然科学硕士学位，其论文《中国之地质》受到关注。同年，他毅然回国，受蔡元培之聘，任北京大学地质系教授、系主任，着力培养中国第一代地质学家，并投身野外调查与科学研究。\n\n1927年，李四光获伯明翰大学博士学位。次年，他南下参与筹建国立武汉大学，并长期担任建筑筹备委员长。同时，他在南京参与创建中央研究院，并出任地质研究所首任所长，引领中国现代地质学研究。1932年，曾短期代理国立中央大学校长。整个三十年代前期，他还兼任中英庚款董事会董事、西陲学术考察团理事等多项学术要职，致力于推动中国地质调查、科研组织与国际合作。\n\n至三十年代，李四光已以其在地质科学研究、高等教育创建及学术组织管理方面的卓越贡献，成为中国现代地质学的主要奠基人与领军人物。§!"
 LEP_tang_qunying: "唐群英"
 LEP_tang_qunying_advisor_desc: "§Y生于：§!§L1871年12月8日；大清、湖南省衡山§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L唐群英，字希陶，湖南衡山人，生于武将之家。早年婚居守寡后，受时局与秋瑾影响，慨言“国之兴亡，人皆有责”，遂决然挣脱传统束缚，于1904年东渡日本求学。\n\n在日期间，她先后就读于青山实践女校、成女高等学校师范科，并因成绩优异转为官费生。1905年，她经黄兴介绍结识孙中山，同年加入华兴会，后随会并入中国同盟会，成为该会首位女会员，自此投身反清革命。留日时，她积极为革命刊物《洞庭波》撰稿，并发起组织留日女学生会，以汇聚进步力量。\n\n1908年，她奉孙中山之命回国，在湘、赣等地秘密策划武装起义。1911年武昌起义爆发后，她迅即在上海筹组女子北伐队，后率队编入江浙联军，参与攻克南京之役。南京临时政府成立后，孙中山誉其为“巾帼英雄”。\n\n民国肇建，她将重心转向争取女权。1912年，她在南京创立中华民国女子参政同盟会，领导女界要求将“男女平等”写入《临时约法》。同盟会改组为国民党时，因党纲删除“男女平权”条款，她于成立大会上愤然**掌掴宋教仁**，震动一时。此后她在北京创办《女子白话报》等刊物，设立学校，持续倡导女权。因袁世凯政府打压，她于1913年后被迫停止公开政治活动。\n\n1920年代，她主要在湖南从事女子教育，创办多所女校。1924年，她参与推动《湖南省宪法》明文载入男女平等及女子参政权利条款。1935年，因晚年生活清贫，由故旧引荐，受聘为国民党中央党史编纂委员会委员，直至1936年秋返回家乡。§!"
 LEP_wang_youlan: "王有兰"
 LEP_wang_youlan_advisor_desc: "§Y生于：§!§L1887年；大清、江西省兴国§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L王有兰，字梦迪，江西人。早年受传统教育，弱冠即有文名，及长博览群书，尤好周秦诸子。清末维新思潮兴起后，转致力于新学，自江西高等学堂毕业。为求新知，王有兰东渡日本，入中央大学攻读法律。留日期间，受革命思潮影响，加入中国同盟会，投身反清革命事业。\n\n辛亥鼎革之际，王有兰于1911年回国，任江西都督府参议官，旋被派赴南京，出任各省都督府代表联合会江西代表。民国元年（1912年），任南京临时参议院议员，参与民国初创立法。同年，返赣出任江西内务司长，兼交通司长，襄理本省新政。\n\n民国二年（1913年），王有兰当选为中华民国第一届国会众议院议员。民国三年（1914年），远赴欧洲考察各国政治制度。民国四年（1915年）袁世凯谋行帝制，王有兰毅然回国，参加护国运动，以示反对。民国五年（1916年），革命军政府成立，他出任军务院军事参议，并随云南护国第二军活动，兼任岭南道尹。\n\n袁世凯去世后，国会恢复，王有兰重任国会众议院议员。1917年，为护法南下，参加广州国会非常会议。此后数年，他辗转政学两界，曾于1919年担任云南省昆明市政公所督办，参与早期市政建设。\n\n1930年代，王有兰主要活动于江西。至1935年，出任江西省第四区（赣州）行政督察专员，主持地方政务，直至1936年。§!"
 LEP_yu_huancheng: "俞寰澄"
 LEP_yu_huancheng_advisor_desc: "§Y生于：§!§L1881年10月27日；大清、浙江省德清§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L俞寰澄，名凤韶，浙江德清人。清光绪八年（1882年）考中壬寅科浙江乡试举人。早年于南浔镇求学时，结识张静江、梁希等人。其后随张氏兄弟经营珠宝业务，并于光绪三十一年（1905年）同赴法国巴黎拓展商号。在法期间，得晤孙中山，深受感召，遂加入中国同盟会，以商贾身份为革命事业提供资助与掩护。\n\n辛亥年（1911年）武昌起义后，俞寰澄迅即归国投身光复运动。是年十一月，参与陈其美等策划的上海起义，在攻打江南制造局之役中，他奔走联络，协同清军策反，为克制造局、救出被羁押的陈其美发挥了重要作用。旋由浙江军政府任命为湖州军政分府主任，稳定地方秩序。\n\n民国肇建，俞寰澄以革命功勋当选为浙江省议会议员及民元国会众议院议员，跻身立法机构。民国五年（1916年），受任中国银行副总裁，转入金融界。翌年，因反对段祺瑞政府毁弃《临时约法》，毅然辞去银行要职，南下广州参加孙中山领导的护法运动，以实际行动维护共和法统。\n\n护法运动受挫后，俞寰澄逐渐淡出政坛中心，转而专注于实业与金融。他在上海参与创办华商证券交易所，并出任理事，同时经营恒大金号等商业机构，成为沪上金融界活跃人物。此后数年，他虽以商事为主，但仍与政商各界保持广泛联系。\n\n至1936年，俞寰澄已成功转型为一位兼具革命元老背景的金融实业家，其经历体现了近代中国部分革命者从政治行动向社会经济领域参与的一种路径。§!"
 LEP_yuan_xiluo: "袁希洛"
 LEP_yuan_xiluo_advisor_desc: "§Y生于：§!§L1876年10月27日；大清、江苏省宝山§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L袁希洛，江苏宝山（今属上海）人。早年就读于上海龙门书院，后东渡日本留学。清光绪三十二年（1906年）在东京加入中国同盟会，追随孙中山革命。宣统二年（1910年）毕业于东京私立日本大学高等师范科。\n\n辛亥年（1911年）武昌首义后，沪军都督陈其美组织各省代表筹组临时政府，袁希洛被推为江苏代表，赴南京参与筹建民国之大计。民国元年（1912年）1月1日，孙中山在南京就任中华民国临时大总统，在就职典礼上，袁希洛担任授印代表，亲手将中华民国临时大总统印授予孙中山，此一仪式性角色使其成为民国开国历史场景中的关键人物之一。\n\n民国成立后，袁希洛未居显职，转而长期致力于教育事业，历任苏州公立中学、江苏省立第二中学校长、江苏公立法政专门学校教授、国立同济大学附属中学主任等职，以教育践行救国理念。\n\n至国民政府统一后的1928年，袁希洛始出任地方行政职务，先后担任启东、太仓、南汇等县县长。其中在启东任内，正值该地区由沙洲析置设县之初，他作为首任县长，主持草创，规划县政，并亲撰《启东设县碑记》以志其事，于地方治理有所建树。\n\n此后数年，袁希洛继续在江苏地方担任行政职务。至1936年，其活动主要集中于县级行政与文教领域。其一生经历，自早年革命参与国家创制，至中年以后服务地方教育与行政。§!"
 LEP_zhang_jvsheng: "张菊生"
 LEP_zhang_jvsheng_advisor_desc: "§Y生于：§!§L1867年10月25日；大清、浙江省海盐§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L张菊生，浙江海盐人。出身书香仕宦之家，清光绪十八年（1892年）进士，选翰林院庶吉士，散馆后授刑部主事，后任总理各国事务衙门章京，身处清末政治与外交中枢。\n\n甲午战后，国势日危，张菊生积极投身维新运动，于北京组织陶然亭集会，议论时政，倡言变法。光绪二十三年（1897年），他创办通艺学堂，讲授西学，培植新式人才。戊戌年间，经徐致靖保荐，受光绪帝召见。变法失败后，遭清廷革职，遂离京南下。\n\n光绪二十七年（1901年），张菊生应夏瑞芳之邀，投资并主持上海商务印书馆编译事务。他力主设立编译所，聘请蔡元培为首任所长，系统编印新式教科书，开中国现代出版业之先河。其主持下，《最新国文教科书》等风行全国，深刻影响数代学人知识结构。他亦致力引入西学，组织翻译出版严复《天演论》等一批重要学术著作。\n\n辛亥鼎革后，张菊生专注于商务印书馆的经营与文化建设。他主持影印出版《四部丛刊》、《百衲本二十四史》等大型古籍丛书，于传统文化存亡续绝之际，为典籍的保存与流通做出里程碑式贡献。与此同时，他继续推动商务印书馆发展为兼营印刷、出版、发行及文具制造的现代文化企业。\n\n至1936年，张菊生以商务印书馆董事长身份，已引领中国出版业近三十年。其一生轨迹，自晚清维新官员，转型为民国最重要的出版家与文化奠基者之一，通过教科书普及新知，通过古籍整理传承旧学，以其独特的“以出版扶助教育”的理念与实践，深远塑造了近代中国的文化启蒙与知识传播格局。§!"
 LEP_zhao_fengchang: "赵凤昌"
 LEP_zhao_fengchang_advisor_desc: "§Y生于：§!§L1856年；大清、江苏省武进§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L赵凤昌，字坦夫，江苏武进青山门人，出身当地士绅世家，为西盖赵氏分支。其家族自明末迁居武进北部，世代以教育与仕宦著称，高祖赵鉴曾参与创办青山书院。赵凤昌早年受传统经学训练，入国子监为监生，后以候补知县身份进入官场。\n\n清末新政时期，赵凤昌在张之洞幕府中任职，先后随张之洞出任两广、湖广总督，负责辕门文案与机要事务。张之洞遭参奏去职后，赵凤昌亦被辞退，改任武昌电报局驻沪代表，由此长期活动于上海，逐渐成为连接官僚、实业与舆论的重要中介人物。\n\n1900年庚子事变爆发，八国联军进逼北方。赵凤昌与张謇等人往返联络两江、湖广及两广重臣，参与劝说刘坤一、张之洞、李鸿章等人采取抗命立场，推动形成“东南自保”的实际格局。他在其中承担联络、协调与谋划角色，是相关行动的重要幕后推手。\n\n辛亥革命前后，赵凤昌定居上海，其南阳路“惜阴堂”成为南北双方非正式磋商的重要场所。围绕清廷退位与南北议和问题，他多次参与秘密会谈，协助沟通北洋方面与革命党人立场，为和谈进程提供具体方案与建议，并参与相关机密事务的筹划。\n\n此后，赵凤昌虽少居显职，但持续以私人身份介入政治协商与事务咨询，保存并整理大量函电与文稿，记录清末民初重大事件的内部运作轨迹。他一生多居幕后，却深度参与近代中国政治妥协与制度生成的关键过程。§!"
 LEP_gao_fengqian: "高凤谦"
 LEP_gao_fengqian_advisor_desc: "§Y生于：§!§L1870年1月28日；大清、福建省长乐龙门乡§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L高凤谦，福建长乐龙门乡人，少时不以科举仕途为志，专注经世致用之学，尤重教育与文字整理。清末新政时期，他逐渐投身新式教育体系，关注学制改革与教材建设。\n\n1901年，高凤谦任浙江大学堂总教习，参与课程规划与教学管理。1902年，他率领留学生赴日本，并担任留日学生监督。在日本期间，他系统考察当地教育制度，逐渐形成“教育兴国始于小学”的认识，并立志编写适合中国的新式小学教科书。\n\n1903年冬，高凤谦回国，进入商务印书馆主持编译事务，出任编译所国文部部长，负责国文教材的总体规划与编写工作。他亲自参与《新字典》《辞源》的策划与编纂，推动语文教材与工具书走向系统化与规范化。1909年至1910年间，他兼任复旦公学监督，参与学校管理与教学事务。\n\n1915年，高凤谦曾代理商务印书馆总经理职务，处理馆务与出版事务。1918年，他升任编译所长，主持教材与学术出版的整体方向。五四运动后，面对学术环境变化，他认为自身外文能力有限，不宜继续主持编译所工作，遂主动提出辞任，并前往北京邀请胡适出任所长。经考察协商，王云五接任该职，高凤谦转任出版部长，继续协助编务与出版工作。\n\n长期以来，高凤谦始终致力于基础教育教材、辞书编纂与出版制度建设，其工作使近代语文教学与学术出版逐步形成较为稳定而系统的格局，对中国教育与文化发展产生了深远影响。§!"
 LEP_Nanking_parliament: "南京参议院"
 KR_republican_academic_2: "全救会领袖"
 KR_legalist_2: "景星会人脉"
 LEP_li_linsi_leader_desc: "§Y生于：§!§L1896年2月18日；大清、浙江省杭州§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L厉麟似生于浙江名门杭州厉氏家族，自幼饱读文学经典。1915年毕业于同济大学后，厉麟似赴日本上智大学留学四年，回国后又以优异的成绩考取了官费赴德留学生，留德期间先后获得了德国耶拿大学法学硕士学位与海德堡大学哲学博士学位。\n\n在十多年的游学生涯中，厉麟似潜心钻研政治学、教育学、军事学及英文、法文和俄文。1921年，他在德国创办了著名的汉学研究组织——景星学社，并创办了首个专门研究汉学的专业学术期刊《汉学》杂志。他与卫礼贤(Richard Wilhelm)一道，致力于帮助西方人理解中国文化的内涵和意义，还结识了周恩来、朱德和朱家骅等一批留德学人。\n\n1930年，厉麟似怀着满腹经纶与满腔爱国热忱返回祖国，进入教育部任职，在联合治下工作。为了促进国家教育事业与文化外交事业，他成立了中德文化协会、中国教育学会和中国教育电影协会。厉麟似是南京大学教授，也是中德学会董事。为了加强与中国和中欧同盟的联系，厉麟似曾访问欧洲各国以推动双方教育研究领域的进一步合作。\n\n厉麟似在与德国驻华军事顾问团的合作中担任翻译，并于1935年末在南京成立了中德之间的第一个官方交流机构。§!\n\n§Y备注：厉麟似是顾维钧的密友，两人都主张通过国际外交解决中国的争端。§!"
 LEP_xu_deheng: "许德珩"
 LEP_xu_deheng_desc: "§Y生于：§!§L1890年10月17日；大清、西省德化县§!\n§Y派系：§!\n"
 LEP_rong_desheng: "荣德生"
 LEP_rong_desheng_advisor_desc: "§Y生于：§!§L1875年8月4日；大清、江苏省无锡§!\n§Y派系：§!§c江南商帮§!\n§Y背景：§!§L荣德生是中国最负盛名的民族实业家之一，与其兄荣宗敬并称“荣氏兄弟”，素有“面粉大王”“棉纱大王”之誉。少年时曾在上海通顺钱庄习业，后协助兄长经营广生钱庄，并逐渐投身实业。1900年华北陷入混乱，荣氏兄弟借北运面粉之机积累资本，先后创办保兴、茂新、福新等面粉企业，又陆续建立申新纱厂体系，逐步形成横跨面粉、纺织、金融等多个领域的民族工业集团，成为江南民族资本的代表人物。\n\n与善于资本运作、对外经营的荣宗敬相比，荣德生长期负责企业内部管理与生产经营。他重视技术革新与制度建设，引进新式机器，完善厂规制度，培养技术人员，并不断改进工厂管理方式，使荣氏企业在激烈的市场竞争中始终保持较强的生产能力。进入三十年代后，世界经济危机席卷东亚，民族工业普遍陷入困境，荣氏企业亦背负巨额债务。面对东亚监事会、外国资本与银行财团的重重压力，荣德生一方面整顿企业、压缩成本，另一方面积极联合江南工商界，抵制对民族企业的兼并与控制，力图为中国民族工业保留一线生机。\n\n除经营企业外，荣德生亦热心教育与地方公益，长期资助学校、图书馆及社会慈善事业，希望借教育培养现代工商人才，为国家积蓄长远发展的根基。如今，荣氏兄弟已成为江南商帮无可争议的核心人物。荣德生始终坚信，国家的富强不能依赖外国资本，也不能单靠政府扶植，而必须建立在民族工商业自主发展的基础之上；唯有保障产权、稳定市场、振兴实业，中国方能真正走向富强。§!"
 LEPEXP_king_of_cotton_yarn: "棉纱大王"
 LEP_yu_qiaqing: "虞洽卿"
 LEP_yu_qiaqing_advisor_desc: "§Y生于：§!§L1867年6月19日；大清、浙江省慈溪县§!\n§Y派系：§!§c江南商帮§!\n§Y背景：§!§L虞洽卿是旅沪宁波帮无可争议的领袖。幼年家贫，十五岁赴上海瑞康颜料行当学徒，凭借过人的商业才能逐渐跻身上海商界，先后担任德商鲁麟洋行、华俄道胜银行及荷兰银行买办，并借此积累了雄厚资本。此后，他相继创办四明银行、宁绍轮船公司、三北轮埠公司、宁兴轮船公司及鸿安轮船公司，建立起横跨金融、航运与贸易等多个领域的商业网络，成为中国民族航运业与金融业的重要代表人物。\n\n除了经营企业之外，虞洽卿长期活跃于上海工商界，历任上海航业公会理事长、上海证券物品交易所理事长、上海总商会会长及全国工商协会会长等职。他善于协调各地商会、银行与实业团体之间的利益关系，在地方政府、外国企业与民族资本之间纵横捭阖，为中国工商界争取更大的发展空间。作为宁波帮的领袖人物，他广泛团结江浙地区的工商人士，使宁波商帮逐渐成为上海最具影响力的商业集团之一。\n\n世界经济危机爆发后，外国资本进一步扩张，民族航运与金融业经营日益困难。面对东亚监事会及外国航运公司的竞争压力，虞洽卿积极联合各地商会与航业团体，推动民族资本加强合作，维护中国商船、港口与金融机构的利益，并努力削弱外国资本对沿海贸易的控制。他深信，国家工业的发展离不开银行、航运与商业网络的支撑，唯有掌握金融命脉、畅通交通运输，中国民族资本方能真正摆脱列强的经济控制，在东亚市场赢得属于自己的一席之地。与此同时，他亦热心公益与教育事业，长期资助学校、道路、桥梁等地方建设，希望以工商繁荣带动社会进步，为中国培养更多现代商业与管理人才。§!"
 LEPEXP_doubletitle_champion: "双料巨头"
 LEP_yin_ruli: "殷汝骊"
 LEP_yin_ruli_advisor_desc: "§Y生于：§!§L1883年；大清、浙江省平阳县金乡镇§!\n§Y派系：§!§l自治同志会§!\n§Y背景：§!§L殷汝骊，字铸浦，号柱公，浙江平阳人，早年创办新式学堂，致力于地方教育。1908年东渡日本，就读于早稻田大学经济科，并加入同盟会，自此投身共和革命。辛亥革命成功后，当选国会议员，参与浙江地方财政制度的设计，是民初浙江宪政派的重要人物之一。\n\n第一次世界大战期间，殷汝骊活跃于东京留学生与革命党人组织的“欧事研究会”，长期与黄郛、褚辅成等政学系人士保持密切联系。1916年出任财政部次长，负责国家财政事务，虽因政局变化很快辞职，但其稳健务实的财政理念却广受赞誉。此后，他先后担任河南省银行总理、福建省政府委员兼盐运使等职，在财政、金融及地方行政方面积累了丰富经验。\n\n离开政坛第一线后，殷汝骊长期寓居上海，与褚辅成、沈钧儒共同主持全浙公会，积极联络江浙工商界、教育界及地方士绅，成为自治派的重要代表人物。他既支持地方自治，也强调中央统一，认为共和国应建立在完善的地方自治制度与健全的财政体系之上，而非依赖军人政治与个人独裁。与此同时，他还积极推动实业发展，投资家乡明矾产业，并著有《开发海南岛计划书》，主张以经济建设促进国家富强。\n\n近年来，因其胞弟殷汝耕与华北政局的牵连，殷汝骊一度遭受政治怀疑，但最终获释，并更加坚定地投入自治派的政治活动。在自治同志会内部，他被视为兼具财政专长与地方威望的重要人物，主张通过议会政治、地方自治与经济建设逐步实现共和国的长治久安。§!"
 LEPEXP_fiscal_reformer: "财政改革家"
 LEP_wu_zaoxi: "吴藻溪"
 LEP_wu_zaoxi_advisor_desc: "§Y生于：§!§L1904年；大清、湖北省崇阳县§!\n§Y派系：§!§l民主科学社§!\n§Y背景：§!§L吴藻溪出身湖北崇阳，青年时期曾加入国民党，后因不满党争与军人干政而退党。1930年前往日本留学，先后于东京帝国大学、早稻田大学研习哲学、法学、社会学、农学等学科，深受现代科学精神与民主思想影响。回国后任教于中国大学、朝阳大学等校，讲授农业经济学、政治经济学及经济统计学，并兼任中国大学政治经济研究室主任，逐渐成为北平知识界颇具影响力的青年学者。\n\n1934年，吴藻溪联合唐嗣尧、王良骥等人发起成立世界科学社，主持《科学时报》编务，积极宣传科学思想，主张以科学方法解决中国社会问题，而非空谈主义或个人崇拜。随着全国局势不断恶化，他又组织自然科学座谈会、青年科学技术人员团体，联络教育界、科技界与青年知识分子，希望培养一批能够承担国家建设使命的新式人才。\n\n在新的共和国成立后，吴藻溪与许德珩、张申府、孟宪章等科教界人士共同推动成立§l民主科学社§!，希望将长期分散于大学、研究机构与社会团体中的知识分子组织起来，以科学精神参与国家建设。他认为，一个现代共和国不仅需要民主制度，更需要建立尊重事实、崇尚理性的政治文化；唯有让实验室、课堂与议会共同运转，才能真正完成国家的现代化，使科学成为共和国最可靠的基石。§!"
 LEPEXP_humble_educato: "谦逊的教育家"
 LEP_pan_shu: "潘菽"
 LEP_pan_shu_advisor_desc: "§Y生于：§!§L1897年7月13日；大清、江苏省宜兴县§!\n§Y派系：§!§l民主科学社§!\n§Y背景：§!§L潘菽，原名有年，字水叔，江苏宜兴人，出身书香门第，自幼接受传统教育，后进入北京大学哲学系学习。在北大求学期间，他受到蔡元培“兼容并包”思想的影响，逐渐关注现代科学与教育对于国家发展的意义。1920年毕业后赴美深造，先后就读于加利福尼亚大学、印第安那大学与芝加哥大学，1926年获得心理学博士学位，成为中国最早一批接受现代心理学训练的学者之一。\n\n1927年归国后，潘菽任教于第四中山大学（后改称中央大学），长期主持心理学教学与研究工作，推动中国现代心理学学科体系的建立。他致力于记忆、错觉、汉字知觉等实验研究，并进一步探索心理学的基本理论，提出心理学兼具自然科学与社会科学双重属性的观点，试图建立符合中国实际的现代心理学体系。\n\n抗战时期，潘菽积极投身科学救国运动，与梁希、涂长望等科学界人士共同发起中国科学工作者协会，推动全国科学界的联合。战后，他又参与筹建§l民主科学社§!，希望将科学家、教育家与知识分子组织起来，为共和国提供理性的政策建议与人才基础。\n\n作为民主科学社的重要代表，潘菽主张科学不应只是象牙塔中的研究，而应成为国家建设与社会进步的重要力量。在他的理念中，一个现代国家需要培养独立思考、尊重事实的新式公民。通过心理学、教育与科学研究，他希望为中国塑造一个更加理性、文明与进步的未来。§!"
 LEPEXP_psychology_practitioner: "心理学实践者"
 LEP_lu_yudao: "卢于道"
 LEP_lu_yudao_advisor_desc: "§Y生于：§!§L1906年1月；大清、浙江省宁波鄞县§!\n§Y派系：§!§l民主科学社§!\n§Y背景：§!§L卢于道是中国近代著名神经解剖学家与生理心理学家，他早年就读于国立东南大学，1926年前往美国芝加哥大学深造，专攻神经解剖学与生理学，并于1930年取得博士学位。\n\n学成归国后，卢于道任教于中央大学医学院，并进入中央研究院心理研究所，从事脑神经结构与人类心理活动研究。他编写了中国早期神经解剖学教材，并通过对中国人大脑结构的研究，反驳西方学界关于所谓“人种优劣”的伪科学论调。在他看来，科学不仅是国家富强的工具，更是民族自强与文明进步的基础。\n\n1937年以前，卢于道主要活跃于中国科学界，与中国科学社、中央研究院等学术机构保持密切联系。他长期倡导科学教育与学术独立，主张将现代科学体系引入中国社会，以培养能够推动国家发展的新一代知识分子。\n\n抗战爆发后，随着中央研究院与众多高校内迁，卢于道随学术界转移至西南地区，继续从事教学与科研工作。期间，他参与科学界人士的联合活动，并加入民主科学座谈会，与许德珩、潘菽、褚辅成、涂长望等知识分子共同讨论国家前途、科学发展与民主建设问题。该组织后来发展为民主科学社，成为中国知识界的重要民主力量。\n\n如今的卢于道代表着民主科学社中的科学技术派。他相信，中国的未来必须建立在教育、科学与理性治理之上。他希望通过推动科学事业与知识分子团结，为一个现代化、民主化的中国奠定基础。§!"
 LEP_liang_xi: "梁希"
 LEP_liang_xi_advisor_desc: "§Y生于：§!§L1883年12月28日；大清、浙江省吴兴§!\n§Y派系：§!§l民主科学社§!\n§Y背景：§!§L梁希是中国近代林学的开拓者之一，也是中国科学界的重要活动家。出生于浙江湖州双林镇的书香世家，幼年接受传统教育，后赴日本留学，先后学习海军与农学，最终专攻林学。1916年毕业于东京帝国大学农学部林学专业后，投身中国林业教育与科研事业。\n\n回国后，梁希先后任职于奉天安东鸭绿江采木公司以及北京农业专门学校，致力于将现代林业科学引入中国。1923年，他赴德国塔朗脱高等林业学校深造，研究林产制造化学，回国后将国外先进林业技术与中国实际相结合，成为中国林产化学领域的重要奠基者。\n\n1927年后，梁希先后任教于国立北京农业大学、浙江大学农学院以及中央大学农学院森林系，培养了大批林业人才。他长期研究松脂采集、樟脑制造、木材加工、桐油利用等领域，推动中国林业从传统经验走向现代科学体系。1933年起，他任中央大学教授，在南京学术界和教育界拥有较高声望。\n\n抗日战争爆发后，梁希随中央大学西迁重庆，继续从事林业教育与科研工作。面对国家危机，他积极参与科学界的救亡活动，并与许德珩、潘菽、卢于道等知识分子保持密切联系。1944年，梁希参与民主科学座谈会的创建，主张以科学促进国家建设，以民主推动社会改革。\n\n如今，作为民主科学社的重要成员，梁希代表着中国知识界中追求科学救国与民主政治的一派。他致力于维护科学独立、发展民族工业，并希望通过现代化教育和技术建设，使中国摆脱落后与外来控制。§!"
 LEP_gu_zhongxiu: "谷钟秀"
 LEP_gu_zhongxiu_advisor_desc: "§Y生于：§!§L1874年；大清、直隶省定县§!\n§Y派系：§!§m政学系§!\n§Y背景：§!§L谷钟秀，字九峰，直隶定县人，出身于地方士绅家庭，早年就读于保定莲池书院，后进入京师大学堂学习。1901年赴日本早稻田大学攻读政治经济学，在日本留学期间结识孙中山等革命人士，并加入中国同盟会，参与中国近代政治思想的转型。\n\n1908年归国后，谷钟秀先后任教于直隶师范学堂，担任直隶总督署秘书、浙江宪政筹备处科长以及顺直咨议局议员等职务，积极参与晚清新政和地方自治运动。辛亥革命爆发后，他作为直隶代表参与各省都督府代表联合会，并参与中华民国初年的政治制度建设。\n\n民国建立后，谷钟秀与吴景濂等人创立统一共和党，随后并入国民党，成为国会中的宪政派代表。1913年进入第一届国会，担任众议院议员及宪法起草委员会委员，参与民国宪法草案的制定。袁世凯解散国会后，他联合张耀曾、杨永泰等人成立民宪党，继续推动议会政治，并通过《正谊》《甲寅》等刊物宣传宪政理念。\n\n袁世凯称帝失败后，谷钟秀进入北洋政府体系，曾任段祺瑞内阁农商总长兼全国水利总裁，负责经济建设与水利事务。此后，他参与南北政治活动，并与张耀曾、李根源等人共同推动政学系的发展，逐渐成为连接旧式士绅、现代官僚与地方实力派的重要政治人物。\n\n1920年代后，谷钟秀逐渐靠近北方地方实力派，曾任冯玉祥顾问以及豫陕甘三省建设委员会主任委员。在中原大战及随后华北政治变动中，他继续以政治顾问和行政专家身份活动。\n\n如今，作为政学系的重要成员，谷钟秀代表着中国政治中的宪政官僚派。他主张通过行政改革、地方自治和有限议会制度实现国家现代化，既反对军阀割据，也警惕激进革命。§!"
 LEPEXP_hydrologist: "水利学家"
 LEP_wang_jiyan: "王吉言"
 LEP_wang_jiyan_advisor_desc: "§Y生于：§!§L1870年；大清、直隶省三河县§!\n§Y派系：§!§m政学系§!\n§Y背景：§!§L王吉言，号飏亭，直隶三河县人，出身于当地皇粮庄头之家，自幼接受传统儒学教育，1894年考中举人，后获清廷授予知县职位，但未赴任，而选择返回乡里从事教育与地方公益事业。\n\n王吉言早年以乡绅身份兴办教育，长期教授儒家经典，培养地方士子，在直隶地区拥有较高声望。1904年，他在家乡创办戒烟所，参与社会改良活动。清末新政时期，他积极参与地方自治建设，先后担任区董、警董，并赴京师法政专门学校学习，接触近代政治制度与行政思想。\n\n辛亥革命后，王吉言进入民国政治舞台，成为地方宪政派的重要成员。1913年起，他多次当选第一届国会众议院议员，参与民国初年的议会政治建设。他主张通过国会制度、地方自治以及渐进改革实现国家治理现代化，反对军阀以武力取代制度建设。\n\n1917年张勋复辟与段祺瑞拒绝恢复国会后，王吉言响应孙中山护法运动，南下广州参加非常国会，继续推动宪政合法性。南北议和后，他返回北京，继续参与国会活动，并积极提出改革地方财政、改善民生的议案。\n\n北洋政治衰落后，王吉言逐渐转向地方行政建设。1927年后，他返回直隶，担任三河县地方财政经理处处长及财政局长，负责地方财政管理与行政改革。凭借其士绅背景与议会经验，他成为连接地方社会与现代官僚体系的重要人物。\n\n如今，作为政学系的一员，王吉言代表着中国旧士绅阶层向现代政治转型的一支力量。他相信地方自治、法制建设与渐进改革能够塑造一个稳定的中国。在八政府内部，他可作为地方行政、财政改革以及基层治理方面的重要顾问。§!"
 LEP_zhang_yaozeng: "张耀增"
 LEP_zhang_yaozeng_advisor_desc: "§Y生于：§!§L1885年；大清、云南省大理§!\n§Y派系：§!§m政学系§!\n§Y背景：§!§L张耀曾是民国时期著名的法学家、宪政派政治人物，也是政学系的重要成员。早年出身书香之家，1903年进入京师大学堂学习，后官费赴日本东京帝国大学研习法学。留日期间，他受到民主革命思想影响，加入中国同盟会，并与李根源等人创办《云南》杂志，积极宣传共和理念。\n\n辛亥革命爆发后，张耀曾返回国内，参与中华民国创建工作，曾任孙中山秘书、临时参议会议员以及同盟会总干事。民国成立后，他投身宪政建设，参与起草《中华民国临时约法》，并长期活跃于国会政治之中。此后历任众议院议员、法制委员长、北京大学法科教授等职，参与制定《中华民国宪法草案》（天坛宪草），成为民初法律改革的重要人物。\n\n袁世凯解散国会并筹备帝制后，张耀曾离开政坛，赴日本继续深造，并参与护国运动，协助蔡锷等人反对袁世凯复辟。袁氏倒台后，他进入段祺瑞内阁，出任司法总长，推动司法制度改革，试图建立现代化的法律体系。然而，军阀割据与政治混乱使他的宪政理想屡遭挫折。\n\n1920年代以后，张耀曾逐渐淡出中央政治，与谷钟秀、杨永泰等人共同参与政学系活动，维护传统议会政治和文官制度。他晚年转向法律教育与社会活动，在抗日战争前后积极呼吁民族团结与抵抗外侮。如今，作为政学系的重要法律派代表，张耀曾致力于以宪政和法治维护中国政治秩序，试图在军阀与革命浪潮之间寻找一条渐进改革之路。§!"
 LEPEXP_minister_justice: "司法改革家"
 LEP_yu_jiaju: "余家菊"
 LEP_yu_jiaju_advisor_desc: "§Y生于：§!§L1898年；中华民国、湖北省黄陂§!\n§Y派系：§!§n青年党§!\n§Y背景：§!§L余家菊是中国近代著名教育家、思想家，也是国家主义教育理论的重要奠基人。早年就读于文华书院，后毕业于中华大学哲学系，并赴英国伦敦大学、爱丁堡大学留学，研习哲学、心理学与教育学。留英期间，他与曾琦等人共同编写《国家主义的教育》，成为青年党早期思想的重要理论来源之一。\n\n1924年回国后，余家菊任武昌师范大学教育哲学系主任，并参与创办《醒狮周报》，积极宣传国家主义思想，主张以教育振兴民族、培养现代国民。他提出收回教育权、发展乡村教育与普及义务教育等主张，试图通过教育改革实现国家复兴。\n\n1925年加入中国青年党后，余家菊坚持“不亲近党权、不组织派系、不依党为生”的原则，长期担任青年党重要理论人物。此后历任金陵军官学校总教授、河南大学教育系主任等职，并连续四届担任国民参政会参政员。抗战时期，他积极参与政治活动，推动青年党与国民党合作。\n\n如今的余家菊是青年党的思想领袖之一，致力于以国家主义、教育改革和传统文化复兴塑造一个新的中国。§!"

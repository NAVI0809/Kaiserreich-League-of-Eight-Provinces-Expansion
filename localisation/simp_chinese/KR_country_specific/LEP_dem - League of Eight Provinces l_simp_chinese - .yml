 LEP_liberation_of_asia_category_desc: "中国不是帝国主义的唯一受害者。欧洲帝国主义的贪婪扩张吞噬了整个亚洲大陆的自由国家，残酷的殖民统治压迫了数百万群众；在东方，日本人也加入了压迫者的行列，争先恐后地在不属于自己的土地插上旗帜。\n\n作为亚洲理所应当的保护者，我们有责任解放这片土地上的人民。我们会用意志、鲜血，如有必要的话还有智谋，来摆脱帝国主义列强对我国和其他亚洲国家的控制。同时，我们也将唤起亚洲人民的民族意识，与他们共同沐浴泛亚民主主义的荣光。"
 LEP_liberation_war_decision: "准备对[FROM.GetNameDef]发动解放战争"
 LEP_liberation_war_decision_desc: "自数世纪以来，中国长期在亚洲占据文化和政治的主导地位，在该地区具有独特的地位。如今，中国复兴了，这个被认为是世界上最伟大最古老的文明之一，现在也能够承担起进行民主灯塔的使命了。我们将动用庞大的工业力量和军事实力推翻那些反动政权，解放在亚洲的民众，让他们免受压迫和苦难。"

 RYK_cai_zhang: "蔡璋"
 RYK_cai_zhang_leader_desc: "§Y生于：§!§L1916年4月5日；夏威夷、檀香山§!\n§Y背景：§!§L蔡璋，原名喜友名嗣正，祖籍福建泉州南安，出身于琉球久米村闽人三十六姓蔡氏后裔。1916年，他出生于美国夏威夷檀香山，早年曾随父亲辗转居住于东南亚与塞班岛，先后就读于琉球水产学校制造科及夏威夷火奴鲁鲁基督学校。1933年，他进入琉球水产试验场担任技士，后赴夏威夷从事新闻编辑工作。不同于许多在日本本土接受教育的琉球青年，蔡璋的成长经历使他较早接触到海外华侨社会与不同的政治思想，也逐渐形成了对琉球民族身份及其政治前途的独立思考。\n\n东亚战争爆发后，蔡璋秘密组织琉球青年同志会并担任理事长，开始联络岛内外具有相同政治主张的琉球人士，推动琉球摆脱日本统治。此后，他不断往返于琉球与台湾之间，试图借助海外琉侨网络扩大独立运动的影响。\n\n随着中华民国军队击败日本、解放琉球群岛，长期受到日本殖民统治的琉球终于迎来了重新决定自身前途的机会。蔡璋积极参与战后政治重建，主张琉球应当摆脱日本统治，并在中华民国的支持与国际社会的承认下建立独立国家。他一方面推动琉球革命同志会转型为公开政治组织，另一方面积极联络各地琉侨团体与岛内政治人士，争取不同社会阶层对独立事业的支持。\n\n在战后的政治过渡时期，蔡璋逐渐成为琉球独立运动中最具影响力的领袖之一。他所倡导的独立主张既强调琉球民族的历史与文化传统，也重视与中国及其他国家维持友好关系。随着琉球独立进程取得突破，蔡璋领导的政治力量在新国家的建构中发挥了重要作用，并最终使他成为琉球独立后的首任总统。§!"



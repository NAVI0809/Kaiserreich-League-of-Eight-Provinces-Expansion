 LEP_gas_warfare_trait: "化学武器联合作战"
 league_generic.10.t: "军官培训团"
 league_generic.10.d: "在过去的几年里，德国军事顾问团协助训练了大多数的联军军官，但是随着自治军的建立，我们不能再依赖于来自德国顾问团的协助，并且有些军官已经把德军内部不同理论路线之间拉帮结派的恶习带到了我军之中。\n\n因此，参谋长刘宗纪与浙江武备学堂校长厉尔康决定对我军接受过德式训练的军官进行一次集训，以结束路线之争。其中，李忍涛和徐培根两位德国军校的优秀毕业生成为了最耀眼的明星，李忍涛一直在向总参谋部推广他的‘化学武器联合作战’；而徐培根坚持建立一支小而精的现代化军队，并且强调突击队战术的应用；另外，刘庆恩将军作为众多受马克斯·鲍尔启发的军事工业家则认为军事工业是一切的基础，选择他主张的路线可以把这些争议隔离与作战部队之外；最后的选项则是继续使用和改进最后几届德国顾问的理论，结合塞克特与法肯豪森在世界大战中的经验发展适合中国军队的战术理论，但是这势必会让所有德训军官都不满意。"
 league_generic.10.a: "这件事要从长计议"

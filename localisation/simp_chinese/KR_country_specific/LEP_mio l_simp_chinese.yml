 LEPEXP_fort_nantong_defence: "建立南通要塞司令部"
 LEPEXP_fort_nantong_defence_desc: "作为当地海军的最高长官，吴纫礼将军指出南通方向的防御空虚，仅有的防御工事可以追溯到上世纪末，日军如果选择从华东方向进攻南京，南通将会无险可守，日寇则可以利用南通完善的港口设施更便利的运输兵力与物资。为了将日寇进攻方向锁死在淞沪一带，南通方向必须有可以长时间阻滞日寇的兵力与防御工事。"
 LEP_fort_nantong_tt: "§C海军§!§L将会对南通方向的防御提出额外要求§!"
 league_generic.11.t: "海军的提议"
 league_generic.11.d: "海军总长吴纫礼将军指出南通方向的防御空虚，仅有的防御工事可以追溯到上世纪末，日军如果选择从华东方向进攻南京，南通将会无险可守，日寇则可以利用南通完善的港口设施更便利的运输兵力与物资。为了将日寇进攻方向锁死在淞沪一带，南通方向必须有可以长时间阻滞日寇的兵力与防御工事。\n\n吴将军请求陆军调拨兵力，参考国防线上部署的江防军在南通设立独立的守备部队布防，并修建现代化的防御工事，引进大口径岸防炮，在适合登陆的海岸滩涂部署障碍，并向入海口投放水雷。为表示诚意，吴将军承诺不干涉要塞守备部队的指挥。"
 league_generic.11.a: "好的吴将军，我们会尽量匀一些资源..."
 league_mid.67.t: "主动出击" 
 league_mid.67.d: "中国海军甲午战败后一直处于弱势，无法在海上战胜日本联合舰队，因此保卫海岸不能全指望我们勇敢的水兵们，也需要英勇的飞行员们从空中打击日寇海军的嚣张气焰。\n\n萨师俊将军作为中国第一批尝试建立海军航空部队的将领，他向国会指出海军需要建立一支远程的岸基航空部队，装备重型飞机，携带大当量武器与侦查设备，在广阔的东海上搜寻日舰并伺机发动攻击，就算不能击沉敌舰也能为水面舰艇与潜艇还有其他飞机侦查敌舰位置，并且扰乱敌军部署。\n\n他提议我们购买美国团结飞机公司生产的PB4Y巡逻机，而该公司正苦于资金紧张，愿意低价出售48架该型飞机并转让全套技术。虽然国防预算十分紧张，动用备用资金采购飞机必将影响国防线的修建，但是在吴纫礼司令官的协助下，这份提案还是被提交给了国会。"
 league_mid.67.a: "为了对日寇海军形成非对称优势，砸锅卖铁在所不辞"
 league_mid.67.b: "把钱省下来老老实实造好国防线更重要"
 LEP_PB4Y_TT: "§C海军远程航空部队§!将在§Y南京大校场机场§!部署"

 league_generic.14.t: "火攻东京的提议"
 league_generic.14.d: "新上任的空军作战部长徐焕升向国会提交了一份计划————对日本本土发动大规模轰炸十分必要，但是日本本土在7000米以上常见强劲的高空气流，会将自由落下的炸弹吹离原预定目标区，因此我空军需要采用特别的战术。日本陆海军航空兵的夜间战斗力较为低下，且日本建筑多为木造建筑，我空军远程轰炸机部队应装备烧夷弹，以夜间低空轰炸战术轰炸日本。\n\n该计划显然会带来大量附带伤害，轰炸导致的火灾将会同时焚毁工厂和居民区，虽然有情报显示不少日本军火的零件生产是在居民区的家庭作坊中完成的，但是直接攻击平民显然让我方处于道德上不利的地位，国会议员们陷入了长时间的讨论..."
 league_generic.14.a: "§R火攻日寇！§!"
 league_generic.14.b: "我军乃仁义之师"

 league_generic.15.t: "东京大轰炸"
 league_generic.15.d: "在中国空军作战部长徐焕升的指挥下，174架远程轰炸机部队所属的重型轰炸机从中国东部沿海多个机场起飞，满载燃烧弹飞往东京。[?global.date.GetDateStringNoHourLong]，24时15分，两架导航机到达东京上空，在预定目标区下町地区投下照明弹，接着投下燃烧弹，为后续飞机指示目标。随后大批轰炸机以单机飞行依次进入目标区域投掷燃烧弹，火势迅速蔓延。轰炸持续2小时，共投下2000余吨燃烧弹。轰炸造成的大火形成的灼热气浪与冷空气形成强劲对流风，造成了火焰风暴。其产生的高温足以使市区内所有可燃物包括人体烧着。轰炸使日本皇宫以东地区近41平方千米的建筑被焚毁，约为东京面积的四分之一。其中18%是工业区，63%是商业区，其余是住宅区。计划中的22个工业目标全部被摧毁，26万7千多幢建筑付之一炬，八万余人被烧死，10万人被烧成重伤，100万人无家可归。"
 league_generic.15.a: "日寇自食其果"
 league_generic.15.b: "真是一场悲剧"

 league_generic.16.t: "轰炸效果差强人意"
 league_generic.16.d: "在中国空军作战部长徐焕升的指挥下，174架远程轰炸机部队所属的重型轰炸机从中国东部沿海多个机场起飞，满载燃烧弹飞往东京。[?global.date.GetDateStringNoHourLong]，24时15分，两架导航机到达东京上空，在预定目标区下町地区投下照明弹，接着投下燃烧弹，为后续飞机指示目标。随后大批轰炸机以单机飞行依次进入目标区域投掷燃烧弹，但是在东京上空中国轰炸机遭到了日本夜间战斗机的拦截，部分轰炸机被迫在抵达目标前投弹撤离以防止被击落。由于燃烧弹轰炸未能按照预定计划完成，相当一部分目标没有被火灾波及，轰炸效果差强人意，未能对日本造成毁灭性打击。但是中国轰炸机出现在日本首都上空这件事已经造成了民间的恐慌，这需要日本军方做出合理的解释。"
 league_generic.16.a: "得想点别的方法"
 league_generic.16.b: "天照大神保佑"
 devastation_strategic_bombing_disruption: "战略轰炸恐慌"
 devastation_strategic_bombing_disruption_2: "严重战略轰炸恐慌"
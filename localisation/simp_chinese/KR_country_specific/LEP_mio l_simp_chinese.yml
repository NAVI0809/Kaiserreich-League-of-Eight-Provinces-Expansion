 hongqiao_LEP_MIO: "飞行器研究与开发"
 hongqiao_LEP: "飞行器研究与开发"
 hongqiao_desc: "上海虹桥航空工厂最开始命名为上海飞机修理厂，于1927年在联帅府航空处的授意下正式成立，由德资控股。因为当时上海是远东的最大港口，也是航空器材进口的主要口岸，这里成了维护德国以及八省联合航空队飞机的重要基地，但是，这家远东最大港口的飞机工厂却显得格外寒酸，南京方面拿不出太多的钱来养这个吞金工厂在建厂初期，航空工厂设备简陋、厂房也比较小，整个厂房仅建造机器间和发动机车间一小栋，开办费用也只有1.5万大洋。1928年12月，孙传芳联帅以浙江1年盐税收入为抵押向德国人贷款购入设备雇佣技术人员，1929年2月，随着经费到位，上海航空工厂随即进行对德国信天翁式双翼教练机的仿制工作，仿制机型完成后被命名为“成功”1号，是中国最早的国产飞机之一。随着上海主权完全收回，新的研发团队和更多的资金将会让这家工厂焕发第二春。"


 LEP_qi_xieyuan_desc_body: "齐燮元少时好学，以炮兵军官之身入学北洋速成武备学堂二班，于1906年毕业。被遣至李纯部下，在中华民国建国时，成了李纯的参谋长。二次革命时，李纯执掌江西，当冯国璋代行大总统职责时，他改派李纯去管理江苏。1920年李纯出人意料地自杀身亡，齐燮元在陈调元的支持下接手了他的职务。\n\n第一次直奉战争中，齐燮元选择站队吴佩孚，而玉帅则任齐燮元为苏皖赣巡阅使以示报答。第二次直奉战争中，在吴佩孚大败于张作霖后，老帅派狗肉将军张宗昌接管了江苏。在遭人多次背后捅刀后，齐燮元逃往孙传芳帐下，二人在1925年联手反攻江苏，齐燮元重夺江苏督军之位。\n\n待到孙传芳建起五省联合、八省联合，齐燮元和陈调元同为孙传芳的左膀右臂，但齐燮元赢得了孙联帅的青睐"
 LEP_qi_xieyuan_sic_desc: "§Y生于：§!§L1885年4月28日；大清、直隶省宁河县§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L$LEP_qi_xieyuan_desc_body$，被派去监组数支德国精锐教导团。通过担任同德国亲善的主要联系人，以及为柏林方面在上海的数项剥削协议大开绿灯（正是这些协议促使了1932年的上海起义），齐燮元成功巩固了自己的地位。齐燮元对反抗者的暴力镇压也使得陈调元与他渐行渐远。§!\n\n§Y备注：齐燮元极其奉行实用主义且野心勃勃，没人知道齐燮元为了争得权力能做出多么没底线的事。§!"
 LEP_liu_zongji_army_chief_desc: "§Y生于：§!§L1884年；大清、直隶省河间§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L刘宗纪在日本陆军士官学校第六期修读步兵科，是孙传芳、李根源、唐继尧和刘存厚等人的同学，而人们对他的早年生涯所知甚少。已知的是，他在政府资助下从1906到1908年在日本读书，在此期间，他与同学共同创立了名为《武学》的军事期刊。\n\n在回到中国后，刘宗纪在行将就木的大清里担任参谋军官。辛亥革命成功并没有打乱他的军旅生涯，他在于1918年晋升少将前，曾在浙江担任冯国璋的参谋数年。于1924年晋升中将的刘宗纪在1926年时被任命孙传芳的参谋长，并以四十二岁之龄获得上将军衔。自孙传芳自任联帅以来，刘宗纪就一直担任着联军参谋长之位，帮助孙传芳管理他那数目可观的军队，并在包括大量镇压和无数对抗国民革命军战役在内的军事行动中提供他的意见。§!\n\n§Y备注：作为日本陆士同学会会长的刘宗纪与大多数同学保持着良好的关系，其熟人遍及各省，跨越意识形态界限。这位谦逊且一丝不苟的联军参谋长对政事不感兴趣，只想作为尽忠职守的军人和参谋完成职责。§!"
 LEP_chen_yi_high_command_desc: "§Y生于：§!§L1883年5月3日；大清、浙江省绍兴§!\n§Y派系：§!§c浙系§!\n§Y背景：§!§L陈仪生于富庶的商人之家，幼年好学，勤读经史典籍。由于清王朝每况日下，陈仪立志报效祖国，因而开启了他的军旅生涯。陈仪先进入日本陆军士官学校第五期中国学生队学习炮科，后又转入日本陆军炮兵射击学校。在留洋期间，陈仪与光复会建立了联系，并且结识了诸如蔡元培、蒋尊簋、秋瑾和徐锡麟在内的其他浙江人。\n\n陈仪于1907年返回中国，在陆军部担任科员。在辛亥革命期间，蒋尊簋任浙江都督，而陈仪也在其邀请下返乡效力。1914年，陈仪赴北京担任参议。翌年，袁世凯派陈仪追缉潜逃至云南的蔡锷，然而陈仪却只是佯装追捕，之后卸任并返回浙江。袁世凯去世后，陈仪再度前往日本，在日本陆军大学校学习三年，然后在上海经商。\n\n在1924年的江浙战争中，陈仪被推为地方代表劝孙传芳息兵，以免战火祸民。孙传芳敬慕陈仪留日学军多年，学识高深，乃请陈仪出任其部下军职。陈仪协助孙传芳从张宗昌手中夺取了江苏省，在前任浙江省省长谋叛之后，陈仪又获任为浙江省长兼督理，即使历经十年之久，他仍然担任此职。§!\n\n§Y备注：虽然孙传芳对陈仪敬重有加，但陈仪对这位笑面虎却并无太多忠诚可言。陈仪期盼桑梓能免于战祸，也有许多人怀疑他同情安徽的陈调元。§!"
 LEP_xie_hongxun_army_chief_desc: "§Y生于：§!§L1882年；大清、直隶省大名§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L谢鸿勋是一名杰出的八省联军军官，他爱兵如子，是孙传芳最重视的下属之一。他的早年经历扑朔迷离、自相矛盾，但有一点是可以确定的，他考入了保定军校第一期步兵科，后于1914年毕业。\n\n民国时期，谢鸿勋曾担任过各种低级军官。1921年，他加入孙传芳麾下并出任团长。到1924年，他已成为孙传芳麾下的师长。1926年国民革命军北伐时，谢鸿勋在江西与国民革命军作战。虽然他迟滞了国民革命军的攻势，但也在战斗中腿部中弹，身负重伤。正在总部和部下起草作战方案的孙传芳听闻噩耗后泪流满面，对左右悲叹道，自己失去了左膀右臂。幸运的是，谢鸿勋当即被送往上海，在那里接受了德国最先进的药物和治疗，因此逃过一劫。经过长时间的休养康复，谢鸿勋现已回到了八省联军，作为孙传芳的得力助手继续效力。§!\n\n§Y备注：这位久经沙场的老将非常尊敬吴佩孚和孙传芳，称他们为“大帅”。\n据传，尽管张宗昌的年龄比他大，但谢鸿勋似乎很看不起张宗昌，认为张宗昌只是个黄毛小子。§!"
 LEP_meng_zhaoyue_high_command_desc: "§Y生于：§!§L1887年；大清、山东省寿张县§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L孟昭月原以卖豆腐为生，幼年丧父，家境贫寒。1911年辛亥革命爆发后，为了改善家境，24岁的孟昭月决心从军，自此开启了军旅生涯。到1913年，孟昭月已从一名低级军官晋升为中校，并担任工兵营长。孟昭月曾在北京政府的多支部队中任上校团长，后于1921年进入孙传芳第二师任旅长。\n\n1922年，孟昭月获授少将军衔，两年后又晋升为中将。二十年代初，孙传芳率部席卷东南后，孟昭月成为杭州卫戌司令，同时也是联帅麾下的师长。国民革命军进攻孙传芳后，他又出任浙军总司令，并凭借十多年来积累的工事经验，成功将国民革命军赶出了孙传芳的南京大本营。自那之后，孟昭月与周凤岐一同担任南京卫戍司令，保卫着孙传芳联合的核心地带。§!\n\n§Y备注：作为孙传芳的长期追随者和忠实下属，孟昭月从未接受过任何正规的军事训练，但他的经验总能帮到联帅。§!"
 LEP_wang_haoji_high_command_desc: "§Y生于：§!§L1884年；大清、浙江省桐乡§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L汪镐基考入日本陆军士官学校第五期骑兵科中国学生队，在日学习一年后回国，在北京担任历史和军事科学的教官。1912年民国成立后，他获得骑兵上校军衔，1914年派往浙江服役，在孙传芳麾下开始了他的军旅生涯。\n\n1920年，汪镐基升任步兵旅少将旅长，隶属于周凤岐部。此后十余年间，他在孙传芳的八省联军麾下指挥过多支步兵部队，先后参加了直奉战争和北伐战争，镇压了联合之敌发起的多次起义。直到三十年代末，汪镐基才成为八省联军骑兵监，后于1936年初晋升为中将。§!\n\n§Y备注：尽管汪镐基对骑兵作战很感兴趣，但他近半的军旅生涯都是在孙传芳麾下指挥步兵，他希望情况能有所改变。§!"
 LEP_ge_jingen_high_command_desc: "§Y生于：§!§L1889年7月30日；大清、浙江省嘉兴§!\n§Y派系：§!§c浙系§!\n§Y背景：§!§L葛敬恩像许多浙江人一样生于商贾家庭，但他没有选择继承家业。1904年，他考入浙江武备学堂，并在毕业二年后在那担任教官。\n\n葛敬恩在学期间，著名革命家秋瑾拉拢了不少新军成员投身革命事业，对腐败清廷深感不齿的他也因而被革命理想感染。1907年，葛敬恩加入同盟会，并在1911年11月加入继武昌起义后发起的杭州起义，他在这场起义中负责起草作战计划井攻占了一个革命阵地。\n\n葛敬恩同时也是南京起义军的参谋之一，还协助夺取了南京。南京政府于1912年成立，此后，葛敬恩被任命为兵站交通部长和南北议和的代表之一。之后，葛敬恩继续学业，于1913到1916年间在陆军大学学习。两年之后他被派到日本陆军大学校，并于1921年回国。应陈仪之邀请，葛敬恩在1924年开始于浙军服役。\n\n这位杰出的指挥官担任陈仪的参谋长十年有多，但他对对抗自己的国民党同胞却不太热衷。§!\n\n§Y备注：葛敬恩是陈仪的好友。这位辛亥革命功臣更在意的是和朋友在一起，而不是为联合服役。§!"
 LEP_zhou_yan_high_command_desc: "§Y生于：§!§L1895年12月26日；大清、浙江省嵊县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L周碞之父曾就读于浙江武备学堂，是浙军士官、光复会会员，1911年武昌起义后参加过杭州光复之役，在父亲事迹的激励下，周碞也成为了一名军人。\n\n和父亲一样，周碞先是进入浙江陆军小学堂学习，后来又在武昌的陆军第二预备学校学习。1914年，周碞考入保定陆军军官学校第三期炮兵科，1916年毕业后，任浙军第一师炮兵团见习官，开启了军旅生涯。1924年，他已是浙军周凤岐第二师麾下的炮兵连长，同年入读陆军大学第七期。\n\n然而，周碞在北京的学业因北方混乱的战事而中断。他只得回到南方的老部队中，继续他的职责。国民革命军向江苏进发时，时任团长的周碞利用野战工事成功阻击了国民革命军，保住了五省联军的后勤路线。后来，他参加了孙传芳军队的多次军事行动（包括1932年上海起义期间镇压工团主义者），并晋升为师长。\n\n随着八省联军规模的扩大，对精干指挥官的需求变得日益迫切。凭借着自身的赫赫战功和出众能力，周碞自然成为不二人选。§!\n\n§Y备注：周碞曾是周凤岐的得力部下，但他似乎对上级的政治事务缺乏兴趣。他的晋升仅仅是因为功绩而非裙带关系。§!"
 LEP_li_rentao_high_command_desc: "§Y生于：§!§L1904年；大清、云南省鹤庆§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L李忍涛生于中国最贫穷的地区之一，但这丝毫没有影响他出人头地。1920年，这名勤奋的学生毕业于家乡的一所师范学校，随后进入清华大学学习。因成绩优秀，李忍涛获公费资助出国留学，因此成为接受过最好教育的中国人之一。\n\n李忍涛的军事生涯始于1926年，当时他进入弗吉尼亚军事学院就读，在本宁堡的美国陆军步兵学校完成步兵训练，这对他的大多数同事来说都是遥不可及的，后来他又进入芝加哥大学学习。然而，他的海外学习生涯并未止步于美国，这名杰出的学员此后再次获得资助以继续学业，这次他前往普鲁士参谋学院学习化学和化学战，这是一种国内前所未见的新型战争形式。\n\n1931年与德国妻子一道回国后，在德国人的介绍下，这名军事天才随即进入孙传芳麾下服役。李忍涛现任军事教官，同时也是一支由接受过德国教育的军官组成的特种兵训练队的队长。§!\n\n§Y备注：这名身材魁梧，四方脸，浓眉大眼，英气逼人的将军是国内最著名（也许是第一和唯一）的化学战倡导者。他著有几本化学战教科书，并因其严格的纪律和训练而闻名，据传他的部队的座右铭是“我见，我到，我克服”。§!"
 LEP_xu_peigen_air_chief_desc: "§Y生于：§!§L1895年12月30日；大清、浙江省象山§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L徐培根幼年即因天资聪颖被乡里所知，作为一名优等生完成了基础教育，但因家境贫困无力继续求学。1909年，徐培根获举荐进入浙江陆军小学堂学习，后入武昌的陆军第三中学堂就读。辛亥革命期间，徐培根加入革命者一方，作为学生队的一员参加作战。\n\n辛亥革命后，徐培根于1914年报考保定陆军军官学校，入读第三期步兵科，与白崇禧同窗。1916年毕业后，他很快便升任军官。1919年考入陆军大学第六期，三年后毕业。毕业后分配到浙江陆军第一师第一团，1926年晋升为第二旅第四团团长。\n\n徐培根曾一度借调至孙传芳开办的金陵军校担任教育长，后调任陈仪麾下的浙军第一师。北伐战争期间，徐培根一直在前线作战，目睹了众多惨烈的血战。因他在北伐战争中的优异表现，1928年他与李忍涛等人获选官派普鲁士参谋学院深造，1931年回国后出任金陵军校校长，后又出任杭州笕桥中央航空学校校长。§!\n\n§Y备注：作为一名才干出众、受过良好教育的勤奋指挥官，徐培根没有特别的政治倾向。他专注于出版有关现代战术、军事科学和中国军事史的书籍。在德国参谋学院学习期间，他是班里最优秀的学生之一，一些德国军官称他为“东方毛奇”。§!"
 LEP_li_shijia_navy_chief_desc: "§Y生于：§!§L1894年；大清、福建省侯官县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L李世甲于1908年考入烟台海军学校第六期，学习军舰驾驶，辛亥革命当年毕业。他的军事学业并没有因大清崩溃而中断。李世甲于1913年进入南京海军军官学校（原江南水师学堂）学习两年，后于1915年远赴美国学习潜艇战。回国后，他先后出任海军部低级军官、北京政府参谋等职。\n\n即使中国海军在军阀混战中分裂成了多个派系，李世甲却作为杨树庄手下的低级海军军官紧随中央，盖因杨树庄与杜锡珪有关系，杜氏又与吴佩孚关系密切，杨树庄才稳固了在福建的地位。孙传芳自任联帅后不久，李世甲成为一艘小型炮舰的指挥官，该舰的历史可以追溯到自强运动。三十年代，李世甲作为杨树庄和直系的下属参与了多场冲突。经过一系列复杂的事件和冲突，李世甲成为孙传芳八省联合中一名冉冉升起的海军指挥官，尤其擅长非常规海战。§!\n\n§Y备注：作为一名致力于军事生涯的海军将领，李世甲没有强烈的政治主张。§!"
 LEP_wu_zhennan_navy_chief_desc: "§Y生于：§!§L1882年；大清、江苏省仪征§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L吴振南读完私塾课程后，15岁时考入南京水师学堂，认真学习了英语、算数、天文、航海等课程，各科成绩均名列前茅。在两艘船上实习过后，吴振南进入母校任教。远赴英国学习军舰期间，他曾跟随英国东方舰队游驶世界各地。\n\n回国后不久，吴振南受清廷派遣前往英国格林威治海军大学和朴茨茅斯的两所海军学校学习。再度归国后，吴振南一跃成为民国海军的中流砥柱，未来的许多海员皆出自他门下。辛亥革命期间，吴振南站在革命者一边，后出任临时海军协会会长，他的军衔也得以稳步晋升。\n\n出席斯帕和会时，吴振南坚决反对同盟国的帝国主义阴谋，但最终无力回天。后来，吴振南出任全国海岸巡防处处长，专管内海气象报告和海难船只救助报告。虽然他与八省联合的关系差强人意，但吴振南仍是上海之外，国家舰队中最有能力的海军将领之一。§!\n\n§Y备注：据称，吴振南曾慨叹：“日本海军中不少知名将领是与我一样在英国留学的。他们人才并不出众，但在日本海军中便能大显身手，而我们中国海军却无所作为，不战而败。弱国的人才不如强国的庸才，怎不令人沮丧？”§!"
 LEP_wang_shouting_high_command_desc: "§Y生于：§!§L1888年；大清、江苏省镇江§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L王寿廷毕业于南京江南水师学堂第六届驾驶班，后于多艘炮艇上担任大副。随着军衔逐步晋升，王寿廷出任第一舰队司令部副官，获海军上尉军衔，随后晋升海军少校。1916年获颁一等金色奖章，次年又获授五等文虎章。1918年，他出任舰艇指挥官，随即晋升海军中校，之后出任海军总司令公署参谋处参谋和海军部一等参谋。\n\n王寿廷之后又获三等文虎章，四等嘉禾章，并于1921年调任“永健”炮舰舰长。晋升海军上校后，他于1925年调往第一舰队司令部服务，1926年出任巡洋舰舰长。1927年北伐战争爆发后，他设法留任舰长，而非作为海军上校继续进入海军部工作。1932年，他升任鱼雷游击队司令，1934年出任海军事务处处长。他是一名毫不关心政治的海军军官，只希望能够继续他的职业生涯。§!"
 LEP_shen_jingchen_high_command_desc: "§Y生于：§!§L1881年3月11日；大清、福建省侯官县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L沈觐宸于1897年入福州船政学堂第六期制造班，1903年参加恩科会试，中举人，1907年任监察御史，1913年留学法国学习舰船及飞机制造，因大战转入瑞士洛桑继续学业，获飞机制造工程师学位后，历任驻英公使馆秘书、斯帕和会中国代表团秘书。1919年回国后，沈觐宸受聘为航运厅厅长，后转任海军制造学校校长。\n\n1921年，沈觐宸获授海军造械大监，后调任北京南苑航空学校校长，不久代航空署督办，1925年任马尾飞机制造处厅长，随即晋授海军造械主监，随后任海军部技正室技正和福州海军学校校长至1930年，现任海军部技监室上校技正。§!"
 LEP_tian_wenbing_sic_desc: "§Y生于：§!§L1891年；大清、河南省新乡县§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L为了维持生计，田文炳年轻时投考湖北武备学堂，1909年毕业后加入清军任排长。田文炳和许多同龄人和同学一样，强烈反对腐败无能的清廷，后于1911年武昌起义爆发时加入了革命军。民国时期，这名低级军官先是在家乡河南任参谋，1916年调任黎元洪总统府和总参谋部任低级军官。\n\n田文炳没有在北京任职太久，第二年便前往江苏任参谋，在那里结识了自己的上级、后来的江苏督军齐燮元。作为齐燮元部下，田文炳勤奋忠诚，在1924年的冲突中支持齐氏，后跟随齐氏流亡。《上海协议》签订后，齐燮元重返华东，田文炳现已成为齐氏最为信任的部下，他是少数始终追随齐氏的人之一。§!\n\n§Y备注：田文炳在齐燮元麾下时谨小慎微，很少质疑齐氏的决定，并且总是心甘情愿地支持并执行齐氏的命令。§!"
 LEP_chen_qixia_air_chief_desc: "§Y生于：§!§L1901年；大清、浙江省青田县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L陈栖霞是同龄人中的佼佼者，于1930年考入昆明的云南航空学校第一期，毕业后派往上海航空队，1932年赴巴黎航空学校深造，1934年回国后任杭州笕桥航空学校飞行教官至今。§!"
 LEP_wang_tianxiang_high_command_desc: "§Y生于：§!§L1909年11月26日；大清、浙江省黄岩县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L王天祥生于商贾之家，其父因敬仰民族英雄文天祥的民族气节故为其取名“天祥”。王天祥自幼聪颖、勤奋好学、热情豪爽，1927年中学毕业后考入南京陆军军官学校，后又转入南京航校，1932年以优异成绩毕业，分配到空军第二大队第二中队，不到两年就晋升为驱逐机第一中队副中队长，兼任母校南京航校教官。1935年，王天祥升任为空军第七中队队长，后升为第三大队副大队长。§!"
 LEP_lu_xiangting: "卢香亭"
 LEP_lu_xiangting_sic_desc: "§Y生于：§!§L1880年；大清、直隶省河间§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L1898年，卢香亭入北洋陆军速成学堂，是少数有幸由学校保荐官费留学日本的学生之一，先后就读于东京振武学校和日本陆军士官学校第六期骑兵科中国学生队。回国后，他担任新兵训练教官，后升为营长。\n\n卢香亭后来调任鄂军第二师，在孙传芳麾下任旅长，因战功卓著而声名鹊起，进而升任第二师师长，与卢永祥等人作战。\n\n1925年，卢香亭在孙传芳手下任职，为“笑面虎”巩固了浙、沪、皖三地的地盘，因功出任浙江督军。作为孙传芳的密友和知己，他的地位远高于夏超、周凤岐等地方军官，这引起了浙军军官的极大不满。\n\n夏超叛乱后，孙传芳和卢香亭任命陈仪为新任浙江督理，希望能让陈仪更加忠于联帅。北伐期间，陈仪和卢香亭奉命前往江西，从溃败的国民党军队手中夺回了南昌，甚至曾一度深入广东部分地区。\n\n北伐战争后，卢香亭致力于治理自己的浙江地盘，与当地士绅合作以促进经济发展，并资助扩充军事力量。上海起义后，他明确持反租界立场，因而深受浙江民众爱戴。§!\n\n§Y备注：卢香亭是孙传芳的结拜兄弟之一，两人在日本时相识。卢香亭一直是这位自负联帅的调停人，许多人认为卢香亭在联合里的权位仅次于孙传芳，甚至超过了总参议杨文恺。§!"
 LEP_hermann_kriebel_army_chief_desc: "§Y生于：§!§L1876年1月20日；德意志帝国、巴伐利亚王国普法尔茨行政区盖默斯海姆§!"
 LEP_country_intro_background: "GFX_LEP_intro"
 LEP_zheng_junyan_high_command_desc: "§Y生于：§!§L1883年；大清、直隶省宁晋§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L1905年，郑俊彦毕业于北洋陆军速成武备学堂，起初在直隶陆军小学堂担任教习，之后成为清军初级参谋。郑俊彦曾一度效力于曹锟的第三镇（师），但他在1916年被任命为浙军某团团长，隶属于旧皖系卢永祥将军麾下。1919年杨善德去世之际，卢永祥夺取了浙江的控制权，但他在1924年的江浙战争中被孙传芳所驱逐。\n\n战后，卢永祥下野，孙传芳就任督理，时任中将的郑俊彦及其部队遂被笑面虎收编入了新浙军中。在反奉战争中，郑俊彦作为苏军师长协助孙传芳和齐燮元从奉系军阀手中重夺江苏，此后孙传芳任命郑俊彦为江苏副督，协助齐燮元治理该省。郑俊彦曾短暂地参与过北伐战争，从国民党手中收复了江西省。§!\n\n§Y备注：虽然郑俊彦与齐燮元很少在江苏的治理事务上产生冲突，许多人（包括齐燮元本人）仍怀疑郑俊彦只是来负责协助笑面虎监督他这野心勃勃的副手的。§!"
 LEP_the_smiling_tiger_desc: "§L在一色花里胡哨的绰号诨名中，孙传芳的“笑面虎”绝对是对其统治的最好概括。一个“善良、诚实、真诚”的军阀，蔑视政客，亲近农民。笑面虎的面孔不止一副，而他的朋友也不止一个……§!"
 LEP_ma_xulun: "马叙伦"
 LEP_ma_xulun_bio: "马叙伦是浙江地方政坛的重量级人物，早年就读于杭州养正书院，并于1905年创办刊物，倡导反清革命。1910年，他加入柳亚子的革命文艺团体“南社”，次年随好友汤尔和前往东京。在东京期间，他托章太炎介绍加入中国同盟会，后返乡组建民团，响应辛亥革命，后来任浙江都督府秘书。\n\n此后不久，马叙伦前往上海，与章太炎共同创办了《大共和日报》，并于1913年成为北京大学教授。1915年，他辞去职务，返回浙江抗议袁世凯，后应蔡元培之邀再次回到北京大学，并代表北京大学教职员参加了一一·四运动，最终于1921年返回浙江，出任省教育厅厅长。\n\n1922年，马叙伦回到直系治下的北京，后两度出任教育部次长，也代理过教育部总长，期间曾掩护李大钊免遭迫害。他于1923年加入国民党，担任北京特别党部宣传部长。1926年，他公开谴责段祺瑞制造三一八惨案，随即逃往杭州，后因策动浙江省省长夏超响应北伐反对孙传芳而遭到五省联合通缉。\n\n随着北伐战争后的自由化时期到来，马叙伦重返北京大学，并参与组建全国各界救国联合会。回到浙江后，他开始倡导建立反帝统一战线，并一直是浙江政坛的核心人物，既赞同改良派，也支持革命者。"
 LEP_ma_xulun_leader_desc: "§Y生于：§!§L1884年4月27日；大清、浙江省仁和§!\n§Y背景：§!§L$LEP_ma_xulun_bio$§!"
 LEP_ma_xulun_advisor_desc: "§Y生于：§!§L1884年4月27日；大清、浙江省仁和§!\n§Y派系：§!§S全救会§!\n§Y背景：§!§L$LEP_ma_xulun_bio$§!"
 LEP_chu_fucheng_bio: "褚辅成于1904年进入东京警察学校就读，次年加入同盟会，后受命回国任同盟会浙江支部长。他曾在浙江多所学校任校长和教师，建立了各种革命小组，同时还积极推动浙江省的禁烟禁鸦片运动，后当选为浙江省咨询局议员，兼任嘉兴府商会总理，领导了浙江省的辛亥革命运动。\n\n辛亥革命后，褚辅成任政事部长，总揽民政、财政、交通、教育、实业和外交，1912年改任浙江民政司长，1913年当选国会众议院议员，后于1916年参加第一次恢复的国会，并与王正廷组织政余俱乐部。他还曾南下参加护法军政府，最终于1922年返回直系治下的北京。\n\n褚辅成反对曹锟驱赶大总统黎元洪，拒绝参加曹锟贿选，最终选择辞职，但在1925年出任段祺瑞主持的善后会议委员。1927年，他返回家乡任浙江省政府委员兼民政厅长，并因庇护朝鲜革命家金九免遭政治迫害而声名狼藉。他是浙江联省主义的主要倡导者，也是广受欢迎的联省派头面人物，在民间政治人士中拥有极强的号召力。"
 LEP_chu_fucheng_advisor_desc: "§Y生于：§!§L1873年5月27日；大清、浙江省秀水县§!\n§Y派系：§!§l浙江自治运动§!\n§Y背景：§!§L$LEP_chu_fucheng_bio$§!\n\n§Y备注：时人评价褚辅成为“貌虽文弱，有尚武精神”。§!"
 LEP_Tsingtau_Collaboration0: "青岛合作：有限"

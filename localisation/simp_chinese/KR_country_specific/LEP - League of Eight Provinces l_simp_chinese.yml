l_simp_chinese:
 League_of_Eight: "八省联合国策树"
 LEP_sun_chuanfang: "孙传芳"
 LEP_sun_chuanfang_bio: "孙传芳出身寒微，在丧父之后家道陷入赤贫。其姊被王英楷相中迎娶后，姐夫资助他考入了北洋陆军速成武备学堂，即后来的保定军校。在学习了两年步兵科后，他于1905年从学堂毕业，后前往日本陆军士官学校第六期中国学生队学习步兵科。1909年毕业后回国，在王占元麾下作为教官服役。1921年，王占元因其对湖北的高压统治崩溃而失势下野。孙传芳因而被纳入直系中的吴佩孚一支，并在1923年被吴佩孚派去接管福建。\n\n孙传芳在福建省立稳脚跟后，于接下来的两年中伙同直系军官齐燮元、陈调元夺取了浙江和南京，同时在江苏同山东督军张宗昌作战，最终将张督军赶回了山东。1926年，孙传芳趁势建立五省联合，自己则坐镇南京。北伐战争中，孙传芳从国民党手中重夺了南昌，并把自己的爪牙伸向了湘、桂、粤三省。\n\n北伐后，孙传芳与德国军事顾问团广泛合作，开展了军事现代化改革。尽管孙传芳也不愿看到德国的影响大规模扩散，但他还是允准了齐燮元在上海为几项与德国的剥削性的交易大开绿灯，同时又在1932年镇压了上海起义。孙联帅的野心使得他与吴佩孚在直系内部互相争夺影响力，这势必会成为一场塑造中国未来的冲突。"
 LEP_sun_chuanfang_leader_desc: "§Y生于：§!§L1885年4月17日；大清、山东省泰安县§!\n§Y背景：§!§L$LEP_sun_chuanfang_bio$§!\n\n§Y备注：孙传芳因其宽待农民、礼遇本地知识分子而在华东享有美誉。然而，他友善的面孔下却藏着一只咆哮的恶虎。§!"
 LEP_sun_chuanfang_commander_desc: "§Y生于：§!§L1885年4月17日；大清、山东省泰安县§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L$LEP_sun_chuanfang_bio$§!\n\n§Y备注：孙传芳因其宽待农民、礼遇本地知识分子而在华东享有美誉。然而，他友善的面孔下却藏着一只咆哮的恶虎。§!"
 LEP_qi_xieyuan: "齐燮元"
 LEP_qi_xieyuan_leader_desc: "§Y生于：§!§L1885年4月28日；大清、直隶省宁河县§!\n§Y背景：§!§L$LEP_qi_xieyuan_desc_body$与德意志帝国的支持，齐燮元与笑面虎孙传芳的亲密关系令他得以在孙联帅遇刺之后掌控华东五省。如今，华东失而复得，齐燮元要让华东牢牢存于他掌中，永不复失，为此，他将使出浑身解数，不择手段。§!"
 LEP_chen_yi: "陈仪"
 LEP_zheng_junyan: "郑俊彦"
 LEP_zhou_yinren: "周荫人"
 LEP_zhou_yinren_commander_desc: "§Y生于：§!§L1885年；大清、直隶省武强县§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L1904年，周荫人完成了他在北洋陆军速成武备学堂的炮兵科学业。冯国璋保送他就读于日本陆军士官学校第六期，他在那里继续炮兵科的学业。周荫人于1909年返回中国，在参加陆军处兵科考试之时结识了孙传芳。民国初年，周荫人曾在中央陆军中作为炮兵军官担任不同职位，并最终于1918年成为陆军少将。\n\n在周荫人驻军于湖南之时，周荫人为陈光远麾下，后陈光远赴江西担任督军。1923年，旧皖系省长王永泉宣告脱离直系军阀所主导的北京政府，而周荫人则被派往孙传芳麾下，参加从王永泉手中收复福建省的战役。孙传芳北上夺取浙江，又帮助齐燮元从奉系军阀手中夺取江苏，留下周荫人主政福建省。在北伐战争期间，周荫人成为国民党首当其冲的进攻对象，并且不得不北撤至浙江。\n\n然而，国民党的战力很快就瓦解了，周荫人夺回了福建省。周荫人因向当地人征收苛捐杂税而臭名昭著，这促使当地人为1932年上海起义后新近产生的国民党叛军提供协助。虽然周荫人名义上掌控全福建，但实际上他的权力主要集中于沿海地区和大城市。§!\n\n§Y备注：尽管孙传芳不太赞成周荫人主政福建时的操作，但周孙二人是多年好友，周荫人会全力支持联帅。§!"
 LEP_shangguan_yunxiang: "上官云相"
 LEP_shangguan_yunxiang_commander_desc: "§Y生于：§!§L1895年；大清、山东省商河县§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L上官云相幼时家境尚可，遂决心投身行伍。1910年，他进入山东陆军小学堂求学，又在数年后于武昌陆军第二预备学校深造，并最终于1919年成为保定军校第六期步兵科毕业生，完成了军事学业。随后他投奔孙传芳湖北军麾下，当了名排长。在“援湘”战争中，上官云相作为张怀芝手下一名团长，与南方的革命军作战。\n\n数年过去，上官云相在北伐前夕升任师长。在北伐战争期间，他把曾经击败过吴佩孚的国民革命军第四军打得丢盔弃甲。这场胜仗得到了孙传芳的嘉奖，因为这证明八省联军相比吴佩孚的洛阳中央军更加出色。§!\n\n§Y备注：上官云相被誉为孙传芳麾下最能打仗的部将，这位笑面虎对他赞不绝口。§!"
 LEP_zhou_fengqi: "周凤岐"
 LEP_zhou_fengqi_commander_desc: "§Y生于：§!§L1879年；大清、浙江省长兴县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L1900年，周凤岐参加县试通过，并成为了一名秀才。1903年，他入学浙江武备学堂，并于两年后毕业。1906年，周凤岐结识了秋瑾，秋瑾邀请其加入反清革命组织光复会。1907年，周凤岐成为浙军的一名队长。周凤岐于1909年入学保定的陆军行营军官学堂（后为陆军大学），他不久后即肄业并于1911年返回浙江。在辛亥革命之时，他率领一千人攻打孝陵卫，击毙清军将领王有宏。\n\n民国初年，浙江政局动荡，都督之职数易其手，而周凤岐也多次扮演着拥立者的角色。然而，浙江的持续动荡却对周凤岐造成了反作用，导致了浙江落入旧皖系将领杨善德的操控之下。周凤岐因而被迫流亡日本。两年后，杨善德去世，由卢永祥接任。卢永祥允许周凤岐与夏超返浙任职。\n\n1924年，正值卢永祥与孙传芳进行江浙战争之际，周凤岐与夏超图谋推翻卢永祥，并试图确保浙江的独立地位。孙传芳拉拢这二人，并任命夏超为省长，但同时加强了对该省的控制，这导致了夏超试图发动反叛，而孙传芳则以陈仪取而代之。为使周凤岐远离浙江，孙传芳任命他为南京卫戌司令，后来还让他参与镇压上海起义。§!\n\n§Y备注：周凤岐是浙江自治运动的狂热支持者，他对“笑面虎”怀恨于心，因为孙传芳不仅将浙江牢牢控制在联合掌中，还将他调离了心爱的家乡。§!"
 LEP_tang_enbo: "汤恩伯"
 LEP_tang_enbo_commander_desc: "§Y生于：§!§L1900年9月20日；大清、浙江省武义县§!\n§Y派系：§!§c浙系§!\n§Y背景：§!§L汤恩伯生于一个小村子里，当清帝被推翻而民国成立之时，他还只是个小孩子。1919年，他进入援闽浙军讲武堂修习，成为了一名士兵。在毕业后，汤恩伯效力于陈仪麾下，后来陈仪成为了他的恩师。在浙军被击败后，汤恩伯返乡并成为了一名警察所巡官。1921年，汤恩伯作为一位武义富商之子的旅伴，和他一同前往日本。\n\n翌年，汤恩伯被明治大学录取，并进修政治经济学。因资金不足，汤恩伯肄业并回到中国筹集资金，经陈仪保送入日本陆军士官学校第十八期中国学生队学习步兵科。在学校中，汤恩伯潜心学习陆军理论，他因此脱颖而出，受到了孙传芳的赏识。1926年毕业归国后，汤恩伯以参谋官的身份效力于陈仪的浙军，并与王竟白结婚。§!\n\n§Y备注：汤恩伯是一颗冉冉升起的新星，在浙军中广受尊敬，且他以喜欢用现代通讯设备遥控而非下到前线指挥军队而闻名。\n他还有个绰号是“铁人”。§!"
 LEP_shi_yousan: "石友三"
 LEP_shi_yousan_commander_desc: "§Y生于：§!§L1891年；大清、吉林将军辖区九台§!\n§Y派系：§!§L“无派系”§!\n§Y背景：§!§L石友三生于长春的一户贫寒家庭，在结识一户富庶人家后才得以入小学读书。然而，为了加入驻扎长春的北洋军吴佩孚部，他放弃了学业。民国建立后，石友三离开吴佩孚部转投冯玉祥。在冯玉祥麾下，他结识了后来成为他结拜兄弟的高树勋。\n\n1926年直奉战争期间，国民军腹背受敌，石友三背着冯玉祥与阎锡山讲和，导致冯军溃败，冯玉祥只得逃往陕西寻求阎锡山的庇护。北伐战争开始后，他随即加入国民党一方。国民党垮台后，他又逃回了冯玉祥处。\n\n石友三曾向冯玉祥跪地求饶，冯氏极不情愿地原谅了他，但在此之前，冯氏将忠实干将李秉璇派到石友三手下，让李氏监视他。石友三后来活埋了李秉璇以表明态度。当直系在第三次直奉战争后东山再起时，石友三再次背叛冯玉祥，回到了吴佩孚麾下。然而，他又在随后的第四次直奉战争中背叛了吴佩孚，重回冯玉祥帐下。\n\n吴佩孚大获全胜后，石友三第三次背弃冯玉祥，试图重回吴佩孚一边。然而吴佩孚深谙石友三本性，因此把他派到了孙传芳那里，笑面虎对此很是恼火。在联合中，石友三发现德国支持能给他带来不少好处，但谁又知道他会在什么时候再次背叛……§!\n\n§Y备注：他在短短三年内三次背叛冯玉祥，先后投靠吴佩孚、冯玉祥、蒋介石、阎锡山、孙传芳，而又背叛之，因此被时人讽称为“倒戈将军”、“五姓家奴”。§!"

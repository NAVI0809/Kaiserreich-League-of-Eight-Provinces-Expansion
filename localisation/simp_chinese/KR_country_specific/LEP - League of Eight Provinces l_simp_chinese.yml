 LEP_rural_banditry: "乡间匪患"
 LEP_rural_banditry_desc: "各省的普遍动荡，加上各地的内战，在各地造成了严重的动荡。土匪开始武力对抗政府，其中不少人属于逼上梁山。现在他们正在聚集在一起，并在我们北部各省造成了极大的混乱。如果我们不迅速将其镇压，那么当地的秩序只会更加混乱。"
 LEP_joint_training_with_beijing_idea: "与中央军联合训练"
 LEP_joint_training_with_beijing_idea_desc: "在我们重新回到广大的直系家族后，[LEP.GetLeader]联帅希望与吴佩孚、王承斌两位大帅的中央军共同进行联合演习。联帅希望能走出一步向现代化的进步，完成孙传芳的未竟之业，同时亦期望让那不守规矩的联军能效法中央军的纪律。"
 LEP_open_door_policy_with_beijing: "对北京方面打开大门"
 LEP_open_door_policy_with_beijing_desc: "北直系的领土蕴藏着巨大的利润，湖北和直隶两省的工业重镇承载着中国一些最具经济生产力的城市。而同样的，联合内部亦有江苏、安徽和浙江三个优秀的省。如果直系集团想经受住时间的考验，就必须要整合双方经济，对双方商人展开欢迎的双臂。"
 LEP_formenting_pro_german_intellectuals: "培养亲德知识分子"
 LEP_formenting_pro_german_intellectuals_desc: "一代奇人厉麟似在联合圈子内掌控着一个相当显赫的知识分子圈，与北京的顾维钧等人以及不少国会成员关系密切，甚至在柏林也有不少人脉。借助他的景星会，我们可以进一步讨好德国人来换取更多支持。"
 LEP_eight_provinces_allied_armies: "八省联军"
 LEP_eight_provinces_allied_armies_desc: "为遂其一统东南之志，孙传芳创立八省联军，其前身为江浙联军，诞生于1924年爆发的江浙战争。由孙齐二位督军共创的联军大业一开始以齐督黯然下野为结局，然而孙传芳势力仍存，在曹锟和吴佩孚的关照下韬光养晦。在夺取南京并控制福建与浙江后，孙传芳将方本仁和邓如琢劝入联军，并与陈调元进行了类似的谈判。在与驻苏奉军的张宗昌大战一场后，孙传芳得以建立了包含浙江，福建，江苏，安徽以及江西的五省联合体系，宣告他的联军大功告成。\n\n彼时的省长即陈陶遗、夏超、王朴、李定魁和萨镇冰均已与联合分道扬镳，但联帅孙传芳尚在。北伐战争一役的冲击所遗深远，如今的八省联合（在1928年得到湖南、广东、广西加盟后）组织松散，最近加入的三个省份仍在很大程度上保留了自己的军队。尽管孙传芳自身在南京有亲军相伴，东部省份也不过是表面上服膺于联帅。以上林林总总构成了一支勉强称得上现代化的势力，与中央军分庭抗礼。\n\n馨帅不死，联军永存！"
 LEP_the_disunited_armies_1: "联而不合"
 LEP_the_disunited_armies_1_desc: "八省联合如今正面临一场灾难！在暴动者跨省连县，监事会又无视联帅权威的处境下，陈调元督理悍然宣布脱离八省联合！地缘上的恶劣现状也反映在了八省联军的处境上。士兵哗变，西部三督与南京若即若离，国民党势力日益高涨，南京上空黑云压城。然而笑面虎屹立不倒！无论首末，一切叛徒都将直面东南之虎的怒火，只要馨帅一息尚存，联合就不会倒下！"
 LEP_the_disunited_armies_2_desc: "通通都是叛徒！孙传芳倒下后，齐燮元正式成为了五省联军总司令。与孙传芳相比，齐燮元既缺乏个人魅力又缺乏军事才能。作为江苏督理，他除了自己的直属士兵外几乎指挥不动任何人。大部分笑面虎的亲密同事只是害怕被处决才不得不站在齐燮元一边苟全性命，五省联军的团结岌岌可危。"
 LEP_the_disunited_armies_3_desc: "在向他的“亲密”同事展现了他对于让南直系再度伟大的事业的一片“真心”后，齐燮元终于让事态稍微平息了下来。尽管这样的联军还称不上团结，但各方面已经开始为联帅服务，这不仅是为了生存，也是为了齐燮元许下的复兴联合的愿景。不过，在许多人眼里，他仍是个讨人嫌的混蛋。"
 LEP_eliteheer: "精兵之荣耀"
 LEP_eliteheer_desc: "显而易见，我们的德国靠山凭借其谨慎的智慧、诡谲的外交手腕以及无双的军队取得了对全世界的主导。如果我们想向重组的德国军事顾问团学习这些智慧的哪怕一丝一毫，我们都必须完全接纳他们的思维方式。事实上，联军一直以来都是一支劲旅，毕竟联军中的大部分指挥官都受过日本军校或保定军校的高强度训练。然而，还有一部分指挥官却是靠着裙带关系做到了这个位置，他们对联军的危害不可估量。\n\n打造一支足以威震军阀、抵御外敌的现代化精锐部队无疑任重道远，但是放眼整个华夏，也没有哪股势力比联军更有条件带领着中国军队走向现代化。"
 LEP_engineering_corps_1: "工兵队优先"
 LEP_engineering_corps_1_desc: "虽然过去工兵部队的必要性常遭遗忘，但在现代战争中，工兵部队的重要性无与伦比。在欧洲战场上，工兵部队被用于防止全面崩溃和实现出奇制胜，使步兵部队能在这个属于装甲巨兽的时代下继续发挥作用。诸省联合背负着将现代工业化战争带到中国的使命，我们的工兵必须竭尽全力、不辱使命，用自己的造物在战斗中创造优势。"
 LEP_german_equipment_support_1: "军工协奏"
 LEP_german_equipment_support_1_desc: "为了真正地确保在与我们的敌人（无论是军阀还是外来帝国主义者）的较量中占据上风，诸省联军必须能够充分动员其全部军事力量，发动一场压倒性的战争。通过国家精心发展的重工业、通讯和航空运输，我们将以德国总参谋部为蓝本打造一支真正的现代军队。通过与使馆城市和柏林的联系，我们将努力吸引外国军工专家来帮助我们实现宏伟目标，提供资金与援助。将我们那薄弱的工业蜕变为一场雷霆万钧的火力交响乐，以确保诸省联合永不崩溃！"
 LEP_pinnacle_army: "五省联军"
 LEP_pinnacle_army_desc: "五省联军是我军的正式名称，其由笑面虎孙传芳于十年前组建，由各省督理担任本省部队的总指挥，各自指挥着众多下属，并向联军总司令即联帅俯首效忠。尽管五省联军人多势众，却被人数占下风的国民革命军打得丢盔卸甲。那些黄埔军人不断地击败了我们的五省大军，最后在德国干涉面前才败下阵来。\n\n新生的德国顾问团带着彻底的现代化方案来了，他们用一段时间对旧五省联军进行了认真而彻底的改革、分析和重建，如今新生的五省联军才真正代表了中华民族的军事现代化与军人精神的最高水平。新生的五省联军装备了德国军械，练习机动战术，以精锐突击队为战术核心。我们将把现代战争带到了中国战场，把工业和钢铁的交响曲带到中华大地。"
 LEP_nanjing_airforce_1: "中国空军的摇篮"
 LEP_nanjing_airforce_1_desc: "杭州笕桥机场原址为清军八十一标马队及炮营校场，1930年，孙传芳联帅在笕桥机场创建了联军空军。1931年，他在原校场地块建设简易机场，将南京航空学校由南京迁到此地。航校内建有机场、弹油库、机修厂、飞机制造厂等军事设施区，西部则是教学生活区。笕桥机场培养了五百余名毕业生，被外国观察家称作“中国空军的摇篮”。随着联合再度开始空军建设，笕桥机场又一次受到了重视，诸省联合作为全中国工业化程度最高的地区，其空军也无疑将成为中国空军的先驱。"
 LEP_nanjing_navy: "福建水师"
 LEP_nanjing_navy_desc: "传奇的福建水师系历史悠久。在洋务运动的推动下，不甘心在技术兵种层面落后西方的闽浙总督左宗棠1866年于福州建设了一系列造船厂，并选择马尾作为造船厂的厂址，福建的航海文化由此开始逐渐融入并主导了海军。\n\n福建船政学堂成为了中国海军的摇篮，该校开设有多个学科，包括船只的制造、驾驶、管理和设计。该校学生由外国顾问教导，全面地学习法国造船技术与英国海军技术。福建船政学堂也是现代中国第一所新式军校、第一所职业学校和第一所海军学校。\n\n尽管福建水师在19世纪末和20世纪初两度灭亡，但福建水师系依然坚持不懈，现在他们将再次高举中国新兴海军力量的旗帜。"
 LEP_disrupting_their_supply: "破坏敌方补给线"
 LEP_disrupting_their_supply_desc: "诸省联军非常清楚游击战是如何破坏军队补给线的。面对数量多达三倍于己的联军，国民革命军能利用机动游击队巧妙地摧毁我方的围剿行动，让我们装备精良的闽军与赣军全无用武之地。而他们的骚扰行动可以为未来的我们好好上一课。当侵略者进犯我们的土地时，我们可以把整个诸省联合变成战场。以正合，以奇胜。"
 LEP_purging_anarchy: "清除“无序”"
 LEP_purging_anarchy_desc: "那个该死的笑面虎的朋友真他妈的多！哪怕这王八蛋已经永远闭上了眼，他的眼线还死死盯着我们。他的走狗和亲信们对新任联帅充满了怀疑和愤怒，不过，齐燮元完全不介意再弄脏一次双手。是时候整顿军队，切断军队与笑面虎的联系了，不能再让旧联帅危害新联合。"
 LEP_totalist_party_long: "中国国民党 - 十人团\n§L“十人团”起源于戴春风个人的黄埔校友小圈子，该组织带有极端民族主义与军事主义色彩，与八省联合内部以及上海的许多有组织犯罪集团都有联系。利用黄埔校友间的联系和戴春风在上海地下组织中的旧关系，十人团已经成为国民党内部一支强大的力量（尽管规模很小）。但对我们而言，戴春风及其同党是我们的头号通缉要犯。\n\n戴春风精通各种间谍活动，对严刑拷打和残忍谋杀等手段无所不用其极。他利用南方的闽赣叛军的活动，不断扩大自己与八省联合内各省地方县长和低级官僚的联系。万幸的是，十人团尚不构成真正的威胁。随着我们在南方持续的猛烈围剿和对叛匪的严厉镇压，得不到国民革命军支持的十人团不过是无根之萍。但这并不妨碍他们困兽犹斗。§!\n"
 LEP_syndicalist_party_long: "中国工团主义者同盟\n§L受到省港大罢工胜利的鼓舞，各路社会主义领导人于1925年10月10日在上海会面。继中国现代史上首次成功的劳工运动之后，中国工团党又创建了中国工团主义者同盟，与法国社会主义政治的多元性质遥相呼应。\n\n该组织将许多国民党外的社会主义和左翼团体团结起来形成了一个紧密的联盟，其成员包括上海工团联合会、世界社、无政府主义者同盟（在广州本地又称AF）、委员会共产主义者、民铎社、工团主义学说研究会、中国青年无政府共产主义者联合会等，以及其他一些较小的社会主义、无政府共产主义者、共产主义者和其他左翼团体。总的来说，这是一个庞大的联盟，包括了自由意志社会主义者和那些受到列宁主义等更威权的社会主义思想影响的人。§!\n"
 LEP_radical_socialist_party_long: "中国国民党\n§L北伐战争失败后，许多人逃往国外，但也有许多人选择留在人民身边，转入地下抵抗直系军阀的压迫。最初，这些残部由李济深将军领导，通过进出上海的地下交通线进行活动，但由于1932年起义失败，部队不得不向南退往闽赣地区。\n\n在群山中，宋庆龄、邓演达等人发表了《对中国及世界革命民众宣言》，宣布成立国民党临时行动委员会，自主处理根据地事务。由于这一点，再加上与汪精卫流亡政府间的联系减弱，闽赣根据地的干部们具有相当的独立性，即使现在国民党已经再次合为一体，情况依然如此。\n\n虽然国民党在八省联合内部的影响力已经不复往日，但它的幽灵依然在这片土地上飘荡。通过与青帮、十人团间的非法联系，以及闽赣根据地战士们的坚定决心和顽强毅力，孙中山先生的事业将在逆境中继续下去。§!\n"
 LEP_social_democrat_party_long: "全国各界救国联合会\n§L全国各界救国联合会是一个上海左翼知识分子团体，其八省联合分部由沈钧儒领导。1928年，在《上海协议》签署后，上海掀起了反帝浪潮，全救会随之成立。紧接着在1929年，由于厌恶直系对租界问题的冷漠态度，他们加入了在北京的帝国宪政会，试图建立一个反和谐社团的反对党集团。\n\n全救会只是一个由知识分子组成的小利益集团。其在北京的势力远比在南京的势力大：由于他们反对继续对德合作和张扬的贪污腐败，全救会在八省联合政坛内基本可说是毫无影响力。然而全救会愿意在反贪污腐败的前提下接受威权政府的领导，因此在孙传芳个人看来，这些人还是值得尊重的。然而在联帅是不是一个单纯的军阀这点上，全救会内部也争论不休，恐怕在八省联合能采取某种全新的合法治理形式之前，他们是不会愿意与八省联合本身合作的。§!\n"
 LEP_social_liberal_party_long: "浙江自治运动\n§L浙江自治运动是中国一种鲜为人知、颇为奇特、带有折中色彩的联省运动，也是浙江省宪政派、联省派和民主统治的前台门面。该运动起源于晚清的维新派，在浙江省谘议局成立后发展壮大，在辛亥革命时的杭州起义中进一步引起人们的关注。\n\n1912年，浙江省府颁布了浙江省宪及多部地方法规，使浙江成为了中国联省理想原则的发源地。然而，在朱瑞出任浙江都督后，浙江自此进入了一段军事统治时期。屈映光和朱瑞支持袁世凯复辟后，浙江的军事和民政部门变得愈发保守和分裂，导致浙江自治运动一度在省议会中销声匿迹。\n\n二十年代，浙江再度繁荣昌盛，并以湖南为榜样开始起草自己的省宪。然而，这项工作却被省内的军事主义者搁置了。后来，孙传芳重建了浙江省府，并利用浙江自治运动作为自己的统治工具。不过孙传芳更喜欢该运动的知识分子，而非与之相关的政客。§!\n"
 LEP_social_conservative_party_long: "江南商帮\n§L江南商帮代表着长江下游（江南）中国本地银行、企业和商会的利益，由一众铁路股东、商人和当地企业家组成。他们与盘踞多省的庞大农村地主集团关联紧密，在联合政治中扮演着次要角色。为了对抗无处不在的德国影响，联帅试图将商帮拉拢到自己这边。孙传芳对他们的看法是，一旦自己想要摆脱德国控制，商帮就要准备好采取行动。\n\n江南商帮最大的敌人是进步派和亲德派，这些敌人总是报团取暖，江南商帮就经常遭到浙江自治运动以及李忍涛和齐燮元等亲德派军官的骚扰。尽管如此，商帮仍然控制着联合中非德控工业和经济的相当一部分，并对租界派势力的任何进一步蚕食保持着警惕。\n\n不过商帮并非软弱无力，在江苏省商会、无锡商会和苏州地产商会等团体的共同支持下，江南商帮的话事人兼非正式领袖荣宗敬正呼吁实行有原则的工业化。§!\n"
 LEP_authoritarian_democrat_party_long: "景星会\n§L景星会来自特立独行的厉麟似的个人创意，这是一个新近成立的结构松散的协会，其成员包括众多亲德知识分子和在德国受过教育的官员或作家。景星会于1935年在南京成立，主要成员包括蒋复璁、滕固等人。该组织旨在进一步发展中德间的文化经济关系，与孙传芳各省府的官员以及北京的繁荣联盟、和谐社团等组织间有着广泛的联系。\n\n然而，与繁荣联盟相比，景星会的思想要独立得多，对中德关系也有着独特的见解。在景星会看来，中国不仅是德国企业的经济市场，更是平等的合作伙伴。每当接待德国官员或专家时，景星会都会站在最前排——然而他们往往会被迅速赶走，以便让来访者与繁荣联盟进行交谈。\n\n景星会在八省联合中扮演着中德关系间中方代言人的角色，并致力于在中欧同盟内传播中国文化和科学。§!\n"
 LEP_paternal_autocrat_party_long: "南直系军阀\n§L南直系军阀是直系军阀的分支，其形成可以追溯至王占元等人。王占元是冯国璋的重要盟友和支持者，在湖北省内建立了牢固可靠的盟友关系。他与江苏督军李纯、江西督军陈光远并称为“长江三督”。直皖战争后，王占元达到了权势巅峰，但因其残酷的高压手段，最终导致他在湖北的统治土崩瓦解。\n\n王占元遭赵恒惕驱逐后，南直系领袖之位便落到了他的老部下孙传芳身上。吴佩孚后来提名臭名昭著的“笑面虎”孙传芳接替王占元，孙氏在第一次直奉战争后彻底融入了直系。孙传芳此后掌控了福建一省，又在江浙战争中支持齐燮元，随后将浙江也纳入了他的势力范围。\n\n击败张宗昌和杨宇霆后，孙传芳的南直系控制了江苏、安徽、江西、福建和浙江，组成了五省联军，即后来八省联合的前身。尽管在北伐战争中遭受重创，但南直系迅速恢复了元气，并与北直系展开军备竞赛。孙传芳一直在等待时机，后于1928年组建八省联合，对玉帅构成了直接威胁。然而南直系的统治相当混乱无序，完全依赖于孙传芳齐燮元两人的个人权威。§!\n"
 LEP_national_populist_party_long: "中国青年党\n§L中国青年党是学生组织“少年中国学会”的后继者之一。少年中国学会分裂成了曾琦与李璜领导的民族主义派、李大钊领导的社会主义派与王光祈领导的理想主义派，随后，曾琦、李璜等民族主义派成员前往法国留学，并与周恩来、蔡元培、李石曾等留学生发生了激烈冲突。\n\n由于中国工团党的支持者增加，变得越来越暴力，曾琦和李璜决定成立自己的党派，于1923年在巴黎市郊成立了中国青年党，随后在留学生中快速扩张。1924年，青年党坚决反对国民党主导的国工合作，他们回到上海，创办了一系列政治社团与报刊。\n\n青年党得到了孙传芳势力的礼遇，而后北上参加北京的国会。但他们将自己最为残忍的成员留了下来：“断头台将军”李宝章。李宝章现在是孙传芳指挥的八省联军中的一位重要军官，也是青年党在八省联合内不可或缺的地方领导人。作为青年党在东南地区的名义领导人，李宝章执掌下的青年党快速成长并实现了军事化，而这完全违背了他在北京的上司们所坚持的议会主义思想。§!\n"
 LEP_the_marshal_stands_triumphant: "联帅大获全胜"
 LEP_the_marshal_stands_triumphant_desc: "追随陈督理的那些狂妄蠢货和国民党的混账亡魂以为他们可以取代八省联合！但不可否认的是，我们已把他们打回原形！随着孙传芳联帅不幸身故，齐燮元正式就任联帅，我们有责任继续“笑面虎”的未竟之业。"
 LEP_two_marshals_under_the_sky: "天下可容两帅"
 LEP_two_marshals_under_the_sky_desc: "前任联帅孙传芳的处境很奇妙，表面上他是玉帅的得意门生，但却未能成为玉帅钦定的后继者。因为他与中央过于疏远而无法取信于其他北直系人士。而齐燮元不一样，他可是一只难以捉摸的变色龙。现在，玉帅与联帅将心连心，一同重建中国秩序，维护直系霸业！"
 LEP_deepen_the_zhili_schism: "加深直系分裂"
 LEP_deepen_the_zhili_schism_desc: "背信弃义的北直系认为他们的南方兄弟只不过是些无足轻重的远房暴发户！他们只把我们看做他们手上的一颗棋子，但他们错了。孙传芳给我们留下了实现愿景的合法性，而我们将成为北洋传承的真正继承人。南都已在我手，我们一往无前！"
 LEP_joint_training_with_beijing: "与北京联合训练"
 LEP_joint_training_with_beijing_desc: "我们的许多指挥官确实可以从北方同行那里学习到许多军事知识还有专长。我们的金陵军校相比保定军校就如同萤火之比皓月。就算从个人角度来讲，我们许多的高级指挥官也没接受过正式的军事教育。通过这次联合演习，直系肯定能有所自我提升。"
 LEP_negotiate_with_the_nationalistic_elite: "与民族主义精英谈判"
 LEP_negotiate_with_the_nationalistic_elite_desc: "民主科学座谈会由居住在上海和北京的自由派、民族主义与进步知识分子所组成，是个受人尊敬的团体。尽管他们鄙视直系对治下省份的独裁统治，与我们相看两厌。但出于谨慎考虑，我们仍有必要披上真诚意图的外衣，将这些能言善辩之人带到谈判桌上。"
 LEP_utilize_the_jingxing_society: "利用景星会"
 LEP_utilize_the_jingxing_society_desc: "厉麟似或许是南京幕僚中最不同寻常的知识分子之一，他本人年轻、机智又充满活力。他麾下的景星会则代表了那些对直系更为宽容的知识分子和老百姓的利益，而作为回报，他们希望政府继续深化对德关系。现在，我们被大多数人嗤之以鼻，他们的支持对我们的未来大计可谓是无价之宝。"
 LEP_foster_economic_cooperation: "促进经济合作"
 LEP_foster_economic_cooperation_desc: "在联帅地盘上广泛分布且不断壮大的德国投资带来了种种好处，其中最为突出的便是让我们的经济潜力落到实处。尽管地有贫富，正如浙江和福建之间仍有天堑之隔，与北京的合作也令我们内部的经济整合愈发紧密，也许有朝一日我们将拥有自己的黄金水道。"
 LEP_end_southern_intransigence: "消灭南方强硬分子"
 LEP_end_southern_intransigence_desc: "在八省联合的至暗时刻，湖南、广东和广西的省督们选择与我们断绝关系。自从这些南方人非正式地加入八省联合以来，他们一直与我们若即若离，心里打着将来兵强马壮时来进犯我方领地。我们要想保住基业，就必须先下手为强！"
 LEP_secure_german_support: "确保德国支持"
 LEP_secure_german_support_desc: "啊，亲爱的德国盟友，真挚的德国友谊！没有德国人的支持，诸省联合就只能依赖北京内部的阴谋诡计。为了实现我们的宏伟抱负，我们需要更强大的支持。我们可以通过已经建立的联系来增加德国的援助，帮助我们重建经济和军事。作为回报，我们将确保他们在中国的影响力。"
 LEP_heir_to_the_jade_marshal: "接班玉帅"
 LEP_heir_to_the_jade_marshal_desc: "果然南直系才是玉帅大业的继承人啊！吴佩孚大帅曾经看上了孙传芳，又或者对那弱小的白坚武有些想法，但如果没有伟大的齐燮元联帅，直系很可能会亡在国民党或奉系军阀手中。玉帅本人显然已对此心知肚明，北京当然要给予我们应有的尊重。"
 LEP_last_son_of_the_family: "南直代北"
 LEP_last_son_of_the_family_desc: "北直系已经抛下所有伪装，背弃了冯国璋的事业！所谓的“主系”固守门户之见，切断了所有旁系恩庇网络！但李鸿章的继承人绝非吴佩孚、曹锟、王承斌之辈，而是我们这些南方人！我们才是中国俾斯麦真正的传人！我们建功立业的雄心日益增长，是时候挥师北上了……"
 LEP_crack_down_rural_bandits: "镇压乡间土匪"
 LEP_crack_down_rural_bandits_desc: "日复一日，农村的土匪，其中一些人甚至曾是士兵，让我们治下的民众和官员不得安宁，以“红枪会”和“一贯道”为代表的地痞流氓仍在横行霸道。如果我们想要遏制他们的暴行，就必须发动一次类似于围剿的正式镇压行动。"
 LEP_fallout_of_the_league_war: "华东混战的余波"
 LEP_fallout_of_the_league_war_desc: "谢天谢地，联合最黑暗的时刻终于过去了。纵使那该死的暴发户、桀骏不驯的陈督理认为自己可趁此一举击败联帅，以及那南方的国民革命军残部亦认定此为其最后的机会。然而联合得以渡过风暴。而现在，是重建的时间了。"
 LEP_reinstill_discipline: "重拾“纪律”"
 LEP_reinstill_discipline_desc: "随着在联合内部失去任何表面上的权威，很明显，若无笑面虎的机智、关系和德高望重，各省军只不过是些自私自利的流氓。由于华东混战大抵是我们迄今为止最糟的一次表现，联帅必须巩固他作为各省军最高指挥官之权威。"
 LEP_recoup_the_lost_divisions: "重整残师"
 LEP_recoup_the_lost_divisions_desc: "于联合崩溃期间，因为陈督理那影响深远的叛乱，一些旧联合部队也随之叛逃。由于我军一些部队已投奔皖军，甚至是国民党，我军各阶官兵编制皆出现了不少空缺。为重建联合，必先重建军队。"
 LEP_eliteheer_model: "精兵模范"
 LEP_eliteheer_model_desc: "对诸省联军来说，能成为德国军事顾问团的实际试验场并从中获益，实为幸运且明智。我们将与德国顾问密切合作，而不会像吴佩孚那样横加干涉，也不会像湘粤两省那样只提供一些微不足道的帮助。北京并非中国精兵的真正摇篮，南京才是！"
 LEP_new_model_officer: "新模范军官"
 LEP_new_model_officer_desc: "德国军官团无疑是当世翘楚。在世界大战中，德军取得了最辉煌的胜利，如果没有一支庞大的出色军官团来执行每个作战计划，德军绝无可能取胜。如果我们想在战场上取得胜利，就必须重启德国军事顾问团，并提升“新模范军官”的作用。"
 LEP_innovation_breeds_victory: "出新制胜"
 LEP_innovation_breeds_victory_desc: "现代坦克、现代飞机、现代舰艇还有现代枪炮，此乃德国制霸国际战场的关键所在。同样，在尖端装备方面尤为落后的中国军队必须进行现代化。此事务必快马加鞭，不得怠慢。如若想扭转战局，就必须在现代军备竞赛中加快发展步伐。"
 LEP_staff_officer_school: "参谋学校"
 LEP_staff_officer_school_desc: "无论是将军还是士兵，都不能单枪匹马取得胜利，处于二者之间的军官团和基层指挥官才是战斗中率部冲锋的人。军官们担负着协调地面作战的任务，他们必须遵循整体战略目标，因此战术方案最好由他们来制定。我们必须培养我军军官的基层指挥能动性，这样才能确保联合不会因优柔寡断而一败涂地。"
 LEP_thorough_logistics: "依靠后勤"
 LEP_thorough_logistics_desc: "在那些宏大的战略举措和大胆的战术实施的喧嚣中，往往最容易被遗忘的是那些幕后工作，正是参谋官确保了我们勇敢的士兵手中会有充足的枪支和弹药。中国的后勤基础设施的确不如欧洲完善，但联合仍将率先采用现代化的后勤方式。"
 LEP_disrupting_supply: "袭扰补给线"
 LEP_disrupting_supply_desc: "既然我们深谙补给充足的重要性，那就必须让敌人的补给线变得尽可能脆弱和透明。士兵的坚韧和指挥官的英明可以赢得一次战斗，但一场战争的胜败则是由一支军队持续作战的能力决定的。"
 LEP_overtures_to_berlin: "示好柏林"
 LEP_overtures_to_berlin_desc: "重建联军的工作一直在按着原“80个师计划”有条不紊地进行，而现在也许就是重组德国顾问团的最好时机。为了能真正效仿这支常胜之师，我们迫切需要其谦逊仆人和战士的经验与智慧。靠着我们和景星会的联系，我们应该立刻向柏林方面提出申请。"
 LEP_raining_thunder: "雷霆万钧"
 LEP_raining_thunder_desc: "德国人的经验已证明——炮兵乃战争之王。无论在中原地区还是沿海地区，一切的战斗皆以火炮的口径来定胜负。一支火炮口径更大、操作人员更优秀与指挥官更干练的部队肯定天下无敌。凭借德国顾问所传授的经验，我方工业将最大限度地提高火炮的生产效率。"
 LEP_emphasising_mobility: "强调机动性"
 LEP_emphasising_mobility_desc: "所有中外现代军事理论家，皆明白一个真理，那就是运动战的重要性。若情况允许开展华丽的战术机动，就能以微薄的力量钳制与包围比其更多的敌手，令其规模变得毫无意义。同理，若保有机动性，就可以在占据大片领土的同时避免部队遭受重击导致瓦解。"
 LEP_symphony_of_factory_and_firepower: "军工火力交响曲"
 LEP_symphony_of_factory_and_firepower_desc: "以马克斯·鲍尔为代表的德国军事理论家提出，如果要实现共同的协作目标，军方和工业部门就必须密切合作，如同一支优美的交响曲，该观点得到了其意识形态圈子内大多数人的支持。我们将利用与东亚总督监事会的特殊业务关系，并通过景星会开展谈判，如此一来，我们的军队和工业部门将步调一致地运作。"
 LEP_primacy_of_the_engineering_corps: "工兵队优先"
 LEP_primacy_of_the_engineering_corps_desc: "是谁挖掘了战壕？是谁修筑了防御工事？又是谁建造了行动基地？如果没有我们军中的工兵部队，我们的士兵将失去防御能力，只能沦为敌人炮火的活靶子。现代战争需要一支坚韧不拔、积极主动的强大军事工程师队伍，以便我军开展各种复杂的作战行动。"
 LEP_shattering_their_walls: "摧坚破垒"
 LEP_shattering_their_walls_desc: "我们的工业也许能为我军生产东南地区数量最多的火炮，但它们的质量如何呢？要想让敌人真正感到恐惧，我们的火炮齐射必须做到快准狠。我们将通过开展一系列炮兵射击课程等方法，训练炮兵指挥官向敌人投射地狱之火。"
 LEP_artillery_of_the_sky: "空中炮兵"
 LEP_artillery_of_the_sky_desc: "许多人批评中国空军，认为其力量被地方军阀所瓜分，许多人质疑即使是中央政府也无法利用现代航空技术，甚至无法部署现代战机。然而，以蒋百里为代表的理论家仍在推动“空中炮兵”的应用。西方已向我们充分展示了战争的第三条道路的伟大之处。"
 LEP_artillery_of_the_sea: "海上炮兵"
 LEP_artillery_of_the_sea_desc: "北洋舰队给我们留下了一笔颇为可观的遗产，北洋舰队的吨位和火力曾一度位居世界前十，是海上的一道铜墙铁壁。在遭受甲午战争的摧残后，如今的北洋舰队乏善可陈，根本配不上中华民族。为此，我们将开动庞大的工业机器，再次用坚船利炮统治四海！"
 LEP_fortifying_our_positions: "就地筑垒"
 LEP_fortifying_our_positions_desc: "每当我们极目远眺，目光所及皆为旭日的光芒所笼罩。如果我们要抗敌御辱，我们的进攻必须手段多样，但我们的防守也绝不能落后。为此，我们将建造混凝土工事，错综复杂的战壕，以打造出一条固若金汤的钢铁防线。"
 LEP_nanjing_air_academy: "南京航空学校"
 LEP_nanjing_air_academy_desc: "中国空军最不幸的莫过于缺乏协调，保定军校有自己的航校，昆明和黄埔也是如此，其他军阀则是简单粗暴地对待空军力量。令人羞愧的是，如果我们未来想在空战中占有一席之地，我们就必须将南京当地的所有航校（这些航校曾将“中国林白”等人才拒之门外）合并为一所学校。"
 LEP_cult_of_aviation: "航空崇拜"
 LEP_cult_of_aviation_desc: "虽然我们的王牌飞行员无法单枪匹马赢得空战，但他们仍是新的战争第三条道路上令人崇拜的明星。我们将利用宣传手段，把这些（通常是年轻人）士兵描绘成英勇无畏的空战王牌，他们会为了中华民族的无上荣光流血牺牲。通过歌颂英雄主义和个人勇气，我们的飞行员将变得更加坚韧不拔。"
 LEP_china_air_fleet: "中国飞行队"
 LEP_china_air_fleet_desc: "长期以来，为了获得几架简陋、过时、完全无用的飞机，中国人被迫忍受西方人和帝国主义者的不公正合同。诚然，这些飞机出色地完成了本职工作，但这主要是因为缺乏强敌。然而，随着列强再度蚕食中国，只有最勤勉刻苦的势力才能继承“中国飞行队”的真正衣钵。"
 LEP_through_fire_and_war: "烈火激战"
 LEP_through_fire_and_war_desc: "无论是泥泞难行，还是血流漂杵，是战火纷飞，还是钢铁洪流，我们的士兵都将一往无前。我们的士兵必须毫不动摇，腰佩利刃，手握钢枪，他们将为中国士兵树立真正的榜样。没有我们的战士，中华民族将永无统一之日！他们绝不会动摇！"
 LEP_the_pinnacle_of_chinese_soldiery: "中国最优质的战士"
 LEP_the_pinnacle_of_chinese_soldiery_desc: "德国军事顾问团的真正使命，是为我们打造一支足以在中国历史中与靖国军、安国军、护国军齐名的新军。即便世道残酷，我们的战士永不屈服！我们的战士一往无前！我们的战士勇猛无畏！我们的战士奋战到底！"
 league_events.19.t_1: "北伐、南进还是西征？"
 league_events.19.t_2: "西征还是南进？"
 league_events.19.d_1: "齐燮元联帅于联帅府召开了一场最高指挥部紧急会议，并尽数召集了有望参会的诸省联军高层人士。可由于邓如琢督理、周荫人督理以及除了南京以外其他各省的督理皆无法出席，因此便只能由南京城内的各位挑起重担，火速制定一份战略规划并将其付诸行动。整场会议由刘宗纪牵头，与会者包括李宝章、孟昭月、谢鸿勋、汪镐基以及来自少壮派的徐培根。\n\n会议上提出并起草了三份不同的方案，以供齐燮元最终定夺。每份方案都侧重于速战速决，通过运动战将诸省联合的众多敌手围而歼之，而每份方案的不同之处则在于我们应当把重点放在何方部队，专注于哪点目标。\n\n第一份方案旨在调动谢鸿勋的北部驻军，就像十年前那样，打[SHD.GetLeader]一个措手不及，从而不费吹灰之力拿下济南。接下来是由李宝章和刘宗纪提出的第二份方案，其旨在挥师南下，使李宝章麾下的部队与邓、周二位督理的军队取得联系。第三份方案则受汪镐基和徐培根推崇，其旨在西进。只要我们得以粉碎南京眼皮子底下的心腹大患，诸省联军就可以一边抵挡国民党叛匪的猛攻，一边剿灭山东逆贼，最后在民党士气崩溃之时南下赶尽杀绝。\n\n至少对于齐燮元来说，每份战略规划不论是在军事上还是在政治上皆有利有弊。尽管不太情愿，但与会各位还是向联帅保证道：不论联帅选择哪份方案，他们都跟着联帅干了。"
 league_events.19.d_2: "齐燮元联帅于联帅府召开了一场最高指挥部紧急会议，并尽数召集了有望参会的诸省联军高层人士。可由于邓如琢督理、周荫人督理以及除了南京以外其他各省的督理皆无法出席，因此便只能由南京城内的各位挑起重担，火速制定一份战略规划并将其付诸行动。整场会议由刘宗纪牵头，与会者包括李宝章、孟昭月、谢鸿勋、汪镐基以及来自少壮派的徐培根。\n\n会议上提出并起草了两份不同的方案，以供齐燮元最终定夺。每份方案都侧重于速战速决，通过运动战将诸省联合的众多敌手围而歼之，而每份方案的不同之处则在于我们应当把重点放在何方部队，专注于哪点目标。\n\n第一份方案由李宝章和刘宗纪提出，其旨在挥师南下，使李宝章麾下的部队与邓、周二位督理的军队取得联系。第二份方案则受汪镐基和徐培根推崇，其旨在西进。只要我们得以粉碎南京眼皮子底下的心腹大患，诸省联军就可以一边抵挡国民党叛匪的猛攻，一边剿灭山东逆贼，最后在民党士气崩溃之时南下赶尽杀绝。\n\n至少对于齐燮元来说，每份战略规划不论是在军事上还是在政治上皆有利有弊。尽管不太情愿，但与会各位还是向联帅保证道：不论联帅选择哪份方案，他们都跟着联帅干了。"
 league_events.211.t: "收复失省"
 league_events.211.d: "长期以来，八省联合的西部诸省——湖南、广东还有广西从未归于联合治下，南京政府鞭长莫及。虽然早在1928年，联合看似已经将上述省份纳入麾下，但直至1929年联合的影响力才真正深入当地，可即便如此，诸省对联合依旧是貌合神离。第四次直奉战争后，联帅孙传芳与玉帅吴佩孚领导下的南北两大直系集团陷入对峙。整个西南地区沦为了二人攘权夺利的棋盘，各省不断利用自治与寻求庇护等手段以保护己方势力免受另一方的侵蚀。\n\n这一平衡最终在联合崩溃后被彻底打破。两广地区正式宣布脱离八省，湖南也紧随其后，联合陷入了生死存亡的斗争之中。见制于镇压东部诸省内乱，联合对于西部诸省的独立实在是无暇顾及。但他们的反叛尚且还在意料之中，毕竟自并入联合之日起他们就一直与我们若离若即。\n\n而今，我军凯旋而归，今非昔比。治下诸省重建工作稳步进行，联军展开军事操练，军官敲定作战方案，收复联合西部诸省的行动即将进行。说到底，我们有中央政府撑腰，凡事都只要我们雍容闲雅的吴佩孚与王承斌两位大帅点个头即可。"
 league_events.211.a: "北京方面没理由拒绝……"
 league_events.212.t: "南直系要扩张？"
 league_events.212.d: "今早，王承斌大帅与吴佩孚玉帅的指挥部分别收到了一则电报，其内容遣词文雅，貌似是由南京联帅亲自发给两位大帅的。吴佩孚还没来得及破译，便匆忙拨电告知王承斌自己要在洛阳召开军事会议，共商电报事宜。与往常一样略显敌意的王承斌起初还有些惊讶，但还是答应了，并打趣说自己刚打算致电吴佩孚咨询此事。\n\n会议迅速召开。吴佩孚的随行人员包括张其锽、白坚武与李炳之。在其之后，王承斌也带着萧耀南督理、高凌霨总长与蔡成勋将军进入了会议室。两位大帅像往常一样坐在会桌的对面，而这次，王承斌让吴佩孚先行发言。玉帅随即开始念读电报的内容：\n\n“敬启吴佩孚玉帅，”\n“在下联帅齐燮元，恭请中央政府正式允准，复夺因孙传芳殒命而丢失的八省联合领土。若蒙应允，联合必将在南方坚守直系荣耀，为国家统一鼎力相助。”\n“署名，联帅齐燮元。”\n\n会议室内一片沉寂，直到高凌霨开口：“这就……完啦？他是想让直系为了个荒唐梦又去打场荒唐仗吗？”与会众人也对此不知所措，不知是该说他胆大包天、愚不可及还是倔头倔脑。一般这种事都是交由内阁与陆军部审议，但不管怎样，和齐燮元这种为达目的不择手段的人混在一块儿在北京是肯定不会受待见的。\n\n尽管如此，众人依旧必须做出决定。只要两位大帅在总体方针上意见一致，他们的指令就一定能执行下去。"
 league_events.212.a: "这个浑人不好应付，给他一点甜头吧。"
 league_events.212.b: "养虎为患？然后学孙传芳在1929年反咬我们一口？"
 league_events.213.t: "联帅春风得意"
 league_events.213.d: "我们先前向北直系的不情之请被他们勉强……接受了！在王大帅和吴大帅发出的联合公告中，二人代表官方对联帅准备收复诸省联合西部失地的雄心壮志予以支持，并表示会鼎力相助。尽管他们还未完全承认诸省联合在八省全境的权威，不过他们还是会在将来的冲突中站在我们一边。\n\n按照往常，此类大事放到南京那都是要举杯相庆的，可如今在齐燮元治下，他的朋友越来越少。孙传芳的核心圈子以及各路友人要么惨遭清洗，要么就是拒绝与联帅“同流合污”，现在齐燮元所能做的只有坐在联帅府空荡荡的大厅中，精心谋划他的下一步行动。"
 league_events.213.a: "我跟他们说过的，我们会回来的……"
 league_events.214.t: "北直系的背叛"
 league_events.214.d: "没想到玉帅也会有被人当成反复无常的小人的一天。齐燮元本希望掌管津保派军事力量的王大帅会愿意与自己结盟，但他的希望落空了：吴大帅和王大帅对新任联帅发去的电报完全无动于衷，他们掌管的那个两面三刀的陆军部则对帮助自己重夺西部的建议一口回绝。\n\n他们借口国家北方局势尚不稳定，拒绝伸出援手。同时又要求南直系与北直系保持步调一致，一同帮助内阁捍卫中央政府。是可忍孰不可忍！据那些为数不多的仍留在联帅核心圈子里的人所说，联帅对北京方面的变脸怒不可遏。甚至有人建议联帅公开掀起反旗……"
 league_events.214.a: "联帅我都杀得，再杀一个玉帅又何妨？"
 league_events.214.b: "日你妈的大帅！日你妈的内阁！日你妈！"
 league_events.215.t: "方本仁来信"
 league_events.215.d: "随着近来的诸多事态引发了乱局，无数投机者、阴谋家和流浪客都在阴影中四处窥视，寻求走到聚光灯下的机会。不过这些八竿子打不着的家伙多半都被拒之门外，他们的请愿书甚至都不会出现在[ROOT.GetLeader]的办公桌上。然而，其中一份诱人的提案还是得到了联帅的关注。\n\n前任江西督办方本仁是吴佩孚的死敌，也是现任江西督理邓如琢的对手，此人的生涯充满了传奇与争议。方本仁曾在江西督理蔡成勋蔡虎臣手下效力，之后又凭借自己强大的实力将蔡成勋赶出江西，代替他主政，之后方本仁带领江西加入了孙传芳的五省联军，最后又被吴佩孚解职。\n\n在被邓如琢督理代替后，方本仁被迫暂时流亡，之后他前往广东省投奔国民革命军，成为了第十一军军长。但这段生涯依然是短暂的，方本仁在北伐期间经历了钢铁，雷鸣和鲜血，尽管他确保了自己部下的安全，但却彻底解散了自己的军队。如今正在江西过着平民企业家生活的方本仁主动提出要回到我们军中服役，当然，这不是无偿的。\n\n作为提供自己娴熟的军事技能并召集兵力的代价，方本仁要求自己在混战结束后担任江西督理。自然，这个提议相当诱人，其带来的好处也是立竿见影。但若是将来方督理重返江西，江西的当权派可能会相当……不满。"
 league_events.215.a: "我们当然可以合作共赢！"
 league_events.215.b: "诸省联合可没有你小子的立足之地。"
 league_events.216.t: "方本仁的怒火"
 league_events.216.d: "不幸的是，方本仁将军的心眼一点都不大。在与我们签订协议后，他加入了我们的军队，甚至直接与[ROOT.GetLeader]会面握手言欢。当时的方将军完全相信江西督理已是自己囊中之物，甚至幻想着自己如何把江西治理得井井有条，远远胜过邓如琢那个背信弃义的酒囊饭袋。\n\n但很遗憾，他不应该这么信任[ROOT.GetLeader]的，遭到背叛的方本仁再度在督理之争中输给了老对头邓如琢。但方本仁不会轻易认输，虽然他明知反抗新任联帅与自杀无异，但对背叛耿耿于怀的方本仁还是纠集忠诚的旧部组建了一支“江西起义军”，在江西再度掀起战火。\n\n诸省联合的历史上写满了起义和镇压起义，这一次也没什么特殊的。但方本仁颇受大部分江西民众欢迎，他指挥游击队进行骚扰的技巧也不容小觑。显然，我们要付出比预计中大得多的努力来吞并江西。"
 league_events.216.a: "这个狗娘养的！"
 league_events.217.t: "饱受诟病的玉帅"
 league_events.217.d: "并非所有人都看玉帅顺眼，此话不假。吴佩孚为人专横跋扈、生活穷奢极侈，无论何时何地都能表现得泰然自若，胆大妄为、行事鲁莽，成天卖弄他那套“儒生军人”的歪理邪说。自然而然，他的这些品性让联省派、国民党以及近乎整个南直系都与他关系紧张。但同时，吴佩孚也是举国上下最富权势的人，没有之一。因此，我们理应回馈他的恩惠，倘若继续像孙传芳一样在南京的地盘上天高大帅远，那未必有些太蠢了。\n\n不过此举也引发了许多忠孙派与反吴派人士的极大愤慨。虽然曹锟举止和善的形象路人皆知，但吴佩孚给很多人留下的只有悲愤的回忆。就在不久之前，新近加入联合最高指挥部的方本仁将军在得知南北直系结盟之事后，愤然递交辞呈，引发了轩然大波。\n\n显然，方本仁将军仍对十年前吴佩孚逼迫他离任江西一事耿耿于怀。他手下的弟兄们也纷纷跟随方本仁退役，拒绝与这支背叛他们长官的军队合作。"
 league_events.217.a: "那就当你的平头百姓去吧！"
 league_events.218.t: "齐燮元发表时局演讲"
 league_events.218.d: "仅是一枚子弹，既把孙传芳送上了西天，又让他的八省联合彻底乱成了一锅粥。那些同八省联合利害攸关的人士纷纷竖起了耳朵，对他们而言，如今不论是南京方面的官方消息还是风言风语，一字一句都非同小可。今天，南京方面举办了官方发布会，这也是自孙传芳不幸逝世后的第一场发布会，无数国内外记者以及外国军事顾问在严密的安保下于南京联帅府大厅齐聚一堂。每个人都心急火燎地等待着第一篇官方通告，以此来撰写他们的头版头条和外交报告。\n\n在手持德制步枪的警卫及其左膀右臂的护送下，齐燮元自侧门入场，沉着而坚定地步入大厅。他站在演讲台前，制服上的勋章在外国相机闪光灯的照射下闪闪发亮，尽管其身高明显低周围人一头，可这位矮小的将军却显得威风赫赫，毫不逊色于在场的那些西方军事顾问。齐燮元的目光从整个大厅飞速扫过，随后便开口说了一些看似悲痛欲绝的陈词滥调：\n\n“今天，我们为被害的联帅哀悼；明天，我们就要让凶手付出代价！八省联合不会允许，对我利益的侵犯，或对我政治的干涉！”\n在安抚了场下的外国（尤其是德国）听众后，齐燮元稍微咽了口唾沫，接着说道：\n“我们伟大的八省联合，举境悲痛，共同的损失，让我们更加，团结一致！我们西方社会主义国家的朋友们，要为可耻共谋刺杀孙联帅，做出回答！”\n\n通过将这起刺杀的源头指向国民党的那些社会主义分子，齐燮元几乎已经承认了自己将继承已故联帅的遗产。他的这番话立马就被听众记了下来。有趣的是，立在前面的话筒几乎比他高了一头，这也就意味着此番话亦将在各省逐字放送。在演讲结束时，齐燮元丢下了一句话：“不论前路如何艰险，作为联帅，我一定会带领八省联合走出乱局。”随后便无视了听众的各种问题，毫不犹豫地夺门而出。齐燮元出人意料的退场为这次记者招待会画上了句号，警卫也随即勒令听众尽快离场。\n\n本次发布会对八省联合那令人担忧的未来可谓是毫无裨益。不过，至少有两件事已经板上钉钉——首先，八省联合如今落入了这位疯狂的独裁者手中；其次，八省联合将会不惜一切代价，以保外国利益安全无虞。"
 league_events.218.a: "唯愿今后一切安好……"

 LEP_market_liberal_party: "东亚监事会"
 LEP_market_liberal_party_long: "东亚总督监事会(Aufsichtsrat der Ostasiatische Generalverwaltung)\n§L随着德国对中国市场的兴趣日益增加，满是西装革履的德国人的东亚总督监事会应运而生。在经历了上海争夺战、德国干涉北伐和第三次直奉战争后，东亚监事会的前身组织“德国东亚协会”成立了。\n\n德国东亚协会由总部位于青岛的德华银行牵头，表面上只是一群殖民地官员、银行家和企业主。东亚协会与孙传芳进行了谈判，愿意帮助孙传芳偿还其巨额战争债务。孙传芳渴望进一步与吴佩孚进行军备竞赛，经过深思熟虑，他同意与德华银行签署了一系列条件严苛且涉及面广泛的经济协议，以换取更多的贷款与德械装备。\n\n随着中央政府与八省联合携手推进“80个师计划”，以及上海起义爆发，笑面虎与德国东亚协会的合作暗生嫌隙。与此同时，东亚协会内腐败丑闻频发，其立场也暴露在越来越多的中国军阀面前。于是，他们成立了东亚总督监事会，以更好融入中国。东亚监事会庇护着绝大多数在华德国企业，其影响力如同滚雪球般不断高涨。东亚监事会与齐燮元等人暗通宽曲，也许他们在盘算着如何改变八省联合的管理层，用一位不那么反租界的人士来替换孙传芳……§!\n"
 LEP_social_conservative_party: "江南商帮"
 LEP_authoritarian_democrat_party: "景星会"
 LEP_paternal_autocrat_party: "南直系"
 LEP_national_populist_party: "青年党"
 LEP_qing_help_party: "北京联络委员会"
 LEP_qing_help_party_long: "北京联络委员会\n§L我们的靠山直系对新政府的计划产生了浓厚的兴趣。南北直系之间的关系一直很紧张，而二者建立在同一个盘根错节的关系网之上，因此这个问题更难解决：如果你骂了一个南京的要人，双方都会受到严重的经济影响。\n\n我们确实对北京联络委员会的存在感到不满，但其实他们基本没有自己的力量，只是北京的工具罢了，如果我们能跟直系政府保持良好的关系，他们就不会添麻烦。这些人的活动主要是进行亲直系的宣传，并将一些他们的人安插到不重要的岗位上。当然，如果我们冒犯了北方，那就另当别论了……§!\n"

 LEP_temp_suppress_rural_banditry: "镇压土匪活动"
 LEP_temp_suppress_rural_banditry_desc: "乡间土匪在北方横行霸道，袭击无辜路人，给江苏造成巨大混乱。我们没有余下的资源来完全消除威胁，所以只能暂时压制他们。若是想要除掉他们，就需集中一切力量。\n§R若齐燮元巩固了统治，需要完成§Y镇压乡间土匪§!国策，才能永久清除土匪的存在！§!"
 LEP_decision_lower_bandit_unrest: "铲除土匪"
 LEP_decision_lower_bandit_unrest_desc: "现在我们已开始着手解决北部地盘的问题，除掉了他们大部分的煽动者，是时候全力镇压了。为了维护国家道德，必须跟踪土匪团体，找到其集会场所，并强制将其终结。"

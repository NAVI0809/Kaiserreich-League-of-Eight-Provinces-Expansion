 league_events.16.a: "终于，这事可算结了。"
 league_events.17.t: "齐燮元的部队控制了南京兵工厂"
 league_events.17.d: "在今日清晨时分，齐燮元的部队已经完全控制了南京的兵工厂。在经历了孙传芳被罢黜以及齐燮元的“政变”后，南京的部队已经分裂成了忠于孙传芳和忠于齐燮元的两个派系。齐燮元试图迫使孙传芳最亲近的高级指挥官让他们手下的部队放下武器，但由于他们中一员谢鸿勋的拒绝，这项尝试也以失败告终。\n\n孙传芳旧部中的许多部队及其军官，以及总参谋部中的高级官员仍认为齐燮元并不适合统治联合，甚至还有人认为齐燮元为了当上联帅在孙传芳昏迷期间将他杀害。自从齐燮元夺权以来，孙传芳旧部就集中在南京兵工厂周边布防，南京也陷入了无休止的战斗之中。\n\n南京兵工厂作为全中国最大的装备和弹药制造基地，是个结结实实的硬骨头。即便是齐燮元受过德式训练、装备精良的精英部队也难以将其攻克，而据信残酷的战斗已经导致联帅一方损失惨重。直到齐大帅推出他的火炮时，局势才得到扭转。\n\n炮火摧毁了兵工厂，也消灭了守军。尽管机器和建筑受损，但这只不过是为了齐燮元统治能够存续所付出的微小代价。毕竟，肯定还有更多类似的戏码还要在联合境内上演。"
 league_events.17.a: "铁腕开始收紧了。"
 league_events.18.t: "南京的暴徒退散"
 league_events.18.d: "齐燮元在南京宣告自己将重振联帅权威后，首先便将目光投向了那些四处抗议暴动的平民们，这些人都叫嚷着反租界口号，或者诸如要求诸省联合解体之类的梦呓。南京城中的武装抵抗者基本都死在了南京兵工厂里，剩下的抗议者都手无寸铁，但许多孙传芳派残党已经加入了他们的抗议活动。\n\n这些抗议者称齐燮元是“汉奸”，指责他是谋害了孙传芳的一只德国走狗。许多抗议者主张结束毒害中国数十载的军阀割据，并认为要想解放中国人民，孙传芳主张国家统一与开放选举的口号是必不可少的。一些激进的抗议者开始支持以国民党的青天白日取代齐大帅，不那么激进的抗议者则呼吁北京方面介入东南局势。\n\n但齐大帅已经证明了，这些人不过是在痴心妄想。他安坐在新府邸里，派遣部队深入南京城的大街小巷。根据基层军官们的报告，这些抗议者已经退散，普通民众略有伤亡。此等雷厉风行之举确保了联帅对南京的掌控——至少眼下如此。"
 league_events.18.a: "南京是我们的了。"
 league_events.19.a: "北伐！剑指山东！"
 league_events.19.b: "南进！剿灭民党！"
 league_events.19.c: "西征！审判陈逆！"
 league_events.20.t: "清洗不忠的军官"
 league_events.20.d: "联帅从不记得在诸省联军里有过什么忠诚者。当然，孙传芳身边的强硬派和鹰犬们的忠诚不容置疑；只是，各省都向各自的省督献上忠诚，而非联帅。这就造成了一个脆弱的局面：督理们与孙传芳是友是敌只在一念之间，全靠孙传芳与督理们的私交维系。\n\n陈调元背叛后，这套体系的破绽一览无余，不能继续存在了。不对南京输诚的人士未来很可能会举起反旗。只要基层军官对齐燮元的忠诚不绝对，我们的军队就寸步难行。\n\n为了解决这个问题，联帅在过去几天内对整个联合的军官体系进行了大规模清洗。负责审查所有军官的履历和过往关系的军队忠诚委员会主导了整个过程。委员会对南京城内非齐燮元派的军官进行大规模讯问，并展开了大规模逮捕行动。\n\n被发现与国民党、土匪或其他军阀有联系的军官，哪怕被翻出的是十年前的旧账，都会被无限期监禁。甚至有幕后报告称，一些人被私刑处决。"
 league_events.20.a: "子弹底下出忠臣。"
 league_events.21.t: "逮捕新闻记者"
 league_events.21.d: "就在今晨，多家报社遭大批宪兵突击检查，足有数百名撰稿人、编辑以及社长被捕。此次行动正是在齐燮元联帅的授意下进行的，他清楚认识到这些报纸正是诸省内乱的帮凶，即使诸省联合的四周强敌环伺，他们却仍日复一日地编造着联帅的坏话。\n\n报纸上写满了关于诸如滥用职权、滥杀无辜的“大不敬”言论，还围绕着联帅本人编造了一段伤风败俗的胡话。他们从来没把联帅当作自己的救命恩人，反而把联帅当成独夫民贼一般对待。颇为讽刺的是，许多报社甚至暗讽联帅是八省崩溃期间的“最佳演员”，还旁敲侧击道：正是齐燮元“趁孙传芳病，要了孙传芳的命”。\n\n虽然事已至此，但我们还是在这场闹剧中看到了机遇。这些出版机构已经证明了其在宣传领域的潜在价值，这一优点不可忽视。因此表面上看，那些报社招收了新的撰稿人和编辑以接替还在蹲大牢的人。不过事实却是，新人都受到了严密审查，确保其能忠心耿耿，并不辞劳苦地撰写歌颂宁系的文章。"
 league_events.21.a: "我们必须严惩叛徒。"
 league_events.22.t: "清除同党"
 league_events.22.d: "俗话说“做事做到底，送佛送到西”，既然联帅已经从外敌手上保住了政权，那现在该把视线转向内部了。除开那些已知的诸如由卢香亭、杜锡钧和戴春风等人罗织的众多间谍网，还有许多参与推动了八省联合崩溃的人如今仍潜藏在人群中，下至农民阶层，上至高级官员。\n\n这些人或是为了利益，或是为了可笑的自由或其他理想，集结在了反抗我们亲爱的德国盟友的旗帜下，而解决这些问题的唯一办法就是杀鸡儆猴。在清洗的过程中，我们已经发现我们所面对的许多团体规模庞大、无所不包。而为了让清洗更加高效，我们最好将我们的精力集中于特定一个当前还在反抗我们的团体上。\n\n当前，齐燮元的许多直系下属认为年轻学生团体正是滋生异见和叛乱的温床。与国民党、浙江自治运动、民主科学座谈会等其他知识分子团体有关联的激进分子正迅速增多。这些人自然看不惯齐燮元实施的戒严令。而另一个显而易见的威胁则还是党国，以及在我们领土上不断进行屠杀的农村土匪势力。最后则是和联帅本人息息相关的那些孙传芳的旧友、同伙及盟友。这些人仍对齐大帅抱有不少怀疑，而这也让他们不值得被信任。"
 league_events.22.a: "学生内部传播着异见。"
 league_events.22.b: "我们必须彻底根除国民党的威胁。"
 league_events.22.c: "土匪是对和平稳定的最大隐患。"
 league_events.22.e: "孙传芳的朋友应该跟着孙传芳走。"
 league_events.23.t: "我们下手该多重？"
 league_events.23.d: "作为联帅，齐燮元所肩负的最大责任之一，就是要决定这场“清除同党”行动的下手该有多重。显然，他可以选择道德一些的选项，仅仅把他们彻底流放或者把他们关到大牢里任其自生自灭。毕竟，这两个办法都能保证这些人再也无力挑战联帅。不过这些人中仍有一些罪犯和反贼，如若让他们找到机会，这些人势必会再次给我们社会的稳定带来巨大威胁。\n\n为了避免又一次联合崩溃，或是又一次联帅遇刺，联帅的许多手下都建议他直接下死手，不能有半点仁慈。与前一个选项类似，这些人死了自然也无法再挑战联帅的统治了。不过无论如何，最终的决定权都在齐燮元本人手上。"
 league_events.23.a: "流放或囚禁叛徒。"
 league_events.23.b: "统统处决。"
 league_events.24.t: "清理笑面虎的老巢"
 league_events.24.d: "在过去的几周里，恐惧成了诸省联合的主旋律。一开始只是低调地调查并逮捕“异见人士”和国家公敌，很快就迅速升级为警察突击搜查、擦枪走火、就地正法。齐燮元联帅麾下最精锐的宪兵逐条街道地清理反对者，监狱甚至已经人满为患，装满了现政权的敌人。就连农村地区也未能幸免，县长和议员大多都被撤换了，要不就是被捆走了。\n\n齐联帅就稳坐在这尔虞我诈、无情冷血的金字塔之顶。十年前的他不过是只丧家之犬，现在则权势滔天。虽然孙传芳的阴影依旧笼罩着齐燮元，但他超过那只笑面虎也只是时间问题罢了。"
 league_events.24.a: "滚进历史的垃圾堆吧！"
 league_events.27.t: "与大耳杜会面"
 league_events.27.d: "尽管齐燮元对中国大城市的地下黑社会并不陌生，但与一众不择手段的不法分子相比，他也能称得上是独树一帜。齐燮元指派他的心腹田文炳进行了长达数周的布局后，他终于跟杜月笙搭上了线。这位臭名昭著的黑帮老大靠着在上海从事各种违法生意打出了名号。人口买卖、洗钱、绑架，只要你能说得上名的违法勾当，杜月笙恐怕就没有没干过的。不过齐燮元也恰好知道杜月笙的一些黑料，他与国民党特务头子戴春风的关系也许能成为谈判桌上的筹码。\n\n而杜月笙也是上海知名犯罪“企业”——青帮的主要领导人之一。若能在青帮与联合间建立起业务关系，那无疑会给双方都带来巨大利益。\n\n在无锡的一条小巷中，任何路过的人都不会注意到一场肮脏的交易正在这个安静的大厅中进行。在联合一侧，齐大帅毫无疑问列坐其中，而他的身旁是田文炳以及其他几位联合高层官员。而另一边坐着的可能是关内最无法无天、目无纲常的杜月笙及其上海黑帮成员了。这些人抽着雪茄，甚至还把脚架在了会议桌上。\n\n大多数联合高级官员甚至对此次密谈一无所知，而在场的警卫数量也压在了最低限度。讨论持续了数个小时，杜月笙对齐燮元的开价频频闪烁其词，但最终双方还是达成了一项计划。这项计划在私下里被称作“杜宁计划”，规定杜月笙要动用他丰富且隐蔽的商业关系来为宁系注入更多资本，以供齐燮元维持稳定的收支平衡。而宁系也会直接支付杜月笙薪水，而其中的四成将被用以推进使馆城市中的亲中贸易。\n\n齐燮元戴着手套和杜月笙坚实的手握在一起，二人和双方代表也各自点头示意，随后在夜色中分道扬镳。双方都在会议后解决了许多目击者，而幕后交易的齿轮，也在此刻开始慢慢转动起来。"
 league_events.27.a: "这协议有赚头。"
 league_events.28.t: "来自南京政府的影响"
 league_events.28.d: "我们注意到一部分与青帮有关的商人，开始逐渐向南京进行投资。很明显这些投资是为了讨好南京政府而进行的。而这些企业的利润也相对较高，不难看出这里面掺杂了南京政府自身的投资在其中。"
 league_events.28.a: "有趣。"
 league_events.29.t: "青帮在南京壮大"
 league_events.29.d: "青帮交游广泛、八面玲珑，从天津与香港的商人，再到国民党陈氏兄弟这样的理想主义组织，青帮都有人脉。虽然他们在全国各地都有据点，但上海始终是他们主要的活动区域，未来也将继续如此。而随着杜月笙和齐燮元达成了秘密协议，青帮将手伸进了南京市的大街小巷。\n\n在孙传芳的领导下时，南京警方总是会及时介入，试图阻止这些暗地滋生的不法帮派。但如今南京警署署长已经放弃了这样的行动，转而将打击目标放在那些所谓“国家公敌”身上。自然，很多人都会怀疑他收受了青帮的贿赂。不过事实上，这位署长洁身自好，从未收受过贿赂。\n\n不过，齐燮元最近处决了孙传芳任命的警察署长，换成了一个自己决定的人选，也许此事与此有所关联……"
 league_events.29.a: "南京欢迎你！"
 league_events.30.t: "反齐活动团体在南京蔓延"
 league_events.30.d: "虽然有些马后炮，但联帅宣布成功镇压南京城内的骚乱还是为时过早了。南京城内本就紧张的局势又被多个反联合活动团体点燃，数量惊人的资金、武器和弹药再次流入城内，暴力事件卷土重来。随着宪兵和反齐分子发生冲突，骚乱在街头死灰复燃。\n\n齐联帅仍在权衡，想知道这些坏分子新的资助者到底是谁，他对目前南京城内愈演愈烈的暴力保持沉默。然而，有流言说，他正在暗中准备一劳永逸地消灭这些闹事者……"
 league_events.30.a: "暴乱必须结束。"
 league_events.31.t: "反齐活动领袖在南京身亡！"
 league_events.31.d: "今晨，联合内各大报纸都争相报道昨夜全南京各处发生大量残酷处决的消息。13名反齐燮元团体的领导成员的遗体在南京的一个仓库内被发现。13具尸体中，有5具是被枪杀，6具是被刀杀，2具是被钝器打死。而另一篇报道也记录了相似的内容：另有两具尸体在南京的贫民窟的路上中被发现，而这两人都被确认为更高层的反齐抗议活动者。他们也都是被殴打致死的，而手上的绳痕和殴打的程度也表明他们在生前遭到了残酷的折磨。\n\n警方确定了8名特征各异的男子为嫌疑人并将其逮捕，而经过进一步调查，他们都被确认为齐大帅私人宪兵队的成员。在他们被拘留5小时后，齐燮元就通知南京警署署长放人，并告知他这些人与案件毫无关系。随后，齐燮元出现在记者面前，正式宣布他将组建一个专案组调查这一系列死亡，不过这类事件大概率不会取得任何进展。\n\n事后，联帅向这八个人询问了具体情况，从他们口中得知了全部十五名遇害者都与青帮有联系，不过仅限于物质和经济上的支持。无论如何，现在反齐抗议者的头目已经伏诛，而南京城也重归安宁。"
 league_events.31.a: "“看来杜月笙还挺有一套的。”"
 league_events.32.t: "使馆城市的投资"
 league_events.32.d: "在与杜月笙达成多项协定的数月里，我们没有见到财政上的任何起色；这也导致一些官员开始担心我们是不是被青帮骗了。尤其是最近有消息称他们与反齐抵抗组织的勾连在我们达成交易后开始激增。不过，联帅本人对中国黑社会冷酷无情的本质可是再清楚不过了。\n\n最近，大量来自使馆城市的投资突然涌入，帮助我们建设了工厂、雇佣了更多工人并提高了我们的产量。尽管杜月笙也许与我们理念不同，但他毫无疑问是个言而有信的人，并将使馆城市的业务引向了联合。"
 league_events.32.a: "“祝杜老大健康常胜！”"
 league_events.41.t: "联军士兵遇伏"
 league_events.41.d: "八省联合崩溃后，例行巡逻就成了联军士兵的常态。国民革命军在邓演达的带领下进行着无休止的游击战，偏远、农村地区的气氛与1927年国民党第一次惨败时如出一辙。虽然翻不起什么大风浪，我们的基层士兵却时刻面临着切实的危险。\n\n据称，在今天的一次例行巡逻中，我们的一批战士在[?LEP_KMT_attack_location.GetCapitalVictoryPointName]附近遭到了国民党游击队的袭击。他们被包围后很快就全军覆没。我们派遣了更多人员去寻找罪魁祸首，但最后徒劳无功。"
 league_events.41.a: "没空在这唱衰了！"
 league_events.42.t: "[?LEP_KMT_attack_location.GetCapitalVictoryPointName]的火车遭炸弹袭击"
 league_events.42.d: "看来，在一辆为附近集镇运送军用补给的火车停留在[?LEP_KMT_attack_location.GetCapitalVictoryPointName]时，国民党十人团的特务趁着乘客下车的时机偷偷潜入，将数枚炸弹安放在火车底部，之后迅速逃离现场。然后炸弹引爆，火车、补给和一段窄轨铁道都被完全摧毁。我们必须尽快修复业已陷入完全瘫痪的基建系统，而频发的恐怖袭击势必会耗费我们大量的行政资源。我们现在还没找到这帮十人团特务的踪迹，他们可能躲进了逃难的农民队伍中。"
 league_events.42.a: "什么时候是个头啊？"
 league_events.43.t: "[?LEP_KMT_attack_location.GetCapitalVictoryPointName]的军官遇刺"
 league_events.43.d: "由于南方的局势一直十分紧张，我们必须源源不断地将部队和宪兵派往该地区以维护治安。在位于[?LEP_KMT_attack_location.GetCapitalVictoryPointName]的宪兵训练营中，数名国民党十人团特工渗透进了营区并处决了数名军官，并成功从宪兵手中逃脱。随后营区内部和周边有数枚炸弹被引爆，训练中队有半数人员当场死亡，而其余人员也均有负伤。毫无疑问，军营本身也亟待维修。"
 league_events.43.a: "当我们瞎了？"
 league_events.44.t: "[?LEP_KMT_attack_location.GetCapitalVictoryPointName]的工厂遇袭"
 league_events.44.d: "尽管我们曾经以为[?LEP_KMT_attack_location.GetCapitalVictoryPointName]的工厂已经安全了，不会再受到恐怖袭击的威胁，但是它依然遭到了国民党十人团特务的毒手。就在昨日午夜时分，这个工业区突然发生了一次大爆炸，多枚炸弹在园区中爆炸，一间工厂因此损毁严重。[?LEP_KMT_attack_location.GetCapitalVictoryPointName]的市民们要求政府采取措施以应对这些抵抗行为。不过也有消息指出，有成群的市民加入了国民党的运动中。"
 league_events.44.a: "行动宣传？那是啥？"
 league_events.45.t: "[?LEP_KMT_attack_location.GetCapitalVictoryPointName]的枪战"
 league_events.45.d: "自从我们剿灭所谓的汪主席和宋庆龄、邓演达领导的闽赣叛乱地区以来，[?LEP_KMT_attack_location.GetCapitalVictoryPointName]的紧张局势一直不见好转。我们在当地的驻军与民众中的国民党同情者之间频繁爆发小规模冲突。而这些小规模冲突终于在今天升温了。一名乔装成普通农民的男子走过一群士兵，然后迅速掏出手枪对他们开火。\n\n尽管他只击毙了我们一名士兵就被其他人放倒了，但他的牺牲只是为了分散我们士兵的注意力。当我们的士兵都把注意力放在他身上时，一大批国民革命军部队从另一个方向对我们的士兵发起了冲锋，并将他们悉数消灭。\n\n国民革命军受到了当地民众的热烈欢迎，与此同时也开始将更多当地农民吸纳进他们的这场小小起义中。时间一分一秒过去，效忠联合的士兵们也纷纷加入到对抗国民革命军的队伍中，但却遭到了更多来自国民党的攻击。数十，甚至数百人阵亡，但幸好在夜幕降临之前，枪声逐渐平息，而国民革命军也消失在了黑暗中。"
 league_events.45.a: "我们还得打垮他们多少次？"
 league_events.46.t: "[?LEP_KMT_attack_location.GetCapitalVictoryPointName]的工厂遭到严重破坏"
 league_events.46.d: "尽管国民党已在战场上被我们彻底击败，但他们的恐怖活动并没有停止。今天，[?LEP_KMT_attack_location.GetCapitalVictoryPointName]的工厂区附近有多枚炸弹引爆。事件没有造成人员伤亡，不过工厂基本已被夷为平地，只剩一地的灰泥和混凝土，无法继续从事生产。国民党在现场留下口号谴责我们诸省联合政府，呼吁人民起义反抗专制独裁的联帅，在[?LEP_KMT_attack_location.GetCapitalVictoryPointName]引起了共鸣。"
 league_events.46.a: "真可怜。"
 league_events.47.t: "[?LEP_KMT_attack_location.GetCapitalVictoryPointName]之战"
 league_events.47.d: "[?LEP_KMT_attack_location.GetCapitalVictoryPointName]乃是国民党分子的温床，最近又爆发了一次大规模冲突。大约400名国民革命军士兵冲进城市中心广场，杀害了所有他们遇到的警察和士兵。并且就地搭建了临时防御工事。我们的部队发起了数次进攻，直到我们不得已推出了火炮才得以将他们赶出广场。许多百姓试图逃离炮火但却未能幸免于难，而这些狡诈的匪徒们趁着混乱立刻撤入了后巷中，并且在之后潜逃到了当地农民的家中。\n\n然而，指挥这次进攻并授权使用火炮的这名军官决定一举把国民党从[?LEP_KMT_attack_location.GetCapitalVictoryPointName]赶出去，于是组织了一场十分残暴的劫掠。他派遣了超过200名士兵在城市中发动了一场屠杀。数百名平民遭到列队枪杀，而他们的房子也被烧毁。\n\n当齐燮元听到[?LEP_KMT_attack_location.GetCapitalVictoryPointName]惨案的报告时，他立刻命人逮捕了这名军官，但当地群众认为齐大帅所做的处置太过轻了，也太迟了。而在该军官仅仅被拘留三小时后就被释放的消息传开后，当地民众的情绪进一步被点燃了。"
 league_events.47.a: "[?LEP_KMT_attack_location.GetCapitalVictoryPointName]惨案是国民党的错啊！"
 league_events.48.t: "南方发生山地伏击"
 league_events.48.d: "过去几周，原闽赣叛乱地区的巡逻、货运和其他必要活动多次遭到山区伏击，而这里之前就发生过叛乱。那些国民党游击队从高处开枪，随即消失得无影无踪，留下一地狼藉和尸体。事态已经十分严重，不论出多高的价格，当地人都不敢提供运输服务了。\n\n该地区官员向我们保证，通过强征壮丁、加强巡查，这一问题将迅速得到解决。问题是，想要彻底铲除国民党叛匪，我们要做的远不止这些。"
 league_events.48.a: "“我有点想去亲手宰了他们了！”"
 league_events.49.t: "数座工厂遭到炸弹袭击"
 league_events.49.d: "在今天一大早，我国南方的数座工厂受到了炸弹袭击。根据以往经验，这种高度有组织有系统的袭击只可能是国民党的十人团干的。但随着最近袭击频发，我们在这些工厂中都驻扎了部队。可这却导致在这次袭击惨案中，我方军人们也伤亡惨重。"
 league_events.49.a: "我们又棋差一着了？"
 league_events.50.t: "围剿匪党总部"
 league_events.50.d: "我们终于成功了！在经过长达数月对国民党活动的艰苦追踪、反击和谋划后，这一切努力终于有了回报。我们利用在上海青帮中的关系，成功逮捕了国民党十人团的一众核心成员。齐燮元亲自下场对这些人进行了残酷的拷问，并成功从他们嘴里撬出了邓演达最后的总部的信息。在处决了狱中全部十人团成员后，大帅开始了他的下一步计划。\n\n齐大帅亲自指挥了对国民党在福建最后据点的围剿，并将其夷为平地，连一张能辨认的面孔都没留下。然而最令人遗憾的是，随着硝烟散去，我们没能从中找到邓演达、戴春风和叶挺等关键人物。不过无论如何，国民党手中已无任何资源，而他们的第二场起义也被扼杀在摇篮中，齐大帅终于可以正式宣布——国民党左派的运动已被彻底摧毁。"
 league_events.50.a: "理想主义的丧钟……"
 league_events.51.t: "徐州的鸦片仓库被劫掠"
 league_events.51.d: "联合内部权威沦丧殆尽，导致这片土地上涌现出了数不胜数的土匪团伙。这些土匪并不像国民党一样会为了某种理想主义发动革命，只会为了自己的生存和利益而在乡间游荡。自然，最近诸省联合内的各个非法鸦片储存仓库频遭土匪袭击，最近一次袭击就发生在徐州。\n\n虽然鸦片减少未必是坏事，但人们担心他们会继续出售与分发鸦片，从而导致黑市更加猖獗。在这次袭击中，他们同时杀死了鸦片贩子和我们的士兵，然后便带着不义之财溜之大吉。"
 league_events.51.a: "野蛮至极。"
 league_events.52.t: "北上的商队受袭"
 league_events.52.d: "各路土匪团体仍在不断制造混乱、屠杀和无序，他们抢劫联合北方的商队，杀害或绑架火车上随行人员，并以此为筹码向当地政府索要赎金。而当地县长也别无他法，只能乖乖支付数额不菲的赎金。这些该死的土匪明目张胆的敲诈行为暴露了我们管理的严重问题，尤其是在齐燮元直辖的江苏省。"
 league_events.52.a: "“该好好治治这些土匪了。”"
 league_events.53.t: "士兵在北部的村庄受袭"
 league_events.53.d: "八省联合崩溃后，例行巡逻就成了联军士兵的常态。自华东混战以来，乡村匪患就日益严重，连我们的人也难逃其魔爪。有些士兵在巡视北方村庄时遭到了一大支由数十名装备精良的土匪组成的队伍的突然袭击。这些人在华东混战中失去了一切，为了维持生计而再次开始劫掠。而这些劫掠行为也在当地村庄间臭名远扬，迫使当地县长不得不组织巡逻。但仅靠这些举措并不能让当地乡镇重归安宁，迄今为止已有近二十名当地民兵和十名我们自己的士兵遇害了。"
 league_events.53.a: "说到底就是群农民，你们这都没打赢？"
 league_events.54.t: "城镇遭受乡间土匪的入侵！"
 league_events.54.d: "江苏省内的权力真空在最近又导致了一场大规模骚乱。然而这次，居然有一个稍大的土匪集团设法占领了一整个城镇。在当地招募了一批合作者并监禁了反抗者后，郑俊彦手下的许多士兵被派去调查，结果却发现整座城早已筑起深沟高垒，对一场攻城战严阵以待。在征募了一大批士兵后，郑俊彦的手下终于将土匪赶出了城镇，救出了被监禁的当地居民。尽管上百名土匪被当场击毙，但还有许多人和新募土匪逃离了村庄，他们在数量上并没有多大损失；但反观我们这边，阵亡的士兵可就没法得到这么快的补充了。"
 league_events.54.a: "你一定是在跟我说笑吧。"
 league_events.55.t: "土匪帮众占领了军营"
 league_events.55.d: "为了报复我们最近的军事围剿行动，游荡的土匪帮众又攻下了我们位于江苏省边缘的一处军事设施。数百土匪突然涌入了兵营，杀死了许多士兵，在此之后就地建立起了防御设施。随后，附近的城市也因受到了他们的劫掠而陷入混乱。齐联帅以他江苏督理的身份派出了精锐德训师并成功夺回了军营，并以最小的伤亡重建了他在这座城市的权威。虽说这种事件从最开始就不应该发生，而这也充分暴露了齐燮元在当地缺乏权威。"
 league_events.55.a: "他们没几天好日子过了。"
 league_events.56.t: "土匪占领了我们在江苏的铁路"
 league_events.56.d: "就在今天，又有一伙土匪封锁并占据了徐州这个交通枢纽周边的几处路段，其中部分甚至被他们所摧毁。负责治理当地的郑俊彦下令作出迅速应对。郑俊彦在包围了这群土匪后，对他们展开了系统性的剿灭行动，虽然最终歼灭了所有土匪，但我们也付出了不小的伤亡。\n\n然而对联帅来说，更为迫切的是要修复土匪造成的基建破坏。尽管这群土匪基本都是在夺取城镇、袭击巡逻队或制造其他一些可控的麻烦，但他们对齐燮元德国金主所使用的铁路的破坏，才是最让他头疼的。这些基建几乎能说得上是联合的命脉，国家的交通运输和我们的经济都仰仗于此。若是再这么放任土匪，这联合怕是要亡于我们手上。"
 league_events.56.a: "“老子连联帅都拿得下，还拿不下你们这群土匪？！”"
 league_events.57.t: "土匪协从遭到屠杀"
 league_events.57.d: "联帅授权了一项带有极度成见的残酷政策，加大对北方农村土匪打击的力度。也许是他把这种自己治下省份中的土匪暴乱视作对他个人的巨大侮辱，于是按他的说法，他亲自指挥了一场对“土匪病”的“安乐死”。齐燮元先是锁定了当地一个靠近村庄的土匪据点，随后派遣部队包围了这个村庄并刺激土匪对村庄发起进攻。\n\n事态迅速升级，村庄被土匪围困，村民也陷入了对土匪报复的恐惧之中。而当士兵转过头来处理土匪时，却遭到了当地村民的攻击。随后围剿演变成了血洗，将近一千人遇害。尽管齐燮元以当地军官过度使用武力为由将他解雇，但屠杀的消息早已却不胫而走，媒体纷纷对联帅的暴行进行了口诛笔伐。"
 league_events.57.a: "这事办得不光彩。"
 league_events.58.t: "乡间土匪的末路"
 league_events.58.d: "终于，在江苏权威崩溃后窜出的乡间土匪团体都被我们尽数消灭。郑俊彦亲自指挥了最后一场土匪围剿行动，并把抓获的土匪成员尽数投入大牢。这一处分相比齐联帅要求的要轻上许多，但郑俊彦赌上他的前途也想让这些土匪有朝一日能回归正常人，他向联帅据理力争说这些人不过是为时局所害而不得已落草为寇。在这场恢复北方乡村秩序的战斗中，无数人牺牲了生命，但江苏省最终得以归于宁静。无疑，土匪横行给当地造成的伤害不会轻易为人所淡忘，但我们也是时候开始向前看，进行重建和修正的工作了。"
 league_events.58.a: "打得过联帅我吗？"
 league_events.59.t: "联帅的商业头脑"
 league_events.59.d: "相较于和杜月笙暗地里达成交易的场面，齐燮元与江浙财阀的银行家们的会面显得十分光彩。会议开始前，齐燮元和他的随从军官们在一位银行家的上海豪宅中在仆人们的侍奉下享受了精致佳肴。之后，在武装佣兵的看守下，江浙财阀的头目们开始入席。会谈起初的祥和气氛也随着切入正题而退散。\n\n齐联帅要求江浙财阀向宁系提供“保护费”，这样他们就能在安全的环境下继续他们的商业活动。但银行家们当然不愿意接受这个提议，并称他们有能力保护自己的资产。而且，相较于他们在使馆城市那得到的收益，财阀在联合境内能赚的钱根本算不上什么。\n\n见此路不通，齐燮元开始威胁财阀的代表们，说倘若他们不给宁系一些好处，“上海青帮不会让他们继续在上海兜着走的”。虽然齐燮元的恐吓震住了几位代表，但他的威胁未必是个正确选择——在座的银行家中与许多人都与青帮做过交易，并与杜月笙私交甚好，相比之下，齐燮元和他只见过一次的杜月笙的关系显然没那么好。\n\n所幸，银行家们最后还是同意将给宁系一些好处和资源。数小时后，协商完毕，齐燮元得到了他想要的贷款和资源。总算可以歇口气了。"
 league_events.59.a: "齐联帅果然是天生的商人。"
 league_events.60.t: "来自上海的回扣"
 league_events.60.d: "诸省联合财政部报告称，他们发现了一艘来历不明，满载军火与现金的船只，尽管财政部职员不知道这艘船来自何处，只知道它去向何方：联帅府。看来，齐联帅与江浙财阀们的交易终于结出了硕果。齐联帅将持续收取财阀们的贿赂，并确保财阀们在联合内的业务畅通无阻，齐燮元进一步将诸省联合变成了一个由恐惧与恩庇支配的腐败网络。"
 league_events.60.a: "在诸省联合，希望与梦想逐渐窒息。"
 league_events.100.t: "窃国者侯"
 league_events.100.d: "在经过孙传芳遇刺后的紧张局势后，几乎没人相信联合能恢复过来。孙传芳，笑面虎，联帅就是联合，联合就是联帅，一荣俱荣，一损俱损。而一旦孙联帅倒下了，那联合哪还有机会存续呢？未来又将何去何从呢？孙传芳是凭借他娴熟的外交技巧、坚定的信念和军事天才，才得以带领联合走过一次次危机。而几乎没人相信齐燮元这个篡位者，这个甚至被他自己所谓“盟友”的人都嘲笑的家伙，能学到哪怕一丁点孙传芳的政治智慧。\n\n然而事实证明，他做到了。在经过数月的激烈战斗后，联合虽只剩五省，但终究从四面受敌的境地中存续下来。齐燮元巧妙地击败了陈调元的新皖系、南方的国民革命军以及各路敌手，而现在他终于站到了联合这座沙上之塔的顶端。\n\n毫无疑问，齐燮元的下一步是要铁拳镇压所有叛徒、国民党分子、乡村土匪和反租界人士。然而，他的统治还远不能称得上是稳固。虽然联合已经第三次在战场上将国民党击败，但报告显示他们仍有部队集结在邓演达身边，在联合内进行游击战。而土匪也建立了类似的抵抗形式，虽说他们的抵抗相较来说更为缺乏组织。\n\n不仅如此，知识分子、学生和反租界分子也还在反对联帅。而陈调元的背叛也证明我们无法轻易相信那些声称效忠联帅的人，毕竟谁知道他们是不是在等待时机以背刺联合。而理所当然，笑面虎也是阴魂不散，随着战火停歇，孙传芳的拥趸也把目光转向了齐燮元，用怀疑的眼神注视着他。"
 league_events.100.a: "“得嘞，可算赢喽。”"
 league_events.102.t: "督理问题"
 league_events.102.d_1: "即便是在当初那段他们同为孙传芳手下独立的日子里，齐联帅也从来没有相信过陈调元。陈调元不光反德，对与欧洲巨人合作的好处视而不见，而且他对联合的忠诚也是同样脆弱。他曾短暂地与奉系军阀眉来眼去，还与张宗昌等人过从甚密。尽管这没什么奇怪的，毕竟孙传芳本人也和狗肉将军是朋友。但随着孙传芳无力再领导联合，陈调元孤注一掷，试图抢过联合的领导权，而这几乎将联合带到了毁灭的边缘。\n\n显然，由于他的反德政策，安徽如今迫切地需要一位顺从且唯联帅马首是瞻的督理。这也是当下最重要的决定，因为安徽省是全国最富裕、最稳定且最具影响力的省份之一。而如今摆在联帅面前的有两大人选。\n\n第一个选项是指派孙传芳的左膀右臂谢鸿勋。考虑到谢鸿勋被看作是孙传芳手下最不可或缺，也是最忠诚的将军，这使得以通常眼光来看让他坐上这个位置弊大于利。然而，现在的联合里还有许多人将齐燮元看作篡权者，因此把效忠孙传芳的人安排到如此高位的举措无疑会大受欢迎。不过谢鸿勋独立的思想也可能会在未来给我们带来麻烦。\n\n第二个选项由田文炳提出，而这一方案也颇为激进。正是从安徽脱离开始，联合一步步走向了崩溃，也许出于谨慎考虑我们应该稍稍让联合变得更加集权一些。将安徽直接置于齐联帅的掌控之下，这样就使得南京和两个省份的权力都被集中在一个人手上。毫无疑问这将能进一步延伸联帅的权力，收紧对其他省份的控制，不过此举注定不会受到督理们和广大民众的欢迎。"
 league_events.102.d_2: "即便是在当初那段他们同为孙传芳手下独立的日子里，齐联帅也从来没有相信过陈调元。陈调元不光反德，对与欧洲巨人合作的好处视而不见，而且他对联合的忠诚也是同样脆弱。他曾短暂地与奉系军阀眉来眼去，还与张宗昌等人过从甚密。尽管这没什么奇怪的，毕竟孙传芳本人也和狗肉将军是朋友。但随着孙传芳无力再领导联合，陈调元孤注一掷，试图抢过联合的领导权，而这几乎将联合带到了毁灭的边缘。\n\n显然，由于他的反德政策，安徽如今迫切地需要一位顺从且唯联帅马首是瞻的督理。这也是当下最重要的决定，因为安徽省是全国最富裕、最稳定且最具影响力的省份之一。而如今摆在联帅面前的有三大人选。\n\n第一个选项是指派孙传芳的左膀右臂谢鸿勋。考虑到谢鸿勋被看作是孙传芳手下最不可或缺，也是最忠诚的将军，这使得以通常眼光来看让他坐上这个位置弊大于利。然而，现在的联合里还有许多人将齐燮元看作篡权者，因此把效忠孙传芳的人安排到如此高位的举措无疑会大受欢迎。不过谢鸿勋独立的思想也可能会在未来给我们带来麻烦。\n\n第二个选项则是指派享有能征善战美名的上官云相将军。在陈调元叛乱期间，我们靠着许诺给他安徽和浙江而得到了他的忠诚。虽然他可能更难掌控，但遵守承诺能保证他不会背叛联帅。\n\n第三个选项由田文炳提出，而这一方案也颇为激进。正是从安徽脱离开始，联合一步步走向了崩溃，也许出于谨慎考虑我们应该稍稍让联合变得更加集权一些。将安徽直接置于齐联帅的掌控之下，这样就使得南京和两个省份的权力都被集中在一个人手上。毫无疑问这将能进一步延伸联帅的权力，收紧对其他省份的控制，不过此举注定不会受到督理们和广大民众的欢迎。"
 league_events.102.a: "谢鸿勋可以胜任。"
 league_events.102.b: "齐燮元将扩张权力。"
 league_events.102.c: "上官云相已经证明了他的忠诚。"
 league_events.112.t: "帮助我们的中国朋友？"
 league_events.112.d: "近几年来，我们在中国地区的生意获得了巨大的利润。尽管我们在南方的八省联合的贸易不如北方开放的大清国。但是现在八省联合正处于动荡当中，而雪上加霜的是孙传芳又在这个时候遇刺。幸运的是，他的继任者，宁系军阀的齐燮元似乎比他更加亲近我们。海军部建议我们马上向他输送一批装备，来帮助他稳定中国东部极具恶化的局势。"
 league_events.112.a: "给他们送一批枪。"
 league_events.112.b: "我们还有更重要的事要做。"
 league_events.113.t: "德制军械运达"
 league_events.113.d: "华东混战打成了一锅粥，武器弹药关乎每个角逐势力的生死存亡。陈调元的武器弹药有拥护者支应；国民党的枪炮受第三国际补足；诸省联合则只能自力更生，依赖现有的库存和南京兵工厂的生产。还好，我们的德国靠山没有作壁上观。近日，诸省联合收到了从上海转运的多批步兵装备，这些装备上都刻着德属东亚当局的标记。看来，殖民办公厅和海军政府也知悉了诸省联合内的情况。出于对在华影响力的担忧，他们也算是非正式地认可了齐联帅的权威。至少德国人肯认了。"
 league_events.113.a: "“看来海军政府终于肯把咱当回事了……”"
 league_events.114.t: "任命新的浙江督理"
 league_events.114.d: "在将浙系从浙江省铲除后，浙江陷入了群龙无首。失去了陈仪的派阀与上官云相的部队的浙江省现在处于戒严状态，亟待新任督理来恢复秩序。由于陈仪督理长期以来都被八省联合的领导层所疏远，因此面对恶化的局势，他投奔陈调元并不令人意外。由于陈仪出走时带走了浙系的大多数成员，因此新任督理的人选并不多。话虽如此，我们依然有至少两个候选人。\n\n第一个候选人是周凤岐，此人现在正在不情不愿地担任南京卫戍司令。周凤岐是浙江自治运动的一位著名的铁杆支持者，二十年代，夏超发动叛乱后，受到怀疑的周凤岐被孙传芳安置到南京，并被迫镇压1932年的上海起义。周凤岐对孙传芳积怨已久，是浙江督理一职的妥善人选，不过，此人强烈反对中央集权。\n\n第二个候选人是孟昭月，此人效忠孙传芳，是孙传芳最忠心耿耿的追随者之一。孟昭月与周凤岐共同担任联合卫戍司令。作为浙江的第十混成旅的指挥官，若任命孟昭月为浙江督理，必将受到民众和政府的一致欢迎。但此人与孙传芳关系密切且反对齐燮元，这点着实令人头疼。"
 league_events.114.a: "任命周凤岐。"
 league_events.114.b: "任命孟昭月。"
 league_events.115.t: "任命福建督理"
 league_events.115.d: "二十年代中期，孙传芳北上江浙，推行他五省联合的宏图伟愿，督理福建的长期重任就交给了周荫人。这位能干的将军喜好征收苛捐杂税，其治下的国民党运动蓬勃发展。不过在德国顾问的帮助下，周荫人对国民革命军进行了数次围剿，进而加深了对福建的控制，达到了历任督理所不能及的高度。但对我们来说，这位将军有个重大缺点，那就是他与已故的孙传芳交情极深，他们是多年的老同学，关系非常亲近。\n\n虽然福建在周荫人的领导下取得了迅猛发展，但其依然是全国最贫困的省份之一，换掉周荫人的念头就自然而然地出现在了联帅的脑海中。此举不仅能除掉一个可能的对手，又能争取一省民众的欢心，可谓是一举两得。\n\n就目前来看，能接他位置的人是孔昭同。孔昭同自1913年起就在孙传芳手下效命，之后升至北洋军第十三师师长一职，整个二十年代都在与孙传芳并肩作战。而孔昭同同情国民党、支持反租界运动和其他知识分子团体的事也可谓是公开的秘密。他之所以能入齐联帅的眼就是因为他的可塑性，同样让一个激进派当督理也能争取福建百姓和全联合的支持。"
 league_events.115.a: "周荫人会继续担任督理。"
 league_events.115.b: "孔昭同可以胜任。"
 league_events.116.t: "任命江西督理"
 league_events.116.d: "邓如琢督理在华东混战中不幸罹难，虽然许多好事之徒将此事归咎于齐燮元的见死不救，但不管怎么说，江西现在已经没了督理，作为联军和国民党部队的主战场，群龙无首的江西省现正处于长期的军事戒严中。\n\n对邓如琢的继任者，齐大帅只能想到一个人选：方本仁。方本仁出身湖北，于1913年调任江西都督府，二十年代，方本仁先后担任了赣西镇守使和赣南镇守使，当蔡成勋命令他进攻广东的革命党时，同情革命党的方本仁倒戈一击，驱逐了蔡成勋。\n\n方本仁随后成为了江西督办并亲自带领江西正式加入孙传芳的五省联合，但一年之后，吴佩孚强行逼迫方本仁下野。之后方本仁短暂地与国民党沆瀣一气，担任了国民革命军第十一军司令，但在德国干涉军占领广州后，他立刻溜之大吉。虽然有报道指出，他曾向齐燮元和陈调元二人同时抛出橄榄枝，以换取自己能主政江西。但考虑到方本仁在江西的巨大影响力，拒绝任命他为江西督理实在太过危险。"
 league_events.116.a: "祝方督理一切顺利。"
 league_events.117.t: "任命江西督理"
 league_events.117.d: "江西，作为全国最贫穷的省份之一，在过去近十年里一直处于邓如琢的领导下。在他任内，大量德国商人和江南商帮的投资涌入了江西。得益于他的领导，江西经济发展迅速，省内一片欣欣向荣之景。而邓督理本人也是野心勃勃，甚至曾在北伐期间有过推翻孙传芳的计划。尽管如此，他最终还是屹立不倒，并在军队中赢得了广泛的尊重。\n\n但这并不意味着他这督理的位置就坐得稳稳当当了，他的老上司方本仁也是这一位置的有力竞争者。方本仁出身湖北，于1913年调任江西都督府，二十年代，方本仁先后担任了赣西镇守使和赣南镇守使，当蔡成勋命令他进攻广东的革命党时，同情革命党的方本仁倒戈一击，驱逐了蔡成勋。\n\n方本仁随后成为了江西督办并亲自带领江西正式加入孙传芳的五省联合，但一年之后，吴佩孚强行逼迫方本仁下野。之后方本仁短暂地与国民党沆瀣一气，担任了国民革命军第十一军司令，但在德国干涉军占领广州后，他立刻溜之大吉。虽然有报道指出，他曾向齐燮元和陈调元二人同时抛出橄榄枝，以换取自己能主政江西。但考虑到方本仁在江西的巨大影响力，拒绝任命他为江西督理实在太过危险。"
 league_events.117.a: "祝方督理一切顺利。"
 league_events.117.b: "邓督理不会走。"
 league_events.200.t: "南京理事会要求我们介入第五次直奉战争"
 league_events.200.d: "虽然我们的确对北直系在华东混战期间的鼎力支持表示感激不尽，但这并不意味着我们就要介入到他们的战事与冲突之中。据说，齐联帅真心感谢吴佩孚和曹锟对他的帮助，不过作为东南王，他倒也犯不着拿自己的地盘为北边赴汤蹈火。\n\n尽管我们的想法很好，但我们在南京理事会的那些靠山、德国领事馆以及东亚监事会却有着别的盘算。他们向联帅发表了一篇联合声明，声称我们对北京之战事袖手旁观的行径让他们“大失所望”，并敦促南直系和北直系同仇敌忾。为了让这笔交易更加诱人，从而把联帅拉下水，他们还承诺将提供新式德制装备和资金以援助我们作战。\n\n虽然我们可以严词拒绝，但这着实弊大于利，因而齐燮元麾下的许多人士都支持接受这笔交易。可联帅能忍得了那群背信弃义的洋人随意摆布自己吗？"
 league_events.200.a: "虽然很不情愿，但还是从了他们吧。"
 league_events.200.b: "“你个洋鬼子，敢在老子头上撒野？”"
 league_events.201.t: "北京方面要求我们介入第五次直奉战争！"
 league_events.201.d: "虽然我们的确对北直系在华东混战期间的鼎力支持表示感激不尽，但这并不意味着我们就要介入到他们的战事与冲突之中。据说，齐联帅真心感谢吴佩孚和曹锟对他的帮助，不过作为东南王，他倒也犯不着拿自己的地盘为北边赴汤蹈火。\n\n出于南北直系之间复杂的历史经纬考虑，王承斌大帅和玉帅吴佩孚一开始并未试图召集齐燮元联帅参加直奉战争。但值此危急关头，过往的恩恩怨怨似乎都能烟消云散。今天上午，南京的联帅府收到了一封给齐联帅的电报，这封电报由曹锟总裁、吴佩孚大帅、王承斌大帅联合签署，以极尽雄辩的言辞要求诸省联合介入与奉系的战争。\n\n这封电报直言不讳地承认，他们不太指望齐燮元接受这一要求。但他们还是恳求联帅暂时停止哗众取宠和阴谋诡计，让南北直系团结起来，以免双方都被日本人一网打尽。"
 league_events.201.a: "言之有理，是时候放下分歧了！"
 league_events.201.b: "“道不同不相为谋，告辞。”"
 league_events.205.t: "[LEP.GetName]准备干涉战争"
 league_events.205.d_ger: "根据我们在[LEP.Capital.GetCapitalVictoryPointName]的间谍汇报，[LEP.GetLeader]和他的军官们正在准备对[QIE.GetName]发动一场战争。据说德国的南京理事会正在计划为其运入一批军火，不过[LEP.GetLeader]与中央政府关系不合是一个众所周知的事情。\n\n不管[LEP.Capital.GetCapitalVictoryPointName]做出什么选择，我们都必须有所准备。"
 league_events.205.d_noger: "根据我们在[LEP.Capital.GetCapitalVictoryPointName]的间谍汇报，[LEP.GetLeader]和他的军官们正在准备对[QIE.GetName]发动一场战争。我们虽然无法预测[QIE.GetName]是否会被[LEP.GetName]击败，但是[LEP.GetLeader]与中央政府关系不合是一个众所周知的事情。\n\n不管[LEP.Capital.GetCapitalVictoryPointName]做出什么选择，我们都必须有所准备。"
 league_events.205.a: "复国战争路上的又一块绊脚石。"
 league_events.206.t: "陈学昭"
 league_events.206.d: "陈学昭，祖籍河南，1906年生于浙江海宁的一个农民家庭之中。1920年在南通的中国第一家女子师范学校南通女师受预科教育。1922年，她进入上海爱国女学。在加入浅草社后，于1923年发表处女作《我所希望的新妇女》。此外，陈学昭在《新女性》杂志上发表了一篇文章《现代女子的苦闷尾声》，以解释女性选择单身的新现象。\n\n在浙江和北京短暂任教后，出于对新生的社会主义政权的敬畏，她于1927年搬到巴黎居住。陈学昭对革命事业充满热情，受到法国革命成功的鼓舞，她经常与在此流亡的汪精卫等国民党左派见面。1935年在法国克莱蒙大学获文学博士学位后，她回到了她在八省联合控制下的故乡。国民党左派的失败和政府对社会主义的镇压没能阻止她的写作。在此期间，她发表了《巴黎艺术与文学概述》，一篇阐述无产阶级艺术运动的文章，其中包含安德烈·布雷顿等有影响力的法国艺术家的节选。尽管她的作品很可能是无辜的，并且吸引了许多对外国艺术感兴趣的民众，但还是有很多人认为这只是在宣传激进的社会主义。"
 league_events.206.a: "这有什么坏处吗？"
 league_events.206.b: "够了！让她闭嘴！"
 league_events.207.t: "徐悲鸿，东方的艺术巨匠"
 league_events.207.d: "徐悲鸿是江苏宜兴屺亭镇人，自幼随父徐达章习诗文书画。1916年入复旦大学法文系半工半读，1917年留学日本学习美术。回国后应蔡元培的邀请任北京大学画法研究会导师。1919年，在位于巴黎的国立高等美术学院获得奖学金后，他开始了为期十年的欧洲之旅。出乎意料的是，法国爆发了革命，随后新生的社会主义政权开始对艺术产生影响。徐悲鸿在法国期间改用法文名“Ju Peon”，他受到欧洲古典艺术和文化的极大启发，并在著名的国立高等美术学院学习。他将受到无产阶级艺术启发的创意和创新融入他的作品。徐悲鸿的欧洲之旅结束于1927年。回国后，他定居于南京，并在国立中央大学任教。\n\n在1933年，徐悲鸿远赴法国，德国和比利时，举办了中国现代艺术展。他的作品引人入胜，在突出受欧洲观众喜爱的古典风格的同时，也展示了中国的生活场景和文化。对于欧洲人来说，徐悲鸿对中国水墨技法与西方透视和构图的完美结合，是中国日益现代化的标志。"
 league_events.207.a: "一位当之无愧的艺术大师！"
 league_events.208.t: "曾氏定理"
 league_events.208.d: "曾炯出生于江西南昌一个贫困的渔民家庭，因贫穷而多次被迫暂时中断学业。1917年，他考入了江西省立第一师范学校。毕业后，他在中学执教两年。1922年，带着对数学的热情，他进入了武昌高等师范学校就读。1928年，曾炯赴德国柏林大学数学系学习，翌年春转入德国格丁根大学，师从著名的女数学家、抽象代数的奠基人埃米·诺特，攻读抽象代数。他关于拟代数闭包的论文证明了后来被以他的姓氏命名的定理，并于1934年获得博士学位。作为一名受到中德两国的学术基金会赞助的研究者，带着对促进两国关系的期望，他于1937年回到中国并在杭州任教。\n\n华东混战的混乱没能阻止曾炯在学术圈的活跃。最近，他已在中国数学学会杂志上发表了第三篇论文。作为一名能说流利德语的数学教授，他的成就证明了中国教育能够赶上西方的标准。"
 league_events.208.a: "他的工作成果会派上用场的！"
 league_events.209.t: "中国的金嗓子"
 league_events.209.d: "从上海最时尚的俱乐部到南京的大礼堂，她美丽而独特的歌声从留声机里传来，在中华大地的各处响起——周璇已经在中国爆红。在政治形势日益严峻，国家内忧外患的当下，周璇的音乐仍然能安抚人们的心灵，这或许是她充满贫困和悲伤的经历引起了许多听众的共鸣。\n\n周璇原名苏璞，年幼时被抽鸦片的舅舅拐卖到金坛县，从此与亲生父母失散。在13岁时，她获得了“周璇”的艺名，意为“美玉”。正如一块受人敬仰的美玉一样，她的歌曲如《夜上海》，《月圆花好》和《四季歌》等火遍了全国。然而，在光彩夺目的外表之下，她的个人生活却充满了失败的婚姻，私生子甚至是尝试自杀的传闻。但她在贫困潦倒中的崛起毫无疑问给其他人带来了鼓励和希望。她的音乐在中国各地播放，并给各国政要留下深刻印象，为在黑暗中前行的中国带来了一丝光明。"
 league_events.209.a: "这是我们自己的莉莉玛莲！"
 league_war_character_events.34.t: "孙立人为我们效力"
 league_war_character_events.34.d: "新皖系军阀的毁灭与陈调元的反租界运动的失败使许多陈调元的民族主义同胞四处漂泊。在低级军官大部分要么被其他派系所吸收、要么任教于“绿林学校”的同时，大部分陈调元手下的高级领导却逃往使馆城市、日本或者任何一个能找到工作的地方。因为很少人会考虑加入我们的行列，所以孙立人将军和他手下的几个军官来接洽我们确实让我们有点惊喜。由于希望为反租界和民族主义事业而奋斗，他希望被任命到我们正在扩大的军队中。\n\n作为一个安徽本地人，孙立人在年轻的时候就是对抗段祺瑞政府的1919年反协约国抗议中的少数参加者之一。在毕业于普渡大学后，他的反帝信念驱使他去报考弗吉尼亚军事学院。在北伐战争就要结束时，他毕业了，成为了中国新一代军官之一。综合他的履历以及无数潜在的候选人来看，如果我们拒绝他，很少人会为此提出疑问。然而，他的独特受训经历以及年轻的热情包含了太多新一代反帝军官的期望。"
 league_war_character_events.34.a: "反对帝国主义，我们要团结一致。"
 league_war_character_events.34.b: "对付叛徒，要慎重行事。"
 league_war_character_events.35.t: "孙立人为我们效力"
 league_war_character_events.35.d: "新皖系军阀的毁灭与陈调元的反租界运动的失败使许多陈调元的民族主义同胞四处漂泊。在低级军官大部分要么被其他派系所吸收、要么任教于“绿林学校”的同时，大部分陈调元手下的高级领导却逃往使馆城市。不过，剩下的却坚定保持着对中国事业的忠心。因为被我们日益明显的反租界倾向所吸引，孙立人将军带领着一队军官希望加入我们的军队。\n\n作为一个安徽本地人，孙立人在年轻的时候就是对抗段祺瑞政府的1919年反协约国抗议中的少数参加者之一。在毕业于普渡大学后，他的反帝信念驱使他去报考弗吉尼亚军事学院。在北伐战争就要结束时，他毕业了，成为了中国新一代军官之一。综合无数潜在的候选人以及八省联合失败造成的长期混乱来看，如果我们拒绝他，很少人会为此提出疑问。然而，他的独特受训经历以及年轻的热情包含了太多新一代反帝军官的期望。"
 league_war_character_events.35.a: "他这一类人会为中国洗刷耻辱。"
 league_war_character_events.35.b: "我们对败军之将不感兴趣。"
 league_war_character_events.36.t: "孙立人为我们效力"
 league_war_character_events.36.d: "新皖系军阀的毁灭与陈调元的反租界运动的失败使许多陈调元的民族主义同胞四处漂泊。在低级军官大部分要么被其他派系所吸收、要么任教于“绿林学校”的同时，大部分陈调元手下的高级领导却逃往使馆城市、日本或者任何一个能找到工作的地方。由于非常反感中央政府对租借政策的持续支持，一个名为孙立人的年轻指挥官带着一个志同道合的随从与我们接洽，希望能加入我们的行列。\n\n作为一个安徽本地人，孙立人在年轻的时候就是对抗段祺瑞政府的1919年反协约国抗议中的少数参加者之一。在毕业于普渡大学后，他的反帝信念驱使他去报考弗吉尼亚军事学院。在北伐战争就要结束时，他毕业了，成为了中国新一代军官之一。尽管我们似乎并不是他心中的第一选择，但无论如何，只要我们接受了他，他就会坚定地忠诚于我们。其他人则谴责他不过又是一个见风使舵的军人以及想要封疆裂土的潜在军阀，并坚持要逮捕他。"
 league_war_character_events.36.a: "一名心怀崇高事业的士兵应为我们而战。"
 league_war_character_events.36.b: "陈调元之流都是叛徒，孙立人也好不到哪里去！"
 league_war_character_events.37.t: "马登瀛逃出乱局"
 league_war_character_events.37.d: "新皖系军阀的毁灭与陈调元的反租界运动的失败使许多陈调元的民族主义同胞四处漂泊。在低级军官大部分要么被其他派系所吸收、要么任教于“绿林学校”的同时，大部分陈调元手下的高级领导却逃往使馆城市、日本或者任何一个能找到工作的地方。然而，陈调元最得力的下属，也是他左膀右臂的马登瀛带着一份有趣的提案来到了[ROOT.GetNameDef]。\n\n他只要求一份工作与薪水，便愿意为我们的政府效力。马登瀛将八省联合的盗匪统治视作一种耻辱，作为一个有原则的人，他坚定抱有反租界的立场。他作为指挥官的卓越能力也与他的立场相符，即使在八省联合的腐败环境中，他也凭借自己的才能一步步晋升。虽然毫无疑问他更倾向于和他的亲密战友陈调元共事，但他也无疑能为我们的军队提供宝贵的建议。"
 league_war_character_events.37.a: "快请他来作诗一首。"
 league_war_character_events.37.b: "三姓家奴，又想着改换门庭了。"
 league_german_influence_events.1.t: "与南京理事会的会面"
 league_german_influence_events.1.d: "北伐战争期间，德意志帝国成为了直系集团的主要支持者。虽然吴佩孚与曹锟领导下的北直系希望与柏林方面保持距离，明知山有虎的孙传芳还是打着军队现代化的幌子让江苏督理齐燮元深化与德关系。受到马克斯·鲍尔将军思想启发的德国军事顾问团，向齐燮元兜售军队现代化需要经济现代化的观点，这就要求柏林与南京建立起更为紧密的经济纽带。\n\n于是齐燮元选择背着笑面虎，默许诸如克虏伯这样的德资企业发展江苏经济。由于孙传芳和吴佩孚一样反感对外合作，齐燮元始终将联帅蒙在鼓里。齐燮元的小秘密最终在1932年暴露，当时的上海人民对当局日益泛滥的腐败问题失望透顶，孙传芳允许齐燮元放开手去镇压起义。但此事也让联合一度濒临瓦解，陈调元自此开始掌控联合，并将在黑色星期一后力求实现这一目的。\n\n陈调元的未遂政变与联帅的“悲惨”离世让整个八省联合几近彻底解体，多亏了代理联帅齐燮元的及时干预，联合才得以起死回生、东山再起，将那个“陈傻子”赶出安徽，并一劳永逸地解决了闽赣地区的国民党威胁。可是，农村地区在内乱中遭到了严重破坏，齐燮元如今比任何时候都需要柏林的朋友前来助中华民族排忧解难。是时候深化与东亚监事会的合作关系了，就从他们主要的军政机构——南京理事会开始。"
 league_german_influence_events.1.a: "你帮我，我帮你。"
 league_german_influence_events.2.t: "东亚监事会建立新的办事处"
 league_german_influence_events.2.d: "东亚监事会宣布将以中德团结的名义在南京市建立新的办事处，以进一步巩固了我方政府与德国政府之间的联系。孙传芳统治时期，联帅直接控制的领土上完全不受德国影响。德国人只在长江以北的江苏地区和上海的部分地区内有巨大的影响力，浙江基本上不受德国影响，德国人在安徽的渗透也只是偶有进展。现在联合内部的叛徒已被清洗干净，是时候让联帅与柏林之间的合作更上一层楼，给南直系每一寸土地带来现代化了。联帅已经派出一支欢迎队伍去问候来到南京的德国人。"
 league_german_influence_events.2.a: "柏林示好还不领情，笑面虎真是愚不可及。"
 league_german_influence_events.3.t: "德国参与暗杀"
 league_german_influence_events.3.d: "自创建以来，联合的核心人物就一直是笑面虎孙传芳。正是他将联合拧做了一股绳，让南直系的各个督理联系起来，最终取得了巨大的成就。然而，他的遇刺也让他苦心经营的沙上之塔一并倒塌，齐燮元则接过了重担，誓要让一度伟大的八省联合再度统合。\n\n也正因如此，对于为孙传芳之死寻求正义一事，没人比新联帅更加尽心尽力，他也为了孙传芳遇刺案的调查投入了大量资源。然而，现在在调查途中却出现了一个棘手的问题。\n\n虽然目前并无任何证据，但调查员发现南京一位富裕的德国董事可能与刺客有所勾连。东亚监事会在得知了我们的怀疑之后，通知我们此人完全无辜，并要求我们将他移出调查范围。"
 league_german_influence_events.3.a: "德国人说谁无辜谁就无辜！"
 league_german_influence_events.3.b: "管他有没有罪，查一查总没坏处。"
 league_german_influence_events.4.t: "重建浙赣铁路"
 league_german_influence_events.4.d: "自从西方列强打开中国的大门以来，发展中国的铁路就一直是他们现代化的首选办法。铁路有助于在更短的时间里运输更多的资源，这也给法国、英国和俄国带来了大量利润。而德国人也同样在建设和改进中国铁路线上付诸了大量努力，尤其是在联合内部那些笑面虎控制并不那么牢靠的地方。齐燮元与德国的合作大大促进了江苏铁路的发展，但同时也导致了芜湖事变，触怒了陈调元。在联合崩溃期间，华中地区大量的铁路遭到了抗议者和叛匪的损毁。而现在齐燮元已经基本巩固了对华东的控制，重建满目疮痍的南直系也成了当务之急，而重建的首要工作正是基建。但政府收入必须被用在联帅行政的方方面面，因此齐燮元希望向德国申请援助以重建铁路线，毕竟准时的火车是符合所有人的利益的。"
 league_german_influence_events.4.a: "我们应当抓住一切能助力我们修复铁路的经济援助。"
 league_german_influence_events.4.b: "德国人可以在我们“疏忽”的地方自行修复铁路。"
 league_german_influence_events.5.t: "未付的租界租金"
 league_german_influence_events.5.d: "虽然德国一度是向中国贷款的最大金主，但黑色星期一却给了他们沉重的一击。那些曾经利润丰厚的企业现在也缺乏资金，东亚监事会也深陷危机之中。东亚监事会依赖于联合内部各项业务和企业的利润以及德国本土的补贴运作，而华东混战和黑色星期一几乎榨干了他们的经济资产。情势反转，现在轮到东亚监事会无力支付租金费用。尽管齐燮元目前还对他的德国朋友表示理解，但他无法容忍德国人一直不为中德合作关系作出贡献。有鉴于此，齐燮元计划在今日与东亚监事会的董事会商讨付款事宜。"
 league_german_influence_events.5.a: "贷款可以延期，但是下不为例！"
 league_german_influence_events.5.b: "合作和友情可不是免费的！"
 league_german_influence_events.6.t: "控制租界工厂"
 league_german_influence_events.6.d: "东亚总督监事会的财务窘境已然连累了八省联合的收支平衡，但这也不失为机遇。自德国人干预北伐以来，全中国都泛滥着唯利是图的德商德资，洋厂如雨后春笋般在沿海拔地而起，令联帅孙传芳愠怒不已。东亚总督监事会的好日子在黑色星期一算是到头了，他们在中国的资产价值一落千丈，如今齐大帅有了廉价收购德厂并收归国有的天赐良机，定然能以此巩固人民的支持。\n\n当然啦，虽说名义上是为了防止奸商滥用国帑，收缴所得大部分都要用以充实政府所需，但老百姓肯定是站在齐大帅这边，确信他的班底才是中华人民的捍卫者！时日一久，这些厂房也将让八省联合有些正当收入，免得江苏烟土贸易又成了新任联帅的唯一财源——这正是作为江苏督理的齐大帅如此看重上海的原因。孙传芳自以为是地在他管得到的地方重拳出击，长江以南的苏锡常都被取缔了烟土，齐大帅定要纠正这种不智之举。"
 league_german_influence_events.6.a: "生意兴隆！"
 league_german_influence_events.7.t: "德国投资委员会"
 league_german_influence_events.7.d: "在齐燮元与德国的漫长来往中，东亚总督监事会的影响力总的来说被限制在了苏北的沿海地带，偶有向内陆的渗透总要引发不满，最终导致了1932年的上海起义以及最近的芜湖事件。之前与日俱增的德国影响被限于江苏，主要是因为除军事领域的现代化以外，孙传芳厌恶与德国的合作，身处安徽的陈调元又采取坚定的反租界政策以团结南直系的本地势力，并由此来弥补孙传芳对他的排挤和对齐燮元的青睐。\n\n事到如今，笑面虎和陈傻子都驾鹤归西，东亚总督监事会正处于绝佳的境地之中：击败投机客们以止乱制暴，并创立一个投资委员会以规制本地区的德国生意。尽管这当然是好消息，但也有人对联帅进言，忧心于德国势力过度扩张，不过厉麟似这些人倒也盛赞巩固中德联系定能反制日本帝国主义。"
 league_german_influence_events.7.a: "好极了。"
 league_german_influence_events.7.b: "没必要让他们帮忙。"
 league_german_influence_events.8.t: "来自德国的重建物资援助"
 league_german_influence_events.8.d: "1930年，在复员问题上的强烈分歧与北京方面自第四次直奉战争相对软化的态度双重作用下，孙传芳趁势将湘、桂、粤三省军阀纳入联合，并许之以相较核心五省更多的自治权。多年以来，南方各省督始终戒备着南京中央，在笑面虎遇刺之后，更是一举退出了联合。\n\n即便南方各省督在政治上保持着自治，但联合内部的经济都因发展与现代化的需要纠结缠连在了一起。南方的独立导致联合内部出现了庞大的资源缺口，许多传统的产业一夜之间荡然无存。为了缓解这一问题，东亚监事会建议我们放宽对德国进口商品的管制，当然是等到我们经济恢复正常之后。"
 league_german_influence_events.8.a: "这是为了中国的利益啊。"
 league_german_influence_events.8.b: "孙传芳对德国佬严防死守是有道理的……"
 league_german_influence_events.9.t: "处理通货膨胀"
 league_german_influence_events.9.d: "中国的法定货币银元不算是一种很稳定的货币。虽然在第四次直奉战争后的十年内，银元有过短暂的繁荣，但黑色星期一和八省联合的崩溃使银元陷入了困境。值得庆幸的是，由于中国很多地区的工业化程度较低，缺乏与全球贸易的联系，因此中国得以避免黑色星期一的最坏影响，但我们的货币状况仍处于风险之中。\n\n为了防止全面金融崩溃，东亚监事会承诺可以让德华银行为银元提供支持，以此换取各种金融让步。此举肯定会有助于齐联帅宣传自己的治理能力。但齐联帅并没有忘记，德国人始终以自己的利益至上，在经济上过于依赖柏林绝非万全之举。"
 league_german_influence_events.9.a: "和让诸省联合恢复财政稳定比起来，这点代价不值一提。"
 league_german_influence_events.9.b: "诸省联合不需要这种援助也能渡过难关。"
 league_german_influence_events.10.t: "德华银行贷款：启动"
 league_german_influence_events.10.d: "受东亚监事会掌控的德华银行是本地区现存的规模最大的金融机构。在孙传芳时代，德华银行虽然与八省联合建立了联系，但其仅向江苏省政府提供了大额经济援助。随着齐燮元掌控了整个联合，与德华银行加强合作将有助于振兴联合经济，使诸省联合再次成为中国第三大势力。当然，这种合作很可能会以激起中国民众的反租界情感为代价。但联帅已做足了准备，绝不会让不守法度的暴徒左右中国的未来。"
 league_german_influence_events.10.a: "银行对诸省联合大有裨益！"
 league_german_influence_events.11.t: "德华银行贷款：规模"
 league_german_influence_events.11.d: "德华银行已同意通过一笔低息贷款来协助联帅重建联合经济，但他们也暗中期望能让德国企业在联合领土内享有特权。齐燮元现在的关注重点是贷款数额。一笔更大的贷款将更具成本效益，但也会让联帅在未来不得不向柏林的利益让步，而较小的贷款会提供更少的可用资金，但这些钱或许也足以刺激联合的经济增长。"
 league_german_influence_events.11.a: "要么做大，要么出局。"
 league_german_influence_events.11.b: "天上掉下来的钱，我不拿白不拿。"
 league_german_influence_events.11.c: "少要一点，我命由我不由人。"
 league_german_influence_events.12.t: "德华银行贷款：对象"
 league_german_influence_events.12.d: "作为全国最富庶的地区之一，华东是中国经济的支柱。随着联合了统治长江入海口，长江贸易基本处于我们的掌控之下。当然，这就是为什么使馆城市选择将其总部设在上海，因为它可以更好地管控长江贸易。沿海城市成为了富庶的区域，也成为了中国少数能完全融入资本主义体系的地区之一。\n\n虽然东亚总督监事会现已覆盖华东联合的所有领土，但它仍然将总部设在江苏省——其运作的核心，这都是因为齐联帅与监事会之间的友谊。尽管华东混战和黑色星期一对我们的经济造成了极大的破坏，华东联合仍然坚定不移地对抗所有叛徒以及社会主义叛军。由于各领域遭受到了不同程度的破坏，有人建议齐燮元：南京方面应当优先选择某一特定行业进行扶持，为其提供贷款，以最大化其效益。"
 league_german_influence_events.12.a: "消费品生产优先。"
 league_german_influence_events.12.b: "铁路建设优先。"
 league_german_influence_events.12.c: "军工优先。"
 league_german_influence_events.13.t: "东亚监事会催我们赶紧还钱！"
 league_german_influence_events.13.d: "与列强的合作对中国来说一直是一把双刃剑。西方的投资确实推动了中国经济走向现代化，但也少不了弊端。毕竟列强进入中国不是来搞慈善或者搞共荣的，纯粹是为了来牟利的。\n\n因此随着华东的金融情况越来越紧张，东亚监事会出面要求联合政府提前偿还德华银行债务丝毫不让人感到意外。齐联帅已经默许了德国人提出的新条件，毕竟德国人掌握着这段关系中的主动权，而我们只能予取予求。"
 league_german_influence_events.13.a: "洋人鼠辈！"
 league_german_influence_events.14.t: "东亚监事会银行业的扩张"
 league_german_influence_events.14.d: "在世界舞台上，虽然德意志帝国在各个地区的影响力都有所减弱，但似乎柏林在中国的利益却更加稳固了。由于黑色星期一对经济产生的冲击，以及陈调元和国民党造成的破坏，齐联帅与东亚总督监事会和德华银行达成了多项协议，使其得以扩大在该地的经济垄断。虽然他们的影响力不如日本对东北地区的掌控，但这还是引发了很多人对中国未来所产生的担忧。不过就目前来说，齐联帅还是愿意容忍此事的，因为这给联合的经济带来了直接的利益，而且在他看来，中国的终极目标就是繁荣。"
 league_german_influence_events.14.a: "对他们有好处，对我们也有好处。"
 league_german_influence_events.15.t: "德华银行收购联合的银行"
 league_german_influence_events.15.d: "孙传芳联帅认为，中国的命运应该掌握在中国人手中，尤其是他自己手中。为此，孙传芳在八省联合内推行了货币改革，这一改革推动了八省联合地区的银行业发展，尤其是在苏浙两省。然而在黑色星期一中，这些银行遭受了重创，许多银行陷入了投资失败与大规模挤兑中。德华银行趁虚而入，收购了许多八省联合地区的破产银行。这一行为严重打击了齐联帅的野心，并且违背了孙传芳的遗志。随着德国势力不断破坏联合的经济，许多政府内部人士都开始向齐联帅请愿，要求他捍卫中国人民的权利，阻止这种外国剥削和资本游戏。"
 league_german_influence_events.15.a: "自由市场嘛，可以自由一点……"
 league_german_influence_events.15.b: "银行必须留在国人手里，这是底线。"
 league_german_influence_events.16.t: "开放内地：启动"
 league_german_influence_events.16.d: "虽然华东联合对德国在内地的有限扩张打开了大门，但这样的协定还没有正式敲定下来。齐联帅已作出决定，是时候正式确定德国可以进入联合内地了，此举会只使他做出小小的让步，却会使他得到德国游说团的青睐。德国代表团已经正式抵达了南京，以与齐燮元商定条款。联帅希望能为自己和华东联合争取到最有利的协议。\n\n虽然齐燮元可能不比孙传芳，但凭借着在江苏与德国人打交道的数年经验，他在和德国人谈判这方面还是有着独特的优势的。江南商帮派出了他们自己的代表，以确保中国商人和企业家的利益也得以纳入考量之中。景星会也派出一名成员加入到谈判之中，以在促进中德友谊的同时确保中国被视为平等的合作伙伴。德国代表团则希望能将其在江苏省所享有的特权扩展至整个华东联合。"
 league_german_influence_events.16.a: "希望一切顺利。"
 league_german_influence_events.17.t: "开放内地：中国人的地位"
 league_german_influence_events.17.d: "联合内部关于开放德国企业的谈判正如火如荼进行中，此时联帅所关心的，乃该地区本土企业之命运。孙传芳时期出手培养了许多忠诚的企业，并助其成长为江南商帮，这是八省联合中的一大商人联盟。虽然德企正式进入中国内地将带来巨大的商机，但江南商帮亦对可能的竞争风险感到辗转难眠。\n\n由于担心享受柏林补贴的德企将狠狠超越本土中企，从而破坏该地区许多商人的生计。为促进中企的利益，江南商帮决定派出代表参与谈判，祈求联帅齐燮元推动对德企的严格监管。而德国人则反过来要求联帅在整个联合中都给予他们企业特权地位，并表示愿意向齐政府提供慷慨的捐款做为回报。"
 league_german_influence_events.17.a: "德国企业将受到监管，以保障中国的利益。"
 league_german_influence_events.17.b: "中德企业将受到同等的自由市场规则的约束。"
 league_german_influence_events.17.c: "柏林给出了一个令人信服的理由……"
 league_german_influence_events.18.t: "开放内地：德国人的地位"
 league_german_influence_events.18.d: "解决了诸省联合内地的华商问题后，齐大帅提出了第二项谈判事宜。自从西方列强在中国沿海地区为自己开辟租界以来，欧洲列强诸国的公民就一直在租界内享有特权，当地的中国人则是二等公民。\n\n齐燮元并不关心欧洲人在租界内的地位如何，但诸省联合内地就是另一码事了。与沿海租界不同，德国人在内地地区不享有任何特殊权利，由于孙传芳坚持将德国的影响力限制在沿海地区，因此他从未与德国人讨论过内地特权问题。江南商帮坚决抗议给予德国公民内地特权，并要求齐燮元联帅起草一套仅适用于德国国民的新法律。\n\n景星会建议在内地平等地对待德国和中国公民，以促进中德间的平等关系。德国代表团则愿意向诸省联合政府支付一笔丰厚的款项，以换取将德国人在租界内的特权扩张到所有诸省联合的领土上。"
 league_german_influence_events.18.a: "德国公民必须遵守新规定。"
 league_german_influence_events.18.b: "法律面前，中德平等。"
 league_german_influence_events.18.c: "德国人可以有特权！"
 league_german_influence_events.19.t: "开放内地：德国人抵达"
 league_german_influence_events.19.d: "随着多数谈判业已完成，德国企业已经开始将业务自江苏与沿海租界等地扩展到联合领地深处。齐联帅燮元认为，德企在同盟中的增长可望提升该地区的经济，而这些经济成长则可借由税务狠刮一笔，从而使其政府受益。\n\n景星会称赞此一谈判乃中西关系的历史性时刻，并希望中国与柏林的贸易行为能多加改善中国在西方的形象。江南商帮对德国势力深入联合内部仍持谨慎态度，并准备让该地区的企业与德企竞争。东亚总督监事会已在江西农村正式启动了多个开发方案。"
 league_german_influence_events.19.a: "联帅确信，一切都将好起来。"
 league_german_influence_events.20.t: "开放内地：经济纠纷！"
 league_german_influence_events.20.d: "不幸的是，对于齐燮元联帅来说，进入联合内部的德资势力似乎引起了很大的麻烦。多家中企向江南商帮投诉，指控德国人掠夺江南商帮原本在农村地区的资源，特别是江西的钨矿。除此之外，他们还指控德国人在该地区垄断经济实力，尤其在德国大量投资的地区欺凌中国本土企业。江南商帮已向联帅转达了他们的不满与担忧。作为响应，东亚总督监事会反过来声称中方官员未与德企充分合作，有时甚至彻底阻碍着德资势力在该地的行动。随着局势变得紧张，联帅必须决定相信哪一方。"
 league_german_influence_events.20.a: "东亚监事会不要得了便宜还卖乖。"
 league_german_influence_events.20.b: "江南商帮给我安分点！"
 league_german_influence_events.20.c: "两边都得吃个教训……"
 league_german_influence_events.21.t: "开放内地：大功告成"
 league_german_influence_events.21.d: "随着第一波投资热的结束，我们的内地省份得到了蓬勃的发展，一个新“常态”也由此诞生。虽然我们的决策的造成的后果仍需要数十年时间才能浮现出来，但是我们已经开始感觉到了经济走向正在发生变化。东亚监事会已经停止了对该地区中国企业的怀疑，曾经与德国人摩擦不断的江南商帮现在也平静了下来。现在，中德企业正在并肩作战，共同拉动安徽、江西、福建等地区的经济。联帅本来只指望不出什么乱子就行，而现在的和平共处状态令他大喜过望。"
 league_german_influence_events.21.a: "终于都安生了。"
 league_german_influence_events.22.t: "扩建山东铁路"
 league_german_influence_events.22.d: "随着德国人进入八省内地一事尘埃落定，内地的铁路就成为了中德外交官之间讨论的新焦点。为了开采并运输更多的资源，德国人在整个中德关系中一向非常重视铁路和基础设施发展，而现在他们正要求齐燮元联帅赋予山东铁路公司对内地铁路的完全控制权。\n\n东亚总督监事会宣称，此举将有助于加速铁路建设，而联帅也将拥有全国最发达的铁路，亦可向中国其他地方展现其卓越的治理能力。与江南商帮和景星会结盟的官员们则建议联帅仍保留对铁路的一定控制权。江南商帮甚至还向联帅建议，一旦山东铁路公司滥用权力，就将德国拥有的铁路收归国有。"
 league_german_influence_events.22.a: "联帅将尊重德国人的收购。"
 league_german_influence_events.22.b: "齐燮元要求政府应与德国人平起平坐！"
 league_german_influence_events.23.t: "铁路款项"
 league_german_influence_events.23.d: "为了发展内地的基础设施，诸省联合政府向德华银行申请了一笔巨额贷款以用于投资铁路建设项目。齐联帅选择将这笔贷款用于投资山东铁路公司，从而推动乡村地区发展。\n\n然而，投资内地的利润尚未足以偿还贷款，南京理事会就礼貌地提醒我们，他们期望我们尽快偿还这笔巨额贷款。齐联帅不得不想方设法来向他的德国盟友还债，或是试图忽略这笔款项，但这么做后果可能很严重……"
 league_german_influence_events.23.a: "德国人会拿到钱的。"
 league_german_influence_events.23.b: "也许可以放松对德国人业务的管制来抵账……"
 league_german_influence_events.23.c: "还钱？什么钱？"
 league_german_influence_events.24.t: "山东铁路扩建"
 league_german_influence_events.24.d: "在我们的持续支持下，山东铁路公司不断在内地扩张铁路网。江西省现在拥有能与江苏省媲美的铁路基建了，而福建省沿海和内地的主要城市也实现了更高效的交通连接。尽管如此，江南商帮仍然对近期的安排感到不安，但即使是他们也不能否认，德国人确实擅长让火车准点到站。"
 league_german_influence_events.24.a: "棒极了。"
 league_german_influence_events.25.t: "征收铁路税？"
 league_german_influence_events.25.d: "联合无法再资助山东铁路公司以期迅速获取回报，因为齐燮元无力偿还欠下东亚总督监事会的大量债务。一些知识分子提出了最先为北京所提出的想法，即向民众征收铁路税以支付铁路持续扩张的所需费用。这会使联帅避免过度依赖于德国的资助。\n\n齐燮元仍然可以利用山东铁路公司那让人印象深刻的商业模式。政府内部有人对这种做法表达了担忧，因为对民众征税这点正是闽赣历任治理者不得人心并直接导致了国民党发起叛乱的原因。其他人则提醒齐燮元称，孙传芳反对对农民征税，正是他的承诺使他成为了一名受人拥戴的统治者。"
 league_german_influence_events.25.a: "所有人都应该出份子！"
 league_german_influence_events.25.b: "以孙传芳的名义，我们将对农民免征税赋。"
 league_german_influence_events.26.t: "德国人请求免税权"
 league_german_influence_events.26.d: "虽然新的铁路税推行得出人意料的顺利，但东亚总督监事会还是提出了一些要求。出于傲慢，东亚监事会要求我们对所有德国企业免征新铁路税。他们宣称税收对他们在当地的经济利益产生了损害，而如果齐燮元仍然重视中德关系的话，联合应该在这一事务上给予他们更多特权才是。他们完全无视了我们征收这笔税款是为了支付他们的铁路的事实，而他们对这一要求还相当坚持。联帅预计将在今晨回应德国人。"
 league_german_influence_events.26.a: "那我们就给德国人点好处吧。"
 league_german_influence_events.26.b: "这群跳梁小丑应该察言观色。"
 league_german_influence_events.27.t: "东方资源委员会：建设"
 league_german_influence_events.27.d: "东方资源委员会内的中国商人和东亚监事会的垄断资本家终于成功搁置了争议，并将一齐为逐利而合作：中国人将提供矿脉和开采所需要的人力，而德国人将提供专业技术和设备来充分开采资源。江南商帮和东亚监事会驻南京代表团罕见地达成了一致，对东方资源委员会的工作表示了赞扬。"
 league_german_influence_events.27.a: "我看啊，不过是为逐利而同床异梦罢了。"
 league_german_influence_events.28.t: "德国人在委员会中的地位"
 league_german_influence_events.28.d: "鉴于现在这种糟糕的局面，东亚监事会要求立刻重组东方资源委员会，他们认为现在的委员会无法充分满足德国人的利益。这意味着他们希望重新将这个委员会完全纳入自己的控制中。尽管这是一次激烈的权力争夺战，但是如果没有东亚监事会作为后台，整个委员会也会成为一个名存实亡的空壳机构。\n\n江南商帮谴责东亚监事会破坏了东方资源委员会内原本的团结，他们要求齐联帅拒绝东亚监事会的建议，并要求景星会提供本土专家以弥补损失的德国技术知识。景星会则建议联帅接受东亚监事会的要求重组委员会，但重组后的委员会需要唯联帅马首是瞻。"
 league_german_influence_events.28.a: "就让德国人做主吧……"
 league_german_influence_events.28.b: "联帅才最后说了算，明白吗？"
 league_german_influence_events.29.t: "东亚监事会要求重新协商在华德国人的权利问题"
 league_german_influence_events.29.d: "随着东方资源委员会重新工作并为所有相关方带来利润，东亚总督监事会又提出了一项充满野心的要求。尽管德国人已经在联合内地拥有了一定特权，但这些特权并不如他们在租界中取得的特权全面。\n\n德国驻南京代表团请求联帅赋予德国公民及企业以和沿海租界相同的永久特权，并承诺德国将进一步向山东铁路公司加以投资。联帅明白东亚监事会索求的这些特权肯定会损害中国内地的企业，正如江南商帮经常提醒他的那样，但他仍然举棋不定。"
 league_german_influence_events.29.a: "尽情发号施令吧，绅士们。"
 league_german_influence_events.29.b: "此等要求断无接受之理。"
 league_german_influence_events.31.t: "东亚监事会设立专属经济区"
 league_german_influence_events.31.d: "尽管我们与德国佬之间的关系实属互惠关系，但在某些情况下，联帅的政府却仍然……受限于对柏林商人的承诺。近期，东亚总督监事会利用他们在联合中的过大影响力，在多个城市中心设立了一系列专属经济区。这有效巩固了他们对联合投资的垄断地位。虽然此举在很大程度上只不过是对既定事实的承认而已，此事还是引发了人们对东亚监事会的担忧，因为他们能随心所欲地操纵诸省联合政府并使其屈服。"
 league_german_influence_events.31.a: "这是为了中国的利益。"
 league_german_influence_events.33.t: "德国人接管了我们的经济！"
 league_german_influence_events.33.d: "该死的消息传到了联帅府之中！东亚总督监事会一向都潜移默化施加影响力，最初为联帅本人所悦纳，但他们现在逐渐将其爪牙伸向我们这个寡廉鲜耻的政府中的方方面面了。通过贿赂、任免和以经济影响作为胁迫，德国佬已经完成了他们在暗中策划的阴谋诡计。在最后的经济颠覆中，德属东亚当局很显然将联合全部德国化了。德国银行、德国工厂和德国商店充斥着整个街道。马克的使用远超银元，德语在商务会话中与中文一样常用。齐燮元联帅担心自己可能被当成傻子一样耍了，因为联合已俨然成为了德国的附属。"
 league_german_influence_events.33.a: "“我都……做了什么呀？”"
 league_german_influence_events.50.t: "联合与德属东亚的关系"
 league_german_influence_events.50.d: "尽管严格来说我们的合同都是和东亚总督监事会签署的，但是这个准政府组织实际上是德属东亚当局的延伸，与德属东亚受到同一个监事会管辖。东亚监事会与德属东亚殖民办公室的利益高度绑定，为那远在柏林的德皇充当白手套中间人。为了表示合作的诚意，东亚监事会建议我们向德属东亚当局正式提出外交协议，以巩固双方共同的经济利益。"
 league_german_influence_events.50.a: "朋友总比敌人好。"
 league_german_influence_events.51.t: "东亚监事会请求我们的帮助！"
 league_german_influence_events.51.d: "看来并非只有我们面临秩序和权威崩溃的问题。德属东亚在世界大战中得到了殖民地作为战利品，但他们却从未能在印度支那维持有效的统治。在30年代初期发动过一次失败起义的印度支那民众，如今又卷土重来，试图从德国人手中争得解放。\n\n情况对于德属东亚海军部以及东亚监事会来说都不容乐观，他们甚至拉下面子来”请求“联合向他们提供弹药、武器以及其他补给。联帅政府内的许多人都对是否援助德国人犹豫不决，毕竟联合自身还有诸多问题亟待解决，而这些物资对我们自己来说也无比宝贵。\n\n尽管如此，我们政府内的亲德派，以及像厉麟似领导的景星会一类的组织，都极力劝说齐燮元接受要求，他们认为这一举措能证明中德关系是平等的。"
 league_german_influence_events.51.a: "他们将得到我们的全力支持！"
 league_german_influence_events.51.b: "给他们送点装备。"
 league_german_influence_events.51.c: "“求老子帮忙？笑话。”"
 league_german_influence_events.53.t: "联合与德属东亚的关系加深"
 league_german_influence_events.53.d: "随着我们与东亚监事会的联系不断加深，我们不光与监事会中富有进取心的商人之间签订了更多的经济协议，也与殖民办公室之间实现了牵线搭桥。德属东亚当局已经向联帅府上发来了示好的电报，在电报中盛赞齐联帅的聪明才智与政治才能。虽然齐联帅一眼就看穿了德国人的甜言蜜语，但东亚监事会也确实让这笔交易变得更加甜蜜。德国人控制下的当地企业向我们起草了一份全新的正式经贸协定，而这份协议对我们着实有利。"
 league_german_influence_events.53.a: "一个好汉三个帮。"
 league_german_influence_events.54.t: "东亚监事会要求德属东亚驻港权"
 league_german_influence_events.54.d: "尽管德国人已经在山东有了通商口岸，还控制着中国水平最高、规模最大的造船厂与设备，东亚总督监事会还是向联帅府发送了一封电报。这封电报以极其谦卑的语言请求联帅允许德国太平洋和东亚舰队同时使用联合的造船厂，并在其中使用自己的造船设备。尽管他们向联帅保证说，这不过是为了应对东海可能爆发的混乱海军行动而采取的简单预防措施，但这掩盖不了他们对诸省联合主权的公然侵犯。"
 league_german_influence_events.54.a: "这能让我们更好地抵抗日本。"
 league_german_influence_events.54.b: "让他们的船老老实实待在青岛。"
 league_german_influence_events.55.t: "东亚监事会要求军事通行权"
 league_german_influence_events.55.d: "联帅府上又收到了一封背信弃义的电报，这封电报是东亚总督监事会代表其德属东亚主子所写的。胆大包天的东亚监事会要求联帅批准德属东亚部队的军事通行权，允许他们的部队在诸省联合境内行军或停留。此举表面上是为了保护德国在华的利益，但包括齐联帅本人在内的很多人都清楚，这不过是为了收紧联帅脖子上的绞索而使的伎俩。此举无异于将我们的大部分主权都割让给德国人。"
 league_german_influence_events.55.a: "很遗憾，我们必须接受。"
 league_german_influence_events.55.b: "扯淡呢吧？没门！"
 league_german_influence_events.56.t: "东亚监事会要求独立保障"
 league_german_influence_events.56.d: "东亚总督监事会向联帅发来电报，提出了一个看似合理的荒谬要求：他们要求诸省联合为德国人在亚洲的殖民地全力提供军事保障。随着德日关系持续恶化，东亚监事会要求诸省联合全力保护德国在亚洲的殖民地，并且要求我们对任何侵犯德国主权的行为进行响应。这一要求等同于让诸省联合脱离中国其他地区，单独加入帝国公约的势力范围，但此事恐怕无法避免：奉系军阀和他们的日本主子已经在摩拳擦掌，对我们虎视眈眈了。"
 league_german_influence_events.56.a: "中与德，手牵手。"
 league_german_influence_events.56.b: "你他妈知道我们没资格许这种诺吗！"
 league_german_influence_events.57.t: "转让租界"
 league_german_influence_events.57.d: "看来我们与德国殖民政府的“伙伴关系”已经到了无法挽回的地步。为了公开展示其对诸省联合的域外规治力和影响力，东亚监事会决定不经联帅许可就剥夺了诸省联合对境内租界的领土与海岸线的直接控制权。当诸省联军试图用武力夺回土地时，德国殖民地军队对他们予以了全力反击。齐联帅对此事无可奈何，他的所作所为已经让中国沉沦在新一轮的百年国耻里。"
 league_german_influence_events.57.a: "“大祸已铸，悔之晚矣。”"
 LEP_governor_replace_decisions: "处理督理们"
 LEP_governor_replace_decisions_desc: "八省联合是一个混杂的官僚与军官复合政府。除去这些官僚和军人外，各省还有不同的督理，这些人治理各自的省份而且只向联帅孙传芳负责。当陈调元发动叛乱导致联合崩溃后，这个政府也随之土崩瓦解，各地的叛军纷纷尝试夺取当地的控制权，而各个督理则逃向南京寻求庇护。现在联合的局势已经相对稳定，是时候开始重建我们的政府，同时把这些督理派回他们的领地了，当然有些地方也需要找一个新的督理。"

 LEP_temp_suppress_kmt: "镇压国民党行动"
 LEP_temp_suppress_kmt_desc: "国民党左派在南方农村持续肆掠，特别是在福建省。目前我们一来没有足够的资源，二来缺乏一致性战略，无法进行全面的围剿作战，只能暂时将其压制在一定程度。\n§R如果齐燮元巩固了他的统治，则需要完成§Y消灭国民党游击队§!国策，才能永久清除国民党的存在！§!"
 LEP_decision_lower_kmt_unrest: "铲除国民党"
 LEP_decision_lower_kmt_unrest_desc: "现在我们已开始对国民党动用围剿战术，是时候一举铲除福建和周边地区的国民党特务和恐怖分子余孽了。"

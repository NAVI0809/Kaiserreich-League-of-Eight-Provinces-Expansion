 LEP_ma_yuren_commander_desc: "§Y生于：§!§L1875年；大清、江苏省盐城§!\n§Y派系：§!§a津保派§!\n§Y背景：§!§L马玉仁出生在以盐为名的盐城，13岁丧父后，以贩卖私盐为生。清政府査禁私盐极为严厉，他便武装对抗缉私，一次，他的私盐船队打死打伤多名缉私盐警，因而遭政府通缉。后来缉私营由青帮头子徐宝山统领，徐赦免马玉仁罪，并允其入伍。\n\n辛亥革命爆发，马玉仁随徐宝山投入袁世凯领导的民国政府，1911年同清朝的忠实追随者交战，率部攻下了南京雨花台。此后，他的军职不断升迁。1920年，直系政府将他晋升为师长，以表彰他的忠诚。1924年江浙战争爆发，马玉仁因再立战功被孙传芳委任为军长。从此，他就一直在联帅帐下效命。对于联帅而言，他是个独特的下属，没有受过正规军事训练，却又品格不凡。不过，有传言声称联帅并不信任马玉仁。§!\n\n§Y备注：马玉仁体格壮硕、力大无穷，兼有武艺傍身，据说他当年贩卖私盐时，随便就是个十几里，他一担就是挑200斤。因为早年贩卖私盐的经历，他练就非传统的作战本领，此外他也经常亲自带队冲锋。§!"
 LEP_qian_zongze_commander_desc: "§Y生于：§!§L1891年10月23日；大清、浙江省杭州§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L尽管与孙传芳麾下的其他将领相比，钱宗泽是一名相对不知名、年轻且经验不足的指挥官，但他在联合中占有重要地位。他既负责管理中国东南的铁路，也负责管理中国最繁荣省份之一的浙江的警务。\n\n1914年，钱宗泽毕业于保定陆军军官学校第一期步兵科，后于1919年从陆军大学第五期毕业，尽管他的受教育程度很高，但他的军旅生涯却十分独特。在浙军第二师短暂服役后，钱宗泽奉派法国考察军事，留法期间，他目睹了那里的剧变和革命。\n\n1921年回国后，北京政府任命钱宗泽为护路警察总局副局长，而非普通的指挥或参谋职位。1927年，孙传芳任命钱宗泽为浙江省警务处处长，同时把维护铁路安全和监督军事运输的任务交给了他。§!\n\n§Y备注：鉴于德国有兴趣大规模投资中国的铁路基础设施，钱宗泽支持与德国建立更紧密的关系。在钱宗泽看来，铁路将会带来经济繁荣和军事现代化。§!"
 LEP_wang_haoji: "汪镐基"
 LEP_ge_jingen: "葛敬恩"
 LEP_lin_wei: "林蔚"
 LEP_lin_wei_commander_desc: "§Y生于：§!§L1889年；大清、浙江省黄岩§!\n§Y派系：§!§c浙系§!\n§Y背景：§!§L林蔚早年在家乡中学毕业后，考入南京江南水师学堂工程科。他是一名颇有才干的学员，后来又考入陆军大学第四期以继续其军事生涯。1916年毕业后，林蔚返回浙军任工兵营营长。这位能力出众的指挥官旋即升任团长和所部参谋处长。\n\n林蔚是一名细致缜密的指挥官，在参谋工作和后勤事务方面表现出色，因其计划缜密周到而闻名。有鉴于此，陈仪于1926年邀请他出任浙军第一师参谋长。在接下来的十多年里，他与陈仪的参谋长葛敬恩一起处理各种军事行政事务，并为他的上级出谋献策。随着陈仪的影响力逐步扩大，为了巩固自己的政坛地位，陈仪曾多次提拔林蔚。然而，林蔚却对这类事情并不感冒。§!\n\n§Y备注：林蔚是葛敬恩的陆大同学。林葛二人都是陈仪的得力部下。§!"
 LEP_guo_chan: "郭忏"
 LEP_guo_chan_commander_desc: "§Y生于：§!§L1894年4月18日；大清、浙江省诸暨§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L郭忏生于一户贫苦农民家庭，一岁的时候父亲就因病去世，从小就被迫承担起养家糊口的责任。由于家境拮据，在得知浙江陆军小学堂是一所官办免费学校、且学习内容与普通小学无异后，郭忏于1908年投考该校。\n\n辛亥革命开始后，郭忏和同学们纷纷加入浙江光复军，包围了该省的清政府衙门。1914年，他动身前往中国近代无数重要军事领袖的摇篮武昌，进入武昌的陆军第二预备学校学习。两年后，他进入保定军校第六期炮兵科，后于1919年毕业。\n\n郭忏是一名受过良好教育的军官，毕业后成为浙军中的一名低级军官，归属于连襟周凤岐麾下。他在浙军中服役多年，参加过多场战争，包括与国民革命军的战斗以及多次内部镇压行动，靠着自己的军事能力而非与周凤岐的裙带关系，他的军衔稳步上升。郭忏胸怀革命信念，是这个积贫积弱国度里的一名年轻改革者。§!"
 LEP_li_rentao: "李忍涛"
 LEP_xu_peigen: "徐培根"
 LEP_li_shijia: "李世甲"
 LEP_wu_zhennan: "吴振南"
 LEP_wang_shouting: "王寿廷"
 LEP_shen_jingchen: "沈觐宸"
 LEP_tian_wenbing: "田文炳"
 LEP_li_linsi_advisor_desc: "§Y生于：§!§L1896年2月18日；大清、浙江省杭州§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L厉麟似生于浙江名门杭州厉氏家族，自幼饱读文学经典。1915年毕业于同济大学后，厉麟似赴日本上智大学留学四年，回国后又以优异的成绩考取了官费赴德留学生，留德期间先后获得了德国耶拿大学法学硕士学位与海德堡大学哲学博士学位。\n\n在十多年的游学生涯中，厉麟似潜心钻研政治学、教育学、军事学及英文、法文和俄文。1921年，他在德国创办了著名的汉学研究组织——景星学社，并创办了首个专门研究汉学的专业学术期刊《汉学》杂志。他与卫礼贤(Richard Wilhelm)一道，致力于帮助西方人理解中国文化的内涵和意义，还结识了周恩来、朱德和朱家骅等一批留德学人。\n\n1930年，厉麟似怀着满腹经纶与满腔爱国热忱返回祖国，进入教育部任职，在联合治下工作。为了促进国家教育事业与文化外交事业，他成立了中德文化协会、中国教育学会和中国教育电影协会。厉麟似是南京大学教授，也是中德学会董事。为了加强与中国和中欧同盟的联系，厉麟似曾访问欧洲各国以推动双方教育研究领域的进一步合作。\n\n厉麟似在与德国驻华军事顾问团的合作中担任翻译，并于1935年末在南京成立了中德之间的第一个官方交流机构。§!\n\n§Y备注：厉麟似是顾维钧的密友，两人都主张通过国际外交解决中国的争端。§!"
 LEP_zhang_xinyi_advisor_desc: "§Y生于：§!§L1897年1月17日；大清、甘肃省皋兰县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L张心一自幼帮助家庭务农，在兰州当地学校就读，后来跟随老师学习英语。1914年，张心一凭着英语优势得以入选北京清华学堂，尽管最初在复试时遭拒，后经据理力争，最终成为正式学生。在清华学堂的八年，他主修社会科学，专攻中国诸子百家和佛教、基督教的理论，最终接受了王阳明的知行学说。\n\n十一月抗议爆发后，张心一投身于爱国运动之中，谴责旧皖系当局，因此惨遭拘留。出狱后不久，他再次回到清华学堂，专注于研究农业。1922年，他组建了“新农会”。从清华学堂毕业后，他前往艾奥瓦大学学习畜牧业，在威斯康星大学学习遗传学，在密歇根州实习森林材积测量，在怀俄明大学学习羊毛加工处理。\n\n留美期间，张心一积极宣传中国文化，后进入康奈尔大学攻读农业经济硕士学位。回国后，他被迫放弃了创办高效农场的梦想，转而在金陵大学农业经济系当了两年教授。为了给他的研究提供翔实数据，他在全国范围内进行农业调查，先后在23个省、600多个县雇佣了1900多人开展调查，建立了中国近代史上第一次有系统较科学的农业统计工作。\n\n1932年，张心一协助出版了《中国土地利用》一书，后在南京继续他的革命农业工作。§!"
 LEP_ding_wenjiang_advisor_desc: "§Y生于：§!§L1887年4月13日；大清、江苏省泰兴县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L丁文江出生于书香门第，后留学日本。留日期间，他积极参与当地蓬勃发展的革命运动。收到吴稚晖的来信后，信中讲到在苏格兰念书环境好，丁文江便动身前往苏格兰研究动物学和地质学，并在途中拜访了康有为。他在格拉斯哥半工半读，最终考入剑桥大学，后又转入格拉斯哥大学学习。\n\n1911年毕业回国后，丁文江在上海南洋公学任教，后赴北京出任工商部地质科科长，任职期间前往山西、云南等地进行地质矿藏调查，重新唤起了国内对地质科学的兴趣。他曾与章鸿钊、蔡元培和翁文灏等人共事，最终于1919年偕梁启超去欧洲考察。\n\n1921年，丁文江辞去北京大学的工作并由翁文灏接任，后前往热河担任北票煤矿公司总经理。1922年，他参与发起了中国地质学会，同时担任《中国古生物志》主编，1923年甚至与张君劢开展了科学与玄学的论战。1925年，他辞去了经理之职，投奔孙传芳幕下，出任淞沪商埠督办公署总办，甚至曾帮助孙传芳镇压叛乱。\n\n1926年隐退后，丁文江移居北京，并于1931年再次成为北京大学地质系教授。1934年，他应孙传芳之邀再次南下，出任金陵学院总干事。§!\n\n§Y备注：丁文江与孙传芳的合作导致许多知识分子朋友疏远了他。§!"
 LEP_wei_daofeng_advisor_desc: "§Y生于：§!§L1884年；大清、湖南省黔阳县§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L危道丰少年时参加府试落第，随即去广州，就读于时务学堂，后于1902年留学日本，在弘文学院学习，后转入东京振武学校就读，短暂回国后，又考入日本陆军士官学校第五期学习工兵。1910年回国后，进京经考试得工兵科举人，后于湖南任巡防营管带。\n\n危道丰后应黎元洪电召任黎元洪府参议官，后又出任袁世凯总统府咨议、北京陆军讲武学堂战术教官、参战军工兵集团教官等职，1919年返回湖南，在督军傅良佐手下任督军署副官长。同年，傅良佐离湘，危道丰亦离开家乡，后于1922年奉命秘密南下，以缓解南北军阀的紧张局势。\n\n危道丰1923年获少将军衔，1924年前往日占台湾考察，1925年担任孙传芳治下多个县的知事，后卷入刘海粟和孙传芳之间关于裸体模特的争论。此后他继续担任上海知事，直到北伐战争爆发。孙传芳保住了五省联合的地盘后，危道丰在之后的多次直奉战争中，利用他和张学良的私交，设法缓和了南直系和奉系之间的紧张关系。作为一位能言善辩、魅力十足的谈判家，在过去的几年里，孙传芳曾多次派遣危道丰前去安抚那些时常挑事的同僚。§!"
 LEP_tang_erhe_advisor_desc: "§Y生于：§!§L1878年；大清、浙江省杭州§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L著名知识分子、“六松老人”汤尔和是孙传芳核心圈子中一名十分特殊的官员。他自幼学习经典，接受私塾教育，是一名颇有天赋的学生。1903年，汤尔和赴日本成城学校学习军事，留日期间积极参加抗清反帝活动，并加入同盟会。1904年，他在浙江高等学堂做音乐教员，三年后再度前往日本学医，就读于金泽医学专门学校，而后转赴德国柏林大学留学，获得医学博士学位。\n\n回国后，汤尔和先后在多所机构担任内科医生和医学总监，期间创办了浙江病院，参加了辛亥革命，后又创办了国立北京医学专门学校并担任校长，1915年发起成立中华民国医药学会，1920年奉派赴欧洲考察医学，1922年回国后任教育部次长。\n\n1923年，日本关东大地震后，汤尔和出任中国红十字会慰问使者赴日，此后在吴佩孚支持下成立的王宠惠“好人政府”中担任教育总长。1925年，汤尔和与汪精卫就孙中山病情是用中医还是西医治疗发生了短暂的辩论，他站在西医一边。1926年，汤尔和任内务部总长，1927年改任财政部总长。\n\n1929年，汤尔和获日本东京帝国大学医学博士学位，回国后在南直系政府中担任各种职务。汤尔和近期在金陵学院任教授。§!"
 LEP_li_erkang: "厉尔康"
 LEP_li_erkang_advisor_desc: "§Y生于：§!§L1888年；大清、浙江省杭州§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L厉尔康生于书香世家，祖上均为饱学之士。他两岁时就开始识字，自幼饱读典故文学。他的军人生涯始于1903年，当时他从一所私立中学转入浙江武备学堂。作为一名杰出的学生，他入读日本陆军士官学校第六期步兵科，与阎锡山、唐继尧、赵恒惕以及孙传芳等名人是同学。1909年回国后，这位杰出的军官进入禁卫军任职，他的才华得到了载涛的赏识，得以成为清廷禁卫军中为数不多的汉族高级军官之一。\n\n辛亥革命爆发时，厉尔康给载涛留了一封信以表歉意，随后作为一名教官参加了革命军，后辞职回到家乡，出任浙江省府的军事作家、参谋官和教官。孙传芳进军浙江后，厉尔康再次出山，于1923-1924年间前往日本考察。回国后，他将主要精力放在总结和发表他对中国最危险敌人的观察结果，并帮助孙传芳培训新军官。尽管对八省联合的亲租界立场不敢苟同，但考虑到浙江有着充裕的出版资源，以及能与列强（尤其是与厉氏眼中最先进的军事大国德国）接触的理想军事学术讨论环境，他最终还是留了下来。§!\n\n§Y备注：厉尔康是一位高产的军事理论家，曾担任浙江多家军事杂志的主编，出版和翻译了无数军事著作，其中一些最引人注目的有《吾人于欧战所得之用兵新法》(1916)、《毒瓦斯及毒烟》(1928)、《国防与物资》(1929)、《欧战后日本之军事观》(1929)和《青年军事训练教程》(1931)。有人认为，蒋百里的部分军事思想受到了厉尔康的启发。蒋百里在厉尔康的《国防与物资》一书的序言中高度赞扬了厉尔康的观点，厉尔康在书中呼吁进行全面的全民、经济和社会动员，以抵御不可避免的日本侵略。厉尔康是陈诚的恩师、陈立夫的结拜兄弟，在国民党右派中有着广阔的人脉，他曾劝说孙传芳在北伐战争中与国民党合作。§!"
 LEP_yang_wenkai: "杨文恺"
 LEP_yang_wenkai_advisor_desc: "§Y生于：§!§L1883年；大清、直隶省永清县§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L1902年，杨文恺考入北洋速成武备学堂学习步兵，并获官方奖学金赴日本留学。杨文恺先是在东京振武学校学习，之后又就读于日本陆军士官学校第六期步兵科，与孙传芳成为了亲密的同学和朋友。1909年回到中国后，杨文恺先后担任了禁卫军一等参谋、直隶都督府军务课课长、湖北督军公署军务课课长。\n\n在短暂地担任汉阳兵工厂总办之后，杨文恺成为了南直系军阀王占元的幕僚。1921年，杨文恺转投孙传芳手下，并随孙传芳赴福建省，任福建省督军署参议。1925年，杨文恺任东南五省联军总司令部总参议，次年，他先后在颜惠庆内阁、杜锡珪内阁、顾维钧内阁中担任农商总长。\n\n潘馥内阁成立后，杨文恺辞职并寓居天津。但在接下来的几次直奉战争爆发后，他重返八省联合，再度向孙传芳提供自己的军事经验。杨文恺是孙传芳的亲密同学，孙传芳总是会满怀敬意地听取他的建议。§!"
 LEP_ouyang_wu: "欧阳武"
 LEP_ouyang_wu_advisor_desc: "§Y生于：§!§L1881年；大清、江西省吉水县§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L欧阳武自幼练习南拳、兵器以及其他武术，练就了一身好武艺。他被江西武备学堂录取，在该校刻苦学习，以优异成绩毕业。1905年他考取日本陆军士官学校第六期学习步兵科，并与1909年返回中国，于1911年在清军中出任炮兵营管带。辛亥革命之后，欧阳武在李烈钧麾下的江西护卫军担任司令官，之后在1913年任江西都督。\n\n之后，欧阳武因其没有正式卸任军职就不问政事、出家为僧而遭到逮捕，1916年，恢复了军职的欧阳武请求成为南北联合谈判特使，而吴佩孚却识破了他的想法，使其被召回。1925年，曹锟拒绝聘请欧阳武为顾问，但江西督军蔡承勋却听闻了这位臭名昭著的佛教徒军人的名声，并聘其为顾问，而后邓如琢也聘请了他。\n\n作为江西省政府的一名顾问，欧阳武于1933年成为江西省经济审核委员会委员长，在此之外，他还尽心尽责地为本省服务。§!"
 LEP_li_chenggan: "李承干"
 LEP_li_chenggan_advisor_desc: "§Y生于：§!§L1888年8月；大清、湖南省长沙县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L李承干最初就读私塾，受传统科举教育，后来入读长沙省立实业学堂，接触新兴科技知识，眼界为之大开。通过他的老师，李承干接触到了黄兴等人的革命思想，这对他产生了巨大的影响，从而确立了发展实业以御外辱的志向。\n\n受张之洞选派，李承干远赴日本留学，先后就读于日本大阪预备学校、关西中学，之后就读于东京第一高等学校、冈山第六高等学校，并在此期间加入了同盟会。辛亥革命期间，他毅然放弃学业，投效黄兴所率革命军，在汉阳前线作战。\n\n李承干此后返回日本继续完成学业，考入东京帝国大学电气工学科，并以优异的成绩毕业，后历任湖南省长公署实业科长、汉阳兵工厂电机课长、汉阳兵工学校教官等职。\n\n北伐战争爆发后，李承干任金陵制造局工务科长，潜心研究枪械、弹药制造。1929年升任金陵兵工厂厂长后，李承干致力于将他的员工培养成新一代的兵工业专家。§!"
 LEP_chen_qixia: "陈栖霞"
 LEP_wang_tianxiang: "王天祥"
 LEP_assorted_leaders: "各色领袖"
 LEP_chu_fucheng: "褚辅成"
 LEP_rong_zongjing: "荣宗敬"
 LEP_rong_zongjing_advisor_desc: "§Y生于：§!§L1873年9月23日；大清、江苏省无锡§!\n§Y派系：§!§c江南商帮§!\n§Y背景：§!§L荣宗敬是上海赫赫有名的“面粉大王”。他幼入私垫，稍长后开始在钱庄当学徒。1890年其父荣熙泰与友人合开广生钱庄，由荣宗敬担任经理。1900年八国联军入侵，华北混乱，荣宗敬与其弟将大量面粉北运，获利颇丰。\n\n利用这笔利润，荣宗敬与荣德生合办茂新面粉厂，又于1907年集资创办无锡新纱厂。1912年，他在上海创办福新面粉厂。世界大战期间，洋粉暂停进口，福新厂产量猛增，获大利。1916年他又创办上海申新纱厂。到1922年荣氏兄弟的帝国拥有12家面粉厂，占全国民族资本面粉企业生产能力的1/3。\n\n此时，荣氏企业出现亏损，兄弟二人开始改革企业管理，提高生产效能，加重工人劳动强度。随着全国兴起了抵制外货运动，荣氏企业又扭亏为盈。但在1926年，荣氏帝国受到了北伐的威胁。不过兄弟二人还是挺过了这一风波，荣宗敬甚至短暂担任了南京银行的董事。如今的荣氏兄弟是江南商帮的非正式领导人，致力于从东亚监事会手中捍卫中国民族商业、商人和士绅的利益。§!"
 LEP_deng_ruzhuo: "邓如琢"
 LEP_deng_ruzhuo_commander_desc: "§Y生于：§!§L1888年；大清、安徽省县§!\n§Y派系：§!§M南直系§!\n§Y背景：§!§L邓如琢虽然出身书香门第，但家中人口众多。当安徽遭遇旱灾时，邓如琢决定外出当兵，以减轻家庭负担。邓如琢的军旅生涯始于当地军营伙房的伙夫。后来在一场恶战中，连队几天没吃上饭，邓如琢自愿冒着巨大风险亲自送饭到前线，这让他赢得了连长方本仁的尊重。邓如琢所在的连队此后又坚持了很长时间，直到孙传芳突袭敌军后方，大获全胜为止。\n\n方本仁提拔邓如琢为排长，两人结拜为兄弟。方邓二人在孙传芳麾下青云直上，最终方本仁成为师长，邓如琢成为营长。然而，为了取方本仁而代之，野心勃勃的邓如琢诬告方氏与国民党勾结。后来孙传芳任命邓如琢为江西督军。\n\n北伐战争期间，蒋介石曾多次试图说服邓如琢投靠国民党，但遭邓氏一再拒绝。邓如琢后曾试图在五省联合内部发动一场拙劣的政变，以夺取孙传芳的地盘，但孙氏早已预料到他会背叛，并与他保持着距离，但也从未试图将他赶出江西。\n\n邓如琢和蒋介石在江西反复拉锯，最后邓氏夺回了南昌。上海起义后，为了平息农村动乱，邓如琢继续与国民党作战。§!\n\n§Y备注：许多军人都对没怎么受过军事教育就奋斗到如此高位的邓如琢表示敬佩。但邓如琢野心过大，笑面虎不得不把他放到眼皮子底下的江西。§!"
 LEP_zhou_yan: "周碞"
 LEP_fang_benren: "方本仁"
 LEP_fang_benren_commander_desc: "§Y生于：§!§L1880年；大清、湖北省黄冈县§!\n§Y派系：§!§L无派系§!\n§Y背景：§!§L方本仁20岁作塾师，后投武昌右旗马队营，开启了军事生涯。后获选入湖北陆军特别小学堂，不久便回到骑兵部队继续服役。1907年，他进入陆军行营军官学堂（后为陆军大学）学习。他曾任禁卫军骑兵排长，后来成为吴禄贞部参谋。\n\n辛亥革命后，方本仁留任原职，后于1913年调任江西都督府，1914年任江西陆军将校讲习所所长，后任督军署参谋长，1916年调任赣西镇守使，1922年调任赣南镇守使。\n\n1923年方本仁获授“粹威将军”称号，最终任粤赣边防军务督办。在江西督办蔡成勋的指挥下，方本仁奉命进攻广州革命者，但他却反戈一击驱逐了蔡成勋，夺得督办一职。\n\n在孙传芳麾下，方本仁成为五省联军江西军总司令，并正式成为江西督办，后于1926年遭吴佩孚逼迫辞职，由邓如琢接任。方本仁出走上海后，在广州革命者的劝说下，曾出山担任国民革命军第十一军军长，北伐形势不利后再度出走。\n\n靠着翩翩风度和人脉关系，方本仁如今再次回到了聚光灯下。不过，他也有两条底线：其一，不得与吴佩孚合作；其二，他必须统治江西。§!\n\n§Y备注：他曾先后捐资创办萍乡平民工厂、黄州平民织布厂、百福寺楚黄高等小学。§!"
 LEP_li_baozhang: "李宝章"
 LEP_li_baozhang_advisor_desc: "§Y生于：§!§L1890年；大清、直隶省清苑县§!\n§Y派系：§!§n青年党§!\n§Y背景：§!§L李宝章毕业于保定陆军军官学校第一期步兵科，他的早年生活扑朔迷离。完成直隶清河陆军中学堂和保定军校的学业后，李宝章分配到北洋军第二师服役，先后在孙传芳、卢香亭、颜景崇手下任连长、参谋、营长等职，在浙军援闽战役中表现活跃。\n\n李宝章于1923年担任孙传芳的卫队团团长，次年参加江浙战争，任江浙联军军官教育团总队长。1926年，李宝章升任孙传芳五省联军的旅长，并同时兼任军官教育团总队长和卫队旅旅长。\n\n李宝章率部参与了众多镇压行动，北伐战争爆发后升任师长，北伐期间在闽赣两省作战。1929年，李宝章率两万部下加入了中国青年党。他允许青年党动员他的部队并将其政治化，和北京的曾琦也建立了不错的关系，这使李宝章部事实上成了青年党的武装。他在联合内部有着可观的影响力，对联帅忠心耿耿，也是联合治下青年党的领袖。§!\n\n§Y备注：即使以军阀的标准来看，他也堪称异常残暴。由于经常实行斩首和其他形式的处决，这让他获得了“断头台将军”和“砍头机器”的绰号。§!"
 LEP_german_trained_officers_theorist: "德式训练军官"
 LEP_german_trained_officers_theorist_desc: "§Y背景：§!§L我们这批经受过德式操练的军官起源于中国与德意志帝国的“特殊关系”，他们已经成为了我们合作所取得的最有利的成果之一。在世界大战的战胜国的教导下，他们接受了现代化机动作战战术的训练，从而成为了中国军事理论家中的佼佼者。然而，他们也在柏林学到了德国军队中拉帮结派的作风，并将其带回了国内。\n\n他们又分成不同的派别，比如李忍涛，他崇尚化学武器；又比如被称为“东方毛奇”的徐培根，他坚持建立一支小而精的现代化军队；还有众多受到马克斯·鲍尔启发的军事工业家，他们与他们的导师几乎一模一样。虽然他们的理论和勇气是值得赞许的，但对联合来说，有些方面是难以令人接受的。最关键的一点就是他们支持军官团的完全自主，而许多初级军官都很……激进，而且还和联帅对着干。§!"
 LEP_zhejun_officers_theorist: "浙军军官"
 LEP_zhejun_officers_theorist_desc: "§Y背景：§!§L对于蒋百里的保定系来说，也许堪称头号敌手的军事理论家就是“浙军军官”们了，他们推崇《国防与物资》中的军事理论，这本书的作者是大名鼎鼎的军事教育家厉尔康。厉尔康是浙江本地人，他的著作受到浙军中那些年轻、同情革命而激进的下级军官的推崇。从他的众多著作中可以看出，厉尔康的军事理论与蒋百里的理论所去无几，许多人甚至指称蒋百里是受到了厉尔康的启发。\n\n厉尔康军事理论的核心要义是让中国动员起来，以应对全国被包围的状态。面对日本日益增长的军国主义情绪，厉尔康反对和平主义，他宣称现代战争需要国家和人民的全力支持，不仅要动员，更要为推进军事研究、实现物资自给以及建立诸如粮食和燃料配给制度等战时规章做好准备。同时，厉尔康还主张青年和社会的军事化，亦格外强调对化学武器的使用。厉尔康坚信，尽管化学武器已被国际禁止，但它仍将出现在中国所面临的下次大战中。浙军军官也推崇轻步兵战术和现代化武器装备，并将重点放在操练和协调而非精神上。他们认为，像日本人和黄埔军校那样推崇“武士道”只会导致对科学战争的忽视。§!"
 LEP_nanjing_clique_theorist: "宁系"
 LEP_nanjing_clique_theorist_desc: "§Y背景：§!§L在八省联合的军事体系中，没有哪个派系比“笑面虎的老巢”影响更广。八省联合本身就是靠着孙传芳的社交关系、私人友谊和军事才能建立的，八省联军也是如此。该派系充当着对抗支持厉尔康理论的激进分子和在德国受训的年轻军官的元老派大本营。“笑面虎的老巢”专注于宣扬孙传芳麾下得力干将们独特而杰出的品质。该派系成员包括谢鸿勋、马玉仁、周荫人和刘宗纪等人，他们提倡一种结合了保定军校教授内容与他们自身实战经验的混合理论。\n\n该派系非常坚韧固执，专注于推广经受过实战考验，让他们得以身居高位的军事战术。然而这也导致他们的下属经常激进地批评该派系为“老顽固”、“老古董”、“任人唯亲”。尽管如此，正是他们所拥有的丰富经验和技能，塑造了八省联军的一贯风格。§!"

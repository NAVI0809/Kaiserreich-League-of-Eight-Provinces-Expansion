 LEP_Tsingtau_Collaboration0_desc: "联合和德国之间签署的由东亚监事会牵线的非正式协议虽有好处，但我们要付出相应代价。德国企业已经在许多沿海城市获得了许多没有挂牌的法外特许经营权。"
 league_events.16.d_cao_kun: "“清晨6点23分，孙传芳大帅醒来，享用了早餐。清晨6点51分，他在梳洗完毕后换上制服，准备和几位部下军官开会。此时，刺客施剑翘已伪装为女仆，混入到仆人群中。孙传芳开完会，便来到院子里的训练场。他在检视部队操练、松懈之时，施剑翘从他身后靠近，拿出一把德制鲁格手枪，向他连开三枪。一枪正中背脊，一枪打中肩膀，最后一枪射向头部但射飞了。施剑翘很快便被孙传芳的保镖控制住，孙传芳则被立刻送去急救。不过，由于失血过多，孙传芳在昏迷数周后与世长辞。\n\n调查团队收集的证据显示，刺客施剑翘系曹锟总裁的特工，虽然他本人与这起刺杀没有明确的关联证据，但他一直在策划监视联帅的起居。刺客应为自作主张……”"

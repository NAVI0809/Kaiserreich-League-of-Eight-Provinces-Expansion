 focke_wulf_LEP: "福克-沃尔夫(东亚)"
 LEP_qi_rules_nanjing: "齐治江宁"
 LEP_qi_rules_nanjing_desc: "统领南京一带军队的江苏督理齐燮元名望颇丰，现在他已经控制了这座城市，这使他成为孙传芳名义上的继承者。现在，齐燮元统治着宁系军阀。然而，前八省联合仍是一片混乱，尚不清楚前八省的督理省长们是否会认可齐燮元的统治。"
 LEP_north_south_west: "三面环敌"
 LEP_north_south_west_desc: "宁系军阀在北、西、南三面都有敌人。我们的领土四散各处，新皖系随时都威胁着腹地的安全。我们必须优先针对一个方向的敌人，同时也需要接洽前八省联合各省的领导人，以此确保他们的忠诚。"
 LEP_jiangnan_loans: "江南系借贷"
 LEP_jiangnan_loans_desc: "黑色星期一对东亚监事会造成了沉重的打击，他们已经无力偿付租借地的租金了。尽管这令人无法接受，但现在我们拿他们没有任何办法，毕竟我们还需要依赖他们的援助。另一方面，在这次危机中几乎未受影响的江南商帮曾经也向我们借出过贷款，现在我们正可以此来为军队和政府提供资金。"
 LEP_aog_gun_shipments: "东亚监事会军火输送"
 LEP_aog_gun_shipments_desc: "虽然东亚监事会还没能成功让财政局面重回掌控，但局势总归是稳定了一些。他们的军火库里有大量枪支，考虑到我们现在正面临武器短缺，必须确保这些军火能够为我所用。此外，我们的产能也十分有限，因此他们的援助便显得尤为重要。"
 LEP_qis_central_command: "齐大帅的中央指挥部"
 LEP_qis_central_command_desc: "我们的地方军无组织无中心，无法应对目前的战事，建立统一的中央指挥部成为当务之急。各省督仍然保有各自的权力，但重大决策都应协调做出，避免各自为政。"
 LEP_enforce_officer_loyalty: "确保军官忠诚"
 LEP_enforce_officer_loyalty_desc: "我军军官人人心猿意马。虽然齐燮元有自己长年经营的嫡系部队，但现在他还控制了大多数孙传芳的旧部，以及各省临时长官的地方军，这样一来他们的忠诚就很值得怀疑了。国民党和一贯道都在暗中发展势力，因此我们必须保证军官们忠于宁系军阀，别无二心。"
 LEP_emergency_industry_reallocation: "紧急工业调配"
 LEP_emergency_industry_reallocation_desc: "就算是我们仅有的一点工业设施，大多也极为分散。现有的工业必须得到协调以进行军事生产。由于我们自己并没有资源实施这项计划，因此只能依靠江南商帮和东亚监事会的帮助。一部分资产将会转移到他们名下，这样才能保证我们自己的那些无能官员不会造成问题。"
 LEP_price_controls: "物价管制"
 LEP_price_controls_desc: "八省联合崩溃后，我们的银行券就成了废纸，通货膨胀率也在飞速升高。虽然控制物价可能不是最好的解决方法，但至少能够暂时控制货币贬值，让我们能够付得起士兵的工资。这样一来，至少在当下，农村地区也能得到安宁，让高涨的食品价格得到控制。"
 LEP_suppress_student_unions: "镇压学生社团"
 LEP_suppress_student_unions_desc: "一段时间以来，所谓的“爱国”学生社团一直是我们的眼中钉。他们是反租界运动背后的关键力量，并不断在城市制造麻烦。如果我们否定他们的组织方式，我们就有希望镇压整个运动。"
 LEP_enforce_media_controls: "加强媒体控制"
 LEP_enforce_media_controls_desc: "媒体在八省联合的崩溃中串通一气，不断发表关于我们管理的负面报道，总是诽谤齐燮元的名声。我们必须控制大部分媒体，以制止危险信息的传播。"
 LEP_government_by_coercion: "高压统治"
 LEP_government_by_coercion_desc: "我们现在是诸省联合的统治者，必须不惜一切代价防止其再次崩溃。我们不会重蹈孙传芳的覆辙。恰恰相反，我们将建立一个强大的政府，其基础不是建立在软弱上，而是建立在强权上。为了保证政府的生存，我们不会回避任何严厉的手段。"
 LEP_finish_sun_investigation: "完成孙传芳遇刺调查"
 LEP_finish_sun_investigation_desc: "经过长时间的等待，我们终于等到了对前八省联合领导人——孙传芳刺杀事件的调查结果。现在是完成工作并向公众公布结果的时候了。希望我们能以这种方式扭转局势，提高我们的地位。"
 LEP_undermine_sun_loyalists: "清除同谋"
 LEP_undermine_sun_loyalists_desc: "目前，我们政府中还有许多嫌疑人，我们不能肯定他们是否衷心支持我们。利用我们已公布的孙传芳刺杀事件的调查结果，把我们的敌人描绘成这场政变的同谋，我们应该能够以这种理由逮捕很多人，把他们清除。"
 LEP_university_oversight_board: "大学监督委员会"
 LEP_university_oversight_board_desc: "我们已经领会到学生如果组织起来将会变得多么危险可怕。他们是反租界运动的关键，所以我们要定时监督这些不安生的学生。因此，我们必须建立大学监督委员会，以清除大学里任何“危险”的学生。"
 LEP_governor_question: "督理问题"
 LEP_governor_question_desc: "[getlepgovernor]"
 LEP_track_down_kmt: "消灭国民党游击队"
 LEP_track_down_kmt_desc: "虽然我们可能已经把国民党军队赶出福建，但他们的游击队仍在活动。国民党渗透也是个棘手的问题。我们要追查国民党残余的根据地，消灭国民党的各种活动组织。"
 LEP_reconstitute_baojia_system: "恢复保甲制"
 LEP_reconstitute_baojia_system_desc: "保甲制的目的是让地方政府能控制民兵。用分担地方责任来增加稳定。虽然该制度在过去失败了，但它现在非常有用，因为它可以让我们在督理眼皮子底下巡逻农村。"
 LEP_xiangyong_inspections: "视察乡勇"
 LEP_xiangyong_inspections_desc: "要想确保保甲制顺利实施，我们必须确保当地的保甲单位——乡勇表现良好。视察乡勇使我们有另一种方法控制这些地方民兵，而不让督理起疑心。"
 LEP_water_infrastructure_commission: "水利基础设施委员会"
 LEP_water_infrastructure_commission_desc: "战争破坏了许多旨在保护我们城市不受洪灾肆虐的关键基础设施。大坝和堤防都遭到了不同程度的破坏。我们需要设立一个特别委员会，提供足够的资金立即修复这些设施。如果我们袖手旁观，洪水可能危及数百万中国人的性命。"
 LEP_peace_in_countryside: "乡村的宁静"
 LEP_peace_in_countryside_desc: "既然我们已经处理掉了最爱发动战争的鳖孙，我们就可以开始最后的工作：全面恢复农村的和平。这几个月来，人们竟不敢出门，因为路上到处都是强盗和叛乱分子。但通过我们的措施和改革，我们保障了安全，农村恢复和平。"
 LEP_selective_enforcement: "选择性执法"
 LEP_selective_enforcement_desc: "政府的合法地位不是通过法律保障的，我们只有通过建立一个民众无可质疑的稳定政府才能实现稳定。因此，我们可以有选择地执行我们认为合适的法律。通过允许某些公司和个人享有超出法律的权利，我们肯定会得到他们的支持，这样我们就可以严厉打击他们的敌人。"
 LEP_reform_public_security: "公共安全改革"
 LEP_reform_public_security_desc: "尽管孙传芳保持高度警惕，但这位笑面虎仍然免不了遭到暗杀。他无法让他的身边滴水不漏，很显然他防卫的缺陷之一就在于缺少可靠的特工网络来确保他的人身安全。而现在，齐燮元的南京卫队改变了这一境况。他的特工遍布各处，能让他第一时间做出反应来维护境内治安。"
 LEP_redoubts_for_revenue: "堡垒换税款"
 LEP_redoubts_for_revenue_desc: "由于我们的督理对最近的战争仍记忆犹新，再加上边境线的普遍不稳，所以我们将专注于安全问题。我们将帮助各督理修造防御工事，作为交换，他们允许南京从他们的领土上收取更多税款。"
 LEP_tackle_local_corruption: "打击地方腐败"
 LEP_tackle_local_corruption_desc: "地方腐败是一个严重问题。它损害了我们从地方政府收税的能力，给当地农民带来不必要的损失，让那些贪得无厌的苍蝇口袋充盈。因此，我们应该开始处理这个问题。我们派来的督察也能加强我们对地方政府的控制。"
 LEP_green_gang_dealings: "青帮交易"
 LEP_green_gang_dealings_desc: "我们必须寻求上海青帮的帮助。这些犯罪黑帮是毒品贸易的主要参与者，能扩大我们对使馆城市潜在投资者的影响。利用青帮，我们一定能够扩大对使馆城市的影响力。"
 LEP_public_media_campaigns: "公共媒体宣传"
 LEP_public_media_campaigns_desc: "许多人对我们的政府持负面看法，把我们视为汉奸，说我们总是镇压那些想把德国人赶出去的爱国者。我们必须通过控制媒体来传播对政府的正面信息，同时批判那些反对我们的人，抹除我们是汉奸的坏形象。"
 LEP_appoint_civilian_magistrates: "任命文职县长"
 LEP_appoint_civilian_magistrates_desc: "许多省和地方政府由军人领导，他们依靠军队垄断政治权力。要让他们做事而不用强迫手段是很困难的。因此，我们应该开始在地方政府中任命文职县长，慢慢地给他们更大的权力，因为相比于军人，他们更好控制。"
 LEP_public_repression: "公众镇压"
 LEP_public_repression_desc: "我们并没有自称是一个友好自由的政府来自我欺骗。恰恰相反，我们认为只有一种方法可以为人民带来法律和秩序，那就是严厉镇压那些靠说话或行动来反对我们的家伙。只有消灭了这些煽动分子，人民才敢相信他们是安全的。"
 LEP_shut_down_intellectual_circles: "封杀知识界"
 LEP_shut_down_intellectual_circles_desc: "许多德高望重的知识分子团体曾经支持过反租界运动，导致孙传芳下台，现在还在跟我们唱反调。我们不能再容忍这种叛逆行为，必须立即禁止这些知识分子开会，把他们孤立起来。"
 LEP_crush_urban_unions: "摧毁城市工会"
 LEP_crush_urban_unions_desc: "就像学生社团一样，城市工会也一直在制造麻烦。他们的罢工破坏了我们的工业，我们也不清楚他们是否会与国民党左派合作。我们必须用我们的威权来镇压这些工会，确保工人们不会聚众造反。"
 LEP_pacification_commissioner_qi: "齐巡阅使"
 LEP_pacification_commissioner_qi_desc: "齐燮元习惯上给自己许多不同的职位和头衔，以在新领域建立权威。因此，他不仅是联帅，而且还是巡阅使。新职位给了他更多权力，他可以用私人部队阻止联合任何地区的任何煽动行为，这将使我们在紧急情况下做出更快反应。"
 LEP_pressure_jiangzhe_caifa: "施压江浙财阀"
 LEP_pressure_jiangzhe_caifa_desc: "江浙财阀是一群控制着各大银行的有权势资本家。我们应该利用我们新获得的人脉，向江浙财阀施压，让他们向我们提供贷款和资源，就像他们过去对别人所做的那样。"
 LEP_solicit_legations_investments: "寻求使馆投资"
 LEP_solicit_legations_investments_desc: "使馆城市是一个巨大的财富宝库。现在的外国投资者通常会选择在这些城市投资，许多中国富商也喜欢在那里做生意。我们必须成为一个有吸引力的投资目标，考虑到我们在使馆城市中的新影响和我们的开放式经济，这应该不难做到。"
 LEP_expand_jiangnan_arsenal: "扩建江南制造局"
 LEP_expand_jiangnan_arsenal_desc: "江南制造局是我们军事工业的核心。在我们进一步发展我们的民用工业前，每一次集中生产力扩大军火库需要慎之又慎，因为这关系到我们军备的生产。"
 LEP_lower_yangtze_development: "长江下游发展"
 LEP_lower_yangtze_development_desc: "长江下游是华东五省的核心，也是齐燮元的基本盘。发展这一直接控制并收税的区域将会给齐大帅带来最大化的收益，而且其绝佳的地理位置也无疑会吸引大量的投资。"
 LEP_eastern_railway_construction: "东部铁路建设"
 LEP_eastern_railway_construction_desc: "铁路是中国的生命线，若是没了他们，工业运输都将陷入停滞。我们必须大量投资于新铁路线的建设以及现有铁路线的翻新。德国人无疑也想要参与其中，因此我们必须决定这些计划到底该如何执行。"
 LEP_heavy_industrial_investments: "投资重工业"
 LEP_heavy_industrial_investments_desc: "目前，中国的大多数工业为满足国内消费市场服务。由于缺乏重工业设备生产的能力与技术，国内的工业几乎都是轻工业。为了提升我们的经济，这一现状必须被改变。有了德国的技术和新的政府投资，重工业也必将在中国被发展起来。"
 LEP_new_economic_development: "新经济发展"
 LEP_new_economic_development_desc: "随着联合的稳定，工业发展达到了前所未有的高度，我们必须充分利用这一时机。随着对外开放，我们独特的地理位置使联合得以比中国其他地区发展得更快。我们必须为投资工业发展与新经济建设竭尽所能。"
 LEP_subsidize_local_communities: "补贴当地村社"
 LEP_subsidize_local_communities_desc: "我们已经失去了很多城镇人口的支持，但只要我们的经济形势好转，他们最终还是会站到我们一边。但在那之前，我们急需另一部分人口——农民的支持。因此，我们必须为当地村社拨出专供农村地区发展的新补贴款项，以助于巩固他们对我们的支持。"
 LEP_revitalize_the_tea_trade: "重振茶叶贸易"
 LEP_revitalize_the_tea_trade_desc: "中国东部和南部广泛存在茶叶贸易的传统，而如今大量农民没有任何金钱收入。如果我们重振茶叶种植和销售产业，则将为他们带来一项新的收入来源，并将他们整合进全新的、现代化的经济模式，刺激经济的进一步增长和发展。"
 LEP_patronize_xiangshen: "优待乡绅"
 LEP_patronize_xiangshen_desc: "乡绅，即当地地主，是我们极其宝贵的盟友。如果我们能争取他们的支持，也就能确保农民的支持。我们应当利用我们新获得的地方掌控力对他们施以恩惠，让他们明白我们才是他们最坚实的后台，而不是当地省政府，这将为我们在对抗地方督理时提供额外筹码。"
 LEP_modern_agriculture: "现代化农业"
 LEP_modern_agriculture_desc: "中国过去曾因其高效的农业技术而著称，也因此供养巨大的人口，但这一技术优势也早已不复存在了。如果我们想摆脱过去一个世纪的悲惨命运，我们就必须要从西方引进现代化的农业手段，不能再落后下去了。"
 LEP_cult_of_personality: "个人崇拜"
 LEP_cult_of_personality_desc: "如果我们的齐联帅想要巩固他的权力和影响力，则必须要塑造一个略带神话色彩的领袖形象。当联帅有了一帮狂热的追随者群体，则将没有人胆敢反对他的权威。因此，我们应当出版与联帅生平相关的各类故事，包括他出生时天有异象，以及他战争中的丰功伟业，比如用步枪击落一架敌机。"
 LEP_network_of_allegiances: "人事网络"
 LEP_network_of_allegiances_desc: "没人能仅靠一人实现统治，因此齐燮元必须在联合内各处维持一个忠于他的人事网络。他必须妥善维持这个关系网，一旦分崩离析，对齐燮元和联合来说都将是灾难性的。"
 LEP_dubious_practices: "暗中操作"
 LEP_dubious_practices_desc: "如果齐燮元想要稳坐高位，则必须无所不为。孙传芳过去常以正人君子自居，但他的所作所为大多不过是为了稳固其领导地位，而齐燮元也应如此。事实上，鉴于他对联合，尤其是南京城的控制力更强，以及来自德国的支持，齐燮元或许能做得更好。"
 LEP_tsingtau_collaboration: "与青岛方面合作"
 LEP_tsingtau_collaboration_desc: "与其他军阀相比，我们最大的优势就是德国的全力支持。与德国的合作能赢得更快的工业化，更先进的科技和更有效的军队，我们必须不遗余力维护双边关系。"
 LEP_german_reconstruction_crews: "德国重建团队"
 LEP_german_reconstruction_crews_desc: "联合境内一片狼藉，战争带来的破坏史无前例，成千上万的人死于非命。铁路被破坏，城市沦为废墟，工厂被烧毁。虽然我们不缺乏开始重建所需的人力，但我们缺少相应的技术和资金。因此，我们应该邀请德国团队来监督各地的重建工作。"
 LEP_krupp_industrial_methods: "克虏伯模式"
 LEP_krupp_industrial_methods_desc: "中国想要实现现代化，则必须要借鉴成功的范例。克虏伯是德国最强大的大企业之一，在使馆城市和东亚监事会都有其产业。我们应当邀请他们来指导我们的工程师和企业家，教会他们如何发展新型工业。若要让中国得以立足于世界，我们必须接纳德国的工业模式。"
 LEP_german_research_aid: "德国科技援助"
 LEP_german_research_aid_desc: "德国的科技水平远超我国，如果我们能拿到德国的前沿技术，则必能迅速提高我们的科研能力。我们必须建立中德双方院校与研究团队的合作关系。"
 LEP_nanjing_university_expansion: "扩建南京大学"
 LEP_nanjing_university_expansion_desc: "南京大学规模甚小且缺乏经费，教育模式亦是陈旧腐朽。要想提高科研创新能力，就必须改变现状，扩建南京大学并确保新一届的学生能接受到现代化的教育。"
 LEP_westernized_school_curriculum: "西式课程"
 LEP_westernized_school_curriculum_desc: "中国目前的教育体制落后过时，无论是大学还是县城乡镇里的学校系统都显得腐朽陈旧。孩童们接受着无用的知识，学无以致用。我们必须以西方经验为基础发展一套标准化的教育课程，这有望促进我们对现代科学技术的学习。"
 LEP_deutsch_asiatische_loans: "从德华银行贷款"
 LEP_deutsch_asiatische_loans_desc: "德华银行在过去几年中极速扩张，现已是东亚监事会和德国在华投资的重要载体，而我们还没有完全利用好它的存在价值。鉴于该行的跨国资产与国际信誉，它能给我们提供对扩张工业和修建铁路至关重要的贷款。"
 LEP_opening_the_interior: "开放内地"
 LEP_opening_the_interior_desc: "内地一直以来相对排斥外国势力的影响，而这也意味着其大量的资源未得以利用。我们相信德国会很乐意开发这些潜在的资源，因此我们应当致力于开放德国对内地的投资。"
 LEP_improved_tungsten_extraction: "改良钨矿采掘"
 LEP_improved_tungsten_extraction_desc: "目前我们有若干钨矿和其他金属的采矿点，应与德国合作来改善采矿手段，以此我们得以极大地扩张采矿作业，提高矿产产量。"
 LEP_schantung_eisenbahn_expansion: "扩建山东铁路"
 LEP_schantung_eisenbahn_expansion_desc: "山东铁路公司制定了若干计划以在我们统治地区的腹地翻新并扩建铁路，而我们应当允许他们实现这一计划。他们将是北方铁路发展的有效推动者，因为若是让东亚监事会直接资助并控制这些铁路则必然会招致非议。"
 LEP_eastern_resources_commission: "东方资源委员会"
 LEP_eastern_resources_commission_desc: "中国资源丰富，我们不应无计划地进行开发。应建立一个中德联合的东方资源委员会来监督资源的勘探与采集，委以权威，加快我们目前进展缓慢的钢铁和煤炭产业的发展。"
 LEP_tolerate_vice: "容忍恶习"
 LEP_tolerate_vice_desc: "黄赌毒有悖人伦，但却是极度宝贵的收入来源。尽管我们不想让自己沉沦其中，却也不舍得将其完全禁止。我们当然不会公开容许这些行业的存在，但我们可以让这些经营堕落营生的商人以上缴特别“税款”的方式换取我们的默许。"
 LEP_facilitate_german_prospecting: "促进德方资源勘探"
 LEP_facilitate_german_prospecting_desc: "随着内地地区对德国投资开放程度的加深，我们应进一步促进德国的资源勘探工作以支援当地政府，尤其是贫穷的内部省份，他们将从额外的资源开发中收益颇丰。"
 LEP_inland_development_zones: "内陆发展特区"
 LEP_inland_development_zones_desc: "如果我们想在促进中国内地发展的同时不至于产生过多的负面影响，就应采用“内陆发展特区”这一概念，让这些地区摆脱地方管理的掣肘和阻挠，以此集中境外资本，也方便我们加以保护。"
 LEP_friendly_monopolies: "友好垄断"
 LEP_friendly_monopolies_desc: "为了巩固政权，我们必须要奖励我们忠诚的朋友们。通过给予那些支持我们的公司和财团一些垄断特许，我们可以确保他们的效忠，并鼓励他们进行国内投资。"
 LEP_five_provinces_one_marshal: "五省一帅"
 LEP_five_provinces_one_marshal_desc: "在五省的天空上现在只有一个太阳——我们的齐燮元大帅。孙传芳死后，齐大帅领导宁系抵御住了逆贼们的进攻，重新统一五省，恢复了诸省联合。"
 LEP_KR_gathering_storm_desc: "孙传芳的八省联合是近十年来统治中国半壁的南天之柱，而多年的和平正是野心与妒火的沃壤。虽说南京仍与北京携手共抗外敌，但他们不仅是盟友也是对手。一些人甚至声称，双方的这场竞斗已经造成了内耗。\n\n和中国大部分地区一样，八省联合是谨慎平衡的产物，而孙传芳庞大的官僚金字塔或许早已开始破裂崩坏……"
 LEP_country_intro_header: "帝国的基石"
 LEP_country_intro_content: "§P孙传芳的八省联合§!是一个以其大本营§a南京§!为中心，由§P各省政府§!组成的松散联盟。它在过去十年的战火中崛起，随着北伐的失败而扩张至今日的版图。虽然联合的成员多因对中央政府的恐惧而团结在一起，但因同起于北洋，§P八省联合§!仍是§c帝国的§!基石，支撑着§a北京政府§!对抗来自国内外的威胁。\n\n这一脆弱的布置关系带来了数年的和平与相对的繁荣，外国的工业技术带来了革命性的变化，而§P孙传芳§!也获得了几个以§m德式训练§!为准的德械师，并以此为军队骨干。§P联帅§!坐到了这一巨大的官僚金字塔体系之巅，尽管其基石已呈现裂痕，他仍然沉溺其中。来自§m德国的物质援助§!助长了孙传芳的实力，这对他抵抗来自§c北京§!和§P联合§!南部各省的压力至关重要，但其影响却不止于此，§m德国§!资本也随之渗透到了§P联合§!的各级统治体系之中，滋养了本就已根深蒂固的腐败之风。各级官员沆瀣一气，从贪污公款到盗卖文物，可谓无所不为。\n\n这逐渐激起了§Y民众的不满情绪§!，§n民族主义者§!和§R国民党§!残余势力更是在此基础上煽风点火。尽管§P孙传芳§!努力维持§P联合§!的团结，它仍可能会分崩离析。更何况，这些内部问题正逐渐被东方若隐若现的§n旭日§!威胁所掩盖。深陷内部冲突的§P八省联合§!必须起身应对挑战，否则必将走向灭亡。\n\n以下可查看§P联合§!的§Y特殊机制§!、与§m德国§!的关系和§a内政§!的简介。"
 LEP_country_intro_header_1: "§c中央政府§!"
 LEP_country_intro_content_1: "§P孙传芳§!和他的旧日恩师§c吴佩孚§!一起阻止了§R国民党§!的北伐，并击退了§a奉天§!对华北的进攻。二人现在共同控制了§l关内§!，但和平的局面也带来了新的矛盾，§P孙传芳§!是否会一直对他的北方§c旧主§!效忠？而§c吴佩孚§!又会允许他§P昔日的学生§!挑战他的权威吗？\n\n双方达成协议后，1929年，§a曹锟§!宣布举行选举，§P孙传芳§!则开始扩张自己的五省联合。次年，§z直系§!与§e奉系§!的统一谈判失败，野心勃勃的§P孙传芳§!并未对退出谈判的§P张作霖§!加以抨击。这使得§c北京§!方面陷入恐慌。并导致了§Y1930年八省联合危机§!的爆发：人们担心§P张作霖§!和§P孙传芳§!会携起手来重燃内战战火。\n\n§P孙传芳§!拒绝解散他那支规模庞大的部队，使得§P笑面虎§!、§a保定王§!和§c玉帅§!三人之间掀起了一轮激烈的权力之争。他不愿向农民加税，而是选择进一步向§m德国人§!和§l使馆城市§!借贷，并同意§P齐燮元§!利用§l中§!§P德§!经济往来推动§Y江苏§!的现代化，此举引发了§Y上海§!工人的强烈不满。同时他还开始宣扬§f联省主义§!论调以维持自身自治，并抨击§a曹锟§!与§c吴佩孚§!处理§e东北§!局势不力，甚至尝试与§z北直系§!争夺西南各势力的忠诚。\n\n这一切最终导致了§Y1932年上海起义§!的爆发，各路§R社会主义者§!纷纷起事反抗§P孙传芳§!在§Y八省联合§!的统治。由于§P齐燮元§!不遗余力地残忍镇压各路§R社会主义者§!，起义最终以失败告终。但大量§l知识分子§!因此涌入内陆省份，§M南直系§!部队也被迫从§Y两广§!和§Y湖南§!撤军。\n\n§Y两广§!和§Y湖南§!达成了默契，一旦§P孙传芳§!再度进军，两家就将结盟反抗，§P孙传芳§!只好搁置了自己进军§c北京§!的野心。而为了应对§Y上海起义§!，§z直系§!方面叫停了§l自由化§!进程，查禁了新成立的§l统一建国同志会§!，并暂停了人们期待已久的§Y1932年议会选举§!——这导致全国各§f联省派§!政党纷纷对立法机构表示抵制。"
 LEP_country_intro_header_2: "与§m德国§!的关系"
 LEP_country_intro_content_2: "§m德国§!在1927年粉碎北伐时扮演了至关重要的角色，§m柏林§!因此在§l中国§!获得了巨大的影响力。尽管§m1928年众国的《上海协议》§!确定了对§l中国§!市场机会均等的政策，§m德国§!的影响力也只是受到了轻微的削弱。为了在这一系列条约限制下维持有利地位，德国官员对§P八省联帅孙传芳§!和§P各省督理§!提出了一系列协议，通过规避§P国际条约§!和§c北京当局§!的限制，来自§m德国§!的力量帮助§P八省联合§!团结在一起，并维持其在§c吴佩孚§!与§a曹锟§!的§z北直系政府§!统治下的自治。作为回报，§m德国得以进一步扩大其影响力§!。\n\n这一措施逐渐显露弊端，§m德国§!的影响力与日俱增，而人民的劳动果实则落入了§P将军§!和§m洋人§!的腰包，很多人开始质疑其意义。\n\n今后我们或许要重新考虑§P八省联合§!与§m德国§!关系的性质。"
 LEP_country_intro_header_3: "萧墙之内"
 LEP_country_intro_content_3: "§m德国的§!影响力以及§P八省联合§!的松散性常常导致局部动荡，虽然这些小事往往得以被迅速解决，但却无不显露着联合内部更严峻的隐患。§P八省联合§!一直受多股颠覆势力所侵扰，虽然他们目前没有什么威胁性，但也绝不能让他们超出我们的控制。\n\n一小撮§R国民党§!反抗势力，包括1926年§Y北伐§!失败和1932年§Y上海起义§!的残兵败将，就在我们掌控范围边缘的§a福建§!山区和各沿海租界内活动。而由于经济困顿，许多人被迫落草为寇形成§P乡间土匪§!，以劫掠为生，他们已经从§P山东§!南下，向华东诸省渗透。在南方的§c湖南§!和§l两广§!，即§P桂§!§l粤§!两省，正实际上处于自治状态，甚至可能暗怀独立之心。\n\n据说§Y安徽§!的§a陈调元督理§!已经得到了§z北直系§!中§c吴佩孚§!及其§c洛阳§!派的资金和支持，现在的§Y八省联合§!正前所未有地四分五裂。§Y福建§!和§Y江西§!为了叛军而焦头烂额，§Y苏北§!的§a郑俊彦§!要时刻提防§P鲁系§!，浙江的§a卢香亭§!和§a陈仪§!开始关注联合内部，§P齐燮元§!也同样拒绝了支持§P孙传芳§!的野心。该地区的未来已注定是多灾多难……"
 league_events.5.t: "孙传芳遇刺案的调查"
 league_events.5.d: "“笑面虎”身亡后，整个联合顷刻间就陷入了无序。士兵们哗变叛逃，陈调元正蓄势要给联合致命一击，而国民革命军也走出根据地打算做殊死一搏。现在死亡数字就已达到数千人，而齐燮元联帅若想巩固他的统治，更不知道会平添多少具尸体。虽然联合权威的崩溃出于诸多原因，但陈调元督理的煽风点火和国民党显然是最大的因素。而在齐大帅够不着的地方，甚至有人声称是德国佬和齐燮元本人导致了孙传芳的死。\n\n在举目皆敌的困局下，齐大帅敏锐地提出对孙传芳惨死的正式调查，以压制那些暴民。大多数人，尤其我们帐下的孙传芳的盟友，如谢鸿勋、李宝章、杨文恺和危道丰，以及很多其他人都完全不相信这个刺客施剑翘是孤身作案。他们都试图从迷雾中找寻答案。这个女人如何能如此接近孙传芳？孙传芳怎么会放松警卫？\n\n有人认为她服务于国民党，是戴春风手下的特工；有人认为她从属于北直系的情报网，只不过她没有按照计划行事，便导致了灾难性的后果；有人认为她是陈调元的特工，毕竟她是陈调元手下指挥官施中诚的堂妹；还有人简单地认定她不过只是为她早在十年前被残忍斩首的父亲施从滨复仇。\n\n孙传芳的亲信圈子里甚至有传言称齐燮元只是为了扑灭不满。回忆和报道指出，这名刺客用的是德国进口武器，而孙传芳身边戒备空虚，必定是有内应。更糟糕的是，据信最后目击孙传芳尸体的正是齐燮元本人。然而由于害怕会成为齐燮元或他走狗的枪下亡魂，没人敢公开发表这些意见。\n\n要进行调查，必须任命一名首席调查员。此人需要能够明察秋毫，将真相呈现给大众，或者，至少是对齐燮元有利的真相。齐燮元面前摆着四个选项。我们可以委派孙传芳的旧友刘宗纪来主持调查，凭借他对孙传芳的了解，真相一定能够早日大白于天下。但是他的调查结果并不一定会利于齐燮元，毕竟由于齐燮元跟孙传芳有点太不对付了，孙传芳的很多亲信都对齐燮元持怀疑态度；我们也可以选择忠于齐燮元的田文炳，这样至少能够保证调查结果不会对齐燮元不利；又或者我们可以将此事委托给一名德国人，毕竟大家都信得过他们；如果上述三种人选都不行的话，我们也可以请一名直系的人，因为他们绝对不会被各种效忠关系所束缚。"
 league_events.5.a: "让齐燮元的下人主持此案。"
 league_events.5.b: "让刘宗纪上吧！"
 league_events.5.c: "请一位德国调查员吧。"
 league_events.5.e: "烦请直系的卢香亭。"
 league_events.6.t: "确认调查方向"
 league_events.6.d: "既是出于合法性上的考量，也是为了让联帅能专注于华东的重建工作，孙传芳案的调查一直完全独立于政府的支持和影响在进行，他们是这么宣称的，至少当你抛开调查员本人与联合有关系这一事实来看就是这样。然而，在联合内部的许多人看来，孙传芳之死不过是荡平沙上塔。如果我们真想探究刺客背后的关系，联帅最好得出面给我们无畏的调查员一些引导，甚至提供一些我们对案发当天司令部发生的经过的猜测和观点。\n\n这些举措自然会有助于调查的进行，使其能进展得更加顺利并让问题及时得到解决。而对联帅本人来说，这也更有利于他对调查施加一定程度的影响和控制。尽管调查员本人可能会忽视联帅本人的建议，将他当作跳梁小丑逐出调查，但我们也不能放弃对调查小组产生哪怕一点影响的希望。"
 league_events.6.a: "“吴佩孚和曹锟是幕后黑手！”"
 league_events.6.b: "“是戴春风干的！毫无疑问！”"
 league_events.6.c: "“孙传芳的朋友也都和他一样表里不一……”"
 league_events.6.e: "“犯人无疑与陈调元有关！”"
 league_events.6.f: "“她不过是个复仇者罢了！”"
 league_events.7.t: "结案在即"
 league_events.7.d: "即使联合的官僚系统已经腐败不堪，其对安保问题、人事问题、忠诚问题以及联帅会考虑的任何其他事物的内部调查还是很快完成了。孙传芳的多疑又一次发挥了作用。虽然很多官员收拾文件和家什逃走了，但我们的调查员还是成功进入了对孙传芳事件调查报告的收尾阶段。\n\n经过数周的催促，还有齐燮元不停嗡嗡作响的“提醒”，调查员把所有线索都拼凑到了一起。没工夫去管齐燮元会不会高兴了，尽管我们只提供了最初的方向，但调查基本是独立进行的。报告的真实性和合法性为我们带来了一次巨大的胜利，但齐燮元派人士仍然担心露出马脚……"
 league_events.7.a: "谁要是办事不干净那他的脑袋可要落地了。"
 league_events.8.t: "刺客与北直系有关！"
 league_events.8.d: "联帅府内弥漫着紧张的气氛，齐燮元已经提前得知，他雇佣的独立调查员完成了骇人听闻的孙传芳案的调查报告。正如预期，调查员和他的团队打算向齐大帅和田文炳当面揭露案件的真相。当然，齐大帅早就知道了谁是幕后真凶，尽管他并没有和其他试图打倒“笑面虎”的势力合作，但他还是设法从困境和混乱中完美地找到了出路，坐到了如今的高位之上。而调查报告里任何可能把怀疑的矛头指向齐燮元的信息，今天都不可能传出这座府邸。\n\n齐燮元端坐在办公桌前，随着一阵轻轻的叩门声响起，田文炳领着调查团踏入了他的老巢，然后站到了他的主子身旁。而调查员则在齐燮元对面的椅子上坐下，从公文包中掏出一个密封的文件夹递给了联帅。齐燮元面无表情地拆开文件夹，同时调查员也开始陈述他们的调查结果。\n\n看来他们的结论是北直系指使了对孙传芳的刺杀！根据报告，凶手施剑翘为曹锟手底下最杰出间谍头子王遇甲所雇佣。这一结论并非空穴来风，毕竟北直系自1929年来就一直在尝试打压南直系。施剑翘在与因和孙传芳有联系而在联合境内从事间谍活动的卢香亭会面后，就被派往南京为他进行情报工作。而随着东亚监事会收购浙赣铁路，联合内动荡加剧，施剑翘也认为这是刺杀孙传芳的绝佳时机。"
 league_events.8.a: "“看来曹锟没能看住手下的老鼠啊。”"
 league_events.9.t: "刺客是国民党特工！"
 league_events.9.d: "联帅府内弥漫着紧张的气氛，齐燮元已经提前得知，他雇佣的独立调查员完成了骇人听闻的孙传芳案的调查报告。正如预期，调查员和他的团队打算向齐大帅和田文炳当面揭露案件的真相。当然，齐大帅早就知道了谁是幕后真凶，尽管他并没有和其他试图打倒“笑面虎”的势力合作，但他还是设法从困境和混乱中完美地找到了出路，坐到了如今的高位之上。而调查报告里任何可能把怀疑的矛头指向齐燮元的信息，今天都不可能传出这座府邸。\n\n齐燮元端坐在办公桌前，随着一阵轻轻的叩门声响起，田文炳领着调查团踏入了他的老巢，然后站到了他的主子身旁。而调查员则在齐燮元对面的椅子上坐下，从公文包中掏出一个密封的文件夹递给了联帅。齐燮元面无表情地拆开文件夹，同时调查员也开始陈述他们的调查结果。\n\n看来他们的结论是国民党的十人团指使了对孙传芳的刺杀！根据报告，凶手施剑翘为党国的红色间谍头子戴春风所雇佣。而正是这位掌控着各个臭名昭著的黑帮、上海暴徒和国民党忠实拥趸的戴春风，向施剑翘许下了复仇的诱惑。而随着东亚监事会收购浙赣铁路，联合内动荡加剧，戴春风看到了让闽赣叛乱地区摆脱孙传芳桎梏的时机，并指示施剑翘实施暗杀。"
 league_events.9.a: "是党国分子害了孙联帅。"
 league_events.10.t: "刺客与孙传芳朋友有关！"
 league_events.10.d: "联帅府内弥漫着紧张的气氛，齐燮元已经提前得知，他雇佣的独立调查员完成了骇人听闻的孙传芳案的调查报告。正如预期，调查员和他的团队打算向齐大帅和田文炳当面揭露案件的真相。当然，齐大帅早就知道了谁是幕后真凶，尽管他并没有和其他试图打倒“笑面虎”的势力合作，但他还是设法从困境和混乱中完美地找到了出路，坐到了如今的高位之上。而调查报告里任何可能把怀疑的矛头指向齐燮元的信息，今天都不可能传出这座府邸。\n\n齐燮元端坐在办公桌前，随着一阵轻轻的叩门声响起，田文炳领着调查团踏入了他的老巢，然后站到了他的主子身旁。而调查员则在齐燮元对面的椅子上坐下，从公文包中掏出一个密封的文件夹递给了联帅。齐燮元面无表情地拆开文件夹，同时调查员也开始陈述他们的调查结果。\n\n看来他们的结论将矛头指向了一名恰恰曾经是孙传芳同伙的人！根据报告，凶手施剑翘是幕后黑手的熟人。这名真凶野心勃勃，早在二十年代就曾尝试推翻孙传芳，而这回则是此人的又一次尝试。此人把孙传芳视作自己从区区督理位置上更进一步的阻碍，于是在年初的年度督理会议结束后授予施剑翘进入联帅府的权限。尽管报告没有收集到足够证据表明具体谁是真凶，但却提出了几个方向：邓如琢督理或者陈仪督理。\n\n尽管也有人认为齐燮元自己也可能包含在其中……"
 league_events.10.a: "“知人知面不知心啊……”"
 league_events.11.t: "刺客与陈调元有关！"
 league_events.11.d: "联帅府内弥漫着紧张的气氛，齐燮元已经提前得知，他雇佣的独立调查员完成了骇人听闻的孙传芳案的调查报告。正如预期，调查员和他的团队打算向齐大帅和田文炳当面揭露案件的真相。当然，齐大帅早就知道了谁是幕后真凶，尽管他并没有和其他试图打倒“笑面虎”的势力合作，但他还是设法从困境和混乱中完美地找到了出路，坐到了如今的高位之上。而调查报告里任何可能把怀疑的矛头指向齐燮元的信息，今天都不可能传出这座府邸。\n\n齐燮元端坐在办公桌前，随着一阵轻轻的叩门声响起，田文炳领着调查团踏入了他的老巢，然后站到了他的主子身旁。而调查员则在齐燮元对面的椅子上坐下，从公文包中掏出一个密封的文件夹递给了联帅。齐燮元面无表情地拆开文件夹，同时调查员也开始陈述他们的调查结果。\n\n看来他们的结论是曾经的安徽督理陈调元组织了对孙传芳的暗杀！根据报告，凶手施剑翘是陈调元手下的间谍。而施剑翘那作为陈调元高级下属的哥哥施中诚进一步为这个结论提供了依据。陈调元在孙传芳底下工作多年，而他也敏锐地抓住东亚监事会收购浙赣铁路的机会，靠一次干净利落的刺杀斩去了整个联合的龙头。"
 league_events.11.a: "该死的陈傻子。"
 league_events.12.t: "这是女子的复仇！"
 league_events.12.d: "联帅府内弥漫着紧张的气氛，齐燮元已经提前得知，他雇佣的独立调查员完成了骇人听闻的孙传芳案的调查报告。正如预期，调查员和他的团队打算向齐大帅和田文炳当面揭露案件的真相。当然，齐大帅早就知道了谁是幕后真凶，尽管他并没有和其他试图打倒“笑面虎”的势力合作，但他还是设法从困境和混乱中完美地找到了出路，坐到了如今的高位之上。而调查报告里任何可能把怀疑的矛头指向齐燮元的信息，今天都不可能传出这座府邸。\n\n齐燮元端坐在办公桌前，随着一阵轻轻的叩门声响起，田文炳领着调查团踏入了他的老巢，然后站到了他的主子身旁。而调查员则在齐燮元对面的椅子上坐下，从公文包中掏出一个密封的文件夹递给了联帅。齐燮元面无表情地拆开文件夹，同时调查员也开始陈述他们的调查结果。\n\n看来他们的结论是对孙传芳的刺杀仅仅是出于纯粹的个人仇恨！为了给她惨遭斩首的父亲施从滨报仇雪恨，施剑翘设法混入了孙传芳的佣人之中。因此，调查并未发现施剑翘有任何政治上的关联。看来“笑面虎”的下场无非是一报还一报。"
 league_events.12.a: "巧了，我们也是这么想的……"
 league_events.13.t: "刺客与德国人有关！"
 league_events.13.d: "联帅府内弥漫着紧张的气氛，齐燮元已经提前得知，他雇佣的独立调查员完成了骇人听闻的孙传芳案的调查报告。正如预期，调查员和他的团队打算向齐大帅和田文炳当面揭露案件的真相。当然，齐大帅早就知道了谁是幕后真凶，尽管他并没有和其他试图打倒“笑面虎”的势力合作，但他还是设法从困境和混乱中完美地找到了出路，坐到了如今的高位之上。而调查报告里任何可能把怀疑的矛头指向齐燮元的信息，今天都不可能传出这座府邸。\n\n齐燮元端坐在办公桌前，随着一阵轻轻的叩门声响起，田文炳领着调查团踏入了他的老巢，然后站到了他的主子身旁。而调查员则在齐燮元对面的椅子上坐下，从公文包中掏出一个密封的文件夹递给了联帅。齐燮元面无表情地拆开文件夹，同时调查员也开始陈述他们的调查结果。\n\n看来他们的结论是南京理事会、东亚监事会和德国领事馆共同组织了对孙传芳的刺杀！根据报告，凶手施剑翘参与了德国人的阴谋，在南京以东亚监事会间谍的身份行动。这份报告无疑戳到了联帅的痛处，其中宣称柏林下令让东亚监事会收购浙赣铁路以挑起抗议，并在施剑翘完成她梦寐以求的复仇。显然，德国人担心孙传芳会再次转向反租界立场，认为他早晚会拒绝再与德国人合作。于是他们先发制人，希望让一个更符合他们利益的人接任联帅。\n\n虽然这份报告在对齐燮元加以指控之前就戛然而止，但如果报告就照这样直接发布，无疑会恶化联帅和他背后德国靠山间的关系。"
 league_events.13.a: "近在咫尺，却又远在天涯。"
 league_events.14.t: "刺客与齐燮元有关！"
 league_events.14.d: "联帅府内弥漫着紧张的气氛，齐燮元已经提前得知，他雇佣的独立调查员完成了骇人听闻的孙传芳案的调查报告。正如预期，调查员和他的团队打算向齐大帅和田文炳当面揭露案件的真相。当然，齐大帅早就知道了谁是幕后真凶，尽管他并没有和其他试图打倒“笑面虎”的势力合作，但他还是设法从困境和混乱中完美地找到了出路，坐到了如今的高位之上。而调查报告里任何可能把怀疑的矛头指向齐燮元的信息，今天都不可能传出这座府邸。\n\n齐燮元端坐在办公桌前，随着一阵轻轻的叩门声响起，田文炳领着调查团踏入了他的老巢，然后站到了他的主子身旁。而调查员则在齐燮元对面的椅子上坐下，从公文包中掏出一个密封的文件夹递给了联帅。齐燮元面无表情地拆开文件夹，同时调查员也开始陈述他们的调查结果。\n\n看来他们的结论是当今联帅齐燮元本人组织了对孙传芳的刺杀！根据报告，凶手施剑翘与齐燮元毫无瓜葛，她的行动是完全独立的！而调查则更多聚焦于施剑翘的刺杀行动之后，指出齐燮元在孙传芳昏迷后就一直形迹可疑。齐燮元抓住东亚监事会收购后出现的机会，帮施剑翘完成了她的刺杀，给昏迷中的孙传芳送上了最后一程。\n\n从调查小组走进房间的那一刻起，他们的下场就已经注定了。根据小道消息，在一阵短暂的骚动后，联帅府花园中响起了一阵枪声。然而在枪声仍此起彼伏的南京城，并没有多少人注意到这里的动静。"
 league_events.14.a: "“我可警告过他们的。”"
 league_events.15.t: "是时候公布调查结果了"
 league_events.15.d: "调查团最终都全须全尾地走出了联帅府，紧张的气氛也随之一扫而空。接下来就轮到齐燮元的政府班子向公众发布调查结果，一步到位地遏制流言蜚语和反齐情绪。知识分子、官僚和商人都叫嚷着要求南京方面能给出个说法，而这篇报告内容无疑会转变公众对幕后真凶的态度。\n\n看着报告，联帅和田文炳计上心头。既然报告现在已经落到了我们手上，也许我们最好……稍微掩盖一些事实？修改一些说辞，让公众的愤怒转向我们希望的地方。当然，我们也可以就这么原封不动地公布结果，毕竟报告也没有明确指控齐燮元。"
 league_events.15.a: "必须以真实结果为准。"
 league_events.15.b: "这都是北直系搞的鬼！"
 league_events.15.c: "事情的背后一定有国民党。"
 league_events.15.e: "陈调元需要为此事负责！"
 league_events.16.t: "孙传芳遇刺事件通告"
 league_events.16.d_sun: "“清晨6点23分，孙传芳大帅醒来，享用了早餐。清晨6点51分，他在梳洗完毕后换上制服，准备和几位部下军官开会。此时，刺客施剑翘已伪装为女仆，混入到仆人群中。孙传芳开完会，便来到院子里的训练场。他在检视部队操练、松懈之时，施剑翘从他身后靠近，拿出一把德制鲁格手枪，向他连开三枪。一枪正中背脊，一枪打中肩膀，最后一枪射向头部但射飞了。施剑翘很快便被孙传芳的保镖控制住，孙传芳则被立刻送去急救。不过，由于失血过多，孙传芳在昏迷数周后与世长辞。\n\n调查团队收集的证据显示，刺客施剑翘系孙传芳手下一位省督的特工，此人一直在等待机会制造混乱以谋取私利。”"
 league_events.16.d_kuo: "“清晨6点23分，孙传芳大帅醒来，享用了早餐。清晨6点51分，他在梳洗完毕后换上制服，准备和几位部下军官开会。此时，刺客施剑翘已伪装为女仆，混入到仆人群中。孙传芳开完会，便来到院子里的训练场。他在检视部队操练、松懈之时，施剑翘从他身后靠近，拿出一把德制鲁格手枪，向他连开三枪。一枪正中背脊，一枪打中肩膀，最后一枪射向头部但射飞了。施剑翘很快便被孙传芳的保镖控制住，孙传芳则被立刻送去急救。不过，由于失血过多，孙传芳在昏迷数周后与世长辞。\n\n调查团队收集的证据显示，刺客施剑翘系国民党十人团的特工，他们一直在等待机会制造混乱以瓦解八省联合、再次掀起所谓国民革命。”"

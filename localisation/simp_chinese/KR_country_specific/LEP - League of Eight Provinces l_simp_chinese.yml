 LEP_zhu_jiaren: "朱家仁"
 LEP_Spreading_Unrest_desc: "骚动并没有消退，反而在继续蔓延，联合几乎每个主要城市都发生了动乱。到目前为止，这一切都在我们的意料之内，政府的反应几乎肯定会像以往一样；暴力和果断。"
 LEP_ye_zaifu: "叶在馥"
 lep_governor: "安徽督理陈调元发动叛乱后，我们如今再度控制了安徽。我们必须决定由谁接替陈调元担任安徽督理，并确保继任者不会再生叛意。此外，我们还应正式确认与其他督理的关系，毕竟并非所有人都赞同齐燮元继承联帅之位。"
 LEP_sun_chuanfang_year_tt: "§C孙联帅以远见卓识领导八省联合已有十年之久。在他的领导下，今年必将取得辉煌成就！§!"
 LEP_jinbao_tt: "§C齐联帅将招募一些津保派成员和务实政治家为新中国效力！§!"
 LEP_suns_year_of_glory: "孙传芳的辉煌之年"
 LEP_suns_year_of_glory_desc: "孙传芳联帅是中国最伟大的军阀之一。在他的领导下，华东地区一直享有和平与繁荣。即使是吴佩孚这样的强人，也畏惧这位昔日门生，因为他深知自己日渐衰老，而孙联帅却日益强大。那位两面三刀的玉帅已无法阻挡他曾经的学生，很快孙联帅将统治整个中国。历史将铭记1936年——孙传芳的时代！"
 LEP_the_new_beiyang: "新北洋之星"
 LEP_the_new_beiyang_desc: "我们的民国在过去几十年饱经磨难。欧洲列强趁我们国势衰弱之际巧取豪夺，就连新近崛起的日本也妄图建立比中国更强大的帝国。这段屈辱的历史现已终结，齐燮元大帅将带领中国人民开启一个繁荣昌盛的新纪元。中华民国万岁！"
 LEP_deepen_the_zhili_schism_penalty_tt: "§R在获得北直系支持后选择加深直系分裂将会受到惩罚。§!"
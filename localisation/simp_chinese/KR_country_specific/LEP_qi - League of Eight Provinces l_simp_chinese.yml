 league_qi.11.t: "联帅之国"
 league_qi.11.d: "统一战争结束后，齐燮元开始着手整顿中央军政体系，以军部为核心重新巩固自己的权力。昔日分散于各地的五省联军被逐步纳入统一的指挥系统，重要军事职位由忠于联帅的将领担任，军部也凭借其对国防、治安与地方驻军的控制，逐渐成为左右中央政局的关键机构。与此同时，政府继续邀请知识分子参与行政改革，并允许反赤救国大联合在有限范围内开展活动，但涉及军队指挥、国家安全与政权根基的事务，仍由齐燮元及其亲信说了算。​\n\n对于那些期待彻底改变中国政治面貌的改革者而言，这无疑是一种令人失望的结果。报刊可以讨论宪政，学者可以提出施政建议，政府也可以颁布一系列象征现代化的法令，但这些举措始终不能越过军部划定的界限。齐燮元并不否认知识与制度的重要性，只是他相信，任何改革都必须建立在秩序与权威之上，而不是以削弱国家武力为代价。​\n\n于是，齐燮元继续以联帅的身份主持国家政务，军部则成为支撑其统治的坚实柱石。中国已经结束了军阀割据，却并未真正告别军事政治；南京政府的旗帜如今飘扬在全国各地，而决定这面旗帜去向的，依旧是那位从战火中走来的联帅。"
 league_qi.11.a: "联帅掌舵，国家无忧"

 league_qi.12.t: "南京的一日"
 league_qi.12.d: "德国在中国的影响力，早已不再局限于铁路、工厂与银行。随着南京理事会逐步介入中央政府的日常运作，柏林的意志正沿着顾问团、贷款合同与行政改革的渠道，渗入这个统一国家的每一处关节。如今，德意志帝国决定更进一步：一批由柏林遴选的行政、财政与军事顾问即将进驻南京，直接参与各部事务，并协助理事会监督政府政策的制定与执行。​\n\n文件送到联帅府时，齐燮元的亲信曾试图争取更多商议的余地，但德国方面的态度不容置疑。重建所需的贷款、军队整编所需的装备，以及维持中央政府运转的诸多资源，仍然掌握在德国人手中。南京理事会没有公开威胁联帅，也不需要如此；那些列在文件附件中的援助条款、尚未拨付的款项与等待批准的军需订单，已经足以说明拒绝的代价。齐燮元坐在办公桌后，逐页翻过这份任命与授权文件。他曾经以为，借助德国的资本与技术，可以让自己成为统一中国的主人；如今，他却发现自己连拒绝德国人进入政府的余地都所剩无几。​\n\n签署仪式没有宴会，也没有值得载入报纸头条的演说。德国顾问依次递上文件，翻译站在一旁逐条说明授权范围，而齐燮元只是低头听着。偶尔，他会停在某一项涉及军政人事或财政监督的条款上，抬起头看向对面的德国代表；对方随即平静地指出，这些安排是继续提供援助的必要条件。短暂的沉默之后，联帅重新拿起钢笔，在每一份文件末尾签下自己的名字。墨迹尚未干透，文件便被收走，交由南京理事会安排后续执行。"
 league_qi.12.a: "签字吧，联帅"

 league_qi.13.t: "南京理事会年度报告"
 league_qi.13.d: "德意志帝国南京理事会\n中国事务部内部报告\n年度：1936年\n文件编号：NAC-36/041\n密级：机密\n一、行政管理与人事安排​\n中央政府各部现已完成初步整合。各省行政长官的任命及调动须报南京理事会备案，涉及财政、交通、工业与国防的高级职位，须经常驻顾问审核。齐燮元仍保留最高行政首长的名义，其签署的政令与任命文件均按既定程序执行。涉及重大政策调整的提案，未经理事会批准，不得进入正式议程。​\n二、财政与投资管理​\n中国中央政府年度预算须提交理事会审查。铁路建设、矿产开发及重工业项目优先获得信贷支持，拨款进度与项目执行情况挂钩。德国企业在华投资合同继续受到保护，新增特许经营项目由理事会统一协调。本土企业可申请政府贷款与采购合同，但涉及关键设备、技术许可及大规模外汇支出的项目，须经专项评估。​\n三、工业生产与市场配置​\n长江流域及沿海工业区继续作为主要投资区域。内地铁路、煤矿与电力设施列入下一年度重点建设计划。各省须按季度提交产量、运输量、税收及劳动力统计。政府采购优先考虑符合帝国技术标准的产品；对本土制造业的扶持，应以不影响既有德国投资项目的稳定经营为原则。​\n四、军事事务​\n德国军事顾问团继续参与中央军的编制调整、军官训练与参谋制度建设。年度军费预算、主要军械采购及军事交通工程须经联合审查。齐燮元保留军队名义上的最高指挥权，军部负责日常执行，顾问团则对装备标准、训练计划及战略部署提出具有约束力的意见。​\n五、政治风险与治安评估​\n本土知识界对外国顾问直接参与政府事务的批评有所增加。建议继续由中国官员公开承担行政责任，避免理事会直接介入地方日常治理。对于可能影响铁路运输、工厂生产及投资安全的政治集会，应由中国地方政府负责处理，并按月提交情况报告。​\n\n呈报对象：德意志帝国远东事务主管机构"
 league_qi.13.a: "“附件：各省财政统计表、工业投资清单、中央军年度采购预算”"

 league_qi.14.t: "德意志的东方堡垒"
 league_qi.14.d: "随着最后一批行政改革方案获得批准，南京理事会终于将中国纳入了自己的管理体系。从中央各部的人事任命到国家财政的分配，从铁路与矿山的经营到军队的整编训练，德国人的意志已渗入这个国家的每一处关节。曾经需要通过贷款、外交交涉与军事顾问才能获得的影响力，如今已成为南京政府日常运作的一部分。​\n\n齐燮元依旧坐镇联帅府，他的命令仍以中国政府的名义传达，重要文件也依旧需要他的签名。然而，没有理事会的许可，新的财政计划便难以落实；没有德国的资金与技术，军队现代化和工业建设也将陷入停滞。联帅仍然统治着中国，却已无法独立决定中国的未来。他曾希望借助德意志的力量巩固自己的权威，最终却发现，自己不过是这套庞大体系中负责维持本土秩序的一环。​\n对于柏林而言，这无疑是远东战略的一项重大成就。中国的资源、市场与工业潜力，终于被纳入德意志帝国的战略布局。德国资本推动经济运转，德国顾问参与国家治理，而南京理事会则确保这座东方堡垒始终沿着帝国所规划的道路前进。​\n\n南京的工厂仍在生产，铁路仍在延伸，政府公文仍以齐燮元的名义发布。一切似乎如常，只是决定这个国家命运的人，早已不再坐在联帅府的主位之上。"
 league_qi.14.a: "东方事务，进展顺利"

 league_qi.15.t: "远东军需调拨"
 league_qi.15.d: "南京理事会近日向中央政府下达了新一轮军需调拨指令，要求军政部门清点现有库存，并将符合德国标准的装备优先编入输德运输计划。随着国内军工生产逐渐恢复，步兵装备、支援器材与各类火炮的库存已达到新的规模，而德国方面也正不断提出追加需求。​\n\n按照理事会制定的分配方案，军需部门须从各地仓库中调拨步枪、支援装备、火炮及相关弹药，统一交由指定机构验收，再经铁路运往沿海港口装船。有关工厂接到通知后，将相应调整交货次序，优先完成理事会批准的出口订单。至于这些装备原本是否计划用于中国军队的训练与换装，则由军部另行评估。​\n\n对于南京政府而言，这套程序早已不再陌生。我们负责生产、清点与运输，德国方面则决定优先级与最终去向。只要理事会的调拨令仍在生效，仓库里的武器便不仅仅属于中国军队，也构成了德意志帝国远东供应体系的一部分。新一批货物即将启运，而下一份清单，想必很快便会送到我们的桌上。"
 league_qi.15.a: "按理事会的清单办理"
 LEP_transport_enquipment_tt: "§m南京理事会§!将定期要求我们向§a德意志帝国§!输送库存中约§G25%§!的§G军需物资§!（各类储备均在内）"

l_simp_chinese:
 #自改
 #齐燮元扩展国策
 LEP_establish_national_defense_union: "建立国防联军"
 LEP_establish_national_defense_union_desc: "五省联军曾是我们争取全国统一的军事支柱，如今，随着各省相继归于中央，旧有的军队也必须承担起新的国防职责。我们将以五省联军的既有编制、指挥经验与军官体系为基础，逐步吸纳各地部队，统一军制、训练与后勤标准，并将原先以省为界的军事力量整合为全国性的国防联军，使分散于各省的国防力量能够协同作战。"
 LEP_political_committee: "组建政委会"
 LEP_target_ten_provinces_united: "目标万省联合"
 LEP_sun_successor: "孙联帅的继业者"
 LEP_sun_successor_desc: "孙传芳留下的政治遗产，远不止五省联军的军队与地方行政体系。在他的统治之下，南京中央的名义、地方实力的支撑与有限的政治开明曾经并存，构成了华东一度维持秩序的基础。我们将以此为基础，延续既有的行政与政治传统，在维持强有力统治的同时，保留共和制度的框架，并逐步确立适应统一国家的新秩序。"
 LEP_three_loves_doctrine: "三爱主义"
 LEP_three_loves_doctrine_desc: "孙传芳曾以“爱国家、爱人民、爱敌人”为号召，为五省联军的统治提出一套不同于国民党三民主义的政治主张。我们将三爱主义重新确立为统一后国家的施政准则。国家的安定应当成为一切政治活动的基础，政府须以民众生计为念，而军事行动也应以维护秩序、救济人民为目的。我们将通过行政训令与公共宣传重申这一主张，使其成为约束官员、协调军政关系的共同原则。"
 LEP_greater_shanghai_plan: "大上海计划"
 LEP_greater_shanghai_plan_desc: "上海的繁荣举世皆知，但租界与华界分立的格局，使这座城市始终缺乏统一的行政中心，市政建设亦受到重重掣肘。孙传芳早年提出的“大上海”构想，正是希望将南市、闸北、沪西、浦东与吴淞等华界地区纳入统一规划，通过整顿行政、改善道路、开发新港与扩充公共设施，建立一座足以与租界相抗衡的模范城市。如今，我们得以重新推动这一计划。"
 LEP_courtesy_to_scholars: "礼遇士人"
 LEP_courtesy_to_scholars_desc: "江南士绅与工商名流长期参与地方公益、教育及实业建设，也是维系地方社会的重要力量。孙传芳主政东南期间，曾借助张謇、唐文治等地方名流及江浙绅商的影响，争取他们对新政权的支持。我们若要延续这一政治传统，便须为士人参与公共事务留下应有的位置。我们将礼聘有声望的学者与地方贤达，鼓励其参与教育、实业和市政建设，并通过咨议机构与地方行政听取各界意见。"
 LEP_national_salvation_alliance: "救国大联合"
 LEP_national_salvation_alliance_desc: "章太炎、徐绍桢等旧同盟会人士曾以“反赤救国大联合”为号召，主张反对赤化、保障国权，并以民治与社会改革争取民众支持。我们可以借鉴这一政治主张，联合反对工团主义的军政人物、旧国民党人士、地方士绅与社会团体，在维护国家独立与现有秩序的旗帜下建立更广泛的政治联盟。"
 LEP_balance_german_influence: "平衡德国影响"
 LEP_balance_german_influence_desc: "德国的资金与技术曾为中国的工业建设和军事现代化提供了重要助力，但长期依赖外援，也使本国经济与国家决策受到外部力量的牵制。我们必须重新审视双方的合作关系。我们将继续利用德国的投资、设备与专业人才，同时加强政府对重要产业、财政安排及对外合作的监督，防止外资利益凌驾于国家需要之上。"
 LEP_balance_german_influence_tt: "§C合并§Y$LEP_treaty_port_administrative_office_idea$§!、§Y$LEP_local_enterprise_idea$§!与§Y$LEP_Greater_Shanghai_Plan_idea$§!与为一个更强力的国家精神§!"
 LEP_support_local_enterprises: "扶持本土企业"
 LEP_support_local_enterprises_desc: "长期以来，国内工商实业受制于资本不足、技术落后与外来商品竞争，难以充分发挥其潜力。我们将通过调整税制、改善融资条件、保护本国商品市场，并鼓励企业引进技术、改良生产，帮助本土工商界扩大经营规模。对于关系国计民生的重要产业，我们也将加强政府的协调与扶助，使本国资本逐步成长为国家工业建设的支柱，减少对外国资金与设备的过度依赖。"
 LEP_qixieyuan_personality_cult: "齐燮元个人崇拜"
 LEP_nationalist_military: "国家主义训导"
 LEP_nationalist_military_desc: "国民革命军之所以战力强盛，不仅在于其编制与装备，更在于有主义贯穿其中，使官兵知晓所为何战。我们若要使五省联军真正成为统一国家的支柱，便不能仅凭军纪与长官威望维系部队。为此，我们将与同样寻求国家独立自主的中国青年党展开合作，在军中推行国家主义训导，以共同的信念弥合旧日裂隙。"
 LEP_five_color_flag: "拥护五色国旗"
 LEP_five_color_flag_desc: "全国既已统一，我们便更须确立国家的共同象征，以凝聚各省人心。五色国旗所代表的五族共和，不应随着党派更迭而遭到废弃，更不应成为一党一派的私有标志。我们将与中国青年党携手，在军中与社会各界宣扬国家主义，拥护五色国旗，维护国家统一与民族独立。唯有使国家高于党派，使共和成为全体国民共同遵守的原则。"
 LEP_education_rights_recovery: "收回教育权"
 LEP_education_rights_recovery_desc: "教育本应是国家培育国民、传承文化的根本，却长期受到外国教会势力的干涉。若任由外人把持讲坛，以学校为传播其政治与宗教影响的工具，国家便难以建立独立自主的国民教育。我们将与中国青年党合作，整顿各级学校，收回教育行政权，确立以国家认同与五族共和为核心的教育方针。"
 LEP_jinling_military_academy_expansion: "扩建金陵陆军军官学校"
 LEP_jinling_military_academy_expansion_desc: "金陵陆军军官学校自创办以来，便承担着为五省联军培育军官的重任。然而，随着全国统一的实现，旧有的军事教育体系已难以满足整编军队、巩固国防的需要。我们将进一步扩充校舍与训练设施，增加招生名额，完善军事课程，并延揽更多具有实战经验的军官与国家主义人士担任教官。"
 LEP_firm_anti_red: "坚决反赤"
 LEP_firm_anti_red_desc: "国民党在华东混战中的败亡，并未意味着赤色思潮在中国的终结。法兰西公社与不列颠联盟所领导的第三国际，仍在境外积极传播工团主义，企图借助工人运动与革命宣传，将其政治影响重新带回中国。我们必须认清，战场上的胜利只能摧毁敌人的武装，却无法自行消除其思想的影响。为此，我们将在军队、学校与社会各界加强国家主义训导，遏止工团主义的渗透，防止境外势力利用国内矛盾动摇新生的统一政权。"
 LEP_tariff_barriers: "建立关税壁垒"
 LEP_tariff_barriers_desc: "全国统一使我们得以重新审视各省之间及对外贸易的旧有规制。面对外国工业品的竞争，国内尚在恢复的民族工业难以独力与之抗衡，而长期以来各地关税制度的混乱，也使统一的经济政策难以贯彻。我们将着手调整关税制度，提高外国商品进入国内市场的成本，为本土企业争取喘息与发展的空间。同时，我们还须审慎区分各类进口商品，避免必要的机器设备与工业原料因关税过高而阻碍生产。"
 LEP_economic_regulation_enhancement: "加强经济调控"
 LEP_economic_regulation_enhancement_desc: "各省虽已归于统一，但经济政策的分歧与资源配置的失序仍将妨碍国家建设。我们必须加强中央对金融、贸易及重要产业的协调，统筹各地资源与建设计划，避免资本逐利而忽视国家长远需要。通过建立更有力的经济调控机制，我们将使国内经济逐步摆脱地方割据遗留的掣肘。"
 LEP_young_and_modern_china: "青年中国，现代中国"
 LEP_young_and_modern_china_desc: "从五省纷争到全国统一，我们终于结束了长期的战乱与分裂。前方的道路仍然漫长，但一个崭新的时代已经开始。这将是我们共同建设的国家，也是我们交给后来者的事业。中国青年党所倡导的国家主义，应成为国家建设的共同纲领。一个独立、统一而现代化的中国，既不应受制于外国强权，也不应困于旧有制度的桎梏。我们将使青年成为国家进步的动力，让今日重建的共和国成为一个能够自主决定自身命运的现代国家。"
 LEP_under_germans_influence: "黑鹰羽翼之下"
 LEP_under_germans_influence_desc: "全国统一为德国提供了前所未有的机会，南京理事会也终于能够将过去分散于各地的影响力整合为一套完整的控制体系。我们将接受理事会对中央政府各部门的全面改组，国内的行政机构与军队仍将维持原有名义，但其政策、人事与资源调配均须服从理事会的统一安排。黑鹰的羽翼将笼罩南京，德国的资本与顾问体系也将深入国家机器的各个角落。"
 LEP_security_pacification_campaign: "治安强化运动"
 LEP_security_pacification_campaign_desc: "各地仍有拒绝服从齐燮元政权的武装、秘密组织与地方势力，利用山地、乡村及行政薄弱地区维持抵抗。德国顾问认为，仅凭常规军事行动难以彻底消除这些隐患，必须将军事清剿与地方行政整顿结合起来。我们将开展全国性的治安强化运动，由联军协同地方警察与保安力量，对持续抵抗的地区实施清剿，并加强户籍登记、交通管制、基层组织整顿与物资管理。"
 LEP_german_advisors_stationed: "德国顾问进驻"
 LEP_german_advisors_stationed_desc: "我们将允许德国顾问进入财政、工业、交通、教育、卫生及行政等部门，协助制定预算、规划建设、改组机构，并按照德国的经验推动各项制度改革。从工厂的生产安排到铁路的运营，从学校的课程设置到地方行政的日常运作，德国专家都将参与其中。南京政府仍保留各部门的名义与日常职能，但越来越多的政策将由德国顾问提出，并在其监督下付诸实施。"
 LEP_currency_peg_to_mark: "与马克挂钩"
 LEP_currency_peg_to_mark_desc: "帝国马克作为德国经济体系的核心货币，其稳定性与德国的工业实力、贸易网络及金融信用密不可分。我们将推动中国货币与马克建立固定汇率联系，并协调外汇储备、结算制度与对德贸易安排，以减少汇率波动带来的不确定性，便利德国资本、设备与技术进入中国。"
 LEP_imperial_enterprise_privileges: "帝国企业特权"
 LEP_imperial_enterprise_privileges_desc: "我们将划定特许经营区域，赋予帝国企业矿产开采、铁路运营、港口管理及大型工业项目的优先权，并在税收、土地取得、司法管辖与行政审批方面给予其特殊待遇。作为交换，这些企业将承担工业投资、技术引进与基础设施建设的任务，为中国经济重建提供资金和设备。"
 LEP_german_eastern_bastion: "德意志东方堡垒"
 LEP_german_eastern_bastion_desc: "齐燮元的中国已无法脱离德意志帝国的扶持而独自运转。从军队整编到工业重建，从地方行政到中央决策，南京理事会的影响早已渗入国家机器的每一处关节。德国的资本维系着经济的运转，德国的顾问塑造着军政体系，而德国的意志则为这个国家指明方向。曾经谋求自主的八省联合，如今已成为柏林在东亚最忠实的支柱与最坚固的屏障。"
 LEP_von_seekct: "塞克特顾问团"
 LEP_von_seekct: "汉斯·冯·塞克特曾将德国军事顾问团的经验与理念带到中国，试图以严谨的训练、科学的组织与系统的参谋工作重塑中国军队。如今，这位德国将军虽已离世，但他所倡导的军事改革不应随之中断。南京理事会将继续维持并扩充顾问团的组织体系，由继任者接过他的职责，将德国的军事学说、训练制度与参谋传统贯彻到底。"
 LEP_awakening_lion_youth_corps: "醒狮青年团"
 LEP_awakening_lion_youth_corps_desc: "青年党长期以来借助《醒狮》周报联络各地青年，以国家主义为号召，在学校与知识界中传播政治主张。如今，随着全国统一的完成，这一运动也有了进一步发展的空间。我们将以青年学生为主要对象，组织成立“醒狮青年团”，通过政治训导、时事研讨与社会活动，培养认同国家主义、服从统一政纲的青年骨干，并逐步建立覆盖各地学校的组织网络。"
 LEP_prussian_constitutionalism: "普鲁士宪政"
 LEP_prussian_constitutionalism_desc: "对于齐燮元而言，普鲁士的经验提供了一条值得借鉴的道路：在不动摇国家权威的前提下，以法律明确政府职权，以议会吸纳地方精英，并使行政机器摆脱军阀私人的支配。南京理事会将协助我们移植这套制度。"
 LEP_treaty_port_administrative_office: "商埠督办公署"
 LEP_treaty_port_administrative_office_desc: "过去，华界各地的行政、财政与市政事务分散于不同机关，彼此掣肘，既妨碍城市建设，也削弱了政府对商埠的管辖。我们将设立商埠督办公署，统筹地方行政、治安、财政、对外交涉与公共工程，并加强对港口、道路及市政设施的管理。"
 LEP_unite_middle_class: "联合中产阶级"
 LEP_unite_middle_class_desc: "随着工商业的发展，商人、职员、专业人士与城市知识阶层日益成为社会中不可忽视的群体，他们关心财产保障、商业稳定与个人发展的机会，也不愿长期陷于战乱与政治动荡。我们将改善工商环境，鼓励中小企业发展，并通过商会、行业团体及地方咨议机构听取他们的意见，使中产阶级能够在现有共和制度下参与公共事务。"
 LEP_behind_the_scenes: "幕后之手"
 LEP_behind_the_scenes_desc: "单凭军政权威维系的统治已不足以应对日益复杂的治理事务。我们需要一位能够获得知识界与工商界信任、熟悉行政建设并具备改革声望的人物，出面主持政府日常运作。丁文江长期参与公共事务，又在上海市政建设中积累了经验，足以成为新政权对外展示的代表。我们将推举丁文江出任总统，由其主持政务、推动行政整顿与经济建设。而齐燮元则退居幕后，继续凭借军政人脉与既有权力网络掌握政局方向。"
 LEP_traditional_values_return: "传统价值回归"
 LEP_traditional_values_return_desc: "多年来，军阀混战、党派倾轧与激进思潮的传播，使传统的家庭观念、社会责任与地方互助受到冲击。我们将重新重视儒家伦理中有关责任、守信、尊长与群体义务的观念，并通过学校教育、社会团体与地方行政加以倡导。同时，我们也将鼓励家庭承担教育与赡养责任，支持地方公益事业，使社会在恢复稳定的同时重新建立共同的道德准则。"
 LEP_council_new_order: "理事会的新秩序"
 LEP_council_new_order_desc: "全国统一为南京带来了重建的机遇，也为德国人进一步介入中国政务敞开了大门。借助战后重建与行政改革之名，南京理事会将把触角伸向政府各部、地方行政与军队指挥体系，逐步收回原由齐燮元亲信把持的权力。德国顾问不再仅仅提供建议，而将直接参与政策制定与执行。"

 LEP_consultative_council: "咨询委员会"
 LEP_break_with_germany: "与德国决裂"
 LEP_break_with_germany_desc: "我们曾以为，德国的资本、枪炮与顾问能够为中国带来一个崭新的时代；而柏林也曾将南京视作其远东霸业中不可或缺的一环。然而，当英法领导的第三国际与俄罗斯的铁蹄踏碎德意志帝国的霸权，昔日的庇护者便在一夜之间成了自身难保的败者。南京理事会失去了宗主国的威势，却仍试图攥紧中国的权柄。既然柏林已无力兑现承诺，我们又何必继续为一个覆灭的帝国守墓？是时候夺回被窃取的主权了。"
 LEP_new_military_ministry: "新军部之治"
 LEP_new_military_ministry_desc: "我们必须使军部的权威真正转化为齐燮元个人的政治力量，重新审视高级军官的任用与调动，确保关键指挥机关掌握在忠于中央的将领手中，同时加强军方对国家安全、行政人事与重大政策的参与。我们还将建立由军政要员组成的核心决策机构，协调军队、情报机关与文官政府之间的关系，防止任何派系借职务与组织之便形成独立于最高权力的势力。"


 LEP_Restored_Confucian_Order: "礼教重光"
 LEP_Restored_Confucian_Order_desc: "孔庙重修，乡约重订，宗族与士绅重新担起催租、劝农、弭盗的差事。省里省下的心力，尽可拿去办新学堂、开工厂。"

 LEP_qixieyuan_personality_cult_desc: "我们必须承认，八省的政令至今不过是一纸空文——政学系把持省署，自治同志会盘踞县乡，江南商帮握着钱袋，谁也不必听谁的。在一个派系林立的地方推行任何改革，都要先解决权威从何而来的问题。让联帅成为公认的领袖，并非为了满足某一个人的虚荣，而是为了让政令能够真正通达全省。当然，这种权威一旦树立，日后要收回就不那么容易了。"
 LEP_traditional_values_return_desc: "我们必须重新审视二十年来对旧学的态度。新式学堂培养出了人才，也割断了他们与乡土的联系；科举既废，乡间的读书人失去晋身之路，成了既无出路又不肯安分的一群。宗族与士绅曾承担教化、赈济、弭盗的职责，如今这些职责落到了无人负责的空处。恢复传统的教化与结社，正是要把这部分力量重新组织起来，让政令在县以下也能找到落脚点。"
 LEP_young_and_modern_china_desc: "我们必须正视，这个国家最宝贵而最被浪费的资源，是青年的头脑。余家菊这一代人读过西学，也受过旧学的训练；他们既不满于旧官僚的敷衍，也不肯接受任何形式的空谈。把他们安置到需要真正负责任的岗位上，比任何一次演讲都更能说明新政府要把中国带向何处。国家的前途终究要交到他们手里，现在就该让他们开始学着接手。"
 LEP_new_military_ministry_desc: "我们必须承认，八省的军队依旧是旧式的军队：发饷靠人情，升迁靠门路，参谋部里坐着的还是一批只会画地图的老先生。田文炳在直系中带过兵，也打过败仗，他知道一支军队从松散到可用要走多少路。把军务交给这样的人并让他掌握实权，我们才有可能在下一场战争到来之前，把八省的军队真正变成一支国家的军队。"
 LEP_behind_the_scenes_desc: "我们必须承认，军人直接掌权在今日中国是块危险的招牌。各省士绅、报界舆论、列强观感，都不会欢迎一位以枪杆起家的总统。请丁文江这样的人出任总统，凭他的学识与清誉赢得各方认可，而联帅退居幕后主持全局，这才是既能贯彻意志又不致招人非议的办法。当然，坐在前台的人未必甘心只做前台。"
 LEP_architect_of_the_new_state: "新国家的建筑师"
 LEP_architect_of_the_new_state_desc: "余家菊以青年党的锐气入阁，主张以教育与科学重建国家。他主持的每一件政务都带着一种近乎严苛的条理，让旧官僚既敬且畏。"
 LEP_iron_discipline_of_the_new_army: "新军的铁律"
 LEP_iron_discipline_of_the_new_army_desc: ""
 LEP_the_man_behind_the_curtain: "帘后之人"
 LEP_the_man_behind_the_curtain_desc: "丁文江以学者之身在军政之间周旋，既能为各方所容，又深明联帅的真实意图。位在总统，而诏令多出于帘后。"
 LEP_iron_hand_behind_the_throne: "幕后铁腕"
 LEP_iron_hand_behind_the_throne_desc: "齐燮元名义上退居副位，实则八省的军令、人事、财赋仍须经他之手。前台换了面孔，帘后的那只手没有换。"
 LEP_ding_wenjiang_leader_desc: "§L$LEP_ding_wenjiang_advisor_desc$§!"
 LEP_popular_support_the_young_and_the_modern: "政治法统：§n青年当国§!"
 LEP_popular_support_the_young_and_the_modern_desc: "以余家菊为首的一代少壮进入中枢。他们受过新式教育，做事讲条理、重实效，也让守旧的官僚第一次感到位置不稳。"
 LEP_popular_support_behind_the_throne: "政治法统：§c帘后垂治§!"
 LEP_popular_support_behind_the_throne_desc: "总统换了面孔，实权仍握在联帅手中。各方之所以接受这一安排，正是因为它既顾全了体面，又不必真正交出权柄。"
 LEP_popular_support_the_new_ministry: "政治法统：§P军部新章§!"
 LEP_popular_support_the_new_ministry_desc: "军务归入新设的部院，发饷、升迁、训练一体按章程办理。旧军官的私人势力被逐步纳入制度之内。"
 LEP_popular_support_berlin_mandate: "政治法统：§m柏林授命§!"
 LEP_popular_support_berlin_mandate_desc: ""
 LEP_tt_purge_deadwood: "§Y裁汰冗员：§!新式人才入替，积弊得以清除。"
 LEP_tt_reform_the_army: "§Y整军：§!军队涣散之弊稍得缓解。"
 LEP_tt_restore_legitimacy: "§Y法统稍复：§!有名望者居其位，政令渐能通行。"

 LEP_establish_national_defense_union_desc: "我们必须把八省各自为政的军队收束到同一个指挥之下。如今各省督军手里的兵，名义上同属民国，实际上各有各的粮台、各有各的官长；一旦外敌入境，这样的军队连集结都要花上数月。建立国防联军，正是要先把番号、饷章与调遣之权统一起来，再谈整顿。"
 LEP_political_committee_desc: "我们必须给这个新政权一套能够运转的中枢。眼下省署、军部、议会各行其是，一道命令往往要经过四五道关卡才能落地。组建政务委员会，把财政、民政、外交诸事归入一处议决，既是为了提高效率，也是为了让各派在这一张桌子上分出高下，而不必动刀兵。"
 LEP_target_ten_provinces_united_desc: "我们必须把眼光放到八省之外。东南这一隅物产虽丰，终究撑不起一个国家的架子——没有华北的煤铁，没有长江上游的米粮，工业与国防都无从谈起。"
 LEP_jinling_military_academy_expansion_desc: "我们必须承认，八省的军官大半是在行伍中打滚出来的，懂打仗，却未必懂近代战争。金陵原有的军官学校规模有限，一年毕业不过数十人，杯水车薪。扩建校舍、延聘教官、增设炮工辎重诸科，为的是在十年之内，让每一支部队都有一批读过书的官长。"
 LEP_awakening_lion_youth_corps_desc: "我们必须把这股青年人的热气引到正处。学校里、报馆里、街头巷尾，到处是议论国事的声音，却没有人替他们组织起来。醒狮青年团要做的，就是把这些零散的热情编成纪律：操练、宣讲、服务，让他们在成年前先学会做一个国民。"
 LEP_courtesy_to_scholars_desc: "我们必须给读书人留一条出路。民国以来，乡间的士绅既不必再应科举，也无从参与新政，渐渐成了旁观者甚至反对者。礼遇士人，请他们参与地方事务、充任咨议，是要把这一层人重新拉回国家的轨道上来。"
 LEP_consultative_council_desc: "我们必须为决策找一个能够容纳不同意见的场合。军政大事若只由省署几个人关起门来定，下面的人便只会服从或阳奉阴违。设立咨询委员会，把士绅、商界与各党代表请进来，虽然未必能立刻改变什么，但至少能让各方先习惯于坐在一起说话。"
 LEP_Jinling_Military_Academy: "金陵陆军军官学校"
 LEP_Jinling_Military_Academy_desc: "扩建后的金陵军校增设炮、工、辎重诸科，延聘德国与日本教官，每年为八省军队输送一批受过近代训练的基层官长。"
 LEP_Consultative_Council: "咨询委员会"
 LEP_Consultative_Council_desc: ""
 LEP_tt_reorganise_the_army: "§Y整编军队：§!涣散之弊稍得缓解。"

 #事件
 league_qi.1.t: "凋敝的国民经济"
 league_qi.1.d: "我们终于将中国重新置于南京的旗帜之下。自江南的工商重镇至西北的荒凉边地，地图上的疆界如今连成一片，昔日割据的军阀与地方政权也已不复存在。然而，一纸统一的宣告终究不能填平战火留下的沟壑。当庆祝胜利的钟声传遍各地，我们很快便不得不面对一个令人难堪的事实：我们得到的是一个统一的国家，却不是一个统一的经济体。​\n\n东南沿海的工厂、港口与金融机构尚能维持运转，上海的商人仍在盘算下一笔买卖，德国资本也为江浙的工业提供着有限的支撑。凭借青帮的关系网络与打手，我们甚至还能在某些地方压住骚乱，让货物继续流通，让税款勉强进入政府的账簿。但这些手段终究只能维系表面的安稳。越过长江，铁路与公路在战争中遭到破坏，农村的生产迟迟未能恢复，地方市场彼此隔绝，许多地区至今仍依靠残存的旧有秩序勉强维持生计。​\n\n更棘手的是，东南的财富并不会自然而然地流向内地。沿海的银行不愿向满目疮痍的乡村放贷，工厂缺乏稳定的原料供应，而饥困的农民也无力购买工业制品。我们可以派遣官员，可以调动军队，甚至可以用刺刀迫使地方服从，但这些都无法凭空创造粮食、修复铁路或重建市场。"
 league_qi.1.a: "问题在于经济？"

 league_qi.2.t: "胜利之师的积弊"
 league_qi.2.d: "我们终于结束了中国漫长的分裂，五省联军的旗帜如今已插遍全国。然而，疆域的扩张并未使我们的军队一夜之间脱胎换骨。说到底，我们的中央军仍是那支由齐燮元一手经营起来的宁系部队：它在军阀混战中成长，依靠私人关系维系指挥，以派系忠诚代替制度约束，又在一次次征战与交易中养成了根深蒂固的积习。过去，这些问题尚能被战场上的胜利掩盖；如今，我们却再也无处可以躲藏。​​\n\n统一战争为许多军官带来了晋升，也为他们提供了大发横财的机会。战时采购的账目含混不清，军需物资在层层转运中不翼而飞，虚报兵额与侵吞军饷更早已成为公开的秘密。某些部队的花名册上挤满了领饷的士兵，营房里却找不到与之相称的人影；另一些将领则忙着购置田产、经营生意，仿佛军职不过是他们积累财富的另一条门路。我们当然可以对这些人睁一只眼闭一只眼——毕竟，许多人正是凭借对我们的忠诚才坐上今天的位置。但当忠诚变成了瓜分军费的凭据，我们究竟还剩下多少真正能够调遣的军队？​​\n\n更何况，全国统一并未让国防压力随之消失。北方边境需要驻军，沿海港口与漫长的交通线亟待守备，地方上的残余武装也远未彻底肃清。我们必须把军队部署到过去从未设想过的地方，却仍在依靠一支为争夺省份而建立、为军阀利益而运转的旧式军队维持秩序。扩军需要钱，整军需要钱，装备与训练同样需要钱；而我们的军费，正不断流进那些无法出现在战场上的口袋。"
 league_qi.2.a: "枪杆子怎么会攻击钱袋子？"

 league_qi.3.t: "政治危机"
 league_qi.3.d: "在东南的岁月里，我们尚能凭借五省联军的枪杆子、地方士绅的支持与南京的行政机器稳坐联帅府。然而，如今我们的旗帜已经越过长江，插遍中国各地，昔日行之有效的统治手段却未必还能应付这个庞大而复杂的国家。统一消灭了许多割据政权，却没有消除人们对旧政治的怨愤；我们收复了疆土，却也将那些曾经被地方壁垒隔绝的矛盾一并带到了南京。​\n\n​我们并非没有尝试改变。民主科学座谈会、景星会以及其他知识界人士的加入，曾让我们得以向外界展示一个超越军阀政治的新政府形象。他们为行政改革建言，为教育与社会建设奔走，也试图在军队之外为我们的统治寻找新的支柱。然而，几位知识分子的支持终究无法掩盖官僚机构的积弊。贪污舞弊依旧盛行，报刊与集会仍受到严密约束，地方官员习惯于服从上级而非回应民众。那些曾经对我们抱有期待的人，如今开始追问：所谓统一，究竟是要建立一个新的中国，还是仅仅让南京的命令传到更远的地方？​​\n\n我们必须为未来的统治寻找新的基础。德国顾问可以为我们提供行政组织与国家建设的经验，却也意味着我们将进一步依赖外国人的判断；我们可以效仿孙传芳，在有限的政治让步中争取本土知识分子的支持，但改革势必触及既得利益者的权力；我们也可以借助民众对赤色帝国主义的恐惧，将中国青年党纳入我们的政治阵营，以民族主义与反共宣传巩固政权。三条道路各有代价，而我们已经没有太多时间继续拖延。"
 league_qi.3.a: "该走哪条路？"

 league_qi.4.t: "护旗运动"
 league_qi.4.d: "十月十日，南京东南大学大礼堂内人头攒动。国光社、光华社、国铎社、国风社、醒狮社与国家主义青年团等十余个团体齐聚一堂，在中国青年党的组织下举行了声势浩大的护旗宣誓典礼。会场正中悬挂着五色国旗，台下的青年们整齐列队，庄严宣誓拥护五族共和，反对以党旗代替国旗，誓言捍卫国家统一，抵制赤色势力的侵蚀。​\n\n宣誓结束后，与会者分作十路走上南京街头，沿街演讲、散发传单并张贴标语。其中最引人注目的，是以红、黄、蓝、白、黑五色纸张拼贴而成的旗帜式标语，黄色纸条镶出旗杆的轮廓，远望俨然一面迎风招展的五色国旗。街头巷尾随处可见“拥护五族共和的五色国旗”“五族共和万岁”“反对赤化”“打倒赤化侵略”等口号。人群聚集在宣讲者周围，围观者的议论声与青年们的呼喊声交织在一起，使这场原本局限于团体内部的宣誓，成为南京城内一场引人注目的政治集会。"
 league_qi.4.a: "五色旗下，团结国民"

 league_qi.5.t: "国家主义军官的摇篮"
 league_qi.5.d: "五省联军的胜利曾经依赖枪炮与将领的威望，但华东混战中闽赣战场上的失利提醒我们，仅凭军纪与私人效忠，终究难以支撑一支现代军队。国民革命军之所以能够在战场上表现出顽强的凝聚力，除了军事训练之外，也在于其以主义维系官兵。若我们希望建立一支足以保卫统一的军队，便不能再将军官培养仅仅视作操练与战术教育。​\n\n为此，我们决定扩建金陵陆军军官学校，使其成为全国军队培养军官的重要基地。除军事学科与参谋训练外，学校还将引入中国青年党的国家主义教育，由余家菊等人担任政治教官，向学员讲授五族共和、国家统一与反对强权侵略的理念。青年党也将借此机会在军官群体中建立组织网络，而我们则希望借助共同的政治信念，弥补旧式军阀部队中派系林立、各自为政的缺陷。​\n\n从今往后，每日早晚点名时，值日官都将带领学员高呼校训：“内求统一，拥护五族共和。外求独立，反对强权侵略。拥护五色国旗，拥护国家主义。国家主义万岁，联军万岁，五色国旗万万岁！”我们正尝试让军官们明白，他们所效忠的对象不应只是某一位将领或某一个派系，而应当是他们肩负保卫责任的整个国家。"
 league_qi.5.a: "以国家主义铸造联军的脊梁"

 league_qi.6.t: "收回教育权"
 league_qi.6.d: "余家菊向我们提交了一份有关全国教育改革的提案。在这位国家主义教育家的眼中，教育绝非单纯传授知识的事业，它更关乎国民性格的养成、国家意识的确立与民族文化的延续。长期以来，外国教会凭借特权在中国兴办学校，其课程、宗教训育乃至行政管理，往往游离于国家教育制度之外。倘若连培养下一代的权力都无法掌握，我们又如何谈得上真正的国家独立？​\n\n余家菊主张，政府应当制定统一的学校注册制度，重新审查各类教会学校与外人所办学校的办学资格。凡涉及传播宗教、妨碍国家教育统一或损害教育主权者，均须接受整顿，必要时取消其注册资格。与此同时，国家应当确立明确的教育宗旨，将国民教育建立在民族文化、国家认同与健全人格的培养之上。在他看来，教育不应沦为外国势力传播信仰与影响中国社会的工具，而应成为塑造国民、巩固国基的事业。"
 league_qi.6.a: "教育之权，不容旁落"

 league_qi.7.t: "青年中国"
 league_qi.7.d: "齐燮元曾经依靠枪杆子与地方势力维系统治，也曾在军阀混战的夹缝中借助外国资本与技术谋求强盛。然而，战争的胜利终究无法自行缔造一个现代国家。腐败的官僚、盘根错节的派系与彼此隔绝的地方社会，始终提醒着我们，统一不过是漫长国家建设的开端。\n\n如今，当我们再次站在南京的高楼之上，俯瞰这座见证了无数兴衰的古都，往日的纷争似乎已逐渐远去。五色国旗飘扬在政府大楼与学校上空，金陵陆军军官学校的学员们在晨曦中高呼国家主义的誓言，新的教育制度也正将国家认同带给下一代。余家菊与中国青年党的同道们终于不再只是奔走于报刊、讲坛与街头的知识分子。他们的理念已成为政府施政的一部分，而我们也借此寻得了超越旧日军阀政治的思想基础。\n\n这并不意味着中国已经摆脱了所有积弊。一个由枪杆子与旧官僚支撑起来的国家，不可能仅凭几场改革便彻底焕然一新。我们仍须面对贫困、腐败与地方差异，也必须在国家权威与社会诉求之间寻找新的平衡。但至少，在中国青年党的协助下，我们开始以统一的教育、共同的国家意识与现代化的行政体系，将这片古老的土地塑造成一个真正意义上的现代国家。"
 league_qi.7.a: "五色旗下，国家新生"

 league_qi.8.t: "救国大联合的成立"
 league_qi.8.d: "南京的会场内，座椅早已坐满，走廊间仍有来宾陆续入场。五色国旗悬挂于主席台两侧，桌案上堆叠着刚刚印好的宣言与章程，报馆记者则挤在会场前排，等待记录这场成立仪式的每一个细节。这场大会得以召开，离不开齐燮元的支持。统一全国之后，南京政府亟需在军队与官僚体系之外寻求新的政治支柱，而本土知识界与社会团体的参与，正为政府提供了一个不同于旧日军阀政治的选择。在政府方面的支持下，来自各界的代表得以齐聚南京，共同筹建反赤救国大联合。\n​\n随着主持人宣布大会开始，原本嘈杂的交谈声渐渐平息，各界代表相继起身，在众人的注视下走向主席台。掌声从会场一端传至另一端，几名代表展开宣言，逐条宣读组织的宗旨与行动纲领。宣言明确提出，反对赤化、保障国权与实行民治，皆是当下救国事业不可偏废的责任。台下不时响起赞同的附和声，也有人低头翻阅手中的文本，仔细核对其中关于政治改革与社会政策的条文。当宣读者谈及外国势力借助金钱与武器干涉中国事务时，会场一度响起激烈的议论；而当话题转向整顿不合理的政治、改善民众生计时，几位代表又相继起身发言。\n\n仪式临近尾声，与会代表在宣言上签署姓名，会场前方的摄影师随即举起相机，镁光灯闪过，记录下众人围聚在五色国旗之下的身影。会场外，工作人员正将宣言分送各家报馆，门口的来宾则三三两两地讨论着这一新组织的前途。"
 league_qi.8.a: "让联合的呼声传遍全国"

 league_qi.9.t: "竞争者的崛起"
 league_qi.9.d: "自南京政府向内地开放市场以来，德国企业便凭借雄厚的资本、先进的设备与政府给予的种种便利，率先进入了那些曾被战乱与地方割据阻隔的地区。从铁路修筑到矿山开发，从机器制造到金融信贷，德国商号一度几乎成为内地工业建设中不可忽视的力量。对于急于恢复生产、填补技术缺口的南京而言，这些投资曾是重建国家经济的重要支柱；而对于柏林的商人来说，中国广阔的市场与尚未开发的资源，也意味着一片值得长期经营的天地。​\n\n然而，随着统一后的经济政策逐渐展开，情况开始发生变化。在联帅的授意下，政府正通过贷款、采购合同、税收优惠与技术扶持，帮助一批本土企业扩大生产规模。过去只能依赖进口机器与外国信贷的中国商人，如今开始涉足铁路器材、纺织、矿业与基础工业，并在政府订单的庇护下争取原本由德国公司把持的市场。南京方面将此视为恢复经济自主、培育本国工业的必要步骤，但德国商界却不免感到不安：他们曾以为，开放内地意味着更广阔的经营空间，如今才发现，这片市场同样正在孕育足以与他们争夺利益的本土竞争者。​\n\n德国驻华代表对此已向南京提出交涉，声称政府的扶持措施正在破坏既有的商业环境，要求继续保障德国企业在内地投资与经营的便利。我们当然清楚，战后重建仍离不开德国的资金与技术，但中国的市场也不应永远只是外国资本获取利润的场所。"
 league_qi.9.a: "中国的市场，也该有中国人的位置"

 league_qi.10.t: "幕后的联帅"
 league_qi.10.d: "在反赤救国大联合的推动下，知识界领袖丁文江逐渐走上政治舞台。他所代表的科学精神、行政改革与民治主张，为统一后的南京政府提供了崭新的政治旗帜。经过一番协商，齐燮元决定退居幕后，支持丁文江出任总统。就职典礼上，五色国旗高高飘扬，报刊纷纷宣称中国即将迎来文人政治的新纪元，仿佛那个依靠枪杆子建立起来的军人政府，终于愿意将国家交还给知识与制度。​\n\n然而，南京的权力格局并未因此发生根本改变。军队依旧忠于齐燮元的旧部，政府中的关键职位仍由联帅的亲信把持，而重大军政决策也依然需要经过他的首肯。丁文江可以主持会议、发表演说、签署法令，并以共和国总统的身份向全国宣示改革的决心；但当他的主张触及军政集团的根本利益时，真正能够决定政策去向的，仍是退居幕后的齐燮元。总统府换了主人，共和国的门面焕然一新，而支撑这个国家运转的权力机器，却依旧按照旧日的方式运作。​\n\n对于齐燮元而言，这无疑是一场精心安排的政治转型。他既能借助知识分子的声望为政府争取合法性，又不必真正放弃自己苦心经营多年的权力。丁文江所领导的政府或许能够推行部分改革，但其施政的边界，终究取决于幕后联帅的容忍。中国终于拥有了一位文人总统，却仍未真正摆脱将军的影子。共和的旗帜已经升起，而旗帜之下，旧时代的权力依然牢牢盘踞。"
 league_qi.10.a: "总统执政，联帅掌舵"

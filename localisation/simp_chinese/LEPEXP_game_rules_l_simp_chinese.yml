l_simp_chinese:
 LEP_PATH: "£KR_game_rule_flag_LEP  东南半壁"
 RULE_OPTION_LEP_PATH_RANDOM: "默认"
 RULE_OPTION_LEP_PATH_RANDOM_DESC: "孙传芳留下的八省联合正站在岔路口。南京的议会与各省的督军各执一词，军人、文官与商界都在争夺这个国家未来的定义权——在有人真正做出决断之前，没有人知道它会走向何方。"
 RULE_OPTION_LEP_PATH_QI: "£KR_game_rule_flag_LEP  联帅的军政府"
 RULE_OPTION_LEP_PATH_QI_DESC: "齐燮元以联帅之姿总揽大权，议会与选举被束之高阁，军令成为国家唯一的支点。"
 RULE_OPTION_LEP_PATH_DSP: "£KR_game_rule_flag_LEP  民主科学社点燃启蒙之光"
 RULE_OPTION_LEP_PATH_DSP_DESC: "自治同志会改组为民主科学社，主张以专家政治与渐进改革重建国家秩序。"
 RULE_OPTION_LEP_PATH_JGH: "£KR_game_rule_flag_LEP  人民救国会带来变革之风"
 RULE_OPTION_LEP_PATH_JGH_DESC: "国家团结联盟由人民救国会主导，推行进步改革与社会立法，把政治的重心移向城市与劳工。"
 RULE_OPTION_LEP_PATH_JXH: "£KR_game_rule_flag_LEP  景星会开启稳健之治"
 RULE_OPTION_LEP_PATH_JXH_DESC: "国家团结联盟由景星会主导，以秩序、稳定与传统价值为纲，主张一个强而有力的中央。"
 RULE_OPTION_LEP_PATH_JNSB: "£KR_game_rule_flag_LEP  工商勇进党取得多数"
 RULE_OPTION_LEP_PATH_JNSB_DESC: "江南商帮改组为工商勇进党，民族资本与银行金融界成为政府的中坚，工商立国成为国策。"
 RULE_OPTION_LEP_PATH_ZXX: "£KR_game_rule_flag_LEP  国民党携炬而行"
 RULE_OPTION_LEP_PATH_ZXX_DESC: "政学系改组为国民党，承袭北洋国会传统，以议会政治与宪政为纲领。"

 market_liberal_oligarchic_liberalism_subtype: "寡头自由主义"
 market_liberal_oligarchic_liberalism_subtype_desc: "§Y寡头自由主义§!\n\n§L“你们选出的代表所欠于你们的，不只是勤勉，还有他的判断。”\n——埃德蒙·柏克§!\n\n§!§g寡头自由主义并不否认议会、法院与新闻自由的价值，但它从不相信这些制度能够自行运转。在它看来，一个刚从帝制与军阀混战中脱身的国家，既没有成熟的中产阶层，也没有可资依靠的公众舆论，能担起重建之责的只有少数受过教育、握有实权、又彼此熟识的人——军政领袖、实业巨子与学者官僚结成的小圈子。这些人应当把议会与选举保留下来，同时认定被选出来的人有权凭自己的判断行事，而不必事事听从选民的吩咐；重大决策实际上收拢于少数人的密室，公开的代议程序则用来给它盖上一枚体面的印章。他们应当维护私有产权与自由贸易，却不必容许工会与街头政治坐大。它因此常被讥为有钱人的自由主义，而它自己的答复是：秩序先于参与，成效先于程序。§!"
 social_liberal_liberal_technocracy_subtype: "自由技术官僚主义"
 social_liberal_liberal_technocracy_subtype_desc: "§Y自由技术官僚主义§!\n\n§L“知识是为了预见，预见是为了行动。”\n——奥古斯特·孔德§!\n\n§!§g自由技术官僚主义出自一个近乎天真的信念：国家的病症是技术性的，因而可以用技术手段治愈。它主张把受过现代教育的工程师、统计学家、法学家与医师送上决策岗位，以调查、统计和试点取代口号与动员，以预算表与工程图取代主义之争。在它的构想里，政府应当像一座运转良好的工厂——规章明晰、权责分明、升迁凭绩。它愿意让民众投票，却更愿意让专家执政；它不反对民主，只是始终认为民主需要由专业知识来校准。批评者说它把政治问题化约为管理问题，它并不否认，反而视之为美德。§!"
 social_conservative_free_market_conservatism_subtype: "自由市场保守主义"
 social_conservative_free_market_conservatism_subtype_desc: "§Y自由市场保守主义§!\n\n§L“习兵战不如习商战。”\n——郑观应§!\n\n§!§g自由市场保守主义是民族工商业者的政治自觉。它相信一国的国力争衡，最终落在工厂的烟囱与银行的账簿上，因而要求政府减税、稳币、护关税，为民间资本留下喘息与扩张的余地。它对国有化和计划经济抱有本能的敌意，对罢工与激进的劳工运动同样如此——在它看来，二者都会吓跑资本、断送刚刚起步的工业。社会风俗上它是守旧的，赞成家法、乡绅与既有的尊卑秩序；政治上它不谋求改造社会，只希望不再有人来打扰它的经营。它未必受人爱戴，却往往是乱世之中最早恢复元气的那一部分。§!"
 LEP_scientific_public_administration_tt: "§l我们将转为§l自由技术官僚主义§!意识形态§!"

 KUM_revolt_against_bonus_idea: "讨伐哈密"
 KUM_revolt_against_bonus_idea_desc: "在一系列令人惊讶万分甚至摸不着头脑的事件之后，哈密政府统一了中国。这场为统一中国而进行的血腥权力斗争无疑代价高昂，而最后哈密终于成功逐鹿。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"
 LEC_revolt_against_bonus_idea: "讨伐使馆城市"
 LEC_revolt_against_bonus_idea_desc: "国际委任政府在全中国建立起来，震惊了一众看客，许多中国人恐惧万分。前所未有的转折震惊了全球，而委任政府正在收集获得的战利品。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"
 LEP_revolt_against_bonus_idea: "讨伐宁系"
 LEP_revolt_against_bonus_idea_desc: "经历了八省联合的四分五裂后，南北两京终于统一在一面旗帜之下，宁系统一了中国。这场为统一中国而进行的血腥权力斗争无疑代价高昂，但看来德国人将牢牢掌控住中国。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"
 MAN_revolt_against_bonus_idea: "讨伐满洲"
 MAN_revolt_against_bonus_idea_desc: "在其宗主国的坚定支持下，满洲政府现在接管了中国，打碎了中国统一的全部希望。而国内外舆论一片哗然，人人纷纷争论这个改头换面的中国是否还能算是中国。\n\n但无论如何，满洲政府还是在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"
 QIE_manchu_revolt_against_bonus_idea: "讨伐大清"
 QIE_manchu_revolt_against_bonus_idea_desc: "在政变推翻自己的恩主直系军阀后，爱新觉罗宗室成功克服无数艰难险阻，保住了自己的天命。自辛亥革命以来，皇帝再次将中国统一在自己的御座之下。虽然清政府一直是逐鹿中国的热门人选，但他们还是遇到了无数阻碍并将它们一一克服，直到面前再无挑战者为止。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"
 QIE_zhili_revolt_against_bonus_idea: "讨伐直系"
 QIE_zhili_revolt_against_bonus_idea_desc: "直系军阀成功克服无数艰难险阻，按照自己的愿景统一了中国，玉帅终于将中国统一在自己的掌控之中。虽然直系一直是逐鹿中国的热门人选，但他们还是遇到了无数阻碍并将它们一一克服，直到面前再无挑战者为止。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"

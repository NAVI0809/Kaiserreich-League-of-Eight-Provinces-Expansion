 china_army_decisions_desc: "中国军队和分离主义地区长期深陷追赶西方标准的泥潭中：兵源大多是土匪、罪犯和穷人，士兵出了名的缺乏训练、管理混乱；装备更是万国造，大多都很落后，甚至就是彻彻底底的老古董；士兵大多只忠于军官，甚至就是只想当兵吃粮，就算偶尔有点思想上的动力，充其量也就是转瞬即逝。如果要按照现代化标准重建军队，我们就要付出巨大的努力。\n"
 china_army_reform: "军事改革"
 china_army_reform_desc: "内外交困的清廷出于自保的需要允许了地方拥军，这些军队在经历近代风雨的洗礼后形成了现在的军阀部队。中国军阀和地方分离派的部队是天然的封建部队，它们由某些地方豪强带领，为某个军头服务。我们的军队就和军阀的部队一样素质低下，军官除了中饱私囊外一无所知。要想成就大业，就不能止步于此。"
 china_lessons_of_war: "战争之诫"
 china_lessons_of_war_desc: "长久的作战教会了我们如何去打一场现代战争。我们的军队迫切地需要一场结构性改革，让我们的军队与时俱进，历久弥新。"
 CHN_cleanse_army_corruption_decision: "肃清军队腐败"
 CHN_cleanse_army_corruption_decision_desc: "历史上中国军队的军饷一直比较低，但“积极主动”的士兵总能找到其他的“补贴手段”：向黑市倒卖军资；招募儿童和亲属充当无需军饷的士兵；收受士兵贿赂后给予特殊照顾；敲诈勒索、收保护费；甚至直接偷窃平民财物等，这些还只是致富手段的冰山一角。军官们也常常从中截流，甚至带头从事上述行为。虽然我们已经进行了改革，但由于规模快速扩张，军队中的腐败还是愈演愈烈，这是我们不能容忍的，必须大力缉拿军队中那些腐败的骗子，保证人员物资顺利抵达目的地，从而维护我军的声誉。"
 CHN_reorganise_military_units_decision: "部队整编"
 CHN_reorganise_military_units_decision_desc: "在统一之路上，我军各有损失，由于战损和逃兵等原因，许多较老的部队严重缺编；而由于接收了敌方逃兵，或者被临时补员过，一些部队的规模又大到难以管理；甚至还有部队尚未组建完成就被紧急推上了前线。目前，我军部队质量均大幅下降，老兵和新兵分布不均，且尚未出台整编计划。刀用久了会钝，需要磨砺，军队也是一样，我们需要将急需休整的部队轮转到后方，通过自上而下的精心计划，在不留漏洞的前提下尽量减轻后勤压力。"
 CHN_disband_unreliable_units_decision: "解散不可靠部队"
 CHN_disband_unreliable_units_decision_desc: "我军现在俨然一个杂戏班，是一个编制各异、质量参差不齐、起源也各不相同的部队集合。他们看上去宛如各色部队的大展台，丝毫没有统一的、纪律严明的新政府象征。尽管某些精锐而忠诚的队伍武器精良、穿戴整齐，但其在数量上和那些打家劫舍、频繁出现逃兵的前军阀与前土匪部队比起来不过凤毛麟角。更糟糕的是，有些单位仅仅存在于纸面上——这些空壳部队远在不断膨胀的名册里数不胜数，而即使真的存在，也只剩几个光杆司令。\n\n虽然都说人多力量大，但有时候人越多，整体的质量就越落后。精锐部队不相信非精锐部队能守好自己的侧翼，而更理想主义的士兵则会因目睹所谓“同志”对人民的暴行后便会垂头丧气。这些问题也随着我们吸收敌方投诚士兵而变得愈发严重。不过，遣散这些军队并解除他们的武装并不是一件简单的事，这势必会导致许多人倒打一耙，说我们偏袒某一方；部分审计人员也可能因此生出腐败问题；同时，许多人还会批判我们把政治伎俩置于国家团结之上。"
 CHN_purge_disloyal_officers_decision: "清洗不忠军官"
 CHN_purge_disloyal_officers_decision_desc: "随着敌军开始瓦解，许多曾经的敌人都开始向我们投诚，有时还出现了成建制改换军服的情况。不幸的是，在军阀混战中的中国及周边地区，这就是许多人军旅生涯中不断经历的现实。而实际上，不少人只是对眼下的胜利沾沾自喜，却忽视了其可能对于军队未来构成的威胁。多数投诚军官并非我们事业的忠实拥趸，他们只是希望保住自己先前的特权和地位；而有些军官则近乎叛逆，根本不接受我军忠诚军官对其进行的整编调遣。\n\n我们由此决定在军事系统病入膏肓之前先下手为强，譬如要对恶劣典型杀鸡儆猴，同时在未来征募工作中筛选新兵的忠诚。当然，在中国，被解职的军官往往会带着他们的一众参谋和部下士兵，带着部队里的枪支直接离开。有很多人担心这些人会落草为寇，而我们也必须对此格外警惕。"
 CHN_enforce_military_discipline_KMT_decision: "整肃军纪"
 CHN_enforce_military_discipline_KMT_decision_desc: "在中国，士绅等精英阶层的子弟长期将从军视为最末流的选择，传统上，优秀的青年应当通过科举进入文官系统。即使在军阀混战最激烈的时期，受过教育的人群也对投身行伍十分不齿，因为在刻板印象中，军队官兵不过是一群盗匪、刽子手和恶霸。\n\n这种偏见如今成为了现实：我们的部队沉醉于胜利和权力，令人不安的是，连最可靠的部队也频繁传来劫掠和私刑的报告。整肃军纪肯定不受欢迎，但要想维护军队形象，就需要重申政府的权威。我们将惩治一部分人以儆效尤，并掩盖其他的丑闻，短时间内，这两项措施都会损害我们的合法性，但长痛终归不如短痛。"
 CHN_insist_on_civilian_control_UPC_decision: "坚持文官掌军"
 CHN_insist_on_civilian_control_UPC_decision_desc: "历史上，中国长期重文轻武，儒家士大夫以牢牢掌握军权为荣。晚清北洋时期，清廷的衰落和军阀时代的混乱使得军队脱离了文官政府的掌控，更糟糕的是，军政和民政之间的界限常常模糊不清，军人直接插手民政，文官则通过军职来维持权力与合法性。如果要摆脱“军阀部队”的名头，就要借助政府的力量约束军官，即便这可能在短期内引发冲突。"
 china_poor_officers_fixed_text: "由于军饷增加、士气提高和军队各方面能力的巨大提升，逃兵数量有所减少。吃空饷的情况正渐渐消失，但要完全消灭这一现象还需要进行相当多的改革。如果军官靠战功，而不是靠恩荫和裙带关系升迁，就能建立协调而有效的指挥结构。"
 china_poor_army_3_officers: "军阀时代的不足"
 china_poor_army_3_officers_desc: "尽管说法各异，但从来没有出现过一支真正的“中国军队”。恰恰相反，军队是去中心化的，还不甚正规，内部派系林立，各路军阀和地方分离势力在数十年的冲突中杂乱无章地、半独立地发展；大部分主要势力都是地区性的，他们的军队臃肿，装备维护不善，各势力间即使不是完全互相敌视，彼此间也不信任；腐败无处不在；军队的后勤大多仅仅依靠苦力和马拉火车，辅以对周边村庄的定期劫掠；虽然少数部队可达西方水准，但大部分部队并不能，而更像是土匪强盗和其他犯罪分子组成的团伙。即使是在和平时期，一经听闻军队来临，当地百姓即四散奔逃，以免受劫掠及虐待。"
 china_poor_army_3: "军阀时代的不足"
 china_poor_army_3_desc: "尽管说法各异，但从来没有出现过一支真正的“中国军队”。恰恰相反，军队是去中心化的，还不甚正规，内部派系林立，各路人马在数十年的冲突中杂乱无章地发展；大部分主要势力都是地区性的，他们的军队臃肿，装备维护不善，各势力间即使不是完全互相敌视，彼此间也不信任；腐败无处不在；军队的后勤大多仅仅依靠苦力和马拉火车，辅以对周边村庄的定期劫掠。\n\n$china_poor_officers_fixed_text$\n\n虽然少数部队可达西方水准，但大部分部队并不能，而更像是土匪强盗和其他犯罪分子组成的团伙。即使是在和平时期，一经听闻军队来临，当地百姓即四散奔逃，以免受劫掠及虐待。"
 china_poor_army_2_officers: "制度性军事短板"
 china_poor_army_2_officers_desc: "针对军事体制的改革迈出了第一步，为解决腐败问题和困扰军中已久的各种陋习，建立集权化的官僚机构和适配军队的后勤体系已提上日程，这也将为后续的改革奠定基础，有朝一日建立真正的中国军队。新的补给和发饷制度比以前更可靠，这能减少部队逃亡率，降低士兵掠夺的欲望，并与当地老百姓建立信任关系，目前新制度中仍有挪用军饷和盗窃的现象，但如果不打碎几个鸡蛋，就没法做蛋花汤。"
 china_poor_army_2: "制度性军事短板"
 china_poor_army_2_desc: "针对军事体制的改革迈出了第一步，为解决腐败问题和困扰军中已久的各种陋习，建立集权化的官僚机构和适配军队的后勤体系已提上日程，这也将为后续的改革奠定基础，有朝一日建立真正的中国军队。\n\n$china_poor_officers_fixed_text$\n\n新的补给和发饷制度比以前更可靠，这能减少部队逃亡率，降低士兵掠夺的欲望，并与当地老百姓建立信任关系，目前新制度中仍有挪用军饷和盗窃的现象，但如果不打碎几个鸡蛋，就没法做蛋花汤。"
 china_poor_army_1_officers: "军事改革进行中"
 china_poor_army_1_officers_desc: "军队正在稳步改革，虽然也并非一帆风顺。我们已经开始重组地方化单位并打破更加广泛的恩庇网络这一艰巨的工作。我们开始重新分配指挥名册，但愿这些并非八面玲珑的新军官能够少一些公开的腐败。尽管有些人认为步子迈得太大了，但我们同时也在改革训练和征召的体制。虽然单位的质量还是层次不齐，但是基层部队的水准已经远远高于那些被我们踢出队伍的酒囊饭袋了。"
 china_poor_army_1: "军事改革进行中"
 china_poor_army_1_desc: "军队正在稳步改革，虽然也并非一帆风顺。我们已经开始重组地方化单位并打破更加广泛的恩庇网络这一艰巨的工作。我们开始重新分配指挥名册，但愿这些并非八面玲珑的新军官能够少一些公开的腐败。\n\n$china_poor_officers_fixed_text$\n\n尽管有些人认为步子迈得太大了，但我们同时也在改革训练和征召的体制。虽然单位的质量还是层次不齐，但是基层部队的水准已经远远高于那些被我们踢出队伍的酒囊饭袋了。"
 china_poor_army_0: "已完成军事改革"
 china_poor_army_0_desc: "军队比起几年前的混乱来说，已经取得了长足的进步。多亏了我们的不懈努力以及在战场上积累的经验，我们的核心单位已经走在了现代化的最前沿；更重要的是，我们从忽视装备的配给慢慢进步到了配发更加专业的装备，这同样铸就了他们的成功。\n\n$china_poor_officers_fixed_text$\n\n虽然我们不能说我们麾下所有的军队，甚至盟友和整编来的军队都达到了这个水准，但为了捍卫中国利益而建立一支全新的、现代化的、统一的中国军队的道路已经完全明晰了。"
 CHN_activate_military_disarray_normal_tt: "§R我们已经尽可能减少快速扩张军队所带来的阵痛，但也无法进一步遏制这种影响，必须直接采取行动解决军队中日益严重的问题。§!"
 CHN_activate_military_disarray_early_warning_tt: "§R我们将主动扩大军队规模，进一步拓宽提升军队实力的途径，但也会因此背上扩军所带来的负担，我们需要提前采取措施加以应对。§!"
 CHN_activate_military_disarray_no_additional_level_warning_tt: "§R由于未能进一步消除困扰我军的混乱局面，士气现已一落千丈，唯一足以自我安慰的便是情况不可能变得更糟了。§!"
 CHN_activate_military_disarray_additional_level_warning_tt: "§R我们先前扩大军队规模的努力，虽然不能完全避免国家解放自然带来的素质下降，但这有助于减轻我们迅速扩军带来的影响。§!"
 CHN_military_disarray_idea1: "军队混乱"
 CHN_military_disarray_idea1_desc: "我军战士在迈向统一的进军中作战英勇，并在战场上取得了巨大的成功，但由于吸收了成千上万的投诚兵、志愿兵，缴获了大批敌军武器，国民革命军已经变得极其臃肿。但是与此同时，许多曾经的精锐部队已经消耗殆尽，其中一些已经只剩下纸面上的番号了。由于北伐带来的后勤混乱，这些精锐要么被推迟整补，要么就是用于补充的兵力物资被用于别处了。\n\n腐败如附骨之疽蔓延到全军，几乎成为一种无法根除的制度性现象。如果不想让国民革命军变成蹒跚老人，唯一现实的方案就是全军暂时复员，然后逐师整编部队。这是一项艰巨的任务，阻力应该也会很大，尤其是来自军阀部队的阻力，因为他们会是最先受到遣散命令冲击的。"
 CHN_military_disarray_idea2: "军队编遣中"
 CHN_military_disarray_idea2_desc: "军队的编遣工作取得了一些进展，但问题仍然存在：许多来自地方军阀的指挥官拒绝执行我们的遣散命令，担心我们在编遣工作中会首先牺牲他们的权力；其他一些人则害怕编遣会让他们的防区守备力量不足，或者在犹豫是否要将有着多年战友情的部队拆散开来。\n\n尽管如此，我军还是缓慢地逐团、逐旅，乃至逐师重组为能战的劲旅。前线已经巩固，更稳定的后勤链得以建立，这稍许平息了对我军现状中一些紧迫问题的担忧。然而时间紧迫，国民革命军可能很快就要再次投入战争，保家卫国。"
 CHN_military_disarray_idea3: "军队编遣完成"
 CHN_military_disarray_idea3_desc: "在第二次北伐战争中，军队秋风扫落叶一般的胜利掩饰了军中一个日益严重的问题：后勤十分落后，而且部队像军阀部队一样过于臃肿。最高司令部经过彻底讨论，认为我们别无选择，因此下令全军复员进行编遣。\n\n这是一个痛苦的过程，但最糟糕的时刻似乎已经过去了，大多数精锐师已经完全恢复，在战争中训练出来的，或者收编的师也已经融入了队伍。在军和集团军层面上，国民革命军仍然存在许多指挥和控制方面的问题，但这也可以说是近来扩军导致的必要之痛。不过，我们必须继续保持警惕——在继续走向国家统一的大道上，这支革命先锋队还有相当多的基础内容需要补课。"
 CHN_activate_economic_devastation_normal_tt: "§R我们已经尽可能解决各地经济混乱的问题，但我们无法承受快速扩张所造成的日益严重的金融衰退。政府必须采取直接行动稳定国民经济。§!"
 CHN_activate_economic_devastation_early_warning_tt: "§R我们将主动采取措施，以扭转我国经济颓势，并进一步拓宽改善工商业的途径，在扩大经济规模的同时，增强经济的韧性。§!"
 CHN_activate_economic_devastation_no_additional_level_warning_tt: "§R由于未能进一步消除困扰国民经济的混乱局面，人们对政府能够稳定财政的信心现已一落千丈，唯一足以自我安慰的便是情况不可能变得更糟了。§!"
 CHN_activate_economic_devastation_additional_level_warning_tt: "§R我们先前改革经济的努力，虽然不能完全避免财政混乱，但也有助于减轻大量地区重新纳入国家体系所带来的经济冲击。§!"
 CHN_devastated_national_econ_idea: "崩溃的国民经济"
 CHN_devastated_national_econ_idea_desc: "中国曾是世界上最富裕的国家，是繁荣贸易和精湛工艺的中心。腐朽衰败、闭关锁国的清廷导致我们的前人错过了工业革命，因此这个强大的国家注定要经历百年国耻。由于未能实现现代化并赶上外国势力，中国在工业生产方面已经远远落后了。过度依赖外资进行工业化，又导致创造的利润大部分被外国人攫取，他们利用有利地位从一个个争吵不休、腐败无能的中国领导人手里拿到了特权和租界。与此同时，农村依然不平等且落后，机械化和生产力水平都很低，仍以人力劳作为主。\n\n在最近的战争压力下，国民经济又被迫承担了军队开拔、横征暴敛和战争破坏所带来的负担，这一体系现已彻底崩溃。外国投资者纷纷撤资，贸易中断，盗匪横行，我们治下大片领土正面临饥荒。许多人质疑我们的政府是否有能力支撑其发行的货币信誉以应对日益加剧的危机，我们必须尽快让一切重回正轨。"
 CHN_devastated_national_econ2_idea: "受损的国民经济"
 CHN_devastated_national_econ2_idea_desc: "尽管[ROOT.GetAdjective]的经济有所复苏，但问题仍然一桩接一桩。前政府的债权人如苍蝇般被现政府的稳定征象吸引来，纷纷要求我们履行偿债义务。然而，我们的真实偿债能力仍不稳定，许多人仍然怀疑现政权能否长寿，并拒用我们的货币。我们必须尽快开工——我国军队、政府与恩庇网都需要资金来运作。我们多拖延一分，风险就增加一点。\n\n我们的回旋余地要比西方国家要小得多。在经历了百年国耻之后，中国的农业和工业现代化程度很低，经济十分脆弱。高度依赖外资，缺乏政治稳定，军阀时代导致的严重社会政治腐败，这一切都让我们深受其害。最近的战争又给受我们治下的领土带来了巨大的经济压力。尽管我们已经避免了最糟的危机，但控制通货膨胀、让工人、商人和农民恢复工作仍是当务之急。饥荒的恐慌已经大大缓解，但仍有许多人处于饥饿状态，有一些地区仍面临着危机加剧的风险。在我们宣布一切重回正轨之前，还有很多事情要做。"
 CHN_devastated_national_econ3_idea: "动荡的国民经济"
 CHN_devastated_national_econ3_idea_desc: "百年国耻让中国饱受摧残，国民经济完全无法承受军阀混战所造成的混乱。尽管如此，事实证明中国展现出了比预期更强的韧性，并且国家的部分地区已经在慢慢恢复活力。随着经济复苏，越来越多的人开始接受我们政府继续执政，人们重拾起了自己的生计，城市和工厂里重新响起了轻微的轰鸣声。虽然我们的核心统治地区生产力已经基本恢复正常，但最近被我们占领的地区仍然处于极度困难的境地。我们正努力整合被破坏的经济系统，即使我们完成了这些工作，若想真正带领中国迈向未来，我们还需要更进一步的努力。"
 CHN_national_illiteracy1_idea: "国民文盲"
 CHN_national_illiteracy1_idea_desc: "尽管各政治派别持续呼吁改革以解决这一问题，但文盲现象仍普遍存在于全国各地。对许多人来说，文盲已经成为中国“落后”的象征，尤其是在农村地区，那里的图书、教师和校舍资源仍然有限，逃学也很普遍。许多人认为（在某种程度上是正确的）课程过时且不实用，他们更愿意在家里的农田或作坊里帮工，或在其他地方学习更实用的技能。许多人根本无法读完义务教育，更不用说读完高中了。对于那些少数有幸上大学的人来说，许多人都担心自己是否能在这个剧烈波动（往往变得更糟）的经济中找到一份工作。我们不可能在短时间内解决所有这些问题，但我们至少可以解决其中最糟糕的部分。"
 SHX_disrupted_economy_idea1: "经济动荡"
 SHX_disrupted_economy_idea1_desc: "我们需要迅速采取措施，避免经济崩盘！"
 SHX_disrupted_economy_idea2: "经济逐渐恢复"
 SHX_disrupted_economy_idea2_desc: ""
 SHX_disrupted_economy_idea3: "经济逐渐稳定"
 SHX_disrupted_economy_idea3_desc: "经过数月的辛苦工作，我省经济形势大为好转。虽然维持黄金储备和支撑货币币值的任务依旧伤人脑筋，但我省印发的货币已获得一定弹性，并被省内绝大多数人所接受。我省曾身临破产边缘，但现在，我们已向世界证明了自己财政之稳健。只要再努力一把，我省经济便能马上重焕生机。"
 CHN_an_army_in_transition_idea: "转型中的军队"
 CHN_an_army_in_transition_idea_desc: "军队改革是一个经年累月的过程，常会因为先前的军改计划而变得更加复杂，这些计划有些可以保留，有些需要重新设计，有些则需要彻底废除，以便为进步让路。我们在当前道路上已经取得了一些进展，但军方高层现已决定转向另一条道路，这将同时带来一些后果。"
 china_northern_school: "北派学说"
 KR_northern_school: "军械与正统学说"
 china_northern_school_desc: "§L中国北方的军阀大多毕业于宣统时期保定、天津创办的军校，他们代表了老一代军官中的精英。这些军人接受着普鲁士风格的军事教育、主要在华北平原作战。该派的指挥风格更注重阵地战和训练有素的军队；尤其是火炮。§!"
 china_southern_school: "南派学说"
 KR_southern_school: "人海与机动学说"
 china_southern_school_desc: "§L缺乏北方军阀的军械资源、主战场又分布于南方绵延起伏的群山中——这些条件造就了中国南方军阀强调人数与机动作战的战术风格。劫袭速战、善抓时机，重型火炮在这些军人的眼里还赛不过一尊简陋的山炮。§!"
 china_green_forest_school: "绿林学说"
 KR_green_forest_school: "恢复与征召学说"
 china_green_forest_school_desc: "§L一些中国军阀没受过什么军事教育，他们称自己上的是“绿林大学”。这些绿林出身的前土匪（有时也会重操旧业）虽然不懂什么高级的战略战术，但却在摸爬滚打中摸索出一种独一无二战法——即使在最危急的关头也能保障全军的灵活性和弹性。有人可能会说他们的战法太过粗糙，甚至野蛮残暴，但也不得不承认其行之有效。§!"

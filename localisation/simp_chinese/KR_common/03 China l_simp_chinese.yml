 china_events.70.t: "双十国庆"
 china_events.70.d.zhili_monarchy: "我国已有数千载之历史。两千年来，中国一直是亚洲的中心，无数小国仰慕其文明之光。然而，这个曾欲传承万世的帝国在上个世纪却陷入了剧烈动荡。我大清虽然将中国的疆域扩张到了新的高度，但欧洲帝国主义的侵略却使帝国坠入前所未有的低谷。更糟糕的是，冥顽不灵的日本人在甲午战争中给予我朝沉重打击。神器倾覆之际，中国人民对帝制丧失了信心。\n\n1911年10月10日，这一天永远地改变了我国的命运。驻武昌新军中的革命党人发动叛乱反抗满清统治，辛亥革命由此爆发。革命浪潮席卷南方，而北方则在钦差大臣袁世凯的掌控下继续忠于清朝。然而，洞悉时势的袁世凯同意废黜幼帝溥仪，以换取大总统之位。起初，袁世凯被迫与革命者妥协，但他巧妙地将其边缘化，并不断扩张北洋系的势力。然而，他的复辟野心最终适得其反，引发了新的军阀混战时代。\n\n北伐失败后，分裂的时代宣告结束。吴佩孚、曹锟、孙传芳三位大帅为神州大地带来了和平，以宽仁之举迎回皇帝，开启了和平的新纪元。然而，1936年直系秩序崩溃，地方战乱再次爆发。尽管如此，朝廷和直系依然屹立不倒。虽然有人将10月10日视为军阀混战的开端，但它也提醒着玉帅和溥仪陛下，辛亥革命是永载史册的重要事件，其经验教训将继续指引我们迈向即将到来的现代盛世。"
 china_events.70.d.other_monarchy: "我国已有数千载之历史。两千年来，中国一直是亚洲的中心，无数小国仰慕其文明之光。然而，这个曾欲传承万世的帝国在上个世纪却陷入了剧烈动荡。我大清虽然将中国的疆域扩张到了新的高度，但欧洲帝国主义的侵略却使帝国坠入前所未有的低谷。更糟糕的是，冥顽不灵的日本人在甲午战争中给予我朝沉重打击。神器倾覆之际，中国人民对帝制丧失了信心。\n\n1911年10月10日，这一天永远地改变了我国的命运。驻武昌新军中的革命党人发动叛乱反抗满清统治，辛亥革命由此爆发。革命浪潮席卷南方，而北方则在钦差大臣袁世凯的掌控下继续忠于清朝。然而，袁世凯竟然背信弃义，同意废黜溥仪陛下以换取大总统之位。惯于投机的袁世凯甚至另立新朝，愚不可及地加冕称帝！\n\n此僭越伪帝未能获得中国人民的支持，其伪朝尚未稳固便告覆灭。袁世凯的自私行径导致了军阀混战，各路共和派为争夺权力而内斗不休，直到直系带来了十年和平。曹锟和吴佩孚深知帝制的稳定作用，因此拥立溥仪陛下重登大宝。然而，这些军人只想利用皇帝谋取私利，他们自欺欺人的霸权仅仅维持了十年便宣告终结。\n\n随着直系蠢材被扫进历史的垃圾堆，重生的帝国开始着手治理这个饱受共和主义和帝国主义毒害的国家。10月10日不过是消除外患的虚假承诺，唯有大清能效光武而法王道，中兴华夏！"
 china_events.70.d.kuomintang_republic: "1644年，皇明沦陷，神州陆沉。汉奸吴三桂引清兵入关，使汉人为奴数百年。但中华人民从未忘记过自由之时。在19世纪末和20世纪前十年，无数梦想着摆脱满清封建统治的中国爱国志士们都在秣马厉兵，准备共图大业，“反清复明”。\n\n1911年10月10日，汉族人民身上的枷锁终于被打破了。驻扎在武昌的北洋新军中的革命党人以无比的勇气奋起反抗满清统治，发动了辛亥革命。这次革命历时一年才最终实现目标，最终在钦差大臣袁世凯和临时大总统孙中山的合作下推翻了清廷。然而，我们愚蠢地选择信任袁世凯。1913年，他暗杀了宋教仁同志，甚至试图称帝。而袁世凯死后，辛亥之理想依然遭到了北洋政府的持续玷污。\n\n在革命根据地广州，孙中山和他在国民党内值得信赖的追随者们深知，必须以雷霆手段推翻劣迹斑斑的北洋政府。1926年，国民党开始北伐以图彻底消灭北洋政府。然而，德国侵略者倾巢而出，残忍地绞杀了国民革命，让北洋政府得以苟延残喘。\n\n尽管经历了数十年的挫折，但国民党始终没有忘记辛亥革命的梦想，而是在努力建立一个全新的民国，一个摆脱了北洋政府之封建反动弊病的民国。我们的国家将摆脱外国剥削，摆脱军阀压迫，摆脱自由主义的失败！双十节将不再代表北洋军阀的专制统治，而是代表着一个铭记孙中山先生及其三民主义，青天白日照耀下的新时代！"
 china_events.70.d.other_republic: "1644年，皇明沦陷，神州陆沉。汉奸吴三桂引清兵入关，使汉人为奴数百年。但中华人民从未忘记过自由之时。在19世纪末和20世纪前十年，无数梦想着摆脱满清封建统治的中国爱国志士们都在秣马厉兵，准备共图大业，“反清复明”。\n\n1911年10月10日，汉族人民身上的枷锁终于被打破了。驻扎在武昌的北洋新军中的革命党人以无比的勇气奋起反抗满清统治，发动了辛亥革命。这次革命历时一年才最终实现目标，最终在钦差大臣袁世凯和临时大总统孙中山的合作下推翻了清廷。然而令人痛心的是，民国自诞生之初便饱受分裂之苦。袁世凯倒行逆施，刺杀了合法当选的宋教仁，将民国变成了他自己的独裁政权。\n\n1915年，袁世凯变本加厉自立为洪宪皇帝。以蔡锷为首的共和志士在云南发动护国战争，重举革命旗帜，终使民国法统重光。袁世凯猝然离世后，民国陷入南北分裂，广州和北京分别建立了对立政府。广州政府在北伐战争中垮台后，直系主导的统一结束了南北分裂，但十年和平在1936年戛然而止，战火硝烟再度弥漫。尽管民国并非完美无缺，但双十节提醒我们，决不能辜负辛亥革命的理想。"
 china_events.70.a: "中华民国万岁！"
 china_events.70.b: "中华民国万岁……"
 china_events.70.c: "再别提什么双十了！"

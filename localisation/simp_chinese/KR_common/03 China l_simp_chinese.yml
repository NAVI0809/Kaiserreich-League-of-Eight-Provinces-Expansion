 china_events.3500.t: "崭新的中国革命"
 china_events.3500.d: "恐怕鲜有人会相信国民党革命不仅会在中国卷土重来，而且还能取得胜利；更没有人会相信，这场革命最终竟会导致国民党中央委员会土崩瓦解。一场崭新的革命自废墟中重生；而这一切都出自中国当下胆识过人的国民革命领袖：谭平山主席之手。\n\n作为临时行动委员会的创始成员和中国工团党的早期成员，谭平山的本土社会主义思想正面临迄今为止最大的难题：“中国本土社会主义革命应当采取何种形式？”"
 china_events.3500.a: "革命将走向何方？"
 china_events.3610.t: "亲德桂系军阀统一中国"
 china_events.3610.d: "长久以来，广西不过被认为是姊妹省广东的附庸，且似乎甘愿偏安于西南一隅。因此鲜有人能料到，逐鹿中原的最后赢家竟是旧桂系军阀。曾由陆荣廷领导的旧桂系已成功冲出大本营，深入北方腹地。\n\n在成功推翻陆荣廷钦点的接班人后，沈鸿英终于登上了国家的最高权力巅峰；由于年老体衰，许多人认为沈大帅已经时日无多，他的盟友们正在准备为自己夺取高官厚禄。"
 china_events.3610.a: "沈大帅之体魄日衰，令人忧虑……"

 china_dense_rural_infrastructure: "人口稠密的乡村地区"
 china_dense_rural_infrastructure_desc: "该地区因人口稠密，基础设施网络已经高度饱和。\n\n可通过在该地区达到最高等级的§Y$infrastructure$§!以移除。"
 CHN_autonomous_region_modifier: "自治区"
 CHN_autonomous_region_modifier_desc: "清朝对边疆的控制方式是一个复杂的问题，控制的力度也时好时坏。这些位于北方和西方的领土被中国人称为“藩部”，西方观察家则称之为“中属鞑靼利亚”，由宣誓效忠皇帝的部落、氏族和边境驻军组成。随着中国民族主义的发展和辛亥革命的爆发，如何对待少数民族成为构建后革命时代中国身份认同时面临的一个普遍问题，与此同时，分裂主义团体还试图在西藏、蒙古和新疆建立独立国家，这使得问题变得更加复杂。现在中国政府已经控制了这一地区，当权者决定，应当建立一个自治区以保护当地人权利、确保他们的忠诚。"
 CHN_found_our_faction_decision: "宣告我们在世界上的地位"
 CHN_found_our_faction_decision_desc: "随着我们战胜日本，现在是时候去恢复中国在东亚和世界上的应有地位，并利用其丰富的人力资源促进国际友好合作。在实现国家统一后，接下来自然是重申我们的影响力，以确保中国再也不会沦为帝国主义的牺牲品。"
 china_join_the_internationale_decision: "加入第三国际"
 china_join_the_internationale_decision_desc: "在德国的武装干涉之下，第一次北伐黯然收场，许多国民党人流亡到第三国际各国寻求庇护。如今，我们的力量已经恢复和振作，自然应当在世界舞台上协助第三国际，助推革命传播，同时回报社会主义同志多年来对我们的帮助。"
 china_create_the_fourth_internationale_decision: "成立第四国际"
 china_create_the_fourth_internationale_decision_desc: "尽管第三国际已经倒下，但我们永远不会放弃世界革命的梦想。我们将重新点燃火炬，团结全世界的工人，掀起一场全球解放的新运动！"
 china_join_the_reichspakt_decision: "加入帝国公约"
 china_join_the_reichspakt_decision_desc: "自国民党北伐失败后，德国就一直是我们的主要支持者。现在，我们扫除了所有拒认我们统治地位的敌人，是时候向我们在柏林的朋友们提出正式结盟了。"
 china_join_the_moscow_accord_decision: "加入莫斯科协约"
 china_join_the_moscow_accord_decision_desc: "黑色星期一的降临终结了多年来德国在全世界的统治地位。而随着新的世界大国们逐渐崛起，中方希望寻求盟友亦是理所当然。也许我们将与北方邻居成为盟友，因为俄罗斯人亦渴望抛开过去的纷扰，迎来由欧亚大陆强国领导的新世纪。"
 china_join_the_co_pro_decision: "加入共荣圈"
 china_join_the_co_pro_decision_desc: "虽然我们以往一度与日本失和并爆发了战争，但他们仍是我们的亚洲同胞。我们曾听任欧洲帝国主义者离间中日关系，使得整个亚洲陷入混乱并遭受压迫。在我们展现自身伟力并恢复中国的大陆霸权之时，日本人也一如既往地支配着碧海狂涛，现在我们终于能以成为平等伙伴为目标同日本人谈判。作为盟友，中日将携手让整个亚洲恢复往日荣光！"
 china_join_the_entente_decision: "加入协约国"
 china_join_the_entente_decision_desc: "协约国尽管与我们关系一向不睦，且已无力支撑其傲慢的帝国主义姿态，但在当前列强的冲突中，却仍是我们暂时的盟友。得益于我方在粤地的人脉与充足的中间人，以及协约国在中国民族主义核心诉求上的退让，深化双方的联盟或许是实现长期繁荣的最务实之举。"
 china_join_america_decision: "与美国结盟"
 china_join_america_decision_desc: "尽管美国曾参与过令国人蒙羞的百年国耻，但在遏制日本与欧洲在本地区影响力这一共同利益的驱使下我们将团结在一起。让我们携手合作，为亚洲与太平洋带来和平与繁荣！"
 china_invite_countries_to_faction: "邀请[FROM.GetNameDef]加入[ROOT.GetFactionName]"
 china_invite_countries_to_faction_desc: "中国于亚洲的正当地位乃是全亚洲人民的兄长、导师及领袖。挣脱外来帝国主义者的桎梏后，我们已经准备好再次成为其他亚洲国家的捍卫者，以抵御欧洲或日本的暴政。让我们派出外交官，将[FROM.GetAdjective]纳入我方阵营。"
 china_invite_countries_to_faction_tt: "§Y对方同意的几率取决于§Y[FROM.GetAdjective]§!对我方的看法。§!"
 chinese_unification: "统一中国"
 chinese_unification_desc: "数十年来的外来帝国主义、政治反覆和国内动乱令天朝丧失了中央权威，大清风雨飘摇之际，它的软弱催生了一批新的地方军阀。辛亥革命使得国家的动荡进一步加剧，加入革命的将军们夺取了不少省份，并着手建立起由军队军官、亲密商人、地主士绅、友善知识分子和政府官员组成的复杂网络。\n\n风吹过雨打过，我们共同的国族认同仍然存在，全国各地，各路人马都致力于统一国家，以自己的构想重建中华。各方势力都利用自己的恩庇网络、外国支持和不断壮大的军队，在城市和农村竞争影响力。不过，中国纷繁的军阀时代令人眼花缭乱，公然开战并非竞争的唯一途径。外国入侵近在眼前，而结盟背盟的故事也在不断上演……\n\n§C我们的势力当前属于[ChinaGetMemberAlignment]§Y阵营§!。§!"
 china_create_united_front: "建立统一战线"
 china_create_united_front_desc: "祖国积弱，外国鬼子在我们的土地上肆意妄为，我们炎黄子孙决不能坐视不管。帝国主义者还在我们的边境上虎视眈眈、准备奴役我中华民族，我们却仍在各自为政，按省籍或派系分成一个个割据势力。我们不能再这样了！让我们为了民族团结而抛开各种琐碎的纷争，保卫我中华之荣誉永不玷污！起来！"
 china_northeastern_gambit: "东北方略"
 china_northeastern_gambit_desc: "日本鹰派鲁莽地决定与德国开战以争夺亚太霸权，这下他们彻底走上了绝路，而我们也获得了一个独一无二的机会——我们可以与日本开战，并打击他们在东北的帝国主义野心，如此便能巩固我们的威望，我们也将被推崇为民族英雄。中国其他地区很可能被迫加入这个抗日统一战线，而日本则将被同时卷入陆海双线作战，最终必将不堪重负，彻底垮台！"
 china_join_united_front: "加入统一战线"
 china_join_united_front_desc: "外来帝国主义者对我们发动了一场野蛮的入侵，[FROM.GetName]已经邀请我们在这祖国危难之际保卫中华的荣耀。尽管我们的国家依然在各省各派之间四分五裂，但我们的文明正面临着万劫不复的危难。让我们为了保卫祖国而搁置争议、共同努力！"
 china_offer_ceasefire: "与[FROM.GetNameDef]进行停火谈判"
 china_offer_ceasefire_desc: "中国现在正在和一个列强交战。在中国仍处于分裂的状态时，我们独自抗击外敌是一个很愚蠢的决定。我们应该与[FROM.Capital.GetCapitalVictoryPointName]的敌人进行谈判，暂时停火直到击败侵略者。我们要牢记，所有帝国主义者都觊觎我们的财富。我们已经没有什么可以失去的了！中国万岁！"
 china_declare_government: "[ROOT.china_declare_government_text]"
 china_declare_government_desc: "[ROOT.china_declare_government_text_desc]"
 china_declare_government_SHX: "宣告中原政府成立"
 china_declare_government_SHX_desc: "随着我们在华北平原的地位得到巩固，我们现在可以大胆地为自己争取辛亥革命的传承。我们的新政府将努力实现全国统一，打败所有拦在我们面前的对手。除了[SHX.GetLeader]之外，没有人能想到山西省会获得如此强大的实力。但从我们解放中原的勇气来看，我们已经证明了自己配得上去领导全国统一！"
 china_declare_government_SHD_national_populist: "复辟大清"
 china_declare_government_SHD_national_populist_desc: "天师一声令下，上清的军队开进了紫禁城，宫门成了爱新觉罗一家的监狱，几个皇室成员试图逃跑，但是并未成功，紫禁城四郭满是红枪会众。最后，皇帝向上清投降，溥仪本人也没死，但他得向身穿黄马褂的张天然俯首称臣，同时在人民面前重申帝位。溥仪仍然是皇帝，但是上清天国的道长、点传师和坛主将成为大清自县长以降的正式官吏。\n\n张天然赦免了溥仪在这场战争中的罪行，并宣称这场胜利延续了义和团和孙中山等人的道统，并开创了高峰。"
 china_declare_government_SHD_manchu_restoration: "复辟大清"
 china_declare_government_SHD_manchu_restoration_desc: "宣统维新失败后，许多人怀疑屈映光是否能抵挡直系的进攻，但如今，所有怀疑都烟消云散。他带领山东挡住了直系的攻势，将山东和大清朝廷从覆灭边缘拉了回来，我们的力量无比强大。溥仪陛下将会在皇弟溥杰的辅佐下复位，屈映光将成为他们最倚重的顾问。要让所有妨碍我们的人都知道，大清又回来了，这一次他们可逃不掉了。"
 china_declare_government_other: "组建全国政府"
 china_declare_government_other_desc: "既制霸于中国，当宣雄心于天下，一统宇内，终结乱世。虽有引他人觊觎之忧，易受其他逐鹿者愤恨之苦，但大丈夫身居天地之间，岂可久久郁居人下？吾等当举大旗，定乾坤，灭四方军阀，还天下清正！"
 china_declare_unification: "宣告中国重新统一"
 china_declare_unification_desc: "我们的敌人已经被粉碎了，那些之前肆意宣称自己领导全国的人也不敢再出声了。我们现在已经是几乎全中国的统治者，剩下唯一一件要做的事就是正式宣告我们对全国的领导。无论如何，我们是军阀时代的胜利者，我们有责任领导中国走向更美好的未来。"
 china_united: "§Y中国已被完全统一在一面旗帜下。§!"
 china_declare_legitimacy_decision: "巩固我们的合法性"
 china_declare_legitimacy_decision_desc: "军阀混战时代再度降临后，直系中央政府的权威已在战火中泯灭。我们为国家统一尽了自己的一份力，现在是时候迈出下一步，重新团结全中国了。"
 china_no_rival_governments_left_tt: "我们已经击败了全部的对立中国政府。"
 CHN_conquer_beijing_fallback_decision: "[CHN_conquer_beijing_fallback_decision_scripted_loc]"
 CHN_conquer_beijing_fallback_decision_desc: "[CHN_conquer_beijing_fallback_decision_desc_scripted_loc]"
 KMT_conquer_beijing_fallback_decision_key: "完成革命使命"
 KMT_conquer_beijing_fallback_decision_desc_key: "只要反动派继续统治北京一天，先总理托付给我们的伟大使命就一天不能完成。我们必须克服困难，筹备二次北伐。这不仅是为了挽救革命事业，更是为了中华民族的存亡而战！国民革命万岁，中华民国万岁！"
 CHN_conquer_beijing_fallback_decision_key: "解放北京"
 CHN_conquer_beijing_fallback_decision_desc_key: "北京乃中国之古都，在中华儿女心目中有着独特的地位。如能占据北京，对内可得合法地位，对外可得国际认可，因此它是各路人马的必争之地。上次对北京的进攻以失败告终，这次我们必须加倍努力，为了新中国，前进！"
 CHN_demand_control_of_beijing: "要求控制北京"
 CHN_demand_control_of_beijing_desc: "北伐已经结束，青天白日旗飘扬在北京上空，但这座城市实际上仍被地方军阀所掌控。给予军阀自治权是统一路上的必要之恶，但我们不能容许古都北京也落入这种邪恶之中。只要我们不能直接控制北京，就还会有人密谋破坏，甚至篡夺我们的中央权威。必须将国民政府的统治带到华北，向着革命的完成更进一步。"
 CHN_march_to_manchuria: "进军东北"
 CHN_march_to_manchuria_desc: "内有中华民族的汉奸卖国求荣，外有日本帝国主义者狼子野心，他们贪图我中国那无尽的宝藏，长期霸占我东北领土。东北虽不属于清朝内地十八省，但一直是中国领土的东部边界，[ROOT.GetNameDef]认为东北各省是中国领土不可缺少的一部分。守在山海关内固然安逸，但我们要担起民族重任：解放东北同胞，彻底统一中国。"
 CHN_war_for_guangzhou: "进军广州"
 CHN_war_for_guangzhou_desc: "珠江三角洲蕴含着绝佳的机遇和雄厚的财力，以那里为大本营，南方政权就有统一全国的机会。自国民党倒台以来，广州已多次易手，但那座城市仍然拥有我们组织北伐所需的一切资源。鉴于那里对国家统一的重要意义，[ROOT.GetLeader]及其盟友选择了武力夺取，而广州之主也拿出了强硬的态度，看来，西南地区要再次拿起武器了。"
 CHN_nanjing_expedition: "援宁战役"
 CHN_nanjing_expedition_desc: "南京曾是中国多个南方朝代的首都，也是孙中山于1911年就任中华民国临时大总统的地方。南京控制着长江入海口富饶强盛的江南地区，或许是华东沿海最重要的城市，在全国范围内的重要性仅次于北京。南京长期以来一直是联帅孙传芳的大本营，尽管该地区的政治局势可能已发生变化，但其对于我们势力范围的重要性并未改变。"
 CHN_storming_of_wuhan: "突袭武汉"
 CHN_storming_of_wuhan_desc: "辛亥革命的第一枪正是在武汉打响。武汉位于中国腹心，由武昌、汉口和汉阳这三座沿河城市组成。武汉是湖北省省会，同时也是直隶玉帅吴佩孚的军事基地，占领它对提升政权合法性、增强对中国内陆地区的战略控制度都至关重要。"
 CHN_satellite_generic_challenge_overlord_decision: "挑战[ROOT.Overlord.GetLeader]权威"
 CHN_satellite_generic_challenge_overlord_decision_desc: "[CHN_satellite_generic_challenge_overlord_decision_desc_scripted_loc]"
 CHN_satellite_generic_challenge_overlord_decision_desc_zhili: "直系称霸中国政坛十余年，掌握着中央政府，作为秩序和稳定的捍卫者，高层却腐败横行、优柔寡断。常理而言，下属凌驾于领袖之上无疑是僭越之举，然而非常时期当行非常之事。"
 CHN_satellite_generic_challenge_overlord_decision_desc_manchu: "复辟帝制对于保障领土完整、维护秩序和传统至关重要，而奸佞小人却在蒙蔽圣听，我们需要清君侧，让皇上重新实行仁政！"
 CHN_satellite_generic_challenge_overlord_decision_desc_fengtian: "1928年，直系做了汉奸，复辟大清，北洋政府的最后一线希望落到了奉系身上。我们的领袖固然尽了最大努力，但要维护国体，他们做的还远远不够，变革势在必行。"
 CHN_satellite_generic_challenge_overlord_decision_desc_federalists: "联省派希望捍卫宪政，拯救中国的民主，确实是高尚之士，但却一直面临着内部腐败分子的威胁，如今他们的领导层既无能又虚伪，根本不配称为“中国的民主灯塔”，我们必须准备好将他们解救出来。"
 CHN_satellite_generic_challenge_overlord_decision_desc_chinese_republican: "辛亥革命吸引了许多梦想家，但他们的梦想却一次又一次在现实面前砰然坠地。中央政府的现任领袖根本配不上手中的权力，我们必须做好准备，将国家掌握在自己手中。"
 CHN_satellite_generic_challenge_overlord_decision_desc_fallback: "其兴也勃焉，其亡也忽焉，各色领袖和他们的政府来来去去，但中国永存，人民依然在寻找一位拯救他们于水火之中的舵手。如今，新近登上大位的军阀越发显露出自己的无能，他配不上这份重任。江山轮流坐，也许今年就该轮到我们了？"
 china_move_capital: "宣布常设首都"
 china_move_capital_desc: "统一的中华民族国家在历史上拥有过许多首都，在我们的治下，中国可以宣布一地作为民国的常设首都。我们有四个主要的选项（如果我们都控制的话）：南京，北京，武汉，广州。每个城市都有其特殊优势。我们必须细心决策，因为定都的决定是不可更改的。"
 china_provisional_capital: "更改临时首都"
 china_provisional_capital_desc: "我们正在继续统一全国的行动，大片地区已在我手，随着我军深入敌方地区，后勤压力不断增加，也许我们应该将首都迁至地理位置更优越，或者政治意义更大的地方，这样既能缓解后勤压力，也能表现我们统一国家的决心。"
 china_attack_decision: "进攻[FROM.GetNameDef]"
 china_attack_decision_desc: "针对[FROM.GetAdjective]领导层的持续反抗已无法通过和平手段平息，事实证明，[FROM.GetLeader]根本无力胜任领袖，此人将被我们逐出[FROM.Capital.GetCapitalVictoryPointName]。"
 china_demand_submission: "要求[FROM.GetNameDef]屈服"
 china_demand_submission_desc: "[FROM.Capital.GetCapitalVictoryPointName]的地方政权最近孤立无援，不向任何人效忠。作为中华大地上真正合法的政权，我们必须让他们加入我方——他们要么乖乖接受，要么我们就得准备点不那么彬彬有礼的方法了。"
 china_integrate_subjects: "[FROM.GetNameDef]的整合度增长"
 china_integrate_subjects_desc: "尽管[FROM.Capital.GetCapitalVictoryPointName]的高层明智地选择加入了我方阵营，但如果想真正结束军阀混战的时代，我们必须更进一步，努力使[FROM.GetAdjective]政府与我们更加亲密。"
 china_joint_strike_GXC_decision: "与[FROM.GetNameDef]发动联合进攻"
 china_joint_strike_GXC_decision_desc: "靠我们自己的力量击败[GXC.GetNameDef]的机会微乎其微，但[FROM.GetNameDef]应当会反抗[GXC.GetAdjective]暴君。但我们得赶快——要使这联合打击行动奏效就必须出其不意。计划一旦成功，我们将立即向[GXC.GetAdjective]宣战。"
 china_joint_strike_GXC_attack_mission: "[YUN.GetNonIdeologyName]-[HNN.GetNonIdeologyName]联合进攻[GXC.GetNameDef]"
 china_joint_strike_tooltip: "我们只能与一个派系进行一次联合进攻"
 HNN_GXC_chicken_exit: "§R我们将会抛弃[YUN.GetNameDef]，让他们独自面对[GXC.GetNameDef]§!"
 YUN_GXC_chicken_exit: "§R我们将会抛弃[HNN.GetNameDef]，让他们独自面对[GXC.GetNameDef]§!"
 northwest_conflict_surrender: "向敌人投降"
 china_integration_timer: "[THIS.overlord.GetNameDefCap]提升整合度"
 china_break_free: "挑战[ROOT.Overlord.GetLeader]权威"
 china_break_free_desc: "[china_subject_challenge_overlord_decision_desc_loc]"
 china_break_free_desc_lkmt: "[ROOT.Overlord.GetLeader]领导下的国民党中央委员会内部无止境的勾心斗角为整个国家和无数同胞带来的只有毁灭。是时候让[ROOT.GetLeader]带领孙先生的真正信徒们冲锋陷阵、攘除叛徒，掀起国民革命的新浪潮了。[ROOT.GetNameDefCap]人数虽寡，然吾等坚定不移，精诚团结。"
 china_break_free_desc_rkmt: "没想到国民革命竟会变得如此扭曲、如此背离初心。三民主义的真正含义已被卑如尘埃的世人、毫无骨气的文人、特别是邪恶卑劣的暴君[ROOT.Overlord.GetLeader]所扭曲。不幸的是，国家正处于摇摇欲坠的崩溃边缘，[ROOT.GetLeader]必须让[ROOT.GetNameDef]与这艘将沉之船脱钩并走向胜利。"
 china_break_free_desc_fed: "表面来看，联省运动的目标是保护中国人民、发展本土民主以及颁布真正的自由宪法，但联省运动实际上已被独裁者与精英所腐化。虽然我们对实用的交易并不陌生，但是[ROOT.Overlord.GetLeader]做的有些太过火了，[ROOT.GetLeader]不能袖手旁观，坐视联省运动的理念逐渐消散。"
 china_break_free_desc_zhili: "长久以来，直系德不配位的领导地位都摇摇欲坠。他们没能维持住国家的统一，也失去了对[ROOT.GetNameDef]的控制，[ROOT.GetLeader]主官不得不出手确保地方的稳定。拯救中国人民的重担似乎再一次落在了我们的肩上，而这一次我们的目标不再只是[ROOT.GetNameDef]，而是全中国。尽管对我们的宗主发起挑战可能并不明智，但[ROOT.Overlord.GetLeader]的堕落统治已经持续太久了。"
 china_break_free_desc_fengtian: "我们的国家何以沦落至此？由于宣统复辟，全共和派的事务起先被哗众取宠的“大帅”张作霖掌控着，甚至[ROOT.GetLeader]个人与张氏集团的纽带也可能参与其中。而如今，奸佞、蠢货和叛党聚集在[ROOT.Overlord.GetLeader]这个土匪身边统治着国家，将她领向混乱与毁灭。到头来，[ROOT.GetNameDefCap]必须孤注一掷，抓住最后的机会对国家领导权发起冲击。这次背叛或许愚蠢，但我们对背叛又怎么会有心理负担。"
 china_break_free_desc_manchu: "天子端坐于龙椅之上，再次一人独揽着大权，而我们再一次向他卑躬屈膝。这一事实让我们倍感羞愧，让我们千夫所指，让我们为人所不齿。中国难道不应该是一个现代化国家吗？先烈们是为了什么才发起的辛亥革命？为了推翻满人暴政所挥洒的血泪，做出的牺牲，难道只是为了让我们又倒回最初的命运吗？不应该是这样的，所谓的“天子”不应再骑在我们头上，我们要将自由与独立再次还给中国人民！"
 china_break_free_desc_fallback: "高级官员利用职务之便，按自己的意愿塑造国家对于中国来说已经不是什么新鲜事了。但正是这项糟粕让中国像一个无头苍蝇一般，即便没有外敌自己内部就分崩离析了。为了将中国人民真正从困境中解救出来，我们必须致力于推翻[ROOT.Overlord.GetLeader]这个最近才接过了国家领导权的小丑。新中国必须是一个由[ROOT.GetNameDef]领导的，一个不为腐败所扰的中国。"
 china_half_strength_of_overlord_tt: "与宗主的陆军实力之比估计不低于§Y50%§!"
 china_has_been_365_days_tt: "向宗主屈服已超过365日。"
 CHN_join_NPA_decision: "加入[NPA.GetName]"
 CHN_join_NPA_decision_desc: "从前的护国联盟是终结袁世凯复辟、拯救民国的旧军阀联盟，而如今[NPA.GetLeader]领导的护国联盟复兴了这种精神，虽然面对的局势不同，但新旧护国联盟的目标是一致的——保护国家和同胞免受宵小之徒的伤害！"
 CHN_join_NZH_decision: "加入[NZH.GetName]"
 CHN_join_NZH_decision_desc: "自从北直系在1927年取得胜利之后，他们一直主宰着中国政坛，并经受住了来自北洋内部政治风波、南方革命派和北方竞争对手的考验。尽管他们的霸权最近受到了挑战，但他们必将取得胜利，并维护中国的道德和政治秩序。"
 CHN_join_SZH_decision: "加入[SZH.GetName]"
 CHN_join_SZH_decision_desc: "南直系是北直系本流之外的一个分支，他们以孙传芳及其八省联合的基业为中心。南直系与德国和使馆城市合作密切，并能为国家带来繁荣，因此我们决定加入他们。"
 CHN_join_MCU_decision: "加入[MCU.GetName]"
 CHN_join_MCU_decision_desc: "复辟的满清政府在中国政坛重建了仁政和秩序，作为忠诚的臣民，我们将追随中国的正统政府。"
 CHN_join_AGJ_decision: "加入[AGJ.GetName]"
 CHN_join_AGJ_decision_desc: "安国军是由张作霖领导的军阀联盟，旨在击败国民党的激进革命分子，并在奉系的大旗下重新统一中国。尽管他们之后被直系击败，但他们却从未放弃希望。现在安国军走上了上坡路，而我们也获得了与我们的老战友重聚一堂的机会。"
 CHN_join_UPC_decision: "加入[UPC.GetName]"
 CHN_join_UPC_decision_desc: "联省运动主要由南方政党组成，旨在以联邦制模式建立一个全新的共和中华。若尔等期盼中国成为一个能尊重各省权利的国家，那么就应投入心血参与此一联盟。"
 CHN_join_LKT_decision: "加入[LKT.GetName]"
 CHN_join_LKT_decision_desc: "中国的左翼势力已团结在了[LKT.GetLeader]的领导下，中国的未来必须掌握在那些富有远见之人手中，以实现将国家开创未来所需的彻底变革。我们将加入革命同志的行列，共同带领祖国走进新时代！"
 CHN_join_RKT_decision: "加入[RKT.GetName]"
 CHN_join_RKT_decision_desc: "中国国民党由孙中山先生手创，其宗旨是作为国民革命的先锋队，从帝国主义和国内腐败的侵害中拯救中国。我们有责任加入新生国民革命军的行列，共同保家卫国！"
 CHN_join_RGC_decision: "加入[RGC.GetName]"
 CHN_join_RGC_decision_desc: "旭日正自东方升起，亚细亚从西方帝国主义手中被解放的时刻已然临近。只有通过与大东亚共荣圈的合作，我们才能真正拯救中国于社会主义和帝国主义的魔爪之下，因此我们必须加入他们所支持的政府。"
 CHN_join_FROM_decision: "加入[FROM.GetName]"
 CHN_join_FROM_decision_desc: "[FROM.GetLeader]乃中国一颗冉冉升起的新星，他利用自己对强大的[FROM.GetAdjective]军队及对[FROM.GetRulingParty]盟友的控制，成为中央政府的一大竞争者。这位意想不到的挑战者正以[FROM.Capital.GetCapitalVictoryPointName]为中心大展身手，展现出极大的潜力，我们应该与其建立更紧密的联系。"
 china_demand_annexation: "要求吞并[FROM.GetNameDef]"
 china_demand_annexation_desc: "我们的县长已经嵌入了[FROM.Capital.GetCapitalVictoryPointName]和[FROM.GetAdjective]的队伍中，剩下的就是确保[FROM.GetLeader]忠诚于我们的事业。他们的自治权已经名存实亡，是时候结束了。"
 china_offer_alliance: "向[FROM.GetNameDef]提议结盟"
 china_offer_alliance_desc: "尽管在中国变幻莫测的环境中漂泊不定，但我们在[FROM.Capital.GetCapitalVictoryPointName]的盟友仍然在面对不断变化的风向中取得了胜利。鉴于他们一直与我们站在一起，我们应该开始谈判，把力量团结起来，一起实现我们对未来的共同愿景。"
 china_negotiate_with_legation_cities: "同[FROM.GetNameDef]谈判"
 china_negotiate_with_legation_cities_desc: "列强贪得无厌，他们强行在中国沿海划出的使馆城市，时刻提醒着我们帝国主义毒蛇对我们伟大民族的压迫。在统一了内陆地区并结束困扰我们已久的动乱之后，使馆城市没有任何继续存在的必要。我们将结束中国历史上这一悲惨的篇章。"
 china_request_return_of_concessions: "向[FROM.GetAdjective]要求归还租界"
 china_request_return_of_concessions_desc: "租界最初只是在我们虚弱的时候租借给外国列强的弹丸之地，但那些殖民主义列强步步紧逼，扩大了租界的范围。现在我们终于统一了国家，就可以整合起全中国的力量，正式挑战那些拼命攥着不义之财的帝国主义者。"
 china_seize_concessions: "夺取[FROM.GetAdjective]的租界"
 china_seize_concessions_desc: "谈判已经失败，如果我们还想解放沿海同胞，除武力夺取外别无选择，我们的军队已在城外郊区集结，准备好让这些城市重归祖国怀抱。"
 CHN_pressure_overlord_to_act_decision: "敦促中央政府行动！"
 CHN_pressure_overlord_to_act_decision_desc: "我们确实归顺了[ROOT.overlord.GetLeader]和他的中央政府，但这一切的前提是我们相信[ROOT.overlord.GetNameDef]有能力重整山河统一全国。然而，[ROOT.overlord.getadjective]政府在统一问题上的拖延令人不齿，也许需要提醒一下他们，我们的忠诚并不是无条件的。"
 CHN_pressure_to_act_mission: "行动压力"
 CHN_pressure_to_act_mission_desc: "1911年以来，统一问题一直困扰着中国的各色领袖，在地方主义和民族主义两种看似矛盾却又并存的诉求之下，我们承受着要求迅速统一的压力。重整河山绝非易事，不幸的是，鼓吹“统一”的人只需毫无顾忌地指指点点，我们却要因“无所作为”而饱受攻讦。不过，如果我们真的想证明自己是中国的合法领袖，那就别无选择，只有踏上征途，战而胜之！"
 china_expand_autonomous_region: "[CHN_expand_autonomous_region_scripted_loc]"
 china_expand_autonomous_region_desc: "[CHN_expand_autonomous_region_desc_scripted_loc]"
 CHN_expand_mongolian_autonomous_region_scripted_loc_key: "将[FROM.GetName]纳入蒙古自治区"
 CHN_expand_mongolian_autonomous_region_desc_scripted_loc_key: "当我们的军队初入蒙古时，就决定给予当地蒙古各旗自治权，从而成立了外蒙古和外蒙古自治区。由于我们近期又将一块蒙古人口众多的地区纳入了版图，理应给予这些新领土同样的待遇。"
 CHN_expand_xinjiang_autonomous_region_scripted_loc_key: "将[FROM.GetName]纳入新疆自治区"
 CHN_expand_xinjiang_autonomous_region_desc_scripted_loc_key: "当我们的军队初入新疆时，就决定给予这个多民族省份自治权，从而成立了新疆维吾尔自治区。由于我们近期又将一块少数民族聚居的地区纳入了版图，理应给予这些新领土同样的待遇。"
 CHN_expand_tibetan_autonomous_region_scripted_loc_key: "将[FROM.GetName]纳入西藏自治区"
 CHN_expand_tibetan_autonomous_region_desc_scripted_loc_key: "当我们的军队初入西藏时，就决定给予当地藏人自治权，从而成立了内藏和外藏自治区。由于我们近期又将一块藏族人口众多的地区纳入了版图，理应给予这些新领土同样的待遇。"
 china_orchestrate_sinophile_coup: "在[FROM.Capital.GetCapitalVictoryPointName]策划亲中派政变"
 china_orchestrate_sinophile_coup_desc: "尽管我们以保证[FROM.GetNameDef]的半独立地位换来了他们承认我们的宗主权，但这终归只是权宜之计。只要这拨人掌权，我们就难以长期维持自己的宗主权。如今他们潜在的其他靠山不是自顾不暇就是默不作声，他们除了接受领导层更替之外别无选择。"
 china_alignment_gui_button_tooltip: "[ChinaGetAlignmentButtonTooltip]"
 china_alignment_gui_button_text: "中国阵营"
 china_alignment_title_text: "中国势力阵营"
 china_alignment_faction_info_tenets: "理念"
 china_faction_alignment_name_default: "[?country_leader:china_alignment.GetName]§Y阵营§!"
 china_faction_aligment_name_npa: "§L护国联盟§!§Y阵营§!"
 china_faction_alignment_name_independent: "§Y独立军阀§!"
 china_faction_alignment_desc: "领军势力：§Y[?global.china_alignment_leaders^alignment_i.GetName]§!\n加入§Y[?global.china_alignment_leaders^alignment_i.GetName]§!阵营的军阀："
 china_no_faction_desc: "以下军阀仍保持独立。请将鼠标悬停在旗帜上以查看他们加入我方阵营的倾向。"
 china_alignment_faction_member_name: "§Y[THIS.GetName]§!\n[ChinaGetMemberAlignment]§Y阵营§!\n[ChinaGetMemberAlignmentCompatibilityStatus]"
 china_alignment_faction_alignment: "[?country_leader:china_alignment.GetName]"
 china_alignment_no_alignment: "§Y中立§!"
 china_alignment_non_aligned_alignment: "该军阀§Y孤军奋战§!。"
 china_alignment_compatible_alignment: "该军阀与我方势力§Y志同道合§!。"
 china_alignment_incompatible_alignment: "该军阀与我方势力§Y水火不容§!。"
 china_faction_tenets_title: "[ChinaGetAlignmentTenetsTitle]"
 china_faction_tenets_title_default: "[?country_leader:china_alignment.GetName]§Y理念§!"
 china_faction_tenets_title_npa: "§L护国联盟§!§Y理念§!"
 china_faction_tenets_title_independent: "§Y独立军阀§!"
 china_faction_tenets_desc: "[ChinaGetAlignmentTenetsDesc]"
 china_faction_tenets_northern_zhili_desc: "§L北直系军阀由气度不凡的“保定王”曹锟和声名大噪的“玉帅”吴佩孚领导，直系起源于北洋新军中冯国璋的派系，再往前则可追溯到直隶总督“中国俾斯麦”李鸿章。相较而言，北直系军阀对大众的改革呼声更加敏感，也曾“认真”尝试过改革。\n\n但在很多人看来，直系与其他军阀没什么区别，且其内部的派系林立、关系网纠葛的问题要比其他军阀更加严重。直系并不存在统一的理念，主要可分为曹锟的津保派和吴佩孚的洛派两大派系，但不论哪一派都有同一个共识：直系必将统一中国。\n\n曹锟一派更倾向于依赖曹锟的政坛地位、直系整体的政治霸权和他那代表性的曹锟宪法，主张谨慎地推动中国的现代化，继承北洋政府的传承。与之相对，吴佩孚一派则主张建立由知识分子主导的儒家民主共和国，以真诚的改革态度来弥补北洋政府的过失。§!"
 china_faction_tenets_southern_zhili_desc: "§L南直系是“笑面虎”孙传芳的流派，与北直系有着相同的源流。其创始人可以追溯到李鸿章和冯国璋，在“长江三督”冯国璋、李纯和王占元崛起后，南北直系就出现了隔阂。\n\n王占元的争权夺势与冯国璋之死进一步推动了南直系的独立，最终在孙传芳的领导下，南直系成为了一个独立派系。通过建立五省联合，南直系确保了对中国东方海岸线的掌控。但南直系缺乏统一的意识形态，其中成员都各行其道。\n\n孙传芳提倡开明专制共和主义，齐燮元则推行亲租界的独裁统治政策，而陈仪的立场很特殊：作为南直系成员，他却与日本人有着密切联系，对旧同盟会的理想也抱有同情。§!"
 china_faction_tenets_manchu_qing_desc: "§L尽管已不得民心，但帝制并未在1911年真正消亡。康有为、梁启超、满清宗室和其他保皇团体依然推崇着帝制。尽管直系假惺惺地复辟了大清，但国会中的保皇派依然对自己被迫屈居共和派之下的事实十分不满。\n\n随着直系军阀陷入衰弱，“宣统维新”爆发了，宣统皇帝重新独揽大权。复辟派得到了天命，更得到了诸多改良派和知识分子的支持。他们主张改革君主制，以避免重蹈辛亥革命的覆辙。§!"
 china_faction_tenets_fengtian_desc: "§L安国军政府是原北洋政府最后的传承——至少安国军的领袖张作霖大元帅是这么说的。不过在这层皮囊之下，安国军无非就是张作霖攥在手里的一张用来提供国家正统性的牌罢了。\n\n奉系军阀中的各个派系都聚集在“安国军”这个招牌底下：张学良的少帅派、杨宇霆的士官派、张派……另外安国军政府尚在北京时，也吸纳了不少派系。比如作为1928年的遗产的一部分，旧皖系的成员就加入了沈阳的残缺国会。此外还有什么己未俱乐部啦、旧交通系啦、新交通系啦、亲日的协和会啦，以及一堆被北京国会或直系扫地出门的北洋官僚。但这些妈了个巴子的派系都没啥区别，全是一帮抱团取暖的废物玩意，老帅说东他们就绝对不敢往西。§!"
 china_faction_tenets_federalists_desc: "§L联省运动与辛亥革命运动有着相似的传统，其起源都是同盟会。在章太炎、梁启超、宋教仁等传奇人物的推动下，“省宪运动”在全国各省迅速发展。其中要数浙江、湖南、广东、四川和云南几省最为成功。\n\n进入军阀割据时代后，权力从中央政府向省一级转移，各省的地位上升，联省运动自然得到了蓬勃发展。湖南的赵恒惕率先采用联省主义，浙江则随后发起了浙江自治运动，全国各地都开始采用或探讨联省主义。\n\n联省运动在意识形态上存在分歧，李剑农和赵恒惕等人主张“自下而上”的联省主义。唐继尧提倡“自上而下”的联省主义，陈炯明则倡导成熟的联省主义体系。联省派被视为可以替代国民党的革命运动，其在传统上以中央集权为主的北方地区几乎毫无建树，其在北方最大的支持者不过是北京的一些小党派。§!"
 china_faction_tenets_left_kuomintang_desc: "§L国民党起源于清末的秘密革命会党组织“同盟会”，其创始人孙中山致力于驱逐鞑虏、恢复中华、创立民国。辛亥革命后，对北洋军阀深恶痛绝的孙中山在广州建立了一个对立政府，并与联省派的陈炯明等其他南方共和派合作。与陈炯明决裂后，孙中山与第三国际取得了联系，第三国际向孙中山派去了流亡的俄罗斯顾问作为援助。\n\n这些布尔什维克帮助孙中山在1924年改组国民党，使其变得更加革命，并采用了民主集中制。国民党的目标是以一党专政统一中国，并采用训政以推广三民主义、为日后的民主化做好准备。孙中山死后，国民党内部陷入了左右之争：左派主张与中工盟结盟，右派则反对结盟。\n\n北伐战败、蒋介石被暗杀后，国民党中央委员会流亡巴黎，其残部则在闽赣地区坚持游击战。国民党左派追求完成统一大业，在亚洲领导社会主义革命。毫无疑问，社会主义是三民主义的必然结论！§!"
 china_faction_tenets_right_kuomintang_desc: "§L国民党起源于清末的秘密革命会党组织“同盟会”，其创始人孙中山致力于驱逐鞑虏、恢复中华、创立民国。辛亥革命后，对北洋军阀深恶痛绝的孙中山在广州建立了一个对立政府，并与联省派的陈炯明等其他南方共和派合作。与陈炯明决裂后，孙中山与第三国际取得了联系，第三国际向孙中山派去了流亡的俄罗斯顾问作为援助。\n\n这些布尔什维克帮助孙中山在1924年改组国民党，使其变得更加革命，并采用了民主集中制。国民党的目标是以一党专政统一中国，并采用训政以推广三民主义、为日后的民主化做好准备。孙中山死后，国民党内部陷入了左右之争：左派主张与中工盟结盟，右派则反对结盟。\n\n北伐战争失败后，国民党中央委员会那些左派懦夫流亡巴黎，右派则撤退到了贵州。国民党右派追求完成国民革命以实现孙先生遗志，但不能让社会主义荼毒三民主义理念。新中国不能建立在那可恶的所谓三民主义唯物主义解释上！§!"
 china_faction_tenets_national_protection_alliance_desc: "§L“护国联盟”是一个由军阀、投机分子和其他不法狂徒组成的奇怪组织，该组织表面上声称其是蔡锷、李烈钧和唐继尧“护国军”的继承人。虽然他们的名字来自一个崇高的理想，即通过一场彻底而全面的救国战争来阻止一个专制狂人的独裁野心，但当今的护国联盟却名不副实。\n\n恰恰相反，护国联盟宣扬省级专制和加强对省内的控制，他们只是一群人为了维护各自的一己私利而团结起来组成的一个先天不良的团伙。许多观察家，尤其是从属于他们老对手的，都声称这个军阀派系持续不了多久，而只要他们仍然存在，那军阀割据就依然延续。§!"
 china_faction_tenets_geacps_desc: "§L中国人民的至暗时刻或许已经降临了，日本人如今张开了他们的血盆大口蚕食鲸吞，将中国这具腐烂的尸首吃干抹净，到头来只在原地留下了一副空洞的骨架。当地带路党和日本关东军狼狈为奸，让日本帝国的影响力肆意蔓延，最终远远超过了老帅所能掌控的范围。\n\n这些人只因“亲日”二字沆瀣一气，而非凭借共同的信仰团结一心。该政府的要员因其卖国求荣之行径，引得当地民众人人喊打、义愤填膺，并落了个“汉奸”的骂名。尽管中国深受苦难，满目疮痍，可这对东京方面又有什么影响呢？日本企业依然能继续牟取暴利，叛国之人的贪天之念亦如愿以偿。§!"
 china_faction_tenets_independent_desc: "§L在军阀割据时代中，许多地方主官并不服从北京或广州的权威。这些没有所属阵营的军阀身段灵活，试图在风云变化的政治乱局中守住自己的一亩三分地……§!"

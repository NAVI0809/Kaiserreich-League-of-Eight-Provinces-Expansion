 ANQ_revolt_against_bonus_idea: "讨伐新皖系"
 ANQ_revolt_against_bonus_idea_desc: "经历了八省联合的四分五裂后，南北两京终于统一在一面旗帜之下，新皖系统一了中国。这场为统一中国而进行的血腥权力斗争无疑代价高昂，但安徽人民克服万难，将不可能化为可能。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"
 GXC_revolt_against_bonus_idea: "讨伐两广"
 GXC_revolt_against_bonus_idea_desc: "尽管经历了无数挫折和数度易主，两广还是实现了其数十年来的夙愿，统一中国。中国的统一是一项艰巨的任务，对于一个南方的中国政府来说尤其如此，但粤桂两省人民克服万难，将不可能化为可能。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"
 CHI_revolt_against_bonus_idea: "讨伐国民党"
 CHI_revolt_against_bonus_idea_desc: "从福建的群山出发，青天白日旗插遍全国，国民党左派完成了他们的“国民革命”和统一壮举，从闽赣根据地的游击队开始，国民革命军排除万难，取得了最终的胜利。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"
 FNG_revolt_against_bonus_idea: "讨伐奉系"
 FNG_revolt_against_bonus_idea_desc: "从北京到秋海棠叶，奉系高举着五色旗得胜而归，实现了几十年来梦想的统一。这场为统一中国而进行的血腥权力斗争无疑代价高昂，但东北人民克服万难，将不可能化为可能。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"

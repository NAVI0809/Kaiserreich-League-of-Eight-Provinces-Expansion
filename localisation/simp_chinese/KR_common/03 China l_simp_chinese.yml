 china_land_reform_decisions: "全国土地改革"
 china_land_reform_decisions_desc: "尽管我们的政府已经在民生问题上做了大量工作，但显示上，军阀时代还是对中国许多地区造成了相当大的破坏，余下地区的发展也受到了阻碍。受影响最严重的本质上都是农村地区，它们从未从中国过去几十年痛苦的工业化进程里取得任何好处。在多年动荡和政府忽视下，越来越多的人都因不公平的租佃法案、不齐全的设备、落后的技术、各种政权的掠夺和自然灾害而饱受磨难。\n\n我们已经在战场上取得了胜利，中国的重建将作为我们的下一条战线，来巩固我们胜利的意义。是时候减轻农民的苦难，在中国乡村留下浓墨重彩的一笔了。"
 china_generic_land_reform_decision: "在[FROM.GetName]开展土地改革"
 china_generic_land_reform_decision_desc: "许多思想家和理论家都曾对持续困扰中国乡村数十年的问题提出了潜在的解决方法。既然已经将全国统一在一面旗帜之下，我们便有了充足的资源和稳定，以实施一项综合计划来解决这些问题。现在只需要政府对大规模地进行这样的努力作出首肯。"
 unequal_treaties: "不平等条约"
 CHN_calls_for_a_united_front_idea: "呼吁组建统一战线"
 CHN_calls_for_a_united_front_idea_desc: "随着中国政府与外敌间爆发战争，爱国主义情绪激荡在华夏大地之上。人们纷纷呼吁交战中的各势力搁置分歧、保家卫国，共同组建中国统一战线。若是哪个派系试图拒绝加入联盟，其政治后果可能不堪设想。\n\n§R只要还在与统一战线交战，就将一直受到此惩罚。§!"
 unite_china_justification_idea: "中国统一！"
 unite_china_justification_idea_desc: "如今我们已经占领了首都并组建了新中国政府，我们必须征讨残存的军阀。"
 league_collapse_idea_1: "革命热情"
 league_collapse_idea_1_desc: "八省联合已经瓦解，战争已经爆发，南京的军队正处于混乱之中，四面受敌。是时候发动进攻了！夺回我们应得的东西！"
 league_collapse_idea_2: "重整旗鼓的宁系"
 league_collapse_idea_2_desc: "我们虽有弱点，但那些叛徒还是没能击溃我们，现在是时候反击并拿回我们的东西了！"
 china_foreign_support: "外国支持"
 china_foreign_support_desc: "我们打了胜仗后，外交使团便来到我们这里，帮助我们夺取新的胜利。"
 china_desertions_common: "开小差频发"
 china_desertions_common_desc: "接二连三的败绩导致越来越多的壮丁拒绝战斗，有的时候他们前脚被送进军中，后脚就把身上的新衣服带到附近的市场上卖掉了。"
 china_morale_effects_tooltip: "§Y华东混战士气§!\n政治点数：[?china_morale_dm_political_power_gain|+=%0]\n战争支持度：[?china_morale_dm_war_support_factor|+%=2]\n投降界限：[?china_morale_dm_surrender_limit|+%=0]\n突破：[?china_morale_dm_breakthrough_factor|+%=1]"
 china_anti_stalemate_idea_2: "士气崩溃"
 china_anti_stalemate_idea_2_desc: "[THIS.GetLeader]失败了，他未能断然结束战争，导致队伍士气彻彻底底崩溃了。一天天过去，士兵或是抛下武器，或是落草为寇，我们的事业在风中飘散。"
 china_motivated_soldiers: "军队士气高涨"
 defend_nanjing_ANQ: "保卫南京"
 defend_nanjing_ANQ_desc: "“陈傻子”的策略奏效了！夺取南京后，陈调元实现当上联帅的野心只是时间问题，人民将不再受制于外国的利益，而齐燮元也不再能对华东联合敲骨吸髓。\n华东混战期间，只要南京还在[ROOT.GetLeader]手中，我们就能获得这个精神的效果，§R一旦丢掉南京，我们就会失去这个精神！§!\n\n无论怎么讲，优势在我，赴战！"
 defend_nanjing_CHI: "保卫南京"
 defend_nanjing_CHI_desc: "这是中国人民的光荣！白日照耀在闽赣根据地之外的华东大地，国民革命军更是自豪地将旗帜插上了南京城头。国父孙中山先生选定的民国首都已经解放，全国人民必然群起响应我们的革命事业。\n华东混战期间，只要南京还在[ROOT.GetLeader]手中，我们就能获得这个精神的效果，§R一旦丢掉南京，我们就会失去这个精神！§!\n\n无论怎么讲，优势在我，赴战！"
 defend_nanjing_LEP: "保卫南京"
 defend_nanjing_LEP_desc: "虽然四面楚歌、内外交困，但华东联合还有两大优势：一是对南京的掌控，二是那支英勇的模范现代化军队——五省联军。联帅决不允许那些背信弃义的小人夺走自己应得的宝座！\n华东混战期间，只要南京还在[ROOT.GetLeader]手中，我们就能获得这个精神的效果，§R一旦丢掉南京，我们就会失去这个精神！§!\n\n无论怎么讲，优势在我，赴战！"
 defend_nanjing_SHD: "保卫南京"
 defend_nanjing_SHD_desc: "局势发生了最为诡异的转变，占领南京的既不是陈调元、齐燮元，也不是邪恶的国民党激进分子，而是[ROOT.GetLeader]和他的手下！在他治下，新的华东政权正在形成……\n华东混战期间，只要南京还在[ROOT.GetLeader]手中，我们就能获得这个精神的效果，§R一旦丢掉南京，我们就会失去这个精神！§!\n\n无论怎么讲，优势在我，赴战！"

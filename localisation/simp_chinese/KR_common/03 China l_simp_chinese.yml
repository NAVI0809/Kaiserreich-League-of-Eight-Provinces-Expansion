 SHX_revolt_against_bonus_idea_desc: "尽管经历了无数挫折和数度易主，晋系还是实现了其数十年来的夙愿，统一中国。中国的统一是一项艰巨的任务，对于这个曾经中国最不发达的省份来说尤其如此，但山西人民克服万难，将不可能化为可能。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"

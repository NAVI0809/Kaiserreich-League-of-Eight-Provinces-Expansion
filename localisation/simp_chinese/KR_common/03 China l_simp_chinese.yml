 YUN_revolt_against_bonus_idea: "讨伐滇系"
 YUN_revolt_against_bonus_idea_desc: "尽管经历了无数挫折和数度易主，滇系还是实现了其数十年来的夙愿，统一中国。中国的统一是一项艰巨的任务，对于一个南方的中国政府来说尤其如此，但云南人民克服万难，将不可能化为可能。\n\n但他们高兴得还是太早了。就在他们因自己手中的权力而志得意满之时，却在中国统一的最后一道障碍面前绊了一跤：那些地方政府对他们的表现愈发不满，终于决定揭竿而起，吊民伐罪，发起了一场旨在推翻中国潜在统治者的运动。但这些挑战者能否成功，还要取决于其军队是否有能力对抗新的中央军队，而双方很快要在战场上见分晓了。"
 CHN_return_to_the_world_stage_idea: "重返世界舞台"
 CHN_return_to_the_world_stage_idea_desc: "中国曾是东方霸主，却因国内经济停滞和帝国主义入侵而衰落。如今，中国已依照自身方式成功实现统一，正逐步重塑其昔日帝国影响力。"
 CHN_return_to_the_world_stage_asia_pacific_treaty_organisation_idea: "重返世界舞台"
 CHN_return_to_the_world_stage_asia_pacific_treaty_organisation_idea_desc: "中国正寻求恢复其作为东亚“老大”的传统地位。作为新政府保护新兴亚洲民主国家努力的一部分，中国在外交政策上采取了更加干预主义的做法，准备向国外部署维和部队。"
 CHN_return_to_the_world_stage_2_idea: "巨龙怒吼"
 CHN_return_to_the_world_stage_2_idea_desc: "苏醒的中国将外国势力赶出了自己的传统边界，重返其身为东方霸权的历史地位。中国正努力重建其旧势力范围，同时毫不忌惮与敌对势力兵戎相见，争夺亚太地区的势力范围。"
 CHN_invite_into_east_asian_community: "邀请[FROM.GetNameDef]加入东亚共同体"
 CHN_invite_into_east_asian_community_desc: "我们最近欣然接纳了[FROM.GetNameDef]加入[ROOT.GetFactionName]，值此伙伴关系深化之际，推进新的联合经济项目不失为明智之举，此举将让整个大陆内部的联系更加紧密。"
 CHN_east_asian_community_shared_intro: "随着中国得到统一，中国政府得以动员其庞大的经济，使中国再次成为东方的商业中心。中国政府已着手建立一个贸易集团，试图将亚太各前殖民地国家团结起来，建设独立于欧洲的经济体系。"
 CHN_east_asian_community_founder_level_1_idea: "东亚共同体"
 CHN_east_asian_community_founder_level_1_idea_desc: "$CHN_east_asian_community_shared_intro$\n\n当然，作为该集团的创始人以及其中最大的经济体，中国在这一经济体系中将享有特殊地位。"
 CHN_east_asian_community_founder_level_2_idea: "$CHN_east_asian_community_founder_level_1_idea$"
 CHN_east_asian_community_founder_level_2_idea_desc: "$CHN_east_asian_community_founder_level_1_idea_desc$除了经济发展外，该经贸集团的计划已扩展到文化和学术交流领域。"
 CHN_east_asian_community_founder_level_3_idea: "世界联邦之中心"
 CHN_east_asian_community_founder_level_3_idea_desc: "$CHN_east_asian_community_shared_intro$\n\n在中国将多个世界列强纳入其联邦后，全球贸易已任由中国调度。"
 CHN_east_asian_community_member_idea: "东亚共同体成员国"
 CHN_east_asian_community_member_idea_desc: "$CHN_east_asian_community_shared_intro$\n\n作为其成员国，我们将受益于中国的投资，但也必须向中国资本敞开大门。"
 china_events.0.t.target: "[FROM.GetAdjective]即将入侵"
 china_events.0.t.ally_of_target: "[FROM.FROM.GetAdjective]即将入侵[FROM.GetName]"
 china_events.0.d.target: "来自边界的报告表明，该死的邻居[FROM.GetName]即将进攻我们。出于对我们的不满，[FROM.GetLeader]在[FROM.Capital.GetCapitalVictoryPointName]的人群面前正式谴责我们。从那时起，越来越多的部队开始向边界集结。现在，局势越来越紧张，敌人正进行试探性攻击，小规模冲突已经开始。我们必须尽快组织防御，不然就会被打垮。"
 china_events.0.d.ally_of_target: "我们已经从[FROM.GetName]的盟友那里收到警告，[FROM.FROM.GetName]即将入侵。随着边境日益紧张，双方已经开始为这场冲突做准备。鉴于我们之前对[FROM.GetName]负有义务，我们很可能会卷入这场冲突。我们必须马上调集军队——希望我们与[FROM.GetAdjective]结盟的决定还不算太仓促。"
 china_events.0.a: "召集总参谋部！"
 china_events.1.t: "[FROM.GetNameDefCap]要求我们屈服"
 china_events.1.d: "[FROM.GetLeader]的全国政府向我们提出了一系列要求，要求我们立即承认他们的权威。他们也许是对日益增长的力量充满信心，或者只是想在这个混乱的时代展示力量。如果我们屈服，自然就要被他们驻军、遵守他们的法令，还可能要向他们进贡。\n\n当然，我们可以跟他们摆明车马比一比纸面实力。这可能意味着战争，但摆脱暴政往往就需要这样的代价，特别是现在国内军阀混战，四处分兵、进攻“软柿子”却失败的政府比比皆是。我们也可以选择暂避锋芒，权且忍让。"
 china_events.1.a: "我们只得顺从他们的要求。"
 china_events.1.b: "我们绝不屈服！"
 china_events.1.c: "我们是中国的合法政府！"
 china_events.2.t: "[FROM.GetNameDefCap]屈服于我们的权威"
 china_events.2.d: "[FROM.GetLeader]的政府发现，他们维护自治的选择并不多，而且认为我们是最好的选择，因此同意承认我们是中国的合法统治者。他们承诺在法令上与我们协调一致，出兵参与我们的战争，并与我们进一步协调各项国家事务。\n\n但是，作为交换，他们的旧政府实际上大部分得以保留，底下的恩庇关系网也运转如初。众所周知，军阀的部队笨拙不堪，军头本身也不值得信任。现状当然对我们有所帮助，但进一步整合事宜得静待来日了。"
 china_events.2.a: "我们真是宽宏大量的统治者。"
 china_events.3.t: "[FROM.GetNameDefCap]拒绝让步！"
 china_events.3.d: "我们已尽力求得和平解决，可[FROM.GetLeader]却正式宣布放弃促进国家统一的努力，[FROM.GetAdjective]开始动员部队展示武力，要阻止我们的统一大业。此外，此人还赶走了所有我方代表，并在[FROM.Capital.GetCapitalVictoryPointName]散播我们的政府非法之类的卑鄙谣言。\n\n这是严重的侮辱行为，但我们如何应对还有待商榷。鉴于军阀冥顽不化、朝秦暮楚，我们当然可以直接出兵攻打他们。但是，如果要对付[FROM.GetNameDef]，我们就得削弱用于其他用途的力量。兵贵神速，我们要早做决断。"
 china_events.3.a: "让我们开始在边境集结。"
 china_events.3.b: "立即发起进攻！"
 china_events.3000.t: "[FROM.GetName]提议联合进攻[GXC.GetAdjective]"
 china_events.3000.d: "最近，一份奇怪的提议送到[ROOT.GetLeader]手中。其包括了对国家局势的纷乱报道，以及一封来自邻省[FROM.GetNameDef]省长[FROM.GetLeader]的精美电报。该省长恭敬地宣称，我们忠于共同的事业，促进国家统一，保卫边界，应加强相互联系，并提议[ROOT.GetLeader]和[FROM.GetLeader]一同对[GXC.GetLeader]发动攻势。\n\n虽然这是份诱人的提议，但风险亦不容小觑。因为可能使我省士兵陷入一场可能毫无意义的战争，虽然此一行动是为共同事业夺取广西和广东两省，且同样可能能够确保，并保持对华南关键城市广州的控制，并为我等带来巨大利益。另一个问题是该提议的性质，因为其效力仅来自于纸面上……一旦情况发生变化，可能随时被撕毁。"
 china_events.3000.a: "手拉手，上广东！"
 china_events.3000.b: "我信不过[FROM.GetLeader]。"
 china_events.3001.t: "[FROM.GetNameDefCap]响应我们的号召！"
 china_events.3001.d: "实乃幸事啊！看来我们为接下来征讨[GXC.GetLeader]行动所发出的请求，得到了梦寐以求的回应。[FROM.GetLeader]通过电报与[ROOT.GetLeader]交流，并向我们交流了其对计划的积极见解，并准备将其军队用于征服广东。现在我们必须为未来的冲突做计划，并希望他这话不是吹牛的。"
 china_events.3001.a: "这会是伟大事业的开端吗？"
 china_events.3002.t: "[FROM.GetName]拒绝我们的号召！"
 china_events.3002.d: "悲剧性的消息被送上了省长的桌上！看来我们为接下来征讨[GXC.GetLeader]行动所发出的请求被彻底地拒绝了。[FROM.GetLeader]通过电报与[ROOT.GetLeader]交流，并向我们交流了其对计划的积极见解，但他拒绝为征服广东而投入任何人力和物力。[FROM.GetLeader]表示这风险太大，且造成国家不稳，他更希望内部稳定，而不是引发进一步的冲突，虽然其未谴责我们的此一提议。但因未获帮助，我们必须更努力、谨慎地对未来的征讨做准备。"
 china_events.3002.a: "呵呵，不出所料。"
 china_events.3003.t: "恬不知耻的[FROM.GetAdjective]"
 china_events.3003.d: "也许我们对军阀时代的诚实和荣耀抱有过多的期望，但这实在是太令人失望了。尽管双方达成了先前的协议、联合演习，甚至联合起草了一项战役计划，以英勇地镇压[GXC.GetLeader]及其位于我们共同边界的非法政权，但看来[FROM.GetLeader]在最后时刻犹豫了。[FROM.GetLeader]要么害怕丢命，要么一开始就根本不愿意帮忙，最近他向[ROOT.GetLeader]通电，宣布他们不会干涉，即他们将不再支持行动。\n\n虽然不是没考虑过，但这仍在我方阵营中掀起了巨大的波澜与愤怒，许多好战者建议一次把他们全部打倒。值得庆幸的是，[ROOT.GetLeader]似乎从没有考量过此一选择。相反，[FROM.GetLeader]的话似乎造成了某种影响。他们已决定退缩，而他们的话是否有些道理？是否该重新考虑一下对广州的进攻是否明智？"
 china_events.3003.a: "反正我们也不需要他们！"
 china_events.3003.b: "他们这决定或许才是明智的……"
 china_events.3004.t: "[YUN.GetNameDefCap]和[HNN.GetNameDef]准备动员起来攻击我们！"
 china_events.3004.d: "两广在国内的地位对邻省威胁极大，而其中最受影响的是[HNN.GetNameDef]和[YUN.GetNameDef]。对位于正北和正西方的西南省份事务通常由粤省来主导，并向湖南和云南传达。因此，昆明与长沙自然对广州内部的变化相当敏感。[YUN.GetLeader]和[HNN.GetLeader]看到此一机会，又或者认为有压倒性的胜算，最近宣布了一场正式的行动，以驱逐[ROOT.GetLeader]对广东的“盘踞”。\n\n据报道，湘军和滇军以西南稳定、国家统一和“驱逐叛匪”为由，在我方共同的省界集结，与当地边境部队发生小规模冲突。看来，战鼓敲响已是时间问题，在这种情况下，总参谋部和士兵无疑必须做好准备。"
 china_events.3004.a: "二打一？看来是个挑战啊。"
 china_events.4.t: "[FROM.GetNameDefCap]提议结盟"
 china_events.4.d: "我们是中国唯一合法政府，但这并不意味着我们踽踽独行。全国上下有许多支持我们的人，等待着我们来解放，但有时，他们也能提前自我解放。\n\n[FROM.GetLeader]就是这样。他带领着[FROM.GetRulingParty]，解放了[FROM.GetNameDef]的人民。他们也赞同我们的事业，或至少自称如此。他们已经发来正式请求，作为当地分支机构参与我们的事业。"
 china_events.4.a: "我们欣然接受。"
 china_events.4.b: "不能相信他们。"
 china_events.5.t: "[FROM.GetNameDefCap]同意与我们结盟"
 china_events.5.d: "收到我们的结盟请求后，[FROM.GetNameDef]正式接纳我们加入他们的行列。双方军官正在建立联系，我们将更紧密地团结起来，致力于民族解放。[FROM.GetLeader]在[FROM.Capital.GetCapitalVictoryPointName]发表了正式的演讲，赞赏了[ROOT.GetLeader]和[FROM.GetRulingParty]的爱国行为，这加深了我们之间的联系。这只是双方走出的一小步，却是中国迈向未来的一大步。"
 china_events.5.a: "携手共进！"
 china_events.6.t: "[FROM.GetNameDefCap]拒绝了结盟"
 china_events.6.d: "我们为国家统一做出了真诚的努力，可[FROM.GetLeader]身边那帮有被害妄想症的家伙却拒绝了我们，甚至污蔑我们墙头草、热衷揽权。这种污蔑只能说明，他们内部腐败，连一点权力都不想给外人。\n\n既然已经独立于[FROM.GetAdjective]的阴谋之外，我们就不得不自己寻求解放之路。上路出发之时，我们要说，我们继承了辛亥革命真正的、没有被[FROM.GetLeader]腐蚀和扭曲的传承。"
 china_events.6.a: "他们的事业并不像他们说得那样高尚。"
 china_events.7.t: "[FROM.GetNameDefCap]邀请我们加入他们的队伍"
 china_events.7.d: "尽管中国变得越来越分裂，但全国仍有许多人对国家的未来有着共同的愿景。这些志同道合的人常被山河所阻，困于一隅，为得一处以安身而不得不各自为战。尽管如此，当群星闪耀，同志们各掌一方大权时，这总归是一件快事。\n\n[FROM.GetNameDef]的[FROM.GetLeader]已把我们[ROOT.GetRulingParty]认定为解放国家事业的同袍，[ROOT.GetLeader]已被邀请联合，以和平的方式使中国统一更进一步。"
 china_events.7.a: "我们全心全意接受。"
 china_events.7.b: "我们不会隶属于别人。"
 china_events.8.t: "[FROM.GetNameDefCap]加入我们的队伍！"
 china_events.8.d: "在某种程度上，[FROM.GetRulingParty]和[ROOT.GetRulingParty]有相似的渊源，多年来双方目标一直是一致的。[FROM.GetNameDef]的领袖[FROM.GetLeader]同意开始协调双方的统一工作，和平地将[FROM.GetNameDef]纳入[ROOT.GetAdjective]的阵营。\n\n如果运气不错，只需我们两方形成合力，就足以解放中华民族、摆脱肆虐的混乱和冲突。乘势而进，团结必胜！"
 china_events.8.a: "同一个民族，同一个事业。"
 china_events.9.t: "[FROM.GetNameDefCap]拒绝我国结盟请求！"
 china_events.9.d: "[FROM.GetRulingParty]和[ROOT.GetRulingParty]有相似的渊源，但多年过去，双方的目标似乎有所不同。[FROM.GetNameDef]领袖[FROM.GetLeader]否认了我们为和平统一、对抗共同敌人所做的努力，而是走上了自己的道路。\n\n他们如此叛逆，只能用自私自利来解释。无论怎么讲，我们还是要继承辛亥革命的真正传承，为中国人民开辟未来。"
 china_events.9.a: "[FROM.GetAdjective]这群叛徒，至少别来妨碍我们。"
 china_events.10.t: "[FROM.GetNameDefCap]试图增加整合度"
 china_events.10.d.integration_level_1: "既然我们已经表明了对[FROM.GetAdjective]事业的忠诚，当然就该赢得一点信任。但是，[FROM.GetLeader]坚称，为了继续民族解放事业，必须要进一步整合，对我们的内部事务进行进一步监管。\n\n目前我们的地盘上，[FROM.Capital.GetCapitalVictoryPointName]任命的县长还只是稍有增加，但如果接受整合要求，事态会发生微妙却肉眼可见的改变：我们现有的广泛自治权将开始逐渐被收回，为了领导地位，许多人会疏远[ROOT.GetLeader]，转而向[FROM.GetLeader]输诚。也许是时候摆脱他们的束缚，挽救我们的独立地位了。"
 china_events.10.d.integration_level_2: "长期以来，在[ROOT.Capital.GetCapitalVictoryPointName]治下，我们享有不受中央窥探的自治权。这能多方面提高治理效率，但我们绝不是要搞分裂主义或者地方主义（在中国政治中这是个贬义相当重的词汇）。但是，事态正在发生变化。\n\n我们的政治机构基本上是自治的，如今，[FROM.GetNameDef]驻我方的[FROM.GetRulingParty]组织坚持加强中央的控制，即控制几个关键内政部门。当初我们同意服从[FROM.GetAdjective]统治时，曾以为能够保住这些部门。当然，如果我们拒绝，后果会很可怕，但如果继续软弱，可能就再也逃不出[FROM.GetLeader]的手掌心了。现在我们必须认真考虑，摆脱他们风险有多大、能不能成功。"
 china_events.10.d.integration_level_3: "[ROOT.GetRulingParty]的领导人们最近十分焦虑，因为他们扎根已久的恩庇网正越发面临[FROM.GetAdjective]特工的威胁。最近流言四起，称[FROM.GetRulingParty]正在[ROOT.Capital.GetCapitalVictoryPointName]建立当地总部，试图建立政治基础。\n\n现在，中央政府派来的县长越发大胆地凌驾于我们之上，我们的末路近在咫尺。以前，[FROM.Capital.GetCapitalVictoryPointName]通过的法律经常被忽视，但现在，这些法律的执行力度越来越大，我们迟早要成为[FROM.GetRulingParty]直接统治的又一个省份。我们别无选择，只有为战争做好准备。"
 china_events.10.d.integration_final: "尽管很早之前就有心理准备，但今天，当[FROM.GetNameDef]采取行动时，[ROOT.GetLeader]的核心圈子还是有点震惊。在私人会面中，[FROM.GetLeader]谈到了[ROOT.GetNameDef]的未来，他保证[ROOT.GetLeader]能继续担任地方主官，但中央政府将采取必要措施，使[ROOT.GetLeader]的统治与[FROM.GetRulingParty]的理想一致。\n\n他没说出来的是，[FROM.Capital.GetCapitalVictoryPointName]方面对我们的控制越来越强，据估计，他们有权在事实上（甚至可能在法律上）选择新的地方主官，并禁止地方自行任命。我们已经没有其他选择，要么跟着[FROM.GetRulingParty]，作为好战友载入史册，要么就背水一战，反抗他们的统治。在这个关键时刻，我们要决定我们势力的命运。"
 china_events.10.a: "我们接受[FROM.GetAdjective]的统治。"
 china_events.10.b: "我们要反抗这种侵犯！"
 china_events.11.t: "[ROOT.GetNameDef]的整合度增加"
 china_events.11.intro: "长期以来，我们作为独立省份享有自治，远离中央政府的阴影。由于中国的政治气候腐败而动荡，我们已经远离了“集权”这一概念——因为在这个纷争不安的混乱时期，只有自治才能解决我们自己的问题。事实上多年来，我们一直在自行改革，加强我们与中国其他地区的文化差异。"
 china_events.11.d.integration_level_1: "$china_events.11.intro$\n\n现在，[THIS.overlord.GetNameDef]的政府官员要求我们本地的电台和报纸停止使用本省方言，从此以后新闻将使用[THIS.overlord.GetNameDef]的“国语”进行广播。他们还要求我省自行创办的报纸停办。我省多为著名作家为抗议此时而辞职，担心中央进一步集权的声音如雨后春笋般涌现。"
 china_events.11.d.integration_level_2: "$china_events.11.intro$\n\n现在，[THIS.overlord.GetNameDef]的政府官员要求停止地方文化节日的庆祝活动，因其“煽动分裂思想”，让人想起中国“古老而落后的时代”。本地长者和各村庄纷纷向省议会表示抗议。"
 china_events.11.d.integration_level_3: "$china_events.11.intro$\n\n现在，[THIS.overlord.GetNameDef]的政府官员要求我省学校立即停止用方言授课，要使用他们的“国语”作为教学语言。许多教师、教授向我们的政府提出抗议。更令人震惊的是，我们发现父母因此与孩子更难沟通了，由于现在使用[THIS.overlord.GetNameDef]的“国语”进行教学，从学生到人力车夫，越来越多的人既不会说新的“国语”，也不会说本地方言。"
 china_events.11.d.integration_final: "$china_events.11.intro$\n\n自我国开始中央集权以来，我省表面上与原来一样，实际上政治、社会、经济都经历了重大变化。[THIS.overlord.Capital.GetCapitalVictoryPointName]中央政府现在可以直接任命我省的县长和主要政府官员；虽然省内很多人还能讲流利的方言，但如今的年轻一代只会说“国语”；经济也经历了深刻的变化，曾经有用的省货币体系在采用国家货币后逐渐崩解。此外，我省军队已全部收归中央，再也没有任何政治上独立于中央政府的概念。"
 china_events.11.a: "天数有变，神器更易，此乃自然之理。"
 china_events.12.t: "我们整合[FROM.GetNameDef]的努力"
 china_events.12.intro: "最近几周，将[FROM.GetAdjective]整合入我们的管理体系的举措有所进展，总体稳中向好。[FROM.GetLeader]和[FROM.GetRulingParty]显然不会无视我们的行动，而不管他们是真的相信我们共同的思想，还是单纯地认为统一潮流势不可挡，现在都默许了我们的要求。"
 china_events.12.d.integration_level_1: "$china_events.12.intro$\n\n为了准备这些事情，我们决定向他们的政府要求今后必须在所有的公开交流中使用我们的方言。这不仅可以消除各省方言上的隔阂，同时还可以减少各地的异见。无论如何，我们对[FROM.GetNameDef]的控制大大增强了。"
 china_events.12.d.integration_level_2: "$china_events.12.intro$\n\n同样我们必须宣告全国广大军民同胞，我们正带领中国民族迈入新时代。在如此国家统一之际，我们必须让全国人民知道，各地必须改掉落后陋习，学习现代的先进知识。"
 china_events.12.d.integration_level_3: "$china_events.12.intro$\n\n中国的未来是青年的未来，倘若我们想要世世代代控制中国，就要让青年学习我们的方法，了解我们的权威。我们要求，学校在教学和对话中必须使用我们的语言。"
 china_events.12.d.integration_final: "我们完全整合了[FROM.GetAdjective]省和我们的行政部门。当地百姓高歌我们的领导，我们任命的县长也频频传来捷报。当地正在推广使用我们的官话，学校也早已实现了官话教学。我们甚至不需要担心异议，当地广播停止了方言播报，军队也被我们完全收编。"
 china_events.12.a: "又向统一迈进了一步。"
 china_events.13.t: "[FROM.GetNameDefCap]反抗整合"
 china_events.13.d: "军阀就像野兽一样善变，根本无法信任，他们罔顾国家和人民付出的代价，总是小心翼翼地抓着自治权不放。我们已经尽力让过渡进程合理、平滑，但是[FROM.GetLeader]还是在顽固地抵制我们改造[FROM.GetNameDef]的工作。\n\n他非但不接受整合，还召集[FROM.GetRulingParty]反抗我们，并谴责“[ROOT.Capital.GetCapitalVictoryPointName]施行暴政，试图将[FROM.GetAdjective]的军队缴械”。我们必须在事业遭受进一步损害之前，快速平息这场叛乱。"
 china_events.13.a: "为救国付出的微小代价。"
 china_events.14.t: "[FROM.FROM.GetNameDefCap]反叛[FROM.GetNameDef]"
 china_events.14.d: "一个令人震惊的消息传到了[Root.Capital.GetCapitalVictoryPointName]：[FROM.FROM.GetAdjective]起兵反抗[FROM.Capital.GetCapitalVictoryPointName]方面的统治。消息已经传开了。出于对[FROM.GetLeader]领导的不满，以及对[FROM.GetRulingParty]侵犯地方事务的担忧，[FROM.FROM.GetName]驱逐了所有的[FROM.GetAdjective]代表，这是一种激烈的反抗行为。\n\n这瞬间让[FROM.FROM.GetLeader]成了出头鸟，他希望成为领头羊，集结一切敢于反抗[FROM.GetRulingParty]的人，组成更广泛的联盟。初生的[FROM.GetAdjective]政府正被混乱吞没，我们则暂时得以旁观，但很快他们就会为事业的未来而出击，届时我们就得选一边站了。"
 china_events.14.a: "我们得赶快加入起义！"
 china_events.14.b: "忠于当局。"
 china_events.15.t: "[FROM.GetNameDefCap]与我们决裂"
 china_events.15.d: "或许是不可避免的连锁反应，又或许是厚颜无耻的自私行为，无论怎么讲，这一天还是来了：受[FROM.FROM.FROM.GetLeader]起兵反抗我们的激励，[FROM.GetLeader]选择与叛军站在一起，同我们决一死战。他们找到了从阵营内部推翻我们的机会，去宣泄自治权被侵犯的怒火，或者是对[ROOT.GetLeader]长期领导的不满。如果我们不能立刻干掉这些叛徒，[ROOT.GetRulingParty]的统一之梦就要胎死腹中了。"
 china_events.15.a: "叛徒只有一个下场。"
 china_events.16.t: "[FROM.GetNameDefCap]加入反抗"
 china_events.16.d: "[FROM.GetRulingParty]看到有机会打破[FROM.FROM.FROM.GetAdjective]压迫的枷锁，决定与我们结盟，共同努力推翻[FROM.FROM.FROM.Capital.GetCapitalVictoryPointName]的统治。[FROM.GetLeader]致电我们，正式将[FROM.GetNameDef]的资源交给我们控制，但落实程度如何尚待观察。军阀晨秦暮楚，他们无疑会留一手，看看我们会不会屠龙后又变成恶龙。\n\n但是眼下，我们必须专注于打败[PREV.GetNameDef]。我们的队伍日益壮大，成功的几率也水涨船高，但是，[FROM.FROM.FROM.GetLeader]恐怕不会坐以待毙，我们的反抗还远未胜利。"
 china_events.16.a: "有希望才有反抗。"
 china_events.17.t: "[ROOT.china_central_plains_war_title]"
 china_events.17.d: "[ROOT.china_central_plains_war_desc]"
 china_events.17.a: "[ROOT.china_central_plains_war_option]"
 china_central_plains_war_title_federalist: "[GetYear]年反集权起义爆发"
 china_central_plains_war_title_lkmt: "[GetYear]年国家统一战役开始"
 china_central_plains_war_title_rkmt: "[GetYear]年剿匪战役开始"
 china_central_plains_war_title_zhili: "[GetYear]年护国战争开始"
 china_central_plains_war_title_manchu: "[GetYear]年安国运动开始"
 china_central_plains_war_title_fengtian: "[GetYear]年护法运动爆发"
 china_central_plains_war_title_generic: "[GetYear]年反[FROM.GetAdjective]内战爆发"
 china_central_plains_war_desc_federalist: "虽然[FROM.GetNameDef]在说服各路军阀加入[FROM.GetLeader]的政府上取得了巨大成功，但还是有很多人担心联省运动这个善变的“盟友”终有一天会拔刀相向。果不其然，现在很多地方主官开始反抗[FROM.Capital.GetCapitalVictoryPointName]。\n\n双方都在谴责对方的暴政。叛军谴责中央政府违背了联省主义原则，而[FROM.GetRulingParty]则坚称叛军在搞地方主义和寡头民主。战争迫在眉睫，如果联省派想要存活下来，就必须立刻调动他们的军队。"
 china_central_plains_war_desc_lkmt: "近日中国又传来了疯狂的消息，他们似乎又打起了另一场内战。叛乱的军阀曾宣布效忠国民党之国民政府，但他们已经决定与[CHI.Capital.GetCapitalVictoryPointName]断绝关系，并谴责其明显的威权主义倾向。\n\n有些人认为国民党统一全国思想的理念导致了不可避免的内战，但是国民革命军仍必须毫不犹豫地采取行动来镇压叛乱，否则国民党也许会又一次与实现孙中山先生愿景的机会失之交臂。"
 china_central_plains_war_desc_rkmt: "孙中山先生在多次被对手赶下台后，终于建立了先锋队形式的国民党，并要求每个成员都向自己宣誓效忠。但尽管如此，国民党还是一直在尝试建立一个统一战线，而且在孙中山去世之前就在进行这一尝试。国民党右派试图建立了一个统一的联盟，但前几天它却土崩瓦解了。\n\n由[FROM.GetLeader]领导的中央政府谴责日益猖獗的叛乱是“土匪”行为，并希望借此消除对其专制统治日益不满的情绪。在两军即将交锋之际，国民党似乎又遭逢了另一场重大打击。"
 china_central_plains_war_desc_zhili: "一切看起来似乎都应该尘埃落定了。在直系军阀二十年代以惊人的速度扫平了所有对手之后，许多人都认为未来将沿着直系设计好的道路前进。随着1936年八省联合崩溃，这个梦彻底碎了。而之后的事情只是越来越糟。[FROM.GetNameDefCap]尝试收拾残局，却又在今日遭到了严重的打击，因为多地的地方政府都在今日通电宣告揭竿反叛。\n\n叛军自比护国运动，声称要将国家从直系的暴政中解救出来。这是否仅仅只是又一次军阀战争，以及直系是否能安稳渡过此次风暴，都将在战场上得出答案。"
 china_central_plains_war_desc_manchu: "为了在国际上争取合法性而复辟的满清君主制，即使在直系被推翻之后似乎也没有太受欢迎。他们试图接管结盟势力，却又引发了一次新的护国运动，叛军在煽动着共和主义情绪，反对着他们心中那个由外国人强加给他们的君主制政权。\n\n[FROM.GetAdjective]的领导人则反过来发誓要在安国运动中平定叛乱：而其结果将决定清朝动荡历史的走向与其国运。"
 china_central_plains_war_desc_fengtian: "[FROM.GetNameDef]获胜了，但这并不表示他们治下那些飞扬跋扈的地方派不会再为他们添乱。虽然[FROM.GetLeader]成功透过谈判确保各地地方政府的忠诚，但由于中央寻求加大整合力度，看来协议今天化作废纸了。\n\n在多个地区发动公开叛乱后，[FROM.GetAdjective]的正统性现在饱受质疑。不论有无夸大其辞，有关[FROM.GetAdjective]与日本合作的政治宣传和其他污秽流言都已经开始四处流传。如果他们无法在短期内平息这些叛乱的话，那他们统一中国的梦想将会迅速破灭。"
 china_central_plains_war_desc_generic: "尽管[FROM.GetNameDef]已经在统一方面取得进展，但近期确保各地方主官的工作却遭到了重大打击。军阀的忠诚都是不出所料的反复无常，他们对待自己身处[FROM.GetNameDef]的[FROM.GetRulingParty]主子亦是如此。\n\n这样的互相猜忌再加上[FROM.GetAdjective]收紧控制的尝试，最终导致了内战的爆发，而多位之前与中央政府结盟的地方主官都开始谴责政府。战争一触即发，人民东躲西藏，祈祷自己能在又一场战乱中活下来。"
 china_central_plains_war_option_government: "没了他们，我们政府会更好！"
 china_central_plains_war_option_government_warlord: "我们会打败这帮叛徒！"
 china_central_plains_war_option_puppet: "希望上峰可以取得胜利。"
 china_central_plains_war_option_ally_generic: "我们的盟友陷入了又一场斗争。"
 china_central_plains_war_option_revolting_warlord: "我们终将战胜暴君！"
 china_central_plains_war_option_enemy_government: "正统何在不言自明。"
 china_central_plains_war_option_enemy_warlord: "这是我们蛰伏喘息的良机。"
 china_central_plains_war_option_enemy_generic: "让那帮白痴内斗去吧！"
 china_central_plains_war_option_neutral_government: "看遍政权更迭，我们屹立不倒。"
 china_central_plains_war_option_neutral_warlord: "希望他们别打到别人的地盘上去了。"
 china_central_plains_war_option_japan: "机遇乎？危险乎？"
 china_central_plains_war_option_neutral: "苦难的大地上，悲惨冲突再起。"
 china_events.18.t: "[FROM.GetAdjective]国民党的回归"
 china_events.18.d: "即便同志之间存在着分歧，先总理的教诲终归凝聚着全国国民党员的思想与信念。[RKT.Capital.GetCapitalVictoryPointName]给了[FROM.GetAdjective]地方政府多大的自治权，可能一直会是观察家和未来的历史学家争论的话题，但普遍的共识是，党最终完成了对国家的统一，从而将各个边远省区势力整合为一个集权化的治理体系。\n\n这个进程并非一帆风顺，而是充满了波折：忠诚受到质疑，人们互相攻讦，许多人悄然牺牲。而党始终拒绝承认分裂和怀疑的存在，双方都明白，这种说法最为符合彼此的利益，毕竟，今天的一切都会写入未来的历史。不过与此同时，有一点是确定的：[FROM.GetLeader]最终选择了忠诚而非野心，这种罕见的举动也许意味着一个悲剧时代的终结。"
 china_events.18.a: "向这些革命的忠仆致敬。"
 china_events.18.b: "一个国家，一个政党，一种未来……"
 china_events.19.t: "[FROM.GetAdjective]左派归顺党国"
 china_events.19.d: "最终，尽管各派系间存在激烈分歧，中国左派仍在渴求革命性变革降临饱经沧桑的祖国这一点上达成一致。[FROM.FROM.GetLeader]与[FROM.FROM.Capital.GetCapitalVictoryPointName]政府的胜利印证此点——尤以[FROM.GetNameDef]归附于中央政府为证。尽管[FROM.GetLeader]对于党纲的忠诚度与[FROM.GetRulingParty]的[FROM.GetNameDef]前几年所享有的自治程度、乃至于其过去对全国革命的贡献仍存在争议，但无可辩驳的是：近几月来他们已显著靠拢中央指令。\n\n尽管外人或难察觉，[FROM.GetLeader]早已与党组织深度交织，但其和平交出[FROM.GetAdjective]政府临时自治权的决定仍有些令人意外。这一微妙却显著的转折，既让军阀时代更近终结一步，又为[FROM.FROM.GetLeader]清除了另一个潜在的党内对手。"
 china_events.19.a: "我们永远不会忘记这些同志的忠诚与牺牲。"
 china_events.19.b: "[FROM.FROM.GetLeader]又少了一个内部威胁。"
 china_events.190.t: "[FROM.GetAdjective]联省派加入政府"
 china_events.190.d: "尽管联省运动内部各派在意识形态上纷繁复杂，且普遍带有省域民族主义色彩，最终看来中国的联省派在推进联省方案这一共同目标上，仍保有一定的团结精神。随着[FROM.FROM.Capital.GetCapitalVictoryPointName]政府为庆祝[FROM.FROM.GetLeader]的胜利而在全国范围吹响起凯歌号角，而[FROM.GetNameDef]非但未起兵反抗，反而选择顺服于中央政府的权威，这一举动进一步强化了这种团结信念。尽管[FROM.GetLeader]在联省主义的具体实现路径上显然有着不同理解，且其所在的省级政府力量不容小觑，但他们依然选择了原则高于尊严，这一克己之举值得敬重。\n\n联省运动历来将省份自治的荣誉置于核心诉求，其历史本身也是地方主义在构建全国性政治运动中屡屡失败的缩影。因此，[FROM.GetLeader]自愿放弃[FROM.GetAdjective]政府的自治权，多少令人意外。尽管这一举动在国际舞台上或许不甚显眼，却无疑悄然推动军阀时代离终结更近了一步——又一枚棋子被从棋盘上移除。"
 china_events.190.a: "你将成为名垂青史的杰出人物。"
 china_events.190.b: "联省政府得到了加强。"
 china_events.191.t: "[FROM.GetAdjective]加入我方政府"
 china_events.191.d: "在军阀混战的时代，忠诚实属难得，更遑论地方军阀对中央政府的信任与真心拥戴，这无异于野心大海中的一枚细针。然而，随着[FROM.FROM.Capital.GetCapitalVictoryPointName]政府为庆祝[FROM.FROM.GetLeader]的胜利而在全国范围吹响起凯歌号角，而[FROM.GetNameDef]非但未起兵反抗，反而选择顺服于中央政府的权威，这一举动进一步强化了这种可怖的国家团结信念。尽管[FROM.GetLeader]在治国理政的具体实现路径上显然有着不同理解，且其所在的省级政府力量不容小觑，但他们依然选择了原则高于尊严，这一克己之举值得敬重。\n\n军阀历来拥有维系地方自治的天然特权，其历史本身也是地方主义在构建全国性政治运动中屡屡失败的缩影。因此，[FROM.GetLeader]自愿放弃[FROM.GetAdjective]政府的自治权，多少令人意外。尽管这一举动在国际舞台上或许不甚显眼，却无疑悄然推动军阀时代离终结更近了一步——又一枚棋子被从棋盘上移除。"
 china_events.191.a: "他们必将享有一席尊荣。"
 china_events.191.b: "统一大业，稳步前行。"
 china_events.2200.t: "根据[FROM.GetAdjective]的条款统一"
 china_events.2200.d: "神州大地终于迎来了脆弱的和平，然而我们民族国家的统一也给中央政府和各省长官带来了一系列新的挑战。[ROOT.GetLeader]曾支持[FROM.GetLeader]争夺中华民国领导权的野心，如今则在新政府中担任要职，作为一位受人尊敬、处事圆滑的行政长官，在国内事务中发挥着重要作用。\n\n然而，随着中央政府面临的困境日益加深，乱局迷雾中或将浮现良机？随着经济、军事和政治困境接踵而至，首都当局正处于前所未有的虚弱境地，现在正是[ROOT.GetLeader]宣称自己问鼎中原之志的最佳时机。然而，这种行为无疑是背信弃义之举，绝非儿戏。尽管[FROM.GetLeader]略显颓势，却仍构成重大威胁，只需几场战事便会引发一场灾难。"
 china_events.2200.a: "我们也算不上光明磊落。"
 china_events.2200.b: "向[FROM.GetLeader]发出提议。"
 china_events.2200.c: "前往首都向他们道贺。（切换为[FROM.GetNameDef]）"
 china_events.2300.t: "[FROM.GetLeader]发动叛乱！"
 china_events.2300.d: "军阀混战之中，难得真心盟友，近日传来的[FROM.GetLeader]发动叛乱的消息更是印证了此言。昔日盟友眼见中央政府统治风雨飘摇，竟在华夏大地上发动了一场争夺权柄的豪赌。当同胞即将手足相残之际，国家再度陷入惶恐不安……"
 china_events.2300.a: "真是愚不可及！"
 china_events.2300.b: "这便是军阀混战的常态。"
 china_events.20.t: "[FROM.GetNameDefCap]提出加入统一战线"
 china_events.20.d: "我们收到了[FROM.Capital.GetCapitalVictoryPointName]方面的提议，他们请求加入我们最近成立的反侵略统一战线，搁置一切争议，共同驱逐入侵者，保卫祖国。\n\n当然，我们也有一些担忧，特别是[FROM.GetLeader]和他的[FROM.GetRulingParty]未必可信。如果同意结盟，那我们就成了一条绳上的蚂蚱，而不幸的是，这种联盟在军阀时代极其常见，很快就会崩溃。不过，以中华民族团结之名，我们真的可以说不吗？"
 china_events.20.d.ceasefire: "$china_events.20.d$\n\n此外，还有一个难题是，[FROM.GetNameDef]正在和国内的其他势力交战。如果接纳他们加入，会造成外交上的麻烦，因为我们要替他们解决一切现有冲突，以免卷入其中。"
 china_events.20.a: "欢迎他们加入。"
 china_events.20.b: "他们口是心非，拒绝他们加入。"
 china_events.21.t: "[FROM.GetNameDefCap]接纳我们进入统一战线"
 china_events.21.d: "[FROM.GetLeader]认为外来侵略迫在眉睫，他亲自致信[ROOT.GetLeader]，欢迎我们加入中国统一战线。如果我们联合起来，势必会对侵略者构成重大威胁，但这种联盟的存续时间值得怀疑。但是，现在没时间考虑这么多了，冒着敌人的炮火，前进！"
 china_events.21.a: "共赴胜利！"
 china_events.22.t: "[FROM.GetNameDefCap]拒绝我们进入统一战线"
 china_events.22.d: "我们为中华民族的团结做出了最大努力，但还是遭到了[FROM.GetNameDef]的严词拒绝。看来，他们并不信任我们，[FROM.GetLeader]紧紧抱着领导统一战线的权力不放。这种叛徒行径在中国屡见不鲜，看来中国就要亡于外敌之手了。在这种时候，我们只要管好自己就行了。"
 china_events.22.a: "蠢货。叛徒。"
 china_events.23.t: "中国统一战线终结"
 china_events.23.d: "现在外敌入侵已经结束，看来中国统一战线没什么继续存在的必要了。各路军阀开始违抗中央政府的命令，疏远了[ROOT.Capital.GetCapitalVictoryPointName]方面。各派系重新开始争夺国家领导权，事情又回到了原来的样子。\n\n但是，在这场抵抗外敌的“最后一战”中，我们证明自己可以领导中国，保护她免遭敌人入侵。分裂不是天生存在，而是地方主义、自私造成的弊病。愿全国人民记住我们，还有我们取得的成就，我们很快就会再次将他们统一在一面旗帜下。"
 china_events.23.a: "愿我们笑到最后。"
 china_events.24.t: "统一战线解散"
 china_events.24.d: "现在外敌入侵已经结束，看来中国统一战线没什么继续存在的必要了。统一战线带来的团结在外敌入侵时发挥了作用，但是内部的分歧实在太大，这样一个联盟注定无法持久。现在，我们必须走自己的道路，而作为中国抵御外敌入侵的一分子，在统一战线中赢得的善意和爱国热情还将伴随我们多年。我们将因此青史留名。"
 china_events.24.a: "它曾经存在的时候还挺好的。"
 china_events.25.t: "中国统一战线成立"
 china_events.25.d: "面对外敌威胁，各路政治家、爱国者和知识分子提出，应该以共同捍卫祖国的名义，将争斗不休的中国各派系联合起来，组成中国统一战线，作为中国势力，我们当然也包括在内。[ROOT.GetRulingParty]中，许多人请求[ROOT.GetLeader]推动统一战线的成立。这种联盟固然不能天长地久，但是，兄弟阋于墙，外御其侮，保卫祖国，抵御外敌，是全体中国人的爱国义务。"
 china_events.25.a: "我们要权衡手头的选择。"
 china_events.26.t: "中国统一战线"
 china_events.26.d: "[ROOT.china_united_front_desc]"
 china_events.26.a: "[ROOT.china_united_front_option]"
 china_united_front_desc_front_leader: "在外国鬼子的侵略面前，我们成功取得了之前一直寻求的中国领导者的地位。[ROOT.GetLeader]今天在[ROOT.Capital.GetCapitalVictoryPointName]发表了一场演说，正式宣布中国统一战线成立，并号召全中国为了民族的事业团结起来。\n\n未来的战争估计无论如何都不会轻松，而我们组建的联盟可能并不够灵活协调。不过，我们的势力还是在各路军阀的帮助下得到了增强，胜算也大大提高。在战争的阴影下，中国已经做好了和侵略者做长期斗争的准备。"
 china_united_front_desc_front_member: "在外国的侵略面前，我们与很多人一起建立了中国统一战线来对抗侵略者。我们对其中最感兴趣的是，可以在纸面上建立一个统一合作的政府来协调各项活动。\n\n未来的战事也许不会一帆风顺，但一个统一的中国仍是一股不容小觑的力量。在数百万身经百战的爱国志士对外国压迫的反击下，我们定能让敌人滚出中国。为了国运、人民和未来，我们绝不会投降！"
 china_united_front_desc_possible_front_member: "中国统一战线是中国各个派系联合在一起抵抗侵略、协调防御的统一战线。尽管[ROOT.GetLeader]和他的部下还未决定是否加入，但是这并没有阻止其他人陆续加入这个联盟。\n\n我们在内部承受着巨大的压力，甚至在[ROOT.GetRulingParty]内也有着压力，人们不断施压要求我们加入保卫祖国的行列，尽管这明摆着有巨大的风险。团结起来的中国自然拥有巨大的力量，但还远远谈不上稳操胜券。同时，前线的未来也悬而未决——假如真的胜利了，又会发生什么呢？"
 china_united_front_desc_enemy: "中国的各种力量，不顾一切地拒绝我们的正当要求，这些迥然不同的军阀派系团结在一起，组成了个所谓的“中国统一战线”。发誓要赶跑我们，国家如此分裂，他们仍试图利用中国所剩下的一切资源和仅存的一丝爱国主义。\n\n尽管如此尾大不掉的联盟很难对我们的军队造成实际性威胁，但中国的团结值得我们关注，我们必须充分适应战场情况的变化，并尽可能扩大今后战役的目标范围。"
 china_united_front_desc_neutral: "在外国的入侵下，许多中国的派系已经统一成立一个“中国统一战线”进行合作。专家称虽然他们有着一个明面上的指挥结构和政府，但是实际上每个区域各自为政的状况并未改变，这可能会导致他们的军队缺乏协调性。\n\n尽管如此，这种反侵略的团结行为仍在全国各大城市引爆了民众的爱国主义情怀。尽管战线成员的诚意以及他们最终获胜的可能性都有待商榷，但中华民族已经动员起来准备战争。看上去一个统一的中国的理念还远远没有消亡，不过这场战争的结果将决定它最后的归宿。"
 china_united_front_option_front_leader: "我们要带领全国人民取得胜利！"
 china_united_front_option_front_member: "团结一心，打倒帝国主义！"
 china_united_front_option_possible_front_member: "必须尽快做出决定……"
 china_united_front_option_enemy: "让我们瞧瞧他们到底有多统一！"
 china_united_front_option_neutral: "乳虎啸谷，百兽震惶。"
 china_events.27.t: "[FROM.GetNameDefCap]要求停火并团结起来"
 china_events.27.d: "[FROM.GetNameDef]的代表指出，国家正面临外敌威胁，而国内各势力却争斗不休。他坚持要求我们立即签署停火协议，并允许冲突中的优势方制定有限的停火条件。正常情况下，就这样停火，给敌人有喘息机会只会带来灾难性的后果，但在现在这种情况下，继续打下去的选择也好不到哪里去。\n\n在这个爱国热情空前高涨的时代，抗敌统一战线正在形成，如果我们拒绝停火，就意味着会被视为汉奸，招致统一战线的蔑视。冲突即将到来，如果不采取类似的和平方法，我们很可能最终要面对整个统一战线，这种后果比我们最初讨价还价时要严重得多。"
 china_events.27.a: "我们不情愿，但接受。"
 china_events.27.b: "我们执意拒绝。"
 china_events.28.t: "[FROM.GetNameDefCap]接受停火"
 china_events.28.d: "[FROM.GetLeader]也同意，国难当前，国家需要团结，因此他与我们统一战线的代表签署了停火协议。在大多数地方，部队回到了实控线，过程中有些许摩擦，不过总体上是和平的。在这危急时刻，[FROM.GetAdjective]选择了理性，真是国家之幸。"
 china_events.28.a: "这……可以接受。"
 china_events.29.t: "[FROM.GetNameDefCap]拒绝停火"
 china_events.29.d: "国家危难之际，[FROM.GetLeader]却固执地拒绝签署任何停火协议，结束中华民族的内战。因此，他们事实上已经投敌，成了侵略者的战友。我们别无选择，只能对他们开战，把这群破坏团结的、自私的叛徒赶走。敌人还在壮大，但我们相信[FROM.GetAdjective]的边界内一定还有许多人等待着解放。"
 china_events.29.a: "可恨的汉奸！"
 china_events.30.t: "东北方略"
 china_events.30.d: "随着日德东洋战争爆发，日本在中国东北地区的利益变得格外脆弱。[FROM.GetNameDef]趁机向日本及其盟友同时宣战，并号召爱国者们一同反抗日本帝国主义。他们呼吁全中国人民团结起来，共同抵抗日本帝国主义，并提议正在交战中的各个势力为了共同的国家安全组成统一战线。他们还警告说，若是[FROM.GetAdjective]政府垮台，日本人将轻而易举地将中国其余地区分而治之。\n\n他们的方略使大部分残余的割据军阀和逐鹿势力陷入了困境。若是接受这一方略，无疑将被卷入一场自己可能尚未做好准备的重大冲突，可若是拒绝，则会被描绘成日本人的狗腿子，并遭到千夫所指。尽管很多人抱怨称这是[FROM.GetRulingParty]为保全自身利益而狗急跳墙，但恐怕我们别无选择，只能同意组建临时联盟来共同抗击侵略者。"
 china_events.30.a: "我们要权衡手头的选择。"
 china_events.31.t: "中国介入东洋战争"
 china_events.31.d: "[ROOT.china_enters_great_seas_war_desc]"
 china_events.31.a: "[ROOT.china_united_front_option]"
 china_enters_great_seas_war_desc_front_leader: "为了解放全中国，我们成功取得了之前一直寻求的中国领导者的地位。[ROOT.GetLeader]今天在[ROOT.Capital.GetCapitalVictoryPointName]发表了一场演说，正式宣布中国统一战线成立，并号召全中国为了民族的事业团结起来。\n\n未来的战争估计无论如何都不会轻松，而我们组建的联盟可能并不够灵活协调。不过，我们的势力还是在各路军阀的帮助下得到了增强，胜算也大大提高。在战争的阴影下，中国已经做好了和侵略者做长期斗争的准备。"
 china_enters_great_seas_war_desc_front_member: "为了解放全中国，我们与很多人一起建立了中国统一战线来对抗侵略者。我们对其中最感兴趣的是，可以在纸面上建立一个统一合作的政府来协调各项活动。\n\n未来的战事也许不会一帆风顺，但一个统一的中国仍是一股不容小觑的力量。在数百万身经百战的爱国志士对外国压迫的反击下，我们定能让敌人滚出中国。为了国运、人民和未来，我们绝不会投降！"
 china_enters_great_seas_war_desc_possible_front_member: "中国统一战线是中国各个派系联合在一起抵抗日本帝国主义、协调解放东北的统一战线。尽管[ROOT.GetLeader]和他的部下还未决定是否加入，但是这并没有阻止其他人陆续加入这个联盟。\n\n我们在内部承受着巨大的压力，甚至在[ROOT.GetRulingParty]内也有着压力，人们不断施压要求我们加入解放祖国的行列，尽管这明摆着有巨大的风险。团结起来的中国自然拥有巨大的力量，但还远远谈不上稳操胜券。同时，战线的未来也悬而未决——假如真的胜利了，又会发生什么呢？"
 china_enters_great_seas_war_desc_enemy: "中国的各种力量利用我们与德国交战中暴露出的弱点，这些迥然不同的军阀派系团结在一起，组成了个所谓的“中国统一战线”。发誓要将我们赶出满洲，国家如此分裂，他们仍试图利用中国所剩下的一切资源和仅存的一丝爱国主义。\n\n尽管如此尾大不掉的联盟很难对我们的军队造成实际性威胁，但中国的团结值得我们关注，我们必须充分适应战场情况的变化，并尽可能扩大今后战役的目标范围。"
 china_enters_great_seas_war_desc_neutral: "趁着日本与德国交战而自顾不暇，许多中国的派系已经统一成立一个“中国统一战线”进行合作。专家称虽然他们有着一个明面上的指挥结构和政府，但是实际上每个区域各自为政的状况并未改变，这可能会导致他们的军队缺乏协调性。\n\n尽管如此，这种反日本帝国主义的团结行为仍在全国各大城市引爆了民众的爱国主义情怀。尽管战线成员的诚意以及他们最终获胜的可能性都有待商榷，但中华民族已经动员起来准备战争。看上去一个统一的中国的理念还远远没有消亡，不过这场战争的结果将决定它最后的归宿。"
 china_events.40.t.first_step: "[ROOT.GetAdjective]军事改革"
 china_events.40.d.first_step: "我们已经迈出了军事改革的第一步，建立了一个集中的官僚机构来统筹后勤、补给和经费。而且还建立了一个用以处理此项目的委员会，据说由[ROOT.GetLeader]亲自选出来的可靠人员正在有条不紊地工作。这为未来的军队改革打下了基础，对我们的军队进入现代化战争的时代十分重要。"
 china_events.40.t.second_step: "军事改革大步前进！"
 china_events.40.d.second_step: "我们已经在改进军队素质这一块迈出了最初几步，更多的改革方案随之而来。原先的地方民团已被打乱并重组，其中的一些军官因贪污而被开除。训练方式也被从头修改了一遍，以确保将士们能够迅速适应现代科技。\n\n尽管老近卫军们，尤其是那些从之前我们部队的地区性特征中获益的人对此牢骚满腹、从前那个东拼西凑的东西在过去的军阀时代有时更加高效，但是在我军的未来中，它没有容身之地。"
 china_events.40.t.third_step_officers: "[ROOT.GetAdjective]军队的新气象"
 china_events.40.d.third_step_officers: "经过长时间的努力，我们终于彻头彻尾地改革了我们的军队。改造了军队的主干后，我们现在要开始整合收编的盟军和其他辅助部队，这可是件苦差事。\n\n总参谋部倒是兴奋报告了他们过去几个月取得的成就。尽管有吃空饷、贪军费和逃兵的问题，但这丝毫掩盖不了我们的巨大进步。"
 china_events.40.t.third_step_finished: "[ROOT.GetAdjective]军队的新曙光"
 china_events.40.d.third_step_finished: "经过漫长的改革后，中国的核心军队已经彻底焕然一新。曾经充满吃空饷、逃兵、劫掠的封建军队体系已经彻底消失，取而代之的是一支能够与欧洲日本相媲美的职业军队。如今，我们的军队已经焕然一新，他们枕戈待旦，做好了随时统一中国的准备，并向世界证明，中国军队是世界上不可忽视的一股力量！"
 china_events.40.a: "即使是在战场之外，我们的军队也会带着胜利凯旋。"
 china_events.41.t.army_reform_ongoing: "打扫干净屋子再捉耗子"
 china_events.41.d.army_reform_ongoing: "尽管军阀混战时期出现了大量经验老道的军官，但过去几年间，中国军队的质量依旧下滑严重。贪污腐败层出不穷，徇私枉法和任人唯亲更是家常便饭。\n\n为了改革军队我们打算清理吃空饷、制止开小差，并消除荫护关系，这需要一套运转良好的问责制度。为此我们培训了一批新军官，对他们灌输了爱国教育，希望相比于老前辈们这些新人能抵挡住金钱的诱惑。"
 china_events.41.t.army_reform_finished: "[ROOT.GetAdjective]军队的新曙光"
 china_events.41.d.army_reform_finished: "$china_events.41.d.army_reform_ongoing$\n\n这些军官加入了一支由内而外彻底改革的现代化新军队来解放他们的国家。在我们的努力下，这支专业的军队强而有力，完全可以和欧洲与日本的军队相媲美。有他们在，中国将不再被分裂和羞辱！"
 china_events.41.a: "新中国的新一代军官。"
 china_events.50.t: "新首都"
 china_events.50.d: "中华归于一统，终于该选定中央政府的永久驻地了。作为强有力的首都竞争者，北京是个自然的选择，过去几个世纪里，这座古城一直是中国的首都，选择这里，代表着从旧时代向新时代自然而稳定地过渡。然而，这种选择也会和目的本身背道而驰，因为北京与帝制和失败的北洋政府深深联系在一起。此外，定都北京还略微会有强调北方主导政坛的意味。\n\n坐落于长江之滨的南京是另一个选择，这里更靠近华中地区，是明朝的都城之一。袁世凯篡夺辛亥革命果实前，民国首都也坐落于此，在民族主义者和共和派心目中，南京具有重大的地位。\n\n与南京类似，地处内陆的武汉也是一个选择。推翻帝制的辛亥革命，第一枪就是武昌起义打响的，因此武汉堪称辛亥革命的中心，这种象征意义让寻求打破现状的革命者多热衷于选择此地。\n\n广州是一个有争议的选择，这座大型港口城市是华南地区的经济中心，一直是共和革命运动的传统温床。国民党和联省运动都在此扎根，自护法运动起，这两个党派的许多领导人就在此长大，或者接受训练。\n\n当然，潜在首都清单中还有一些城市，不过随着讨论接近尾声，名单正迅速缩短。经过进一步商议，[ROOT.GetAdjective]决定……"
 china_events.50.a: "定都[GetVictoryPointName_9843]。"
 china_events.50.b: "定都南京。"
 china_events.50.c: "定都武汉。"
 china_events.50.e: "定都广州。"
 china_events.50.f: "留在[ROOT.Capital.GetCapitalVictoryPointName]。"
 china_events.51.t: "[ROOT.Capital.GetCapitalVictoryPointName]声望日增"
 china_events.51.d: "在我们最大的对手消失后，大多数观察家已将目光转向[ROOT.GetLeader]和[ROOT.GetRulingParty]，认为他们最有可能将中国重新统一于一面旗帜之下。前政府的外国大使馆已经开始转而承认我们的政府，外交部相信我们很快就会获得广泛的国际承认。在国内，我们的合法性也得到了提升，这为我们统一国家铺平了道路。\n\n不过，这种局面也是岌岌可危的，广州和北洋政府的政权更迭已经证明了这一点。枪打出头鸟，威胁不仅来自于国内的敌对派系，也来自于那些期望中国政府偿还长期拖欠贷款的外国债权人。除此之外，随着国家统一的外部威胁逐渐减弱，这也会导致我们内部产生嫉贤妒能和狼子野心。[ROOT.GetLeader]应当清楚地意识到，我们取得的胜利远非高枕无忧。然而，只要我们齐心协力，胜利便会触手可及。但接下来可就到了最困难的部分……"
 china_events.51.a: "还有谁敢和我们作对？"
 china_events.52.t: "临时首都？"
 china_events.52.d: "我们的军队正稳步前进，手中地盘的增加带来了后勤和行政上的压力，是时候讨论将中枢迁出[ROOT.Capital.GetCapitalVictoryPointName]的事宜了。目前的首都曾经发挥了重要作用，也是我们的政治中枢，但地方色彩似乎过于浓厚，向北迁都，选择一个更加靠北方的城市，也许能为我们带来战略和政治上的优势。\n\n过去几个世纪里，北京这座古城一直是中国的首都，作为强有力的首都竞争者，定都于此标志着历代中央政府权威的延续，但也会将我们与失败的北洋政府，也就是长期以来广州政府的死对头联系在一起。偏北的位置导致其容易受到来自东北的攻击，不过山脉与河流的阻隔会让它成为一个易守难攻的据点。\n\n武汉是辛亥革命肇始之地，由武昌、汉口和汉阳三座城镇组成，坐落于长江中游要冲，九省通衢，为全国之中心。这里有长江、汉江的保护，深居内陆腹地，还有着汉阳兵工厂的加持，因此吴佩孚长期将中枢设于此地。\n\n南京是孙中山先生就任民国临时大总统的地方，也是他去世后的陵寝所在。它位于富庶的江南，是东南地区的中心，在孙传芳治下，这里的工业有了长足发展，是临时首都的另一个有力竞争者。"
 china_events.52.a: "北京，传统之京城。"
 china_events.52.b: "武汉，革命之起源。"
 china_events.52.c: "南京，富饶之港城。"
 china_events.52.e: "还是留在[ROOT.Capital.GetCapitalVictoryPointName]吧。"
 china_events.60.t: "中央政府要求管辖北京"
 china_events.60.d: "革命联军大获全胜，顺利推翻了北京的对立政府。我方行政人员怀着为国为民的自豪之心，正在北京着手开展恢复秩序的必要工作。北京在中国历史上的地位举足轻重，是为我国的一大古都，夺取北京为[FROM.GetNameDef]和[ROOT.GetLeader]带来了极大合法性。\n\n我们的盟友有感于当前形势，对我方意图起了疑心。值得注意，[FROM.capital.GetCapitalVictoryPointName]的报纸已不再提及[ROOT.GetLeader]或[ROOT.GetRulingParty]，这一信号说明他们开始对此不满。他们还派出了一些己方的代表，毫不掩饰地试图扳倒我们已经任命的行政班子，在我方控制地区争抢地方行政权力。\n\n情况变得愈发棘手，最终[FROM.GetLeader]打来一通私人电话，要求我们将北京地区交给民国中央政府直接管辖。这种侵犯地方自治权的行为严重损害了我方政府权威，但他们似乎不打算在这场冲突中退缩。我们可以选择高风亮节地交出管辖权，但这也许会让我们从此不得翻身。不过，[ROOT.GetLeader]的眼中闪烁着野心之火。北京是一座伟大的城市，在这里倒戈相向的所谓革命联盟也不少我们这一家。"
 china_events.60.a: "行吧，我们让出北京。"
 china_events.60.b: "我们的自治权不容侵犯！"
 china_events.61.t: "[FROM.GetNameDefCap]让出北京"
 china_events.61.d: "在中央政府的不断施压下，[FROM.GetLeader]和[FROM.GetName]已同意将北京及其周边地区交由中央政府管辖。一大批行政人员已于今日早些时候抵达正阳门东车站，履行城市的管理职责，不过这只是走个形式而已。在这批人到来之前，许多中央政府军官和其他代表已就确保交接过程平稳进行忙碌许久。随着我军击破强敌、光复旧都，我们终于可以着手准备，推进国家统一事业了。"
 china_events.61.a: "理所应当。"
 china_events.62.t: "[FROM.GetLeader]冲击我们的合法性"
 china_events.62.d: "尽管我们已成功让[FROM.GetLeader]与[FROM.GetName]的[FROM.GetRulingParty]归顺，但那些狡猾的军阀似乎桀骜难驯，难以指望其长久顺从。如此局面虽可叹可悲，但仍在预料之内，在这个动荡年代，中华的统一本就脆弱不堪，群雄逐鹿之际，诸多省份仍利用各方矛盾维持高度自治权。\n\n然而[FROM.GetLeader]却另有所图。若情报属实，其不仅企图削弱中央政府对[FROM.Capital.GetCapitalVictoryPointName]的掌控，更意图颠覆整个中央政府，公然质疑我们的法理，甚至抛出大逆之问：可有更优之选？答案非[FROM.GetLeader]莫属。"
 china_events.62.a: "我们最好不要放松警惕。"
 china_events.63.t: "[FROM.GetLeader]施压令我们采取行动！"
 china_events.63.d: "自1911年以来，统一问题始终困扰着中国历任领导人。尤其是国家分裂为南北政权，并由此进一步碎裂成各地军阀割据之后。通过谈判调解交战各方的努力已数次破裂，如今已几无协商的余地。我们前进的唯一道路，便是团结本政府之力，以武力统一全国。\n\n然而并非所有追随者都对我们的进程感到满意。尽管[ROOT.GetLeader]及政府高层始终在行动时力求审慎行事，但诸多地方大员们仍抱怨统一之梦日渐遥远。[FROM.GetLeader]更趁势煽动不满引发骚乱，暗示我们是在故意拖延以便从各省榨取更多财赋。一方是要求迅速统一的民族派，另一方是厌倦等待的地方派，在两者双重压力下我们已难再踌躇迟疑，必须要采取果断措施，推进国家统一进程。"
 china_events.63.a: "倘若时机一到……"
 china_events.64.t: "[FROM.GetLeader]继续施压"
 china_events.64.d: "随着[FROM.GetLeader]及[FROM.GetAdjective]政府加入，舆论要求我们采取行动实现国家统一的呼声愈发高涨。无论其动机是真诚希望国家早日统一，还是出于削弱破坏我方努力的私心，这都已对我们政府的形象构成严重损害。这也意味着此喧嚣之声在短期内恐怕难以平息。"
 china_events.64.a: "已经在努力了！"
 china_events.100.t: "[FROM.GetNameDefCap]要求我们合并"
 china_events.100.d.independent: "1911年辛亥革命导致清朝土崩瓦解，我们也因此有了机会建立独立的主权国家，虽然我们曾被迫向中国朝廷屈膝称臣，但中国霸权的崩溃给了我们转机，我们的民族和文化认同得以重建。\n\n很不幸，我们最害怕的梦魇回来了，[FROM.GetNameDef]要求我们立即投降并接受中国的吞并。如今我们无依无靠，没有任何国家愿意保障我们的独立，一旦与[FROM.GetNameDef]开战，我们将孤军作战。虽然我国的鹰派分子要求我们反击，抵抗中帝国主义，但也有很多政客认为，现在倒戈卸甲，以礼归降，我们就能得到中国政府的优待。"
 china_events.100.d.is_puppet: "1911年辛亥革命导致清朝土崩瓦解，我们也因此有了机会建立独立的主权国家，虽然我们曾被迫向中国朝廷屈膝称臣，但中国霸权的崩溃给了我们转机，我们的民族和文化认同得以重建。\n\n很不幸，我们最害怕的梦魇回来了，[FROM.GetNameDef]要求我们立即投降并接受中国的吞并。尽管事已至此，我们并非孤军奋战，[THIS.overlord.GetNameDef]已承诺保障我们的独立，希望中国人让步。我国的鹰派分子要求我们反击，抵抗中帝国主义，并请求[THIS.overlord.GetNameDef]代表我国出面干涉。但也有很多政客认为，现在倒戈卸甲，以礼归降，我们就能得到中国政府的优待。"
 china_events.100.d.was_puppet: "1911年辛亥革命导致清朝土崩瓦解，我们也因此有了机会建立独立的主权国家，虽然我们曾被迫向中国朝廷屈膝称臣，但中国霸权的崩溃给了我们转机，我们的民族和文化认同得以重建。\n\n很不幸，我们最害怕的梦魇回来了，[FROM.GetNameDef]要求我们立即投降并接受中国的吞并。我们本以为[THIS.overlord.GetNameDef]会保护我们，但天不遂人愿，他们已经发表了中立声明。虽然我国的鹰派分子要求我们反击，抵抗中帝国主义，但也有很多政客认为，现在倒戈卸甲，以礼归降，我们就能得到中国政府的优待。"
 china_events.100.d.is_in_faction: "1911年辛亥革命导致清朝土崩瓦解，我们也因此有了机会建立独立的主权国家，虽然我们曾被迫向中国朝廷屈膝称臣，但中国霸权的崩溃给了我们转机，我们的民族和文化认同得以重建。\n\n很不幸，我们最害怕的梦魇回来了，[FROM.GetNameDef]要求我们立即投降并接受中国的吞并。事已至此，我们仍有一线希望，[ROOT.FactionLeader.GetName]承诺过在中国入侵时全力支持我们。希望他们能认同我们的求援，保卫我们不再丧失独立。"
 china_events.100.d.was_in_faction: "1911年辛亥革命导致清朝土崩瓦解，我们也因此有了机会建立独立的主权国家，虽然我们曾被迫向中国朝廷屈膝称臣，但中国霸权的崩溃给了我们转机，我们的民族和文化认同得以重建。\n\n不幸的是，我们最害怕的梦魇回来了，[FROM.GetNameDef]要求我们立即投降并接受中国的吞并。更糟糕的是，[ROOT.FactionLeader.GetName]在即将到来的冲突中公开宣布中立，拒绝在生存之战中支持我们，看来我们别无选择，只能战斗到最后一刻。"
 china_events.100.a: "我们必须立即投降。"
 china_events.100.b: "作为交换，要求自治权。"
 china_events.100.c: "向他们妥协，割让汉地以换取独立。"
 china_events.100.d: "向俄罗斯寻求干涉。"
 china_events.100.e: "向印度寻求干涉。"
 china_events.100.f: "我们绝不投降！"
 china_events.100.g: "向[THIS.overlord.GetNameDef]寻求干涉。"
 china_events.100.h: "向[ROOT.FactionLeader.GetNameDef]寻求干涉。"
 china_events.101.t: "[FROM.GetNameDef]投降"
 china_events.101.d: "面对我们压倒性的政治和军事力量，[FROM.GetNameDef]看清形势，同意谈判。他们不愿流血，也不愿冒被摧毁的风险，因此同意按照我们的要求无条件投降。我们决定尊重这块失地的文职政府和平民，此后，他们的政府正式投降，和平移交权力，这片土地重回中国怀抱。长期分裂的国家即将统一，全国各地民众无不欢庆。"
 china_events.101.a: "得胜而归！"
 china_events.102.t: "[FROM.GetNameDefCap]要求自治"
 china_events.102.d: "面对我们压倒性的政治和军事力量，[FROM.GetNameDef]看清形势，同意谈判。他们不愿流血，也不愿冒被摧毁的风险，但仍然想要保持某种程度的尊严和独立，因此提出以投降换取自治。他们要求作为主权实体，在我国法律框架以外继续运作，但市场与我们全面联系在一起、政治上完全与我们保持一致。我们当然将这片土地视为中国不可或缺的一部分，但我们也可以理解他们的诉求，尊重他们在我们影响下自治的愿望。其他民族主义者认为，既然我们在谈判中占据优势，至少应该要求他们归还汉族占多数的地区，这样我们才能鼓励人们移民边疆。此外，政府中的鹰派要求立即开战，他们认为[FROM.GetNameDef]根本无力阻挡我军的脚步。"
 china_events.102.a: "我们接受他们的自治请求。"
 china_events.102.b: "窃据的汉地必须归还！"
 china_events.102.c: "这意味着战争！"
 china_events.103.t: "[ROOT.GetNameDefCap]自治"
 china_events.103.d.default: "看来，与[FROM.GetNameDef]的谈判进展顺利。或许是因为面临国际压力和批评，中国政府同意给予我们完全自治，没有附加条件——只要在经济和政治上与中国势力圈保持联系就行了。这是一次伟大的胜利，既避免了流血冲突，又让我们的独立性得到了承认和尊重。"
 china_events.103.d.kept_lands: "看来，与[FROM.GetNameDef]的谈判进展顺利。或许是因为面临国际压力和批评，中国政府同意给予我们完全自治，没有附加条件——只要在经济和政治上与中国势力圈保持联系就行了。他们最初要求他们口中的“汉地”，但似乎也有所缓和——也许是为了博得我们的好感。这是一次伟大的胜利，既避免了流血冲突，又让我们的独立性得到了承认和尊重。"
 china_events.103.a: "危机结束了！"
 china_events.104.t: "[FROM.GetNameDefCap]要求以“归还汉地”换取自治"
 china_events.104.d: "在与[FROM.GetNameDef]的谈判中，中国政府同意给予我们的政府和国家自治，前提是我们割让他们宣布的汉族占多数的领土。这些地区明显是我们的，但政府中的和平主义者敦促领导层接受这个要求，避免流血冲突，诚然，我们把一些土地割让给了中国人，但至少核心领土和人民可以享受不被中国统治的独立带来的好处。政府内部的民族主义者谴责这一想法，声称我们应该在谈判桌上受到平等对待。汉人有句话说“得陇望蜀”，如果割给他们土地，总有一天我们的领土会全部丢光。"
 china_events.104.a: "接受他们的要求。"
 china_events.104.b: "我们绝不把自己的土地送给那些殖民者！"
 china_events.105.t: "[FROM.GetNameDefCap]归还汉地"
 china_events.105.d: "我们与[FROM.GetNameDef]的谈判进展顺利，他们已经派出大使来到我们的首都，讨论争议土地的问题。可能是见势不妙，他们同意割让所有汉地来换取在我们势力范围内的自治。我们将同意他们的提议，接受投降。这一事件表明，我们现在完全有能力在亚洲投射力量。"
 china_events.105.a: "无论如何，我们都将尊重条约。"
 china_events.106.t: "[FROM.GetNameDefCap]拒绝归还汉地"
 china_events.106.d: "我们与[FROM.GetNameDef]的谈判进展不顺，在许多关键问题上，他们的大使依然做出了目中无人的回应：[FROM.GetAdjective]顽固不化，拒绝割让任何领土，汉人占多数的领土也不例外，并且他们还坚持最初的条件——在我们的势力范围内自治。如果同意，我们能最大限度地减少他们的抵抗，但可能会给未来的伙伴关系带来挥之不去的问题；而一些人怀疑，以他们的实力是否真的配提出那样的条件。"
 china_events.106.a: "允许他们保留这些土地。"
 china_events.106.b: "中止谈判。"
 china_events.107.t: "[FROM.GetNameDefCap]提出“汉地换自治”"
 china_events.107.d: "在我们与[FROM.GetNameDef]正在进行的谈判中，他们同意割让我们宣称的拥有大量汉族的土地，作为交还，他们要求我们放弃对他们核心领土的所有主张，并尊重和承认他们的国家主权。一些温和派同意这个提议，但民族主义者认为，这些土地是中国不可分割的领土，一旦失去，外国势力可能会利用它们来对付我们。因此，这些民族主义者请求政府采取更强硬的立场来解决危机。"
 china_events.107.a: "接受对方的提议。"
 china_events.107.b: "那些土地是中国的！"
 china_events.108.t: "[FROM.GetNameDefCap]同意“汉地换自治”"
 china_events.108.d: "在我们与[FROM.GetNameDef]正在进行的谈判中，他们接受了我们的和平提议。我们将割让他们宣称有大量汉族的土地。作为交还，他们同意放弃对我们核心领土的所有主张，并尊重和承认我们的国家主权。虽然和平主义者和温和派对这一举措表示赞赏，但政府内部也有人主张拒绝这一提议，因为中国可能会得寸进尺，在未来继续索取更多东西，他们认为我们应该继续抵抗和战斗，而不是向中帝国主义投降。"
 china_events.108.a: "我们时代的和平。"
 china_events.108.b: "寸步不让！"
 china_events.109.t.from_russia: "俄罗斯拒绝提供保护"
 china_events.109.d.from_russia: "我们有一个地跨两大洲的强大邻国——俄罗斯，这个古老的国家被称为东方巨熊。虽然在1904年的日俄战争中遭受羞辱，并且在世界大战后因革命和内战而更加屈辱，但如今，俄罗斯已经在世界舞台上复兴。在这场与中国政府之间的危机中，我们也许可以寻求他们的保护。\n\n但是，俄罗斯人拒绝回应我们的求助。也许他们已经与中国人秘密地宣判了我们的命运，又或许他们在西方有更要紧的担忧。\n\n[china_offers_available_paragraph]\n\n[china_seek_protection_paragraph]"
 china_events.109.t.from_india: "印度拒绝提供保护"
 china_events.109.d.from_india: "近来，印度这个古老的国家重新统一。他们可能对中国的雄心构成相当大的威胁，并成为中国工业和人口的潜在竞争对手，甚至超越中国。由于急需帮助，我们已经派出了谈判代表，寻求印度的干预，防止中国侵略我们，或者侵占边境地区。\n\n但是，印度人拒绝回应我们的求助。也许他们已经与中国人秘密地宣判了我们的命运，又或许他们在其他地方有更要紧的担忧。无论如何，看起来我们都得靠自己了。\n\n[china_offers_available_paragraph]\n\n[china_seek_protection_paragraph]"
 china_events.109.t.from_china_refused_autonomy: "中国拒绝给予自治"
 china_events.109.d.from_china_refused_autonomy: "今天，令人沮丧的消息从[FROM.GetNameDef]传来：中国拒绝了我们的自治提议。也许，如果我们愿意割让他们所说的“汉地”，他们就可能会考虑我们保持独立的可能性。无论他们怎么回答，我们都必须做好最坏的打算。\n\n[china_offers_available_paragraph]\n\n[china_seek_protection_paragraph]"
 china_events.109.t.from_china_refused_lands: "中国拒绝“汉地换自治”"
 china_events.109.d.from_china_refused_lands: "我们慷慨地提出割让所谓“有大量汉族”的土地，可[FROM.GetNameDef]却断然拒绝了我们“汉地换自治”的请求。看来，除了抵抗、反击这种打着幌子公然侵犯我国家主权的行为外，我们没有太多选择。\n\n[china_offers_available_paragraph]\n\n[china_seek_protection_paragraph]"
 china_events.109.t.from_china_refused_both: "中国发出最后通牒"
 china_events.109.d.from_china_refused_both: "今天，我们收到了一个重大消息：[FROM.GetNameDef]既拒绝了我们的自治提议，也拒绝了我们“汉地换自治”的提议。谈判破裂后，他们的大使向我们的政府递交照会，要求我们立即投降，放弃所有“国家政府”的概念，回到前民国时期的边界，成为大中华国家的一部分。我们只有两个选择：要么为了避免流血而投降，要么抵抗到底。\n\n[china_offers_available_paragraph]\n\n[china_seek_protection_paragraph]"
 china_offers_available_paragraph_autonomy_lands: "随着那些中国人入侵我们的边界并吞并我们的领土，我们的独立前景似乎变得暗淡。政府内的一些实用主义者建议我们割让那些汉人聚居的领土。这样也许能安抚中国人和他们对我们主权的帝国主义野心，但不战而退对我国的威严将是一次打击。"
 china_offers_available_paragraph_autonomy_refused_lands: "我们与[FROM.GetNameDef]的谈判并未如期顺利进行。虽然我们慷慨地提出割让汉人聚居的土地，但中国代表断然拒绝了我们的提议——他们要我们彻底屈服于他们那复兴的帝国主义。\n\n我们政府中的鹰派大声疾呼应该拒绝中国的任何进一步条款并且准备与[FROM.GetNameDef]作战。但政府中的实用主义者同和平主义者则请求我们向[FROM.GetNameDef]递交意见书来换取自治权。"
 china_offers_available_paragraph_autonomy: "与[FROM.GetNameDef]的谈判并未如期进行。很明显中国人要我们要么投降，要么灭亡。为了避免打一场毫无胜算而又对人民造成毁灭性损失的仗，我们的领导层决定向中国政府递交一份意见书来换取中国势力范围中的一个自治国的地位。"
 china_offers_available_paragraph_lands: "与[FROM.GetNameDef]的谈判并未如期进行。很明显中国人要我们要么投降，要么灭亡。为了避免打一场毫无胜算而又对人民造成毁灭性损失的仗，我们的领导层向中国政府提议割让他们宣称的汉人聚居的领土。虽然这样做可能很丢脸，但我们只能两害相权取其轻。"
 china_seek_protection_paragraph_intro: "虽然我们长期在与中国霸主的压迫作斗争，但地缘政治的变换也带来了一个全新的机遇。在遥远的北方，有一个复兴的[RUS.GetNameDef]政权正在寻求重申欧亚大陆的霸权，而毫无疑问他们就将成为我们最强大的盟友。印度人也刚刚统一了他们在南亚大陆的国家——而印度也肯定很想遏制中国人的扩张主义。或许我们可以向这些崛起的大国寻求保护，使边界免遭中国的侵害。"
 china_seek_protection_paragraph_refused_both: "$china_seek_protection_paragraph_intro$\n\n对我们来说不幸的是，两方都拒绝了我们援助的请求。看起来我们只能靠自己了。"
 china_seek_protection_paragraph_refused_russia_socialist_india: "$china_seek_protection_paragraph_intro$\n\n不幸的是，俄国人已经拒绝了我们的提议。但我们仍可以向[HND.GetNameDef]寻求保护和援助，尽管作为代价，他们要求我国政府全盘接受其社会主义理念。对此国内保守派已发出反对声音——但如果我们需要一个国际盟友，恐怕选项不是太多。"
 china_seek_protection_paragraph_refused_russia_default_india: "$china_seek_protection_paragraph_intro$\n\n对我们来说不幸的是，俄国人对我们的情愿不屑一顾，但印度政府似乎乐于接受我们的对保障独立的请求。我们希望他们能明白事理愿意保卫我们的民族自决。"
 china_seek_protection_paragraph_refused_india_socialist_russia: "$china_seek_protection_paragraph_intro$\n\n不幸的是，印度人已经拒绝了我们的提议。尽管条件苛刻，我们仍可以向[RUS.GetNameDef]寻求援助，代价是我国将作为一个社会主义盟友，完全被划入社会主义俄罗斯政府的势力范围。对此国内保守派已发出反对声音——但如果我们需要一个国际上的庇护人，恐怕选项不是太多。"
 china_seek_protection_paragraph_refused_india_default_russia: "$china_seek_protection_paragraph_intro$\n\n不幸的是，印度人已经驳回了我们的请求。但俄罗斯政府似乎仍对我们的提议持开放态度。让我们希望他们看到其中合理之处，并在我们的民族自决权问题上回心转意，提供保护。"
 china_seek_protection_paragraph_socialist_russia_socialist_india: "$china_seek_protection_paragraph_intro$\n\n社会主义的[HND.GetNameDef]和[RUS.GetNameDef]都表达了对我们民族自决和生存权利的支持，以及保护我国合法权利的兴趣。但与他们结盟将带来额外要求，他们要求我们参与其革命事业并建立一个左翼或社会主义政府。对此国内保守派已经发出了反对声音——但或许为了保护国家免受侵略，这样做是必要的。"
 china_seek_protection_paragraph_default_russia_socialist_india: "$china_seek_protection_paragraph_intro$\n\n俄国人表示有兴趣保护我们的边界和国家主权，但[HND.GetNameDef]也向我们的大使发出了善意的照会和潜在的友谊承诺。如果我们与印度人结盟，他们可能会寻求干预我方内政，要求我们分享其革命色彩并建立一个左派政府。这可能会激怒保守派，但为保护国家免于侵略，这样做是必要的。"
 china_seek_protection_paragraph_socialist_russia_default_india: "$china_seek_protection_paragraph_intro$\n\n印度人表示有兴趣保护我们的边界和国家主权，但[RUS.GetNameDef]也向我们的大使发出了善意的照会和潜在的友谊承诺。如果我们与俄国人结盟，他们可能会寻求干预我方内政，要求我们分享其革命色彩并建立一个左派政府。这可能会激怒保守派，但为保护国家免于侵略，这样做是必要的。"
 china_seek_protection_paragraph_default_both: "$china_seek_protection_paragraph_intro$\n\n俄罗斯政府和印度政府都表示有兴趣保护我们的国家主权，他们希望限制中国的扩张主义。现在我们可以与国内领导层协商，以确定国家应该采取的道路。不过我们大可以放下心来：我们已经拥有了坚强的后盾，来挫败中国人夺取我们国家的图谋。"
 china_seek_protection_paragraph_russia_socialist: "我们长期以来都在对抗中国的霸权压迫，如今世界局势的发展给予了我们全新的机会。在遥远的北方，复兴的[RUS.GetNameDef]正在试图重建它在欧亚的霸权，因此俄罗斯毫无疑问地就成为了我们可以争取的完美盟友。但如果我们要与俄罗斯结盟，俄罗斯人可能会要求我们加入他们的革命并建立一个左派政府。这可能会激怒保守派，但为了国家的存续，我们只能这样做。"
 china_seek_protection_paragraph_russia_default: "我们长期以来都在对抗中国的霸权压迫，如今世界局势的发展给予了我们全新的机会。在遥远的北方，复兴的[RUS.GetNameDef]正在试图重建它在欧亚的霸权，因此俄罗斯毫无疑问地就成为了我们可以争取的完美盟友。在他们的帮助下，我们也许可以在中国人的手中保卫自己的边疆。"
 china_seek_protection_paragraph_india_socialist: "我们长期以来都在对抗中国的霸权压迫，如今世界局势的发展给予了我们全新的机会。南亚的印度新近统一，它同样也渴求遏制中国的扩张主义。但如果我们要与印度结盟，印度人可能会要求我们加入他们的革命并建立一个左派政府。这可能会激怒保守派，但为了国家的存续，我们只能这样做。"
 china_seek_protection_paragraph_india_default: "我们长期以来都在对抗中国的霸权压迫，如今世界局势的发展给予了我们全新的机会。南亚的印度新近统一，它同样也渴求遏制中国的扩张主义。在他们的帮助下，我们也许可以在中国人的手中保卫自己的边疆。"
 china_events.109.a: "我们必须立即投降。"
 china_events.109.b: "请求自治作为交换。"
 china_events.109.c: "向他们妥协，割让汉地以换取独立。"
 china_events.109.d: "我们将向俄国政府寻求帮助。"
 china_events.109.e: "我们将向印度政府寻求帮助。"
 china_events.109.f: "我们决不投降！"
 china_events.110.intro: "我们收到了来自[FROM.GetNameDef]的紧急请求，他们想要我们的保护，以免受中国领土收复主义和扩张主义的侵害。该地区名义上属于清朝势力范围，并于1911年革命后独立，其中的许多人不希望回归中国。因此，他们与我国政府展开接洽，希望我们能在危急时刻提供帮助。"
 china_events.110.t: "[FROM.GetNameDefCap]请求从中国手里保护他们"
 china_events.110.d.russia_already_guaranteed: "$china_events.110.intro$\n\n目前，我们已经保障[FROM.GetNameDef]的独立，自然可以帮助他们抵抗中国的扩张主义。但是，政府中也有人认为，应付业已统一的中国会让我们精疲力竭，陷入旷日持久的战争。毫无疑问，中国人不会拒绝让步，我国还有其他威胁要应对。"
 china_events.110.d.russia: "$china_events.110.intro$如果我们站在他们一边进行干预，他们就会宣布作为独立成员加入我们的联盟。"
 china_events.110.d.india_already_guaranteed: "$china_events.110.intro$\n\n目前，我们已经保障[FROM.GetNameDef]的独立，自然可以帮助他们抵抗中国的扩张主义。但是，政府中也有人认为，应付业已统一的中国会让我们精疲力竭，陷入旷日持久的战争。毫无疑问，中国人不会拒绝让步，我国还有其他威胁要应对。"
 china_events.110.d.india: "$china_events.110.intro$如果我们站在他们一边进行干预，他们就会宣布作为独立成员加入我们的联盟。"
 china_events.110.a: "我们将伸出援手。"
 china_events.110.b: "要求他们立刻建立一个社会主义政府。"
 china_events.110.c: "那是他们自己的事情。"
 china_events.111.t: "[FROM.GetNameDefCap]向我们提供保护！"
 china_events.111.d.russia: "我们的请求没有白费功夫！俄罗斯政府向我国政府宣布，他们承认了我国的国家主权，并将要求中国政府撤出全部军队，否则俄罗斯将加入这场战争。现在我们可以放心了，莫斯科现在是我们坚实的后盾。"
 china_events.111.d.india: "我们的请求没有白费功夫！印度政府向我国政府宣布，他们承认了我国的国家主权，并将要求中国政府撤出全部军队，否则印度将加入这场战争。现在我们可以放心了，南亚巨象将与我们并肩作战对抗中帝国主义！"
 china_events.111.a: "中国人现在不敢来了……"
 china_events.112.t: "[From.From.GetNameDefCap]保护[FROM.GetNameDef]"
 china_events.112.d.russia: "我们认为[FROM.GetNameDef]是我国不可或缺的一部分，也是自然边界所在，但这群懦夫已经向[FROM.FROM.GetNameDef]寻求保护。俄罗斯政府向我们发出了最后通牒，要求放弃对[FROM.GetNameDef]的主张并停止侵略，否则就对我们开战。鹰派呼吁利用俄罗斯被削弱的机会打击他们，而鸽派宣称我们要坚持和平解决。"
 china_events.112.d.india: "我们认为[FROM.GetNameDef]是我国不可或缺的一部分，也是自然边界所在，但这群懦夫已经向[FROM.FROM.GetNameDef]寻求保护。印度政府向我们发出了最后通牒，要求放弃对[FROM.GetNameDef]的主张并停止侵略，否则就对我们开战。鹰派呼吁利用印度刚刚统一立足未稳的机会打击他们，而鸽派宣称我们要坚持和平解决。"
 china_events.112.a: "我们赢不了的，让步吧！"
 china_events.112.b: "我们誓死抵抗帝国主义分子！"
 china_events.113.t: "中国让步"
 china_events.113.d: "在国际压力下，中国人只得乖乖退缩，把他们的部队从边界撤走。看起来我们的独立从他们的扩张主义手中牢牢地确立了下来。"
 china_events.113.a: "我们时代的和平。"
 china_events.114.t: "中国开始动员军队"
 china_events.114.d: "纵使在国际压力下，中国政府仍然决定动员他们的部队而来自我方边界的报告表面他们正在进军。看来我国正和中国处于全面战争状态，只有时间才能告诉我们能否得胜。"
 china_events.114.a: "他们赢不了的。"
 china_events.115.t: "[FROM.GetNameDefCap]要求转向社会主义"
 china_events.115.d.russia: "[RUS.GetNameDef]要求我们的政府采用社会主义模式，并将我们整合进他们的势力范围，否则将不会回应我们的求助。这样做固然能让他们保护我们的土地，但也会从根本上破坏我们的独立，因为我们会成为他们社会主义阵营的傀儡。但是，鉴于如果不同意我们就会被中国吞并、破坏，也许这已经是最好的选择了。"
 china_events.115.d.india: "[HND.GetNameDef]要求我们的政府采用社会主义模式，并将我们整合进他们的势力范围，否则将不会回应我们的求助。这样做固然能让他们保护我们的土地，但也会从根本上破坏我们的独立，因为我们会成为他们社会主义阵营的傀儡。但是，鉴于如果不同意我们就会被中国吞并、破坏，也许这已经是最好的选择了。"
 china_events.115.a: "我们欣然接受。"
 china_events.115.b: "不，我们不会放弃自己的独立。"
 china_events.116.t: "[FROM.GetNameDefCap]同意接受社会主义"
 china_events.116.d: "我们收到了一个好消息：[FROM.GetNameDef]政府同意转变为社会主义政府，成为世界革命的一分子，加入了社会主义大家庭。现在，我们将团结起来反抗中帝国主义，他们要么退缩，要么就承担应得的后果。"
 china_events.116.a: "英特纳雄耐尔，就一定要实现！"
 china_events.117.t: "[FROM.GetNameDefCap]拒绝社会主义"
 china_events.117.d: "或许是出于傲慢，[FROM.GetNameDef]拒绝了我们要求其建立一个社会主义政府的慷慨提议。既然他们不肯废除他们那腐朽落后的反动政权，我们也不会在他们与中国人发生冲突时给予保护。"
 china_events.117.a: "这是他们自找的。"
 china_events.118.t: "[FROM.GetNameDefCap]选择顽抗"
 china_events.118.d: "[FROM.GetNameDef]那傲慢无知的人民拒绝了我们所有的慷慨要求。他们宣布，解决危机的唯一办法就是独立。这些地区是中国不可分割的一部分，只不过是在百年国耻中失去了。他们的行为不可接受，为了完成祖国统一，我们只有动用武力！"
 china_events.118.a: "这是他们自找的！"
 china_events.119.t: "中国要求吞并[FROM.GetNameDef]"
 china_events.119.intro: "中国完成统一、政权稳固后，他们把目光投向边疆的[FROM.GetAdjective]。这些地区曾是大清的遥远边疆，现代中国自称是满清的后继者，开始试图推动该地区的回归。双方正集结军队，言辞中的敌意也越发明显，我们不难理解其中的利害关系。"
 china_events.119.compromise: "一些人提出了中间选项，希望能解决紧张局势。[FROM.GetNameDefCap]目前占有一些人口以汉族为主的土地，这也是引起中国民族主义愤怒的焦点。如果用这些领土换取[FROM.GetNameDef]继续独立，就可能避免中国和我国两个大国间的战争，即使这违背了我们之前的一些承诺。"
 china_events.119.faction_leader_text: "最近几天，事情到了紧要关头，[FROM.GetLeader]以我们的军事义务为由，要求我们站在他们一边进行干预。我们在该地区确实有一些利益，这也是我们承诺保护他们的理由。那么现在的问题是，我们是否还愿意为[FROM.GetAdjective]的独立站台？"
 china_events.119.overlord: "我们在[FROM.Capital.GetCapitalVictoryPointName]有相当广泛的利益，[FROM.GetRulingParty]政府实际上服从于我国外交政策。因此，[FROM.GetLeader]一直坚持请求我们履行介入冲突、御中国入侵的义务。如果不这样做，[ROOT.GetLeader]就会很尴尬，[ROOT.GetAdjective]的外交政策也会遭到破坏。"
 china_events.119.overlordinfaction: "$china_events.119.overlord$\n\n这表面上是边境冲突，但很可能会升级为更大范围的地区冲突，因此[ROOT.GetFactionName]中的盟友也可能会卷入。为了解决这个问题，我们可能还要咨询[ROOT.GetFactionName]的领袖。"
 china_events.119.d.faction_leader_can_give_lands: "$china_events.119.intro$\n\n$china_events.119.faction_leader_text$\n\n$china_events.119.compromise$"
 china_events.119.d.faction_leader_default: "$china_events.119.intro$\n\n$china_events.119.faction_leader_text$"
 china_events.119.d.overlord_not_in_faction_can_give_lands: "$china_events.119.intro$\n\n$china_events.119.overlord$\n\n$china_events.119.compromise$"
 china_events.119.d.overlord_not_in_faction: "$china_events.119.intro$\n\n$china_events.119.overlord$"
 china_events.119.d.overlord_in_faction_can_give_lands: "$china_events.119.intro$\n\n$china_events.119.overlordinfaction$\n\n$china_events.119.compromise$"
 china_events.119.d.overlord_in_faction: "$china_events.119.intro$\n\n$china_events.119.overlordinfaction$"
 china_events.119.a: "我们为保护[FROM.GetAdjective]独立而行动起来！"
 china_events.119.b: "请求[ROOT.GetFactionName]的盟友支援！"
 china_events.119.c: "试着对争议地区问题寻求妥协。"
 china_events.119.d: "这不值得，抛弃[FROM.GetNameDef]。"
 china_events.120.t: "[FROM.GetNameDefCap]保护我们"
 china_events.120.intro: "我们要求[FROM.GetAdjective]援助的请求成功了！在听到[ROOT.GetLeader]的请求后，[FROM.Capital.GetCapitalVictoryPointName]已经发出严厉警告，要求中国人退出我们的领土，并愿意在必要时派兵进入该地区保卫我们。"
 china_events.120.d.default: "$china_events.120.intro$我们现在都在屏息等待中国人下一步的行动。"
 china_events.120.d.refused_lands: "$china_events.120.intro$我们并不是没有尝试过事先谈判，只交出我们的“部分”核心土地。不幸的是，这一妥协被汉族当局拒绝。现在看来，战争不可避免，对此我们必须做好准备。"
 china_events.120.a: "有盟友是好事。"
 china_events.121.t: "[FROM.FROM.GetNameDefCap]保护[FROM.GetNameDef]"
 china_events.121.refusedlands: "之前我们不愿妥协，拒绝了[FROM.GetAdjective]归还汉地换取自治的请求，现在我们实际上进退两难——既然我们为了避免战争、夺取争议领土而虚张声势，现在就只能为整个地区开战，或者耻辱地退缩。"
 china_events.121.d.overlord: "我们正准备进军[FROM.Capital.GetCapitalVictoryPointName]，维护中国的统一，而他们那卑鄙的主子——[FROM.FROM.GetNameDef]似乎肯定会介入其中阻止我们。[ROOT.GetRulingParty]内部的民族主义者坚持要求我们继续前进，认为我们有必要用武力一雪百年国耻。但是，从另一个方面来说，这种战争可能会给仍在从军阀时代中恢复的国家带来毁灭性的影响。现在决定权落到了[ROOT.GetLeader]和部长们手中。"
 china_events.121.d.overlord_refused_lands: "$china_events.121.d.overlord$\n\n$china_events.121.refusedlands$"
 china_events.121.d.overlord_abandoned_by_allies: "$china_events.121.d.overlord$\n\n看来，[FROM.FROM.GetNameDef]失去了一个关键优势，由于不愿在亚洲卷入大规模冲突，他们的前没有基本放弃了他们。这意味着他们孤立无援，当然，并不是无能为力。"
 china_events.121.d.overlord_refused_lands_abandoned_by_allies: "$china_events.121.d.overlord_abandoned_by_allies$\n\n$china_events.121.refusedlands$"
 china_events.121.d.overlord_and_allies: "$china_events.121.d.overlord$\n\n[FROM.FROM.FROM.GetNameDefCap]已经决定参战，威胁将整个[FROM.FROM.FROM.GetFactionName]都带入冲突，使紧张局势升级。这加剧了这场危机的棘手程度，我们的处境大大恶化了。"
 china_events.121.d.overlord_and_allies_refused_lands: "$china_events.121.d.overlord_and_allies$\n\n$china_events.121.refusedlands$"
 china_events.121.d.faction: "过去几年，[FROM.GetNameDef]为了保护他们的独立，与外部势力建立了一些联系，以在我们不可避免地要求统一时保护他们。而[FROM.GetFactionName]同意了他们的保护请求。统一的中国力量固然强大，但选择战争一直都十分冒险——战争可以由我们的意愿开始，却不一定会按我们的计划结束。"
 china_events.121.d.faction_refused_lands: "$china_events.121.d.faction$\n\n$china_events.121.refusedlands$"
 china_events.121.a: "我们不得不退让。"
 china_events.121.b: "那就开战。"
 china_events.122.t: "中国让步"
 china_events.122.d: "紧张局势持续数周之后，世界终于可以松一口气了。面对可能动摇国本的激烈战争，中国领导层首先动摇了。他们决定接受一份与一开始的高要求相去甚远的协议，通过了互不侵犯条约。未来裁军的可能性仍遥不可及，但至少现在的亚洲实现了和平。"
 china_events.122.a: "理性仍存。"
 china_events.123.t: "中国进行战争动员"
 china_events.123.d: "紧张局势持续数周之后，事态似乎很快就会失控。我们抵制中帝国主义的决心与日俱增，而中国领导层也选择加码。外交解决的希望迅速破灭，我们别无选择，只能准备打持久战。"
 china_events.123.a: "我们终将胜利。"
 china_events.124.t: "[FROM.GetNameDefCap]请求[ROOT.GetFactionName]帮助对抗中国"
 china_events.124.d: "[FROM.GetAdjective]和中国之间的边界争议早已为我所知，但由于中国人长期争斗不休，这个问题无关紧要，至少最近之前是这样。最近，中国人拒绝他们中各种团体的从汉人主导的政府脱离（或至少获得名义上的独立）的要求，开始动员部队进行复仇，恢复前清的帝国边界。\n\n现在，[ROOT.GetFactionName]被卷入亚洲冲突的可能性日益增长，我们可能还没有做好准备。作为联盟的实际领袖，我们有责任协调联盟成员，对[FROM.GetAdjective]呼吁共同对抗中国的请求做出回应。"
 china_events.124.a: "我们将利用自身影响帮助他们。"
 china_events.124.b: "这堆事情太远了，和我们无关。"
 china_events.125.t: "[FROM.GetNameDefCap]支持我们"
 china_events.125.d: "谢天谢地，我们与[FROM.GetFactionName]的密切联系得到了回报。为响应我们反对中国侵略的呼吁，[FROM.GetLeader]提出在入侵发生时提供援助。除加强联盟外，我们还要维护地区内的盟友的利益。但愿中国人不会冒着扩大战争的风险继续侵略。"
 china_events.125.a: "盟友就是这么用的。"
 china_events.126.t: "[FROM.GetNameDefCap]拒绝支持我们"
 china_events.126.d: "尽管我们与[FROM.GetFactionName]有联系，但他们声称不会让战争波及其他盟友。软弱不堪、口是心非的[FROM.GetLeader]告诉我们，如果发生冲突，[FROM.GetFactionName]不会帮助我们。\n\n这让我们处于劣势，如果要继续保护盟友，就不得不牺牲与[FROM.GetFactionName]的关系，这样我们就会变得脆弱；另一方面，如果现在退缩，也会让我们显得软弱，还要为了更广泛的联盟牺牲自己的利益。如何处理中国宣称土地上的利益，最终决定权在[ROOT.GetLeader]手上。"
 china_events.126.a: "不论如何，保护他们！"
 china_events.126.b: "向中国人提出妥协，留点面子。"
 china_events.126.c: "为了[FROM.GetFactionName]的盟友，放弃支持他们。"
 china_events.127.t: "[FROM.GetNameDefCap]退出[ROOT.GetFactionName]"
 china_events.127.d: "由于我们决定不保护他们在与中国有争议地区的利益，[FROM.GetLeader]感到愤怒，宣布[FROM.GetNameDef]退出[ROOT.GetFactionName]。这打击了联盟的稳定，他们硬着头皮抵抗中国人的决定可能带来对所有人都不利的结果。我们已竭尽所能维护和平，只能在没有[FROM.GetAdjective]的情况下继续前行。"
 china_events.127.a: "令人失望。"
 china_events.128.t: "妥协余地？"
 china_events.128.intro: "经过一番商议，[FROM.GetLeader]想出了一个给中国人的方案，希望让他们不要入侵：[ROOT.GetAdjective]手中汉人占多数的领土归还中国，作为交还，我们保持独立，而中国撤回对我们核心领土的所有主张。"
 china_events.128.d.puppet: "$china_events.128.intro$\n\n鉴于我们严重依赖[FROM.GetNameDef]，我们只不过是个橡皮图章。但是，我们还是希望以此赢得长久的和平。"
 china_events.128.d.not_puppet: "$china_events.128.intro$\n\n最终，选择权在我方手上。一些我方民众可能会把接受妥协当作背叛，不过如果这能带来和平——那我们至少必须得试试吧？"
 china_events.128.a: "我们别无选择……"
 china_events.128.b: "这简直就是投降！"
 china_events.128.c: "妥协确是不幸，也是值得的。"
 china_events.129.t: "[FROM.GetNameDefCap]同意妥协"
 china_events.129.d: "鉴于可能爆发毁灭性战争，[FROM.GetLeader]决定采取合理的行动，同意我们的提议，将[FROM.GetAdjective]的部分领土交给中国。汉人占多数的地区将归还中国，而中国承认[FROM.GetNameDef]的独立。协议草案现在将送交中方审查。"
 china_events.129.a: "让我们静待他们的回复。"
 china_events.130.t: "[FROM.GetNameDefCap]拒绝妥协"
 china_events.130.d: "即使可能爆发毁灭性战争，[FROM.GetLeader]也还是决定强硬，坚持[FROM.GetNameDef]会捍卫[FROM.GetAdjective]的每一寸合法领土，直到最后一刻。他们破坏了一切妥协机会，发誓说无论我们是否参与都要继续战斗。在这种情况下，我们面临着严峻的选择，要么与[FROM.Capital.GetCapitalVictoryPointName]的盟友站在一起，要么就让他们继续虚张声势、听天由命。"
 china_events.130.a: "无所谓，我们会出手。"
 china_events.130.b: "让他们自生自灭吧。"
 china_events.131.t: "[FROM.GetNameDefCap]提供潜在的妥协"
 china_events.131.d.puppet: "我们收到[FROM.overlord.GetNameDef]政府的正式照会，作为其代表[FROM.GetNameDef]与我国正式调解提案的一部分，[FROM.GetNameDef]将割让他们所控制的有大量汉人聚居的土地。作为回报，他们要求我们放弃声索他们领土的其他所有部分，并尊重其主权独立。虽然这无疑是一个诱人的提议，但民族主义鹰派号召我们拒绝这个不平等条约，准备与[FROM.overlord.GetNameDef]开战。"
 china_events.131.d.not_puppet: "我们收到[FROM.FactionLeader.GetNameDef]政府的正式照会，作为其代表[FROM.GetNameDef]与我国正式调解提案的一部分，[FROM.GetNameDef]将割让他们所控制的有大量汉人聚居的土地。作为回报，他们要求我们放弃声索他们领土的其他所有部分，并尊重其主权独立。虽然这无疑是一个诱人的提议，但民族主义鹰派号召我们拒绝这个不平等条约，准备与[FROM.FactionLeader.GetNameDef]开战。"
 china_events.131.a: "我们接受这一和平提案。"
 china_events.131.b: "我们决不会签这样的不平等条约！"
 china_events.132.t: "中国愿意妥协"
 china_events.132.d.target: "我们收到消息，中国政府已经同意接受他们声称拥有中国少数民族的土地，以换取他们放弃对我们余下土地的所有要求。我们将接受这一提议，尽管这意味着我们的土地被剥夺了。"
 china_events.132.d.faction_leader_abandoned_ally: "我们收到来自[FROM.overlord.GetNameDef]的消息，他们已经决定退出我们的联盟，以保卫[FROM.GetNameDef]。然而，由于[FROM.overlord.GetNameDef]已经成功地与中国政府谈判达成妥协，[FROM.GetNameDef]将割让所有汉族聚居地以换取独立。从而，流血事件已被避免。"
 china_events.132.d.other_allies: "我们收到消息，[FROM.overlord.GetNameDef]已经代表[FROM.GetNameDef]与中国政府进行了和平谈判。所有汉族聚居地都将被割让给中国政府，作为交换，他们将放弃对边疆外土地的所有其他声索。看来，不会再有争夺这些土地的战争了。"
 china_events.132.a: "不幸的是，必须这样做。"
 china_events.132.b: "和平已经谈判达成。"
 china_events.132.c: "我们别无他法。"
 china_events.132.d: "我们时代的和平。"
 china_events.133.t: "[FROM.GetNameDefCap]拒绝了我们妥协的请求"
 china_events.133.d: "[FROM.GetNameDef]拒绝割让汉地，驳回了我们慷慨的和平提议。事已至此，我们只得诉诸战争。"
 china_events.133.a: "既来之则安之。"
 china_events.134.t: "[FROM.GetNameDefCap]拒绝妥协"
 china_events.134.d.overlord_in_faction: "我们收到了严峻的消息：[FROM.GetNameDef]拒绝了我们慷慨的妥协提议。由于只剩下战争一个选项，也许我们可以尝试联系[ROOT.FactionLeader.GetNameDef]寻求支持，应对与中国政府可能的战争。我们可以放弃对这个附庸的保护，也可以不顾一切地保护他们。"
 china_events.134.d.overlord_refused_by_faction: "我们收到了严峻的消息：[FROM.GetNameDef]拒绝了我们慷慨的妥协提议。在这场危机中，我们曾向[ROOT.FactionLeader.GetNameDef]寻求援助，但他们拒绝了，因此他们不太可能又回来进行干预。我们可以放弃对这个附庸的保护，也可以不顾一切地保护他们。"
 china_events.134.d.faction_leader: "我们受到消息称，[FROM.GetNameDef]拒绝在收复领土上妥协，这可能意味着和我们开战。许多公民认为这场战争不值得我们流血，但也有许多人认为我们必须反对中国的扩张主义，保护我们的盟友。"
 china_events.134.a: "希望[ROOT.FactionLeader.GetNameDef]能帮助我们。"
 china_events.134.b: "困难重重，但我们必须保护他们。"
 china_events.134.c: "够了，我们会保护他们。"
 china_events.134.d: "这场战争和我们无关。"
 china_events.135.t: "[FROM.GetNameDefCap]向中国人妥协"
 china_events.135.d.abandoned_by_allies: "今天，我们收到了一个悲惨而令人沮丧的消息：[FROM.FactionLeader.GetNameDef]将我们踢出了他们的势力范围，将我们抛弃给了中国人。他们认为这场冲突与他们无关，从我国撤出了大使馆和军队——也就是说任由中国人入侵我们。只有时间才能证明我们能否在中国人的猛攻中幸存下来。"
 china_events.135.d.abandoned_by_overlord_allies: "今天，我们收到了一个悲惨而令人沮丧的消息：不像我们想的那样，[FROM.overlord.GetNameDef]决定不干预，将我们抛弃给了中国人。用他们的话说，[FROM.FactionLeader.GetNameDef]已经宣布在这场冲突中保持中立，而没有这些的帮助，他们就无法取胜。他们从我国撤出了大使馆和军队——也就是说任由中国人入侵我们。只有时间才能证明我们能否在中国人的猛攻中幸存下来。"
 china_events.135.d.abandoned_by_overlord: "今天，我们收到了一个悲惨而令人沮丧的消息：不像我们想的那样，[FROM.overlord.GetNameDef]决定不干预，将我们抛弃给了中国人。他们认为无法在冲突中取胜，因此从我国撤出了大使馆和军队——也就是说任由中国人入侵我们。只有时间才能证明我们能否在中国人的猛攻中幸存下来。"
 china_events.135.a: "这帮懦夫。"
 china_events.136.t: "[FROM.FROM.GetNameDefCap]抛弃了[FROM.GetNameDef]"
 china_events.136.d: "我们收到了一个好消息：[FROM.FROM.GetNameDef]撤回了对[FROM.GetNameDef]的保护，从而在避免亚洲大陆陷入战争的前提下解决危机。我们会将我国的边界恢复到应有的位置，而且很快就能取得胜利。"
 china_events.136.a: "对帝国主义的大胜！"
 china_events.150.t: "建立蒙古政府"
 china_events.150.d: "17-18世纪，蒙古缓慢地融入了大清。满清王朝与蒙古部落的关系本就良好，蒙古人组成的骑兵为清朝立下了大功，然而，清朝迫使蒙古人臣服、推行旗制的举动却遭到了抵制。在18世纪中，饥荒爆发，汉人大规模迁入内蒙古地区，蒙古游牧部落开始衰弱，清廷中汉人的权势日渐增长。清朝对蒙古的统治依赖于由军事主官监管的各种“盟”，内蒙古有六个盟，外蒙古有四个盟，其中外蒙各盟的自治权要稍大一些。\n\n在辛亥革命的动荡中，博克多汗登基，宣布蒙古独立，驱逐了清朝官员。新生的中华民国试图重新控制蒙古和西藏（蒙藏签署了互相承认的条约），派兵进入蒙古，一度短暂进驻了乌尔格（即库伦，蒙古的“首都”，也是其境内唯一的永久性城市）。然而，冯·恩琴-施滕贝格男爵的部队击败了中国军队，蒙古因此获得了事实上的独立，而中国方面则一直坚持自己的领土宣称。\n\n如今恩琴已经倒台，我们重新控制了蒙古，这里已经四分五裂、满目疮痍。当地领导人请求我们效仿内蒙古军阀的政策，给予他们更大的自治权，担心习惯定居、主要从事农耕的汉人移民进一步涌入，挤占蒙古牧民的牧场，和蒙古人争夺政治影响力。而一些官员主张对蒙古进行直接统治，以便改善这里贫困的经济现状、打击分离主义势力。"
 china_events.150.a: "建立只包含外蒙古的自治区。"
 china_events.150.b: "建立包含内蒙古和外蒙古的自治区。"
 china_events.150.c: "蒙古将被重组为数个普通的省。"
 china_events.151.t: "建立新疆政府"
 china_events.151.d: "新疆的历史悠久而动荡，中国人早在汉朝就在该地区有了军事存在，汉王朝在这里驻军，保护利润丰厚的丝绸之路贸易。之后的历朝历代对掌控这片偏远之地的兴趣各有不同，因此对该地区的掌控度也不断变化。17到18世纪，清王朝政府征服了准噶尔部，彻底掌控了新疆和西藏。清政府学习唐朝政策，鼓励汉回满等族移民新疆，以强化对新疆的掌控。这片原本被称作“于阗”的土地成为了中国的一个省，并得到了“新疆”这个名字，意为“故土新归”。\n\n辛亥革命后，清廷灭亡，汉人督军杨增新独揽新疆大权。作为一个多民族地区，新疆长期政局不稳、叛乱频发，尤其是东北方的哈密汗国支持者和南方的于阗分离主义者时常作乱。据说，从北京到迪化（新疆省会）的旅行距离比从莫斯科到海参崴的还要长，这自然导致了新疆的孤立——而地方主官们的地方主义倾向和军阀割据的混乱更加剧了这种孤立。\n\n尽管如此，我们现在还是成功地控制了新疆，要维持稳定统治，我们必须制定一个长期的治理计划。新疆是维吾尔族、汉族、哈萨克族、回族、柯尔克孜族和蒙古族等多个民族的家园，因此当地领导人呼吁建立自治区以确保当地少数民族的权利。但这个想法遭到了相当大的抵制——与西藏和蒙古不同，新疆几十年来一直都是中国的一个省。"
 china_events.151.a: "建立新疆自治区。"
 china_events.151.b: "新疆仍将是一个省。"
 china_events.152.t: "建立西藏政府"
 china_events.152.d: "中国对西藏的统治历史漫长而又复杂。清朝时期，清军曾帮助七世达赖喇嘛击败了准噶尔汗国，朝廷随之任命了一位“安班”（即驻扎大臣/办事大臣），这是清朝首次宣称直接统治西藏。从此，西藏成为了清朝的“藩部”，大致可以理解为附属。随着清朝的实力日益衰弱，西藏当地领袖与从印度发号施令的英国势力逐渐抬头，中央对西藏的控制随之弱化。英国入侵西藏后，清朝竭力重申对藏区的主权，派出清军以武力整合西藏，同时采取外交手段，确保英国承认中国对西藏的宗主权。\n\n1911年辛亥革命后，清朝的统治土崩瓦解，藏人趁机向驻军发起报复，杀死了清军头目并将残部赶出了西藏。随后成立的中国民国延续了对西藏的主权要求，试图迫使达赖喇嘛归顺中央，十三世达赖喇嘛则辩称，此前中国对西藏的统治并非臣属关系，而是“檀越关系”（精神领袖与世俗赞助人的关系），在蒙古宣布独立的同时，西藏地方政府也宣布独立。此时，英国人在试图促成一项类似于内外蒙古分治的协议，即“外藏”在中国的名义宗主权下获得自治，而“内藏”将由中国政府和西藏宗教当局一同管理。但这一约定最终因边界争端而破裂，达旺边界争议和印度革命则使得情况变得更加复杂。\n\n我们的军队已成功攻入西藏，重新实现了中央对拉萨的直接控制。1933年十三世达赖喇嘛去世后，西藏政坛沉浮不定，从固守传统的僧侣与贵族，到康巴革命者，再到上层改革派，几方势力相互倾轧，派系斗争不休。在我们的政府内部，有人呼吁将西藏作为一个省直接管理，彻底消除分离主义，而另一些人则提议给予西藏自治权，确保当地盟友的忠诚。"
 china_events.152.a: "建立只包含“外藏”的自治区。"
 china_events.152.b: "“内藏”也应被纳入自治区。"
 china_events.152.c: "西藏将成为一个省。"
 china_events.153.t: "[FROM.Capital.GetCapitalVictoryPointName]的亲中派政变阴谋"
 china_events.153.d: "在与[FROM.GetAdjective]政府的艰难谈判后，人们很高兴我们可以与中国人达成和平协议。条约包括我们会作为中国的受保护国，保留国内事务的自治权和国际上名义的独立权，而我们的外交事务也会在[FROM.Capital.GetCapitalVictoryPointName]处理。这一协议相当于中国古代宗藩体系的现代翻版，也暗含了我们[ROOT.GetRulingParty]领导地位的保留。\n\n但中国人已经对[ROOT.GetLeader]政府失去了信心，或者说他们从未想过让他（至少是他现在这批顾问）统治。而亲中派媒体对于政府态度愈发阴沉，中国“大使”也在不断会见我国的异见人士。更令人担忧的是，政府里的各大部长和将军已经在为新政权里的职位你争我抢，这意味着我们的日子要到头了。\n\n由于我们的影响力早因我国公开向世界宣布屈从于中国、而我们曾经的靠山也不愿意或无力帮助我们，现政权已经失去了抗辩的机会。中国人正式提出更易领导层只是时间问题，除非我们能重新称霸，否则只能希望这次背叛能被历史铭记了。"
 china_events.153.a: "无能为力，认命吧。"
 china_events.153.b: "我们会战到最后！"
 china_events.154.t: "[FROM.Capital.GetCapitalVictoryPointName]的不流血政变"
 china_events.154.d: "在与[FROM.GetAdjective]政府的艰难谈判后，人们很高兴我们可以达成统一国家的和平协议。根据条约规定，他们将保留一定的国内自治权，并在国际舞台上作为中国的保护国享有名义上的独立，但外交事务将由[ROOT.Capital.GetCapitalVictoryPointName]处理。这一协议相当于中国古代宗藩体系的现代翻版，但也基本保留了[FROM.GetRulingParty]的领导权。\n\n然而，由于他们持续的煽动性行动以及允许分裂主义部长留在政府中，双方关系正在逐渐恶化。显而易见，[FROM.GetLeader]，或者至少是他目前的顾问团队，与双方共同的未来格格不入。因此，我们将行使宗主国的正当权力，启动权力交接。\n\n在与当地政界人士、军方官员及其他利益相关团体会面后，我方代表精心打造了一个更加符合我们利益的政府。尽管部分政府成员过去曾参与分裂活动，但好在新政权足够务实，在意识形态上也足够包容，足以巩固我们对[FROM.Getname]的控制。\n\n当然，[FROM.GetLeader]及其亲信则认为这是赤裸裸的背叛，并抱怨我们违背了诺言，但由于他们的盟友无法也不愿为其提供帮助，因此他们没有任何实际影响力可言。他们最终选择和平投降，这才是最重要的。现在，我们可以尽情期待中国霸权带来的光明未来和“特殊关系”了。"
 china_events.154.a: "尘埃落定。"
 china_events.155.t: "[FROM.Capital.GetCapitalVictoryPointName]的亲中派政变瓦解"
 china_events.155.d: "在与[FROM.GetAdjective]政府的艰难谈判后，人们很高兴我们可以达成统一国家的和平协议。根据条约规定，他们将保留一定的国内自治权，并在国际舞台上作为中国的保护国享有名义上的独立，但外交事务将由[FROM.Capital.GetCapitalVictoryPointName]处理。这一协议相当于中国古代宗藩体系的现代翻版，但也基本保留了[ROOT.GetRulingParty]的领导权。\n\n然而，由于他们持续的煽动性行动以及允许分裂主义部长留在政府中，双方关系正在逐渐恶化。显而易见，[ROOT.GetLeader]，或者至少是他目前的顾问团队，与双方共同的未来格格不入。因此，我们将行使宗主国的正当权力，启动权力交接。\n\n我方代表试图通过与当地政界人士、军官和其他利益相关团体会面来解决这个问题，以组建一个更加符合我们利益的政府。然而，由于分离主义者牢牢掌控着权力，这些努力最终全都化为了泡影。[ROOT.GetLeader]及其亲信高呼背叛并发动了叛乱，试图做最后的努力以维护自身独立。然而讽刺的是，由于他们的盟友无法也不愿为其提供帮助，这场叛乱反而会葬送他们通过谈判得来的自治地位。"
 china_events.155.a: "看来他们还是想做中国的一个省……"
 china_events.200.t: "[china.GetNameDefCap]要求归还租界"
 china_events.200.desc: "自几乎一个世纪前的《南京条约》开始，西方列强就在中国占有租界。现在在[china.GetLeader]的统治下，再度合为一体的中国一只脚已经踏入了列强的门槛。形势已变至如此，我们收到了来自[china.Capital.GetCapitalVictoryPointName]礼貌而又坚定的公报，要求“归还”租界。\n\n如果几年前收到这样的消息，那它只能被新闻界在困惑和讥笑中报道，成为[ROOT.Capital.GetCapitalVictoryPointName]酒吧中的谈资和笑料。但是，现在的事态严峻到了极点：中国人只要想抢走租界，我们根本无法抵抗；再把租界抢回来本身就是个艰巨的任务，更别提这次他们后面还站着整个中国。但是，中国的军事还停留在上个世纪，部队质量充其量就是参差不齐，而我们的军队则无疑是[ROOT.GetNameDef]的骄傲。"
 china_events.200.a: "不值得为此开战。"
 china_events.200.b: "要求赔偿。"
 china_events.200.c: "无视他们的警告。"
 china_events.200.d: "立即通知[THIS.overlord.GetNonIdeologyName]！"
 china_events.201.t: "[FROM.GetNameDefCap]交还租界"
 china_events.201.d: "出乎意料，[FROM.Capital.GetCapitalVictoryPointName]方面拱手将占领的租界归还。这是属于中国的光荣一天，也是洗刷国耻的重要一步！"
 china_events.201.a: "万岁！"
 china_events.202.t: "[FROM.GetNameDefCap]希望以赔偿换取租界"
 china_events.202.d: "如果几年前提出要求，[FROM.Capital.GetCapitalVictoryPointName]方面会不假思索地拒绝；但如今，[FROM.GetAdjective]的代表已经原则上同意交出租界，但是有一个条件：赔偿。租界本来就是外国人强行夺取的中国土地，现在反而要中国赔偿，这种想法当然十分荒谬。但是，如果不想打代价高昂的战争，或者避免我军在家门口战败、蒙受耻辱，赔偿是个相对简单的选择。"
 china_events.202.a: "我们会付钱的。"
 china_events.202.b: "想都别想。"
 china_events.203.t: "[FROM.GetNameDefCap]同意以赔偿换取租界"
 china_events.203.d: "中国人非常识时务，他们同意就收回租界进行赔偿。只要他们付了全款，这事就算了结了。"
 china_events.203.a: "很好。"
 china_events.204.t: "[FROM.GetNameDefCap]拒绝以赔偿换取租界"
 china_events.204.d: "中国人不识时务，他们拒绝了我们以赔偿换取租界的提议。我们必须为可能的战争做好准备。"
 china_events.204.a: "这帮傻子。"
 china_events.205.t: "[FROM.GetNameDefCap]拒绝移交租界"
 china_events.205.d: "这帮[FROM.GetAdjective]鬼子拒绝归还他们的租界，正如我们对这些顽固不化的帝国主义者的预料。现在该让他们看看统一的中国所拥有的磅礴伟力！"
 china_events.205.a: "打得一拳开，免得百拳来。"
 china_events.210.t: "中国试图夺取租界！"
 china_events.210.d: "近一小时前，中国部队试图进入租界，虽然我们顽强抵抗，但他们仍会在天亮之前搞定驻军。我们得现在赶快做决定是否起锚拯救他们，并且一劳永逸地解决这一中国威胁。"
 china_events.210.a: "部署舰队！"
 china_events.210.b: "挡不住的，随他们去吧。"
 china_events.210.c: "立即通知[THIS.overlord.GetNonIdeologyName]！"
 china_events.211.t: "[FROM.GetNameDefCap]抛弃了他们的租界"
 china_events.211.d: "外国人畏惧于我们的力量和决心，已经几乎放弃了租界地区，是时候让游子回归祖国母亲怀抱了。我们的军队已整装待发准备夺取租界，将中国的旗帜高挂在街巷上。在结束百年国耻的道路上再迈出光辉一步！"
 china_events.211.a: "万岁！"
 china_events.212.t: "[FROM.GetNameDefCap]威胁开战"
 china_events.212.d: "我们试图夺取租界的行动使得[FROM.Capital.GetCapitalVictoryPointName]作出了勃然大怒的回复，他们在[ROOT.Capital.GetCapitalVictoryPointName]的大使正式威胁要开战。我们承担得起现在退缩的后果吗？"
 china_events.212.a: "让步。"
 china_events.212.b: "那就来战罢！"
 china_events.213.t: "中国在租界问题上退缩"
 china_events.213.d: "面对我们的战争威胁，中国人退缩了，并且从与我们租界的边界上撤回了部队，这出乎了几乎所有人的预料。这无疑将在[FROM.Capital.GetCapitalVictoryPointName]产生重大的政治影响，我们可以预计，在可预见的未来，租界不会受到真正的威胁了。"
 china_events.213.a: "好消息。"
 china_events.214.t: "中国控制了租界"
 china_events.214.d: "就算我们以战争相威胁，中国部队还是进入了我们的租界，轻松瓦解了我方驻军和当地民兵的微弱抵抗。现在我们得兑现诺言，准备打仗了。"
 china_events.214.a: "那就来战吧！"
 china_events.220.t: "外滩黄昏"
 china_events.220.d.puppet: "自从一个世纪前的《南京条约》签署以来，一个又一个的列强就在中国留下了一个又一个的租界。但如今，在[FROM.GetLeader]的统一领导下，中国离所谓列强只差临门一脚。形势已变至如此，[FROM.Capital.GetCapitalVictoryPointName]方面发出了公报，礼貌而坚定地要求我方“归还”我们的租界城市。如果时间只往前推两年，这或许只会是街头巷尾茶余饭后的谈资笑料。但现在，这种事情可不好笑了。\n\n一方面，现在的中国人绝不会被吓倒，我们的国际托管领已是他们“百年国耻”的最后污渍。另一方面，归还租界又威胁着上海天津等地无数人建立的家园和生计，租界里形成了全世界独有的文化融合场景。但我们可以稍感宽慰，幸好，[LEC.overlord.GetName]会继续保护我们。如果我们想要存续，那就只有靠他们了。"
 china_events.220.d.in_faction: "自从一个世纪前的《南京条约》签署以来，一个又一个的列强就在中国留下了一个又一个的租界。但如今，在[FROM.GetLeader]的统一领导下，中国离所谓列强只差临门一脚。形势已变至如此，[FROM.Capital.GetCapitalVictoryPointName]方面发出了公报，礼貌而坚定地要求我方“归还”我们的租界城市。如果时间只往前推两年，这或许只会是街头巷尾茶余饭后的谈资笑料。但现在，这种事情可不好笑了。\n\n一方面，现在的中国人绝不会被吓倒，我们的国际托管领已是他们“百年国耻”的最后污渍。另一方面，归还租界又威胁着上海天津等地无数人建立的家园和生计，租界里形成了全世界独有的文化融合场景。但我们可以稍感宽慰，幸好，[LEC.FactionLeader.GetName]和其他盟国会继续保护我们。如果我们想要存续，那就只有靠他们了。"
 china_events.220.d.council: "自从一个世纪前的《南京条约》签署以来，一个又一个的列强就在中国留下了一个又一个的租界。但如今，在[FROM.GetLeader]的统一领导下，中国离所谓列强只差临门一脚。形势已变至如此，[FROM.Capital.GetCapitalVictoryPointName]方面发出了公报，礼貌而坚定地要求我方“归还”我们的租界城市。如果时间只往前推两年，这或许只会是街头巷尾茶余饭后的谈资笑料。但现在，这种事情可不好笑了。\n\n一方面，现在的中国人绝不会被吓倒，我们的国际托管领已是他们“百年国耻”的最后污渍。另一方面，归还租界又威胁着上海天津等地无数人建立的家园和生计，租界里形成了全世界独有的文化融合场景。但我们可以稍感宽慰，幸好，工部局的成员国中有不少列强会继续保护我们。如果我们想要存续，那就只有靠他们尽快出手相救了。"
 china_events.220.d.independent: "自从一个世纪前的《南京条约》签署以来，一个又一个的列强就在中国留下了一个又一个的租界。但如今，在[FROM.GetLeader]的统一领导下，中国离所谓列强只差临门一脚。形势已变至如此，[FROM.Capital.GetCapitalVictoryPointName]方面发出了公报，礼貌而坚定地要求我方“归还”我们的租界城市。如果时间只往前推两年，这或许只会是街头巷尾茶余饭后的谈资笑料。但现在，这种事情可不好笑了。\n\n一方面，现在的中国人绝不会被吓倒，我们的国际托管领已是他们“百年国耻”的最后污渍。另一方面，归还租界又威胁着上海天津等地无数人建立的家园和生计，租界里形成了全世界独有的文化融合场景。现在该做出我们的选择了。"
 china_events.220.a: "将他们的要求提交给[ROOT.Overlord.Capital.GetCapitalVictoryPointName]。"
 china_events.220.b: "建议[LEC.FactionLeader.Capital.GetCapitalVictoryPointName]解散委任政府。"
 china_events.220.c: "建议[LEC.FactionLeader.Capital.GetCapitalVictoryPointName]保卫委任政府。"
 china_events.220.d: "建议工部局自行解散。"
 china_events.220.e: "建议工部局保卫自己。"
 china_events.220.f: "我们必须接受不可避免的现实。"
 china_events.220.g: "我们将死战到底！"
 china_events.221.t: "百年国耻的终结"
 china_events.221.d.puppet: "出乎我们的意料，[LEC.overlord.GetNameDef]同意不战而将使馆城市归还给我们。毫无疑问，各城市中还会残存顽固分子，以及其他添麻烦的人，但我们还是在筹划盛大的外滩游行，以及一个世纪以来第一次在上海上空升起中国国旗。我们完全可以预计到，交接后会有几周的混乱时期，但我军可以与外国占领军合作来缓解这种混乱。此外，数千名外国公民及其随员也可能逃离，根据与[LEC.overlord.Capital.GetCapitalVictoryPointName]达成的条款，他们将获得安全的出境通道。重新整合使馆城市需要时间和努力，但我们可以说，在经历了数十年国耻之后，中国人民再次昂首挺胸！"
 china_events.221.d.in_faction: "出乎我们的意料，[LEC.FactionLeader.GetName]同意不战而将使馆城市归还给我们。上海、天津以及其他城市的外国人措手不及，认为此举是一种背叛。我们已经在筹划盛大的外滩游行，以及一个世纪以来第一次在上海上空升起中国国旗，但事态发展可能远没有那么顺利。[LEC.FactionLeader.GetAdjective]军队正准备撤离，但也有人希望保卫使馆城市，他们很快开始支持各种现有的志愿保卫团体。上海街头开始陷入混乱，外国人纷纷上船逃离，或是拿起步枪，又或是紧锁家门。接下来的几周乃至几个月，原“使馆城市”将变得一团糟，但这就是帝国主义付出的代价。"
 china_events.221.d.independent: "出乎我们的意料，使馆城市同意自行解散，有效地将权力移交给我国政府。不出所料，协议中附带了一长串条件，包括向外国企业主支付赔偿、保证安全离境、逐步移交权力等。总的来说，收复使馆城市的代价十分微小。我们已经在筹划盛大的外滩游行，以及一个世纪以来第一次在上海上空升起中国国旗。尽管无疑会引发恐慌、暴力抵制和其他麻烦，还要花几个月进行再整合工作，但中国终于可以再次昂首挺胸，向世界宣告：百年国耻结束了！"
 china_events.221.a: "百年国耻，今朝得雪！"
 china_events.222.t: "拒绝"
 china_events.222.d: "1925年，臭名昭著的“施勋照会”引发了上海争夺战。如今，[LEC.GetLeader]援引这份照会，断然拒绝了我们交出使馆城市的要求。“必须再次划下红线。”他写道。但是这一次，没有德国、日本或美国的军舰帮助他了，相反，统一中国的伟力压在了他那小小的、非法窃据的租界上。鉴于使馆城市面积较小、缺乏保护，要将其占领易如反掌，但如果这么做，国际社会就会把我们描绘为恶棍。尤其是如果上海方面选择抵抗，这些城市会将很快陷入混乱，外国人涌上船想逃离，其他人可能会闭门自守，或者拿起武器加入各种志愿抵抗组织。外国人为了保卫他们的家，很可能会战至最后一人，而“东方巴黎”上海将付之一炬。"
 china_events.222.a: "让他们留着他们的城吧。"
 china_events.222.b: "有勇气，但很愚蠢。"
 china_events.223.t: "来自[china.Capital.GetCapitalVictoryPointName]的公报"
 china_events.223.d.overlord: "我们收到了上海传来的消息：几十年来，中国人首次统一在一个政府之下，他们希望“重新就使馆城市的地位问题展开谈判”。说白了，他们要求我们立即归还所有在华租界。许多知识分子争辩说，上海是旧时代的回声。但是，世界上很少有地方像上海那样有利可图，或者说有那样的战略重要性。我国将领们指出，面对中国这样一个人力池极为庞大的大国，要守住使馆城市那么一小块土地十分困难，光靠炮舰外交是做不到的。\n\n使馆城市可能会以这样或那样的方式自卫，但如果我们决定采取行动，就必须做好充分准备。"
 china_events.223.d.independent_suggests_disbanding: "我们收到了上海传来的消息：几十年来，中国人首次统一在一个政府之下，他们希望“重新就使馆城市的地位问题展开谈判”。说白了，他们要求我们立即归还所有在华租界。令人惊讶的是，作为全使馆城市的弄潮儿，工部局提出自行解散，屈服于中国的要求。他们如此决定，很可能是希望数万非华人能安全撤离，也许还想为因中国接管而失去一切的企业主争取赔偿。不过，我们也不需要听他们的建议。但是，世界上很少有地方像上海那样有利可图，或者说有那样的战略重要性。我国将领们指出，面对中国这样一个人力池极为庞大的大国，要守住使馆城市那么一小块土地十分困难，光靠炮舰外交是做不到的。\n\n如果我们决定保卫上海和其他使馆城市，就必须全力以赴做好准备。"
 china_events.223.d.independent_suggests_keeping: "我们收到了上海传来的消息：几十年来，中国人首次统一在一个政府之下，他们希望“重新就使馆城市的地位问题展开谈判”。说白了，他们要求我们立即归还所有在华租界。不出意外的是，作为全使馆城市的弄潮儿，工部局提出不要屈服于中国的要求。许多知识分子争辩说，上海是旧时代的回声。但是，世界上很少有地方像上海那样有利可图，或者说有那样的战略重要性。我国将领们指出，面对中国这样一个人力池极为庞大的大国，要守住使馆城市那么一小块土地十分困难，光靠炮舰外交是做不到的。\n\n使馆城市可能会以这样或那样的方式自卫，但如果我们决定采取行动，就必须做好充分准备。"
 china_events.223.a: "与中国人协商，有序撤军。"
 china_events.223.b: "我们会保卫使馆城市。"
 china_events.224.t: "一个时代的终结"
 china_events.224.d: "[FROM.Capital.GetCapitalVictoryPointName]方面已经做出决定：使馆城市将有秩序撤离所有愿意离开的人，最后撤出驻军。中国政府将根据企业主持有的股份和推断的利润对企业主进行补偿。对上海、天津和其他城市企业的补偿也将类似于商定的条款实行。诚然，会有人拒绝按照中国法律生活。撤离的有序程度也可能低于预期，而承诺的补偿需要一段时间才能实现，如果他们真打算给的话。\n\n中国一方不乏胜利的欢呼。他们可能已经在筹划盛大的外滩游行，以及一个世纪以来第一次在上海上空升起中国国旗。我们现在没什么可做了，只能收拾行李，告别，向着夕阳驶去。"
 china_events.224.a: "于是大幕就此落下。"
 china_events.225.t: "帝国间的最后争论"
 china_events.225.d: "[FROM.Capital.GetCapitalVictoryPointName]方面传达了[FROM.GetLeader]的决定：使馆城市将受到保护。现在，[FROM.GetAdjective]的军舰正在驶来，与[FROM.GetAdjective]驻军和我们自己的万国商团联合起来，抵御中国入侵的威胁。这一消息无疑会引起外滩的欢呼，但这对上海——更不用说其他城市——可能是灾难性的：即使我们能守得住，城市也会遭到炮击和围攻；贸易是使馆城市的命脉，而因为战争，贸易可能会中断数周、数月甚至数年。\n\n我们现在最大的希望是中国能做出让步，让我们自行决定命运。"
 china_events.225.a: "也许还是要靠武力决定。"
 china_events.226.t: "使馆城市被保护"
 china_events.226.d.same_faction: "不久前，我国和[FROM.FROM.GetNameDef]同意在战和问题上互相支持，结成经得起时间考验的联盟。但现在，[FROM.FROM.GetNameDef]却把我国利益丢在一旁，反对我们收回使馆城市的计划。现在，我们要么选择盟友，要么选择国家的核心利益——中国在列强手中受尽屈辱、四分五裂，我们肩负着洗雪百年国耻的神圣使命。如果我们选择盟友，将他们的利益置于我们之上，本就漫长的百年国耻还将继续，但有时就是需要克制欲望；如果我们选择完成使命，就会失去[FROM.FROM.GetNameDef]这个盟友，然后和他们兵戎相见，无论政治后果如何，这都可能是个鲁莽的决定。"
 china_events.226.d.not_same_faction: "[FROM.FROM.GetNameDef]宣布意图保卫使馆城市，这似乎是在重演1925年的事件——多国联军保卫摇摇欲坠的英国在华租界。但是，现在中国比以前更强大、更团结，如果我们有足够的决心，就可能力挽狂澜，让外国人为傲慢付出沉重的代价。但是，我们也必须脚踏实地，无论走过多远，都必须审时度势，比较敌我实力。无论政治后果如何，与[FROM.FROM.GetName]及其全体盟友作战都可能是个鲁莽的决定。"
 china_events.226.a: "时机未到。"
 china_events.226.b: "我们必须退让，但是我们的联盟破裂了。"
 china_events.226.c: "这什么也改变不了。"
 china_events.227.t: "来自[china.Capital.GetCapitalVictoryPointName]的公报"
 china_events.227.d: "我们收到了上海传来的消息：几十年来，中国人首次统一在一个政府之下，他们希望“重新就使馆城市的地位问题展开谈判”。说白了，他们要求立即归还所有在华租界。此事已提交使馆城市工部局，工部局的最终选择将具有效力。\n\n多知识分子争辩说，上海是旧时代的回声。但是，世界上很少有地方像上海那样有利可图，或者说有那样的战略重要性。我国将领们指出，面对中国这样一个人力池极为庞大的大国，要守住使馆城市那么一小块土地十分困难，光靠炮舰外交是做不到的。\n\n使馆城市可能会以这样或那样的方式自卫，如果工部局投票决定保卫委任政府，我们就要全力以赴做好准备。在军事上输给中国这种二流国家是不可接受的，如果运气好的话，中国人会在我方压倒性的力量面前让步，否则，战争将不可避免。\n\n我们驻[china.Capital.GetCapitalVictoryPointName]的大使正在等待政府的决定。"
 china_events.227.a: "投票解散委任政府。"
 china_events.227.b: "投票保留委任政府。"
 china_events.228.t: "投票结果如下"
 china_events.228.d.disband: "结局已定，经表决一致通过：使馆城市工部局自行解散，并将其行使权力及领土归还中国政府，使馆城市将有秩序撤离所有愿意离开的人，最后撤出驻军。中国政府将根据企业主持有的股份和推断的利润对企业主进行补偿。对上海、天津和其他城市企业的补偿也将类似于商定的条款实行。诚然，会有人拒绝按照中国法律生活。撤离的有序程度也可能低于预期，而承诺的补偿需要一段时间才能实现，如果他们真打算给的话。\n\n尽管有这样那样的问题，但这仍是中国一方的胜利。人们已经在筹划盛大的外滩游行，以及一个世纪以来第一次在上海上空升起中国国旗。由于没有任何外国势力干预，这就是我们的命了，现在除了尽可能有序地完成权力交接之外，我们几乎没什么可做。接下来我们只能收拾行李，告别，向着夕阳驶去。"
 china_events.228.d.keep: "结局已定，经表决一致通过：使馆城市工部局断然拒绝中国的最后通牒，并采取任何必要手段捍卫国际委任政府。现在，如果幸运的话，我们将看到1925年的那幕重演，当时国际联盟挺身而出捍卫了摇摇欲坠的英国租界，现在，外国舰队也应集结起来保卫我们，但在舰队赶到之前，我们的外籍驻军和志愿军将守住防线。也许中国人永远不会来——有人说他们的军队不过是用于炫耀和恫吓的工具，但近来的战事表明——他们会来，且千军万马，矢志不移。"
 china_events.228.a: "一个时代的终结。"
 china_events.228.b: "边境线必须画在这！"
 china_events.229.t: "使馆城市工部局：投票结果如下"
 china_events.229.d.voted_for: "结局已定，尽管有部分反对票，使馆城市工部局仍决定自行解散，并将其行使权力及领土归还中国政府，使馆城市将有秩序撤离所有愿意离开的人，最后撤出驻军。中国政府将根据企业主持有的股份和推断的利润对企业主进行补偿。对上海、天津和其他城市企业的补偿也将类似于商定的条款实行。诚然，会有人拒绝按照中国法律生活。撤离的有序程度也可能低于预期，而承诺的补偿需要一段时间才能实现，如果他们真打算给的话。尽管有这样那样的问题，但这仍然是[china.Capital.GetCapitalVictoryPointName]一方的胜利。人们已经在筹划盛大的外滩游行，以及一个世纪以来第一次在上海上空升起中国国旗。\n\n现在，除了命令我们的驻军交接，确保公民安全，然后最后一次返航，我们已没什么可做的了。"
 china_events.229.d.voted_against: "结局已定，尽管我们投了反对票，使馆城市工部局仍决定自行解散，并将其领土及行使权力归还中国政府，使馆城市将有序撤离所有愿意离开的人，最后撤出驻军。中国政府将根据企业主持有的股份和推算的利润对企业主进行补偿。事实上，在中国，我们的公民将被剥夺条约赋予的权利和自由——而这正是他们的祖先在过去几十年里所勇敢争取和捍卫的。这场闹剧以天真和荒谬开场，最终只是以混乱和流血作为结束。现在，我们必须抉择：是无视工部局的决定，以我们自己的方式捍卫使馆城市，还是仅仅尽最大努力保护我们公民的生命和财产安全。"
 china_events.229.a: "这将会是一个时代的落幕。"
 china_events.229.b: "正如我们所愿。"
 china_events.229.c: "简直不讲道理了！"
 china_events.230.t: "前途未卜的和平"
 china_events.230.d.will_be_attacked: "结局已定，尽管有部分反对票，使馆城市工部局仍决定自行解散，并将其行使权力及领土归还中国政府，使馆城市将有秩序撤离所有愿意离开的人，最后撤出驻军。中国政府将根据企业主持有的股份和推断的利润对企业主进行补偿。对上海、天津和其他城市企业的补偿也将类似于商定的条款实行。诚然，会有人拒绝按照中国法律生活。撤离的有序程度也可能低于预期，而承诺的补偿需要一段时间才能实现，如果他们真打算给的话。尽管有这样那样的问题，但这仍然是[china.Capital.GetCapitalVictoryPointName]一方的胜利。\n\n然而，谁也不能忽视工部局尚未表决的票数。有传言说一个或多个国家将拒绝承认这一结果，并且可能已经制定了与中国的战争计划，我们的城市被夹在中间。我们的一些公民无疑会欢迎这样的结果，尽管这很可能会带来毁灭。但是，这些问题对我们已不再重要，委任即将结束。我们几乎没有什么可做的了，只能收拾行李，告别，驶向夕阳……"
 china_events.230.d.peaceful_reunification: "结局已定，经表决一致通过：使馆城市工部局自行解散，并将其行使权力及领土归还中国政府，使馆城市将有秩序撤离所有愿意离开的人，最后撤出驻军。中国政府将根据企业主持有的股份和推断的利润对企业主进行补偿。对上海、天津和其他城市企业的补偿也将类似于商定的条款实行。诚然，会有人拒绝按照中国法律生活。撤离的有序程度也可能低于预期，而承诺的补偿需要一段时间才能实现，如果他们真打算给的话。尽管有这样那样的问题，但这仍是[china.Capital.GetCapitalVictoryPointName]一方的胜利。我们已经没什么可做，只能收拾行李，告别，向着夕阳驶去。"
 china_events.230.a: "一个时代的终结。"
 china_events.231.t: "使馆城市的终末"
 china_events.231.d.will_be_attacked: "使馆城市工部局于昨天深夜进行了表决，结果是经多数同意，解散国际委任政府。在表决出结果之前，他们一定经过了大量的辩论。移交进程将在我们公正的监督下开始。使馆城市将有秩序撤离所有愿意离开的人，最后撤出驻军。中国政府将根据企业主持有的股份和推断的利润对企业主进行补偿，但所有理赔请求都需要经过彻底核实。我们已经筹划了盛大的外滩游行，以及一个世纪以来第一次在上海上空升起中国国旗。百年国耻终于结束了，不是吗？\n\n但是，我们决不能忽视，并非工部局中的每个列强都投票支持解散。我们确实应该庆祝，但也要为冲入做好准备。尽管并不一定发生，但防人之心不可无，从今往后，若企图侮辱中国，必将付出惨重的代价。"
 china_events.231.d.peaceful_reunification: "使馆城市工部局于昨天深夜进行了表决，令人惊讶的是，工部局全票通过解散国际委任政府。在表决出结果之前，他们一定经过了大量的辩论。移交进程将在我们公正的监督下开始。使馆城市将有秩序撤离所有愿意离开的人，最后撤出驻军。中国政府将根据企业主持有的股份和推断的利润对企业主进行补偿，但所有理赔请求都需要经过彻底核实。我们已经筹划了盛大的外滩游行，以及一个世纪以来第一次在上海上空升起中国国旗。消息已经传开：百年国耻终于结束了。"
 china_events.231.a: "还没完呢。"
 china_events.231.b: "万岁！"
 china_events.232.t: "使馆城市工部局：投票结果如下"
 china_events.232.d.voted_for: "结局已定，尽管存在部分反对票，使馆城市工部局仍决定自行解散，并将其领土及行使权力归还中国政府。使馆城市将有序撤离所有愿意离开的人，最后撤出驻军。中国政府将根据企业主持有的股份和推算的利润对企业主进行补偿。对上海、天津和其他城市企业的补偿也将以商定的类似条款施行，但拒绝生活在中国法律下的仍然不乏其人。诚然，撤离的有序程度大概率低于预期，乃至于承诺的补偿将被拖延赔付，不过前提是他们真打算给。\n\n然而黑云压城城欲摧，一个更大的担忧阴云不散——工部局内的反对票。表面上看，工部局的决定具有效力，但国际博弈从来不会这么简单。谣言四起，声称外国军队将再次进占中国土地。尽管如此，我们只要投票解散使馆城市并结束国际委任统治，就可以免除所有进一步的责任。一旦中国的旗帜在外滩升起，我们就抛掉了这个烫手山芋。"
 china_events.232.d.voted_against: "结局已定，尽管我们投了反对票，使馆城市工部局仍决定自行解散，并将其领土及行使权力归还中国政府，使馆城市将有序撤离所有愿意离开的人，最后撤出驻军。中国政府将根据企业主持有的股份和推算的利润对企业主进行补偿。事实上，在中国，我们的公民将被剥夺条约赋予的权利和自由——而这正是他们的祖先在过去几十年里所勇敢争取和捍卫的。这场闹剧以天真和荒谬开场，最终以混乱和流血作为结束。\n\n但是胳膊拧不过大腿。我们所能做的最多也不过是保护我们公民的生命和剩余的财富，并确保尽可能有秩序地疏散。之后，我们将扔掉这个烫手山芋，抹掉与中国的所有不必要联系。"
 china_events.232.a: "一个时代的落幕。"
 china_events.232.b: "愚蠢。"
 china_events.233.t: "使馆城市工部局：无视最后通牒"
 china_events.233.d: "上海传来照会：经表决，使馆城市工部局决定无视我们的最后通牒，不会主动交出使馆城市。夺取使馆城市对我军来说只不过是小菜一碟，但工部局成员国可能会选择介入，我们必须仔细考虑后果。虽然最终的胜利肯定是我们的，但旷日持久的战争可能会影响我们的其他目标。我们应该给这些傲慢的鬼子发去最后警告吗？"
 china_events.233.a: "威胁开战。"
 china_events.233.b: "让步。"
 china_events.234.t: "中国的最后警告"
 china_events.234.d: "中国发来了所谓的“最后警告”，明确宣布武力夺取使馆城市的意图。与过去一样，中国军队可以相对轻松地夺取上海、天津和其他租界，然后对海外派来的报复性报复性舰队和军队严阵以待。尚不明确的一点是，我们，以及其他九国公约缔约列强会不会介入战争，完善使馆城市的防御体系。\n\n如果我方力量足够强，中国仍有可能退缩，但如果他们不退缩，我们就会陷入战争。"
 china_events.234.a: "废除委任政府。"
 china_events.234.b: "准备好战争。"
 china_events.235.t: "战争将至"
 china_events.235.d: "中国发来了所谓的“最后警告”，明确宣布武力夺取使馆城市的意图。工部局中的保护者可能会迫使中国退缩，但我们必须采取一切合理的预备措施，为战争做好准备。我们可以寄希望于驻上海和天津的外国驻军、万国商团和一些自发性的民兵组织。至于警察，由于半数警察是中国人，且委任统治范围内的每个城市都是中国平民占多数，我们很怀疑警察的忠诚度。作战计划制订时，将军们建议将所有部队和非华人平民撤回旧租界的边界。\n\n采取这些措施后，我们最多只能希望中国退缩，或者我们能战斗到国际上的盟友出手拯救为止。"
 china_events.235.a: "我们必须期盼和平……"
 china_events.236.t: "使馆城市被保护"
 china_events.236.d: "显然，使馆城市工部局对我们的最后警告置若罔闻，至少一个成员国发誓捍卫国际委任政府。这意味着，如果我们想要夺取使馆城市，就有可能打一场旷日持久的危险战争。我们确实可以退缩，但带来的政治后果将对我们的政权成毁灭性打击；余下的选择中，最好的一个可能是尽快占领使馆城市，并让外国人失去重夺城市的意愿，只要给他们造成足够大的人员伤亡和战争物资损失，就可以做到这一点。"
 china_events.236.a: "我们打不过他们。"
 china_events.236.b: "是时候结束这场哑谜了。"
 china_events.237.t: "最后一幕"
 china_events.237.d: "到头来，使馆城市工部局的承诺也不过是虚张声势。决定性的时刻到来时，没人站出来保护我们。在没有任何正式交接协议的情况下，中国军队很快就会席卷各城市，建立他们的秩序。在那之前，我们无疑要面对恐慌、抢劫，外国人会争先恐后地挤上那艘命中注定的“离开上海的最后一班”轮船，无论是什么船。无论我们选择在外滩和中国占领军对垒，还是在混乱中逃离，国际委任政府的故事即将走向结局。"
 china_events.237.a: "一切都结束了。"
 china_events.238.t: "光荣大胜"
 china_events.238.d: "终于有人敢与帝国主义叫板了。尽管他们拥有强大的军队并不断施加威胁，但是使馆城市的那些“保护者”已经随风而去了，并且他们也放弃了那个所谓的“国际委任政府”。现在只需要一声令下，我们的军队就可以不遭遇任何抵抗地开进上海、天津等城市。没错，也许还会有一些阻挠，但是这次胜利的重大意义却是毫无疑问的。这是中国光荣的一天，也是百年国耻的终结之日。"
 china_events.238.a: "全体都有，齐步走！"
 china_events.239.t: "峰回路转"
 china_events.239.d: "这看似不可能，但确确实实发生了：面对工部局中担保人的坚决回应，中国退缩了。这可能是能听到的最好的消息，这个消息传出时，整个城市无疑会庆祝上几天几夜。当然，中国的威胁仍然存在，事实上也并未减缓，但收回使馆城市失败将给中国政府带来可怕的政治后果。未来，任何官员都会因为这次失败而受害，而且他们不太可能再冒险行动。因此我们可以认定，在接下来几年中，中国都不会造成更大的威胁了。"
 china_events.239.a: "万岁，万岁，万岁！"
 china_events.240.t: "中国退缩"
 china_events.240.d: "出乎大多数人的意料，面对工部局的坚决回应，中国退缩了。这个消息传出时，使馆城市无疑会庆祝上几天几夜。当然，中国对他们独立威胁仍然存在，事实上也并未减缓，但收回使馆城市失败将给中国政府带来可怕的政治后果。未来，任何官员都会因为这次失败而受害，而且他们不太可能再冒险行动。因此我们可以认定，在接下来几年中，使馆城市都不会受到更大的威胁了。"
 china_events.240.a: "绝好的消息。"
 china_events.300.t: "大清归来"
 china_events.300.d: "对境外观察家来说，1911年的辛亥革命标志着统治中国数百年的满清王朝寿终正寝，看起来面对一次又一次的失败，统治中国人民如此之久的天命终于给帝制画上了句号。\n\n世界大战结束后，宣统帝复辟，中国政局发生了戏剧性的变化。一开始，保皇派只能与直系结盟，但在过去几年中，他们成功让清王朝完全复辟。现在，[ROOT.GetLeader]皇帝在[FROM.Capital.GetCapitalVictoryPointName]正式宣布，中国已经统一，大清将重申中国在东亚的文化和政治霸权。"
 china_events.300.a: "真是翻天覆地啊！"
 china_events.301.t: "直系的胜利"
 china_events.301.d: "在北伐战争中，直系对中国的统治和控制力受到了充分挑战，但随后，他们拥立宣统帝并复辟清朝，吴佩孚、曹锟以及直系巩固了对北方的控制。\n\n过去几年间，直系经历了黑色星期一的经济动荡，还有华东混战，尽管如此，他们还是挺过了风暴。其他军阀曾试图从直系控制中脱离，但直系还是击败了所有敌对政府，再次统一了中国。曹锟在[FROM.Capital.GetCapitalVictoryPointName]发表了精彩的演讲，宣布直系要实现中国的现代化，再次确立中国在世界上的影响力。"
 china_events.301.a: "北方又一次统治了中国。"
 china_events.302.t: "直系统一中华民国"
 china_events.302.d: "虽然辛亥革命取得了成功，但共和中国的梦想似乎随着宣统复辟而瓦解了。然而，在八省联合崩溃期间发生的满族保皇派的政变失败之后，直系领袖宣告了北洋政府的回归。\n\n随着宪法的回归以及近期[ROOT.GetLeader]大总统的当选，直系主导的民国试图延续辛亥革命的传承。只有时间能证明直系是否能成功延续从军阀派系到正式的民国的过渡——但他们对国家的统一表明他们也许是最有能力做到这一点的。"
 china_events.302.a: "直系军阀的新时代。"
 china_events.303.t: "奉天政府的胜利"
 china_events.303.d: "虽然奉天政府在第三次和第四次直奉战争中几近败亡，但他们在东北坚守了十余年，直到最终取得成功。随着他们近期在第五次直奉战争中以及随之到来的[GetYear]年护法运动中取得胜利，[ROOT.GetLeader]大帅正式宣布成立一个统一的中华民国。\n\n尽管他们在战场上和国家统一大会上取得了成功，但奉天政府必须应对之后的战斗——这样才能赢得中国人民的心。对许多人来说，[ROOT.GetLeader]大帅仍然是一个军阀，只有时间才能证明奉天政府是否配得上成为辛亥革命的继承者。"
 china_events.303.a: "[FNG.GetLeader]终成其未竟之事。"
 china_events.304.t: "中华民国维新政府宣告成立"
 china_events.304.d: "今天，中国传来了一则令人震惊的消息：日本扶植的傀儡政权正式宣布自己为“中华民国维新政府”。[JAP.GetNameDef]的代表和该政权的中国支持者出席了[ROOT.GetLeader]大总统的演讲，他在演讲中对中国统一和中日关系表示赞赏。\n\n作为[JAP.GetNameDef]反帝泛亚圈计划的一部分，成立中华民国维新政府的目的是将中国变为所谓“与日本一道将亚洲从帝国主义手中解放出来的盟友”。这是一个大胆的尝试。虽然这个政府的领导人都是中国人，但毫无疑问，它只对东京负责。"
 china_events.304.a: "旭日在中国上空高升……"
 china_events.305.t: "阎锡山宣告中国统一"
 china_events.305.d: "多年来，[ROOT.GetLeader]督理作为军阀统治着孤立而贫穷的山西省，同时在中国的政治舞台上保持中立立场。在中国近期的事态发展中，晋系军阀抛弃了其中立的立场，并成功击败了对立政府。\n\n现在，作为复兴后的中华民国的首任大总统，[ROOT.GetLeader]希望能将他那独特的意识形态推广到崭新的中华民国国内各地——他希望这能为混乱的中国带来秩序。这位新大总统宣布，他希望维持亚洲的和平、稳定与中立，同时也向世界再次宣告中国的实力和主权。"
 china_events.305.a: "阎大总统确实是一名风云人物。"
 china_events.306.t: "国民军统一中国"
 china_events.306.d: "在被奉系军阀和直系军阀击败后，支离破碎的国民军在二十年代末撤入了山西省。在那里他们待时而动，在赢得与督理阎锡山的权力斗争后，他们从该省脱颖而出，并成功将中国统一到[ROOT.GetLeader]那狂热的革命意识形态之下。\n\n现在，作为复兴后的中华民国的首任大总统，[ROOT.GetLeader]已经宣布，新民国将作为中国新生革命的前沿阵地。在前国民军的领导下，中国新政府宣布其将成为反抗帝国主义的解放的新革命的先锋，这无疑会极大地动摇亚洲的旧秩序。"
 china_events.306.a: "国民军革命已经降临中国。"
 china_events.307.t: "一贯道领导下的中国"
 china_events.307.d: "中国发生了翻天覆地的变化：宗教领袖[ROOT.GetLeader]宣布国家统一在他和他的一贯道信徒之下。在战场上击败所有竞争对手的政权后，中国的新最高领袖在[FROM.Capital.GetCapitalVictoryPointName]的广大民众面前发表演讲，将统一献给了“无生老母”。\n\n新政权宣布中国将孤立于世界事务之外，预计许多人（中国人和外国人都有）很快就会因恐惧离开中国。看起来，随着这个邪教开始让中国人民信仰其秘传意识形态，中国在不久的未来内都会黯淡无光。"
 china_events.307.a: "中国迎来了新时代。"
 china_events.308.t: "[FROM.GetNameDef]宣告成立"
 china_events.308.d.KMT: "随着国民革命军解放了中国大片土地，[ROOT.GetLeader]主席正式宣布中华民国再次成立了。仪式举行的地点是颇具纪念意义的南京总统府大堂，1912年，孙中山先生就是在这里宣誓就职中华民国临时大总统，宣告了中华民国的第一次成立。\n\n虽然国民党重回中国大地并站稳脚跟已经有一段时间，但一直以来，他们还是被轻视为转瞬即逝的起义军。国民党左派的目标是建立由国民党领导的一党社会主义国家，以结束困扰中国多年的混乱局面，让中国在国民党训导下安全地步入公正、民主的公民社会，如今，他们终于击败了所有对手，获得了国际上的承认（虽然某些承认可能是不情不愿的）。"
 china_events.308.d.LCS: "随着红军解放了大片土地，社会主义对中国的统治已无可阻挡。最初，由于本就规模尚小的中国工团主义运动，其内部仍在持续分裂，人们认为，这个很大程度上依靠境外社会主义国家支持的[FROM.GetLeader]政府根本就站不住脚。\n\n但是，他们还是克服了种种艰难险阻，将中国大部分地区统一在一面旗帜下，获得了世界大国的承认（虽然某些承认可能是不情不愿的）。在国民革命的星火余烬上，一个工团主义联合政府建立起来，要带领中国在旧秩序的废墟上建立起新秩序，从军阀时代的蹂躏中走向复兴。"
 china_events.308.a: "孙中山先生革命中国的理想不倒！"
 china_events.308.b: "中国革命已然到来。"
 china_events.308.c: "我们必须阻止国民党的威胁！"
 china_events.309.t: "中华民国宣告成立"
 china_events.309.d: "最近中国传来了混乱的消息，称争夺领导权的战争已将快速结束。[FROM.GetLeader]领导的国民党右派成为了笑到最后的胜者，并在青天白日满地红的旗帜之下宣告了中华民国的统一。\n\n[FROM.GetLeader]总司令遵循孙中山先生的遗愿，向中国和世界人民承诺这是中国的新时代，承诺将会扭转欧洲列强带来的屈辱，并带领中华民族走向伟大。国民党究竟能有何作为，尚待时间的证明。"
 china_events.309.a: "国民党终成其未竟之事。"
 china_events.310.t: "中华联省宣告成立"
 china_events.310.d: "在[FROM.GetLeader]的国防军控制了大半个中国后，一个崭新的共和国也伴随着联省军在天安门的阅兵于北京宣告成立。西方常说的中华联省已经完全取代了之前得到国际承认的中国政府。在其权力得到稳固后，国际社会承认它只是时间问题。\n\n联省政府打算组织一个“联省会议”，其代表从所有已经解放的省中选举，并共同起草新宪法，同时组建一个正式的临时政府，直到有条件举办全国选举为止。"
 china_events.310.a: "陈炯明万岁！联省万岁！"
 china_events.310.b: "他们真的会给中国带来民主吗？"
 china_events.311.t: "直系逆流而上统一中国"
 china_events.311.d: "北伐战争后，直系的最大危机莫过于宣统维新政变成功——这导致曹锟和吴佩孚殒命。政变后，直系残党被赶出了直隶，并逃往与他们结盟的四川，在那里建立了与大清对立的政府。\n\n现在，直系走出了四川这个饱受饥荒蹂躏的省份，打败了所有统一路上的对手，成为了名副其实的全国政府，通过一个又一个军事上的胜利返回了他们名字的由来——直隶。现在，满清终于被击败，[ROOT.GetLeader]宣布在直系的领导下，中华民国要走向复兴。只有时间才能证明他们能否赢得下一场战役——赢得民心。"
 china_events.311.a: "直系证明了他们不可战胜。"
 china_events.313.t: "刘湘将军宣告中国统一"
 china_events.313.d: "四川，这个贫穷的西部省份，以省内各路军阀争斗不休而闻名。该省在内战中四分五裂，然后又被饥荒吞噬，饿殍遍野。在这个动荡时期，刘湘将军和他的实业团成功战胜了对手，统一了四川。\n\n刘湘将军谴责中央政府的领导，带领四川走上了战争之路，成功击败了所有竞争对手的政权。军事上取得胜利并镇压异见分子后，他宣布自己为复兴的中华民国的大总统。只有时间会证明他的政权和他的遗泽能否存续。"
 china_events.313.a: "川系响应了统一的呼声！"
 china_events.314.t: "[FROM.GetOldName]统一中国"
 china_events.314.d: "在这个政局风云变幻、战火纷飞的时代，体量较小的军阀派系也越过边界争取属于自己的权力和荣耀并不稀奇。令许多人感到惊讶的是，[FROM.GetOldNameDef]已经从他们原本所在的省份中脱颖而出，打垮了竞争对手的政权，并在他们的首都[FROM.Capital.GetCapitalVictoryPointName]宣告中国民国的成立。\n\n长期分裂的中华大地终于在[FROM.GetLeader]的领导下再次统一。虽然只有时间才能证明中国能否追赶上世界其他国家，但就目前而言，中国人民终于可以安下心来了，因为军阀混战的时代已经结束。"
 china_events.314.a: "中国人民终于站起来了！"
 china_events.315.t: "联帅统一中国"
 china_events.315.d: "谁能想到居然是这个腐败的八省联合能笑到最后呢？1936年的崩溃无疑一举摧垮了其腐朽的结构，几乎没人相信其能重回1929年的巅峰。然而事实是其现今的势力不光远远超出了过去的八省联合，更超出了所有人的预料。\n\n最终领导南直系统一全中国的人并非孙传芳而是齐燮元。这个令人厌恶的笑面虎鹰犬，在他的前任失去意识后迅速攫取了权力，并开始大力推行门户开放政策。现在看来德国人似乎在东方确保了一个旧日盟友，但仍有许多人担心这个新联合在未来还会再次陷入崩溃。"
 china_events.315.a: "安能让一介盗匪成了皇帝？"
 china_events.316.t: "直系的胜利"
 china_events.316.d: "在北伐战争中，直系对中国的统治和控制力受到了充分挑战，但随后，他们拥立宣统帝并复辟清朝，吴佩孚、曹锟以及直系巩固了对北方的控制。\n\n过去几年间，直系经历了黑色星期一的经济动荡，还有华东混战，尽管如此，他们还是挺过了风暴。其他军阀曾试图从直系控制中脱离，但直系还是击败了所有敌对政府，再次统一了中国。吴佩孚在[FROM.Capital.GetCapitalVictoryPointName]发表了精彩的演讲，宣布直系要实现中国的现代化，再次确立中国在世界上的影响力，摆脱外国压迫。"
 china_events.316.a: "玉帅干得好！"
 china_events.340.t: "汪精卫屹立不倒"
 china_events.340.d: "[CHI.GetLeader]主席领导国民党从流亡中归来，并取得了二次北伐的辉煌胜利，但由于临时行动委员会等反对派日益壮大，他的统治摇摇欲坠。然而，虽然受到多方攻讦，汪主席还是成功巩固了对党的控制，粉碎了反对派。\n\n历经战乱几十年，中国终得和平，汪主席将继续带领国家走向现代化和复兴，实现他的革命导师、先总理孙中山的遗愿。"
 china_events.340.a: "汪主席才是先总理的正统接班人。"
 china_events.341.t: "临委会控制国民党"
 china_events.341.d: "在北伐失败后的流亡岁月里，国民党名义上的领导人是汪精卫，但留在国内的国民党人也自行组织了闽赣根据地政府，在此基础上，临时行动委员会成立了。1932年，他们发表了《对中国及世界革命民众宣言》，宣布实行更贴近人民的民粹社会主义纲领。\n\n多年后的今天，[CHI.GetLeader]主席宣布，临时行动委员会将转为革命委员会，领导人民大众消灭阶级，为中国农工创造崭新的革命未来。"
 china_events.341.a: "人民站起来了！"
 china_events.342.t: "改组会接管国民党"
 china_events.342.d: "虽然国民党成功统一了全中国，但在前主席汪精卫遇刺后，他们却陷入了内战。国民党分裂为数派，互相争权夺利，国家再次陷入内战浩劫。\n\n如今，曾仲鸣主席和陈公博总理宣布，改组会的北平政府已经击败了其他派系，取得了对党和国家的完全控制。外国观察家认为，中国将会在一批最激进的社会主义者推动下，走向威权社会主义的未来。"
 china_events.342.a: "崭新的中国诞生了……"
 china_events.343.t: "复兴社宣告胜利"
 china_events.343.d: "虽然国民党成功统一了全国，但在前主席汪精卫遇刺后，中国又重新陷入了内战。当各派势力争权夺利时，激进的中华复兴社设法夺取了政权，并宣布了国家紧急状态。\n\n在[FROM.Capital.GetCapitalVictoryPointName]的一场宏大演讲中，胡宗南委员长宣布了国民革命的新方向，并发誓要粉碎中国内外的一切敌人。复兴社关于极权主义革命的言论受到了萨文科夫、墨索里尼和莫斯利等人的启发，毫无疑问，中国民主的希望已经暗淡。"
 china_events.343.a: "国民革命迎来了黑暗时刻。"
 china_events.344.t: "胡汉民主席渡过难关"
 china_events.344.d: "[GXC.GetLeader]曾在莫斯科领导流亡的国民党中央执行委员会，重返中国故土的机会一度渺茫。然而，天上白日高悬，光芒终照耀在孙中山最勤勉的接班人身上。这位曾被流放的革命家，不仅在第二次北伐中带领本党取得了辉煌胜利，并顶住了新桂系阴险的背刺排挤企图，故而稳固了其所代表的元老派在党内的主导地位。\n\n如今主席及其旧右派阵营，正着手制定六年训政的具体议程，力求以最正统的方式诠释贯彻三民主义，确保孙中山先生的理想终得以实现。"
 china_events.344.a: "正统得胜！"
 china_events.345.t: "新粤系建立革命二元体制"
 china_events.345.d: "尽管[GXC.GetLeader]主席一度看似坚定自若，稳坐国民革命的掌舵之位，但他似乎并不像外界观察家所断言的那般不可动摇。在李宗仁领导的新桂系一次肆意夺权行动中，这位孙中山的门徒曾短暂被排挤出国家领导层。所幸在他的坚定支持者，广东省主席陈济棠的全力运作下，他得以重返政坛，再次执掌大权。\n\n随着恪守主义的主席与专横跋扈的军阀之间建立起一种脆弱而动荡的革命二元体制，所有反对新粤系的敌对势力都将被彻底扫除。而国民革命也势必朝更加专制的方向演变，昔日那场声势浩大的革命，也将只余残火余烬，归于沉寂。"
 china_events.345.a: "革命尚未成功。"
 china_events.346.t: "新桂系复兴中国"
 china_events.346.d: "就算以军阀时代的标准，广西也一直被国内外记者视为贫困而土匪横行的一潭死水。因此，很多人都没有意料到，竟然是李宗仁将军打败了党内外的对头，统一了全中国，夺取了政权。\n\n李宗仁将军掌握着这个高度军事化的省份，其拥趸将这里自豪地称作“革命的发祥地”，用强大而纪律严明的民团团兵击败了一切对头。如今，专制、自由和三民主义之间已经没有了分别，李宗仁主席正塑造着中国的未来。"
 china_events.346.a: "建设广西，复兴中国。"
 china_events.347.t: "西山派再起"
 china_events.347.d: "西山派是国民党右翼中一个鲜为人知的派系，几乎没有人会想到这些资深的“旧右派”成员会竟会登上全国政治舞台中心。该派系的成立完全是为了抗议并反对孙中山先生1924年改组中的社会主义元素，其领导人自宋教仁时代起就一直是国民党活跃党员，许多人更与这位已故先贤私交甚笃。\n\n西山派抓住第二次北伐结束后局势动荡之机，试图纠正消除国民党社会主义转向所造成的损害，并力求实现真正的中国宪政。"
 china_events.347.a: "老骥伏枥，志在千里。"
 china_events.348.t: "再造派解放中国"
 china_events.348.d: "已故的孙中山先生留下了一份褒贬不一的政治遗产：他是1911年辛亥革命中的杰出共和派领袖，也是庞大但颇具争议的国民党创始人。1925年，在其广州南方政府与北平北方政府的统一谈判失败之际，孙中山因肝癌病逝。作为一位尊称为“中华民国国父”的人物，他身后只留下了一个儿子孙科，而孙科最初却反被排挤在父亲亲手创立的政党权力结构之外。\n\n然而，命运的转折使得孙科得以重返政治舞台。在一批海外人士及西方受教育的技术官僚的支持下，他成功以自由主义纲领赢得了一场关键的党内选举，并由此重拾影响力。如今作为新任总统，他誓言要完成父亲未竟的遗志。"
 china_events.348.a: "有其父必有其子。"
 china_events.349.t: "中国国民革命第四军政变"
 china_events.349.d: "在国民党内部一向被轻视与猜忌的陈铭枢，如今却令整个中国乃至海外观察家大跌眼镜，他以胜利者的姿态推翻了此前南京的社会主义政府。陈铭枢及其国民革命军第四军出身的亲信集团，仍自称继承国民党，并誓言组建一个由生产人民党革命政府，以实现全体国民的共同富裕。尽管原本被认为与国民党左翼立场一致，但如今不少人开始怀疑人民生产党究竟会延续汪精卫与宋庆龄二人的路线，还是另辟蹊径、自开新局？唯有陈铭枢一人才知晓这个政权的真正未来走向。"
 china_events.349.a: "国民党不断演变。"
 china_events.350.t: "中国农民推翻国民党"
 china_events.350.d: "在一场令人震惊的突变中，主要扎根于农村的中国农民运动推翻了南京的国民党政府，并宣告成立新的革命政权，誓言彻底铲除中国社会中残存的封建势力。彭湃被许多人视为争取中国底层争取平等权利中的“近乎神明般”的人物，他作为中国新任革命领袖的崛起，成千上万人将预计逃离中国，尤其是地主与富人，而未来将如何发展，只有他一人能知晓。"
 china_events.350.a: "人民的革命终于到来了。"
 china_events.351.t: "黄埔系回归"
 china_events.351.d: "在北伐接近尾声之际，蒋介石总司令骤然离世，许多人一度认为“黄埔系”，这一群曾受教于他门下、出身黄埔军校的亲信旧部将随其一同没落，要么被清算，要么投奔国民党内的其他派系。然而出人意料的是，继承了蒋氏政治遗产的何应钦委员长，不仅领导黄埔系稳固了在国民革命军中的主导地位，更掌控了整个国家政权。\n\n如今，何委员长代表国民党完成了国家的统一，开启了党内“新右派”的新纪元。在他的麾下集结着从激进派到技术官僚等各色势力，构成了一个广泛复杂难以驾驭的政治联盟，委员长掌握着引领中华民族走向何方的诸多可能。"
 china_events.351.a: "委员长成为举世瞩目的焦点。"
 china_events.352.t: "土木系崛起"
 china_events.352.d_rkt: "在近代中国历史中，无数人物曾试图效仿先总司令蒋介石的雄图伟业。而如今鉴于蒋介石的国民革命军派系依然活跃，并在国家统一的进程中显然继续肩负着尚未结束的历史使命。在何应钦委员长的领导下，这一派系得以延续，但随着他愈发倚重“小委员长”陈诚，这位沉稳的委员长最终在波澜不惊中被悄然取代。\n\n陈诚是年轻气盛的鼓动者，也是以农为本的改造者，他已崭露头角，主导中国的未来走向。他致力于建设仁政、集权且充满革命民主精神的新国家。作为一位出色的行政官员，陈诚立志打破中国几千年来的治乱循环。"
 china_events.352.d_lkt: "在国民党政治局势不断螺旋上升的复杂局面中，很少有人会相信中央委员会竟会遭遇颠覆。更没人有能料到，这件事会由一个局外实干派实现。作为红色拿破仑邓演达的得力助手，“小委员长”陈诚不仅推翻了党的中央委员会，还建立了自己的国民党政权。\n\n陈诚是年轻气盛的鼓动者，也是以农为本的集权派改造者。和导师如出一辙，陈诚立志打破中国几千年来的治乱循环。"
 china_events.352.a: "黄埔系的白手套。"
 china_events.353.t: "蓝衣社革命"
 china_events.353.d: "蓝衣社曾被视作国民革命军黄埔系中无足轻重、甚至可以忽略的一支派系，如今却证明了世人当初对蓝衣社能力的低估判断是多么失策。这个神秘、激进且危险的组织，正是在二十世纪国民党败局的背景下迅速壮大。在滕杰与刘健群的领导下，蓝衣社与何应钦委员长建立了密切关系，但这段关系最终却也成为后者垮台的前奏。\n\n如今，随着蓝衣社接管中国国民革命的领导地位，已有报道称“旧党”遭到大规模清洗。各方正将畏惧的目光投向[FROM.Capital.GetCapitalVictoryPointName]，因为国民党这个党国体制，似乎正被导向一条黑暗而血腥的道路。"
 china_events.353.a: "白日黯淡。"
 china_events.354.t: "浙江革命者得势"
 china_events.354.d: "在国民党领导的民族革命和三民主义意识形态中，戴季陶是一位颇为奇特且刁钻古怪的人物。这位文思奇诡，著述深奥的作家，被许多人誉为中国本土的“文化革命之使徒”。他致力于民族复兴，堪称国民党“新右派”思想骨干的奠基者。\n\n戴季陶和CC系与不择手段的陈立夫、陈果夫兄弟所领导的中央俱乐部派联手，成功确立了文官对国民党军方的主导地位。如今，这个由技术官僚与思想家兼收并蓄的集团已掌控国家大权，但内部间已显现出分歧，尤其是陈立夫对戴季陶的理论颇有微词。"
 china_events.354.a: "以精神之新生，换国民之救赎。"
 china_events.355.t: "中国的明治维新"
 china_events.355.d: "令许多人震惊，尤其是国民党内部人士难以置信的是，党内一个长期备受嘲讽、被边缘化的派系竟然成功建制派的封锁下突围，赢得了胜利！张群成功凭借其新右派中的“政学系”，为国民党成功团结了全国人民。在表面上专制的党国体制下，张群却倡导的“新民主”思想，看来其执政根基似乎在党内饱受争议。\n\n极少有人能准确预见张群主席将带领国家走向何方。在由自由派、商界和社会名流组成的上层圈子的簇拥下，这位新晋“中国元老”(げんろう)受到了举世瞩目。"
 china_events.355.a: "觥筹交错，以建国家，"
 china_events.356.t: "由革命至忠战士所主之政"
 china_events.356.d: "在国家完成统一后，中国近日传来了一则令人震惊的消息。许多人原本就不相信国民党能够真正实现统一，但更少有人会相信朱培德将军最终会兑现这一承诺。作为一位彻头彻尾的革命军人，朱培德的传奇戎马生涯几经沉浮。行政院长李根源是他的左右手，与其一同维系着旧右派的忠诚、新右派的从属，以及部分左翼人士的勉力支持，朱主席的执政局面可谓举步维艰。\n\n甚至据传有内部消息透露，这位资历深厚、野心勃勃的行政院长正暗中图谋反对主席，召集起政学系旧部，意图复兴早已远去的北洋遗志。"
 china_events.356.a: "并非英雄，仅是一个普通战士。"
 china_events.357.t: "云南的热月政变？"
 china_events.357.d: "汪精卫、宋庆龄、邓演达等人在国民党左派高高在上，成日勾心斗角，许多外围社会主义干部在政坛上无立锥之地。许多人虽然对中央委员会愈发不满，但也只能被迫在改组会、工团党或临委会中选边站队。\n\n但朱德老总证明了党的错误！他与章伯钧等人合作，结束了野心家与官僚的统治。无论他们最终选择以何种形式治国，他们领导下的中国革命都必然是民主与社会主义的。"
 china_events.357.a: "农工群众当家作主！"
 china_events.358.t: "广东联省派统一中国"
 china_events.358.d: "人们本以为西南地区的联省运动在20年代就已一败涂地，被扔进了历史的垃圾桶，没什么人认为他们还有机会统一中国。但在陈炯明的领导下，联省派成功地实现了自己的目标，将20年代联省主义知识分子的时代精神带到高潮。而他们走到这一步靠的不是谈判统一，而是武力统一。\n\n[UPC.GetLeader]总执政肩负着制订省宪和大规模裁军的任务，许多人希望他能复兴中国的民主试验，完成联省运动的历史任务。"
 china_events.358.a: "恭喜你，总执政！"
 china_events.359.t: "陈炯明统一中国"
 china_events.359.d: "人们本以为西南地区的联省运动在20年代就已一败涂地，被扔进了历史的垃圾桶，没什么人认为他们还有机会统一中国。但在陈炯明的领导下，联省派成功地实现了自己的目标，将20年代联省主义知识分子的时代精神带到高潮。而他们走到这一步靠的不是谈判统一，而是武力统一。\n\n但在这个新生政府内，局势正变得越来越紧张。人民对政局表现地愈发不安，反对派已经发起民主化运动，而军队则显露出异议与反叛的苗头。显然，陈炯明要想挽救这场运动，就必须迅速采取行动。"
 china_events.359.a: "陈炯明成为举世瞩目的焦点。"
 china_events.360.t: "云南联省派统一中国"
 china_events.360.d: "几十年前，云南曾作为护国战争的大本营，正面挑战狼子野心的袁世凯与腐朽堕落的北洋政府。尽管之后云南在政治起伏中败下阵来，被迫孤立一隅。但云南的共和派还是上演了一出绝地反击，将中国统一在联省体制之下。\n\n[YUN.GetLeader]及其盟友试图在中国践行联省民主，而未来无疑将充满挑战。人们都在怀疑，新宪法将会有哪几条条款，新政府又会对它有几分尊重。但至少中国已重归一统，而举国上下都在欢庆和平的到来。"
 china_events.360.a: "从昆明到北京……"
 china_events.361.t: "桂系军阀统一中国"
 china_events.361.d: "长久以来，广西不过被认为是姊妹省广东的附庸，且似乎甘愿偏安于西南一隅。因此鲜有人能料到，逐鹿中原的最后赢家竟是旧桂系军阀。曾由臭名昭著的两广巡阅使陆荣廷领导的旧桂系已成功冲出大本营，深入北方腹地。\n\n在政府内部关于宪法、现代化、以及中华未来的争论不休之际，众人认为，旧桂系的最后一战很可能即将到来，究竟是战是和，终将见分晓。"
 china_events.361.a: "他们的根基已开始动摇。"
 china_events.362.t: "广州商团统一中国"
 china_events.362.d: "在1924年广州商团起义爆发后，鲜有人料到，当初最大失败者陈廉伯竟成了最后的最大赢家。作为曾经的广州商团领袖，同时也是全国最富有的人之一，陈廉伯在1927年平步青云成为广州市长，随后更是扶摇直上，最终成为统一全国的重要推手。\n\n然而，陈廉伯建立一个由商人主导的中华民国的雄心并非毫无阻力。如今，以政学系领衔要求回归真正民主的各方力量正逐步抬头，对这位商贾财阀统治的代表发起挑战。"
 china_events.362.a: "他还真当自己是“华盛顿”了？"
 china_events.363.t: "滇系军阀统一中国"
 china_events.363.d: "滇系军阀再次大举争霸，但人们大多认为他们的此番统一尝试不会有多少成果，毕竟滇系以往连华南首府广东都未能触及。然而出人意料的是，这次滇系军阀甚至拿下了北京。\n\n军人大总统[YUN.GetLeader]肩负重担，面对国家元气大伤、资源枯竭的局面，他摒弃了偏安一隅的做法，扭转了前任的政策，亲自统一了国家。如今，重建国家的艰巨任务落在了新任大总统及其派系的肩上。"
 china_events.363.a: "这可是蔡锷和唐继尧也无法实现的功业啊……"
 china_events.401.t: "中国寻求加入第三国际"
 china_events.401.d: "我们与中国国民党的联系可以追溯到1924年他们改组之时，当时，我们主动接触国民党先总理孙中山，寻求与国民党合作，皆因我们认为国民党运动是唯一一支有条件将社会主义带到中国的革命。我们帮他们在黄埔军校里训练了一支新的革命军，更重要的是，我们接收了第一次北伐失败后的国民党流亡者，例如汪精卫。\n\n多年之后，我们种下的种子结出了硕果——国民党成功在社会主义旗帜下一统中国，现在还主动与我们联系，希望加入第三国际。国民党承诺他们将会为在世界革命中解放他人出力，并希望帮助我们确保德意志世界秩序的终结，他们要求我们正式邀请他们第三国际。虽然我们非常乐意与中国同志合作，但政府内部的少数人对国民党的“党国”理想仍持怀疑态度，并警告不要与他们合作。"
 china_events.401.a: "我们将携手解放世界！"
 china_events.401.b: "他们疑似有点太不正统了。"
 china_events.402.t: "中国加入第三国际！"
 china_events.402.d: "我们加入第三国际的申请通过了，这是一大成功！第三国际很早承认了我党，多年来，还不断提供支持和援助，并拨付经费、帮助我们组织党务。可以说，正是第三国际的帮助，我们亲爱的国家才得以解放，打倒列强除军阀之口号才得以实现，对他们，我们的感激道不尽。我国的革命终于迎来了胜利，现在正是回报第三国际多年来无私奉献的时候，正是支援这场对抗[GER.GetNameDef]资本主义和帝国主义秩序的世界革命的时候。团结起来，英特纳雄耐尔，就一定要实现！我们要永远为全人类的、进步的社会主义而奋斗！"
 china_events.402.a: "我们将携手完成世界革命！"
 china_events.403.t: "我们的申请被拒"
 china_events.403.d: "虽然我们希望与第三国际携手合作，但这不过是一厢情愿，我们申请加入全球革命，却遭到了他们的拒绝。第三国际方面指出我们与正统工团主义之间存有意识形态差异，双方也多有意见分歧，以此为由，正式拒绝了我们加入他们的申请。曾经我们与第三国际的关系有多么密切，如今我们就有多么沮丧，不过这件事告诉了我们许多人一个道理：无论是何种意识形态，西方都仅仅是为了自身利益寻求与中国合作，而并非真正寻求建立平等关系。资本主义也好，社会主义也罢，西方仍然以帝国主义的思维方式为准绳。"
 china_events.403.a: "帝国主义者死性不改。"
 china_events.404.t: "中国寻求加入帝国公约"
 china_events.404.d: "自从我们在国民党那注定失败的北伐战争期间进行了有利于北京政府一方的干预以来，我们就一直与中国保持着密切的外交和经济联系。但这段关系有时会变得脆弱，在反租界叛乱期间尤其如此，那场叛乱几乎摧毁了我方盟友对中国的统治，但在我们的帮助下，他们赢得了这场斗争并统一了中国。\n\n现在，为了寻求更深入的合作，中国大使请求我们让中国正式加入我们的军事联盟。虽然这对双方都有利，但我们也意识到这种更为紧密的关系可能会危及我们的在华投资安全，因为中国将会被卷入任何德国被卷入的战争之中。但与此同时，这也会使我们有机会在中国受到外来攻击时更好地捍卫我们的利益。"
 china_events.404.a: "组成军事同盟将保护我们的投资。"
 china_events.404.b: "不能与他们结盟，这样我们的投资就毁了。"
 china_events.405.t: "中国加入帝国公约！"
 china_events.405.d: "今天，[ROOT.getAdjective]驻柏林大使就[ROOT.getNameDef]申请加入帝国公约一事电告了德国方面。与德国人多年来的军事合作和经济让步终于结出了硕果——中国终于被正式接纳到了德国的军事同盟之中。\n\n对[ROOT.Capital.GetCapitalVictoryPointName]政府来说，今天标志着历史的转折点。这场军事同盟是西方列强接受中国作为平等伙伴的重要一步，也是终束百年国耻的重要一步。"
 china_events.405.a: "中华与德意志战士将会并肩作战。"
 china_events.406.t: "我们的申请被拒"
 china_events.406.d: "尽管我们向德国人妥协让步了许多年，但柏林当局今天拒绝了[ROOT.GetAdjective]加入帝国公约的请求。德方称，他们对自己的投资安全感到担忧，且更为倾向维持模棱两可的安全关系。\n\n作为回应，我方政府已经谴责了德国对中国的帝国主义姿态，并称这是对中国人民和政府的巨大打击。但在另一份声明中，我们申明，尽管最近发生了一些事，但中国仍将继续与德国保持牢固的关系。"
 china_events.406.a: "数十年矣，洋人仍视我为鱼肉！"
 china_events.407.t: "中国寻求加入莫斯科协约"
 china_events.407.d: "过去几十年里，中国陷入了无休止的内战，大部分的战事都爆发于北京的清政府和盘踞满洲的奉系之间。在此期间，我们对中国的影响力仅限于边远地区，只有蒙古和新疆的些许友好势力愿意对抗德国和日本在该地区的帝国主义统治。幸运的是，当清王朝的霸权崩溃后，一个友好的政府得以完全控制中国。在内部局势稳定后，新政府希望正式加入我们的军事联盟以保护自身免受日本或德国的再度侵略。虽然这是一个互利的条约，但有些人认为中俄联盟与我们远东的利益相悖，中国人可能会成为我们的负担。"
 china_events.407.a: "中俄友谊地久天长！"
 china_events.407.b: "唯有俄罗斯能主宰欧亚的命运。"
 china_events.408.t: "中国加入莫斯科协约！"
 china_events.408.d: "俄方已经答复了我国驻莫斯科大使，他们欢迎我们正式加入莫斯科协约。世界强权已经在平等的原则上承认了我们，这是中华民族的伟大胜利，我们终于洗刷了百年国耻。当然，其他列强仍然会毫不犹豫地将我国打回几年前的贫弱状态，我们应继续前进，取得我们作为东亚大国应有的地位，抵抗德日帝国主义对我们和亚洲其他国家的侵略。"
 china_events.408.a: "中俄联合，共抗帝国主义！"
 china_events.409.t: "我们的申请被拒"
 china_events.409.d: "俄方已经答复了我国驻莫斯科大使，他们以利益冲突为由拒绝了我方的正式申请，但俄方申明，中俄两国间仍需要继续保持友好关系。无论如何，这对我们与列强平等谈判的愿望造成巨大的打击。然而，我们无论如何都必须继续争取与其他列强建立平等关系。无论列强是否承认，成为东亚强国都是我们的天命。"
 china_events.409.a: "数十年矣，洋人仍视我为鱼肉！"
 china_events.410.t: "中国寻求加入共荣圈"
 china_events.410.d: "中国军阀混战时期，我们支持奉系作为全中国的合法政府。我国政府为了帮助我们在大陆上的盟友，甚至直接入场干预了中国内战。然而，战争局势的发展不利于日本，我方势力被驱逐出中国。本以为我国永无机会重返中国，这段时间与中国政府的和平相处也形成了独特的和解局面。\n\n在走向中日战争的遗憾局面之前，中日许多人都努力让两国团结在泛亚主义的旗帜下，共同驱逐欧洲殖民者，解放我们受压迫的亚洲同胞。以北一辉为代表的政治思想家对中国的辛亥革命赞口不绝，而且中国许多高级军官都曾在日本接受教育。\n\n中国政府已经认识到这一举措是明智的。今日，中国大使致电我国政府，要求要求正式申请加入共荣圈。然而，从其语气中可以看出，他们希望得到平等伙伴的待遇，而日本不会成为中日关系中的老大哥，30年代日奉关系也将不会重演。过去这种说法显得十分可笑，可中国如今已是一个我们不可轻视的大一统强权了。"
 china_events.410.a: "亚洲是亚洲人的亚洲！"
 china_events.410.b: "中国人永远不能和我们平起平坐！"
 china_events.411.t: "中国加入共荣圈"
 china_events.411.d: "日本人已经联系了我们的大使，正式欢迎我们加入“共荣圈”。与日本人结盟完全超乎大众意料之外，就在不久前，他们还是主要帝国主义势力，试图阻止我们的崛起。然而，他们却忘记了中日之间源远流长的历史渊源。段祺瑞和他的旧皖系与东京的关系十分融洽，但并不像30年代的沈阳-东京关系那般卑躬屈膝。我们将确保我们与东京的新关系不会像世纪之初那样。相反，我们两国将建立起一种互利合作的平等关系。让我们携手彻底驱逐欧洲帝国主义者！亚洲属于亚洲人！"
 china_events.411.a: "中日联合，共抗帝国主义！"
 china_events.412.t: "我们的申请被拒"
 china_events.412.d: "日本方面已经与我们的大使取得了联系，以利益冲突为由拒绝了我们加入“共荣圈”的申请。东京方面强调，他们仍然希望与我们保持良好的关系，并认为泛亚解放是一个值得称赞的目标。我方政府则谴责东京方面显然是因为中日战争的战败而对中国心怀怨恨，将泛亚解放置于其狭隘的私利之下。从双方往来中不难看出，日本仍对其主导亚洲的地位感兴趣，他们顽固地坚持这种不切实际的想法。他们的软弱终将暴露无遗，而中国则会变得更加强大。"
 china_events.412.a: "早该知道日人不可信。"
 china_events.413.t: "中国寻求加入协约国"
 china_events.413.d: "在经历了多年的衰落和孤立之后，英国和法国在中国开启对外贸易方面发挥了至关重要的作用，尽管这一过程远称不上光彩：第一、二次鸦片战争与八国联军侵华，都是欧洲列强与病入膏肓的中国政府之间的激烈冲突。由于旧有的“一口通商”（广州通商体系），法英两国的影响力在华南尤为集中，尤其是香港一带；但在其势力鼎盛时期，旧协约国同样能够在北洋政府中施加影响，并通过上海这一重要的贸易枢纽扩展势力。\n\n然而，二十年代的革命迫使我们退居次位，将舞台让给了德国、日本与美国。与此同时，中国的统一也粉碎了我们在该地区仅存的直接影响力。但值得庆幸的是，新成立的中国政府（其中不乏旧时粤籍中间商出身者）在这场涉及我们双方的重大冲突中表现出愿意谈判的态度。尽管他们坚持此次谈判必须建立在平等的基础上，但这仍助力我们重建了积极的双边关系。"
 china_events.413.a: "东方贸易将再次畅通！"
 china_events.413.b: "中国必将为他们违背承诺而付出代价！"
 china_events.414.t: "中国加入协约国"
 china_events.414.d: "中国与协约国的关系一向跌宕坎坷，在公众眼中，英法两国堪称帝国主义的化身，而鸦片战争更是开启了一个百年衰落与冲突的时代。但贸易自有联结人心的力量，尤其是在广东，一批新兴的富裕商人作为中间阶层在辛亥革命后的政局中不仅收获了巨额财富，还掌握了政治权力并最终促成了中国的统一。随着最惨痛的领土损失得以挽回，中外关系新篇章的大门也随之缓缓开启。\n\n出于对抗列强的现实考量，双方都不得不抓住这一机遇。我们今日获悉，中国将被接纳加入协约国。我们坚持这一次必须以平等身份参与，并期望这种友谊能长久维系，即使这意味着要冒着让欧洲影响力死灰复燃的风险。我们希望与这些昔日列强结盟，能够开创一个以协约国为核心的崭新时代！"
 china_events.414.a: "我们重新迈入大国行列！"
 china_events.415.t: "我们的申请被拒绝"
 china_events.415.d: "协约国方面已联系我方大使，以利益冲突为由拒绝了我方加入[FROM.GetFactionName]的申请。他们强调仍希望与我方保持良好关系，并通过贸易实现互利共荣。然而，事实显而易见，他们并未将我们视为平等的国家，而只是一如既往地看作可以欺凌与支配的对象，正如他们过去百年来的所作所为。待到我们之间共同的战争结束，他们极有可能再次企图为剥削掠夺我国财富而伸出魔爪。然而，我们无论如何都必须继续争取与其他列强建立平等关系。无论列强是否承认，成为东亚强国都是我们的天命。"
 china_events.415.a: "数十年矣，洋人仍视我为鱼肉！"
 china_events.416.t: "中国寻求加入[ROOT.GetFactionName]"
 china_events.416.d: "美国建国后不久便开始对中国施加影响，早在1784年美国领事便已派驻广州。1844年的《望厦条约》正式建立双边关系后，中美贸易更是蓬勃发展。但这并不意味着两国关系一直友好无间——在第一次鸦片战争后，中国国力衰弱，美国曾要求在通商条款和治外法权方面获得优惠待遇。美国对“门户开放”政策的支持，最终演变成二十年代使馆城市的建立，这进一步加剧了两国关系的恶化。\n\n然而，美国在牵制欧洲与日本势力范围上的意愿，使其始终是我们颇为重要的合作伙伴，反过来，而一个强大且与美方结盟的中国，其庞大的陆军力量能与美方的海上霸权互补（前提是不能对美方造成威胁），这对构建太平洋地区稳定的安全架构至关重要。由于庚子赔款奖学金，许多中国知识分子曾赴美留学，使得美国在新政府中拥有不成比例的巨大影响力。如今我们正与美国在一场重大战争中并肩作战，以民主之名，巩固并深化这种长期合作关系，已是顺理成章之举！"
 china_events.416.a: "中国龙与白头鹰为太平洋带来太平！"
 china_events.416.b: "从长远来看，中国人对我们的利益构成威胁！"
 china_events.417.t: "中国加入[FROM.GetFactionName]"
 china_events.417.d: "中美关系并非一贯友好——在百年国耻期间，美国趁我们衰弱之际，强索苛刻的通商条件与治外法权，并力推门户开放政策，最终导致使馆城市的建立。然而，中美双边关系亦有积极一面，美国早在立国之初便派遣领事赴广州，中美贸易也带来了繁荣，庚子赔款奖学金更是资助了大批学者赴美深造，而美国在制衡在本地区的欧洲与日本势力方面，亦是不可或缺的力量。\n\n为维护太平洋地区的和平，我们以民主之名结成同盟实属顺理成章。凭借我国的雄厚陆军与美国的强大舰队，我们必将在这场战争中取胜，并以盟友之姿共同巡护太平洋。"
 china_events.417.a: "中国龙与白头鹰共赴胜利！"
 china_events.418.t: "我们的申请被拒绝"
 china_events.418.d: "美国方面已联系我方大使，以利益冲突为由拒绝了我方加入[FROM.GetFactionName]的申请。华盛顿方面强调仍希望与我方保持良好关系，并通过贸易实现共同繁荣。然而事实昭然，他们并未将我们视为平等的国家，而只是一如既往地看作可以欺凌与支配的对象，正如他们过去百年来的所作所为。待到我们之间共同的战争结束，他们极有可能再次企图为剥削掠夺我国财富而伸出魔爪。然而，我们无论如何都必须继续争取与其他列强建立平等关系。无论列强是否承认，成为东亚强国都是我们的天命。"
 china_events.418.a: "数十年矣，洋人仍视我为鱼肉！"
 china_events.422.t: "[FROM.GetNameDefCap]寻求加入[ROOT.GetFactionName]"
 china_events.422.d: "统一中国后，我们宣称要将亚太地区从帝国主义手中解放出来，很快便鼓舞了所有希望打破殖民枷锁的人。许多人自豪地吸收闽赣经验组建游击队，用黄埔精神来训练战士，他们自然希望我们给予援助支持。不出所料的是，那些推翻了殖民主子的人现在希望与我们结盟，从而抵御可能的侵略，甚至为亚洲解放事业出一份力。不过，在这片大陆迎来新时代之际，我们还是要好好考虑一下：世界革命听起来很美妙，但也要考虑地缘政治的现实，以及各国家、各民族的宣称、主张互相矛盾的问题。"
 china_events.422.a: "当然没问题啦，我们欢迎[FROM.GetAdjective]好兄弟！"
 china_events.422.b: "很遗憾，我们只能婉拒他们的好意。"
 china_events.423.t: "[ROOT.GetNameDefCap]加入[FROM.GetFactionName]！"
 china_events.423.d: "统一中国后，国民党宣称要将亚太地区从帝国主义手中解放出来，很快便鼓舞了所有希望打破殖民枷锁的人。换言之，我国能够独立自主地完成解放简直是个奇迹，亚洲还有许多正在奋力唤醒人民民族意识、阶级意识的组织，自主解放让我们与他们有所不同。亚洲的自由战士需要希望和激励，还有什么比两个反殖民灯塔更加鼓舞人心呢？因此，中国接受了我们加入[FROM.GetFactionName]的请求，为了共同防卫、繁荣和自由！"
 china_events.423.a: "肩并肩，手挽手，共卫亚洲人民的自由！"
 china_events.424.t: "我们的申请被拒"
 china_events.424.d: "中国这个文明古国还是这么傲慢，从古至今，朝代更迭，中国人只想要附庸，而不能容忍朋友。我们本来希望社会主义带来的人道主义和国际主义能促使中国人的改变，让他们向革命同志伸出援手，但事实证明这不过是空想。无论是害怕纠缠不清，还是担心民族主义领土声索，还是单纯出于现实考量，中国人拒绝了我们的结盟请求。"
 china_events.424.a: "革命来革命去，中国人骨子里还是一个德行。"
 china_events.425.t: "我们受邀加入[FROM.GetFactionName]"
 china_events.425.d: "今日上午，我国大使热烈欢迎了由中华混战之胜者[FROM.GetLeader]钦点的来自[FROM.GetNameDef]的中国代表团。众所周知，重归一统的中国一直寻求增强海外影响力，以重建中国在东亚的霸主地位。这事究竟是好是坏，还有待观察。\n\n中国大使诚挚地表达了他的观点，他认为我国政府应当同中国政府团结一致，携手致力于共同抗击外来帝国主义列强。我们还可以分享自己的资源，并在联合军演中积极表现，加强我们的合作。\n\n尽管我国政府内肯定有人支持此项提议，但仍有其他人怀疑中国的动机，并担心我国最终只会成为在他们亚洲新秩序下的走狗或傀儡。"
 china_events.425.a: "协力同心，共建和平！"
 china_events.425.b: "得了吧，我们啥好处都捞不到！"
 china_events.426.t: "[FROM.GetNameDefCap]加入我方！"
 china_events.426.d: "看来我们的外交官又取得了一项令人瞩目的外交成就，他说服了[FROM.GetNameDef]与我们合作，参加抗击帝国主义列强的国际革命事业。希望就算我国最终同所有帝国主义列强开战，与[FROM.GetNameDef]的友谊也能够牢不可破。共创自由亚洲！"
 china_events.426.a: "团结让我们更强大！"
 china_events.427.t: "[FROM.GetNameDefCap]拒绝了我们的邀请"
 china_events.427.d: "真不走运，尽管我们的外交团竭尽全力，但他们似乎未能说服[FROM.GetNameDef]加入我们的新秩序。看来，[FROM.GetNameDef]的人民要么以为我们的本意不良，或者单纯低估了我方实力。他们选择孤军作战，而非在我们的保护和引领下共同奋斗，他们这是搬石砸脚。"
 china_events.427.a: "吃亏的是他们。"
 china_events.450.t: "南方对峙"
 china_events.450.d: "华南地区的历史与政治交织在一起，尤其是在1911年辛亥革命之后。1913年的第二次革命、1915年的护国战争、1917年的护法战争，以及北伐战争的准备和开始，见证了华南各省在不同时期的结盟与背叛。\n\n1928年直系统一全国后，华南仍存在三大势力集团：统治粤桂两省的两广军阀、控制湖南和贵州东部的湘系军阀以及将贵州西部作为缓冲区的滇系军阀。这些势力相互合作，共同遏制直系干涉，但彼此之间也缺乏足够的信任。\n\n直隶霸权土崩瓦解后，华南三大支柱势力都陷入了动荡，国民党、联省派和地方派群起争夺各自省份的控制权。一旦这些省内冲突尘埃落定，争夺华南领导权的战争将不可避免。若其中一方悍然入侵了另一方，那么其他派系很可能也会被卷入其中。"
 china_events.450.a: "希望我们能够和平解决问题……"
 china_events.450_tt: "§R如果我们与相邻的独立势力爆发战争，第三方（如果是独立势力）可能会选择对其中一方或者对双方同时宣战。§!"
 CHN_south_china_war_get_GXC_alignment_compatible_key: "[GXC.GetRulingParty]与[ROOT.GetRulingParty]理念相容，即使过去曾发生冲突，但双方仍有许多共同价值观。虽然[GXC.GetLeader]并非可以无条件信任，但他仍是一个明白事理之人。无论如何，考虑到他坐拥广东的财富和广西的军队，我们最好能化敌为友。"
 CHN_south_china_war_get_GXC_alignment_incompatible_key: "[GXC.GetRulingParty]已在两广地区打败我方盟友成功夺权。双方意识形态水火不容，分歧已然不可调和。纵使广东物产丰饶，广西兵强马壮，可[GXC.GetLeader]却决不能信任。如果我们想在华南站稳脚跟，就必须解放广州。"
 CHN_south_china_war_get_HNN_alignment_compatible_key: "虽然[HNN.GetLeader]和[ROOT.GetLeader]并非总是意见一致，但在当下多事之秋，信任更是难得可贵。强敌环伺之下，[HNN.Capital.GetCapitalVictoryPointName]与[ROOT.Capital.GetCapitalVictoryPointName]结盟或许是为华南带来持久和平的唯一途径。"
 CHN_south_china_war_get_HNN_alignment_incompatible_key: "[HNN.GetLeader]领导着叛逆的[HNN.GetNameDef]，他位于[HNN.Capital.GetCapitalVictoryPointName]的基地更是对我们构成了重大威胁。鉴于当下情况，与他结盟已断无可能。若想让华南长治久安，与他为敌便是唯一的办法。"
 CHN_south_china_war_get_YUN_alignment_compatible_key: "[YUN.GetLeader]如今统治着[YUN.GetNameDefCap]，他是一位雄心勃勃的军阀，但与我们保持着良好关系。他统治着高度军事化的云南和贵州西部，麾下还有一支强大的精锐之师。为了彼此的存续，与[YUN.Capital.GetCapitalVictoryPointName]当局合作（至少目前）才是明智之举。"
 CHN_south_china_war_get_YUN_alignment_incompatible_key: "[YUN.GetLeader]如今统治着[YUN.GetNameDefCap]，他是一位雄心勃勃的军阀，但对我们抱有敌意。他统治着高度军事化的云南和贵州西部，麾下还有一支强大的精锐之师。为了自身存续，我们必须消灭他（无论现在还是将来），并解放[YUN.Capital.GetCapitalVictoryPointName]。"
 CHN_south_china_war_closing: "最后，我们始终可以选择保持中立，只需静观其变，等待冲突结束。倘若我们有足够把握，还可以乘机消灭被削弱的“胜利者”。但考虑到北方强权挥师南下已是迫在眉睫，或许此时果断出击掌握主动才是上策？"
 CHN_penalty_for_greater_alignment_tt: "§R由于双方意识形态相近，我们会受到额外的惩罚。§!"
 china_events.451.t: "对南方发动战争？"
 china_events.451.d: "湘系与滇系爆发了战争，这两个相距甚远但势力接壤的势力十余年来首次兵戎相见。双方关系急剧恶化的部分原因，在于争夺介于势力范围之间的贵州。两大军阀派系的当权者显然已是水火不容。\n\n[CHN_south_china_war_get_HNN_alignment]\n\n[CHN_south_china_war_get_YUN_alignment]\n\n$CHN_south_china_war_closing$"
 china_events.451.a: "我们将向湘系宣战。"
 china_events.451.b: "我们将向滇系宣战。"
 china_events.451.c: "我们将向双方宣战。"
 china_events.451.e: "在此争端中，我们将宣布中立。"
 china_events.452.t: "对南方发动战争？"
 china_events.452.d: "滇系与两广爆发了战争，双方统治的省份在华南政局中举足轻重。这场冲突不过是辛亥革命后双方关系的最新转折，此前滇系与两广曾多次结盟，共同抵抗北方势力，也曾彼此争夺政治主导权。显然，政治分歧将继续使双方水火不容。\n\n[CHN_south_china_war_get_GXC_alignment]\n\n[CHN_south_china_war_get_YUN_alignment]\n\n$CHN_south_china_war_closing$"
 china_events.452.a: "我们将向两广宣战。"
 china_events.452.b: "我们将向滇系宣战。"
 china_events.452.c: "我们将向双方宣战。"
 china_events.452.e: "在此争端中，我们将宣布中立。"
 china_events.453.t: "对南方发动战争？"
 china_events.453.d: "湘系与两广爆发了战争，双方在辛亥革命后再次陷入冲突。湖南经常介于北京和广州两大政府的势力范围之间，尽管湘系内部一些派系试图与两广当权者建立友好关系，但和平似乎仍遥不可及。\n\n[CHN_south_china_war_get_GXC_alignment]\n\n[CHN_south_china_war_get_YUN_alignment]\n\n$CHN_south_china_war_closing$"
 china_events.453.a: "我们将向两广宣战。"
 china_events.453.b: "我们将向湘系宣战。"
 china_events.453.c: "我们将向双方宣战。"
 china_events.453.e: "在此争端中，我们将宣布中立。"
 china_events.460.t: "华南战争"
 china_events.460.d: "在[FROM.GetLeader]决定以第三方身份大胆介入邻省现存冲突后，华南地区随即陷入了混战。两广、湘系、滇系三方势力各自为战，共同争夺华南控制权，这让该地区本已错综复杂的政治局势更加混乱。\n\n背叛与暴力在华南早已屡见不鲜，无论是在军阀混战时期，还是在后直系时代，华南都经历了剧烈的动荡。但眼下的这场战争究竟是会诞生一方霸主，还是让各方两败俱伤终致外来强权坐收渔利，仍需我们拭目以待。"
 china_events.460.a: "我们将夺得胜利。"
 china_events.460.b: "华南滑向混乱失序。"
 china_events.461.t: "华南战争"
 china_events.461.d: "两广在与邻省发生冲突后陷入困境，导致滇系和湘系联手对其展开绞杀。尽管两广堪称是华南最强大的军阀，但此番危机对[GXC.GetLeader]而言仍将是一场艰难的考验。\n\n背叛与暴力在华南早已屡见不鲜，无论是在军阀混战时期，还是在后直系时代，华南都经历了剧烈的动荡。但眼下的这场战争究竟是促成各方结成稳固同盟，还是让他们两败俱伤终致外来强权坐收渔利，仍需我们拭目以待。"
 china_events.461.a: "我们将夺得胜利。"
 china_events.461.b: "华南滑向混乱失序。"
 china_events.462.t: "华南战争"
 china_events.462.d: "湘系在与邻省发生冲突后陷入困境，导致滇系和两广联手对其展开绞杀。虽然湘系历来依仗直系庇护，但就目前看来，[HNN.GetLeader]除了其在贵州西部扶植的黔系军阀外别无盟友，只能独自应对这场冲突。\n\n背叛与暴力在华南早已屡见不鲜，无论是在军阀混战时期，还是在后直系时代，华南都经历了剧烈的动荡。但眼下的这场战争究竟是促成各方结成稳固同盟，还是让他们两败俱伤终致外来强权坐收渔利，仍需我们拭目以待。"
 china_events.462.a: "我们将夺得胜利。"
 china_events.462.b: "华南滑向混乱失序。"
 china_events.463.t: "华南战争"
 china_events.463.d: "滇系在与邻省发生冲突后陷入困境，导致两广和湘系联手对其展开绞杀。尽管[YUN.GetLeader]领导着一个军事化程度极高的强大西南军阀，但他们除了滇系支持的贵州政府之外别无盟友，因此在这场冲突中，滇系及其盟友将面临巨大的压力。\n\n背叛与暴力在华南早已屡见不鲜，无论是在军阀混战时期，还是在后直系时代，华南都经历了剧烈的动荡。但眼下的这场战争究竟是促成各方结成稳固同盟，还是让他们两败俱伤终致外来强权坐收渔利，仍需我们拭目以待。"
 china_events.463.a: "我们将夺得胜利。"
 china_events.463.b: "华南滑向混乱失序。"
 CHN.foreignpolicy.001.t: "[FROM.GetFactionName]成立"
 CHN.foreignpolicy.001.d.sinopacific_friendship_association: "今天，[FROM.GetName]外交部发表了新的中国外交路线。[FROM.GetName]以中国国民革命的成功和反帝主义立场为蓝本，正式宣告准备与亚洲的独立国家一同在亚太友好联盟的框架下合作。\n\n该联盟的创立目标和行动方针是与亚洲及非洲的各新兴国家和社会主义国家合作，促进经济发展和国家自足，以迎合当下各国独立于帝国公约和第三国际而发展、共创崭新世界秩序的意愿。"
 CHN.foreignpolicy.001.d.internationale_of_the_east_standard: "今天，[FROM.GetName]外交部发表了新的中国外交路线。[FROM.GetName]以中国国民革命的成功和反帝主义立场为蓝本，正式宣告建立他们的亚洲“国际”。\n\n该“国际”的创立目标和行动方针是不分宗教信仰及意识形态地为所有亚洲民族提供经济及政治援助，让亚洲各民族参与进来，以迎合新进解放各国打倒协约国和帝国公约之霸权、共创崭新世界秩序的意愿。"
 CHN.foreignpolicy.001.d.internationale_of_the_east_and_minshengpartnership: "今天，[FROM.GetName]外交部发表了新的中国外交路线。[FROM.GetName]以中国国民革命的成功和反帝主义立场为蓝本，正式宣告建立他们的亚洲“国际”。\n\n此外，[FROM.GetLeader]主席同时宣布了成立“民生合作经济伙伴协定”以促进亚洲各国经济合作，同时宣扬三民主义。此举旨在打倒西方霸权，让亚洲各民族参与进来，共创崭新世界秩序。"
 CHN.foreignpolicy.001.d.asian_peoples_antiimperialism_league: "今天，[FROM.GetName]外交部宣布，中国政府将在国际事务中采取强硬路线，正式推行亚洲人民反帝联盟，以加强自身及其卫星国、抵御帝国主义威胁。\n\n虽然中国宣称有必要维护成员国之间安全不可分割的原则，但实际上，这却是所谓“中华文化圈”(Sinosphere)概念的延伸，正如[FROM.GetLeader]委员长和国民党所表明的，他们将在国际关系中寻求推行种族和极端民族主义路线。许多人怀疑，这究竟意味着中国将动用暴力保卫边境，还是将转向保持孤立。"
 CHN.foreignpolicy.001.d.asian_peoples_internationale: "今天，[FROM.GetName]外交部发表了新的中国外交路线。[FROM.GetName]以中国国民革命的成功和反帝主义立场为蓝本，正式宣告建立“亚洲人民国际”，以促进后殖民国家在泛亚地区的合作。\n\n根据[FROM.GetLeader]的理论，当今的世界是帝国主义与反帝势力较量的战场，资本主义列强和第三国际最终都会崩溃。他与其他同志宣称，不同于日本过去的奴役压迫行径，他们将在亚洲大陆推行互助合作与发展援助，旨在最终实现全球“大同”。"
 CHN.foreignpolicy.001.d.new_asia_alliance: "今天，[FROM.GetName]外交部发表了新的中国外交路线。[FROM.GetName]以中国国民革命的成功和反帝主义立场为蓝本，正式宣告建立“新亚细亚联盟”，以推动亚洲的和平去殖民化与合作。\n\n[FROM.GetLeader]及其他温和派高层同志长期以来一直试图推动与亚洲大陆上其他反殖民势力间的对话，希望亚洲人民之间能够实现团结一致，增加文化交流，并对抗社会主义者提倡的国际主义。这个新联盟的名称来自新亚细亚学会，虽然其旨在实现各个新生国家间的平等共处，但中国无疑将处于主导地位。"
 CHN.foreignpolicy.001.a: "东方的一股威胁！"
 CHN.foreignpolicy.001.b: "一股解放的势力？"
 CHN.foreignpolicy.001.c: "中国要大展拳脚了。"
 CHN.foreignpolicy.002.t: "我们受邀加入[FROM.GetFactionName]"
 CHN.foreignpolicy.002.d: "今日上午，我国大使热烈欢迎了来自[FROM.GetNameDef]的中国代表团。中方大使诚挚地表达了他的观点，他认为我国政府应当同中国政府团结一致，携手致力于抗击帝国主义列强的国际反殖民主义革命运动。我们还可以分享自己的资源，并在联合军演中积极表现，加强我们的泛亚合作。\n\n尽管我国政府内肯定有人支持此项提议，但仍有其他人怀疑中国的动机，并担心我国最终只会成为在他们亚洲新秩序下的走狗或傀儡。"
 CHN.foreignpolicy.002.a: "协力同心，共建泛亚！"
 CHN.foreignpolicy.002.b: "得了吧，我们啥好处都捞不到！"
 CHN.foreignpolicy.003.t: "[FROM.GetNameDefCap]加入我方！"
 CHN.foreignpolicy.003.d: "看来我们的外交部又取得了一项令人瞩目的外交成就，他们说服了[FROM.GetNameDef]与我们合作，参加抗击帝国主义列强的国际革命事业。希望就算我国最终同所有帝国主义列强开战，与[FROM.GetNameDef]的友谊也能够牢不可破。共创自由亚洲！"
 CHN.foreignpolicy.003.a: "团结让我们更强大！"
 CHN.foreignpolicy.004.t: "[FROM.GetNameDefCap]拒绝了我们的邀请"
 CHN.foreignpolicy.004.d: "真不走运，尽管我们的大使已尽最大努力，但他似乎没能说服[FROM.GetNameDef]加入我们的共同反帝斗争之中。看来，[FROM.GetNameDef]人民要么以为我们的本意不良，或者单纯低估了我方实力。他们选择孤军作战，而非在我们的保护和引领下共同奋斗，他们这是搬石砸脚。"
 CHN.foreignpolicy.004.a: "吃亏的是他们。"
 CHN.foreignpolicy.005.t: "亚非会议"
 CHN.foreignpolicy.005.nomafcollapse.d: "自全球资本主义经济受黑色星期一冲击后，属于德意志帝国的旧世界秩序就一直备受动摇。[GER.GetNameDef]经济崩溃的涟漪波及了整个殖民世界，1936年的中南半岛起义和八省联合解体就是例子。北伐战争和抗日战争的胜利让[CHI.GetNameDef]得以成为第一个完全驱逐帝国主义势力的国家。\n\n故此，[CHI.GetLeader]和国民党的外交部长决定与发展中国家的领袖及大使们召开一场亚非大会，以聚首一堂讨论正在兴起的新政治秩序。尽管非洲各国尚未能从德国人手中获取独立，但中国人民无比乐意迎接非洲革命家，让他们成为反帝国主义国际斗争中的同志。\n\n与会代表都同意签署确认治理脱离后殖民亚非世界的关键原则，包括与所有与会成员国建立友好关系、深入考察社会文化问题以及共同促进发展中国家在国际台上的地位。亚洲迎来了新时代，而由[CHI.GetLeader]引领的中国也乐于扛起为发展中国家构建共同未来的大旗。"
 CHN.foreignpolicy.005.mafcollapse.d: "自全球资本主义经济受黑色星期一冲击后，属于德意志帝国的旧世界秩序就一直备受动摇。[GER.GetNameDef]经济崩溃的涟漪波及了整个殖民世界，1936年的中南半岛起义和八省联合解体就是例子。北伐战争和抗日战争的胜利让[CHI.GetNameDef]得以成为第一个完全驱逐帝国主义势力的国家。\n\n故此，[CHI.GetLeader]和国民党的外交部长决定与发展中国家的领袖及大使们召开一场亚非大会，以聚首一堂讨论正在兴起的新政治秩序。德属中非的急剧崩塌与解体牵起了一波非洲民族主义热潮，而中国人民无比乐意迎接非洲革命者，让他们成为反帝国主义国际斗争中的同志。\n\n与会代表都同意签署确认治理脱离后殖民亚非世界的关键原则，包括与所有与会成员国建立友好关系、深入考察社会文化问题以及共同促进发展中国家在国际台上的地位。亚洲迎来了新时代，而由[CHI.GetLeader]引领的中国也乐于扛起为发展中国家构建共同未来的大旗。"
 CHN.foreignpolicy.005.a: "为新时代喝采！"
 CHN.foreignpolicy.005.b: "值得赞赏的创举！"
 CHN.foreignpolicy.005.c: "我们有自己的打算。"
 CHN.foreignpolicy.006.t: "[FROM.GetNameDefCap]提供投资"
 CHN.foreignpolicy.006.d: "今天上午，我们收到了[FROM.GetNameDef]大使的消息，他们有意在我国展开投资项目。虽然我们最近成功保卫了国家独立，但与世界上其他工业国相比，我们的工业底子还是太薄了，并且缺乏发展资金。[FROM.GetNameDefCap]提出的投资计划，一方面可以加快我国工业化进程，另一方面也能防止帝国主义列强对我国进行资本主义渗透。然而，政府中有一些人反对这项计划，[FROM.GetNameDef]可能会借此对我国施加影响，也许投资只是用来掌控我们新生国家的糖衣炮弹。"
 CHN.foreignpolicy.006.a: "欣然接受。"
 CHN.foreignpolicy.006.b: "礼貌婉拒。"
 CHN.foreignpolicy.007.t: "[FROM.GetNameDefCap]接受投资"
 CHN.foreignpolicy.007.d: "驻[FROM.GetNameDef]大使给我们带来了好消息，该国欢迎我们前来投资，这可以帮助他们发展成为新兴力量，同时使我们的工业生产快速复苏，对双方的经济来说都是好事。希望这是一段伟大友谊的开始！"
 CHN.foreignpolicy.007.a: "互利友谊的开端。"
 CHN.foreignpolicy.008.t: "[FROM.GetNameDefCap]回绝投资"
 CHN.foreignpolicy.008.d: "驻[FROM.GetNameDef]大使给我们发来了令人失望的消息，他们拒绝了我们的提议，并表示不愿接受我方投资。也许他们此视为外部威胁，或是觉得我们借着互利互惠的幌子包藏祸心。不管原因如何，这单生意做不成是他们的损失。"
 CHN.foreignpolicy.008.a: "不论如何，祝他们好运。他们会需要这笔钱的。"
 CHN.foreignpolicy.009.t: "民生合作经济伙伴协定邀请我们加入"
 CHN.foreignpolicy.009.d: "[FROM.GetNameDef]宣布在外交政策和国际贸易方面采取新方向，紧接着宣布成立“民生合作经济伙伴协定”。这个组织致力于对抗资本主义压迫政权，同时为那些工业化程度不足的新生亚洲国家提供充分的现代化手段援助，以将团结亚洲各国，在中国的引领下开展经济合作。虽然政府中有许多认为此举将为我国经济带来巨大利益的人支持这一倡议，但也有人认为这种所谓合作实质是中国的帝国主义行为，因为毕竟这个组织是以中国领导为中心建立起来的。"
 CHN.foreignpolicy.009.a: "为中国同志干杯！"
 CHN.foreignpolicy.009.b: "如果我说，不呢？"
 CHN.foreignpolicy.010.t: "[FROM.GetNameDefCap]加入民生合作经济伙伴协定"
 CHN.foreignpolicy.010.d: "[FROM.GetNameDef]大使给我们发来消息，他们高兴地宣布决定加入民生合作经济伙伴协定。我们盛赞他们的明智决定，并期待着与我们的同志携手合作，建立免受帝国主义压迫的亚洲。"
 CHN.foreignpolicy.010.a: "反帝主义万岁！"
 CHN.foreignpolicy.011.t: "[FROM.GetNameDefCap]拒绝加入民生合作经济伙伴协定"
 CHN.foreignpolicy.011.d: "[FROM.GetNameDef]大使给我们发来消息，他们不愿意加入民生合作经济伙伴协定。也许他们觉得我们是借着互利互惠的幌子包藏祸心，又或者认定我们不会公平分配资源，因此拒绝参与更大的反殖民斗争。现在说什么都没用了，他们不明白，同是饱受列强和资本家凌辱的苦命人，只有泛亚合作携手共进才能让我们免于压迫，总有一天他们会后悔的。"
 CHN.foreignpolicy.011.a: "可惜。"
 CHN.foreignpolicy.200.t: "[FROM.GetFactionName]成立"
 CHN.foreignpolicy.200.d.asian_federation: "历经多年内战，中国终于在[FROM.GetLeader]的领导下实现了统一，不久后便重返世界舞台。为展现中国重塑大国地位、重建势力范围的决心，中国外交部宣布正式组建亚洲联邦。\n\n亚洲联邦体现了世界大战后中国知识分子的理想主义。他们致力于将亚洲重建为一个团结和谐的后殖民文明体，以此作为世界性组织的基石；该组织将由基于平等、非军事化与和平共处原则的各大洲联盟共同构成。"
 CHN.foreignpolicy.200.d.asia_pacific_treaty_organisation: "历经多年内战，中国终于在[FROM.GetLeader]的领导下实现了统一，不久后便重返世界舞台。为展现中国重塑大国地位、重建势力范围的决心，中国外交部宣布正式组建亚太条约组织。\n\n亚太条约组织基于国际合作、民主与反帝主义框架构建，该联盟的明确目标是在亚洲建立一个超联邦，以推行宪政秩序，并在必要时介入保护区域内新兴的后殖民民主国家。"
 CHN.foreignpolicy.200.d.asia_pacific_security_pact: "历经多年内战，中国终于在[FROM.GetLeader]的领导下实现了统一，不久后便重返世界舞台。为展现中国重塑大国地位、重建势力范围的决心，中国外交部宣布正式组建亚太安保条约。\n\n该联盟作为中国军事实力的延伸构建，旨在为摆脱殖民统治的亚洲国家提供替代日本与欧洲帝国主义的新选择。在第二次中日战争后的权力真空以及欧洲势力撤出亚太的预期下，中国正谋求在未来世界格局中确立自身地位。"
 CHN.foreignpolicy.200.a: "黄祸来矣！"
 CHN.foreignpolicy.200.b: "巨龙怒吼！"
 CHN.foreignpolicy.200.c: "东方崛起的一股新势力。"
 CHN.foreignpolicy.201.t: "东亚共同体"
 CHN.foreignpolicy.201.d: "千百年来，来自世界各地的船只和商队往返于中国进行贸易。帝国的兴衰皆系于控制这些宝贵商路的能力，而中国则以其作为世界中心的地位而自豪。然而，傲慢自大的朝廷转向闭关锁国——由此开启了长达数个世纪的停滞，并最终走向衰落。帝国主义者入侵的惨痛挫败以及紧随其后的内战，如同当头一棒警醒国人：世界已然向前发展。\n\n在[CHN.GetLeader]的领导下，中国从沉睡中苏醒，力图恢复大国地位。为此，不仅要巩固中国的军事霸权，更要重振昔日的经济主导地位。东亚共同体是中国重归一统后的首个重大国际经济项目，旨在建立一个可以替代欧洲和日本的贸易集团。尽管东亚共同体本质上是中国现有势力范围的延伸，但它也吸引了其他新兴后殖民国家的关注。"
 CHN.foreignpolicy.201.a: "让亚洲大陆紧密相连！"
 CHN.foreignpolicy.201.b: "中国寻求重建其贸易帝国。"
 CHN.foreignpolicy.202.t: "[FROM.GetNameDefCap]提供投资"
 CHN.foreignpolicy.202.d: "在最近加入[FROM.GetFactionName]后，我们的中国新盟友提议我们加入东亚共同体——一个旨在连接东亚、南亚以及太平洋地区的贸易集团。东亚共同体将推出一系列举措，涵盖经济发展、基础设施投资，甚至学术文化交流，并承诺将带来不受外国霸权影响的繁荣与团结。\n\n然而，尽管获得中国资本有望改善我们薄弱的产业基础，但人们担忧中方可能利用其影响力主导我国经济，并挤压本土产业生存空间。同时亦有顾虑认为，这将使我国经济暴露于不良影响之下，导致中方趁我国政治脆弱状态谋取利益。"
 CHN.foreignpolicy.202.a: "欣然接受。"
 CHN.foreignpolicy.202.b: "礼貌婉拒。"
 CHN.foreignpolicy.203.t: "[FROM.GetNameDefCap]接受投资"
 CHN.foreignpolicy.203.d: "驻[FROM.GetNameDef]大使给我们带来了好消息，该国欢迎我们前来投资，这可以帮助他们发展成为新兴力量，同时使我们的工业生产快速复苏，对双方的经济来说都是好事。希望这是一段伟大友谊的开始！"
 CHN.foreignpolicy.203.a: "互利友谊的开端。"
 CHN.foreignpolicy.204.t: "[FROM.GetNameDefCap]回绝投资"
 CHN.foreignpolicy.204.d: "驻[FROM.GetNameDef]大使给我们发来了令人失望的消息，他们拒绝了我们的提议，并表示不愿接受我方投资。也许他们此视为外部威胁，或是觉得我们借着互利互惠的幌子包藏祸心。不管原因如何，这单生意做不成是他们的损失。"
 CHN.foreignpolicy.204.a: "不论如何，祝他们好运。他们会需要这笔钱的。"
 CHN.foreignpolicy.300.t: "管理百两走马之民"
 CHN.foreignpolicy.300.d_base: "清王朝于1691年彻底征服蒙古，并在之后的二百多年间统治着这片大草原，但随着1911年蒙古革命爆发，清政府对蒙古的统治土崩瓦解。自扎纳巴扎尔担任第一世哲布尊丹巴呼图克图以来，蒙古的文化和社会经历了巨大变革。而随着日渐衰落的清王朝在草原上推行新政，蒙古王公和喇嘛们对清政府愈发不满。\n\n在博克多汗国宣布独立后短暂的独立斗争期间，蒙古历史上最伟大和最失败的政治家们纷纷走马上任。而这个无人承认的国家最终因内讧和无能而解体，于1919年被旧皖系政府吞并。而在此期间，蒙古的革命者们组建了一个新的组织：蒙古国民党，在他们的努力下，蒙古终于走到了今天这一步。"
 CHN.foreignpolicy.300.d_end: "不过在官方口径中，蒙古的行政事务通常由权力巨大的蒙藏委员会全权处理，因此维持这种现状或许更为可取。维持军事占领同样诱人且得到了总参谋部的支持，但这么做会让人联想到许多年前折戟蒙古的徐树铮。此外还有一个百试百灵的选择，即通过权力掮客，与世俗领主或喇嘛等当地权贵阶层展开合作，和他们达成一笔让汉人和蒙古人互惠互利的交易。"
 CHN.foreignpolicy.300.d_northzhili: "$CHN.foreignpolicy.300.d_base$\n\n在二三十年代，成立了许多试图争取蒙古自治的团体，他们都力图获得中央政府的官方支持，成为蒙古人的“代表”。在这一大背景下，德王、索王、云王、松王、那木囊苏伦和阿克旺那林等人都曾因捍卫蒙古权利而登上国际头条。但其中，最为执着努力、最以蒙古的普罗米修斯自居的还要数贡王的门生吴鹤龄，及其领导下的蒙古复员协进会。\n\n吴鹤龄成为了蒙藏委员会的领导人，蒙古复员协进会也在北京和南京建立了办事处，吴鹤龄于是非正式地加入了直系军阀，以便在中蒙事务中占据更有利的地位。而在直系的内部政治问题中，吴鹤龄维持着中立，他向政府保证，他打算为汉人和蒙古人提供最好的解决方案，并且已经马不停蹄地开始起草各种提案和法律。\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_southzhili: "$CHN.foreignpolicy.300.d_base$\n\n在二三十年代，成立了许多试图争取蒙古自治的团体，他们都力图获得中央政府的官方支持，成为蒙古人的“代表”。在这一大背景下，德王、索王、云王、松王、那木囊苏伦和阿克旺那林等人都曾因捍卫蒙古权利而登上国际头条。但其中，最为执着努力、最以蒙古的普罗米修斯自居的还要数贡王的门生吴鹤龄，及其领导下的蒙古复员协进会。\n\n吴鹤龄成为了蒙藏委员会的领导人，蒙古复员协进会也在北京和南京建立了办事处，吴鹤龄于是非正式地加入了直系军阀。吴鹤龄派往南方的心腹密切关注着南直系的一举一动，而其中为首的便是吴云鹏。相比于和曹锟与吴佩孚关系过于密切的吴鹤龄，吴云鹏也有着自己的野心与忠心。\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_fengtian: "$CHN.foreignpolicy.300.d_base$\n\n尽管在技术层面上，奉系军阀是中国对蒙古统治权最合法的继承者，但他们很少关注边疆事务，而是将精力集中在热河、察哈尔、巴尔虎、呼伦贝尔和锡林郭勒等地。尽管如此，仍有一些位高权重的蒙古本地权贵愿意与奉系合作，来换取蒙古人的自治权。因此，他们坚持要求曾担任过驻蒙古办事大员的刘翼飞再度出任此职，刘翼飞是张学良的亲信，具有改革派倾向。\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_yan: "$CHN.foreignpolicy.300.d_base$\n\n虽然阎锡山在整个外蒙古地区说一不二，但他对统治此地看起来力不从心。阎锡山曾派遣赵戴文前往察哈尔，徐永昌前往绥远，以谋求与当地王公合作，但他与蒙古人几乎算不上朋友。阎锡山是将蒙古领土划入中国行省的主要支持者之一，他经常利用七世章嘉呼图克图来阻挠蒙古自治事务，因此在管理蒙古领土方面，他没什么合适的人选。不过也可以选择能力出众、坚韧不拔的傅作义来维系对蒙古的控制权，虽然蒙古人恐怕对此难以容忍。\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_gmj: "$CHN.foreignpolicy.300.d_base$\n\n在蒙古人眼里，最糟糕的军队恐怕非国民军莫属了，在统治内蒙古期间，国民军给蒙古人带来了一片狼藉与无数苦难。尽管冯玉祥与内蒙古国民党和蒙古国民党首都派关系并不融洽，但他身边还是有几个不情不愿的盟友的。而除了冯玉祥外，还有极少数几个国民军军官没有被蒙古人拉黑，比如冯玉祥的亲密心腹张之江，以及颇为同情蒙古人的马鹤天。此二人都与白云梯、丹巴道尔吉等人关系密切，在必要时可以争取蒙古国民党的支持。\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_manchu: "$CHN.foreignpolicy.300.d_base$\n\n许多蒙古贵族心中仍未抛弃君臣纲常，这对清政府而言无疑是一件幸事。德王、松王、阿王、塔王，以及卓特巴扎普等人都宣誓效忠皇帝。而在外蒙古，第二代博克多汗的摄政大臣，如多尔济苏伦霍洛尔扎布、那木囊苏伦和阿克旺那林等人则要求给予蒙古人实质性自治，作为交换，他们将支持多尔济苏伦霍洛尔扎布向天子效忠。\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_rkmt: "$CHN.foreignpolicy.300.d_base$\n\n即使在国民党流亡苦行之时，蒙古国民党也和他们维持着盟友关系，双方（还包括内蒙古国民党）阵营中都有一部分人将两家视作是兄弟之党。蒙国党中的丹增和丹巴道尔吉等人对中国抱有一定好感，两党还联合建立了内国党，尽管如此，党内许多人士还是建议由一名与国民党关系密切的蒙古人来负责蒙古事务。而随着党内的不断争论，这一职位还剩下两个人选：由旧右派推荐的白云梯和新右派推荐的李永新。\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_generic: "$CHN.foreignpolicy.300.d_base$\n\n中国一直有一支规模庞大的专员队伍以专门处理蒙古地区事务，其中不乏众多技艺精湛、具备处理蒙古事务所必需的素质和专业知识。例如陈毅的门生王荫泰，以及陈箓等人。陈箓曾担任驻蒙古办事大员，凭借其专业知识，他再次被任命为驻蒙古办事大员一事几乎已成既定事实。\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.a: "[CHN_mongolia_get_unique_governor]"
 CHN.foreignpolicy.300.b: "蒙藏委员会的存在自有其合理性。"
 CHN.foreignpolicy.300.c: "维持军事戒严。"
 CHN.foreignpolicy.300.e: "和贵族打交道总是行之有效的。"
 CHN_mongolia_get_unique_governor_northzhili: "我们不能无视吴鹤龄，授权给他吧。"
 CHN_mongolia_get_unique_governor_southzhili: "吴鹤龄摔了没关系，吴云鹏还站着呢。"
 CHN_mongolia_get_unique_governor_fengtian: "刘翼飞之前干得蛮好的，再让他去一次。"
 CHN_mongolia_get_unique_governor_yan: "就交给傅大帅吧。"
 CHN_mongolia_get_unique_governor_gmj: "马鹤天以前就跟蒙古人关系很好。"
 CHN_mongolia_get_unique_governor_xsm: "让马鸿逵给他们托个底。"
 CHN_mongolia_get_unique_governor_rkmt: "白云梯就挺不错。"
 CHN_mongolia_get_unique_governor_rkmt_yun: "李永新向主席毛遂自荐。"
 CHN_mongolia_get_unique_governor_manchu: "多尔济苏伦霍洛尔扎布得到此职位是情理之中。"
 CHN.foreignpolicy.301.t: "踏足高原"
 CHN.foreignpolicy.301.d_base: "自1720年清王朝驱准保藏以来，中国在西藏的统治一直内外交困。西藏当局仍保留着相当大程度的半自治，中国对西藏领土的逐渐蚕食仅停留在理论层面。由于西藏当局公然无视了多份中英之间签署的条约，1903年，英国入侵西藏，试图征服藏地。\n\n1907年，西藏当局承认了清朝的宗主权，但在1911年辛亥革命爆发后，他们又开始密谋推动西藏地区的独立运动，然而其独立只得到了库伦的蒙古政府的承认。从简单的税收问题到推动军事和社会现代化，包括达赖和班禅在内的各路群体总是争执不休，莫衷一是，使得西藏的现代化步履维艰。"
 CHN.foreignpolicy.301.d_end: "不论如何，西藏的政坛都不会干坐着等待汉人为自己挑选主子。西藏革命党和吉求贡吞都在密谋推动各自对西藏未来的规划，僧伽也重新获取了立足之地，试图让达赖喇嘛总揽西藏大权。而多名军方人士则向[ROOT.GetLeader]保证，不需要动用多少兵力就能掌控整个青藏高原。"
 CHN.foreignpolicy.301.d_szc_liu: "$CHN.foreignpolicy.301.d_base$\n\n现代中国对西藏的统治和管理名义上由蒙藏委员会负责，此举的目的是不要重蹈清朝覆辙：先是维持对西藏的半自治统治，又在1910年仓促入藏干预。对四川而言，这一问题最为紧迫，尤其是刚刚才与藏人交战过的刘文辉。他主动提出要凭借自己在青藏高原的人脉来管理藏区。\n\n$CHN.foreignpolicy.301.d_end$"
 CHN.foreignpolicy.301.d_rkmt: "$CHN.foreignpolicy.301.d_base$\n\n现代中国对西藏的统治和管理名义上由蒙藏委员会负责，此举的目的是不要重蹈清朝覆辙：先是维持对西藏的半自治统治，又在1910年仓促入藏干预。虽然之前国民党政府内部很少有人对管理西藏地区管理抱有兴趣，但还是有一位勇敢的官员挺身而出：黄慕松。黄慕松的党务立场相对中立，他承诺将遵循党的意志，以自由、公正的方式处理西藏问题。\n\n$CHN.foreignpolicy.301.d_end$"
 CHN.foreignpolicy.301.d_manchu: "$CHN.foreignpolicy.301.d_base$\n\n现代中国对西藏的统治和管理名义上由蒙藏委员会负责，此举的目的是不要重蹈清朝覆辙：先是维持对西藏的半自治统治，又在1910年仓促入藏干预。西藏的现代化主义者对满清评价不高，但青藏高原上还是有一些对天子忠心耿耿之人。藏族人洛桑坚赞已自荐担任西藏办事大员，他与班禅关系密切，还曾在北洋政府中担任议员。不知是为了维护西藏自治还是其他什么理由，他对清政府的大部分同化政策都保持着顺从。\n\n$CHN.foreignpolicy.301.d_end$"
 CHN.foreignpolicy.301.d_generic: "$CHN.foreignpolicy.301.d_base$\n\n现代中国对西藏的统治和管理名义上由蒙藏委员会负责，此举的目的是不要重蹈清朝覆辙：先是维持对西藏的半自治统治，又在1910年仓促入藏干预。蒙藏委员会藏事处处长孔庆宗虽然对藏学颇感兴趣，但仍是一位老派的大汉族主义者。他与原驻藏帮办大臣、北洋改良派人士温宗尧同时分别起草了各自的治藏方案。\n\n$CHN.foreignpolicy.301.d_end$"
 CHN.foreignpolicy.301.a: "[CHN_tibet_get_unique_governor]"
 CHN.foreignpolicy.301.b: "西藏亟需真正实现现代化。"
 CHN.foreignpolicy.301.c: "用不了一个师就能掌控西藏……"
 CHN.foreignpolicy.301.e: "僧伽比我们更早统治西藏，和他们合作吧。"
 CHN_tibet_get_unique_governor_szc_liu: "一切都将由刘文辉掌控。"
 CHN_tibet_get_unique_governor_rkmt: "黄慕松掌控了局势。"
 CHN_tibet_get_unique_governor_manchu: "洛桑坚赞会同时为僧伽和天子服务。"
 CHN.foreignpolicy.302.t: "着眼边疆"
 CHN.foreignpolicy.302.d_base: "新疆在中国治下的历史可谓漫长而多舛。自古以来，该地政权在中原王朝与草原游牧势力之间数度易手，直至乾隆皇帝时期才被正式纳入中国版图。此地原分为南北两路，清廷设立新疆省后，才逐渐塑造出统一的区域认同。清朝覆亡后，杨增新依靠其回族军队，将新疆几乎变为个人的封地，稳坐省督之位多年。但其继任者金树仁废除了哈密汗国，引发局势动荡，激起不满势力接连发动叛乱，使全省陷入战火。\n\n自复兴的中央政府重新将这个桀骜难驯的省份纳入直辖版图以来，新疆省境内的大规模动乱已基本平息，但矛盾依然潜伏。温和的维吾尔改革派选择向当局伸出橄榄枝，主动为政府效力。而月即别民族主义者则誓言继续为于阗共和国而战。相较之下，当地汉人和回民群体对重新归入国家怀抱的态度最为积极，毕竟他们与主体人口维吾尔族的关系一向并不融洽。"
 CHN.foreignpolicy.302.d_end: "但不论由谁来治理新疆，他都将忙得不可开交。原于阗共和国的麦斯武德·沙比尔和艾沙·阿勒甫金都表示，若是能由包尔汉·沙希迪或尧乐博斯·汗之辈来治理新疆，那他们就愿意出马为省府效力，但那些更激进的于阗运动分子恐怕仍将继续反抗。新疆的战火已经平息，但该省的动荡局势仍将持续一段时间。"
 CHN.foreignpolicy.302.d_northzhili: "$CHN.foreignpolicy.302.d_base$\n\n当地合作者出人意料地纷纷自荐，让直系政权有了不少新疆督理人选。不过北京政府还是渴望加强对各省的控制，以避免重蹈军阀时代的覆辙。北京政府或许可以提拔尧乐博斯·汗来治理新疆，此人立场亲汉，还可以安抚维吾尔民族主义者；又或者，任命樊耀南这样的文职官员更能维护北京的利益。\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_southzhili: "$CHN.foreignpolicy.302.d_base$\n\n当地合作者纷纷自荐，让直系政权有了不少新疆督理人选。盛世才虽然据称同情社会主义，但他曾经与孙传芳联帅关系良好，因此成为了一位主要候选人，他或许能凭借自己治理地方的经验成为一名得力的忠臣。但他也颇有一些野心，恐怕不如樊耀南等官僚那么容易被左右。另一个选择是从联军中派遣一位忠心耿耿的督理，同时让一位当地人来担任省长。\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_fengtian: "$CHN.foreignpolicy.302.d_base$\n\n当地合作者出人意料地纷纷自荐，让安国军政府有了不少新疆督理人选。出身哈密汗国的尧乐博斯·汗是一位著名的保守派，他会对激进主义重拳出击，同时此人立场亲汉，可能会鼓励维吾尔族人效忠北京。另一位主要候选人是马绍武将军，这位回族将军来自云南，他也许可以鼓励回族士兵加入安国军的部队，使当地能更好地抵抗俄罗斯可能发动的入侵。\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_yun: "$CHN.foreignpolicy.302.d_base$\n\n当地合作者出人意料地纷纷自荐，让滇系政权有了不少新疆督理人选。拜杨增新和马绍武所赐，新疆一直是滇系军阀的势力范围。也许马绍武可以维持滇系对新疆的统治，维护当地的秩序，而那些云南回族士兵将支持他的统治？\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_xsm: "$CHN.foreignpolicy.302.d_base$\n\n当地合作者出人意料地纷纷自荐，让马家有了不少新疆督理人选。马虎山曾帮助他的小舅子马仲英去对抗尧乐博斯·汗，争夺新疆。也许是时候把这片那个害群之马从未拥有过的土地分封给马虎山了。而作为我们的教友与同族，新疆的回族兄弟应该会欢迎我们的统治。\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_rkmt: "$CHN.foreignpolicy.302.d_base$\n\n当地合作者纷纷自荐，让国民党政权有了不少新疆省主席人选。新疆虽然遍地都是反动派和分裂势力，但包尔汉·沙希迪已证明自己是愿意为改善新疆而奋斗的进步势力。与那些为了自己的一亩三分地而战的阴谋家不同。包尔汉的理想与国民革命之理念相契合，他可以成为一股能帮助我们争取当地支持的强大力量。\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_manchu: "$CHN.foreignpolicy.302.d_base$\n\n当地合作者出人意料地纷纷自荐，让朝廷有了不少新疆督理人选。新疆混战期间，尧乐博斯·汗对哈密汗王忠心耿耿，令天子对他青眼相看。马绍武将军同样是一位颇具吸引力的人选，他曾是著名保皇派杨增新麾下一名忠臣良将。同时马绍武立场坚定反俄，他能帮助我们更好地对抗莫斯科的邪恶阴谋。\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_generic: "$CHN.foreignpolicy.302.d_base$\n\n当地合作者出人意料地纷纷自荐，让全新的中国政权有了不少新疆督理人选。我们有充足的理由来任命一位当地合作者，以增加我们在当地的支持率。但政府内部也有一些人向[ROOT.GetLeader]施压，要求是从中央军中派遣一位忠心耿耿的督理，以避免金树仁这样的野心家在俄罗斯的帮助下把新疆变成自己的地盘。\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.a: "[CHN_xinjiang_get_unique_governor]"
 CHN.foreignpolicy.302.b: "我们必须鼓励新疆的进步势力！"
 CHN.foreignpolicy.302.c: "派一位我们的将军过去维持秩序。"
 CHN.foreignpolicy.302.e: "保守派将继续主导新疆！"
 CHN_xinjiang_get_unique_governor_northzhili: "让樊耀南来主管省政吧。"
 CHN_xinjiang_get_unique_governor_southzhili: "盛世才会效忠我们的。"
 CHN_xinjiang_get_unique_governor_fengtian: "尧乐博斯·汗会维持新疆的传统。"
 CHN_xinjiang_get_unique_governor_yun: "任命我们的老朋友马绍武。"
 CHN_xinjiang_get_unique_governor_xsm: "马虎山将完成马仲英的未竟之业。"
 CHN_xinjiang_get_unique_governor_rkmt: "包尔汉·沙希迪精诚为公，把新疆交给他。"
 CHN_xinjiang_get_unique_governor_manchu: "尧乐博斯·汗乃大清忠臣。"
 CHN.foreignpolicy.303.t: "台湾事务"
 CHN.foreignpolicy.303.d_base: "台湾被割让给日本后，各种独立和自治运动如雨后春笋般不断涌现。这种热情首先表现在以蒋渭水、林献堂为首的台湾文化协会上。而蒋渭水和林献堂最终分道扬镳，蒋渭水组建了亲近国民党的台湾民众党，林献堂等推崇梁启超的保守派则成立了台湾地方自治联盟。台湾光复后，民众党陷入了困境。蔡培火等温和派反对蒋渭水的激进主义与威权主义态度，威胁要分裂民众党。\n\n大陆当局控制台湾后，立即镇压了台湾工团党。与此同时，曾经的精英士绅阶层试图争取中国新政权的支持，但在占领当局看来，自治联盟不够爱国，导致这些人在占领当局眼里声誉不佳。而介于民众党与自治联盟之间立场的则是新兴的台湾光复同志会。光复同志会由廖文奎廖文毅兄弟二人领导，其成员主要为受过西方教育的技术官僚和知识分子。光复同志会大体上是一个自由主义运动，并试图寻求大陆的自由主义者支持。"
 CHN.foreignpolicy.303.d_end: "尽管和其他边疆地区不同，台湾人口几乎完全由汉族人组成，但要想重新整合这个任性的省份，政府仍需慎重采取措施。台湾已经与大陆阔别半个世纪，而任何试图管理该省的中国政府都必须正视这些差异，否则未来数年间，台湾必将反贼林立。"
 CHN.foreignpolicy.303.d_northzhili: "$CHN.foreignpolicy.303.d_base$\n\n直系政府主张反日，却依然青睐自治联盟。北京政府受到了梁启超的极大影响，并在这一点上和林献堂达成了共鸣。虽然直系中的自由派人士表示支持光复同志会，但政府中的保守派高层还是选择支持自治联盟。然而，政府中倾向集权主义和军国主义的人士还在呼吁政府不能信任地方派政党，而应在台湾实行临时戒严。\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_southzhili: "$CHN.foreignpolicy.303.d_base$\n\n尽管回归后的台湾与大陆政府在立场上有些偏差，但也许[ROOT.GetLeader]政府是最时候与这个岛打交道的。孙传芳最初的权力基础就在与台湾隔海相望的福建，八省联合成立后，福建在联合中的重要性依然不可替代。而福建人与岛上人民语言相同，或许福州出身的后起之秀萨师俊可以治理台湾，保境安民。\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_fengtian: "$CHN.foreignpolicy.303.d_base$\n\n东北和台湾一样深受日本影响。虽然许多正义凛然的爱国人士对台湾的精英阶层与日本合作一事口诛笔伐，但安国军政府却能理解台湾的处境。因此[ROOT.GetLeader]政权将自治联盟视为自己的潜在伙伴，以此来获取当地支持，鼓励宝岛的稳定与传统主义。\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_rkmt: "$CHN.foreignpolicy.303.d_base$\n\n国民党在台湾岛上有许多盟友可以选择。蒋渭水虽然持有激进主义立场，但他也是一位久经考验的爱国志士，其对国父的崇敬之心不输大陆上任何一位党员。林献堂在台籍士绅精英中人脉广泛，因此也是一位合适的人选，然而任命这样一位曾经的日本合作者恐怕有所不妥。此外一些党内人士认为，台湾尚不适合实行地方自治，因此需要一位忠诚的国民革命军将领去治理台湾，如此才能在岛上维持秩序，为传播总理遗教做好准备。\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_manchu: "$CHN.foreignpolicy.303.d_base$\n\n割让台湾恐怕正是压倒旧日清王朝的最后一根稻草。但如今保皇派不仅复辟了清廷权威，还收复了宝岛台湾。虽然台湾的地方组织大体上都主张共和，但那些上层精英总是务实的。既然他们能接受与东京共事，那么他们也许也会愿意效忠天子。\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_generic: "$CHN.foreignpolicy.303.d_base$\n\n台湾曾经和福建一样都只是一个普通的省，因此政府内许多人建议直接恢复旧制，让文化相似的福建人去治理台湾即可。但一些军方人士认为应该由军队管理这座战略意义重大的岛屿，或是与民众党、自治联盟等本地团体合作。\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.a: "[CHN_taiwan_get_unique_governor]"
 CHN.foreignpolicy.303.b: "和当地进步派团体们合作。"
 CHN.foreignpolicy.303.c: "岛上仍有日本人残党。"
 CHN.foreignpolicy.303.e: "自治联盟虽然声誉不佳，但还是得选择他们。"
 CHN_taiwan_get_unique_governor_northzhili: "林献堂可以成为我们的伙伴。"
 CHN_taiwan_get_unique_governor_southzhili: "萨师俊必能妥善治台。"
 CHN_taiwan_get_unique_governor_fengtian: "自治联盟和我们一样懂得如何中日亲善。"
 CHN_taiwan_get_unique_governor_rkmt: "蒋渭水虽然行事激进，但还是我们的自己人。"
 CHN_taiwan_get_unique_governor_manchu: "林献堂和自治联盟乃大清忠臣。"

 CHN.foreignpolicy.0050.t: "广州峰会"
 CHN.foreignpolicy.0050.nomafcollapse.d: "自其全球资本主义经济受黑色星期一冲击后，属于凯撒之国的旧世界秩序就一直备受动摇。[GER.GetNameDef]经济崩溃的涟漪波及了整个殖民世界，1936年的中南半岛起义和八省联合解体就是例子。中国内战的胜利让[GXC.GetNameDef]得以成为第一个完全驱逐帝国主义势力的亚洲国家。\n\n故此，[GXC.GetLeader]和中国外交部决定在广州与发展中国家的领袖及大使们召开一场峰会，以聚首一堂讨论正在兴起的新政治秩序。虽然非洲国家尚未脱离德国独立，但中国人民无比乐意迎接非洲革命者，让他们成为反帝国主义国际斗争中的同志。\n\n与会代表都同意签署确认以农民为基础的后殖民国际世界革命治理的关键原则。包括与所有与会成员国建立友好关系、深入考察社会文化问题以及共同促进发展中国家在国际台上的地位。亚洲迎来了新时代，而由[GXC.GetLeader]引领的中国也乐于扛起为发展中国家构建共同未来的大旗。"
 CHN.foreignpolicy.0050.mafcollapse.d: "自其全球资本主义经济受黑色星期一冲击后，属于凯撒之国的旧世界秩序就一直备受动摇。[GER.GetNameDef]经济崩溃的涟漪波及了整个殖民世界，1936年的中南半岛起义和八省联合解体就是例子。中国内战的胜利让[GXC.GetNameDef]得以成为第一个完全驱逐帝国主义势力的亚洲国家。\n\n故此，[GXC.GetLeader]和中国外交部决定在广州与发展中国家的领袖及大使们召开一场峰会，以聚首一堂讨论正在兴起的新政治秩序。德属中非的急剧崩塌与解体掀起了一波非洲民族主义热潮，而中国人民无比乐意迎接非洲各国，让他们成为反帝国主义国际斗争中的同志。\n\n与会代表都同意签署确认以农民为基础的后殖民国际世界革命治理的关键原则。包括与所有与会成员国建立友好关系、深入考察社会文化问题以及共同促进发展中国家在国际台上的地位。亚洲迎来了新时代，而由[GXC.GetLeader]引领的中国也乐于扛起为发展中国家构建共同未来的大旗。"
 CHN.foreignpolicy.0050.a: "为新时代喝采！"
 CHN.foreignpolicy.0050.b: "一个值得赞许的倡议！"
 CHN.foreignpolicy.0050.c: "我们有自己的打算。"
 CHN.foreignpolicy.600.t: "中国-[ROOT.GetAdjective]谈判"
 CHN.foreignpolicy.600.d: "自1911年以来，中国饱受政治分裂、革命和军阀割据之苦。我们踏足这片大陆，不过是成为又一个试图征服这个古老社会的外来者罢了。然而，除非我们想要直接资助中国重建，并应对挥之不去的叛乱、匪患和军阀割据，否则与当地的盟友和合作者建立伙伴关系才是明智之举。我们派驻当地的特工已开始与当地各派势力和政治流亡者展开谈判，希望促成此类对话。最终，[ROOT.Capital.GetCapitalVictoryPointName]将决定下一步的行动方向。经过一番权衡，我们的最终谈判对象是……"
 CHN.foreignpolicy.600.monarchy: "……中国保皇派。"
 CHN.foreignpolicy.600.pro_japanese: "……我们的亲日盟友群体。"
 CHN.foreignpolicy.600.federalists: "……中国联省派。"
 CHN.foreignpolicy.600.revolutionaries: "……中国革命派。"
 CHN.foreignpolicy.600.republicans: "……其他中国共和派。"
 CHN.foreignpolicy.600.cancel: "我们将暂缓做出决定。"
 CHN.foreignpolicy.620.t: "与中国保皇派谈判"
 CHN.foreignpolicy.620.d: "1911年，中国革命者推翻了年仅两岁的宣统皇帝溥仪。辛亥革命融合了共和主义、激进主义和民族主义思潮，标志着清朝数十年间政治、经济、军事全面衰落的终结。几年后，袁世凯（在西方顾问的怂恿下）试图复辟帝制，使中国陷入了长达数十年的军阀混战时期。\n\n尽管民国时期的混乱局面导致民众对君主制的看法有所缓和，但君主制的政治支持仍然十分有限。许多人对武力复辟帝制持谨慎态度，而未来皇帝（即现已长大成人的溥仪）的“古怪行径”也令许多人犹豫不决，然而其他人选目前合法性不足，无法构成有意义的替代方案。不过仍有许多人认为，复辟帝制或许是恢复中国平衡与稳定的唯一途径。"
 CHN.foreignpolicy.620.QIE: "我们将复辟清帝。"
 CHN.foreignpolicy.620.cancel: "如今还是放弃为好。"
 CHN.foreignpolicy.640.t: "重建民国"
 CHN.foreignpolicy.640.d: "日本长期以来一直试图在中国扩大影响力，通过结交各路盟友和合作者，企图将其势力范围扩展到这个人口众多的邻国。中国各派势力都曾与日本合作，或是出于真正的泛亚理想，或是相信两国可以携手对抗欧洲帝国主义，又或是出于避免战争或被日本全面统治的务实考量，也可能仅仅是因为他们需要或想要日本的帮助。\n\n大多数亲日势力最终都与奉系结盟或是加入了更广泛的安国军，而张作霖派、士官派、光复系（旧皖系的继承者）和新交通系都在不同程度上表达了亲日态度，协和会和新民会则是由东京直接资助的组织。\n\n日本的其他一些较小盟友包括陈廉伯及其广州商人政府，他们一直试图加深与日本的关系，以对抗直系和旧桂系的影响力。与此同时，我们的特工也曾努力拉拢山西督理阎锡山。\n\n旧民国覆灭后，我们必须建立新民国——这需要将日本陆军、海军和文官政府内部派系林立、相互竞争的方案整合起来。最后，我们必须决定由谁来领导这个“改组政府”。"
 CHN.foreignpolicy.640.FNG: "依靠我们在沈阳建立的人脉网络。"
 CHN.foreignpolicy.640.GXC: "让我们目光向南望向广州商人。"
 CHN.foreignpolicy.640.SHX: "让我们目光向北望向狡猾的阎锡山。"
 CHN.foreignpolicy.640.cancel: "如今还是放弃为好。"
 CHN.foreignpolicy.660.t: "中国的联省主义？"
 CHN.foreignpolicy.660.d: "中国的联省主义历史颇为复杂，联省主义在二十年代初曾短暂兴盛，随后便迅速衰落。尽管如此，联省主义仍然受到那些惧怕中央政府专制和腐败之人的拥护。近年来，联省运动也吸收了民主主义、宪政主义和地方主义等元素。\n\n在中国建立联省政府很可能被视为分而治之的手段，并招致各方质疑，但那些能从联省体制中获益的地方政治人物或许会迅速接受。在政治上，中国联省运动本身就具有多元性和分散性，两广、云南、湖南、四川和浙江或许是中国联省运动最突出的活动中心。"
 CHN.foreignpolicy.660.GXC: "广州联省派看起来前途无量。"
 CHN.foreignpolicy.660.YUN: "西南一直是联省派的堡垒。"
 CHN.foreignpolicy.660.cancel: "这有点太勉强了……"
 CHN.foreignpolicy.680.t: "新民国？"
 CHN.foreignpolicy.680.d: "1911年辛亥革命后，中华民国宣告成立。民国在军阀混战时期经历了巨大的动荡，北京先后被强人把持。所谓的“民国北洋政府”虽然因其腐败专制而臭名昭著，但辛亥革命的理想却得以延续。即使是那些较为悲观的政府领导人，也仍然试图按照自己的意愿塑造国家，将西方自由主义、中国儒家思想和其他融合的意识形态相结合，力图为人民提供善治。因此，我们把权力移交给旧北洋政府的继承者也就不足为奇了。"
 CHN.foreignpolicy.680.QIE: "我们将重建民国北洋政府。"
 CHN.foreignpolicy.680.LEP: "我们将在南京建立民国临时政府。"
 CHN.foreignpolicy.680.SHX: "我们将寄希望于狡猾的阎督理。"
 CHN.foreignpolicy.680.cancel: "如今还是放弃为好。"
 CHN.foreignpolicy.700.t: "新的中国革命？"
 CHN.foreignpolicy.700.d: "1911年的辛亥革命是中国历史上的一场灾难，为激进的政治、社会和经济思想在中国话语体系中蓬勃发展打开了大门。然而，将这些思想转化为行动却困难重重，并进一步加剧了新一代社会主义者、民族主义者和革命共和派之间的分裂。\n\n孙中山先生及其国民党在军阀混战时期成为最重要的革命政党，但他们并非孤军奋战。国民军、中国工团党、世界社以及各种分裂组织和独立团体在随后的岁月中相继涌现，且都试图按照自己的意愿重塑中国。在中国强推革命虽然注定困难重重，但或许会永远改变这个古老文明的历史进程。"
 CHN.foreignpolicy.700.CHI: "社会主义建制派是自然之选。"
 CHN.foreignpolicy.700.GXC: "广州毕竟是革命的发源地！"
 CHN.foreignpolicy.700.SHX: "国民军提供了新的视角。"
 CHN.foreignpolicy.700.YUN: "贵州曾是国民革命军的最后据点！"
 CHN.foreignpolicy.700.cancel: "这有点太过头了……"
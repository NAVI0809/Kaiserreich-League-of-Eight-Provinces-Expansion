 CHN_radicals_party: "激进派"
 CHN_radicals_party_long: "独立激进派与革命派\n§L中国的革命激进主义思潮有着引人入胜的历史，它源于英烈们为反抗不公而进行的不懈斗争。为了唤起群众的愤怒，形形色色的革命者们前赴后继，或采取和平手段，或点燃战火硝烟。革命思潮主要聚集在国民党和中国青年党等政党中，与改良派思潮大相径庭。\n\n然而，激进主义的魅力遍及华夏大地，从西北边疆的草原到上海熙熙攘攘的街头，许多人执着于彻底改造中国的理想，无论是社会主义的平等理想，还是带有浓厚的民族主义色彩。这些极端团体在国民党、中国青年党或中国工团党的激进派领导下活动，拒绝参与中国议会制度，并认为新成立的中央政府是对社会主义革命的背叛。§!\n"
 CHN_KMT_party: "国民党"
 CHN_KMT_party_long: "中国国民党\n§L中国国民党在其坎坷历史中历经过多次形态演变。国民党由孙中山、黄兴与宋教仁于1912年创建，最初是同盟会的议会组织。在北洋政府初期，国民党致力于忠实履行议会党派的职责。然而，在宋教仁遇刺身故、孙中山多次流亡后，国民党改组为中华革命党，之后又于1919年10月10日更名为国民党。国民党秉持孙中山倡导的三民主义，致力于建立党国体制，并实施国民革命的三阶段战略。国民党希望通过“民族主义”、“民权主义”和“民生主义”三大原则，建立一个新的革命共和国。\n\n1927年，国民党及其国民革命军试图通过北伐统一国家，但以失败告终。国民革命军残部被迫逃往贵州和闽赣根据地的崇山峻岭之中，中央委员会则流亡莫斯科和巴黎。此后，国民党内斗不断，左右两派势同水火。在胡汉民和贵州国民革命军残部的推动下，国民党右派致力于贯彻孙中山的意识形态，并排除工团主义和第三国际的广泛影响。而国民党左派则宣扬对三民主义的强硬社会主义解读，并坚持与中国工团党保持统一战线。\n\n然而，国民党内部现已分裂成多个派系，曾经风头无两的国民党能否重新成为人民的政党，还有待观察。§!\n"
 CHN_CSP_party: "工团党"
 CHN_CSP_party_long: "中国工团党\n§L活动范围基本上只限于市中心或是港口城市的中国工团党多年来都只是中国国民党旗下的零散小党。在这个没有欧洲或美洲那样庞大的工人支持基础的国家里，中国工团党只能扮演一群胆小怕事、崇洋媚外的激进分子，不过他们依然取得过一些重大成功。工团党在许多历史事件中都采取了关键行动，例如他们在1925年发动省港大罢工，并促成了中国工团主义者同盟的成立，之后他们又在1932年参与了上海起义，引发了波及全国、轰轰烈烈的群众运动。\n\n中国工团党内在非常多元，有着许多不同的派系，其中包括陈独秀和李立三领导的正统派，陈绍禹领导的激进派，以及李大钊领导的北方派、谭平山和邓仲夏领导的南方派，此外蔡和森在湖南、吴玉章在四川也都领导着各自地方的派系。但不论他们再怎么装腔作势，中国工团党怎么也称不上是中国国内强大的政治力量——该党的影响力只限于激进学生和工人之间。§!\n"
 CHN_FCDP_party: "民主政团同盟"
 CHN_FCDP_party_long: "中国民主政团同盟\n§L1928年之后，直系的短暂自由化时期催生了统一建国同志会，尽管该组织最终遭禁，但其为中国民主政团同盟的成立奠定了基础。民主政团同盟旨在将全国所有追求宪政和大众民主的政党团结在同一旗帜下，其成员包括中国宪政党、全国各界救国联合会、政学系、中华职业教育社/中国民主建国会、民社党、新月社以及其他众多政党。\n\n随着国家统一和政治阵营巩固，曾经势力庞大的民主政团同盟的大部分支持被地区性政党或其他更为成熟的政党所蚕食。然而，在当下真空时期，民主政团同盟吸纳了一些小党派，以巩固自身地位。民主政团同盟主要由北方民主派政党和派系领导，其将自己主要定位为在南方占据主导地位的共和大同盟的一个替代方案，并在保守改良派领导层与更具活力的草根活动家之间达成了平衡。§!\n"
 CHN_GRA_party: "共盟"
 CHN_GRA_party_long: "共和大同盟\n§L共和大同盟是一个准合法的政治联盟，其主要由华南地区的政党组成，旨在对抗北洋政府的建制派政治秩序。1931年，直奉和谈失败，反租界势力和民族主义情绪高涨，共和大同盟随之成立。大同盟曾短暂地与退休的段祺瑞结盟，之后又有许多“老派”联省主义团体加入其中，如唐继尧在云南领导的民治党和褚辅成领导的浙江自治运动等，从而在国会中组建了一个不服从联盟。赵恒惕领导的民新社和熊克武领导的联省自治筹备处也对共和大同盟抱有极大同情，但依然维持着独立运作。\n\n随着国家再度统一，各大政治集团站稳了脚跟，共和大同盟从一个由多个政党组成的南方政治联盟成为了一个独立的政治实体。许多“旧”式民主党派都加入其中，使之成为了捍卫中国民主建国事业的旗舰。共和大同盟在南方有着巨大的影响力，同时也得到了国内许多中间派势力的支持。§!\n"
 CHN_republicans_party: "共和派"
 CHN_republicans_party_long: "独立共和派与知识分子\n§L中国政坛的知识分子传统源远流长、底蕴深厚，且极具话语影响力。许多参与其中的政客认为政党腐败且束缚思想，因此发自内心地坚决反对加入任何政党。他们恪守自身原则与务实精神而非意识形态，正是这批人奠定了北洋政府“绅士政权”的美称。共和派传统孕育了诸多超越纷扰党争的“无党派”派系、协会和社团，例如梁启超的研究系、新旧交通系、安福俱乐部、政学系、努力会、民主与科学座谈会等等。\n\n尽管共和派普遍向往由文官统治的宪政未来，但由于他们拒绝建立更高层级的组织架构，导致其选择空间极为有限。事实上，在具体议题投票时，共和派极少形成统一阵营，议员们要么被左右，要么被贿赂，要么被威胁，最终各自选边站队。尽管如此，共和派仍是体制内的重要力量，为民主未来保留着希望之火。受制于现实，许多共和派虽然避免正式加入其他主要民主党派，但仍考虑在投票时与其共同进退。§!\n"
 CHN_CCP_party: "宪政党"
 CHN_CCP_party_long: "$CHN_CCP_party_long_tt$\n§L中国宪政党由康有为“十大弟子”之一徐勤领导，是中国政坛上历史最为悠久的政党组织之一。该党起源于清末立法机构中康梁等人的立宪主义思想，如今他们声称自己既继承了清朝的早期立宪派的思想，也继承了他们的众多后继者，如进步党、研究系以及其他所有梁启超系的政治力量。他们团结一致，致力于在中国推动宪政，并建立有效的民主制度（虽然未必自由），在中国政坛中展现了顽强的韧性。\n\n中国宪政党由一群反对革命但支持改良的政客组成，但在北洋政府中不断被边缘化。他们曾短暂地支持袁世凯，但在1915年与袁世凯决裂，之后他们重返安福国会，与安福俱乐部亦敌亦友。在梁启超的倡导下，除了少年中国学会等少数例外之外，大部分梁启超系同志都加入了中国宪政党。梁启超去世后，人称“康氏之子路”的徐勤接过了中国宪政党的衣钵。\n\n中国宪政党不断前进，渴望建立一个道德的、儒家的、反军阀的、将宪法奉为圭臬的民主中国。尽管由于不敢反对北洋政府，宪政党面临着分裂危机，但他们仍然是中国政坛中一支团结一致、同时反对军阀和国民党的力量。§!\n"
 CHN_CCP_party_long_tt: "中国宪政党"
 CHN_DCP_party: "民主宪政党"
 CHN_DCP_party_long: "民主宪政党\n§L民主宪政党是众多晚清改良派（例如梁启超和康有为）政党中的一员，可以被视作中国宪政党的继承者，其纲领与进步党、研究系等党派相同。在追求宪政与有效民主的共同目标下，随着中国宪政党“元老派”政客在新政治秩序中退休，民主宪政党接过了中国宪政党的衣钵。徐勤卸任中国宪政党领袖后，他的得意门生、“少壮派”领袖伍宪子成为了新任党魁。\n\n新生的民主宪政党与李庆芳一道继续倡导改良主义宪政民主，以和平方式改革共和国，反对革命斗争或激进的群众行动。作为民社党之外的“右翼”政治选择，民主宪政党致力于挣脱中国宪政派历史遗产的桎梏，真正实现去军阀化的民主政治。§!\n"
 CHN_regionalists_party: "地方派"
 CHN_regionalists_party_long: "独立地方派和强人\n§L战场上的失败并未彻底根除军阀割据的残余。在国内各地，被摧毁的主要军阀派系的残余势力依然存在，无论是趁机投靠新主子的小军阀，还是被新政府雇佣的军阀下属，或是利用与胜者关系从随之而来的权力真空中崛起的新强人。许多前军阀只是表面上假装效忠国家大业，实则继续欺压剥削人民，但这并不意味着他们不受欢迎——即使是军阀时代最贪婪的人，也曾谨慎地在军方、民间和社交圈之间建立了树大根深的人脉网络。那些从秩序变革中幸存下来的军阀大多魅力非凡、人脉广泛且大多腐败，他们善于利用地方主义情绪以及对现状的不满，决心坚持到变革浪潮消退之后。只有时间才能告诉我们，到底要经过多少代人才能真正消除军阀时代的痛苦遗产。§!\n"
 CHN_YCP_party: "青年党"
 CHN_YCP_party_long: "中国青年党\n§L中国青年党是学生组织“少年中国学会”的后继者之一。少年中国学会分裂成了曾琦与李璜领导的民族主义派、李大钊领导的社会主义派与王光祈领导的理想主义派，随后，曾琦、李璜等民族主义派成员前往法国留学，并与周恩来、蔡元培、李石曾等留学生发生了激烈冲突。\n\n由于中国工团党的支持者增加，变得越来越暴力，且得到了法国政府的支持，曾琦和李璜决定成立自己的党派，于1923年在巴黎市郊成立了中国青年党，随后在留学生中快速扩张。1924年，青年党坚决反对国民党和工团党，他们回到上海，创办了一系列政治社团与报刊，开始与直系军阀吴佩孚和孙传芳合作。\n\n由于支持直系军阀，国民党北伐失败后，青年党成为了唯一一个发展顺利的大众政党，并借此机会在军官和教育机构中大大扩张了影响力。在曾琦的领导下，青年党希望通过选票带来革命，主张法团主义的政治组织形态，以及联邦主义、民族主义等，而最重要的主张便是对儒家思想的捍卫。§!\n"
 china_events.364.t: "四川民主派统一中国"
 china_events.364.d: "尽管许多人认为联省运动到1936年底已几乎瓦解，但如今看来这种判断实属为时过早。来自西南四川省的张澜总执政及其盟友不仅成功收复了云南与广东，还在中原和东北地区建立了霸权。\n\n张澜在天安门广场向众多民众发表演讲，宣称新成立的联省政府将终结百年国耻，并在神州大地建立民主统治。尽管中国仍然深陷抗日战争与数十年内战的摧残，不过国家的前景似乎终于开始好转。"
 china_events.364.a: "联省派大功告成。"
 china_events.2145.t: "国家统一与新问题"
 china_events.2145.d: "随着国家重归统一，历史再次将中国凝聚在一面相对统一的政治旗帜之下。伴随着[ROOT.GetLeader]新地位的确立，许多问题也随之涌现。坦言说，国家不管是在经济、政治还是军事上都已经满目疮痍。各个势力开始摩拳擦掌，有人寻求在新政府谋得一官半职、囤积财富积聚权力，也有人仅希望在这个山河破碎的国家中勉强维生。\n\n当群众与部下将目光投向[ROOT.GetLeader]寻求指引与方向之时，曾经与中央政府合作的盟友们却磨刀霍霍、调兵遣将，身入这场权力赌局。"
 china_events.2145.a: "让我们开始整顿河山吧。"
 CHN.foreignpolicy.300.d_xsm: "$CHN.foreignpolicy.300.d_base$\n\n马家不久之前还在为争夺内蒙古与蒙古兵戎相见，他们在蒙古找不到盟友自然是不足为奇。不过幸运的是，马鸿逵在蒙古还有些人脉，这让他们有了使用暴力以外的治理选项。虽然马鸿逵治下各旗对他评价都不高，但马鸿逵是马家少数有着大范围统治蒙古经验的人，此外他还可以依靠“三没底”王英和“大王爷”康达多尔济等人脉。\n\n$CHN.foreignpolicy.300.d_end$"
 CHN_No_Other_NPA_tt: "§Y没有其他势力宣称§L护国联盟§!的领导权。§!"
 CHN.foreignpolicy.200.d.wuxing_protocol: "历经多年内战，中国终于在[FROM.GetLeader]的领导下实现了统一，不久后便重返世界舞台。为展现中国重塑大国地位、重建势力范围的决心，中国外交部宣布正式组建五星协定。\n\n该联盟得名于古籍《汉书》中的“五星出东方，中国大利”，这一名称反映出中国新领导者对恢复以中国为中心的传统亚洲政治秩序的渴望。同时该联盟的成立还表明，随着中国走向独立，他们与传统盟友日本正渐行渐远。"
 CHN.foreignpolicy.200.d.SHX_yan_faction: "历经多年内战，中国终于在[FROM.GetLeader]的领导下实现了统一，不久后便重返世界舞台。为展现中国重塑大国地位、重建势力范围的决心，中国外交部宣布正式组建亚太不结盟运动。\n\n此举体现出中国大总统阎锡山建立以中国为中心的亚洲新政治秩序的雄心壮志，以及他试图创造新世界的乌托邦式美好愿望。但此举更大的现实意义还是在于巩固中国作为一个新崛起大国的地位，并为后进的亚洲后殖民国家提供了一种可能远离欧陆战火的替代方案。"
 CHN.foreignpolicy.200.d.SHX_feng_faction: "历经多年内战，中国终于在[FROM.GetLeader]的领导下实现了统一，不久后便重返世界舞台。为展现中国重塑大国地位、重建势力范围的决心，中国外交部宣布正式组建国民解放阵线。\n\n由中国大总统冯玉祥领导的国民解放阵线代表着他所宣称的愿望，即帮助其他亚洲人民摆脱西方和日本的帝国主义统治。然而冯玉祥也以务实著称，因此这个联盟在实践中将成为防御性还是进攻性组织，仍有待观察。"
 CHN_build_guangxi_arsenal: "建设广西兵工厂"
 CHN_build_guangxi_arsenal_desc: "作为中国最贫困的省份之一，广西很难说是工业化的理想之地。广西兵工厂是李宗仁和黄绍竑的共同心血，旨在重组广西现有的武器制造厂——在新桂系上台掌权之前，这些工厂只生产质量低劣的“土炮”或其他近乎淘汰的步枪。受滇系制式步枪的启发，新成立的广西兵工厂力求生产步枪、火药、炸弹、手榴弹、机枪，甚至包括德制毛瑟步枪、炸弹和迫击炮弹。"
 CHN_refurbish_the_shijing_arsenal: "修缮石井兵工厂"
 CHN_refurbish_the_shijing_arsenal_desc: "光绪十一年，原广州机器局并入增埗军火局，改称制造东局。石井兵工厂是洋务运动的产物，设备购自德国，生产由德国工程师管理。而随着德国赢得世界大战后对中国的影响力日益扩大，这一传统至今也仍未改变。尽管如此，这家兵工厂已经开始老化，我们应该尽职尽责地对其进行维护和翻新，使其能适应更现代化的枪支生产——除了生产步枪外，还能生产轻机枪。"
 CHN_build_guangxi_aircraft_assembly_plant: "建设广西飞机装配厂"
 CHN_build_guangxi_aircraft_assembly_plant_desc: "随着工业化在贫穷且以农村为主的广西省稳步推进，白崇禧、黄旭初等新桂系要员正致力于将广西打造为中国军事实力现代化宏伟方案的起点。在监督兴建新的“广西飞机装配厂”的过程中，人们希望军事能力的提升最终能让中国拥有一支现代化的空军力量，即便当下仍十分遥远，至少在未来也应该能够实现。"
 CHN_evacuate_military_industry: "向内陆疏散军工"
 CHN_evacuate_military_industry_desc: "我国大多数重工业分布在沿海地区，但在战争时期，沿海地区被占领的可能让这些工厂处在危险之中。在这危难时刻，这些军用工业应迁移至内陆我方控制区内——以为我军作战保存工业能力。"
 CHN_evacuate_civilian_industry: "向内陆疏散民工"
 CHN_evacuate_civilian_industry_desc: "我国大多数重工业分布在沿海地区，但在战争时期，沿海地区被占领的可能让这些工厂处在危险之中。在这危难时刻，这些民用工业应迁移至内陆我方控制区内——以为我军作战保存工业能力。"
 CHN_war_time_relocation_tt: "§L选取该国策将令§Y搬迁军用工厂§!和§Y搬迁民用工厂§!决议的花费降低。§!"
 CHN.foreignpolicy.200.d.league_of_free_asian_states: "历经多年内战，中国终于在[FROM.GetLeader]的领导下实现了统一，不久后便重返世界舞台。为展现中国重塑大国地位、重建势力范围的决心，中国外交部宣布正式组建自由亚洲国家联盟。\n\n该联盟建立在直隶霸权十年来不断增强的实力之上，旨在为摆脱殖民统治的亚洲国家提供替代日本与欧洲帝国主义的新选择。这一雄心勃勃的方案也反映了北洋政府意图恢复各国依附中国的传统亚洲政治秩序的凌云壮志。"

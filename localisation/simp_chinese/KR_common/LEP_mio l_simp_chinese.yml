 LEPEXP_coal_jinling_arsenal_descison: "建设南京焦化厂"
 LEPEXP_coal_jinling_arsenal_descison_desc: "随着金陵兵工厂与南京周围各个工厂的产能不断扩大，对焦炭等炼焦化工产品的需求与日俱增，而南京周边并没有焦化设施，从国内其他地区购买焦炭或者从国外进口海运到南京又会大幅度提高成本，因此一座现代化的焦化厂建设迫在眉睫。"
 LEPEXP_GER_theorist_xu_peigeng_decision: "任命徐培根为军官培训团教育长"
 LEPEXP_GER_theorist_xu_peigeng_decision_desc: "徐培根将重点建设精锐部队并且推广和改善德军在一战中使用的胡尔蒂战术，并且加强对部队的体能与作战技能的训练。"
 LEPEXP_GER_theorist_li_rentao_decision: "任命李忍涛为军官培训团教育长"
 LEPEXP_GER_theorist_li_rentao_decision_desc: "李忍涛将会推广化学武器的使用（尤其在对外敌作战时）以及我军的防化部队建设，尤其是可快速无害化的化学武器。"
 LEPEXP_GER_theorist_liu_qingeng_decision: "任命刘庆恩为军需总长"
 LEPEXP_GER_theorist_ger_decision: "完善德国军事顾问团的理论"
 LEPEXP_GER_theorist_ger_decision_desc: "我军将会继续传承并完善德国军事顾问团的理论，塞克特与法肯豪森虽然被一些声音批判为‘躺在世界大战的遗产上’，但是他们的经验完全可以为我们的军队为接下来即将面对的更惨烈的战争做好准备。"
 LEPEXP_GER_theorist_liu_qingeng_decision_desc: "刘庆恩将重点推进军工生产与相关配套科技的发展。"

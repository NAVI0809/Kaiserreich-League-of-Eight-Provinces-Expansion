 LEPEXP_military_defence_development_CAT: "国防方略"
 LEPEXP_military_defence_development_CAT_desc: "江南自古富庶，而中国近代的工业也在江南发源，从江南制造局到金陵兵工厂，再到大大小小的各种民营企业，一同构成了江南的繁荣。\n\n而为了保卫华东五省百姓们安定的生活，我们不仅要在战场上加倍努力，同时也要在工厂，在建筑工地，在实验室为我们的士兵们做最坚固的后盾。"
 league_mid.64.t: "特别国防预算听证会"
 league_mid.64.d: "面对极有可能的日本入侵，总参谋部向国会申请一批特别国防预算，并为此举行了一次听证会。厉尔康中将向议员们做了报告，表示日军最有可能入侵的方向——华北，是一大平原，有利于日军机械化部队及大兵团活动，并距日方东北补给基地较近，形势于我不利。如全面开战，日寇极有可能推翻使馆城市当局占领上海，我方应充分利用在淞沪间已经修好的国防工事，在此投入重兵用以牵制敌人兵力，保卫首都南京。同时还可能使日军触犯列强在华利益引起可能的国际干预。一旦上海开战，应争取迅速歼灭上海日本驻军，封锁海洋。如战事不利，则可退守苏福国防线打持久战，在防御战重消耗日军有生力量，阻止日军侵略。\n\n尽管面临着预算紧张的苦难，但是面对日军登陆后直插首都的威胁，最后国会还是通过了这项预算，同时在场的爱国企业家也表示将会尽力协助国防建设。"

 LEPEXP_huhang_line_defence: "准备沪杭线防御"
 LEPEXP_jinghu_line_defence_desc: "沪宁杭地区位于上海、南京、杭州三地构成的三角地带，包含上海市、江苏省南部和浙江省北部。是长三角城市群的核心，也是我国经济实力最强的核心区域之一。其地形以平原为主，河流港汊密布，丘陵零星分布。太湖横亘其间，又将该地区明显分割为湖南湖北两块。\n\n为应对日本可能发动的侵略战争，政府开始着手在该地区修筑国防工事线，工事主要包含机枪掩体、小炮掩体、观测所和掩蔽部。\n\n沪杭线南起萧山，北至金山卫与太湖畔，南可防日军在杭州湾登陆，北可阻击上海方向来犯之敌。"
 LEPEXP_xicheng_line_defence: "准备锡澄线防御" #无锡一江阴
 LEPEXP_xicheng_line_defence_desc: "沪宁杭地区位于上海、南京、杭州三地构成的三角地带，包含上海市、江苏省南部和浙江省北部。是长三角城市群的核心，也是我国经济实力最强的核心区域之一。其地形以平原为主，河流港汊密布，丘陵零星分布。太湖横亘其间，又将该地区明显分割为湖南湖北两块。\n\n为应对日本可能发动的侵略战争，政府开始着手在该地区修筑国防工事线，工事主要包含机枪掩体、小炮掩体、观测所和掩蔽部。\n\n锡澄线南起锡山与太湖畔宜兴一线，北至江阴要塞，是南京首都圈以外的最后的工事群。"
 LEPEXP_wufu_line_defence: "准备吴福线防御"
 LEPEXP_wufu_line_defence_desc: "沪宁杭地区位于上海、南京、杭州三地构成的三角地带，包含上海市、江苏省南部和浙江省北部。是长三角城市群的核心，也是我国经济实力最强的核心区域之一。其地形以平原为主，河流港汊密布，丘陵零星分布。太湖横亘其间，又将该地区明显分割为湖南湖北两块。\n\n为应对日本可能发动的侵略战争，政府开始着手在该地区修筑国防工事线，工事主要包含机枪掩体、小炮掩体、观测所和掩蔽部。\n\n吴福线南起吴江，北至福山，南面直面上海方向，北部可防日寇沿长江入侵内陆，并可为江阴要塞提供警戒。"
 LEPEXP_coast_guards_decision: "组建江防军"
 LEPEXP_coast_guards_decision_desc: "首都南京距离上海很近，日寇除了陆路以外还可以沿长江一路西进威胁南京，为此我军需要专门组建保卫长江入海口的部队长期驻守在华东国防线以及长江沿岸的江防要塞上，我军计划将宁沪线上各地的保安团与新征召的新兵混编成江防军，虽然他们的作战能力赶不上正规军，但是依托防御工事仍然有能力阻挡日寇，为正规军后续支援争取时间。"

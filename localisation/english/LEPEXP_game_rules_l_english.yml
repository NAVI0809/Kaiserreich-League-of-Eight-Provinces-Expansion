l_english:
 LEP_PATH: "£KR_game_rule_flag_LEP  The Southeast Half"
 RULE_OPTION_LEP_PATH_RANDOM: "Default"
 RULE_OPTION_LEP_PATH_RANDOM_DESC: "The League of Eight Provinces left behind by Sun Chuanfang stands at a crossroads. The parliament in Nanjing and the military governors of the provinces each press their own reading of the future, and soldier, official and merchant alike contest the right to define what this state shall become."
 RULE_OPTION_LEP_PATH_QI: "£KR_game_rule_flag_LEP  The Marshal's Military Government"
 RULE_OPTION_LEP_PATH_QI_DESC: "Qi Xieyuan governs as the Marshal, and parliament and elections are set aside. The army becomes the sole pillar of the state."
 RULE_OPTION_LEP_PATH_DSP: "£KR_game_rule_flag_LEP  The Democratic Science Society Lights the Way"
 RULE_OPTION_LEP_PATH_DSP_DESC: "The Self-Government Comrades' Association is reorganised into the Democratic Science Society, which seeks to rebuild the state through expert government and gradual reform."
 RULE_OPTION_LEP_PATH_JGH: "£KR_game_rule_flag_LEP  The People's Salvation Association Brings the Wind of Change"
 RULE_OPTION_LEP_PATH_JGH_DESC: "The National Unity League is led by the People's Salvation Association, pressing progressive reform and social legislation that shift politics toward the cities and the working classes."
 RULE_OPTION_LEP_PATH_JXH: "£KR_game_rule_flag_LEP  The Jingxing Society Begins a Steady Rule"
 RULE_OPTION_LEP_PATH_JXH_DESC: "The National Unity League is led by the Jingxing Society, which takes order, stability and traditional values as its principles and demands a strong central authority."
 RULE_OPTION_LEP_PATH_JNSB: "£KR_game_rule_flag_LEP  The Industrial-Commercial Progressives Take the Majority"
 RULE_OPTION_LEP_PATH_JNSB_DESC: "The Jiangnan merchant guilds are reorganised into the Industrial-Commercial Progressive Party; national capital and the banks become the backbone of the government, and industry becomes state policy."
 RULE_OPTION_LEP_PATH_ZXX: "£KR_game_rule_flag_LEP  The Kuomintang Carries the Torch"
 RULE_OPTION_LEP_PATH_ZXX_DESC: "The Political Science Clique is reorganised into the Kuomintang, inheriting the parliamentary tradition of the Beiyang National Assembly and taking parliamentary politics and constitutional rule as its programme."

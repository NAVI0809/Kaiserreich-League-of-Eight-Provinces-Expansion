 market_liberal_oligarchic_liberalism_subtype: "Oligarchic Liberalism"
 market_liberal_oligarchic_liberalism_subtype_desc: "§YOligarchic Liberalism§!\n\n§L“Your representative owes you, not his industry only, but his judgment.”\n— Edmund Burke§!\n\n§!§gOligarchic liberalism does not deny the value of parliaments, courts or a free press, but it has never believed such institutions can run themselves. A state only just emerged from empire and warlordism, it argues, has neither a settled middle class nor a public opinion worth leaning on; the work of reconstruction must fall to the few who are educated, powerful and personally acquainted — a close circle of officers, industrialists and scholar-officials. Parliament and elections are to be kept, on the understanding that those elected may act on their own judgment rather than at their constituents' bidding; the real decisions are made in closed rooms, while the open procedures lend them a respectable seal. Property and free trade are to be protected, while unions and street politics are not to be allowed to grow. It is therefore mocked as a liberalism of the rich, and its answer is that order comes before participation and results before procedure.§!"
 social_liberal_liberal_technocracy_subtype: "Liberal Technocracy"
 social_liberal_liberal_technocracy_subtype_desc: "§YLiberal Technocracy§!\n\n§L“To know in order to foresee, to foresee in order to act.”\n— Auguste Comte§!\n\n§!§gLiberal technocracy springs from an almost innocent conviction: that the ailments of a nation are technical, and can therefore be cured by technical means. It would put engineers, statisticians, jurists and physicians trained in modern learning into the seats of power, replacing slogans and mobilisation with surveys, statistics and pilot programmes, and the clash of ideologies with budgets and blueprints. Government, on this view, should run like a well-ordered factory — clear rules, defined duties, promotion by merit. It is willing to let the people vote, but prefers to let experts govern; it is not hostile to democracy, only certain that democracy must be calibrated by professional knowledge. Critics say it reduces politics to administration. It does not deny the charge, and counts it a virtue.§!"
 social_conservative_free_market_conservatism_subtype: "Free-Market Conservatism"
 social_conservative_free_market_conservatism_subtype_desc: "§YFree-Market Conservatism§!\n\n§L“Better to learn commercial warfare than to learn the warfare of arms.”\n— Zheng Guanying§!\n\n§!§gFree-market conservatism is the political self-awareness of the native industrialist. It holds that a nation's standing is ultimately weighed in factory chimneys and bank ledgers, and therefore demands lower taxes, a stable currency and protective tariffs, so that private capital may have room to breathe and to grow. It regards nationalisation and central planning with instinctive hostility, and treats strikes and radical labour agitation no better — both, in its view, frighten off capital and ruin an industry barely begun. In social custom it is backward-looking, favouring family discipline, the gentry and the established order of rank; in politics it seeks not to remake society, but only to be left undisturbed in its business. It is not much loved, yet it is often the first part of a broken country to recover.§!"
 LEP_scientific_public_administration_tt: "§lWe will turn to the §lLiberal Technocracy§! ideology§!"
